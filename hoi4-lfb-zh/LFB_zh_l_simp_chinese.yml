 dongjiangjieshao_text: "东疆是联通中原的门户，自清朝时，此地便杂居了大量的汉民，回民与维族。\n\n近代战争引发的流民极大地冲击了此处，令本就拮据的基础设施不堪重负。因人地矛盾的尖锐，新疆局得以在革命前就于此地扎下根来，革命与反动势力势均力敌，令此地成为土改最先取得突破的地方。"
