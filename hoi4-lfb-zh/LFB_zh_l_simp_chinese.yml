 COX_MEN_logistics_support_avaliable_tt: "这一决议还未执行过五次"
 COX_MEN_logistics_support_tt: "蒙人阵§Y做出准备的速率§!将会提升"
 COX_MEN_military_support: "军事支援"
 COX_MEN_military_support_avaliable_tt: "这一决议还未执行过五次"
 COX_MEN_military_support_tt: "蒙人阵的§Y准备§!将会提升"
 COX_MEN_start_revolution: "时机已到！"
 COX_MEN_start_revolution_effect_tt: "蒙古人民将会向日本人的走狗发起反抗！"
 COX_MEN_start_revolution_trigger_tt: "蒙人阵已经对革命做出了§Y像样的准备§!"
 COX_mil_collect_the_militia_button_tt: "革命的胜利果实若没有武装力量的保卫，便会在风雨催折下迅速凋零。因此，将一部分被发动起来参与革命的群众武装为民兵赤卫队不仅可能，而且必要。新组建的民兵将会替代已经化整为零下乡工作的红军承担起维持地方稳定与打击敌对武装的职能。\n\n§W这将允许我们在当地民众支持度达到§!§Y50%§!§W的情况下组织起民兵武装。一个地区所能征募的民兵数量受到总人口数限制，§!§Y因此不能无限制地征召。§!\n\n§Y小提示：同时按下鼠标左键+Shift键点击时，可以一键为全疆支持度足够高的地区征召民兵！征召冷却期为30天。§!\n\n[Is_COX_Training_The_Militia_completed][Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_the_mil_sup_reached][Is_COX_mil_collect_the_militia_completed_or_cooldown][Is_the_mil_fs_enthough]"
