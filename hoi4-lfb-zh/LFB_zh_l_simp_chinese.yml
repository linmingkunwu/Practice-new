 COX_Normalization_Of_Work_Style_Rectification: "作风整顿常态化"
 COX_Normalization_Of_Work_Style_Rectification_desc: "打铁还需自身硬。一个共产党，一支先锋队，要想要为人民谋平等与解放，就需要不断地进行自我反省与自我净化。自从根据地建立以来，党的党员规模迅速扩张，但在新鲜血液中不可避免地存在路线跑偏者、思想歪曲者、作风不端者，运动式的整风运动难以长久地确保党在思想与作风上的双重纯洁性，需要我们持之以恒地对党员进行教育、让群众监督党员的作风。当然，各级领导干部们——包括毛岸英同志本人在内，都要为党员们做出表率，主动接受全体人民的监督，虚心接受建议和批评。"
 COX_north_sik: "西伯利亚哨探"
 COX_north_sik_desc: "基于哨所与巡逻队，北疆得以从西伯利亚的混乱中保护自身的安全，但至关重要的是英勇的西伯利亚哨探，他们轻装简行，深入危机四伏的原野。他们带来的情报，是维持防线最重要的依仗。"
 COX_Northwest_Economic_Model: "西北经济模式"
 COX_Northwest_Economic_Model_desc: "西北经济模式"
 COX_Not_Passed: "虚席议政"
 COX_Not_Passed_desc: "国民大会的召开从来都座无虚席。\n\n没有具体规定要求议员们按照何种方式落座，但是每一次开会却总能发现——不同党团的代表们往往各自聚拢，泾渭分明，像隔着一道天堑。所有人都在这里，一个都不少。\n\n然而，最重要的那个席位，却是空的。\n\n那不是一个实体上的空缺，而是一个精神上的黑洞。它盘踞在议会大厅每个人的脑海里。它代表着一个致命的问题：我们究竟在建设一个什么样的国家？\n\n议政开始了。他们讨论税率，讨论路权，讨论教科书的修订。每个议题的措辞都要经过反复修改，日常的政务往往在唇枪舌剑中举步维艰，才能勉强通过。\n\n这是一个完整的政府，它拥有所有必需的部门和人员。但这也是一个残缺的政府，它仍然缺乏共同的灵魂。"
 COX_NSPC_party: "民盟 - 国家社会党"
 COX_NSPC_party_long: "民盟 - 中国国家社会党"
 COX_Occupy_Nanjing: "高宗武已死"
 COX_occupy_Xian: "进军西安"
 COX_occupy_Xian_effect_tt: "我们将得以彻底确保对陕西的控制权！\n§R陕西的解放势必会引起日军的注意，我们将会正式卷入与日本的冲突！§!\n§Y在选择此决议前，请确保我们已经做好了万全准备。§!"
 COX_occupy_Xian_trigger_tt: "红军对陕西的占领程度达到§G100§!"
 COX_occupying_Shaanxi: "红军解放陕西中"
 COX_occupying_Shaanxi_effect_tt: "陕西的局势发生变化！"
 COX_Officialization_Of_The_National_Language: "民族语言官方化"
 COX_Officialization_Of_The_National_Language_desc: "我们党的苏维埃政府是中国的革命政府，这毫无疑问。但我们也要认识到，我们赖以立足的土地自古就是众多民族的故乡，作为中华民族大家庭的成员，他们的历史、文化、语言必须得到尊重。除了在扫盲工作中推广通用的汉语，新疆的所有民族语言都将被立法保护。孩子们可以在学校里同时学习本民族的语言和汉语，政府的公文将一份双语。如果情况允许，党也将支持民间知识分子对民族文化遗产的整理与保护。"
 COX_Old_Soldiers_Of_Guerrilla_Warfare: "游击队的老战士们"
 COX_Old_Soldiers_Of_Guerrilla_Warfare_desc: "在盛世才时期，新疆地区就流传着巩哈游击队的事迹。这支队伍由俄国侨民帕提赫·莫斯里莫夫于1946年成立，一度驱逐了新疆军阀，但随后被盛世才打败，莫斯里莫夫也在战斗中牺牲，此后便一直在新疆境内从事着反对军阀残暴统治的游击活动。蒙古人民阵线与蒙疆开战前夕，新领袖阿巴索夫带领队伍前往乌兰巴托，帮助阵线对抗共荣圈的入侵，但随着战事失败、退路切断，巩哈游击队只能逗留在蒙疆境内，向着新疆且战且退。如今，曾经荼毒新疆的军阀势力已经被我们打扫干净，争取巩哈游击队与苏维埃的合作被提上日程。工作组已经出发前往蒙疆与阿巴索夫接洽，一旦交涉取得成功，我们将派出部队前往边境接应游击队，让漂泊的游子回到故乡。"
 COX_Old_Tunes_With_New_Twists: "老歌新唱"
 COX_Old_Tunes_With_New_Twists_desc: "上一次抗战，教会了我们一个伟大的道理——音乐可以激励灵魂，塑造一个民族，乃至左右战争的走向。\n\n在拼死战斗的间隙，中华民族优秀的儿女们谱写了无数或激昂或悲怆的乐章，其中一首，更是在抗战时传遍全国，即便在伪国民政府的统治下遭到封禁，却能以朗朗上口的曲调传唱于田间地头，以血与泪的控诉，渗进每个中国人的心田——\n\n§e《抗日人民义勇军进行曲》§!\n\n如今，中华民族再一次到了最危险的时候，每一个不愿意做奴隶的人们，再一次唱起这首老歌。\n\n伴着狱中的月光，迎着初升的曙光；在战壕的泥泞中低吟，在胜利的欢庆中高歌……我们战斗，我们歌唱，我们必将赢得胜利！"
 COX_Once_And_For_All: "毕其功于一役"
 COX_Open_Up_The_Central_Asia_Market: "打开中亚市场"
 COX_Open_Up_The_Central_Asia_Market_desc: "打开中亚市场"
 COX_opposite: "各执一词的联合"
 COX_opposite_desc: "两党和谈的基础，是基于尊重与承认孙中山先生的革命成果之上的。\n\n不过，两党各自对三民主义的见地与阐述，§Y显然是相去甚远的……§"
 COX_Organizational_democratization: "组织民主化"
 COX_Organize_large_scale_military_training: "组织大练兵"
 COX_Our_Troop_Towards_The_Sun: "我们的队伍向太阳"
 COX_Our_Troop_Towards_The_Sun_desc: "在敌众我寡，补给缺乏的情况下，革命还是取得了胜利。随着迪化城的解放，盛世才在新疆的统治已经土崩瓦解。我们的队伍走过了漫长的路途，击败了内外帝国主义的走狗，终于在新疆扎下了根。\n从今往后，新成立的苏维埃政府将会领导中国人民进行建设，直至战胜一切帝国主义！"
 COX_People_Political_Consultative_Conference_of_Xinjiang: "新疆人民政治协商会议"
 COX_People_Political_Consultative_Conference_of_Xinjiang_desc: "随着政治上的努力开花结果，正式邀请全疆各界爱国民主人士前来乌鲁木齐共商国是的时机已经到来。党领导下的新疆人民政协将通过政协的共同纲领、选举产生正式的苏维埃政府，并承担立法与监督的职责。行政体制的完善也将在人民政协的协助与监督下推进。新疆人民政协的成立标志着解放区政权的真正巩固，也意味着我们在至暗的中华大地的边疆高举起了解放的火炬。"
 COX_Peoples_Army_desc: "光荣的八一军旗记载着毛泽东、周恩来、朱德等老一辈无产阶级革命家的丰功伟绩；战斗的八一军旗，我们永远高举起您、护卫着您!"
 COX_persuing_GAN_remenants: "追击西北军残部"
 COX_persuing_GAN_remenants_tt: "红军力量增加§G20§!"
 COX_Pilot_Cultural_Collectivization: "农业集体化试点"
 COX_Pilot_Cultural_Collectivization_desc: "无论何时，粮食总是最重要的东西。但我们现有的粮食虽然比以往要多得多，却仍只能勉强保证温饱。因此，根据五年计划的需要，我们决定尝试将民众的农用土地归为一体，然后再由农民集体耕种：一方面，这能让我们更方便的知晓某一片土地出现了何种问题，而应对起来也不再繁琐。另一方面，将私有土地收归公有也能在某种程度上打击仍存在的封建势力。好处多多，但我们仍需要在部分地区率先进行集体化的实验，然后记录或推算出可能出现的问题，这样才能为日后更深刻的农业改革留下宝贵且真实的经验。"
 COX_Popularize_guerrilla_warfare_and_carry_forward_mobile_warfare: "普及游击战，发扬运动战"
 COX_Popularize_The_Karez: "普及坎儿井"
 COX_Popularize_The_Karez_desc: "自数百年前，坎儿井就在新疆地区被广泛采用。这种灌溉技术实际上是一种在地下的暗渠，将地层中的地下水或季节性冰川雪水引入输水渠，再流入明渠中用以灌溉。坎儿井的好处虽然很多，但是它毕竟是一项大工程，无论是寻找含水地层还是开挖数百米长的地下渠道都不是普通农业生产者能够负担的，如果一个农业村不能就是否开掘暗渠取得一致意见或是人手不足，坎儿井就无法开掘。现在，苏维埃将为她的人民解决这个问题，我们的工作队将带领着当地百姓，在充足的资金支持下在全疆开展坎儿井的挖掘。"
 COX_Popularize_The_Karez_tt: "§GActivate§! feature: §Y【Construct Karez】§!"
 COX_PRC: "中华人民共和国"
 COX_PRC_ADJ: "中国"
 COX_PRC_DEF: "中华人民共和国"
 COX_PRC_tt: "我们取得了胜利，而现在，摆在我们面前的是§R伤痕累累的祖国§!。"
 COX_PRC_tugai_GUI_jiaobiao1_tt: "这里是§x乌鲁木齐§!，£GFX_COX_lr_urumqi_and_revolution_goverment §x新疆革命根据地§!的中央，§C中国革命§!的心脏！"
 COX_PRC_tugai_GUI_jiaobiao2_tt: "£gezifu \n\n £GFX_COX_lr_taklamakan \n\n\n\n§W它的维语直译名——§!§e“进去便出不来”§!§F——是这片死亡之海最直白的言说。§!§s或许有朝一日，一个强盛的§!§x国家§!§s可以征服此处§!，§b但此刻，人世间的声音并不能穿透§!§o风沙§!§b的萧瑟……§!"
 COX_PRC_tugai_GUI_jindutishi2_tt: "£GFX_COX_lr_members §x民兵§!是根据地中央掌控的核心力量，是政权存续的根基。唯有一支强大的民兵武装，才能确保§Y最激进的政策§!的推行。民兵是从那些党建立了存在的地区征调来的，最好确保§Y在中央维持一定规模的民兵部队§!，以应对£GFX_COX_lr_reactionaries §r反动派§!可能的反扑。\n\n£GFX_COX_lr_infrastructure §G农业基础设施§!是各地水利设施，农具与牲畜之类的生产资料的总称。土改意味着这些§Y生产资料所有权的再分配§!，不可避免会扰乱生产秩序，甚至§V破坏一些地区本就脆弱的基础设施§!——进而导致潜在的农业减产，§e损害各阶层对土改的信心§!。£GFX_COX_lr_work_group 土地革命工作组将评估每个地区的§G“目标基础设施”§!，我们的目标便是§Y使尽可能多的地区§!达到这个§G数值§!，赢得人民对新政权的支持。\n\n£GFX_COX_lr_work_group §P农民§!与£GFX_COX_lr_landlord §r地主士绅§!两个阶级之间的矛盾向来复杂而尖锐。£GFX_COX_lr_work_group §P农民§!是我们§Y政权的核心§!，他们对我们的支持§y将是任何改革推行的前提§!；但随着改革触及根本矛盾，新疆真正的掌权者们——各地的£GFX_COX_lr_landlord §r地主阿訇§!也将团结一致，进行越来越激烈的§r抵抗§!甚至§r破坏行动§!。§Y改革注定不可能让所有人满意§!，重要的是确定§P方§!§r向§!，然后§Y贯彻到底§!。"
 COX_PRC_tugai_GUI_tishi_tt: "§G土地革命§!\n--------------\n\n\n£GFX_PRC_lr_texticon \n\n\n\n\n§X“伫看玉宇澄清日，歌啸熏风放百花。”§!\n\n§x乌鲁木齐§!一声炮响，£GFX_COX_lr_sheng_six_policies §O盛世才伪政权§!轰然倒塌，但革命者所面对的并非花团锦簇的康庄大道，相反，推翻£GFX_COX_lr_sheng_six_policies §O盛世才§!的统治只不过是革命最微不足道的一步，§x新生的政权§!面临着严峻的内外挑战。§m工商业§!停滞，§G农业设施§!崩坏，更有£GFX_COX_lr_reactionaries §&反动派§!在暗中积蓄力量，阻挠着任何形式的统治延展至乌鲁木齐之外。若想继续存续，新政权必须发动一场深刻的运动，通过§V无畏的攻势§!，确保§C革命的果实§!可以茁壮成长。\n\n乌鲁木齐等大型城镇在£GFX_COX_lr_sheng_six_policies §O\"六大政策\"§!的余烬中面临着严重的粮食短缺与生产秩序崩坏。新上任的£GFX_COX_lr_mcc §m物资调配处§!必须马上投入到重整经济结构的工作中去，恢复当地§Y正常的生产生活与经济交流§!。另外，乌鲁木齐的改革成功与否都将关系着苏区在后续的斗争中所拥有的物资储备与工业基础。§x万里长征§!的第一步走得稳健，后面才能更加从容不迫。\n\n广大的乡村地区正在几座大山间苦苦挣扎，作为土地革命斗争的前线，下乡干部们必须§V夺取生产资料§!，§G重建农业生产§!，§R动员无产阶级力量§!乃至于消灭张牙舞爪的的£GFX_COX_lr_landlord §r地主阶级§!。然而，由于发展水平，民族构成£GFX_COX_lr_religious_beliefs §&宗教信仰§!间的参差，土地革命的方针并非简单可以复制，我们必须审时度势，因地制宜采取不同的行动，一味§Y退缩或冒进§! 都将§e葬送革命。§!\n\n§G在国家的至暗时刻，我们更要看到成绩，看到光明，鼓起勇气，争取胜利！§!"
 COX_PRC_tugai_GUI_tugaiweijieshao_tt: "面对§Y截然不同§!的§G城乡形式§!，£GFX_COX_lr_urumqi_and_revolution_goverment §x革命政府§!成立了§P\"新疆苏维埃临时物资调配处\"§!与£GFX_COX_lr_work_group §C\"新疆苏维埃土地革命工作组\"§!，分别负责§G乌鲁木齐周边§!与§B新疆§!的其余地方。虽然关键的§m政策§!仍将交于集体决策，但在执行层面仍要仰赖§R£GFX_COX_lr_members \"委员\"§!的全权调配。由于§x自身革命经历§!与§W理论偏好§!的不同，每个§R£GFX_COX_lr_members §R委员§!都有§x独特的行事风格§!与§W优势§!。"
 COX_PRC_tugai_unlock_decisions: "§G将解锁下一组决议...§!"
 COX_PRC_tugai_urumqi_take_over_a_mess_tt: "\n现在，乌鲁木齐地区的支持度，不满度，城乡基础设施状况将可见。"
 COX_preliminary_preparations: "初步备战"
 COX_preliminary_preparations_desc: "余粮被强行征走，工厂在战火阴影下拆迁，高强度的劳作与对战争的恐惧在基层蔓延，不可避免地引发了局部的动荡与骚乱。但工作已经完成，纵使内部压力重重，但全面戒备的框架已经搭建完毕。"
 COX_Preparing_for_night_school_for_workers: "筹备工人夜校"
 COX_Production_And_Construction_Corps: "筹备建设兵团"
 COX_Production_And_Construction_Corps_desc: "目前我们的专门负责建设的工人同志队伍数量还不够庞大，连修整道路也显得困难。幸而在我们的部队中则有不少优秀的工兵同志，我们的战士们也拥有良好的纪律性，因此，向基层部队分配建设任务用以帮助根据地建设不但是可行的，同时也是很有必要的。"
 COX_progressivism_party: "中国民主同盟"
 COX_progressivism_party_long: "中国民主同盟"
 COX_Promote_Anti_Japanese_Imperialism_Propaganda: "抗日宣传"
 COX_Promote_Anti_Japanese_Imperialism_Propaganda_desc: "中国丰腴的物产孕育了四万万同胞，但广阔的祖国大地却令人们彼此区隔。如今的祖国正命悬一线，在华北的敌占区，甚至西北诸多闭塞的村庄中，人民仍浸透在战后二十年间那令人窒息的麻木之中，不知其他同胞正在拼死捍卫的事业。就让我们的传单代替日军的刺刀，先行打破那里的宁静吧！\n\n召集宣传人员，开动印刷机，我们必须要让哪怕最闭塞的村落中最不知外事的人了解到，中国正在命运的十字路口。没有宣传战线的胜利，抗战的胜利只不过是无稽之谈。"
 COX_Promote_Collectivization: "推广集体化"
 COX_Promote_Collectivization_desc: "推广集体化"
 COX_Promote_literacy: "推广扫盲"
 COX_Promote_Locomobile_Tractors: "推广锅驼式拖拉机"
 COX_Promote_Locomobile_Tractors_desc: "农业机械化离不开拖拉机来扩大农业生产规模。但以新疆目前的实际情况来看，单个农民根本不可能消费的起一个拖拉机，个人也没有足够的田地供拖拉机大展神威。拖拉机最好发挥作用的场所还是大型农场。而新疆目前大部分地区刚刚完成了土地革命，农民们才拿到自己的土地没多久，想在新疆找到连成一片的大型农村又太过困难。\n幸运的是，一些我们较早完成土地革命的地区和绿洲农场在农社的鼓励下已经开始初步的创办了合作社，我们可以在这些地区推广拖拉机，以提高我们的农业生产水平。"
 COX_Propaganda_Against_Enemies: "向敌人军队作宣传"
 COX_Propaganda_Against_Enemies_desc: "盛世才的队伍中，有不少是逃亡新疆的国民革命军溃兵。盛世才用有朝一日会重返中原的口头承诺换得了这些战士们的忠诚。然而，年复一年，新疆军政府并没有更加接近内地，而是越来越趋于孤悬塞外，回到故乡的时机好像永远都不会到来了。遭到辜负的不满情绪与流放般的生活使得士兵们的耐心持续地消磨，我们可以利用这种情绪避免与他们发生大规模交火，并争取他们的投诚，从而给迪化当局施以沉重一击。"
 COX_Protect_The_Results: "保卫改革成果"
 COX_Protect_The_Results_desc: "必须承认，南疆地区政治生态的恶劣程度远远超出了我们的想象。农奴地主群体在盛世才走向失败时果断地抛弃了他并举起了反旗，这使得南疆地区的反动势力仍然保存了相当的能量——这是他们在改朝换代时一贯的自保伎俩。目前，苏维埃和他们仍然保持着耐人寻味的和平，但是随着土地革命的进一步开展，这种状态注定是不能够久持的。\n\n寄希望于农奴地主自行交出土地无益于痴人说梦，而当这些地主手中握有私人武装时，情况就更加凶险。为了在可能的反扑中保卫已有的改革成果，我们必须尽快行动起来。"
 COX_Provisional_Peoples_Goverment: "临时人民政府"
 COX_Provisional_Peoples_Goverment_desc: "§Y“红星照耀中国”§!\n--------------\n内战的爆发令两党都猝不及防，但不同于内部派系林立、且有悠久内斗传统的国民党，在谈判无望之时，西南党中央已经提前转移到了乌鲁木齐。一次党代会已经召开，一次选举已经举行，一份决议已经做出。虽然党的力量离散多年，彼此间很难说没有什么嫌隙，但这个奉行民主集中制的政党还是最大限度地开动了自己的政治机器，将疲惫不堪的西北红军与护国军编制内的武装整编在一起，及时地维系了解放区的稳定的同时，又竭尽全力地拉拢诸民主党派，试图令它的对手在舆论上陷入孤立。\n\n这一切措施的结果，便是屹立于中国北方的“临时人民政府”。由“全国政治协商大会”赋权，“临时执行委员会”执掌着最高权柄。不可否认，它的存在代表着中国共产党放弃了一切和平协商的企图，全力准备用武力将自己的愿景推广至全国。\n\n待到内战的硝烟消逝之时，或许这个临时机构将成为未来社会主义中国的根基……"
 COX_Public_Trial_Of_Traitorous_Government: "公审汉奸政府"
 COX_Public_Trial_Of_Traitorous_Government_desc: "陈公博，王克敏，李士群……这一串全的大汉奸的名单在北平城里贴的到处都是。虽然所有人都被这群汉奸气的牙痒痒，许多人甚至建议取消公审，直接判处死刑。但我们仍要坚持公审。这不是对所谓“程序正义”的追求，而是为了通过审判让人民看清这些人的真实嘴脸。让人民对这些狗仗人势，靠出卖同胞利益逍遥快活的人渣做出真正公正的判决。"
 COX_Public_Water: "公营水利"
 COX_Public_Water_desc: "新疆的每个乡镇都组织有专门的水利人员，负责供水设施的维护，以及——在缺水的地方——负责水源的分配。但统治者和地主阶级的合谋把持了这些职位，他们为了向农民索要好处，随意克扣农民用水，农民得不到足够的水浇地，甚至连生存都成为了问题，不得不越来越深的依附于地主阶级。\n\n正因如此，新疆荒废的土地越来越多，人民始终笼罩在饥荒的阴影之下。水利设施的修建不是一朝一夕的事，我们可以先用在村庄中有一定威信的，公平公正的水利人员替换这些贪官污吏，按照土地种类，土地多少来分配水源，合理化的利用现有的水利设施。"
 COX_Public_Water_tt: "§GActivate§! feature: §Y【Public Water Management】§!"
 COX_Qinghai_emergency_Load_Focus_Tree: "解锁§R西北危机§!国策树"
 COX_Raise_Two_Flags: "双旗共举"
 COX_Raise_Two_Flags_desc: "平原之上，残阳映照焦土，南京城内，新生的共和国正踉跄前行。战火熄灭，硝烟散去，国共双方在废墟之上握手言和，一个崭新的国家宣告诞生。然而，分歧从未消弭，权力的较量仍在继续。\n\n意识形态南辕北辙，经济政策水火难容，最尖锐的问题仍旧横亘在谈判桌上——军权如何划分？各自为政的武装部队依旧在原属领土上驻扎，彼此对峙，拒绝交出指挥权。南京议会厅内，辩论无休无止，谈判桌外，火药味愈发浓烈。军队对峙，行政权分裂，政府运作举步维艰，整个国家在动荡边缘徘徊。\n\n统一，是唯一的出路。但现有的政局，注定不会有轻松的抉择。整合军队，重塑权力架构，建立统一的国家体系，每一步都充满阻力，每一个决定都可能引发新的裂痕。双头旗飘扬之下，国家的未来仍笼罩在迷雾之中，前方的道路，充满未知与风险。"
 COX_Rebuild_Grass_roots_Organizations: "重建基层"
 COX_Rebuild_Grass_roots_Organizations_desc: "抗日烽火、内战纷争，以及漫长的岁月流转，像锋利的刀刃般划破了这片土地的每一寸肌理。抗日战争的浴血奋战、中国内战的腥风血雨，再加上1945年那沉痛的失败，早已将我们曾辛苦建立的基层组织撕裂得支离破碎。村庄、城镇、乡里，那些原本紧密相连的红色网络，在连年的战火下化作灰烬，群众与政权之间的桥梁被彻底摧毁。然而，时局已变。日寇被逐，失落的政权再次回到我们手中，这是重建的号角，更是涅槃的开始。如今，重建基层组织已刻不容缓。这不仅是为了推进土地改革、经济复苏和社会重塑，更是为了让党的声音再次传遍每一个角落，直达田间地头。我们将重新在每个村庄、每个街区乃至每个工厂中建立党支部，吸纳可靠的党员干部，发动群众参与重建，确保每一条命令、每一项政策都能迅速传达并落地生根。基层，是人民政权的根基。没有坚实的基层组织，再伟大的蓝图也不过是空中楼阁。只有当党的旗帜在每一个村头飘扬，当人民的声音能直达权力的核心，我们的国家才能真正稳固、繁荣。让我们肩负起这历史的责任，重塑基层的血脉，再次让这片土地焕发生机与希望！"
 COX_Rebuild_In_Documents: "纸上重建"
 COX_Rebuild_In_Documents_desc: "联合政府的首要工作重点，是恢复遭受重创的国民经济。\n\n生产倒退、交通破坏、金融崩溃……财政经济委员会每一天的报告都堆积成山。得益于先前的经济统合工作，国家得以以统一的名义对重建项目进行规划协调，从发电厂的选址到铁轨公路的修缮，一份份政府公报都力图向人民宣告一切都在有条不紊地进行。单从纸面上看，重建工作似乎正在迅速推进。\n\n在千里之外的武汉，工地上却一片死寂。枕木没有运到，因为邻省还在为钢轨的规格争吵；钢筋还堆在港口，因为没人决定该使用苏式标准还是美式标准；这只是一个缩影，类似的情况在全国层出不穷。\n\n中国的复兴，注定要在这样的磕磕绊绊中，走过一段远比预想漫长的道路。"
 COX_rebuild_Lanzhou_industrial_zone: "重建兰州工业区"
 COX_rebuild_Lanzhou_industry: "重建兰州工业"
 COX_rebuild_Lanzhou_industry_tt: "这将增加我们对两地区的整合！"
 COX_Receive_Their_Inheritance: "接收遗产"
 COX_Receive_Their_Inheritance_desc: ""
 COX_red_Guards_tech_1_tt: "赤卫进攻能力上升了。"
 COX_Red_Joint_Military_Exercise: "红军联合演习"
 COX_Red_Joint_Military_Exercise_desc: "红军联合演习"
 COX_Redistribution_Of_The_Means_Of_Production: "生产资料再分配"
 COX_Redistribution_Of_The_Means_Of_Production_desc: "我们废除农奴制与减租降息的成果并不理想。许多农民得到了自己的土地，却缺乏必要的生产资料，甚至有些人连除草用的镰刀都没有，他们手中唯一的工具只有一把破旧的坎土镘。他们得到的土地也多是些难垦的戈壁，或是分散的几块小土地。长此以往，土地兼并的现象必然会发生，土地改革的全部成果将付之东流。为了巩固来之不易的解放，我们必须将富农，地主和清真寺掌握的工具，牲畜和土地一并分配给贫下中农们，只给过去的压迫者留下足够的部分，让他们能自食其力。"
 COX_Redistribution_Of_The_Means_Of_Production_tt: "§GActivate§! reform: §Y【Confiscate Private Land】【Labor Reform】【Nationalize Redundant Religious Sites】【Establish Religious Affairs Bureau】§!"
 COX_Refurbishment_of_old_equipment: "翻修旧有设备"
 COX_Rehabilitate_Agricultural_Economy: "复苏农业经济"
 COX_Rehabilitate_Agricultural_Economy_desc: "新疆的农业生产可能缺人、缺地，但最缺乏的还是水。为了解决灌溉问题，苏维埃付出了相当的努力，而我们所取得的成果显然是喜人的。由水利部门统一调拨的冰川雪水与广泛掘成的坎儿井一同组成了新的农业用水供给端，长期盘剥百姓、肆意贩卖水资源的水霸也在改革过程中被连根拔起，新疆一度严峻的灌溉问题已经得到了缓解。一度远走他乡的农民们正在回到曾因无水灌溉而被荒废的土地上，这意味着我们的农业人口与耕地面积都得到了增加，新疆农业经济的恢复已经是可以预见的了。"
 COX_reinforce_alt_defense: "加强警戒！"
 COX_reinforce_alt_defense_desc: "我们必须在我们控制的领地上开展持续性的巡逻，以防止敌人渗透到我们的领地，展开破坏行动，威胁人民的安全。"
 COX_Reinforce_The_Base: "开始巩固根据地"
 COX_Reinforce_The_Base_desc: "尽管我们已经基本确保了对新疆地区的控制，但新疆还远远称不上是一处革命根据地。有关基层农业生产以及农奴悲惨处境的报告雪花般飞向迪化，而剥削者仍然在地方耀武扬威，在他们看来，我们只不过是另一个盛世才式的政权，早晚要对他们低下头。就目前的种种情况看来，一场彻底的土地革命已经箭在弦上，清算地主、解放农奴的工作也势在必行了。\n\n如果一切顺利，在革命结束时，新疆将会成为我们事业的稳固后防。"
 COX_relation_army_old_ma: "联络马家残部"
 COX_relation_army_old_ma_tt: "这将降低我们在西北军渗透的衰减！"
 COX_reli_Cut_religious_taxes_button_tt: "[COX_reli_Cut_religious_taxes_button_tt_show]\n\n[Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_land_reform_ongoing][Is_COX_reli_Cut_religious_taxes_completed_or_cooldown][Is_COX_Lower_The_Rent_And_Fight_The_Local_Bully_completed]"
 COX_reli_Cut_religious_taxes_button_tt1: "通过滥设滥征宗教税，新疆的反动阿訇得以肆无忌惮地寄生劳动者。他们从这些可怜人已经经过地租克剥的少得可怜的剩余里，又榨取很大的一部分。许多老实虔诚的信徒在生存线上苦苦挣扎，但还是不敢少缴天课。鉴于这种客观情况的存在，骤然完全废除宗教税并不是最优的选择。我们将暂时用行政手段大幅度削减宗教税，以便在日后时机成熟时顺理成章地消灭这一剥削工具。\n\n§W这将§!§G小幅度提振§!§W我们的民众支持度，但极端宗教群体会§!§Y表示不满§!§W。§!\n\n§Y改革冷却期为30天！§!"
 COX_reli_Cut_religious_taxes_text: "[COX_reli_Cut_religious_taxes_text_name]"
 COX_reli_Cut_religious_taxes_text1: "削减宗教税"
 COX_reli_Disclosure_of_interest_relationship_button_tt: "[COX_reli_Disclosure_of_interest_relationship_button_tt_show]\n\n[Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_land_reform_ongoing][Is_COX_reli_Disclosure_of_interest_relationship_completed_or_cooldown][Is_COX_Abolish_The_Privilege_Of_Religion_completed][Is_COX_reli_Cut_religious_taxes_completed]"
 COX_reli_Disclosure_of_interest_relationship_button_tt1: "千百年来，农民被牢牢地束缚在他们的土地上；而地主、贵族、反动宗教势力却将他们蒙在鼓里，玩弄他们的信任。有时候，反动分子中的一小撮会装作支持农民、反对压迫，然而实际上，压迫者对被压迫者永远是铁板一块！我们要揭露他们之间的利益关系，让农民们意识到，没有奴隶主会为奴隶说话，奴隶要求自由的唯一办法就是打倒奴隶主！\n\n§W这将§!§G提振§!§W我们的民众支持度，但地主群体会§!§Y表示强烈不满§!§W。§!\n\n§Y改革冷却期为30天！§!"
 COX_reli_Disclosure_of_interest_relationship_text: "[COX_reli_Disclosure_of_interest_relationship_text_name]"
 COX_reli_Disclosure_of_interest_relationship_text1: "揭露利益关系"
 COX_reli_Establishment_of_the_Bureau_of_Religious_Affairs_button_tt: "[COX_reli_Establishment_of_the_Bureau_of_Religious_Affairs_button_tt_show]\n\n[Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_land_reform_ongoing][Is_COX_reli_Establishment_of_the_Bureau_of_Religious_Affairs_completed_or_cooldown][Is_COX_Redistribution_Of_The_Means_Of_Production_completed][Is_COX_reli_Public_redundant_religious_sites_socialization_completed][Is_lmam_res_high]"
 COX_reli_Establishment_of_the_Bureau_of_Religious_Affairs_button_tt1: "有些宗教人士认为，成立一个官方的宗教局是苏维埃与宗教势力的媾和，但事实绝不是如此。这个部门最初是为发动一部分在民间有影响力的进步宗教人士（如中农、下农的出身的基层宗教人士），使其参与到革命之中而成立的。这就意味着旧清真寺、佛寺、道观的财产还是要全部充公，地方的宗教地主也还是要被打倒。总而言之，我们的宗教局只是一个宗教事务委员会，一个派遣政工干部实现苏维埃对宗教的管理、并以此斗掉那些顽固、反动宗教分子的机构罢了。\n\n§W只有当极端宗教分子骚乱倾向降低至20%及以下时，才能执行此任务。执行后，该地区的极端宗教势力将§!§Y不会§!§W再掀起动乱。§!"
 COX_reli_Establishment_of_the_Bureau_of_Religious_Affairs_text: "[COX_reli_Establishment_of_the_Bureau_of_Religious_Affairs_text_name]"
 COX_reli_Establishment_of_the_Bureau_of_Religious_Affairs_text1: "建立宗教事务局"
 COX_reli_Fight_for_impoverished_Imam_button_tt: "[COX_reli_Fight_for_impoverished_Imam_button_tt_show]\n\n[Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_land_reform_ongoing][Is_COX_reli_Fight_for_impoverished_Imam_completed_or_cooldown][Is_COX_Abolish_The_Privilege_Of_Religion_completed][Is_COX_reli_Disclosure_of_interest_relationship_completed]"
 COX_reli_Fight_for_impoverished_Imam_button_tt1: "不可否认，许多宗教人员搜刮民脂民膏，还试图将压迫合理化。但是部分底层神职人员，也就是贫困的阿訇，也在被压迫者之列。农民们被剥削，他们也不能幸免：无休止的高利贷，土地被霸占……这些经历使得他们更接近被剥削者，而不是剥削者。另一方面，他们往往在村民之中有很大的威信——嫁娶、起名、讲经等，都是这些阿訇的工作。 如果能得到他们的支持，土改工作一定会顺利一些。\n\n§W这将§!§G提振§!§W我们的民众支持度，但极端宗教群体会§!§R表示极度不满§!§W！§!\n\n§Y改革冷却期为30天！§!"
 COX_reli_Fight_for_impoverished_Imam_text: "[COX_reli_Fight_for_impoverished_Imam_text_name]"
 COX_reli_Fight_for_impoverished_Imam_text1: "争取贫困阿訇"
 COX_reli_Public_redundant_religious_sites_socialization_button_tt: "[COX_reli_Public_redundant_religious_sites_socialization_button_tt_show]\n\n[Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_land_reform_ongoing][Is_COX_reli_Public_redundant_religious_sites_socialization_completed_or_cooldown][Is_COX_Redistribution_Of_The_Means_Of_Production_completed][Is_COX_reli_Disclosure_of_interest_relationship_completed]"
 COX_reli_Public_redundant_religious_sites_socialization_button_tt1: "在新疆全境，分布着大大小小的清真寺，其数量多如牛毛。在只有数百人定居的小地方，都有可能发现一座装饰华美的清真寺。而它们除了充当当地伯克炫耀财力的资本以外，对一般信众毫无意义。我们会将这些冗余的宗教场所改造为对人民有利的公共活动空间。\n\n§W这将§!§G大大提振§!§W我们的民众支持度，但极端宗教群体会§!§x表示恼怒§!§W！§!\n\n§Y改革冷却期为30天！§!"
 COX_reli_Public_redundant_religious_sites_socialization_text: "[COX_reli_Public_redundant_religious_sites_socialization_text_name]"
 COX_reli_Public_redundant_religious_sites_socialization_text1: "公有化冗余宗教场所"
 COX_Remove_Religious_Reactionary_Elements: "宗教去反动化"
 COX_Remove_Religious_Reactionary_Elements_desc: "传统共产主义理论认为：宗教是人民的鸦片。此话不错。在中国数千年的历史中，宗教往往是统治阶级麻痹人民的麻药与掩盖血淋淋剥削的神圣遮羞布。但宗教的存在有其历史必然性与合理性，也不会因为党的一道命令从全体人民的脑海中消失。让宗教不再成为反动势力的刺刀，在土改中我们已经做出了卓越的成果。现在我们要做的是以劳动人民的名义正式画下规范宗教组织行为的准绳，完成新疆宗教组织从统治阶级的压迫工具到劳动人民互助互惠的爱国组织的转变，并且贯彻政教分离的原则。要完全做到这一点路还很长，但我们有信心和能力做到。"
 COX_Renew_The_Old_Facilities: "统合旧有设施"
 COX_Renew_The_Old_Facilities_desc: "坐落于迪化的各项重工业设施是盛世才反动统治时期留下的双刃遗产。虽然正是这位朝秦暮楚的军阀利用苏联的血汗与尸骨搭建了新疆最初的工业骨架，为北疆的现代化打下了基础，但这些由强迫劳役与军阀垄断堆砌起来的烟囱，沦为效率低下、设备锈蚀的工业废墟。\n\n随着苏区在新疆站稳脚跟，如何处置这些旧时代的残渣已成当务之急。厂区内部根深蒂固的军阀残余势力、投机倒把的黑市商人，正与那些效率低下的地方火力发电厂勾结，严重拖累了苏区的工业化复兴进程。我们绝不能容忍这些灰色地带继续蚕食宝贵的战略资源——对盛氏工业的彻底翻新与对周边电网的强行收归国有必须立即执行，快刀斩乱麻地清除所有不稳定性，确保苏区的红旗获得源源不断的钢铁与电力支撑。"
 COX_Reorganize_army: "整编军队"
 COX_Reorganize_army_tt: "这将增加我们对两地区的整合！"
 COX_Reorganize_Red_Army: "整编红军"
 COX_Reorganize_Red_Army_desc: "红军和党与中国人民在这几十年间经历了同样的颠沛流离，四散部队与游击队已经数不胜数。而在新疆革命根据地建立后以及后来的大东亚战争间，不断收拢的部队与新编入的新部队也使得本就脆弱红军的组织架构更加不堪。而同时，中央也接到了不少有关离散红军组织与游击队习气恶化思想脱线的报告。鉴于这些年的斗争形势，我们不能责怪他们太多，可我们同样也不能够容忍这样的风气继续存在。借着新中国建立后大破大立的浪潮，党中央已经决心对红军上下进行一次总的整顿与整编，将红军上下的体系架构总的梳理一遍，以使身经百战的红军焕发新的战斗力。"
 COX_reorganize_red_guards: "整编赤卫队"
 COX_reorganize_red_guards_desc: "兰州之战的惨烈超乎想象，败退下来的赤卫队几乎失去了原有的编制：建制被打散、基层政工干部严重缺失、伤员满营。但他们是经历过熔炉考验的火种。现在不是哀悼的时候，我们必须打破原有的番号，将这些疲惫但满腔仇恨的战士重新编组，补充武器，让他们再次成为前线最坚硬的骨骼。"
 COX_Restart_The_Mobile_Warfare_Training: "展望未来"
 COX_Restart_The_Mobile_Warfare_Training_desc: "我们必须意识到，战争的形式比我们当年在井冈山进行游击时有了很大变化。二十年间，帝国主义者之间的冷战使得武器装备的性能突飞猛进，以此带来了战术上的彻底变革。虽然艰难，但革命的军队也必须学习这些战术，不断更新自己的军备，最终适应现代战争的变化。\n尽管现在的红军仍是一支由民兵与旧军队改编而来的，缺乏训练的军队，但我们的指挥员也应当从过去半个世纪的冲突中学习经验，因地制宜的发展适合当前形势的战争策略。"
 COX_Rise_Up: "起来，不愿做奴隶的人们！"
 COX_Road_Back_Home: "归乡之路"
 COX_Road_Back_Home_desc: "从阿尔汉格尔斯克的冰天雪地，到秋明轰鸣的地下都市，再到黑军控制下的炊烟村落，最终抵达贝加尔湖畔，中国旅的指战员们不远万里穿越俄罗斯的皑皑雪原，只为寻找一次将红星带回故乡的机会。西俄战争的苦涩回忆没能消磨革命的热情，而布里亚特和人民革命委员会的相继胜利又鼓舞了战士们的勇气，一路上的所见所闻更让我们坚定了自己的决心：一定要让人民得到彻底的解放。\n\n现在，回到故土的机会突然出现在了我们眼前——盛世才和摇摇欲坠的军政府根本无力抵抗红军的攻势，将阿勒泰地区拱手让出，他腐朽的统治已然进入了倒计时。我们一定要牢牢把握这次机会，走好归乡的第一步，将红旗插遍新疆！"
