 COX_Xinjiang_Industry_Rehabilitation: "新疆工业复苏"
 COX_Xinjiang_Industry_Rehabilitation_desc: "我们对工业设备的更新普及与工业知识的扫盲教育使得我们的工业进入了快速发展的时期。在盛世才时期，新疆的工业基本处于停滞状态，部分日用品甚至还要向共荣圈进口，而生产重工业产品更是天方夜谭。这种情况将会一去不复返了——新疆，它接下来的几年内将成为整个中国的快速发展的全新的工业基地！"
 COX_Xinjiang_Mineral_Extraction: "发掘“聚宝盆”"
 COX_Xinjiang_Mineral_Extraction_desc: "发掘“聚宝盆”"
 COX_Yanan_Lesson: "勿忘延安"
 COX_Yanan_Lesson_desc: "我们的行动遭到了巨大的阻碍，比蔓延在同志中的悲观情绪更危险的，是不断加剧的，对于群众的不信任感。如果不信任群众，我们自然也得不到群众的信任，如果被群众抛弃，我们又怎能称自己为共产党人？毛岸英同志总结了一个月来农村运动中暴露中的各种问题，他发现，不少战士仍与当地群众有疏离感，他们将自己而不是群众视为争取解放的主体。这就导致群众仍将我们看作是新的统治者，而不是解放者。历史悠久的中国革命告诉我们，根据地人民是革命的核心，如若不能将他们充分动员起来，让他们自觉地参与反抗帝国主义的斗争中去，全国的解放根本是无稽之谈。\n\n在找到问题的症结之后，新疆支部中央决定召开一次会议，端正干部们工作的作风。"
 COX_ye_jianying: "叶剑英"
 COX_Ye_Jianying_sec_desc: "§Y安全部长\n£COX_XBJ_text §x中国共产党§!籍\n“久经考验”§!\n--------------\n从土地革命战争到第一次抗日战争，再到长达二十年的西南革命战争，最后是第二次抗日战争……叶剑英便是为数不多存活至今，并且还在坚持战斗的革命者。如若没有他的指挥才干，在数次决定性失败后，西南中央的生存空间或许将更加逼仄；如若不是他指挥取得了“谅山大捷”，日军或许早已通过越南边境长驱直入……一身功勋傍身，令他在中国解放后，被推举为新中国的首任安全部长。\n\n在军事建设方面，基于在西南的经验，党总结出了一套根植于群众的，富有韧性与生命力的军事策略——“持久人民战争”——以群众运动为核心，巩固敌后游击作战，撬动敌我平衡后，通过坚决的正面作战一举将敌人击溃。虽然不是所有的中国军队都如此强调意识形态的作用，但这位共产党部长无疑会想方设法地将政治工作普及到每一名士兵心中，唯有如此，新生的共和国才能真正地立于不败之地。"
 COX_Zhang_Bojun: "章伯钧"
 COX_Zhang_Chong_sec_desc: "§Y安全部长\n£NPA_text §e护国军§!籍\n“坚定的护国军将领”§!\n--------------\n张冲胆大、敏捷、机智，自幼身边人就对他赞不绝口。张冲于1901年生于云南的一个村镇，在辛亥革命后的混乱局势中，他不得不落草为寇。后来他逐步消灭周边悍匪，队伍发展到了六百余人，广受民众爱戴。他曾率部定期袭击滇越铁路，令法国人怒不可遏，这样的举动吸引了省长唐继尧的关注，他多次派兵围剿并俘虏了张冲。张冲接受了招安，在军中谋得一个职位。在军阀混战中，唐继尧在1927年被政变推翻，张冲也由于在其中联合龙云反对胡若愚而在年仅26岁时就被任命为第5师师长。\n\n抗战期间，滇军编成第60军，张冲在其中任第184师师长。他曾参与过著名的台儿庄战役，因此在国军中声名鹊起，最终在武汉战役中被委任为第三路军军长。当中国沦陷、日本高举南京政权的旗帜向各地进军时，张冲仍在继续抵抗；哪怕云南省已经沦陷、他也被迫和宋希濂麾下的军团撤至缅甸时，张冲也仍在继续抵抗。\n\n而今，解放的战旗高高扬起，人民再次向他发出了召唤。他们希望他回来，与中华儿女并肩作战，反抗压迫者。他将回应这一召唤，满足人民的愿望，或者在征途中壮烈牺牲。\n\n§u而今海内虽定，然四方未平。无论中国将迈向怎样的未来，护国军会始终枪口朝外，时刻警惕！§!"
 COX_Zhang_Junmai: "张君劢"
 COX_Zhang_Junmai_eco_desc: "§Y财政部长\n£guoshedang §n中国国家社会党§!籍\n“中国革命的活化石”§!\n--------------\n作为辛亥革命以来，轰轰烈烈的中国革命的亲历者与见证者，张君劢深知这个民族苦难的根源——帝国主义与激进主义。帝国主义固然带来了苦难，却激起了中华民族奋发图强，最终夺得了自由与解放；而激进主义亦在切实地腐蚀着民族的根基，却根本没能引起重视。\n\n在美国避祸的三十年间，张君劢从未停止对中国前途的思考。通过对各朝代晚期农民战争的研究，他意识到了封建土地所有制根深蒂固的不可持续性。但各朝各代的农民军所施行的“及时正义”，只会进一步破坏摇摇欲坠的秩序，总是必然地导致封建社会的总崩溃，以及之后的腥风血雨。中国的现代化，必然不能通过暴力手段重新分配土地，因为那会损害法律与宪政的权威。只有通过逐步立法逐渐限制地主的剥削手段，通过市场来重新分配土地，通过教育来建设新农村，才是实现现代化的康庄大道。\n\n没人会想到，张君劢在得知中国解放的消息后，连夜乘机来到了南京；更没人会想到，这位小心翼翼地走下舷梯的老人，会以不输年轻人的澎湃激情，继续推动这个古老国家的变革。"
 COX_Zhang_Wentian_for_desc: "§Y外交部长§!\n§Y新民主主义§!\n------------\n§L张闻天，1900年出生于江苏省南汇县。和多数中共干部不同，相比基层工作，张闻天更擅长理论与宣传，这使得他在新疆支部内常常处于一种极为尴尬的境地当中——在国内国外联系基本切断、支部孤悬于新疆的前提下，有什么外交工作能做，又要去向谁宣传？在多数情况下，张闻天充当着支部的笔杆子，撰写一些可有可无的文件，因为对基层斗争的不了解，也没法提出什么异议，只能百无聊赖地蹉跎着光阴。对于提线木偶的身份，张闻天自然不喜欢，却很难有所改变。虽然自俄罗斯归来的年轻人们多少点燃了他早已忘却的激情，但归根到底，倘若新疆支部永远生存在深深的阴影当中，他的外交才能便永不能施展。§!"
 COX_Zhou_Enlai: "周恩来"
 COX_Zhou_Enlai_hog_desc: "§Y国务院总理\n毛泽东思想§!\n--------------\n"
 COX_ZT.1.a: "“存人失地，人地皆存；存地失人，人地皆失。”"
 COX_ZT.1.d: "电波跨越了崇山峻岭与漫天硝烟，将西南中央与新疆局紧密地联系在了一起。当电文被译出，整个指挥部都被电报里的内容深深震撼——伪政府与日军的铁蹄虽已合围，但西南同胞的抵抗远比任何人预料的还要激烈、还要决绝。山城与盆地化作了血肉磨坊，每一步退却都伴随着焦土与呐喊。\n\n尽管如此，冰冷的现实如千斤重，压的人喘不过气来：这场战争在军事上已经看不到任何胜利的希望。龙云将军与护国军此刻正抱着必死的决心，在重峦叠嶂间修筑最后的防线，准备用血肉之躯向侵略者发动飞蛾扑火般的最后一搏。而西南局起初也抱定了马革裹尸的决绝，准备不惜一切代价、哪怕流尽最后一滴血，也要死守西南根据地，与这片土地共存亡。\n\n“不能让火种在这里全部熄灭！”新疆局在经过无数次痛苦的闭门会议后，向西南发去了最后的泣血建议。龙云将军的决死反击固然壮烈，但为了长远的革命与复国大业，中央必须保留最后的生生力量。\n\n电波的另一端沉默了许久。最终，理智与大局战胜了悲愤，西南中央通过了撤离决议。他们将放弃已经沦为火海的盆地，翻越环境恶劣的雪山与达坂，冲破重重封锁线，向着西北，向着新疆这片最后的避难所兼程撤退…"
 COX_ZT.1.t: "最后的抉择，绝境中的星火"
 COX_ZT.2.a: "“阿嬷，别哭。等太阳升起的时候，我们会回来的。”"
 COX_ZT.2.d: "在经过了几天几夜混乱而急促的紧急准备后，西南中央的撤离车队与先头步兵终于在黎明前的浓雾中启程了。引擎的轰鸣声在死寂的街道上显得格外刺耳，车轮碾过废墟的瓦砾，发出令人心碎的声响。车窗外，无数双充满血丝和恐惧疲惫的眼睛正默默地注视着这支即将远行的队伍，空气中弥漫着生离死别、依依不舍的绝望与不甘。\n\n这是一场最痛苦的诀别。街道两旁，那些饱经战火、衣衫褴褛的老百姓扶老携幼，眼中含着泪水，将家里仅剩的几个干粮硬塞进撤退战士的手中；仍在前线浴血奋战、用血肉阻挡日伪坦克的护国军战士们，在硝烟弥漫的战壕里回望，向着北上的车队敬了最后一个军礼，他们知道自己将被留下断后，此生绝无生还的可能；而由各方爱国力量残部组成的国民军士兵们，则默默地擦拭着枪口，用坚毅而绝望的眼神目送中央西去。\n\n“乖娃子，这里有馍馍，你们…你们拿着路上吃，顶饿啊。”\n\n“阿嬷，你放心，等我们打完胜仗，我就回来接你啊——”一位年轻士兵说道。\n\n老妇人不回应，只是紧握着眼前这位与她素不相识的年轻人的双手，他看起来不过二十岁，却有着与她的手相似的粗糙感。那声虚无缥缈的承诺，很快便被远方日伪军凄厉的炮声撕得粉碎。\n\n“手里有钱的用钱来换馍馍，没钱的打欠条！乡亲们，你们受苦了，我们对不住你们！我们打了大败仗，你们把儿女送来这里，却让你们看到这些……”随行的旅长摘下军帽，眼中含着泪，却没有停下急行的脚步。“瓜娃子说些什么呢？等打赢了，一定要回来过年啊。”老百姓们拼命挥舞着满是泥土的手，泪水混着黑灰冲刷着他们强颜欢笑的面庞。\n\n车轮滚滚，浓雾与硝烟最终吞噬了那些留在原地拖延时间的同胞。这支背负着整个民族长恨的西行军队，终于彻底没入了通往西北的漫天风沙中。西南沦陷了，但火种已然西去。在遥远的北方，贝加尔湖畔的风正吹过西伯利亚的冻土，而这群流亡者将在风沙中咬紧牙关，静待那道划破东亚黑夜的微光。只要火种尚存，哪怕跨越千里戈壁，也终将带回克复山河的铁骑。"
 COX_ZT.2.t: "长恨不忘，西去不归"
 COX.1.a: "“其实我们能回家就已经很高兴了。”"
 COX.1.a.tt: "突如其来的胜利让人措手不及，我们要尽快站稳脚跟，革命不等人！"
 COX.1.d: "前苏联驻迪化总领馆，如今挂上一块写着“乌鲁木齐苏维埃临时政府办事处”的木牌。\n毛岸英轻轻推开陈赓的办公室门，迎面就看到一座文件堆成的小山，摞在办公桌上。\n“啊，岸英你来了。”陈赓正抓着一把文件站在柜子旁整理，见到毛岸英赶紧放在一边说：“唉，我现在也没法给你安排个座儿，你先坐我凳子上吧。”\n“不了，我来帮您。”\n“别别，我跟你要谈正事。”陈赓赶紧三五下摆完了手上的文件，回到乱糟糟的桌前说：“我这儿暂时也没多余凳子，咱们就站着说吧，你别嫌弃。”\n“没事。”毛岸英问：“为什么不搬去原本的省政府？那里应该什么都有。”\n“唉，别提了，盛世才这个龟儿子，在新疆干了半辈子，沙发茶几一个不少，可连个正儿八经存文件的柜子都找不出来，我这柜子还是从根据地搬来的。”陈赓摆摆手说：“没事儿，过两天我就搬几把凳子过来。”\n毛岸英说：“要不我帮您一起搬。”\n“不不，咱们先把正事说完。”陈赓双手撑着桌子，看起来有些犹豫，他说：“本来这个事情应该刘书记跟你说的，但是这两天他们都各处忙，只能我来说了……”\n“您说吧，是有什么任务吗？还是……”\n“不是，是关于你们的党籍问题。”陈赓说：“你也知道，抗联的老战士们转移到苏联这么多年，东征西战的。但现在苏联都那样了，我们跟中央也断了联系，许多文件都找不见了，而且新疆局现在急用人……短时间内恢复你们的党籍有些困难。”\n“那……”\n“少奇同志的意思是这样，先给你们临时登记个党员身份，等新政府人手富裕了，再慢慢帮你们恢复，怎么样？”陈赓拍了拍毛岸英的肩膀说：“你放心，八十八旅是大功臣，等新政府运转正常了，我亲自帮你们弄，还要给你们办个表彰大会。”\n“好，您放心吧，战士们都会理解的。”毛岸英笑着说。"
 COX.1.t: "万象更新"
 COX.10.a: "中年的毛泽东抬起头，向着他的孩子微笑。"
 COX.10.d: "£gezifu £gezifu 当他急急忙忙奔出办公室的时候，一道散发着奇异光芒的巨大光圈映入毛岸英的眼帘。当毛岸英好奇地向光圈伸出手时，光圈的中央向他投射出了前所未见的景象：那是他久未谋面的北平城，却又不是他印象中的样子——宽阔的道路上车水马龙，大大小小五颜六色的车辆像两条色彩的河流对向流淌着，两边的路灯柱上挂满了红旗。而张灯结彩的天安门上，正中间挂着一个男人的画像，那是——父亲？！再然后，他就不省人事了。当毛岸英再一次睁开眼，他正躺在床上；当他看向床边的椅子，那里坐着一位正在看书的人。而对方也注意到毛岸英醒了——"
 COX.10.t: "毛泽东归来"
 COX.100.a: "目的地：新疆。"
 COX.100.d: "£gezifu £gezifu 秀英受不了了。\n\n£gezifu £gezifu 因为前几年那场该死战争，她那本就不安稳的，但还算过得下去的生活彻底毁了。\n\n£gezifu £gezifu 兵荒马乱，兵荒马乱，兵荒马乱。\n\n£gezifu £gezifu 在日本来之前，她的男人就已经就隔三差五地被喊去“操练”，每次都是去给官爷们免费干苦劳役，地里的活计便是三天打鱼两天晒网，都只有她一个人在营生结果这仗一打，她男人便顺水成章被征召去了军队。村里现在除了小孩，男丁已经绝迹了。本来一个人种地也能将就着过，但这好死不死地处在战线附近的无名小村庄三天两头挨炸，秀英一家人都活着——可地算是彻底坏了。\n\n£gezifu £gezifu 前几天，老母亲突然生了急病，可没人看——村里的土郎中早去军营了，老母亲就嚎着叫着走完了她坎坷的一生，昨天，她男人的尸体也送回来了。\n\n£gezifu £gezifu “秀英啊，你男人还算好的了，留了个全尸，我听说有的娃子被打的呀，浑身上下没一块好肉……”邻家的阿姨见着她男人的尸体，感慨道。\n\n£gezifu £gezifu 秀英没听进去邻家老阿嬷的絮叨，只是一会怔怔地望着她男人的尸体，一会看看她三个还没10岁的孩子。“老滚嗯（丈夫），你没了，俺们咋过啊……”  一句话从她嘴里蹦出来。她又愣怔起来，地没了，没活路了；母亲没了，男人也没了，这地方没什么好待的了，干脆跑吧，可是，往哪里跑？\n\n£gezifu £gezifu “咋就俺们这兵荒马乱的呀……听说新疆那边变了天，来了群什么红军……听说好多人都往那跑……”\n\n£gezifu £gezifu 秀英这下可把邻家阿妈的絮叨听进去了，新疆？新疆！那里总不打仗吧！成，就往那跑！\n\n£gezifu £gezifu 第二天一早，秀英悄悄把门阖上，背着3岁的幺女和不多的行囊，左手牵一个右手牵一个，踏上了逃亡的道路。"
 COX.100.t: "逃亡（其二）"
 COX.1000.a: "中华人民共和国万岁！"
 COX.1000.d: "我们将缔造一个为全中国人民奋斗的国家！"
 COX.1000.t: "日本投降矣！"
 COX.1001.a: "前进，前进，前进进！"
 COX.1001.d: "起先，只有微不足道的异样，一支步枪的故障，一队宪兵的消失，一趟消失在荒漠中的补给车队——这些都没有引起辻政信的注意，在西北的泥泞里奋战至今，这些事简直司空见惯。就当他试图拿起步话机，催促陕西边境的联络员早些将补给送来时，话筒中一点声音都没有，所有线路都被切断了。\n\n£gezifu £gezifu 辻政信感到这其中有些蹊跷——平日里的那些游击队，应当是没有同时切断他们通讯的本事，那么是什么人……还是什么东西，破坏了这儿的通讯？\n\n£gezifu £gezifu 安拉在上——他想起那些反贼伏诛时祈祷的言语，浑身一阵哆嗦。很快，他将发觉自己完全与日本本岛失去了联系。神秘的黄沙覆盖了蒙古与西北的天空，从蒙古草原到四川盆地，一切忠于大东亚新秩序的走狗很快就将意识到，已经陷入孤立的他们，将面临怎样的恐怖……"
 COX.1001.t: "擂鼓，开战！"
 COX.101.a: "日子总算有盼头了。"
 COX.101.d: "£gezifu £gezifu “马步芳，妈的马步芳，收的税叫我们活不了，妈的马步芳！”\n\n£gezifu £gezifu  听着台上那个老农模样的难民大吼，台下的听众——红军战士，新疆人民，抑或是刚刚才从青海逃过来的难民，都低着头，若有所思，有些人甚至开始啜泣。秀英也低着头，不过她没有哭，想想过去在青海的生活，那真是没有一点盼头，每天醒来想的就是怎么填饱一家人的肚子，然后晚上再带着饥饿入睡，周而复始，没有尽头……\n\n£gezifu £gezifu 经过漫长的跋涉，她终于带着她的三个孩子到了新疆，可是包裹已经被青海境内的马家军克扣走了，她现在除了她的三个孩子，不名一文，她真正地山穷水尽了。\n\n£gezifu £gezifu 老农下去了，一个穿戴整洁的人上了台，是新疆这边的官老爷吧，不知道为什么把他们聚在这一块，开什么“诉苦会”，本来她不想来，可是越境的时候被这里的兵抓住了，又听说开完这个会能有顿饱饭吃——他们四娘母多久没吃顿饱饭啊！管它的，先蹭一顿饭再说，吃完也有力气进城讨营生……反正这帮官老爷估计也是开会来撑撑面子，开完会，早把他们一脚踢走嘞！秀英想着，嘲讽地看着周围哭成一片的难民——哭吧哭吧，哭没了力气被踢开我看你怎么哭！天底下上头的人都一个样！\n\n£gezifu £gezifu 台上，唐营长抹了抹泪水，“乡亲们，我们对你们之前的遭遇非常痛心，但是，我向你们保证，你们在新疆，将会迎接崭新的新生活！你们以前受苦的日子一去不复返了！”台下的秀英又嘲讽地冷笑一声。\n\n£gezifu £gezifu 开饭了，老天，居然有肉！香喷喷的羊汤，刚出来的馕饼，油滋滋的烤羊肉！妈呀，这群当官的真舍得下血本！没节没喜的居然上肉！青海过年也吃不上哦……旁边三个孩子正笑嘻嘻地抢着肉，秀英笑了，好久没看孩子这么开心过了，好久没笑过了，好久……\n\n£gezifu £gezifu 饭吃完了，秀英便以为就没了，准备带着孩子进城去，结果她被领着到了一个大院里，这么大！一个红军战士把他们一家领进大院的一间屋子，笑着说你们就在这住下吧，她本来想跑，可是门口两个带枪的小娃子让她着实害怕，惴惴不安地过了一夜。第二天，又是几个官模样的人，过来问了她话，叫什么名字，家里有几口人，会干什么，她一一回答，那些官模样的居然一点官架子都没有，还跟她聊天呢！第三天，她被领着到了一块田里，领头的对她说，这田归她种了，交足一定数量的粮食（真少！我一天都交得齐！），剩下的都是她的。\n\n£gezifu £gezifu “啥啥？”秀英震惊了，“你们，把这地，白给我种？”即使他早听说过这里的人是会分地的，听到这句话，仍然难以置信。\n\n£gezifu £gezifu “是啊，大姐，以后我们还要收购你的粮食呢！价格绝对实惠！”\n\n£gezifu £gezifu 秀英回到住处，脑子空空的，孩子在大院里和同龄人玩呢，听着他们的欢笑声，她流泪了。"
 COX.101.t: "新疆，新家"
 COX.102.a: "周而复始。"
 COX.102.d: "£gezifu £gezifu 李二坐在哨房里，打了个哈欠。\n\n£gezifu £gezifu 他在的营这两天换防到边境了，巡逻和站岗就成了他们营近日来的主题。南边的邻居不安生，不仅是土匪常来骚扰，有时候连马家的正规军都要过来“打秋风”，边防的任务自然就成了最重的了，这点让早就探索出“保命哲学”的李二很不高兴，可是有什么办法呢？在营房里当兵吃饭，就得受人管，这点他还是拎得清的。\n\n£gezifu £gezifu 伸手拨了拨煤油灯的灯芯，李二把脑袋撑在手上，打算打会瞌睡（处分就处分，管他的！反正营长也看不到）。结果“砰”的一声，门被撞开了，新兵蛋子急急忙忙地闯进来，李二一个激灵，睡意全消，“慌得跟家里死了人一样！”李二生气地咒骂着，结果新兵蛋子上气不接下气地说着：“李叔……咱们跟那边的土匪……打起来了，他们快顶不住了，你枪法好……去支援一下吧……”\n\n£gezifu £gezifu “啥？”李二愣怔一下，这帮龟儿子，平常骚扰来骚扰去就差不多得了，这次居然还来真的?他没有多想，挎着枪上了马，被新兵蛋子领着奔向地点。\n\n£gezifu £gezifu 没骑几分钟，李二就听到了枪声，李二远远一望，果然，自己带的新兵班正在和一队土匪交战，不过双方的枪法都实在堪忧，乒乒乓乓打了大半天，双方愣是一个挂彩的都没有，不过，土匪或许察觉到了对面是新兵，正慢慢地接近。\n\n£gezifu £gezifu “……这帮新兵蛋子……”李二一阵无语，不过也怪不得他们，他们才参军几个月勒？枪都拿不稳！\n\n£gezifu £gezifu 李二取下他的半自动步枪，对着一个土匪腿就是一枪，土匪应声倒地（怎么说俺也当了二十年兵嘛），对着另外一个又是一枪，这样放倒了三个，其他土匪见碰上狠角色了，急急忙忙撤退了，李二在此期间又开了一个土匪的瓢。\n\n£gezifu £gezifu 战士们从掩体里探出头来，“愣啥？抓活的啊!”李二吼了一句，抢先捆起了一个土匪，“嘿嘿，立功了这……”\n\n£gezifu £gezifu 把三个土匪交上去，已经是两个时辰后的事了，李二领着他的班疲惫地走回营房，新兵蛋子忍不住了：“李叔，这边境怎这苦这累啊？我们天天都得跟这群土匪打照面。”李二瞥了他一眼，“这才几天？苦日子还在后面呢！”\n\n£gezifu £gezifu 晚上，李二躺在铺上，没一会就睡着了，可是，他好像恍恍惚惚听见新兵蛋子念叨着，“天天都这样，什么时候是个头啊……”"
 COX.102.t: "平凡"
 COX.103.a: "“马上派人渗透青海，看看发生了什么！”"
 COX.103.d: "£gezifu £gezifu 毛岸英看完手上的文件，瘫在椅子上，揉了揉双眼。\n\n£gezifu £gezifu 新疆土改取得成功，在布里亚特的援助下开始了初步工业化，工农红军也改编完毕。西北的黑暗正迎来光明。虽然现在事也不少，但总比土改那会要清闲许多。\n\n£gezifu £gezifu 毛岸英揉了揉脖子，挺起身准备继续看文件——\n\n£gezifu £gezifu “砰”办公室的门被骤然推开，门打在墙上，发出了响亮的碰撞声。警卫员火急火燎地冲了进来，手里拿着份电报\n\n£gezifu £gezifu 毛岸英愣了一下，随即反应过来——出急事了，不然警卫员不会这么慌张。\n\n£gezifu £gezifu “怎么？哪里的地主暴动了？”看样子，地方民兵压不住了，要请中央出马。\n\n£gezifu £gezifu “不是”警卫员摇摇头，“是边境出了问题，青海那边，您先看看电报吧。”\n\n£gezifu £gezifu 毛岸英接过电报，埋头读了起来。电报只有短短几行字，“青海发生叛乱，有大批难民溃军涌入边区，请求中央迅速处置”读毕，他不由得苦笑起来，虽然他绝对不会满足于新疆的一亩三分地，计划着向内地推进，青海自然是他的第一个目标，可是，这“机会”来得是如此的猝不及防，以至于他还要先解决青海给他带来的烂摊子。\n\n£gezifu £gezifu 不过，事情发生了，就得解决。\n\n£gezifu £gezifu “通知一下陈总理，马上准备召集政治局召开紧急会议，我们得把这件事处理好。”\n\n£gezifu £gezifu “是”警卫员转身准备离开，“等等，再把情报部的，和民兵管理的叫过来，我有事找他们。”\n\n£gezifu £gezifu “是。”警卫员转身离开了，毛岸英坐回椅子里，把其他文件推开，从抽屉里拿出一张纸，开始思考怎么处理这件事情——不仅是处理难民溃军，还有怎么把青海安定下来。他开始想，如果是在陕北，如果是他的父亲，他会怎么做。\n\n£gezifu £gezifu “报告，”情报部门负责人敲了敲门，走了进来，“主席，您找我有什么事？”\n\n£gezifu £gezifu 毛岸英从想象中抽出来，对着这位新生情报部的负责人，说道："
 COX.103.t: "邻家起火"
 COX.104.a: "“红军？共产党，好像听说过……”"
 COX.104.d: "£gezifu £gezifu 又是艰辛的一天，李二乔装打扮后带着继续向青海的更深处走去。\n\n£gezifu £gezifu 在荒漠中，若没有条道路，是很容易的遗失在茫茫荒漠中的，所幸的是，前人留下的道路成了防止李二失踪最好的道具，尤其是这条道路以前清剿马匪的时候红军的战士们曾开拓过。\n\n£gezifu £gezifu 很多情况下，李二都只是孤独地行走着，是苍茫世界一个微不足道的沙尘。\n\n£gezifu £gezifu “有人来了？”李二放眼看到远处有一伙人在缓慢的行走着，他下意识地将手放入了腰间，握上了一把苏制小手枪。那可是他成为后渗透人员拿到的宝贝，可得好好的用。\n\n£gezifu £gezifu 过了一会儿，他才把手放下，急忙拍一拍自己身上的灰尘，整理了一下着装，走向已经可以依稀看得清样子的难民群——现在完全不用担心有诈，难民独特的模样已经被李二深深记在脑海里了，不会认错的。\n\n£gezifu £gezifu “大爷大娘，你们这是要去哪啊？”当李二正式出现在难民面前时，他的样子和之前乞丐有了不小的差距，更主要的一股气质让他形象大变。\n\n£gezifu £gezifu “啊，你，你是？”作为领队的是一个看着约五六十岁的老人，李二环顾了一下，队伍里大多都是老人和小孩，二三十岁的青壮年几乎看不到，每个人都面黄肌瘦，看着就知道很久没吃东西了。\n\n£gezifu £gezifu “我从新疆来的，准备去西宁见亲戚。”李二说道。\n\n£gezifu £gezifu 听到这句话，老头摇摇头，说道：“别去了！你亲戚大抵是没救了！听说西宁那边出大事了，死了很多人，俺们这边的地主都跑了！”\n\n£gezifu £gezifu “啊！？那你们现在准备去哪！？”李二装出不可思议的表情，说道。\n\n£gezifu £gezifu “天晓得，俺们准备去宁夏，听说那里还不是太乱。”老头说道。\n\n£gezifu £gezifu 李二听罢，把自己的袋子打开，拿出干粮，自己吃了口，递给对面，说道：“既然如此，去新疆吧，那边正欢迎人呢，前阵子我刚出新疆的时候，就看到从青海来的人了。”\n\n£gezifu £gezifu 老头将信将疑地接过袋子，说道：“是这样么？”\n\n£gezifu £gezifu “总之到时你要是见到戴帽子的人了，喊一声俺求红军帮忙，共产党帮忙，他们就来帮忙了。”李二如此说道，说着，就继续往青海的方向走了。\n\n£gezifu £gezifu 留下还带着些许疑问的老头。"
 COX.104.t: "指点方向"
 COX.105.a: "“首先，开始往新青边界调物资。”"
 COX.105.d: "£gezifu £gezifu “咚咚咚”“请进。”\n\n£gezifu £gezifu 陈赓一脸凝重地快步走进办公室。“主席，青海出事了！”\n\n£gezifu £gezifu 毛岸英顿时吓了一跳：“我们的情报员被抓了？”\n\n£gezifu £gezifu “不是！而是疑似发生了内乱”\n\n£gezifu £gezifu “这次我们情报员趁乱传了很多情报回来。自从马家在宁夏打了败仗，马家政府的公信力就大为降低，据说那马继援想依靠马家以前搜刮的财富重整军备，不知怎么的，就后来有人谣传银行没钱了，政府又要印钱，纸币要贬值成废纸了！没多久西宁就爆发了大规模的挤兑事件，银行当然拿不出来啊，因为银行里的钱全进了马家的口袋，于是讨钱的民众就全堆在银行门口，求公道呢，事情闹挺大，西宁的民众都看着呢，据说后面，马家的私兵套了身白衣服，以一字长蛇阵冲要钱的民众的阵，冲破了就一个劲地打人，据说连残疾人都不放过，活活打死了。”\n\n£gezifu £gezifu 陈赓咳嗽了一下，接着说：“还有一点就是，存钱的有不少是关内逃难的难民，本身就是靠给马家干没有安全保障的工作讨来的钱。现在家财一朝散尽，据说已经开始暴动了。这次暴动影响不小，除了西宁，其他地方也有暴乱，这进而加剧了本地人和外地人的冲突，可悲的是，本地的民族矛盾其实并不冲突，不论是汉族还是回族还是维吾尔族，以前的矛盾都并不尖锐，反而相当厌恶从关内来的汉人。”\n\n£gezifu £gezifu 陈赓停了一下，才继续说：“据说，马家内部也有人不满马继援的做法，但这个消息可能不太准确，仅供参考。”\n\n£gezifu £gezifu 毛岸英思考了一会，最终下了结论：“我们得赶紧做好准备，青海的动荡很可能会牵扯到我们。”"
 COX.105.t: "青海危机"
 COX.108.a: "“乡亲们，红军是咱工农自己的武装……”"
 COX.108.d: "£gezifu £gezifu 西北，对红军而言，承载着太多的往事。二十多年前，当革命遭遇低谷。风尘仆仆的红军四处辗转，最后来到了这片土地。但还未安定下来，幸存下来的革命者们爆发了争执，以红四方面军为主组成的西征军西渡了黄河，浩浩荡荡地向西北进军，这次冒进遭到了马家军的迎头痛击。在之后，大溃退时的中共干部，并没能瞻仰这些逝去的烈士，而是一路向西，穿过重重封锁，抵达了较为安稳的新疆。\n\n£gezifu £gezifu 现在，红旗终于插上了西宁城头，从乌鲁木齐赶来的毛岸英登上了古老的城墙。\n\n£gezifu £gezifu 此时，城门口被大量的平民围得水泄不通，他们是农民，佃农，小商贩，手工业者。他们也是被压迫者，将毛岸英，一面红旗，还有负责维持秩序的红军战士们围在中央。岸英的视线扫过人群，但并不能从他们脸上看出任何情绪。人们的视线茫然地扫过持着枪的战士，新变换的旗帜，然后不约而同地落在了毛岸英的身上。\n\n£gezifu £gezifu 毛岸英知道，这里饱经磨难的人民并不如他们外表看起来一般麻木。他们用看似木讷的目光敏锐地检验着红军和新的政权。如何让这些生长在抓壮丁和扫荡战的人们相信有一支全心全意为了他们服务的武装？如何让这些受尽地主盘剥和官家冷眼的群众相信新的政权势将改天换地？\n\n£gezifu £gezifu 岸英的眼光同样也凝视着这一个个如同大地一样黝黑坚实的西宁人民，他知道，这些受压迫者们，才是中国革命的希望。这个民族的未来，不在于某个人的卧薪尝胆，或是什么人的决心终成。中国的未来，不在这些天上缥缈的云，而是这些大地上真实的黄土。\n\n£gezifu £gezifu 他喉结上下微移，张开了嘴巴。"
 COX.108.t: "西宁，西宁"
 COX.109.a: "我亲身踏过这里的废墟，我亲眼看到了这里的灾难。"
 COX.109.d: "£gezifu £gezifu 青海的人民同解放前的新疆人民一样，已经在压迫中苟活了几千个春秋，在这片土地上，痛苦实在是太常见了。几千年以来的封建地主给这片土地戴上了一层又一层厚重的枷锁，这些枷锁可能叫宗族，也可能叫民族，也可能叫宗教。一道又一道枷锁束缚着瘦弱的人民，让他们在永不停止的劳作和徭役中，沉默的等待着死亡。\n\n£gezifu £gezifu 而伊斯兰教华美的教堂同样是这里人民背上沉重的大山，在神圣的教堂内，神仆以神的名义鲸吞了这里的人民赖以生存的土地，并在上面用人民的血汗修筑起供养神灵——同时也是供养自己的华美“宫殿”。而华美教堂之外，则是骨瘦如柴的佃农在田野上劳作的样子，更远的地方，则是无地可耕，无家可归的流民的哀嚎。\n\n£gezifu £gezifu 而马家和日本人在这片同样施加了痛苦的回忆，在这里，流窜的匪帮，穷凶极恶的日本军队。这些是这片土地上最真实的伤口。血与火在这里燃烧，百姓流离失所，居无定所。\n\n£gezifu £gezifu 饥荒几乎是年年都在发生的，毛岸英在西宁周围走过的村落，家家户户，见不到几个壮年的男丁，有的村子看到外头来了兵，就在短短的时间里人去楼空，连半点粮食都看不到。\n\n£gezifu £gezifu 而每一个村子大半都是因为各种战火而焚毁的废墟，岸英就这么站在废墟而空无一人的村落里，默默叹息。\n\n£gezifu £gezifu “旅长，我们回去吧。”\n\n£gezifu £gezifu 身旁的卫兵说道。\n\n£gezifu £gezifu 岸英点点头，今天的实地调研要结束了。\n\n£gezifu £gezifu 他转过身去，在离去之间，回过头，再看了一眼这破碎的山河。"
 COX.109.t: "满目废墟"
 COX.11.a: "“这条老狗还在吠，看我把你就地正法！”"
 COX.11.d: "£gezifu £gezifu 摇摆不定，见风使舵，从不忠于某一面特定的旗帜，依据现实需要随时改换自己的信仰——有人可能会把这种人称为“三姓家奴”，“汉奸国贼”，但盛世才清楚，这就是军阀的生存之道。能敏锐的察觉时局，抛弃那些不重要的东西，及时站在赢家一方，这才是在乱世中生存下来的诀窍。\n\n£gezifu £gezifu 正是秉持着这样的信条，盛世才得以在数十年的混乱中稳稳地（以一个军阀而言）割据新疆。时过境迁，北方曾经虎视眈眈的苏联碎成了一地鸡毛，南方趾高气昂的中央政府也沦为日本人的提线木偶，盛世才的统治却得到了前所未有的稳固。强大的日军无心进犯毫无价值的新疆，而苏联地区游荡的军阀也构不成什么威胁。仅剩的威胁来自于内部，但不论是国民党还是共产党，都势单力薄，掀不起什么风浪。\n\n£gezifu £gezifu 本以为下半辈子都能在迪化高枕无忧地继续当自己的“土皇帝”，但盛世才怎么都没想到，一支来自于蒙古高原的“流寇”竟然有胆子进犯新疆边境。而他更没想到的是，自己经营数十载的心血，他割据新疆真正的仰仗——自己的嫡系军队竟然会被这支流寇部队逼至迪化。\n\n£gezifu £gezifu “都是饭桶！老子不是花了大价钱养你们吗？”在盛世才为自己的晚年精心置备的小别墅内，他歇斯底里地对着眼前的参谋吼叫着。耳畔隐约间能听到轰鸣的炮火声，夹杂着短促轻武器开火的声音，令这个老人更为烦躁不安。\n\n£gezifu £gezifu  “省长，赶快撤退吧。” \n\n£gezifu £gezifu “撤退？难道你要我置迪化全城的百姓于不顾，狼狈逃窜？”嘴上这么说，其实他早就准备好了自己的后路。迪化丢了，他盛世才在新疆的统治也基本上宣告结束了。幸好他已经得到了日本人的首肯，只要跑到民国，就能混个农林部长当当。所以在命令参谋“死守迪化，不将城拱手予敌”之后，他已经收拾好细软，准备跑路了。\n\n£gezifu £gezifu “不许动！”正当盛世才准备乘上自己的日本小轿车的时候，他背后突然传来了一声怒喝，隐约间，他感觉到冰冷的钢枪顶上了自己的脊背。\n\n£gezifu £gezifu “英…英雄，千…千万不要冲动啊。” \n\n£gezifu £gezifu “盛世才，你这条老狗，还记得我是谁吗？” \n\n£gezifu £gezifu “我们之间没什么仇怨，新疆就让给你们吧，但您能不能发发善心，先放小人一马。” \n\n£gezifu £gezifu “别装傻了，十几年前你杀我同志的时候可从没手软。”感到背后钢枪用力地往前一顶，盛世才吓得挺直了腰杆（对于一个老人来说，着实不容易），“我早就想杀你了。” \n\n£gezifu £gezifu “饶……饶命啊！”此刻，整个新疆最有权势的人，发觉自己的命运完全掌握在了另一个人手中……"
 COX.11.t: "军阀"
 COX.110.a: "“我们是工农红军，我们是来救你们的！”"
 COX.110.d: "£gezifu £gezifu “外面来兵了！”\n\n£gezifu £gezifu 太阳还没升起来的时候，不知是哪个负责守夜的人小声地喊了一声，整个山间避难所嘈杂的闲聊声顿时归于虚无。\n\n£gezifu £gezifu 自从他们得到了青海又开始打仗之后的消息之后，他们就带着家里仅存的粮食逃了，连土司负责监视他们村子的私兵都没有发现。\n\n£gezifu £gezifu 一个看起来才六岁的孩子睁着无暇的黑色眼睛，看着这片漆黑的避难所。\n\n£gezifu £gezifu 避难所是构建在一个山洞里的，山洞入口被简单的封起了口，不认真搜查的话，还真不容易看得出来。\n\n£gezifu £gezifu 这里大概藏了二十多个瘦小的身体，其中大概有四个家庭，十多个孩子。每个人都骨瘦如柴，躺在草堆里如同干尸一样恐怖。\n\n£gezifu £gezifu “天天来兵，这些兵就是吃人野兽，他们比野兽还狠！吃人不吐骨头。什么马家军，什么日本人，都是吃人的！”\n\n£gezifu £gezifu 一个老人忍不住小声骂道。\n\n£gezifu £gezifu “嘘！”一旁，老奶奶的女儿担心被发现，急忙提示道。\n\n£gezifu £gezifu 但似乎已经晚了，避难所外面的兵，外面的“吃人野兽”听到了他们细小的声音，朝着他们走来。\n\n£gezifu £gezifu 草鞋踩在地上的声音越来越近，这让避难所里的众人心惊不已，几位妇女已经想象到了她们被发现后的悲惨未来。\n\n£gezifu £gezifu 那六岁的孩子好奇地看着自己听到声音的方向，明明那里被稻草遮蔽着。但她还是目不转睛地盯着。似乎完全不担心她被“兵”发现后会发生什么似的。\n\n£gezifu £gezifu 下一刻，光明照耀了她的眼睛，她犹如黑夜一样美丽的眼睛映照出了一颗颗鲜红的红星。"
 COX.110.t: "安置流民"
 COX.111.a: "“不能！”"
 COX.111.d: "£gezifu £gezifu 在这片大地上，一个政权的兴衰并不能代表这片大地就这样简单的就被改变了。青海马家的衰亡就如同这片大地上数千年以来衰亡的其他政权一样，看似死去了，但他漫长岁月积攒的封建根骨，却没有多少变化。要想改变这一切，并不简单。\n\n£gezifu £gezifu 剿匪誓师大会上，一支支红军排列整齐，红军的红旗迎着太阳，在风中飘舞着。\n\n£gezifu £gezifu “同志们！我们虽然战胜了马家军的主力，并不意味着青海就完全解放了。各地仍然有着各种背景的土匪依旧盘旋在青海各地，给无数青海的人民带来灾厄，我们是人民的军队，我们能容忍这种行为吗！？”\n\n£gezifu £gezifu 毛岸英看着一张张或稚嫩，或成熟，有着不同种族样貌的面孔，一字一句地说道。\n\n£gezifu £gezifu “不能！”\n\n£gezifu £gezifu 微风轻拂之下，红军战士们齐齐发出了震耳欲聋的吼声。\n\n£gezifu £gezifu “同志们，在青海，可憎的地主阶级还在该死地压迫着我们辛勤的劳动人民，他们残酷地盘剥着我们勤劳的阶级同胞们，我们的阶级同胞在无尽的痛苦中生活，而那群该死的地主却享受着我们难以想象的生活，我们能忍受这种行为吗！？”\n\n£gezifu £gezifu “不能！”\n\n£gezifu £gezifu 红旗之下，一位位红军战士们眼中冒出怒火，他们再一次用整齐响亮的声音回答道。\n\n£gezifu £gezifu “同志们，在这里，可恶的日本法西斯帝国主义对我们的新根据地垂涎欲滴，他们随时可能会对我们发动战争，将青海人民好不容易取得的解放独立与自由剥夺，我们能容忍他们的行为吗！？”\n\n£gezifu £gezifu 红日之下，一位位红军战士沐浴在无穷无尽的阳光中，他们又一次用整齐响亮的声音回答。"
 COX.111.t: "追击穷寇"
 COX.113.a: "永远不会。"
 COX.113.d: "£gezifu £gezifu 张大爷神志有点不清醒，这点全村子的人都知道。\n\n£gezifu £gezifu 他像个正常人一样劳作，像个正常人一样吃饭，像个正常人一样生活。但是他嘴里总是念叨着当地人听不懂的词，什么“共产党”啦，“”红军”啦，还有他常常挂在嘴边的词---“毛主席”。\n\n£gezifu £gezifu 面对村民们的疑惑，他的家人们总是尴尬地笑笑，说一句“陈年往事啦”便不再提起，久而久之村里人也习惯了这个神神叨叨的大爷，加上他们一家交税，巴结上面总是很积极，于是当地的长官也不再追问，默许了大爷的神经。\n\n£gezifu £gezifu 张大爷一家是逃难来的，陕西来的。\n\n£gezifu £gezifu 日子一天天过去，张大爷也一天天老去，不过每次提起他的“毛主席”，他总是非常虔诚，像是个年轻人一样，孩子气地笑着。\n\n£gezifu £gezifu 不过日子过不下去了，马家军内部的骚乱让这个地方失去了秩序，长官跑了，村民跑了，马匪横行，赵大爷的儿女跪在地上，求着张大爷和他们一起走。\n\n£gezifu £gezifu “跪什么！封建迷信！毛主席的教导你们都听到狗肚子里了？！”\n\n£gezifu £gezifu “爸！到处都是马匪，不走，我们过不下去啊！”他的大儿子喊道。\n\n£gezifu £gezifu “马匪有什么！毛主席会派红军去打的！毛主席和党中央不会丢下我们！”\n\n£gezifu £gezifu “爸！毛主席已经死了！共产党早没了！我们现在在青海啊！”他的二儿子几乎是吼出来的。\n\n£gezifu £gezifu “什么？！”张大爷震动了一下，但他很快恢复了自信——\n\n£gezifu £gezifu “无论什么时候，毛主席和党中央绝对不会坐视不理的！”\n\n£gezifu £gezifu 他的子女们劝不过，只得留足粮食，抹着泪走了。\n\n£gezifu £gezifu 马匪真的来了，他们劫掠走了张大爷家的财物，绑走了张大爷。\n\n£gezifu £gezifu 红军追上马匪已经是一天后了，他们发现了被捆住的张大爷，张大爷已经非常虚弱，但是目光仍炯炯有神，他盯着红军帽上的红星，一字一句地念着：\n\n£gezifu £gezifu “毛主席不会丢下我们。”"
 COX.113.t: "永不放弃"
 COX.114.a: "但生活不会一如既往。"
 COX.114.d: "£gezifu £gezifu 张思源已经是第二次干这种事了。\n\n£gezifu £gezifu 作为近卫八十八旅的战士，他跟着毛旅长从布里亚特到蒙古，又辗转来到新疆，打进迪化。随后，便在极度缺人的边区命令下，脱下了军装，下到基层里主持一个村庄的恢复生产和土改事宜。\n\n£gezifu £gezifu 而现在，他穿着军装，第二次在青海干起了恢复生产的工作。\n\n£gezifu £gezifu 走在村子里，比起在新疆村民的不信任，他在青海民众的眼里看见的更多的是麻木和害怕；害怕他们不过是新一代老爷，害怕他们带来的战乱与灾难，害怕他们会继续奴役他们……还有更多的是麻木，那种无数次希望后的绝望带来的麻木。但是，张思源知道，正如在新疆那样，他，他们，红军，将带给他们希望。\n\n£gezifu £gezifu 他踱进会场，会场正闹哄哄地忙着抓阄分畜生，虽然这里的民众还是对红军抱着不信任的态度，但眼前的好处摆在眼前，还是先拿到手再说。张思源耐心地等到他们分完，虽然不情愿，但是他还是走上台前，拿上地上的大喇叭，用不大，但很沉稳的嗓音宣布道：\n\n£gezifu £gezifu “乡亲们，今天大家把地主的牲畜分了，就各自回去生产……该种地的种地，该放牧的放牧吧，不用担心，缺草缺肥的明天县上会调一点过来，凑合凑合，大家就先回去吧！”\n\n£gezifu £gezifu 村民们满腹狐疑地回去了，但转头看看牵着的生灵，捏着绳索的手，不由自主地攥得更紧。\n\n£gezifu £gezifu 入夜，这个村庄渐渐入梦，但许多村民还是辗转反侧，因为，他们预感到，新生活要开始了。\n\n£gezifu £gezifu 窗外，太阳将照常升起"
 COX.114.t: "第二次"
 COX.115.a: "谁行善谁得入乐园，他们不受丝毫的亏枉。"
 COX.115.d: "£gezifu £gezifu “敬主赞圣”，“遵经从训”“教主之令，民需服从唯谨，虽令之死，亦所甘心。”\n\n£gezifu £gezifu 富丽堂皇的清真寺内，衣着华丽的阿訇一如既往的在宣读着本土化的苏菲教义，他高贵的圣言在清真寺之间环绕，余音不绝。\n\n£gezifu £gezifu 但今天，阿訇宣读到一半，就不禁皱起眉，睁开眼睛，看向清真寺内的信徒们。\n\n£gezifu £gezifu 他的目光环绕了清真寺内星星点点的信徒，不禁说道：“谁给他们的胆子不来礼拜的？”\n\n£gezifu £gezifu 他的圣言如惊雷，在台下礼拜的信徒耳边爆炸，惊得信徒们匍匐着身子，不敢回应。\n\n£gezifu £gezifu 许久，才有一个信徒开口说道：“阿訇大人，好像是……好像是因为最近外面从新疆来了个传道的阿訇……”\n\n£gezifu £gezifu “嗯？他现在在哪？”阿訇一步又一步地走下阶梯，站在匍匐着的信徒身边，问道。\n\n£gezifu £gezifu 还不等其他人回答，清真寺内的众人就听到外面人声鼎沸，似乎聚集起了大量的人群。\n\n£gezifu £gezifu “穆圣常去圣门弟子的园林中, 他不为穷人的贫穷而鄙薄他们; 他不为帝王的权势而惧怕他们; 他不分彼此, 一律号召他们走向安拉之道，穆圣最不愿发怒, 最青睐喜悦, 最体贴众人, 最善待众人, 最为大众谋利益”。一个身穿朴素袍子的阿訇在众人的簇拥下，缓缓走进清真寺内。\n\n£gezifu £gezifu “外力阿訇，难道以前的阿訇们说的都是骗话？”在外力旁边的一个牧民信徒问道。\n\n£gezifu £gezifu “这里的阿訇，假借真主之名，垄断私财，让信徒贫困，穆圣曾言：“我的教民中的贫困者, 将先于富裕者五百年进入乐园，他与穷人同坐，与贫民同吃，而这里的教主却行敛财之私事，是虚伪之徒也。《古兰经》圣言亦称：各人只得享受自己的劳绩，这里的教主盘剥尔等的财富以满足自己的私欲，这是不尊安拉，不敬穆圣的的行为，他们才是安拉的敌人。”\n\n£gezifu £gezifu 一边说着，外力一边指向清真寺内的阿訇，说道。在他身边，一群衣衫褴褛的信徒此时却如沐春风。\n\n£gezifu £gezifu 因为这是这么多年来，他们聆听的最美的圣言。"
 COX.115.t: "正道圣言"
 COX.116.a: "好的，孩子。"
 COX.116.d: "£gezifu £gezifu 今天一大早，驻扎在村子里的兵，不，不是兵，应该叫战士。帽子上有星星的战士们就在敲打着什么东西。\n\n£gezifu £gezifu 这吸引了一些孩子们的注意，孩子们醒来之后，最喜欢围在战士们身边，听战士们讲故事。\n\n£gezifu £gezifu “战士们，这次是要干啥？”\n\n£gezifu £gezifu 一个老人拄着拐杖，颤颤巍巍地走了过来。战士们和土改干部们已经在这里待了几个月了，前几天地主刚刚被揪出来审判，判了十年的劳改。\n\n£gezifu £gezifu 虽然战士们和以前的兵不一样，不烧杀掳掠，不强抢民女，但刻在骨子里对兵的恐惧还是让他们十分害怕。\n\n£gezifu £gezifu “这个吗？”这个红军指了指他们现在在搭建的分田尺。说道：“我们在搭分田尺，等我们修好后，就能给乡亲们，”\n\n£gezifu £gezifu “归我们！？”饶是这些战士纪律严明，这次的决定也让这个七十多岁的老人万分吃惊。\n\n£gezifu £gezifu 似乎从他出生为止，就从未发生过这种事情，哪有官爷会把粮食留给农民的。难不成，是某种骗术？\n\n£gezifu £gezifu “老先生，别吓着了，我们是红军，和以前的马家匪军和日本匪军是不一样的。我们在新疆已经改过了，所以不是骗你们的骗术。”看到老人吃惊的样子，这位红军吓了一跳，赶忙扶着老爷子，生怕他们出现意外。\n\n£gezifu £gezifu “红军，红军。”老人嚼着这个词。新疆已经改过了？老人依稀记得自己曾经听到过的传闻，没想到传闻竟然是真的。\n\n£gezifu £gezifu “是的，红军，我们是人民的军队，专门打地主和资本家的。”这个红军像是背书一样，说着。\n\n£gezifu £gezifu “地主我懂，什么是资本家？”这个老人有些好奇。\n\n£gezifu £gezifu “就……村里有钱的狗大户，剥削农民的叫地主，那资本家就是城里有钱的狗大户，剥削工人，工人和农民都是被压迫者，我们是好伙伴，专门去打压迫者的。”这个红军还在背书。\n\n£gezifu £gezifu 说实话，老人还是不太明白，不过他大致理解了红军是来帮他们的这一简单的道理。\n\n£gezifu £gezifu 几个孩子从老人身边跑过，孩子们的怀里都抱着一个小木板，他们睁着他们可爱的眼睛，说道：“红军叔叔，给。”\n\n£gezifu £gezifu 红军看着孩子们，笑着说道："
 COX.116.t: "分田"
 COX.117.a: "“叫什么兵爷？叫我战士就好。”"
 COX.117.d: "£gezifu £gezifu “这日子没法过了。”李敬无奈地在自家商会里坐着，忍不住自言自语道：“老子当年带着资产来兰州重建业务，本以为这里没有日本鬼子和民国的狗官，会更好发展。但没想到啊没想到，天下乌鸦一般黑，那什么湟中实业有限公司摆明了就是马家的手套，骗我们这些关内人投资，好方便敛财，呸！”\n\n£gezifu £gezifu 说着，他忍不住想吐马继援满脸口水，但听说马继援已经垮台了，也就算了。\n\n£gezifu £gezifu 他大声地对几个整理物品的伙计说道：“这些东西是我们最后的家当了，你们拿去典当了，补给你们当工资的。”\n\n£gezifu £gezifu 说罢，他一步一步地走到商会门口，心中叹息：“也不知道今后怎么办。”\n\n£gezifu £gezifu 刚走到门口的他一眼就瞧到几个当兵的列队向自己的商会走来。\n\n£gezifu £gezifu 这下他的脑袋如响雷了一样，差点没摔一跤。但他随即又想起自己的商会早破产了，而且马家的人也早倒台了，才松了口气。\n\n£gezifu £gezifu “是李敬吧，原泗阳商会会长？”为首的一个红军说道。\n\n£gezifu £gezifu 李敬这时猛地想起，这些兵应该是那什么共产党的兵，共产党是要杀富济贫的，这下他死定了。他急忙弯腰说道：“兵爷，你是不是找错人了？我已经破产了啊！”\n\n£gezifu £gezifu 谁知，话音未落，他就听到几个红军哈哈大笑，为首的红军笑完缓缓说道：“找的就是破产的。”\n\n£gezifu £gezifu 听到这句话，李敬整个人仿佛丢了魂一般，差点瘫坐在地上。看来刚出狼窝，又进虎穴了。\n\n£gezifu £gezifu 见李敬整个人都不好了，一个红军士兵拿出一袋大洋说道：“我们只是来收购你的破产商会的，别多想。”\n\n£gezifu £gezifu 听到是误会一场，李敬大喜过望地接过钱，说道：“兵爷，里头请，咱们商会还是有一些产业能用的……”"
 COX.117.t: "接收破产商会。"
 COX.118.a: "知人知面不知心。"
 COX.118.d: "£gezifu £gezifu 一大早寒气还没有吹散，一行数百人，就簇拥在红旗周围，跟随着数位红军战士，走向一个附近远近有名的佛寺。\n\n£gezifu £gezifu “方丈，根据相关人员举报，说你寺私下里虐待平民，并将平民虐杀以制成法器，根据玉树苏维埃会议指示，我们需要对你们寺庙进行搜查。”\n\n£gezifu £gezifu 围绕在红旗周围的农奴则喊叫起来，叫喃着诸如”我的孩子就是被寺庙抓走的”“我的丈夫……”\n\n£gezifu £gezifu 这些是一个月以来，红军工作组辛苦进行思想工作动员起来的农奴们。\n\n£gezifu £gezifu \"这家的方丈可是大好人啊。\"站在门口的香客方浩大声说道，心里却急得如热锅上的蚂蚁。\n\n£gezifu £gezifu 方浩是不信这些流言蜚语的，他是虔诚礼佛的人，当年，方浩逃荒的时候，被一个老和尚救了一命。寺庙怎么会是藏污纳垢之地呢？\n\n£gezifu £gezifu 老方丈出来唱红脸：“这位小施主，寺庙毕竟是佛家清修之地，能否通融一二啊。”\n\n£gezifu £gezifu 红军的班长周泽明就算再好脾气，这时候也不由得黑起了脸：“老方丈，红军已经向您提出了三次来检查的请求了，我们来检查是必须走的程序，如果为您开了先例，那其他寺庙怎么看，我们的工作就不好做了。”\n\n£gezifu £gezifu 双方交涉无果，人群开始按捺不住，对和尚们组成的“防线”发起冲击。\n\n£gezifu £gezifu 和尚们终究抵抗不住人们的推搡，群众们把和尚冲出了一个缺口，然后鱼贯而入。\n\n£gezifu £gezifu “天哪。”A不禁发出悲鸣，但是事已至此，他只能跟着进去。\n\n£gezifu £gezifu 但是当他进入方丈的禅房里搜出的地下室时，他简直无法相信自己的眼睛。\n\n£gezifu £gezifu 眼前的景象，简直可以称为阿鼻地狱，一群被铐上手铐脚镣，全身被尘土覆盖的人，在盯着他看，他们的身上可以看到无数的伤疤，有的已经结痂，有的还在灌脓。\n\n£gezifu £gezifu “天那，这是什么？”旁边传来的声音让他回过神来，但是他看见了什么？\n\n£gezifu £gezifu 一个不算精致，但是很明显经过了精心打磨的法器映入眼帘，但是重点不在于法器是干什么用的，而是法器的材质————那是一截人的小腿骨。\n\n£gezifu £gezifu 到此，方丈平日里苦心扮演的”红脸“被无情地揭穿，众人才发现，平日里佛光满面，慈祥的老方丈，背地里是一副怎样可怕的恶魔面孔——不，他就是行走人间的恶魔。"
 COX.118.t: "红脸的活佛"
 COX.123.a: "“如果还有要求，我们会通过牧民联系你的。”"
 COX.123.d: "£gezifu £gezifu 蒙疆南部的戈壁是世界上最荒凉的地区之一，有诗曰：“大漠连天一片沙，苍茫何处觅人家。\n\n£gezifu £gezifu 除了一些牧民，很少有外人会踏足这片地区。\n\n£gezifu £gezifu 然而就在这危险的地方，几个红军战士骑着马和马车正在行进，他们已经走了很长的路，而前方依然有很长的路要走。\n\n£gezifu £gezifu 路途漫漫，几个红军战士开始闲聊起来。\n\n£gezifu £gezifu “班长，我真的不信那些内地军阀能找着地方。”\n\n£gezifu £gezifu “可不么，我跟你说，他们估计连枪都不知道怎么拿。”\n\n£gezifu £gezifu “别瞎聊了，毛主席说了，战略上轻视敌人，战术上要重视敌人。”\n\n£gezifu £gezifu 刘班长一边喝止了部下的闲聊，一边打开了地图。\n\n£gezifu £gezifu 拜这恶劣的自然环境所赐，蒙疆南部人口稀疏，又因为人革委与日本的大战，本来稀疏的人口更是跑得没几个了。\n\n£gezifu £gezifu 这也是为什么，根据地打算和晋系的部队在这里交易军火。\n\n£gezifu £gezifu 刘班长也能猜到中央的意图，如果单单为了几条破枪，中央绝对不会让战士们冒着生命危险来到蒙疆。更重要的是，能不能借此机会获得内地的军事情报，甚至是争取一部分军队起义。\n\n£gezifu £gezifu 想到这，刘班长不禁高声喊了起来：“驾！驾！同志们，咱还得再快点！”\n\n£gezifu £gezifu 另外一边，李班长现在其实挺害怕的。\n\n£gezifu £gezifu 这不是李班长第一次倒卖军火，李班长给马家军卖过，给高宗武卖过。但是跑到蒙疆来卖，倒是第一次。\n\n£gezifu £gezifu “哥，咱这也忒冒险了，这要是让日本人发现了，不得把咱…”\n\n£gezifu £gezifu “你听过一句老俗语吗？叫撑死胆大的，饿死胆小的，上面的军饷就给这么点，咱得自己想办法！”\n\n£gezifu £gezifu 李班长用两只手把他的部下拎了起来，一双溢满杀意的眼睛狠狠地盯着他！\n\n£gezifu £gezifu “你不想当穷光蛋吧，想想你埋头种地的爹娘！想想你老婆！”\n\n£gezifu £gezifu “大哥，大哥，你看西边！”\n\n£gezifu £gezifu 李班长向西边望去，扬起的烟尘和夕阳构成了一道美丽的图画。\n\n£gezifu £gezifu 与这样的美景一同出现的，还有马蹄声。\n\n£gezifu £gezifu 随着尘埃散去，这几个晋绥军的士兵终于看清了他们的买家是什么人。\n\n£gezifu £gezifu “这…不可能啊，我还以为你们早就死光了！”\n\n£gezifu £gezifu 只见带头的军官，帽子上赫然缝着一颗红星。\n\n£gezifu £gezifu “李先生！久仰大名了！”那个带头的军官说着做了一个拱拳的手势。\n\n£gezifu £gezifu 拱手啊！这可是中国人的礼仪！\n\n£gezifu £gezifu “不敢不敢，长官抬举了。”\n\n£gezifu £gezifu “闲话不多说了，让我们看看货吧。”\n\n£gezifu £gezifu “长官您看，这都是全新的日本枪。”\n\n£gezifu £gezifu “嗯，都是好枪。”\n\n£gezifu £gezifu 那个军官拿起一把枪细细端详，正如晋绥军的人所说，崭新的日本突击步枪。\n\n£gezifu £gezifu “李先生，这些枪，是从哪里来的？”\n\n£gezifu £gezifu “刚从西北方面军运输队拿的，妥妥的新品。”\n\n£gezifu £gezifu “那好吧，这些黄金你们可以拿走了。”"
 COX.123.t: "荒野大镖客：冒险"
 COX.124.a: "有钱什么都好办。"
 COX.124.d: "£gezifu £gezifu  李二花了三天时间走完他所在的小城周围的村庄。\n\n£gezifu £gezifu “娘嘞……”目睹完马家军的剥削，破败的村庄，恍如骷髅般的活人。李二嘴里只蹦出来这一句呻吟，他连着这三天都没睡安稳。\n\n£gezifu £gezifu 明天就是交报告的日子了，想到这小城还没调查过，他决定今天就不出去看那些渗人的光景了，花一天时间来把这小城“调查”一番。\n\n£gezifu £gezifu 换了身在这城里足够普通，实际上已经是破旧不堪的衣服，李二开始在这小城晃荡起来。小城虽然也是一副萧条景象，但好歹不算破败，李二走在这起码不会做噩梦。\n\n£gezifu £gezifu “兄弟，来包卷烟。”\n\n£gezifu £gezifu 店主眼皮都没抬一下，扔包粗糙的烟过来，上面写着“湟中卷烟厂”，然后店主说了一个高得让人咋舌的数字。“娘嘞，咋这贵啊？你宰我呢！”“宰？都这个价！你上别处问去！绝对没宰你！”店主依然是眼皮都不抬一下。\n\n£gezifu £gezifu 李二四处问了问，还真是！怎这贵啊？一包烂卷烟赶得上五斤肉了！无奈，他灰溜溜地走了。\n\n£gezifu £gezifu 第二天晚上，到了宵禁时分，李二在约定地点把报告交给接头人，偷偷趁黑摸回去，一双大手突然拍上了他的肩头，李二回头一看，一个胖乎乎的马家军！“军……军爷……”李二腿当时就软了，“我……我……”完犊子，这次得进去了。\n\n£gezifu £gezifu “违反宵禁条例，跟我回公所去，接受讯问！”马家军大声吼道，手上却没有动作，一双大手仍死死摁在李二肩上，眼神却流露出一种……渴望？\n\n£gezifu £gezifu 李二顿时心领神会（废话，这事俺以前又不是没干过），手伸进裤包，拿出一叠钞票，堆着笑脸双手呈给那个马家军。马家军马上笑开了花，“不错，算懂规矩，”他扯过钞票，“还有，新来的吧？以后办事，就找兄弟，不过票子得备足！”转头走了。留下李二愣在那里。\n\n£gezifu £gezifu 李二脑子迅速转动起来，好！有门路！这下任务好执行多了！\n\n£gezifu £gezifu 他走回联络处，拿出一个皮箱子，往里面堆了些钞票，然后出门，向公所走去。"
 COX.124.t: "有钱能使“马”推磨。"
 COX.125.a: "“下次注意点，人生不是考核。”"
 COX.125.d: "£gezifu £gezifu 胡必定正骑着马前往伪蒙一边防哨站，此次他的任务是伪装成一名伪蒙哨兵，并对西北方面军进行侦查，打探其下一步的行动。\n\n£gezifu £gezifu 出发之前，组长语重心长地告诉他千万不能掉以轻心，但他并没有太多在意，都是黄种人，都挺像的，再说蒙语他也学得不错，不会露馅的。\n\n£gezifu £gezifu 于是他挥了挥手说知道了，然后就头也不回地骑上马走了。\n\n£gezifu £gezifu 不过胡必定毕竟还是个新手，第一次执行任务还是有点紧张。尽管西北方面军里的鬼子不会无聊到去侦查一个兰州大战后荒废的伪蒙疆哨站，但说不定呢？说不定鬼子在西宁大战之后又加强了警戒呢？胡必定想着，攥紧了拳头。\n\n£gezifu £gezifu 黄昏时分，走了一整天的他终于抵达了哨站。他把马拴在外面，环顾四周。在确定没人后走进这小小的哨站，他靠墙坐下来想休息一会儿。\n\n£gezifu £gezifu 接着顺手拿起了放在桌子上的水，下意识地就喝了一口。\n\n£gezifu £gezifu 他也不知道自己是怎么睡着的，醒来之后就发现自己被绑了。“该死！”胡必定暗暗自骂，“我怎么就这么没一点警戒意识！”\n\n£gezifu £gezifu 这时哨站的门突然被打开，一个身着特高科制服的人走了进来。胡必定闭上眼，做好了赴死的决心，但那人却蹲下来摘下了帽子，撕掉了假胡子。\n\n£gezifu £gezifu “胡必定同志，看来这次考核你不及格了。”组长笑着对他说。"
 COX.125.t: "一次特训"
 COX.126.a: "“兄弟阋于墙，外御其侮。”"
 COX.126.d: "£gezifu £gezifu 火光，冲天的火光\n\n£gezifu £gezifu 这便是坦克兵佐藤贯太郎死前最后看到的\n\n£gezifu £gezifu 这火光对他来说象征着毁灭，但是对西宁来说，火焰则是象征着重生。\n\n£gezifu £gezifu 西宁城内的大街上，几个市民看着被击毁的坦克啧啧称奇。\n\n£gezifu £gezifu “这一仗打的还真漂亮。”\n\n£gezifu £gezifu “谁说不是呢？”\n\n£gezifu £gezifu “这么大的铁疙瘩，一炮就给打趴下了。”\n\n£gezifu £gezifu 突然，几个巡逻的红军战士发现了他们\n\n£gezifu £gezifu “老乡，这里不安全，日本人随时可能反攻，大家还是快回家去吧。”\n\n£gezifu £gezifu “小同志，你们打的真漂亮！二十多年了，可算让日本人吃了点苦头！”\n\n£gezifu £gezifu “老乡，你都给我说得不好意思了。”\n\n£gezifu £gezifu “以后，是不是还要打到兰州，打到西安去啊？”\n\n£gezifu £gezifu “老乡，我们以后不仅要打到西安，我们还要解放全中国呢！”\n\n£gezifu £gezifu “唉呦呦，你这个小同志，年纪不大，口气倒是不小啊…”\n\n£gezifu £gezifu 指挥部内，毛岸英正在对着地图思索。\n\n£gezifu £gezifu “陈叔，日本人已经被我们完全打退了。”\n\n£gezifu £gezifu “嗯，短时间内，已经无力再发起攻击。”\n\n£gezifu £gezifu 陈赓又说：“这一战，敌人出兵急促，缺少计划，之前又被马家所消耗，能赢不算意外。”\n\n£gezifu £gezifu 说完这句话，陈赓又对着毛岸英点了点头，说：“但是你这一仗确实打得好啊，看来，我这个老头子，可以退休了。”\n\n£gezifu £gezifu “陈叔，这次胜利，是我军上上下下全部战士和指战员创造的，少了一个都不行。”\n\n£gezifu £gezifu 说完，两人哈哈大笑，指挥所弥漫在欢乐的气氛中。\n\n£gezifu £gezifu 就在此时，电台兵悄悄拿着一份刚刚译出的电文，递到了毛岸英的手里。\n\n£gezifu £gezifu 致红军\n\n£gezifu £gezifu 这里是国民革命军，这里是国民革命军，我部近日听闻你部于西宁血战日寇，我蒋经国部带领的国民革命军所部三千七百二十一人，愿为国而战，共击日寇!\n\n£gezifu £gezifu 如若同意，烦请前往西宁城正南六公里处共商国事。\n\n£gezifu £gezifu “陈叔，您怎么想？咱们去还是不去？”"
 COX.126.t: "西宁之战胜利！"
 COX.127.a: "现判处旧地主吴恩开罚款……并处劳改……"
 COX.127.d: "£gezifu £gezifu 在吴恩开在戏台上被愤怒的群众狠命殴打的风波停息之后，几位新被选上的农会成员回到农会办公小屋讨论如何处置这个旧地主。\n\n£gezifu £gezifu 他们刚坐下来，王浩就迫不及待地开始发言：\n\n£gezifu £gezifu “我们必须枪毙他！他作恶多年，不枪毙不能平息乡亲们的怒火！”一个字又一个字，从王浩咬紧的牙关里挤出来。\n\n£gezifu £gezifu “我也赞成。”阿鲁图木紧跟着发表了自己的意见。\n\n£gezifu £gezifu “枪毙他合情合理，没什么好说的。”一位本地的土改工作员代表说。“一方面能平息众怒，另一方面也能消除乡亲们对于旧地主卷土重来的恐惧，还能为邻近村镇的土改、公审、诉苦大会竖一根标杆，大家才会知道我们是真心想帮助他们，而不只是一群新来的兵痞子赶走了旧地痞。”\n\n£gezifu £gezifu 另一位成员摇摇头：“枪毙固然是好，但是枪毙了也就完事了。他欠了那么多血债，哪里是吃一颗枪子儿就能还清了。我看，倒不如狠狠地罚他一笔钱，然后把他送去劳改。”\n\n£gezifu £gezifu “不枪毙他？怎么可能！我儿子走前跟我说的话我还没忘呢！”王浩动了火。“劳改？真他妈便宜他了！”“老兄消消气，你的事大家都知道，也都理解。”先前那位代表起身给王浩泡了一杯茶——当然，从吴恩开家里缴来然后平分给他的那一份——然后开口说：“你先冷静一下，听听我说的有没有理。我们现在把吴恩开枪毙了，很容易，写个布告贴村口，找个时间把他拉到戏台去，‘崩’的一下就完事了。但是，这就出现几个问题：第一，我们不能把他的尸体挂村口示众，一方面天气热容易腐烂，有味儿，还容易长虫，到时候传染了咋办？另一方面，我们总不能像他一样，做他做过的事吧！这样怎么体现我们和他的不同呢？”\n\n£gezifu £gezifu 王浩端着茶杯，点点头。\n\n£gezifu £gezifu “然后，既然不能挂着，那总得找个地方埋吧，你说埋哪里好？村后头的墓地？那是大家的，他凭啥埋那里去啊？火化了吧，骨灰要咋处置？有谁家的田愿意撒他的骨灰吗？还是说有谁愿意供着啊？没人要嘛！对不对？”\n\n£gezifu £gezifu 几位代表顿时笑了起来。王浩紧绷的脸也略微放松了些。\n\n£gezifu £gezifu “那把他拉去劳改的好处就多了，你听我说啊，”他接着说。“第一，他有劳动。有干活总有粮食嘛！到时候他种一年地，先交罚款，还有分给大家的公粮，剩下的才留给他自己吃嘛，多好的事啊！这是一。第二，劳改嘛，大家监督，谁路过有事没事都能去看看他有没有在干活。你想想，以前大家吃的苦，现在要他也吃一遍，而且还是千百遍地吃——他要是不好好干活，产的粮食不够数，他自己就没饭吃，咱们又不额外拨粮食给他——而且，要是他偷偷摸摸搞小动作，咱们还可以把他拉去戏台再批斗一遍嘛！”\n\n£gezifu £gezifu 这一席话，终于说服了王浩。阿鲁图木皱着眉思考了很久，最终也同意了。\n\n£gezifu £gezifu 第二天，农会就四散出动，收集大家的意见，然后向乡亲们解释政策。\n\n£gezifu £gezifu 一周后，农会发布了一份通告。"
 COX.127.t: "黎明"
 COX.128.a: "“保证完成任务！”"
 COX.128.d: "£gezifu £gezifu “啥？还得去西边？！咱这已经够西了啊！”李二惊愕地大喊。\n\n£gezifu £gezifu 青海已经进入根据地的版图，他在青海的任务也圆满完成，他便兴奋地收拾好行囊，回到了新疆，可当他兴冲冲回到营部，准备继续当他的班长时，营长却通知他：“上级的命令，你不用再回来了，去乌鲁木齐休整几天，然后去中亚继续执行任务。”\n\n£gezifu £gezifu 李二顿时慌了，尽管去搞什么渗透不用操练，不用跑操，手边还有大把大把的钞票，可是这刀尖上行走的日子实在难熬，担惊受怕的，总是得提防着周围人的\n\n£gezifu £gezifu 目光，还总得时刻转移，防备着随时会破门而入的警察－他有多少天没睡过好觉了！在新疆，虽然累些，但总是安全的，更主要的是，这个偏远的地方，头一次让他有了家的感觉，让他想起了自己十几岁时，日子艰苦却时刻充满欢声笑语的老家。\n\n£gezifu £gezifu “营长，通融通融嘛，我是真的想留在咱们营里啊！”李工堆起笑脸，掏出一根烟，准备给营长点上。“李二，少搞这一套！我现在已经管不了你了！你现在已经隶属情报部，不再属于我们营了！”营长没接烟，盯着李工，沉默良久，才吐出这一句话。\n\n£gezifu £gezifu “啥？！”李二登时双腿一软，瘫在地上，眼泪夺眶而出。\n\n£gezifu £gezifu 营长伸手抹去了自己的细水，把李二扶起来，给他点着一支烟，自己也点上，两个人就这久坐着抽烟，一言不发。\n\n£gezifu £gezifu “李二”\n\n£gezifu £gezifu “到……到！”李工回过神来，急忙站起来。\n\n£gezifu £gezifu 营长缓缓开了口：“李二…如果你还认我这个营长…就执行我给你下的最后一道命令……“他眼神坚定起来，铿锵有力地说道：\n\n£gezifu £gezifu “完成上级指示，服从中央命令！”\n\n£gezifu £gezifu 李二猛地抹了一把泪水，用尽全力喊道："
 COX.128.t: "最后一道命令"
 COX.130.a: "群众自己保护自己……"
 COX.130.d: "£gezifu £gezifu 张泽民不太记得他擦过这三杆枪多少次了。\n\n£gezifu £gezifu 但这三杆枪承载了他许多年的记忆。\n\n£gezifu £gezifu 第一杆枪是30年前从一个地主家里抢来的。那时他看着赤卫队和红军一起打土豪分田地，多风光啊！可红军后来长征去了陕北，而他为了躲避白军的搜查与屠杀，也不得不东躲西藏，枪也跟着他东躲西藏。\n\n£gezifu £gezifu 第二杆枪是他在20年前作为民兵和新四军一起打鬼子缴的，他于是把第一杆枪交给他的弟弟。一同共抗鬼子的侵略。\n\n£gezifu £gezifu 造化弄人，他弟弟牺牲了。不仅如此，日本杀入了重庆，他甚至来不及安葬弟弟就被迫向西逃亡，还作为马家军临时拉来的壮丁参加了几年前的那场兰州大战。尽管他奋不顾身地英勇杀敌，而且又从鬼子手上缴到了第三杆枪，但还是败了。\n\n£gezifu £gezifu 都失败了，不论是他，还是中华民族。\n\n£gezifu £gezifu 战乱中，伤痕累累的他隐姓埋名，一心耕作着地主分给他的那一块小得可怜的土地，只是每过几天就会擦一下他那没有子弹的三杆枪罢了。\n\n£gezifu £gezifu 但是，让他十分意外的是，红军们又回来了，一如30年前一样分了田。他本以为这次也会失败，所以既没有参军也没有支前。\n\n£gezifu £gezifu 但红军，依旧是那个红军，即使他什么都没有做，红军的战士们依旧对他和睦无比，会把地主的财产分给他，会鼓励他参加村苏维埃，履行自己神圣的权利，会号召大家参与什么群众运动，让群众们自己守住自己的土地。\n\n£gezifu £gezifu 于是张泽民觉得总该做出点改变，他拿起自己的三杆枪，又仔细地擦洗起来。随后，他拿着枪，向着村民兵队的建筑走去。"
 COX.130.t: "三杆枪"
 COX.131.a: "“那不用慌，老人家我还能再干十年。”"
 COX.131.d: "£gezifu £gezifu 在青海马家军的治下，要是说什么产业是青马的龙头产业，那自然离不开羊毛贸易。在20年代到40年代之间，马步芳逐渐垄断了羊毛产业并不断以此为根基进行贸易并购入现代化的武器，以满足他的军队。\n\n£gezifu £gezifu 羊毛是青海马家经济的重中之重，可当马家忽然垮台时，各个马家的牧场遭受到的打击也是毁灭性的。\n\n£gezifu £gezifu “跑得了人，哪里跑得了草场！”红军战士还没走进这个牧场，就听到了一个老头在牧场前无力叹息着。\n\n£gezifu £gezifu “老人家，发生什么情况了？”一位战士听到声音，急忙来到坐在门口唉声叹气的老人面前，询问道。\n\n£gezifu £gezifu 这个老头看着六七十岁的样子，见到来了个兵，他吓得一哆嗦，但看到帽子上的红星后，才松了口气，说道：“还能咋样？一堆没良心的带着羊跑了！现在牧场里的羊没多少了！”\n\n£gezifu £gezifu “老人家，那之前管事的呢？”\n\n£gezifu £gezifu “哈哈！他带头跑的！我是想不明白了，他们能跑到哪里去？”\n\n£gezifu £gezifu “老人家，我们是负责组织牧区恢复生产的工作小组，不知道现在这个牧场还剩多少牲畜，出逃的管理者能把牛羊带到哪里?”后面紧跟着的是一个比较稳重的队长，他询问老人。\n\n£gezifu £gezifu “哈哈，这个牧场都是马家的，牲畜也都是马家的，跑的那个也是马家的!这些天，放牧的也不敢来牧场了！也分走了不少牛羊回各自的部落，要不是我部落没了，我也跑了。”老头一口气讲了不少话:”看你们的样子，是来接管牧场的吧？算你们运气不错了，这个牧场主要负责人都跑光了，你们进去直接接管就行，不需要费太多功夫。”\n\n£gezifu £gezifu “谢谢老人家，但不知道牧场里还有没有牧民？我们此行的目的是准备让协调牧民管理牛羊的，到时候的收入牧民和牧场五五分成……”\n\n£gezifu £gezifu 话音未落，只见老头眼前一亮，说道："
 COX.131.t: "恢复生产"
 COX.132.a: "指挥官走向了自己的士兵。"
 COX.132.d: "£gezifu £gezifu 西北绵延的山丘以北，矮草覆盖的高原之上，一支军队正在行进。不知晓敌人是否仍紧追不舍，战士们不敢驻足休整，更不敢回头，埋葬倒下战友们的尸首。他们曾是光荣的国民革命军，但现在却成了一帮缠着破褂子，使着烂枪，狼狈逃窜的劫匪。\n\n£gezifu £gezifu  蒋经国不知道这样的日子何时才能到头。\n\n£gezifu £gezifu 自从父亲身死之后，统一战线便分崩离析。关于那段黑暗的日子，蒋经国的记忆已经模糊了，他只知道，军队四散奔逃，全国一片混乱…中国已经完蛋了。被一支溃军裹挟着，他来到了辽阔的西北——在那时为数不多尚未被战火触及之处。\n\n£gezifu £gezifu 在得知了父亲的死讯后，悲愤交加的他迫不及待地想要重新升起抗日的旗帜——在兰州，他得到了马步芳的接待。但除了这冷冰冰的“款待”之外，雄踞西北的马家不愿意提供再多东西了。他们“邀请”蒋经国留在兰州，说是要“暂避日本人的耳目”，但实际上，却将他软禁了起来。\n\n£gezifu £gezifu 于是时间便这样继续过去。马家仍旧垄断着西北贸易，唯一的差别只是赚的钞票换成了日元。大量的财富涌入了马步芳的口袋，兰州也因此夜夜笙歌不息。\n\n£gezifu £gezifu 对于蒋经国来说，那是一段梦幻的日子。美酒的香气熏得他如痴如醉，交往的名媛显露着举手投足的高雅，觥筹交错的响声让他流连忘返。他开始觉得自己回到了上海滩的十里洋场，回到了氤氲着薄雾的杭州西湖。在侵略者的旗帜下，中国人民正享受着半个世纪以来一直梦寐以求的宝物——和平。\n\n£gezifu £gezifu 但当蒋经国带着醉意迈入晚秋的寒夜时，却见到了别样的景象——兰州的街头，数个老兵正横在街上，他们饿得面黄肌瘦，身上的军装沾满了人类分泌的最肮脏的东西。但一旁的行人只是低着头，绕行经过，仿佛在避着什么瘟神……\n\n£gezifu £gezifu 此情此景，伴着深秋呼啸的晚风，让迷醉中的蒋经国猛地清醒过来——他本应看得到隐藏在“大东亚共荣”幌子下血淋淋的现实；他本应挺身而出，继承父亲的遗志；他本应与这些战士们并肩作战，一道牺牲在为祖国流血牺牲的路上……\n\n£gezifu £gezifu 摆脱了浑身的酒气，迈着稳健而刚强的步伐。"
 COX.132.t: "过去：于绝望深处"
 COX.133.a: "一如襁褓中的根据地，渴求片刻喘息。"
 COX.133.d: "£gezifu £gezifu  又一起流民与原住民的冲突，又一场跨越边境的劫掠，又一个不眠的工作之夜……\n\n£gezifu £gezifu “报告，岸英同志，又有西北局的电报。”\n\n£gezifu £gezifu 又一件来自青海的消息，毛岸英揉了揉太阳穴，强迫自己保持清醒，面对又一个棘手难题，“青海的情况一向复杂……请拿过来吧。”\n\n£gezifu £gezifu “俺都提前看过了，真没啥事。要俺说，你还是快些去休息才……”\n\n£gezifu £gezifu “不用了，日本人随时都会打过来，西宁的守备还说不上完善，我还不能……”\n\n£gezifu £gezifu “可电报上说，日本人还在兰州打转转呢。”\n\n£gezifu £gezifu “还有牧区的集体化，商路的协商，苏维埃政府的筹建……”\n\n£gezifu £gezifu “俺觉着，青海的同志们都处理妥了。”\n\n£gezifu £gezifu “但是……小王，新疆最近遭了旱灾，许多农民的收成打了对折，有的村甚至颗粒无收。在那些地方，农民们失了土地，被打倒的地主又蠢蠢欲动，幸好各地农会从中斡旋，调拨了当时收缴的粮食赈济，才不至于让反动派得胜……解放区尚且如此，那么身处白区的同胞们呢？这几年灾殃不断，国民党卖国贼的苛捐杂税却一点没减，导致那么多人，哪怕九死一生，也要翻山越岭，逃到解放区来……我常想，要是能早点打回去，哪怕一天也行，能拯救多少人的性命？”\n\n£gezifu £gezifu “俺也是逃荒过来的，再懂不过了……但岸英同志啊，虽然俺没咋读过书，但咱觉着，就算您是个再厉害的人，但天公不作美，盐碱地上也长不出庄稼啊！新疆这地儿除了旱了点，也挺好的，俺都做好一辈子不回家的准备了！”\n\n£gezifu £gezifu “哈哈，要是我们真把鬼子赶出去了，你也不打算回去了？”\n\n£gezifu £gezifu “俺老家的爹娘早让鬼子打死了，回去干逑？要真能把鬼子全打跑，俺要坐着卡车，全国上下都逛一遭……害，想那么远也没啥用……俺今天是代表整个司令部来的，主席，您必须睡觉了。”\n\n£gezifu £gezifu “好好，等我看完这封电报就去休息。”毛岸英猛一起身，但强烈的晕眩感顿时向他扑来。\n\n£gezifu £gezifu 他真的需要好好休息一下了。"
 COX.133.t: "良机难觅"
 COX.134.a: "革命者如山巅青松，风吹雨打不摇动。"
 COX.134.d: "£gezifu £gezifu 都说等待最为磨人，对身处被动地位的人更是如此。\n\n£gezifu £gezifu “……综上所述，目前中国各势力分布错综复杂，日本帝国的影响虽有衰退，但仍十分强大，而根据地内部远谈不上安定……虽然我不想承认，但，同志们，解放全国的理想仍然遥远，而主动权，恐怕并不在我们手上。”\n\n£gezifu £gezifu 毛岸英顿了顿，目光扫向广播室中风尘仆仆的干部们。\n\n£gezifu £gezifu 他们来自五湖四海，面孔不一、口音迥异，但革命使他们聚在这里，共议中国的前途。\n\n£gezifu £gezifu 毛岸英缓和了情绪，继续宣布今早的决议——\n\n£gezifu £gezifu “但处于被动地位，不代表我们只能坐以待毙。人固然要受制于环境，但革命者能从看似不可能中找到可能。我们过去几年的成就正是最好的例证。当年从贝加尔湖启程之时，很多战士都只是抱着死前看一眼家乡的念头；但时过境迁，广大西北地区已经解放！我们打倒了地主与反动阿訇，击退了疯狗般的西北军……同志们，我们能做的远不止这些，我们必须抓紧机会壮大根据地，发展农业生产，建设轻重工业，武装更多红军。这样，一旦解放全国的时机到来，我们才能准备万全……制定第一次五年计划，目的是恢复农业生产，并根据农业生产水平相应地发展轻重工业……”"
 COX.134.t: "且听风吟"
 COX.135.a: "不论东方发生了什么，我们都不能坐视不管。"
 COX.135.d: "£gezifu £gezifu 自苏联崩溃起，新疆的边境就从未有过一天安稳。中亚的诸多极端分子在西部边界来去自如，北方也时常游荡着西伯利亚军阀的劫掠队。至于东部边境，得益于马家长期平稳安泰的统治，长期以来并无什么大的直接威胁。除了在战后从未间断过的难民潮外，就只有少数劫匪盘踞在省界附近，威胁着边界的安全。\n\n£gezifu £gezifu 自接管政权以来，共产党采取了一系列积极的举措以确保边境安全。随着民兵武装的建立，北疆的村庄得到了有效的防备；农会一类基层组织的设立，则有效地阻止了分离主义思想自西方的蔓延；而对于从中原逃荒而来的难民，则建立了一套完备的登记与土地分配政策……但最近在新疆的东边，异动正愈演愈烈。\n\n£gezifu £gezifu 最近数日，自东部入境新疆的难民数量成倍增长。尤其是最近一个月，有报告的跨境袭击数量几乎是土改期间袭击的总和。"
 COX.135.t: "边境异动"
 COX.136.a: "与他们一道启程！"
 COX.136.b: "祝工作组的同志们好运！"
 COX.136.d: "£gezifu £gezifu 事态紧急，容不得半分拖沓——在接收到边境告急的消息后，驻留在乌鲁木齐的干部们不约而同地做出了这样的判断。各自搬把椅子，将散乱的边境线报摊在桌上，不消小半个小时，表情凝重的干部们就围坐在一张长桌左右。\n\n£gezifu £gezifu “难民和袭击都在急剧增加……边境扛得住吗？”\n\n£gezifu £gezifu “很勉强，虽然我们已经采取了一些措施安置难民，保卫聚居地，但以现在冲击的强度来看，恐怕远远不够……”\n\n£gezifu £gezifu 即便是经受过土改锻炼的干部，也没办法在短时间内从繁杂凌乱的信息中梳理出青海此时的情况，更别说找出应对之策。一时间，整个会议陷入了轻微的混乱。\n\n£gezifu £gezifu “根据最近打探到的情报，马家军在东边和某个——也可能是某些——敌对武装交火。”坐在桌子靠墙一侧的刘少奇翻看着桌上的文件，一开口就给会议丢下一颗重磅炸弹，“马家在抗战中一直明哲保身，青海是抗战后全国较为安全的地区之一。但是现在从马家逃到我们新疆这里来的群众数量明显增加，这和我们以前的认知明显不符。”\n\n£gezifu £gezifu “有些最近逃难来的群众说马家军在和军队交火，也有的说马家军在和一伙到处烧杀的土匪打仗。另外，大部分人都提到马家军几个月前开始征收“战争税”，有个别人说那是为了“抗日”，但是不少人觉得那就是政府想了个新名目捞钱。”一位负责管理难民工作的干部补充。\n\n£gezifu £gezifu “很好，这个消息基本验证了我的猜测。”刘少奇胸有成竹地下了结论，“我认为马家军作战的对象大概率是日本人。”"
 COX.136.desc: "£gezifu £gezifu 会议的气氛顿时一沉，大家不约而同地想起二十多年前抗战的惨象：日本帝国主义铁蹄践踏、汉奸走狗的猖狂作乱、贫苦劳动者的哀嚎哭喊，无一不历历在目。\n\n£gezifu £gezifu “最近东部匪患加重，显然马家军已经无力清剿。这也证明对手实力不一般，需要马家军抽调大部分兵力去打仗，暂时无暇剿匪，这样才说得通。”刘少奇的手指在地图上在青海东边划了一圈。“首先排除土匪，没有任何土匪能和一地军头对抗而不落下风。然后排除南京国民政府，他们没有理由攻击马家。那么最后只剩下一个答案：日本人。”\n\n£gezifu £gezifu 干部们顿时低声讨论了起来，毛岸英隐约听到一两个声音表示不希望掺和马家的事。他思考良久，最终开口：“同志们静一静，听我说！”等会场基本安静下来，他才开始说：“自古以来，河西走廊就是通往新疆的要冲，如果放任那里陷入混乱，恐怕对根据地百害无益。最坏的情况，比如落入日本的掌控，那么新疆根据地就会暴露在日本帝国主义的面前，到时候革命前途难料。无论如何我们都必须干涉东部，最坏也要做好明天就打抗战的准备。”\n\n£gezifu £gezifu “我提议大家投票表决是否要干涉。”刘少奇说。\n\n£gezifu £gezifu 经过毛岸英一番话和一场短暂的辩论与问答，终于，几位原本对干涉持担忧态度的干部也转变了看法，干涉马家的决议得到全票通过。\n\n£gezifu £gezifu “现在局势尚不明朗，最好先派一个工作组去打探情况，也作一些准备。”刘少奇提议。\n\n£gezifu £gezifu “毛岸英同志，这件事就交给我们这些老同志来办吧。”稍加思索，一旁的陈云站了起来，“和鬼子斗了二十多年，比这更恶劣的情况我们可没少见！”\n\n£gezifu £gezifu “也算我一个。”李先念也不甘落后，“我在西征的时候和马家军交过手，他们的秉性我都门儿清……”"
 COX.136.t: "紧急会议"
 COX.166.a: "无产阶级在文化事业上的一次小小胜利。"
 COX.166.d: "£gezifu £gezifu “不得了了啊！工友们快来看啊！”一位工人拿着报纸风风火火地走了进来。不过由于正在生产，厂房里机械隆隆作响，没几个人听见他在说啥。\n\n£gezifu £gezifu “诶等一下，机器先别停，咱去食堂那边把事儿说清楚，走走。”工作组长瞥见了拿着报纸的工人,对着大伙说。\n\n£gezifu £gezifu “你们看！”拿着报纸的那位说，同时把报纸一扬。谁都能看见，报纸的第一页赫然用大字写着“我们的经历”、“乌鲁木齐第一机械零件厂工人的心声”、“作者：工人王洪全”。\n\n£gezifu £gezifu “同志们啊，咱们厂第一次投稿就上报纸头条了！”“哇！”“好！”“洪全呢？快去把洪全喊过来！”\n\n£gezifu £gezifu 欢喜的工人们找到洪全的时候他还在车一枚螺丝，听见自己的文章上报也只是微微笑了一下，对着他的工友们说：“这可不能说只是我一个人的光荣，你们看这里。”他并且指了指标题下面的小标题，“这是属于我们整个厂，整个工人阶级的光荣，这下写文章向大伙宣传的能力就不被反动派们垄断了。”他顿了顿又说：“同志们，也不要光我自己写啊，咱们都要写，让整个根据地人民知道我们工人阶级学习之后不光能生产，也能创作！”"
 COX.166.t: "登报"
 COX.167.a: "“同志们，我是乌鲁木齐第一机械零件厂的工人王洪全……”"
 COX.167.d: "£gezifu £gezifu “同志们！有件事我想告诉大家，”午休时分，负责扫盲工作的文化员拿着一份报纸来到了工人们之中，“现在根据地创立了新疆日报，现在急需群众们的广泛投稿，各位在夜校里也学了三个多月了，快认识一千多个汉字了。有没有人想要往那上面投稿？”\n\n£gezifu £gezifu 刚刚还在愉快地交谈着的工人们，此刻都面面相觑。对于整日在工厂里劳动的工人来说，写文章向报纸投稿离他们太远了，那种坐在明亮的办公室或者书房里拿着钢笔或者毛笔，正襟危坐着用大笔写下各种各样文章的生活，是他们所难以想象的。\n\n£gezifu £gezifu “文化员同志，能不能我们说出来你来帮我们写啊？”一个姓王的工人说话了。\n\n£gezifu £gezifu “哦……这可不行啊，你看。”文化员拿出了那份要求，“这上面说了要求得自己写不能找别人代笔，这可是考验我们根据地扫盲运动的成果呢。”\n\n£gezifu £gezifu 晚上到了，吃完饭在工厂活动室里，年轻的小伙子们三三两两聚在了一起讨论起今天文化员同志所说的事情。\n\n£gezifu £gezifu “诶，小王，咱们厂里就你最机灵，而且也学得最快最好，要不你来代表我们厂写这个这个，哦……投稿？”\n\n£gezifu £gezifu “哎呀，我这水平还不够呢，也才认识了一千五百个字而已。我怕我这写了发到报纸上去让全新疆的老百姓们笑话，也给咱工人丢脸。”小王连连摆手。\n\n£gezifu £gezifu “你这什么话？小王同志，我得批评你啊。”一旁的文化员慢步走过来，“你当时在学工人和天的时候不是说天像工人上下叠着吗？怎么现在写个文章送报就怕了？这样怎么体现咱们工人顶天立地啊？”\n\n£gezifu £gezifu “文化员同志，我这也不是谦虚，我、我、我都还在夜校里面扫盲，我这能写啥啊？”\n\n£gezifu £gezifu “你想想你曾经受到的压迫和剥削啊，这怎么不好写了？难道你对曾经那些经历都忘了？实在不行，我就来帮着你写！”\n\n£gezifu £gezifu 接下来的几天，工人小王都在文化员的指导下叙述着自己曾经受到的剥削和压迫。尽管语言还很质朴，但是真情实感从字里行间流露了出来。"
 COX.167.t: "报纸？"
 COX.168.a: "灯齐刷刷地都亮了。"
 COX.168.d: "£gezifu £gezifu 新疆的发电厂在盛世才治下算是唯一的还在维护并且运行的工厂，得益于乌鲁木齐城外的几个从左宗棠留下的煤井，乌鲁木齐城的发电厂运行着两组5MW的发电机，但是乌鲁木齐城内的电气化水平几乎等同于没有，除开盛世才自己居住的官邸以外只有名义上新疆政府所在的省政府大楼有着完善的电气化线路，其他的更多建筑可能就铺设了一条灯的路线而已。\n\n£gezifu £gezifu 工人们终于清理完了机械厂，一个工人代表被他的同班们撺掇起来用笔写下了工厂的门牌——乌鲁木齐第一机械零件厂。\n\n£gezifu £gezifu 同时，从中国旅来的远东华人电工也被请过来重新整理工厂的电路。工人们终于摆脱了只能用煤油灯照明的窘境，在三天的重新铺设和检查后，电工同志们完成了任务，同时他们也留下来教育厂子里的工人培养电路知识。\n\n£gezifu £gezifu 用着沉重的可充电电池和简易路线组组成的教学工具是这些电工们一路从贝加尔湖畔带来的，在没有工业化的西北，这些东西几乎无法找不到第二份。但电工同志们还是把这套教学工具拿出来给工人们教授简单的电学知识。当然这对于才开始扫盲的工人们来说还是有些困难的。但是看着路线上的小灯泡不断地点亮和熄灭，围观的年轻小伙子们的眼里也闪耀着光芒。\n\n£gezifu £gezifu 太阳逐渐下山了，在测试了路线之后，一个电工同志拉下了电路的总开关。"
 COX.168.t: "点灯"
 COX.178.a: "“自己动手，丰衣足食！”"
 COX.178.d: "£gezifu £gezifu 新疆，乌鲁木齐，根据地工业部办公楼。\n\n£gezifu £gezifu 办公楼是由前迪化总督的行政楼临时改的，所以里面的一切都显得很仓促，墙上甚至还有“反共救国”的标语没来得及擦掉。\n\n£gezifu £gezifu 几个战士正拿着白灰和木棒，用木棒敲掉有些脱落的墙皮，再抹上新的白灰。\n\n£gezifu £gezifu 这可苦了正蹲在下面拿茶缸吃泡馍的宋任穷了，他是个五十多岁的老头子，根据地的工业和电气化部部长。他正和根据地轻工业部部长黄炎培，一起蹲在墙下边用大茶缸吃泡馍，墙皮不少落在了茶缸子里。混着墙皮的馍不好吃，二人只好回到办公桌上，他们两个的办公桌是对着的，上面堆满了各种文书。\n\n£gezifu £gezifu “轻工业部那边怎么样，全根据地的工业评估出来结果了吗?”宋任穷低头看着文件，同时问道。\n\n£gezifu £gezifu “不怎么样，盛世才政府的轻工业一塌糊涂，大部分的糖厂、卷烟厂、油脂厂、酿酒厂的机器都很老旧了，糖只能勉强生产粗糖，烟土厂比卷烟厂都多，粮食主产区还集中在伊犁，各个地区的轻工业，除了烟土加工以外，没有能拿得出手的。”\n\n£gezifu £gezifu 黄炎培拿着一张简报这么说着，随后他又拿出了一张报告，递给了宋任穷，黄炎培这老家伙已经七十多岁了，却依然满面红光。\n\n£gezifu £gezifu “你看看这个，这是今早传来的简报，问题有点严重，你看一下。”"
 COX.178.desc: "£gezifu £gezifu 宋任穷接过了简报，这简报字迹潦草得龙飞凤舞，但内容却触目惊心。\n\n£gezifu £gezifu “乌鲁木齐西纺织厂接连发生安全事故…三名工人手部面临截肢…”\n\n£gezifu £gezifu 宋任穷咽了口口水，继续看了下去。\n\n£gezifu £gezifu “乌鲁木齐安西钢厂建国车间发生安全事故…吊车司机疏忽大意，未及时解下坩埚钢缆，致使坩埚侧翻…千度钢水充盈整个车间…三名工人失踪…车间报废…”\n\n£gezifu £gezifu 宋任穷只觉得眼前一黑，但又只能挺着继续看下去。\n\n£gezifu £gezifu “人民铸铁厂…卧式离心浇铸时钢水倾注过多…钢水喷溅，正中一工人头部，一死九伤…”\n\n£gezifu £gezifu “矿山坍塌…四十名矿工亟待救援…”\n\n£gezifu £gezifu 宋任穷看不下去了，这些文字的杀伤力简直比日本侵略者还要大，他只感觉自己有一口气要上不来了，想抓起了桌子上的杯子打算喝几口水压一压，但却不小心碰掉了杯子，幸好黄炎培把自己的杯子递给了他。\n\n£gezifu £gezifu “哈啊…哈啊…”喝了水的宋任穷终于喘上了那一口气。\n\n£gezifu £gezifu 黄炎培看着面前的一封封工业评估的报告，低声说道：“盛世才给我们留下的是一个烂摊子，小到安全生产，大到大规模工业化…我们都需要从头开始，他们连能用的安全生产规定都没能总结出来…”\n\n£gezifu £gezifu 宋任穷似乎恢复了往日的精神，他想起了自己从国民大革命、井冈山、长征、人生历程，他感到心头涌出了一股子热血，反倒不觉得自己像是个五十多岁的老头子了，他再一次感受到了年轻时候一路上打土豪，斗军阀的那股子精气神，他说："
 COX.178.t: "新疆工业状况"
 COX.18.a: "我就不信，我们共产党做工作会不如这帮反动派！"
 COX.18.d: "喀什红军办事处，陈雷掀起一点门帘，一个脏兮兮的孩子正坐在办公桌前，手上捧着一个馕，芝麻渣啃的到处都是。\n马政委让卫生员陪着那个孩子，随后和陈雷来到临时会议室，几个干部早已坐在房间里等候。\n几分钟前，他们刚准备开会，就听到窗外有孩子哭，走出一看才发现这孩子手上拿着一颗木柄手榴弹，他的手指头被拉环戳流血了。\n包扎好伤口后，孩子很老实地交代了所有事情，有人告诉他只要把这个拉下拉环往房间里一扔，就给他一把红枣。\n而且这不是他第一次做，村中的其他孩子都被吩咐过，数红军有多少人，有多少枪，每次都能换一把瓜子或者红枣。\n“对不起，连长，政委，都怪我安保不严。”警卫连的战士首先说。\n“不光是安保的问题。”马政委说：“这孩子说他住在加木黑村，那里距离喀什不过十几个小时的路程。可咱们来这儿已经快一个多月了，居然没一个知道那个村什么情况，有几户人。”\n“许多同志思想准备不够，没做好和老百姓打交道的准备，不少人连学维语这一关还没过。”东疆的党代表说：“南疆的情况十分复杂……”\n“复杂，哪里不复杂？”陈雷生气地说：“他们再不准备好，老百姓就要把手榴弹甩到我们脑壳上了！”\n“目前来看，反动势力正在有计划地向我们发动袭击。”马政委把那颗手榴弹放在桌子上：“而且他们还有了制式武器，现在还不知道是来自日本人还是盛世才的残部。”\n“最关键的是，他们利用群众打击咱们！”陈雷又砸了一下桌子，搪瓷杯的水都洒出一些：“奶奶的，反动派用群众打击红军，咱们的群众工作做得还不如地主恶霸！丢人！”\n“老陈，你不要急嘛。”马政委劝道：“就目前来看，群众应该没有相信反动派的宣传，只是为了一口饭帮他们做事。”\n“怎么能不急啊！”\n这句话陈雷几乎是吼出来的，但随后他便冷静了下来，说：“同志们，你们不要忘了咱们东北的工作是怎么失败的，就是因为咱们错过了建立根据地的机会，只能撤到苏联，这一撤就是二十年。现在咱们好不容易回了国，难道又要重蹈当年的覆辙？”\n会议室里一片安静，失去家乡的痛苦每个人都感同身受。\n“情况复杂，我们更要认真。”马政委说：“现在，大家来说一下这些天的情况，好好讨论一下今后群众工作该怎么做。今晚的事情非常严重，我们要尽快讨论出一份结果汇报给中央。”\n“还有。”陈雷说：“会议结束后，让警卫排出几个战士，把那孩子送回家，给他们带点粮食。”"
 COX.18.t: "容易事"
 COX.2.a: "我们就在迪化痛饮庆功酒，为你们接风洗尘！"
 COX.2.d: "夕阳沿着山脊洒下耀眼的光，刺眼的光幕中，中国旅的战士们正翻着抵达目的地前最后一座山。\n\n本以为回到新疆后，会有激烈的战斗，结果除了几日前穿越边境时的遭遇，他们再没有遭到任何抵抗了。草原接着戈壁，戈壁连着丘陵，无尽的路途消磨着每个人的生命——也难怪毛岸英在归国时并无感触——都是埋头赶路，与在俄国时也并无不同嘛！\n\n直到几道人影在前方的山头出现——他们兴奋地招手，唤来了稀稀拉拉的一群人，挡住阳光，洒下欢腾的斑驳影子。一面旗帜倏地立起，夕阳透射而过，呈现出血般鲜红……尽管碰到了新民族军的一支侦察小队，中国旅还要翻过一座丘陵，才能抵达他们的临时驻地。路仍是一样不便，但与扛着红旗的同志相伴而行，却令每个人的脚步轻快了起来，一扫数月跋涉的艰辛。\n\n夜幕降临之时，中国旅陆续抵达了新民族军驻地。几盏油灯照耀之下，营地早已成为了欢腾的海洋，人们彼此相拥，互相庆贺，诉说着路途的艰辛，描绘着未来的图景……怀着澎湃的心情一路走到中央营房，毛岸英见到了许多他只有过耳闻的人——刘少奇，阿合买提江·哈斯木，张闻天，陈云……这些革命的化石，此时正围绕在桌上的地图前，等待他的到来。\n\n“欢迎回来，岸英同志。这一路上多有辛苦。”\n\n只是简单的寒暄，却湿润了毛岸英的眼眶——在此时，他才算真正回到了祖国，回到了同志们的身边。\n\n“……战事吃紧啊，盛世才平日里对军队滥施恩惠，终究还是起了效果，现在，各地的驻军正陆续调动，前往北疆围堵我们。但调动总是需要时间，兵贵神速，我们正计划趁敌不备，直取迪化。你们来的正是时候，如今准备已基本就绪，只剩一把突破的尖刀。"
 COX.2.t: "会师—然后进军"
 COX.20.a: "岸英分析得有道理，可以按这个先去做，看结果如何。"
 COX.20.d: "“这些天来，各地的党组织都在报告新情况。”张闻天将文件分发给其他四人，单刀直入地说：“不太乐观。”\n陈云说：“目前疆北情况较好，溃逃过去的国民党残兵都已经被控制和收编，生产正在恢复……”\n“但其他地区都报告了不同程度的反革命事件，特别是南疆。”陈赓皱着眉头说：“那里的地主已经有了和盛世才残兵勾结的迹象……妈的，苍蝇寻狗屎。”\n“他们根本不在乎当权者是谁，不管是国民党还是日本人……”刘少奇戴上眼镜说：“只要巴依们能继续压榨农奴，阿訇能继续讲自己的经，他们就不在意……他们害怕新政权会夺走这一切，所以会到处寻反动代理人。”\n毛岸英感觉有些插不上话，只能一边看文件一边埋头记笔记。\n“东疆情况稍好，但当地依旧混乱，我们党员数量太少，很难稳住局面。”陈云说：“乌鲁木齐情况不差，但如果继续下去，粮食供应会出大问题，必须想办法解决。”\n“而且要快，我们不知道日本人是否在盯着新疆的情况。”刘少奇用钢笔敲了敲桌子说：“我提议，立刻开展土改运动，发动贫农，拉拢中农，孤立地主富农，在运动中发展积极分子，这是增强我们掌控力最行之有效的方法。”\n“不妥。”陈云说：“新疆各地情况不同，民族矛盾与宗教矛盾都客观存在，我们贸然行动可能会让反动势力抓住把柄，反倒失去了团结一切力量的可能。”\n“而且部分地区的经济发展极度落后，发动农奴加入运动非常困难。”张闻天说道：“在这种情况下，恐怕减租降息是最好的选择。”\n“岸英同志，你有什么看法？”刘少奇突然发问道。\n“嗯？哦。”突然被叫到的毛岸英下意识站起来：“我觉得……大家说的都有道理。”\n刘少奇摆摆手：“别紧张，坐下说。”\n毛岸英慢慢坐下，看着笔记说：“我觉得……新疆各地差异很大，必须针对不同情况应该采用不同的策略。我们现在对其他地区尚不熟悉，我觉得可以把北疆当作基本盘，同时在有一定控制力的东疆开展土改试验，待积累了经验后，再转向南疆……”\n见刘少奇仍然在看着自己，毛岸英说：“刘书记，这么说对吗？”\n“嗯。”刘少奇点点头："
 COX.20.t: "碰头会"
 COX.201.a: "“惹了个怪，这共军还真不一样。”"
 COX.201.d: "£gezifu £gezifu 李二是一名老兵，他在抗战刚爆发时就参了军，从淞沪退到南京，退到武汉，重庆，最后来到了新疆。但在盛世才手底下，这么一位传奇怎么就当个排长呢？——每当有新兵这样问的时候，李二总是凑过来，拿着克扣来的便宜卷烟，露出一口黄牙：“无他，跑多了呗。”\n\n£gezifu £gezifu 活命第一，饱肚第二，除此之外，再无它求——这就是李二的人生哲学，作为过来人，他也有将士兵的保命哲学传给后继者的责任——“当兵的要领是怂，千万不敢信上头说的那套，信了就死。南京的时候，唐生智把‘誓为党国捐躯’吼了一万遍，结果城没破，他就坐船跑了，留下几十万人给日本人杀。当官的大偷大抢，克扣粮饷，倒卖军火，虚报军籍。我们当兵的就不能搞些小偷小摸咯？” \n\n£gezifu £gezifu “所有人都是这样的？”\n\n£gezifu £gezifu “全中国都一个样。”从中央军到地方军，李二几乎都服过役，所以他能够这样打包票，“就说近的，盛世才手下个个都喊‘誓与迪化共存亡’，结果共军一来，还不是散的散，降的降？”\n\n£gezifu £gezifu “那红军呢？”\n\n£gezifu £gezifu “瞅瞅我们的伙食，有多出半点油腥吗？”\n\n£gezifu £gezifu 城头换成了红旗，结果吃的还是杂粮馕和寡淡的菜汤，新兵有些泄气，不得不承认，李二说的确实在理。\n\n£gezifu £gezifu “至于那些当官的，肯定都吃小灶呢。”李二猛唑了一口烟，自顾自地呵呵笑起来，“那个姓毛的，没准窝在小二楼里，天天米饭炒鸡蛋伺候着呢。” \n\n£gezifu £gezifu “那照你这么说，我们当兵的就是全无前途，只是为的混口饭吃咯。” \n\n£gezifu £gezifu “给人卖命，运气好的话吃口饱饭，这就是我们当兵的……”\n\n£gezifu £gezifu 话音未落，一个洪亮的声音传遍了整个营地，新兵依稀认得——是营长的声音。\n\n£gezifu £gezifu “同志们，开会了！”\n\n£gezifu £gezifu ……\n\n£gezifu £gezifu “这是咱们营这个月的账目公示，还请同志们过目，在减去开支之后，余一百多元。大家月底有什么需要的，可以提出来，若是要去迪化城，现在叫乌鲁木齐，营部会安排路费……”\n\n£gezifu £gezifu “我……我想吃猪肉！”新兵颤巍巍地举起了手。\n\n£gezifu £gezifu “想啥呢！”立刻便遭到了营长的呵斥，“现在根据地这么困难，还想吃猪肉？\n\n£gezifu £gezifu 新兵只觉得自己的脑子嗡地一声，而后便懊悔地浑身发抖……在旧军队，军官全靠恐惧来维系自己的威信，而惩罚“刺头儿”，就是最常用的方法。\n\n£gezifu £gezifu “——将就一下，割几斤羊肉吧，告诉伙食班准备今晚炖羊汤……”\n\n£gezifu £gezifu 听到晚上有肉，整个营沸腾了。只有李二愣了半天，才堪堪挤出了一句话—"
 COX.201.t: "保命哲学"
 COX.202.a: "“他们的神情虽仍旧呆滞，但眼似乎已明亮了起来。”"
 COX.202.d: "£gezifu £gezifu 在旧军队中，军官总是拥有至高无上的权威。因为在反动派顽固的头脑中，士兵最重要的是忠贞不移地执行命令。他们害怕士兵拥有自己的思想，用尽一切手段扼杀士兵的独创性。\n\n£gezifu £gezifu 故而，在改造旧军队的进程中，必须充分调动士兵们被极度压抑的主观能动性。但这可不是一件简单的事——\n\n£gezifu £gezifu “……今天的课程就上到这里，各位还有什么疑问吗？”\n\n£gezifu £gezifu 何晓树扫视四周，却只看到了呆滞木讷的神色。若不是士兵们被强制要求坐在这里，想必大多数人早就跑了。面对这种情况，何晓树也束手无策。在贝加尔湖旁时，他能指挥部队埋伏NKVD的车队，在敌人反应过来前完成转移。但如何将那时的经验传授出去，他想破头也弄不明白。\n\n£gezifu £gezifu  “真的没有疑问吗？”何晓树简直觉着自己像对着一群木头讲话。\n\n£gezifu £gezifu “有…”在他的反复催促下，终于有一个士兵举起了手，“首长…俺是个兵，就是个粗人。俺不懂怎么打仗，就懂服从命令听指挥……俺说句实诚话，这些东西都是当官的职责，俺们学了有啥用？”\n\n£gezifu £gezifu 功夫不负有心人，终于出现了突破口——\n\n£gezifu £gezifu “首先……红军不分官和兵，只有指挥员和战斗员的分别。其次，红军和旧军队不一样。军阀把士兵当炮灰，踩着你们的尸体成全自己荣华富贵，新军队是人民的军队，我们要战胜帝国主义，解放全国人民，然后每个人都活着回来，建设一个新社会……在旧军队里当兵，就是把自己的命卖给了别人，但在新军队里当兵，是把命运握在了自己的手中——不仅如此，还要担起解放全国人民的职责，这可不容易！日本人有飞机坦克，榴弹炮和直升飞机，我们只有小米加步枪。那我们能怎么办？只有不分指挥员与战斗员，每个人都动脑子想法子咯。”\n\n£gezifu £gezifu 说完这番话，何晓树望向众人——"
 COX.202.t: "职责"
 COX.203.a: "“旧社会把人变成鬼，新社会把鬼变成人。”"
 COX.203.d: "£gezifu £gezifu 遥想当年，从国民党屠刀下流淌的血河中，诞生了中国工农红军。如果只看战士们手中老旧的步枪，它似乎只是中华大地上无数军阀中普通的一支。但正是这支军队，在面对十倍之敌时仍能岿然不动，在围追堵截中能迈过万里征程而不至于溃散，在民族生死存亡的关头，仍能作为中流砥柱，在广大的敌后战场迟滞强敌的攻势……\n\n£gezifu £gezifu 那么，红军之为红军的原因究竟是什么？\n\n£gezifu £gezifu 是党的绝对领导权？——不，任何一个军阀，都懂得将军权牢牢把在手里。\n\n£gezifu £gezifu 是避实击虚的游击战术？——不，进行游击战本身，就需要强大的凝聚力。\n\n£gezifu £gezifu 检阅着主要由前军阀部队编成的队列，毛岸英思绪万千。在场的每个人，手中都紧握着与之前并无区别的老式步枪，队列并不整齐，但每个人的身体都立得挺拔。毛岸英想起解放新疆时，这些人如同无头苍蝇般遭到俘虏，当盛世才政权崩溃之时，没有一个人愿意继续为之作战，这些士兵成建制地投降。而当红军决心吸纳他们时，也没有丝毫犹豫，立刻就接受了改编。\n\n£gezifu £gezifu 作为军阀部队——旧军队的一员，就是如此悲惨的事——今日跟着中央军打北洋军，明日就跟着北洋军打晋绥军。改旗易帜是家常便饭。但这并不意味着中国军人都是这样的寡廉鲜耻——抗战时期，数以百万计的战士被救亡的口号召集进入了军队，在民族危急的关头，无数中国人做出了可歌可泣的牺牲。但腐朽的官僚与军阀却把这种牺牲当作可以随意玩弄与亵渎之物。当前线吃紧之时，他们缩在安稳的后方，倒卖着珍贵的补给。当部队溃退之时，他们便将战士们的爱国热忱利用，做出一副“有朝一日必将反攻”的姿态，借此稳固自己割据的一亩三分地。赤诚之心换来了离家万里，拼死奋战换不来半日温饱，也无怪乎士兵们心灰意冷，最后蜕变为了土匪兵痞。\n\n£gezifu £gezifu 但在红军中，这些曾经的战士再次焕然一新。\n\n£gezifu £gezifu 红军是带来解放，扫除压迫的军队——红军是人民的军队。正因如此，红军战士信仰坚定，奋战在最渺茫的战场，能够承受最惨重的伤亡。看着整装待发的新部队，毛岸英想到：这些曾奋战在民族解放战争中的战士本就是红军，是旧社会的黑暗让他们的理想蒙尘。在即将到来的战争中，他们必将成为新生红军的中坚。"
 COX.203.t: "工农红军的新生"
 COX.204.a: "“四万万同胞且待，看长风更起，催我出征。”"
 COX.204.b: "“四万万同胞且待，看长风更起，催我出征。”"
 COX.204.d: "£gezifu £gezifu 龙云做到了。\n\n£gezifu £gezifu 南京于近日被护国军攻陷，这座千年古都终于在经受几十年的奴役后回到了人民的怀抱。中国，这个古老的国度再度成为全世界关注的焦点。\n\n£gezifu £gezifu 这则消息伴随着无线电的电波，传遍了整个世界。\n\n£gezifu £gezifu 此时，就在新疆，乌鲁木齐的会议室中。\n\n£gezifu £gezifu 毛岸英和其他身在西北的中共高层在无线电旁，仔细地聆听着。在听主持人讲到护国军如何将旗帜插上总统府屋顶时，毛岸英的双眼不由自主地溢出了泪水，他很久没有这么失态过了，尽管这是在党中央的全会上，但没人认为他的失态有什么不妥。想到多年来民族的屈辱终于洗刷了，会场上，不时有轻轻的啜泣声传来。\n\n£gezifu £gezifu 毛岸英很快抑制住了自己，他尽力地压制住自己颤抖的声音，朗声说到：\n\n£gezifu £gezifu  “同志们……同志们……我们的同胞终于完成了一个伟大的壮举，他们解放了南京，击垮了南京的傀儡政权。恐怕东京很快会反应过来到底发生了什么，接下来，他们毫无疑问就将直面日军的兵锋。”\n\n£gezifu £gezifu  “我们曾在兰州遭到了惨败，深知日军的残虐不是伪政府的军警可以比拟的，如若不能团结全国一切抗日的力量，恐怕南方的同志们将独木难支，中华民族将再一次失去争得自由的希望……”\n\n£gezifu £gezifu  “虽然敌人仍然强大，但在南京解放，伪政府垮台的当下，全国的抗日热情已经高涨到了极点。敌我实力对比已经发生了根本性的变化，同志们，我相信，如今便是解放全国的最佳时机……恐怕，也是唯一的机会了。” \n\n£gezifu £gezifu 他深吸一口气：“现在，就对日宣战一事进行表决！请同意此提案的同志们，举手！”\n\n£gezifu £gezifu 呈现在他面前的，是一片由手组成的森林。\n\n£gezifu £gezifu 毛岸英向会场鞠了一躬“我在此，谢谢各位同志们了！”随即，他清理了嗓子，宣布道：\n\n£gezifu £gezifu  “经新疆代表大会表决同意，即日起，新疆，青海省将正式加入统一战线，彻底响应党中央全民抗战的号召，与日寇战斗到底！”"
 COX.204.t: "统一阵线再立"
 COX.206.a: "但无论如何，兰州已经解放了。"
 COX.206.d: "£gezifu £gezifu 兰州市，简称“兰”“皋”，古称金城。地处西北要地，兰州自秦朝以来已有两千多年的建城史，自古就是“联络四域、襟带万里”的交通枢纽和军事要塞。日本远征军占领这里后，辻政信更敏锐地觉察到了此地的战略价值，不远万里从满洲拉来钢筋水泥，就地征调民夫，将兰州城内外围成了名副其实的铁桶。\n\n£gezifu £gezifu 但无论怎样牢靠的工事，都有其弱点。随着战争的旷日持久，辻政信越来越难以给远征军弄来补给与兵员，远征军早已疲态尽显，无法再像之前那样对西宁城保持压力。遥遥无期的战争消磨着帝国的耐心，每周，辻政信都会收到本部敦促他撤离的电报，但皇国之魂仍促使他继续战斗，不到殒命沙场，武士总会持刀屹立，期盼着事态有所转机。\n\n£gezifu £gezifu 游击队的活动极大的限制了远征军在乡野的活动，兵力不足，补给短缺，辻政信只能命令士兵固守几个大的聚居点。这使得他们对红军的攻势几乎没有防备，几乎在数天之内，红军就拔除了挡在面前的数个据点，完全将兰州包围。\n\n£gezifu £gezifu 直到此刻，辻政信仍做着他的春秋大梦——只要兰州的坚墙挫败了红军的锐气，远征军就能趁机反攻，一举粉碎西北的抵抗，他就能衣锦还乡，继续当帝国的英雄……\n\n£gezifu £gezifu 于是惨烈的攻城战开始了，担心破坏兰州城的古迹，更害怕伤及无辜，红军并未调集重炮攻城，只是在山炮与重机枪的支援下，分批次地对城头发起了冲锋。在付出了一些伤亡后，红军拔掉了城外的日军阵地，迫使他们入城固守。等待着红军的，是更加残酷的战斗——坚固的街垒遍布昔日四通八达的街巷，高一些的民居中都精心布设着火力点，最为关键的是，日军根本不在乎民众的死活，城中的居民完全没有得到疏散，而是在刺刀的逼迫下，献出最后一口存粮，流干最后一滴汗，再被当作肉盾，迫使红军付出大量的牺牲，一栋接一栋地进行扫荡……\n\n£gezifu £gezifu 城中激战持续了数周，待到尘埃落定之时，兰州城早已伤痕累累。好似战争造成的破坏还不够，在撤退前，日军的后卫在城中大肆纵火，火势一度蔓延至数个城区……\n\n£gezifu £gezifu 将日本逐出兰州的战役中，中国军民付出了难以计数的伤亡……"
 COX.206.t: "黄河明珠之殇"
 COX.209.a: "而春天，何时才能到来？"
 COX.209.d: "£gezifu £gezifu 作为一名站在城门负责盘查过往行人的哨兵，王易亲眼目睹了兰州的“黄金时代”。就在不到十年前，一座座洋楼拔地而起，将城内余下的空间塞得满满当当，大量的居民就这样被赶到了城外，野蛮生长的棚户区如青苔般从墙根蔓延而出，城墙内外，仿佛被区隔出两个截然不同的世界。\n\n£gezifu £gezifu 日本进口的汽车载着西装革履的职员，总是横冲直撞地进城，完全不把他们这些站岗的人放在眼里。虽然略有窝火，但王易也自知与这些上层人不可能有什么瓜葛；他能做到的，只是不似其他同僚般对过路的行人百般苛责，想方设法捞些油水罢了。但相比于这座沉沦在纸醉金迷中的城市，王易觉着自己仍保有传统与良知。\n\n£gezifu £gezifu 当日机丢下的第一颗航弹在城郊炸开时，王易算不上安定的生活便彻底结束了。马家自傲的城防与十万大军根本挡不住帝国西北军的兵锋。城外的民居火光冲天，在航空汽油弹、航空炸弹的袭击下，兰州上空升腾着熊熊大火，似要将往日的繁荣灼烧殆尽。后来的记忆便只剩下了乱，在日军攻到兰州墙下前，马家的指挥链已然崩坏，进城的溃军与出城的难民阻塞了城门，而本应在那里维持秩序的王易及他的同僚们，则接到了不知道谁发出的命令，提早撤离了岗位。\n\n£gezifu £gezifu 再之后，便是苦难而艰辛的年岁。战火经年不绝，扫荡日复一日。靠着逃走时幸运地带着的枪，王易和几个弟兄们得以谋生。数年间，他目睹了无数乡亲们在日军的刺刀下挣扎——第一年，他们捍卫自己的收成，第二年，他们转而保护自己的春种，最后，他们绝望地从侵略者手中争抢最后的口粮。他见过妇女被欺侮，儿童无家可归，更见过百依百顺的“良民”，其头颅被说笑着的侵略者挑在刺刀尖……\n\n£gezifu £gezifu 但区区一伙劫匪，又怎能匹敌强大的日军？王易能做的，只是记下被日军勒索过的人家，然后劝说自己的伙伴，不要将枪口对准已经走投无路的人。毕竟，在这三九严冬，人人只能各扫门前雪……"
 COX.209.t: "自扫门前雪……"
 COX.210.a: "指日可待哦……"
 COX.210.d: "£gezifu £gezifu “老板，我要当东西”张思德来到先前约定好的当铺，敲了敲当铺门。\n\n£gezifu £gezifu 门吱呀着露出一条缝隙，传出了里面人的细语：”掌柜的不在，明天再来吧“\n\n£gezifu £gezifu ”那可不成，我要当大的，掌柜走了这大买卖就没了。“\n\n£gezifu £gezifu ”那你要当什么呀？“柴火，还有烧火用的棍子”\n\n£gezifu £gezifu 门被推开了，地下党联络站的负责人露出头来，“大买卖啊，里面请，好茶好水伺候”\n\n£gezifu £gezifu 进了当铺就不必端着了，张思德直截了当地问：“联系人通知我来这里，是有什么要紧事吗？”“是，也不是”联系人摇摇头，狡黠地笑了。“有好东西给你们。”\n\n£gezifu £gezifu 张思德被领到当铺的后院中，一辆马车停在后院中，载着一车油布盖着的干草。联系人把油布掀开，油布下的东西令张思德瞪大了眼，压抑不住内心的躁动，张思德惊喜地问道：“我靠，日货啊……”“正是”联系人笑着说，“晌午时，你就把车拉到城门口，那一岗班是兰州老乡在站，我们已经买通了……”\n\n£gezifu £gezifu 过了关卡，张思德赶着马车向游击队营地赶去。他不禁笑了起来。"
 COX.210.t: "接头"
 COX.211.a: "“全体上刺刀，准备进攻！”"
 COX.211.d: "£gezifu £gezifu “王队长，这该咋办？”看着远处坐着卡车赶来的大队日本士兵，小梁一脸疑惑的看向趴在旁边、压低身子的队长。\n\n£gezifu £gezifu 一边摸索着衣兜里的香烟，王易淡然地答道：“看着就好了，鬼子们还觉着兰州附近是安全区呢，咱今天就要让他们好好喝一壶。”他的眼睛紧盯着前方的卡车，日本兵正有说有笑地点起香烟，好像在比拼谁抽的更快。\n\n£gezifu £gezifu “小梁啊，上次缴的烟还有货吗？这回定能再缴不少。”谈笑间，排头的车碾过了第二片雷区。小梁咽了咽口水，只见队长拉动拉线。“轰”地一声，那辆卡车变成了一颗大火球，车上的鬼子连惨叫都没来得及发出。只剩下了几顶钢盔被炸向空中，旋转了几周后砸在路上，冒着青烟。\n\n£gezifu £gezifu 后面的日军马上反应了过来，有地雷！赶忙刹车，所有士兵立刻下车。最前面卡车燃烧着的残骸挡住了路，他们自然只能徒步。小梁清晰地看到，几个排雷兵已经背好探测仪，手里拿着探测器，形成平行队列沿路进行探测工作了。他们的身后，约一个大队的士兵已经列队完毕，正慢慢跟在排雷兵后面缓慢推进。\n\n£gezifu £gezifu “鬼子真是蠢笨，都不知道咱的土造地雷，其实一点金属都没。”队长又拉动了另外两根拉线，为了招呼这些排雷兵，这最后铺的几枚地雷里的装药都是特地从西宁运来的。一阵硝烟过后，先头的排雷兵化为了一阵血雾。趁日军错愕之际，王易一口气拉响了数颗炸弹，将队尾的数辆车炸了个底朝天。断肢与血液四溅，硝烟与柴油燃烧的焦糊味弥漫在整个山谷，此地已经彻底化为了一个屠宰场。\n\n£gezifu £gezifu “对面还剩几十个人，王队长，接下来怎么办？”\n\n£gezifu £gezifu “老子早就把兰州周边都摸透了，爆炸声根本传不出这个山坳坳，城里的鬼子根本不会知道这儿发生了什么。”边说着，王易娴熟地给自己的老枪挂上了匕首，“咱也要让鬼子尝尝，被挑在枪头究竟是什么滋味……”"
 COX.211.t: "地形之利"
 COX.22.a: "千里之行，始于足下"
 COX.22.d: "在一间不大的办公室内，只看到几个人正在开一次小会，而倘若你从外边路过，能闻到一股很浓的烟味。\n\n“同志们，尽管我们解放新疆赶跑了盛世才，但是有几个非常头大的问题，自打西伯利亚战争以来，新疆的外贸完全崩溃，贸易通道完全被隔绝，你去边境上走一圈，没见到商队，只见到土匪，很多边境的群众想要卖东西糊口，不得不先给土匪交点保护费或者是给出大价钱才能通过；第二，盛世才发行的货币现在通胀严重，我昨天去菜市场看了一圈，发现卖菜的菜农和人家换一大沓钞票，有些人身上带的钞票甚至是用小推车推的，不然两个口袋装不下；第三，市场上的粮价也不容乐观，这几天涨价幅度快压过通胀速度一个头，如果我们不能在经济问题上有所作为，那么我们整个根据地将面临灭顶之灾。”陈云简短的总结道。\n\n陈潭秋深吸了一口烟，缓缓说到；“前几天，南疆有一个地方爆发了游行，说是工厂破产关门了，没人发工资，一家老小再不吃饭就得饿死，我看，还得整顿整顿工厂，要不然工人肚子太饿，没法组织生产，不方便我们解放全国啊。”\n\n毛泽民也点头，补充道：“农村的治安情况也不容乐观，前几天我们的干部报告称农村时不时出现治安事件，比如说昨晚就有一个村子有一队溃兵拿枪进村打劫，得亏民兵支援及时，不然很难想象会发生什么事，而且抓那一队溃兵审问之后才发现，他们一直待在附近地主的家里面，给人家干活，趁民兵换岗的空隙时间抢劫村子，想重建基层控制力，农村想变好，咱还得干老本行——土改啊。”\n\n过了一会，毛岸英看着手中的报告，沉默了一会，说：“我的想法也是这样的，先从农村开始，接下来讨论土改方案。”"
 COX.22.t: "危机"
 COX.23.a: "§G通过言说，他们分辨了是与非，透过控诉，他们明白了手中的力量。§!"
 COX.23.d: "£gezifu £gezifu 一到夏合勒克乡，映入眼帘的便是高大的白杨树丛，树丛边上总是矗立着一座深宅大院。它的旁边是农奴主专用的清真寺，周围是仓库和各种手工业作坊。再往外就是农奴和仆人居住的破屋子，与臭烘烘的家畜棚圈建在一起。\n\n£gezifu £gezifu 住在大屋子里的人自称为和加，译为“圣裔”，他们说自己是“白骨贵族”，也就是先知穆罕默德的后代。他们对这片土地，以及其上的人民享有生杀予夺的大权。\n\n£gezifu £gezifu 千年来，农奴的劳作都是从早到晚，终日无休。只有当中国旅进驻之后，才用步枪征得了闲暇，农奴们被允许中午在小广场里交流。虽然这闲暇只有半小时，但和加仍派自己的狗腿子日日阻挠，不得已，驻村的七个战士只能荷枪实弹的守在广场的入口，这才能让今天的集会顺利进行下去。\n\n£gezifu £gezifu “当年先知东行的时候，行至此处，和加的祖先们就去觐见，先知便动用自己的权能，令他们将手杖插在河边，很快就生根发芽，成了这大白杨……他们是安拉的选民，先知的追随者，咱们怎么能动得了？”在村口逼仄的广场上，农奴们围坐在一起，听着中间的老农奴司马义讲话。\n\n£gezifu £gezifu “怎么动不了？”年轻的吐尔逊艾依提突然站了起来，“乡亲们，想想吧，和加的私地不都是咱们种的吗？牵马，看店，挑水，打馕，砍柴……哪一件他买买提力汗离了咱们办得到？冬天他冷了咱们把自家家具劈了也要给他送柴火，晚上他上厕所都要两个人搀着……要是没有咱们累死累活的干，他就连夜壶都收拾不了！”\n\n£gezifu £gezifu “你…你这么说真是被魔鬼蛊了心智了，你就不怕死了下地狱吗？”\n\n£gezifu £gezifu 广场上瞬间安静下来，农奴们的目光都投向了这个挺身而出的年轻人，等待着他的回应。吐尔逊艾依有些动摇，但站在一旁的红军战士用眼神鼓励着他，他又有了继续说下去的勇气。\n\n£gezifu £gezifu “要下地狱的话，也轮不到咱们穷苦人啊！十年前，我大哥被征去给他买买提力汗修大院，从十里地外的河滩拉石头过来啊！干一整天都没得休息，还要被他拿鞭子抽，回来腰都直不起来了。我们家一年就靠一只老耕牛犁地，还被他抢了去，十二年都不还回来……他买买提力汗坏事做尽，他不怕下地狱，我怕什么？乡亲们啊！以前那些兵都向着和加，现在不一样了，红军是来解放咱们穷苦人的！大家有什么苦衷，受了什么苦难，都通通说出来吧！”\n\n£gezifu £gezifu 吐尔逊艾依提举起了自己布满老茧的右手，渐渐地，饱经磨难的手臂，干枯瘦弱的手臂，黝黑健壮的手臂——一只只劳动人民的手臂纷纷举了起来，他们站到广场中央，在古老的白杨树下，痛彻地控诉着。"
 COX.23.t: "诉苦大会"
 COX.235.a: " Да здравствует революция！(革命万岁！)"
 COX.235.d: "£gezifu £gezifu “泽登巴尔同志，在这里住得还习惯吗。”\n\n£gezifu £gezifu “还好吧毛岸英同志，住在这里至少比担惊受怕好多了。”\n\n£gezifu £gezifu 自从那次吓人的边境冲突之后已经过去好几个月了。越来越多的蒙古人民军来到了新疆根据地。\n\n£gezifu £gezifu 甚至连那位传奇的游击领袖，泽登巴尔也来到了这里。\n\n£gezifu £gezifu 这天，毛岸英带着外交人员来到了苏赫巴托的住处，尽管他们从未见过面。但是以前留苏的经历和抗日的战绩让两人很快熟络到了一起。\n\n£gezifu £gezifu “泽登巴尔同志，我这次来，主要还是想和你讨论一下蒙古的未来。”毛岸英将文件递给泽登巴尔，“毕竟我们都知道，离乡的感觉并不好受。”\n\n£gezifu £gezifu 泽登巴尔接过文件，细细阅读之后，松了一口气。文件大体是关于人民军与红军的军事合作与交流，却丝毫没有提及中国对外蒙古的主权声索。泽登巴尔一直担心毛岸英会趁着这个机会要回外蒙古的主权。\n\n£gezifu £gezifu “我们目前的打算。”毛岸英开始讲起接下来的军事部署。“是在准备完成之后开始渗透起蒙古的工作，至于目标，则是控制大部分与根据地接壤的蒙古地区，最好能到达乌兰巴托。为此，根据地将提供一切可能的帮助，包括人员，装备，训练。”\n\n£gezifu £gezifu 泽登巴尔点了点头：“那就麻烦您了。”"
 COX.235.t: "蒙古解放阵线建立"
 COX.236.a: "总有一天，总有一天…！"
 COX.236.d: "£gezifu £gezifu 同胞们！自我们从清朝的帝国主义中独立以来，这座城市经受了多少苦难！这座城市的居民永远不会忘记1921年时，我们是如何团结起来，赶走了反动的博克多汗和他的走狗恩琴男爵。也不会忘记后来德国法西斯和日本法西斯发动战争时，蒙古的军民是如何保卫他们的国家的。虽然我们暂时被日本人击败，但是蒙古人民不会向任何帝国主义屈服！我们永远是自由的！有的人或许会说：在日本人的治下过活吧，因为这样好过再次燃起战火。相信这句话的人，看看乌兰巴托城吧，这座城市的哪一处地方没有被日本人控制？哪一分钱财没有被日本人榨取？他们穷尽每一种方法，将蒙古的所剩无几的财富榨得一干二净。正如旧时代的贵族和喇嘛！自由的蒙古不会忍受这样的屈辱！\n\n£gezifu £gezifu 面对这样的情况，蒙古人民和世界上其他千千万万受到法西斯压迫的人民一样！因为这座城市是英雄的城市，城市的人民是英雄的人民！他们永远记得乌兰巴托(即“红色英雄城”）的含义，并且亲身实践它！或许有人觉得，日本人太强大了，我们永远无法战胜他们。但是恩琴男爵在我们头上作威作福的时候，也有人这么说过，他的下场如何呢？难道不是被俄罗斯和蒙古人民的团结所击败了吗？还有曾经统治蒙古的徐树铮，不也被中国的五四运动打下台了吗？如此看来，总有一天，日本人也会像历史上一切侵略者一样，得到他们应有的惩罚！"
 COX.236.t: "泽登巴尔告乌兰巴托同胞书"
