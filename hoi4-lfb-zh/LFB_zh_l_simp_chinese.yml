 POLITICS_CHEN_CHENG_DESC: "四十年代末重庆沦陷，蒋中正逃亡过程中死于轰炸后陈诚接手国民党。五十年代初在改组政府进行的西北扫荡中身中流弹，不久去世。陈诚死后土木系式微，陈立夫接任国民党主席，并在不久后投靠马家军寻求政治庇护。（注：此设定仅为初设，不代表最终设定，详细设定请等待正统线补充。）"
 POLITICS_Hu_Zongnan_DESC: "四十年代中后期西安沦陷后退入兰州，后面没写，反正玩家看不到，另外在这里BB一嘴，光复系其实就是本模组给复兴社改了个名，因为复兴社38年就解散了。"
 POLITICS_MA_BUFANG_DESC: "有人说，西北马家共尊真主，故得长幼和睦，尊卑有序；西北人民唯奉安拉，故得战乱鲜少，生活富足。但此刻坐在王座上的马步芳十分清楚，抛去真主圣言的粉饰，西北诸军阀的本质与中原并无不同，都是披着人皮的野兽。\n出卖国家，背叛人民，甚至背叛自己的至亲——就连马步芳自己，都伙同南京政府，与马步荣一道逼迫其父马麟将权柄交出，才得以执掌青海。但马家确实胜于中原军阀的一点是——每当大敌当前，信众们便会爆发出惊人的团结，无论分歧几何，他们也大体上服从领导者的决定，自清末以来便一贯于此。\n无论面对的是共产党还是国民党，是汉人还是日寇，马步芳都小心地把控着西北的航向。觉察日军不愿劳师远征青海，马步芳便明智地保存实力，将重庆的电报每每搁置一旁。待到战局明朗之际，他果断改换阵营，令西北赶上了战后经济复苏的快车，开创了“塞上江南”的繁荣神话。\n时过境迁，但马步芳的统治仍稳如泰山，放眼四方，日资仍争抢着涌入，而南京政府也无力对西北自治做出干涉。就连西藏的喇嘛，也自觉避开马家军的锋芒。但伟大的“西北王”如今已步入其暮年，多年来放荡奢靡的生活拖垮了他的身子，好在曾环绕膝下的孩子们已经长成，终有一日，他们必将从自己手中接过这雄厚的遗产，无论早晚…无论用什么手段……"
 POLITICS_MA_JIYUAN_LFB_DESC: "一座座窑洞被翻了个底朝天，战士连同平民的尸体一同散落在不知名的山岗之中；孩子的脸冻结在面目狰狞的最后一刻，哭喊的声音同毒气一同弥散直至消失；制服残破不全的溃兵赤脚拖着血迹四散奔逃。然后，就在这些早已被他习惯的声音与画面之中，一发子弹径直穿透了父亲的头颅，那副似乎永远都不会慌乱的面庞顷刻面目全非……\n\n然后，马继援又一次惊醒了。\n\n马继援时常思忖这一切是否是造物者的报应，但每每想到这里，他又会为这种想法的残酷深深感到不寒而栗。三十年前，他的父亲马步芳是如何无动于衷地注视着那些被自己麾下刺刀挑开的胸膛？而今，数倍残忍于马家军当年所作的恶正平等地降临在这片黄沙上阿丹所有的儿女身上。从当年的说一不二到如今的颠沛流离，似乎胜利在这片土地上只会眷顾与芸芸众生为敌的那一方。\n\n于是，德国和广东最新式的机械同西北的风沙一同作响起来了；于是，战士们的步枪与刺刀在一次次更新换代中越发锃亮了；于是，在对南京、北平或是日耳曼尼亚的蹒跚的模仿中，一栋栋楼房在时不时点缀几道航迹云的蓝天中立起来了。\n\n但是这一切永远不会结束。父亲逐寸褪淡的面容和机枪中无数人的最后一声哭喊永远不会离开马继援的梦境，因为他知道，在他所不能及的地方，永远都有自己的同胞正在魔鬼的爪牙枪下失掉自己的父亲，永远都有战士不自量力为着崇高的信念迎接那没有悬念的结局，像狗一般没有尊严地倒在机枪的火舌下。\n\n但他知道，终有一日，这场延续了三十年有余的暗无天日的噩梦会迎来光明普照的结局。\n\n§R 终有一日。§!"
 POLITICS_SUN_CHU_DESC: "阎锡山逝世后，梁敦厚与王靖国的派系之间展开了漫长的拉锯，最后作为妥协由孙楚出任晋陕行政公署主任。年事已高的孙楚无力调和矛盾，他的所谓派系也不过是尚未站队之人的笼统集合。矛盾终有一日会爆发，而他只能祈祷阎锡山的基业不要在自己手上分崩离析。"
 POLITICS_Sun_Liren_DESC: "没写，反正现在没实装。"
 POLITICS_XUE_YUE_DESC: "§Y中华民国第九战区代司令长官§!\n§Y国民革命军陆军一级上将§!\n§F------------§!\n北宋末年，女真南侵，家国沦丧…但汉家男儿仍有忠骨，荆湘男儿汇聚于岳字旗下，北击贼寇，一时间名扬九州…时光轮转，千年岁月已逝，但清末的光景却好似宋时——中央王朝的权威被异族践踏，而其富裕却遭垂涎。嗅着鲜血的腥味，列强们扑咬上来，而日本，便是这些豺狗中最嗜血，最凶暴的一匹。\n\n在《马关条约》签订的耻辱之刻，一位父亲给儿子取名“仰岳”，盼望他将来能成为扶危济弱的大英雄。多年以后，父亲终于得偿所愿——中华民族又到了存亡之秋，而他的儿子成为了将军，站在长沙城头，率领荆湘儿郎们抵御日寇侵袭。三次长沙战役，薛岳凭借利用地形阻击迟滞，穿插包围的“天炉战术”，屡次挫败了日军进犯长沙的企图。\n\n但无论战士如何效死，将军如何善战，胜利却越来越远。一切的缘由，正是当权者的昏聩，一如阻挠岳家军北伐的宋廷——敌人远未到来之时，便自乱阵脚，一把火差点将整座城烧成了灰——此等怯战，此等草菅人命，恐怕便翻古今史书，也鲜能寻到第二例。终于在第四次长沙战役时，集中优势兵力的日本攻进了城，自此南北连为一线，日军可以凭借铁路与水运的便利，快速将物资与兵力从东北转运至新加坡。\n\n城破之时，残存的国军溃不成军，来不及收拢残部，薛岳只得向西溃逃，他的部队因瘟疫损失惨重，他的身子也被流弹所伤，破片嵌入骨髓，使他再也无法抬起自己的右臂…而当他终于突破敌人重重围剿，回到重庆时，局势已彻底糜烂。沿着长江，日军的兵锋直抵重庆。党国一把手，那个自命不凡，优柔寡断的蒋介石，轻轻拉着薛岳的手，将重庆周边防务托付于他。\n\n重庆之战，薛岳拖着颤抖的手，编织着摇摇欲坠的防线，指挥着疲弱之师奏出了二战最后一曲血腥交响。但这一切终是徒劳…1962年，这位残破的将军率领着残破之军困守一隅，他竟羡慕起岳飞的命运——虽死得荒唐，但毕竟不用亲眼得见山河破碎，国家沦亡……"
 POLITICS_Yang_Yuchun_DESC: "杨遇春，这位经历跌宕起伏的传奇人物，曾是山间游击的猛虎。早期作为红军指战员，他在井冈山崭露头角，以独特的游击战术屡次击败强敌。然而命运弄人，在至亲被共产党以“消灭地主”的名义逮捕处决后，他选择了投靠国民党。抗日战争期间，他在庐山战役中大放异彩，凭借丰富的山地、游击作战经验，数次挫败日军的清剿。然而，这位国军中少有的熟稔游击战术的将领最终未能躲过敌人的铁网，在一次反扫荡中因叛徒出卖而被日军俘虏。\n\n在面临了漫长而痛苦的囚禁生涯后，在日军的威胁下，他被迫参与改组国民政府的工作。抗日战争形势不断恶化，他愈发心灰意冷。国民党改组派内部对他的冷漠态度更让他郁郁不得志。在完成了被强迫下达的任务后，他果断选择远离政治漩涡，过着自嘲“半生浮萍”的隐士生活。\n\n正当他以为这辈子就老死在这乡间时，红军在西北的反攻席卷大地，日本西北占领军的土崩瓦解让改组国民政府仓促之间想起了这位昔日的游击战专家。他们认为，杨遇春的游击战经验或许也能在反游击的战场上有用武之地。于是，带着“民族大义”的说辞，改组国民政府高层亲自登门，极力劝说他重出江湖。面对“家国情怀”的召唤以及事实上没有选择的余地，杨遇春最终决定接过这个充满矛盾的重担。"
 POLITICS_Zolbingijn_Shizhee_DESC: "（占位）蒙古覆灭后从苏联归国参加游击运动的原农村派（左派）成员。"
