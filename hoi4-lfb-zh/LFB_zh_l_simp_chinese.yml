 COX_landreform_unrest_level_tt: "当地区的敌对势力骚动倾向达到80%以上后，就会在该地区引发暴乱。暴乱一共有5个烈度指示，按照烈度不同，执行解决骚乱任务时所需要的民兵数量也会变化，按照该地区民兵数量上限的30%/40%/50%/60%/70%进行递增，每执行一次解决骚乱任务，就会使得暴乱烈度下降一个等级，并最终使暴乱状态结束。因此，在暴乱尚未蔓延至高烈度时，请尽快着手加以解决。"
 COX_Landreform.001.a: "继续前进，我们马上就能见到同志了！"
 COX_Landreform.001.d: "自西伯利亚的政权崩溃以来，新疆的北境从未有过一日安宁。哨站与简易营房散布在边境的山谷与戈壁之间，其中驻扎着疲惫的士兵，时刻抵御着俄罗斯混乱的外溢——虽说如此，其实冲突的烈度相当有限——试图跨越边境的多是些偷渡者与难民，或是误入此地的牧民，即便是军匪流寇，也至多不过百人，他们手中老旧的武器，根本无法威胁边防军的工事。\n但谁都没能想到，就在北疆再度爆发骚乱，补给线遭到切断的紧要关头，会有一支前所未有庞大的部队从西伯利亚进犯。炮楼在牵引式大炮的轰鸣下倒塌，在边防军做出任何有组织的抵抗之前，敌军已经渗透到了近前。士兵失去了战意，长官也只能缴械投降。\n“你们怎么是中国人？”\n“闭嘴，回答我们旅长的问题——”\n\n………\n\n时隔多年再度踏足祖国大地，毛岸英却没有任何特别的情感，一路上的风餐露宿，他与许多战士一样始终提心吊胆，不知道归国后将面对怎样的局面。在消息闭塞的西伯利亚得知的只言片语中，新疆已经由盛世才——一位有能力的军阀治理了三十余年，他会接纳归国的八十八旅吗？即便他能接纳，又该如何说服他全面转向抗日呢？在旅途中辗转反侧的每一个夜晚，毛岸英始终担心着这近万名弟兄的未来……直到从边防军军官口中，他才得知了此刻新疆的面貌——盛世才的统治早已难以为继，经济凋敝，军备松弛，中共残余在北疆发动了一场起义，他们号召牧民，农奴与不满的士兵，组成了名叫“新民族军”的武装。具体情况虽不知晓，但已在北疆成燎原之势——"
 COX_Landreform.001.t: "突袭"
 COX_Landreform.002.a: "“等打进了迪化，我们再痛饮庆功酒，为你们接风洗尘！"
 COX_Landreform.002.d: "夕阳沿着山脊洒下耀眼的光，刺眼的光幕中，中国旅的战士们正翻着抵达目的地前最后一座山。\n\n本以为回到新疆后，会有激烈的战斗，结果除了几日前穿越边境时的遭遇，他们再没有遭到任何抵抗了。草原接着戈壁，戈壁连着丘陵，无尽的路途消磨着每个人的生命——也难怪毛岸英在归国时并无感触——都是埋头赶路，与在俄国时也并无不同嘛！\n\n直到几道人影在前方的山头出现——他们兴奋地招手，唤来了稀稀拉拉的一群人，挡住阳光，洒下欢腾的斑驳影子。一面旗帜倏地立起，夕阳透射而过，呈现出血般鲜红……尽管碰到了新民族军的一支侦察小队，中国旅还要翻过一座丘陵，才能抵达他们的临时驻地。路仍是一样不便，但与扛着红旗的同志相伴而行，却令每个人的脚步轻快了起来，一扫数月跋涉的艰辛。\n\n夜幕降临之时，中国旅陆续抵达了新民族军驻地。几盏油灯照耀之下，营地早已成为了欢腾的海洋，人们彼此相拥，互相庆贺，诉说着路途的艰辛，描绘着未来的图景……怀着澎湃的心情一路走到中央营房，毛岸英见到了许多他只有过耳闻的人——刘少奇，阿合买提江·哈斯木，张闻天，陈云……这些革命的化石，此时正围绕在桌上的地图前，等待他的到来。\n\n“欢迎回来，岸英同志。这一路上多有辛苦。”\n\n只是简单的寒暄，却湿润了毛岸英的眼眶——在此时，他才算真正回到了祖国，回到了同志们的身边。\n\n“……战事吃紧啊，盛世才平日里对军队滥施恩惠，终究还是起了效果，现在，各地的驻军正陆续调动，前往北疆围堵我们。但调动总是需要时间，兵贵神速，我们正计划趁敌不备，直取迪化。你们来的正是时候，如今准备已基本就绪，只剩一把突破的尖刀。”"
 COX_Landreform.002.t: "会师,然后进军!"
 COX_Landreform.003.a: "“这条老狗还在吠，看我把你就地正法！”"
 COX_Landreform.003.d: "£gezifu £gezifu 摇摆不定，见风使舵，从不忠于某一面特定的旗帜，依据现实需要随时改换自己的信仰——有人可能会把这种人称为“三姓家奴”，“汉奸国贼”，但盛世才清楚，这就是军阀的生存之道。能敏锐地察觉时局，抛弃那些不重要的东西，及时站在赢家一方，这才是在乱世中生存下来的诀窍。\n\n£gezifu £gezifu 正是秉持着这样的信条，盛世才得以在数十年的混乱中稳稳地（以一个军阀而言）割据新疆。时过境迁，北方曾经虎视眈眈的苏联碎成了一地鸡毛，南方趾高气昂的中央政府也沦为日本人的提线木偶，盛世才的统治却得到了前所未有的稳固。强大的日军无心进犯毫无价值的新疆，而苏联地区游荡的军阀也构不成什么威胁。仅剩的威胁来自于内部，但不论是国民党还是共产党，都势单力薄，掀不起什么风浪。\n\n£gezifu £gezifu 本以为下半辈子都能在迪化高枕无忧地继续当自己的“土皇帝”，但盛世才怎么都没想到，一支来自于蒙古高原的“流寇”竟然有胆子进犯新疆边境。而他更没想到的是，自己经营数十载的心血，他割据新疆真正的仰仗——自己的嫡系军队竟然会被这支流寇部队逼至迪化。\n\n£gezifu £gezifu  “都是饭桶！老子不是花了大价钱养你们吗？”在盛世才为自己的晚年精心置备的小别墅内，他歇斯底里地对着眼前的参谋吼叫着。耳畔隐约间能听到轰鸣的炮火声，夹杂着短促轻武器开火的声音，令这个老人更为烦躁不安。\n\n£gezifu £gezifu  “省长，赶快撤退吧。” \n\n£gezifu £gezifu  “撤退？难道你要我置迪化全城的百姓于不顾，狼狈逃窜？”嘴上这么说，其实他早就准备好了自己的后路。迪化丢了，他盛世才在新疆的统治也基本上宣告结束了。幸好他已经得到了日本人的首肯，只要跑到民国，就能混个农林部长当当。所以在命令参谋“死守迪化，不将城拱手予敌”之后，他已经收拾好细软，准备跑路了。\n\n£gezifu £gezifu  “不许动！”正当盛世才准备乘上自己的日本小轿车的时候，他背后突然传来了一声怒喝，隐约间，他感觉到冰冷的钢枪顶上了自己的脊背。\n\n£gezifu £gezifu  “英…英雄，千…千万不要冲动啊。” \n\n£gezifu £gezifu  “盛世才，你这条老狗，还记得我是谁吗？” \n\n£gezifu £gezifu  “我们之间没什么仇怨，新疆就让给你们吧，但您能不能发发善心，先放小人一马。” \n\n£gezifu £gezifu  “别装傻了，十几年前你杀我同志的时候可从没手软。”感到背后钢枪用力地往前一顶，盛世才吓得挺直了腰杆（对于一个老人来说，着实不容易），“我早就想杀你了。” \n\n£gezifu £gezifu  “饶……饶命啊！”此刻，整个新疆最有权势的人，发觉自己的命运完全掌握在了另一个人手中……"
 COX_Landreform.003.t: "军阀"
 COX_Landreform.004.a: "“其实我们能回家就已经很高兴了。”"
 COX_Landreform.004.d: "前苏联驻迪化总领馆，如今挂上一块写着“乌鲁木齐苏维埃临时政府办事处”的木牌。\n毛岸英轻轻推开陈赓的办公室门，迎面就看到一座文件堆成的小山，摞在办公桌上。\n“啊，岸英你来了。”陈赓正抓着一把文件站在柜子旁整理，见到毛岸英赶紧放在一边说：“唉，我现在也没法给你安排个座儿，你先坐我凳子上吧。”\n“不了，我来帮您。”\n“别别，我跟你要谈正事。”陈赓赶紧三五下摆完了手上的文件，回到乱糟糟的桌前说：“我这儿暂时也没多余凳子，咱们就站着说吧，你别嫌弃。”\n“没事。”毛岸英问：“为什么不搬去原本的省政府？那里应该什么都有。”\n“唉，别提了，盛世才这个龟儿子，在新疆干了半辈子，沙发茶几一个不少，可连个正儿八经存文件的柜子都找不出来，我这柜子还是从根据地搬来的。”陈赓摆摆手说：“没事儿，过两天我就搬几把凳子过来。”\n毛岸英说：“要不我帮您一起搬。”\n“不不，咱们先把正事说完。”陈赓双手撑着桌子，看起来有些犹豫，他说：“本来这个事情应该刘书记跟你说的，但是这两天他们都各处忙，只能我来说了……”\n“您说吧，是有什么任务吗？还是……”\n“不是，是关于你们的党籍问题。”陈赓说：“你也知道，抗联的老战士们转移到苏联这么多年，东征西战的。但现在苏联都那样了，我们跟中央也断了联系，许多文件都找不见了，而且新疆局现在急用人……短时间内恢复你们的党籍有些困难。”\n“那……”\n“少奇同志的意思是这样，先给你们临时登记个党员身份，等新政府人手富裕了，再慢慢帮你们恢复，怎么样？”陈赓拍了拍毛岸英的肩膀说：“你放心，八十八旅是大功臣，等新政府运转正常了，我亲自帮你们弄，还要给你们办个表彰大会。”\n“好，您放心吧，战士们都会理解的。”毛岸英笑着说。"
 COX_Landreform.004.t: "万象更新"
 COX_Landreform.005.a: "虽然反响平平，但总算迈出了坚实的第一步。"
 COX_Landreform.005.d: " £gezifu £gezifu 在红军出乎预料的快速进攻下，长期盘踞新疆的盛世才政权在猝不及防间完全崩溃了。在久别故乡的中国旅的协助下，中共新疆局成功进驻迪化，迈出了解放全国的第一步。\n\n£gezifu £gezifu 但也只是最简单的一步而已。\n\n£gezifu £gezifu 盛世才入主迪化虽已历经数十年，却从来没有建立对整个新疆的完整控制。在战后的短暂岁月间，尚且能凭借时运逐步加强对地方的控制，但随着中原地区的重建，最后的日本投资者也对新疆这片偏远之地失去了兴趣。如今的新疆各地遍布着隶属于不同地主与阿訇的一个个小王国，对所谓盛世才将军的权威嗤之以鼻。而他统治失败的证据就是如今立在迪化城内，却鲜有人收听的广播站。\n\n£gezifu £gezifu 对于一个只想偏安一隅的军阀而言，新疆的现状虽不算好，也还过得下去，但对于想要将其作为解放全国基地的共产党而言，这样的状况必须被改变。新疆的人民必须被组织起来，打碎束缚他们的锁链，掀翻一直骑在他们头上的压迫者。而这一切，将从这里开始——\n\n£gezifu £gezifu 站在广播站前，毛岸英这样想到：\n\n£gezifu £gezifu 不知道萨布林发出那次著名的广播时，是否怀着同样的心情？\n\n£gezifu £gezifu 广播员将麦克风递到了他的面前，他深吸了一口气——\n\n£gezifu £gezifu  “请注意！请注意！迪化城在广播！迪化城在广播！现在，将通过无线电播送重要消息！我们，中国共产党，已经击败了盛世才政府，建立了新疆苏维埃政府，接下来将宣布昨日通过的第一条决议——彻底废除迪化的称呼，恢复乌鲁木齐的旧称……\n\n£gezifu £gezifu 我们承诺将民主，自由与社会主义带给这片土地和她辛勤的人民！” \n\n£gezifu £gezifu 这份广播稿，先后用汉语，俄语，蒙古语以及维吾尔语播送了一遍。\""
 COX_Landreform.005.t: "解放的先声"
 COX_Landreform.006.a: "“还是得动员贫农，土匪的事儿我让中央想想办法。”"
 COX_Landreform.006.d: "狗日的！”章高邮猛拍一下桌子，把刚进门的许明广吓了一跳。\n“怎么了这是？”\n“这些个地主给的花户册，我今天到几个村去核对，没一个字是对的！上坟烧报纸糊弄鬼呢！”\n“好好说话。”许明广有些不满的坐下说：“到底怎么回事儿？”\n章高邮冷静了下来，他坐回凳子上说：“老许，自打中央进了城，哈密是一天比一天乱。隔三岔五就有匪军路过这儿，他们是过一次抢一次。现在倒是不抢了，他妈的狗皮一脱，变成土匪在哈密扎根了！”\n“一帮流寇能给你难成这样？”许明广还是不理解：“刚解放那会儿，保安团在哈密县政府架了机枪，你们三个民兵队就给他端掉了。”\n“打老虎跟抓耗子他不一样啊。”章高邮叹了一口气，指着桌上的花户册说：“现在地主都在给这帮匪兵打掩护，我们连村里多少户人都不知道，这土匪衣服一换谁认识？”\n“本来也不能指望地主，咱们自己查不行吗？”\n“哪儿那么容易啊，哈密百十来万人，咱支部入党的都不够一百个，把我们全当驴使也查不完！”\n“那……要不动员一下哈密的贫农？你之前不是说哈密发展了不少积极分子吗？干嘛不让他们也来帮忙。”\n“问题不是干部不够，是战士不够啊！咱们民兵训练太少，一分散就没战斗力了。”章高邮拿起一份花户册说：“这儿的积极分子我可发掘好几年，让他们去查田，被地主报复了怎么办？”\n“这也不行那也不行，你给个办法。”\n“给办法？慢慢查呗，还能怎么办……”\n“不能慢。”许明广从挎包中拿出一封信说：“中央要求尽快恢复生产，迟则生变，你不能在第一步查田就卡好久。”\n章高邮接过信，看完后叹了口气又放下。许明广说：“要我说啊……"
 COX_Landreform.006.t: "抓耗子"
 COX_Landreform.007.a: "“岸英分析得有道理，同时我也建议我们集中力量，先专注于一个地区的改革。”"
 COX_Landreform.007.d: "“这些天来，各地的党组织都在报告新情况。”张闻天将文件分发给其他四人，单刀直入地说：“不太乐观。”\n陈云说：“目前阿勒泰那边的情况较好，溃逃过去的残兵都已经被控制和收编，生产正在恢复……”\n“但其他地区都报告了不同程度的反革命事件，特别是南疆。”陈赓皱着眉头说：“那里的地主已经有了和盛世才残兵勾结的迹象……妈的，苍蝇寻狗屎。”\n“他们根本不在乎当权者是谁，不管是国民党还是日本人……”刘少奇戴上眼镜说：“只要地主们能继续压榨农奴，阿訇能继续讲自己的经，他们就不在意……他们害怕新政权会夺走这一切，所以会到处寻反动代理人。”\n毛岸英感觉有些插不上话，只能一边看文件一边埋头记笔记。\n“东疆情况稍好，但当地依旧混乱，我们党员数量太少，很难稳住局面。”陈云说：“乌鲁木齐情况不差，但如果继续下去，粮食供应会出大问题，必须想办法解决。”\n“而且要快，我们不知道日本人是否在盯着新疆的情况。”刘少奇用钢笔敲了敲桌子说：“我提议，立刻开展土改运动，发动贫农，拉拢中农，孤立地主富农，在运动中发展积极分子，这是增强我们掌控力最行之有效的方法。”\n“不妥。”陈云说：“新疆各地情况不同，民族矛盾与宗教矛盾都客观存在，我们贸然行动可能会让反动势力抓住把柄，反倒失去了团结一切力量的可能。”\n“而且部分地区的经济发展极度落后，发动农奴加入运动非常困难。”张闻天说道：“在这种情况下，恐怕减租降息是最好的选择。”\n“岸英同志，你有什么看法？”刘少奇突然发问道。\n“嗯？哦。”突然被叫到的毛岸英下意识站起来：“我觉得……大家说的都有道理。”\n刘少奇摆摆手：“别紧张，坐下说。”\n毛岸英慢慢坐下，看着笔记说：“我觉得……新疆各地差异很大，必须针对不同情况应该采用不同的策略。我们现在对其他地区尚不熟悉，我觉得可以把北疆当作基本盘，同时在有一定控制力的东疆开展土改试验，待积累了经验后，再转向南疆……”\n见刘少奇仍然在看着自己，毛岸英说：“刘书记，这么说对吗？”\n“嗯。”刘少奇点点头："
 COX_Landreform.007.t: "碰头会"
 COX_Landreform.008.a: "“中央知道你们的困难，我们刚刚会议讨论……”"
 COX_Landreform.008.d: "回驻地的路上，毛岸英心里一直很堵。\n起义胜利后，他以八十八旅代表的身份成为新疆局的新常委。新工作意味着新责任，可起义胜利后，整个新疆局的同志们为了巩固根据地忙的连轴转，只有他格格不入，好似个闲人。\n在伊尔库茨克时，毛岸英只知带兵打仗，对于发动群众，巩固政权完全就是外行。\n或许正是考虑到这一点，刘书记和陈司令这段时间才一直帮助他适应这里，可这反而让毛岸英更感到惭愧。\n父亲说，要知道梨子的滋味，就得变革梨子，亲口吃一吃。岸英也这么想，他非常想换下军装，亲自到农村和工厂去做些工作。但作为八十八旅的旅长，他不可能抛下战士们自己到基层去。\n也许可以动员同志们和自己一起去？且不说这肯定会影响乌鲁木齐的防卫，更何况……他也得问问战士们的意见。\n正思考时，前面的混乱吸引了毛岸英的注意。\n一大群人聚在路口大声说着些什么，听起来一片混乱，而人群中赫然有穿着苏式军装的八十八旅战士。\n“小凤同志？”毛岸英认出挎着皮枪套的李敏：“你们这是怎么回事？”\n“毛旅长！”李敏向他敬了个军礼说：“昨天有个面粉厂的老板带着钱跑了，厂里工人们都没了工作，要到中央去告状！周旅长刚去找刘书记了，让我们在这儿陪着。”\n“那你们该领工人们去驻地才对，怎么能堵在路上？”\n“他们哪儿也不去，就要在这儿等，我们只能在这儿陪他们……”李敏的说话声越来越小，最后凑近他低声问：“旅长，这段时间新疆的同志们忙的一刻不停，咱们却一直在驻地闲着……新疆的老百姓过的这么苦，看的人心里急啊。”\n毛岸英听出了她的言外之意，他看到战士们都在耐心的听工人们诉苦，问：“同志们都这么想的吗？”\n“是啊。”李敏手叉着腰说：“这段时间大家都在讨论接下来有什么任务……旅长，咱们接下来有任务了吗。”\n“嗯。”毛岸英点点头，随后对工人们大声说道：“工人兄弟们，我叫毛岸英，我是新疆苏维埃中央委员。”\n工人们显然还记得这个名字，纷纷看向他。"
 COX_Landreform.008.t: "不谋而合"
 COX_Landreform.009.a: "尽管根须几近腐烂，院中榆树仍勉力支撑……"
 COX_Landreform.009.d: "榆驿村是哈密东北一个平平无奇的小村子。整个村子的中央立着一座大宅，院中有一棵大榆树，据说是雍正年间栽下的。\n如同族谱上记载的前十代人那样，王道明在这幢宅子中出生，聆听着祖先的故事成长——\n王家的血脉来自山西，在平叛途中，跟随宁远大将军岳钟琪来到了哈密。清军在这片水草丰沛之地建起了补给站，战争结束后，许多人并未选择返乡，反倒有许多亲友前来投奔，人们在村中栽下了那棵榆树，又因此地在战时曾作为驿站，故将此地称为“榆驿村”。在一开始，军人出身的村民们只懂埋头耕着几亩薄田，因此家家户户的生活都很拮据。直到王道明的六世祖想到可以依托此地沟通东西的交通条件，从事经商。他果断地典当了家财，拉起了一支驼队，在哈密收购毛皮，从中原带回手工品，赚到了第一桶金，引得人们纷纷效仿；除了商队，他还重拾了“驿站”业务，为往来商队提供餐食与住宿。鼎盛之时，西安，太原，甚至远至天津的商队都在榆驿村中停息，王家也因此积累了大量财富，一跃成为远近闻名的大家族。\n尽管总是听祖父提起一切落幕前的繁华景象，但王道明很难想象那时的情形，从出生起，父亲口中所称的只有衰退——商贸往来衰落，生意一日比一日更难做，还有在他幼年时，马仲英军队洗劫村子的噩梦日子……\n混乱使王家一落千丈，却是另一些幸运者攀登的阶梯，尘埃落定之时，村中已涌现了许多新贵，他们趁乱控制水源，并购土地，招揽流民……就连曾经辉煌的王家，也只能在新贵的施舍下开办学堂，为他们的后代教书，维持着最后的门面。"
 COX_Landreform.009.t: "无根之木"
 COX_Landreform.010.a: "现在，胡厚民二十四岁了"
 COX_Landreform.010.d: "胡厚民经常开玩笑说，红军走的是两万里长征，自己走的是一万里长征。\n他是武汉人，两岁那年家乡闹了鬼子，父母领着他一路逃荒到四川，想着蒋介石都搬到四川住了，还能出事吗？\n没想到几年后重庆被轰炸，两个妹妹都被炸死，他们只好往西北逃。十岁那年，他们逃到了新疆。这儿已经是中国最西边了，再往西也没处去了。\n此时他们又听到了战败的消息，想着仗打完了，该回家去，可其他逃荒的人告诉他们，四川那边到处杀人，陕西也在四处抓“赤匪”，家回不去了。\n举目无亲，语言不通，好在新疆够大，没了家乡的人们叹口气，在哈密扎了根，给这儿起名“外秧儿村”。\n有一天，他们村来了个说汉话的商人，姓章。\n章老板介绍村里人到迪化去做工，给他们卖种子和农具，那年他母亲生孩子，章老板还拉着医生来接生，因此很快得到了村里人的信任。后来章老板在村里建立了党支部，大家才知道章老板是地下党。\n可就算有章老板帮忙，哈密的生活依旧很艰苦。\n他们的地本身就是附近最差的，偏偏上游的水还被塔井村占着，塔井村的地主在上游修了坝，一到旱季就截流他们的水。\n他们去说理，反被家丁打了一顿，还遣人向迪化打报告，说他们窝藏共产党。很快就来了几队当兵的，在他们村打人抓人，还枪毙了他们家隔壁的一个老农民，事情才结束。\n那事之后，村里人非但没有责怪章老板，反而更信任他。章老板说，他们之所以过得苦，就是因为这里的地主控制了地和水，只有打倒他们，平分土地，大家的日子才能好起来。\n那年胡厚民十七岁，章老板答应他，等他再长大一点就介绍他入党。"
 COX_Landreform.010.t: "外秧儿"
 COX_landreform.1.a: "就好像做梦一样。"
 COX_landreform.1.d: "£gezifu £gezifu 许多年以后，看着集体农庄里排放着滚滚黑烟的拖拉机的老阿曼，准是会想起那天外出拉货回村子里，跟着工作组去分地主土地的日子\n\n£gezifu £gezifu 那时候，村子还是个几十户人家的村庄，一座座破烂不堪的土房随意地排布着，沿着河建的，是巴依老爷们的房子。那时河水清澈，沿着遍布石头的河床流。但那时，巴依老爷已经快不行了，工作队和农工会，黑天白日，川流不息地有人来看望。唠嗑会总能传出哭诉声，大家总是因为想起老爷们曾经做过的坏事，说着说着，就拖着这儿那儿残疾的身子，大声哭着。分土地的时候，被巴依老爷赶走的莫明也从山边的小窝棚里，回到家来了。那只能穿着破烂衣服的霍加很乐地拿着自己的地契，高兴地在村子里跑来跑去。以前在巴依老爷家里干活被活活打残疾的老肉孜拿着自己家分到的地契，坐在房子前，一个劲地哭，又一个劲地笑。\n\n£gezifu £gezifu 老阿曼以前是拉货的，他最自豪的事情就是拉着工作组进村。他常说，没有共产党，就没有现在的好日子。\n\n£gezifu £gezifu 工作组一般都是三十多岁的小伙，他们很精明，总是和老百姓们呆在一起，老百姓们怕啊，巴依老爷欺压了那么多年，他们一开始都不敢想分田的事情，总是念念叨叨这是真主给他们规定的命运。\n\n£gezifu £gezifu 工作组组员就挨家挨户地访贫问苦，找一些经历过一些悲惨的往事的苦人儿出来。一般会将目标人群锁定在老人、妇女及村里的边缘人这三类人身上。这几类人，总是最苦的。\n\n£gezifu £gezifu 之后，就要开诉苦会，让大家共情了，等大家在诉苦会上混明白了，也就不怕巴依老爷们和阿訇老爷们了。于是地就拿到了。"
 COX_landreform.1.t: "土改胜利"
 COX_Landreform.100.a: "中央基本同意你的观点，决定以此制定具体方案……"
 COX_Landreform.100.b: "应当以贫下中农为核心，彻底消灭各地反动势力……"
 COX_Landreform.100.d: "张闻天同志：\n梗电悉。\n一、经新疆局中央讨论，同意工作组在土改问题上“先北疆、后东疆、再南疆”的方案，待乌鲁木齐的物资调配工作完成后便即刻开展土改工作。\n二、红军八十八旅各团已前往新疆各地，除二团留守中央外，其他部分将在各地负责保护土改干部及解决匪患，并将配合完成后续一系列工作。\n三、关于土改政策问题……"
 COX_Landreform.100.t: "新疆局中央关于土改工作的指示"
 COX_Landreform.101.a: "重病下猛药！必须出铁拳！"
 COX_Landreform.101.b: "路得一步一步走，饭要一口一口吃"
 COX_Landreform.101.d: "致临时苏维埃的各位同志：\n当前乌鲁木齐的情况万分危急，我们面临的不是短期内的物资供应不足，而是城乡交换体系的全面崩溃。周边的村镇与乌鲁木齐间根本无法进行有效的交换——由于常年商品积压，工业品的价格已经低于成本，而日渐高企的粮价正促使更多粮商加入囤积居奇的队伍。\n究其原因，还是盛世才政府十年来失败的经济政策——城市工业过于依赖外贸，而乡村经济则缺乏彻底货币经济化。在西北危机爆发后，新疆对外贸易的渠道被彻底断绝，造成了大量中小企业破产，工人失业；再叠加旧政府统治末期滥发货币敛财，通货膨胀高企，乌鲁木齐——我们革命根据地的心脏，正径直坠入无可挽救的衰颓。危机迫在眉睫——城中缺衣少食，农村则缺少农具与过冬的煤炭，我们必须迅速行动，稳定经济秩序。雪上加霜的是，旧政府给我们留下了一个空前的烂摊子——新政府不仅缺少日元，卢布等民间认可的流通货币储备，更缺少贵金属，就连存粮都严重不足，这无疑将使得我们接下来的每一步如履薄冰。\n在昨日举行的新疆苏维埃临时物资调配处成立会议上，曾主导军队后勤工作方面的杨至成同志认为，应该采取军事化管制，类似战时经济状态；尽一切力量优先保证物资供应。之后再慢慢建立正常的经济体系。但与会的陈云同志认为：杨将军的举措可能有些过火了，实际上只需要使用一些正常的经济手段就可以平复当前的情况。只要政府进行一些政策上的助力，不需要太强力的军事化制度就可以让经济正常化。\n但无论如何，决定权都在政治局的各位。"
 COX_Landreform.101.t: "……接过烂摊子"
 COX_Landreform.102.a: "“我们都在慢性死亡”"
 COX_Landreform.102.d: "“开工吧？”\n“嗯，开工。”马汉民走进自己的纺织厂，对工人们如此宣布道，随后便愣愣地发起呆来。\n要开工，得用料，要雇工，得付工钱，可钱……钱哪里来呢？马汉民苦笑着，看着自己的帮工忙上忙下。他是专营织造的手艺，场子跟手艺都是传自他父亲，他父亲的产品，做不到全疆闻名，却也是商队愿意收购的好产品，订单不断地飞过来，怎么做也做不完……可现在呢？早些年还能卖去西伯利亚，生意不似平常，倒也可以糊口……但现在他的产品就连乌鲁木齐都难出！乌鲁木齐才多大点啊，要得了他多少产品呢？\n经过几次裁员，而今剩下的都是和他有深厚交情的老工，他们的工资已经拖了许久，只是失去工作后再无去处，便仍愿跟着他干。但马汉民也悉知，情况全无转好的盼头，如今货品堆积如山，粮价飙升，自己手中的新省币却几乎全成了废纸……毕竟活人不能被尿憋死——马汉民下定决心，去城周边的村子碰碰运气，兴许能拿布匹换些粮食，也能解燃眉之急。\n……\n牵着一辆马车，马汉民来到碾子沟村，今年的收成不错，但邻村的大巴依（商人）几乎垄断了所有农获。\n“你要是要用布换粮，一匹布折换10斤；要是想用钱买，我们只收日元和卢布。”\n“我这些都是好布，往日一匹至少能换50斤……”\n“要是不换就算了，你不想买我还不想卖呢！”\n半车布最后变成了小半车粮，心不在焉的拉着车马汉民看到了奋力耕种的农民身上打着补丁的单衣，不禁如此感叹道："
 COX_Landreform.102.t: "慢性死亡"
 COX_Landreform.103.a: "握到手里的才是自己的。"
 COX_Landreform.103.d: "新疆临时苏维埃，新疆苏维埃临时物资调配处令，为平抑物价，稳固经济，即日起废止盛世才政府所流通之”新省币“，并即日起发行”粮煤供销券“，城内外居民均可凭券一张兑粮一斤，亦可以凭积压商品兑券。同时临时苏维埃提倡组织手工业合作社，鼓励城中手工业者成立合作社互帮互助，合作社产品，服务由临时苏维埃组织统购包销……”\n大街上，小巷里，临时苏维埃的这一纸命令，正在被张贴，被宣读，被传播……“不过又是圈金条的新把戏……”马汉民挤在人群中艰难地辨读公告中的文字，末了却又是挤出人群，摇摇头：“说是“供销券”，我看就是在发新钞，不过是老把戏上新戏台唱罢了。”\n“可马老板，他说是凭产品可以兑粮券，粮券可以兑粮，我们仓库里那么多产品……”“哼，我前些天还去过村里，粮食都在巴依们手里，他们不开口，官仓里能有几粒粮？”身边帮工小心翼翼的话语立马被马汉民的不屑顶了回去，公告上确实讲得令人心动，可那终究只是在纸上写着的！就他对政府的认识，公告上十成的事能有三成办下来就是老天开眼，这新来的苏维埃能强得到哪里去呢？帮工话被顶了回去，也只能是闭口不言，跟在他的老板身后。\n回到自己的工场，帮工们还在忙上忙下，马汉民心顿时沉了下去，这个月的工钱看着看着到了要发放的日子了，可自己除开满仓的布匹，还有什么能发呢？前些日子换了些粮食的巴依，待他再次去找时，却一直闭门不得见。早时跟着自己的那个帮工，家里好像快断炊了，也难怪他对那公告那么抱有希望……公告？马汉民前进的脚步一下停下来，这新政府的公告才贴出来，就算是要圈金条也得学下商鞅立一下信，不如趁这个时候先下手为强……\n想到这，马汉民立马扯着嗓子叫工人们都停下来：“现在把手上的活都停一停，把仓库里的产品都装上车送到那什么新设的统购点兑券，然后马上换成粮食，回来给大家发工钱！”"
 COX_Landreform.103.t: "新的开始"
 COX_Landreform.104.a: "耕田者，不知饱足……"
 COX_Landreform.104.d: "如同那些与土地打了一辈子交道的农民，阿卜杜拉总是起的很早。每当天空泛起鱼肚白，他就提起那把老坎土镘，往兜里揣上几个馕，急匆匆下地去了。对他而言，时间是四季循环，而生活只是重复。即便数月前乌鲁木齐激战之时的枪炮声，也只是消散在风中，丝毫无法触及他的生活。\n直到今天，当他再次举起那把锈迹斑斑的坎土镘，用重复了千万次的娴熟动作挥下，就这样约莫小半日，一丝异样的感觉渐渐浮了上来：自己的老伙计似乎不再如同手臂的延伸般挥动自如，手柄与铁刃间的连接已经松动，令每次发力变得无比艰难；至于铁刃——这农具的核心，也早已在无数次磕碰中变钝，刃面变薄，刃口布满坑洼的豁口。\n这事说来蹊跷——阿卜杜拉素来从不懈怠农具的护理，每当流动铁匠老李来到村庄，他从不吝惜手中的“新省币”，总是叮嘱着将所有农具修缮一新……现在想想，老李似乎许久都没来了，不仅老李，如今天气转寒，卖布的老马，贩碳的小王都迟迟不见身影。\n 阿卜杜拉本想趁着今年难得丰收，给妻子添件新衣，便多卖了些粮给巴依吐尔逊。本想要点印着自己不认识文字的“外币”，结果巴依说只能一车粮只能换几张外币，要是换”新省币“，却能换厚厚一沓。阿卜杜拉细细算过，按往年的情形，换“新省币”是要划算些。这些钞票现在还在柜子里锁着，又不能穿，烧来取暖又嫌熏人，如果不换成能用的东西，他的全家在这个冬天就要受冻\n……\n “老乡，最近哪里有巴扎吗？” “前些日子打仗，巴扎早就停了，我二舅刚从城里回来，还听见炮响呢！”\n 回到家中，丧气地将坎土镘随手一掷，连年的疲劳都一股脑冲上了头，令他头晕目眩……"
 COX_Landreform.104.t: "一日劳碌"
 COX_Landreform.105.a: "幸运的是，阿卜杜拉最终换到了布，顺便修好了自己的坎土镘……"
 COX_Landreform.105.d: "对于阿卜杜拉而言，在入冬之前听到乌鲁木齐的巴扎重新举办无疑是绝好的消息。将换的纸钞揣进布兜，牵驴拖起一辆空车，他便上城去了。 \n沿着乌鲁木齐河行一段时间，抵达第二座桥，便是大巴扎的所在地。原有的场地上支起了许多新摊位，行人稀稀拉拉，商人卖力吆喝，而配枪的士兵戒备地望着路过的每一个人——这与自己记忆中的巴扎相去甚远——但在摊贩之中，阿卜杜拉还是望见了一个熟悉的身影。\n“马汉民先生？”——原来是之前常来村中卖布的老马，见阿卜杜拉至此，他摆出喜悦的神情，迎了上来，“贵客，我们这里都是上好的布，您挑挑看看吧。” \n“确实都是做衣服的好布”，摸了摸布料的质地，阿卜杜拉拿出布袋，掏出一沓厚厚的纸币，“您看，俺要出多少？”——“哎呀，新省币现在都废了，我们只收粮煤券，你有粮食也行……” “这是俺拿种的粮换的，之前换布换煤都行，现在咋就不行了？”\n“骚动很快引来了执勤士兵，“老乡，你家里还有粮食吗？” “俺就剩种粮和冬天的口粮了，你们不能这样欺负俺们农民啊……” “这样吧……你去那边的兑换处，找陈雷同志问问……”\n 陈雷曾是八十八旅的战士，此时被派驻至此，负责新成立的“物资兑换所”的运营。在计划之中，“物资兑换所”本是统购统销的一环，但由于政府直销的效果不佳，于是临时物资调配处便将销售的工作重新包给了对应商户。农户至此，可以选择以粮食直接兑换服务与商品，也可以选择兑换粮煤券。但仍有农民不时拿着已经废弃的“新省币”，也是令人头疼的问题。将阿卜杜拉安抚好，从他手中接过已成废纸的新省币，陈雷递给他数张“粮煤券”。 “现在你能去买布买碳了。” “……真稀奇，不都是纸嘛，有啥不一样的嘞……”"
 COX_Landreform.105.t: "新“巴扎”"
 COX_Landreform.106.a: "“我和其他弟兄们说好了，明天一早，就陆续拉粮上城去……”"
 COX_Landreform.106.d: "巴依玉苏普到家时，已是黄昏。妻子热娜连忙迎了上来，但从门口渗入的光芒模糊了丈夫的脸，让她看不真切，只是机械性地接过他递来的袄子，在他落座时端上一杯茶水。玉苏普坐定之时，先是如惯常那般，长吁一声，接着猛地灌一口茶，又掏出背在身上的烟枪，自顾自抽着。\n“怎地，粮价不是一直在涨，有什么忧心的呢？”看着丈夫的这般模样，热娜试探性问道。今年堪称风调雨顺，各地买卖粮食的巴依都趁机低价收了不少米，粮食堆得满仓满谷那时，丈夫也是如此长吁短叹——“粮食这么多，说不定粮价还抵不上运费呢！”——可能附近的巴依们都是如此忧心，纷纷说着“城里打仗，等安稳了再说。”便一齐不往城里运粮了。于是粮价数月来便一直上涨，低价购粮，高价卖，这年景真是前所未见！自己的丈夫经商多年，总是有赔有赚，莫非终于要转运了？\n正当热娜揣度自己丈夫心思的时候，玉苏普突然开口问道，“咱们家里还有多少日元？” “购粮的时候全散出去了，约么还有个三五百。” “卢布呢？” “早就没了，几年不见人用了。”  “那完了，完了啊……” “你先冷静下，到底是个什么情况？”\n……\n原来最近的粮价剧增，竟是周边的地主与大巴依们的合谋所致，今日他们便召集大小巴依，约定谁都不许偷偷卖粮。听完玉苏普的叙述，热娜的脸顿时吓得煞白——他们这些小巴依本就没法专做粮食生意，许多人的周转必须仰仗卖粮后换的日用品回村销售。现在不许他们卖粮，便断了周转；而若是真到了大巴依们看准的放粮之时，他们这些小商小贩恐怕连口汤都没得喝吧！\n“那现在怎么办？” 玉苏普猛吸了一口，似是下定了决心，“既然他们不打算让我们好过，那我们也没必要给他们好脸了……听说城里发了新币，政府正在收粮……”"
 COX_Landreform.106.t: "突破口"
 COX_Landreform.107.a: "反动派们正在行动！"
 COX_Landreform.107.d: "尽管一开始人们都怀疑新政府的动机，但随着第一个大胆的商人凭积压的商品换到了粮食，“新巴扎”——城乡物资互换所——便连同新的“粮煤券”一起成为了乌鲁木齐热议的话题。\n“一张券兑一斤粮”的承诺在“粮比金贵”的当下对大多数人都极具吸引力，而秩序井然的新巴扎也杜绝了黑市常见的混乱。这一切都使得新政权与“粮煤券”的影响深入农村。除去陆续拉着口粮进城，换取生活必需品的农民外，亦有不少巴依拉粮进城——他们早已厌倦了混乱不堪的市场与五花八门的货币——经由这些人之手，“粮煤券”得以更广泛的传播。\n当然，这一切并不是全无阻力。虽然物资调配处已经将“囤积居奇”视为最严重的打击对象，但只手遮天的大地主，大巴依总有办法逃脱追查，甚至还能想方设法给新政权使绊子。\n最简单直接的便是“不合作”，在城市长期缺粮的背景下，他们只要紧闭粮库，不让自己手上的粮食进入市场流通，就足够让新政权自行崩溃——但农民与小巴依的存粮缓解了城中的缺粮问题，新政权展现出了韧性。粮食毕竟是长在地里，粮库里的粮食可不会自行增值。在下一次收获之时，与新政权合作的巴依们手中大量的“粮煤券”，便会成为小农们最认可的货币，若是到那时，大巴依陈旧的粮食只能烂在仓里。于是他们开始更主动的出击，从只接收日元与贵金属的强买强卖，到拦截往城里运粮的车队……近日，一条传闻正在悄然传播在乌鲁木齐的大街小巷——近日雨水不调，加上夏日时的干旱，下次收成恐不理想。对于农民而言是不攻自破的谣言，但毫无疑问已经引起了许多市民的恐慌……"
 COX_Landreform.107.t: "无所不用其极"
 COX_Landreform.108.a: "“中央要你去塔井村，负责那里的土改工作。”"
 COX_Landreform.108.d: "胡厚民抽了一口烟，没想到自己像个小孩似的呛了一口。\n今天早上，他领着土改队逮住两个塔井村的富农，队里许多人都受过他们欺压，一怒之下就把二人打了一顿，然后把他们拉到塔井村的集市斗了一番，最后枪毙了。\n他不想承认，但当时看着脚边打的皮开肉绽的地主，又看着台下的人们，他确实犹豫了。\n当时，他看到台下赶集的人们，有些木讷的看着他，有些像是在瞧热闹，还有些人看到他手里的枪，吓的想跑又不敢跑。\n他隐隐感觉自己似乎做错了什么，可枪已经举起来哪儿有放下的道理？他还是硬着头皮打死了那两个人。\n他想跟台下的人们解释，自己是共产党，这是在干革命，杀富农是在给你们报仇。可道理却卡在他嘴边说不出来，直到他身旁土改队的同伴喊了声“杀的好”，他才回过神来。\n穿过麻木的人群，他们回村路上，两个声音不断在他的脑子里争论，一个声音问，这两个富农剩下的家人该怎么生活？岂不也要变成流民？\n可另一个声音骂他，这是中央的指示，你为什么要替富农操心？你不知道他们干过多少坏事吗？\n最后，两个声音逐渐汇聚在一起问：你还革不革命了？\n“妈的。”\n胡厚民骂了自己一句，怎么能不革命？要是不革命，自己还在街上要饭呢。\n可到底哪儿出了错？中央说了，革命就是组织力量专反动派的政，自己这不就是在专他们的政吗？不就是杀地主杀富农，给农民分地吗？\n富农明明就是些王八蛋，杀了他们为什么农民们一点儿也不高兴？\n胡厚民把手上晦气的烟头扔下踩灭，刚走进村，就听到身后传来骑马的声音。\n他抽出手枪回头看，一个穿着绿军装的男人翻下马问：“请问胡厚民同志在哪儿？”\n“我就是，你是谁？”\n许明广从腰包里取出一封信：“我是新疆局特派员许明广，来传达苏维埃中央的指示。”"
 COX_Landreform.108.t: "毙得不好"
 COX_Landreform.109.a: "“不管怎么样，先把情况报给工作组吧。”"
 COX_Landreform.109.d: "“来，喝吧，我们这儿也没别的。”夏邦银将盛满热油茶的茶缸放在桌上。\n胡厚民接过茶缸说：“老夏，我们进村四五天了，你是第一个招待我们的。”\n“嗐，咱们可是老乡。”夏邦银坐在对面说：“你也真是，七八年没见了，头回见面就是你在枪毙人，也就是我，换做别人谁敢搭理你？”\n“那你呢？老夏，你为什么不怕？”\n“那还用说？咱们连鬼子都见过，还怕枪毙？”夏邦银摆了摆手说：“况且打死那个王八蛋，我高兴还来不及呢。”\n“嚯？你这么想的？觉悟够高的啊。”\n“这算什么觉悟，村里人都这么想！那个吕王八蛋手上有七八条人命，村里没个不恨他的，枪毙都算便宜他了！”\n胡厚民皱着眉头，茶勺不断搅拌着油茶：“那为什么这两天村里人见了我们就跑？我这几天也没带枪啊？”\n听了这话，夏邦银俯身凑到他耳边说：“我听村口的人说，自从你枪毙了吕财主后，其他几个地主都吓坏了，碰巧那两天有群国民党的逃兵往东跑，路过村口的时候，吕财主家的主簿就给那个国民党军官塞了些钱，让他带着军队躲到山上去保着村里，几个财主给他们供粮。”\n“山上有国民党？”胡厚民惊讶的看向夏邦银，眉头皱紧：“所以村里人躲着我们，不是怕我们，是怕国民党？”\n“不止。你们来的前一天，村长在村口开会，说共产党做不了几天江山，已经有人去找日本人报信，要是跟共产党合作，等日本人来了要杀全村。”夏邦银给他搅干了的油茶里倒了点水：“所以我也是来劝你们的，趁没被发现，赶紧回去吧。”\n胡厚民扶着额头，反思着自己的所作所为，他不由的思考是不是自己导致了现在的结果。"
 COX_Landreform.109.t: "自食恶果"
 COX_Landreform.110.a: "塔井村第一生产队成立"
 COX_Landreform.110.d: "塔井村外，十几个看热闹的流民聚在一顶白毡房外，而房内正在召开第一次土改座谈会。\n“乡亲们，感谢你们来参加咱们的座谈会。”\n看着眼前这几个心不在焉的穷苦人，胡厚民有些不自信了，但还是提高嗓门说：“咱们六位是农会的第一批成员，是入会积极分子，咱们也不会亏待你们，无论是分地还是入党，都会让大家优先！”\n听到分地，几个人的眼神动了，一个皮肤黝黑的大叔举手问：“老爷，你说分地？分哪儿的地？”\n“我不是老爷，您叫我胡书记就行。”见终于有人搭了话，胡厚民有了底气：“今天叫大家来，就是商量分地，分的就是咱们塔井村的地！”\n“咱们村哪儿有地可分？能种的地都是有主的。”\n“您放心，今天能叫您来，咱们就肯定能给您分上地！”胡厚民拿出地图来：“乡亲们，咱们村南边一带的荒地，我找人测过了，足足有十五亩，够给咱们一人两亩地，剩下三亩归咱们集体。”\n几人小声议论起来，刚才那个老农民很快站起来说：“书记，你别蒙人，那是卤地，种不出粮食！”\n“您放心，我们有办法。”胡厚民直起身子来，说出他早就准备好的话：“我找农业的专家看过，那片地条件不差，只要用水把地里的盐分泡掉，施上肥，一点儿不比地主家的田差！”\n“农具和肥料都不用大家预备，只要肯干，咱们农会给大家每人分配一套农具。牛暂时没有，但只要肯干，缺什么中央给什么。”胡厚民越说越快，像个招揽买卖的生意人：“中央不但有牛，还有苏联的拖拉机，哈萨克斯坦的春小麦种、日本的化肥，只要咱们肯种，我保证咱们入冬前能收到粮食。”\n农民们的讨论更热闹了些，但怀疑的目光仍不时扫向他，胡厚民最后补上一句：“还有，收粮之前，只要劳动积极，农会还会每天发一斤粗粮，愿意参加的来这边按个手印。”"
 COX_Landreform.110.t: "座谈会"
 COX_Landreform.111.a: "再有私通赤匪者如此下场"
 COX_Landreform.111.d: "胡厚民刚走进屋就灌了一大口凉水，水顺着脖子流下也没顾上擦。\n这两天他嘴就没停过，一到农闲他就和村里的佃农们聚在一起聊闲。经过多天的努力他们终于打开了局面，陆续有人主动找他攀谈，其中不乏一些倾佩他的，悄悄夸赞他那天的“英雄事迹”，搞得胡厚民也都有些不自在。\n到现在，已经有好几个人私下表示愿意配合他们，比如今天他就在村东头找到一个特别积极的小伙子，又是问他枪怎么用，又是怎么土改，还问中央是什么样的。\n胡厚民从没有说的这么痛快过，那两个小伙子真让他想起过去的自己。\n小伙子虽然年轻，但对革命特别热情，不但答应给他们帮忙，还说会私下帮忙拉拢其他农友，塔井村所有农民他都认识。胡厚民也答应他，要是塔井村将来建党支部，第一个就给他入党……\n“嘭！”\n一声炸响震洒了胡厚民的水，他撂下杯子冲出去，看到夏邦银正拿着手枪，脸僵着。\n“怎么回事？”\n“有人开枪。”夏邦银下巴朝那边一指：“村东头。”\n胡厚民脸色一变，抓过枪就朝村东跑。\n村东头已经围满了人，乱哄哄一片，夹杂着血腥味，吵得人头疼。\n胡厚民发现所有人都看着同一个方向，他拨开人群，太阳穴剧烈的跳动。\n枯干的歪脖子树上挂着一个单薄的人影，随着西风轻轻晃动。正是不久前碰到的那个小伙子，喉咙被割开，翻出血红的喉管，鲜血顺着染红的前襟一直流到他胸前的木牌上，染红了上面的字。"
 COX_Landreform.111.t: "晴天霹雳"
 COX_Landreform.112.a: "中共新疆局关于伊州剿匪……"
 COX_Landreform.112.d: "土改工作组办事处内，胡厚民和夏邦银聚在桌前。\n“我记得刘生根家的佃农挺活跃的，是不是……”\n夏邦银摇摇头：“见不到人了，他们都怕。”\n胡厚民扶着额头：“前段时间中央发行粮煤券，要是在村里开一个粮煤兑换所……”\n“准没人来，现在村民连这儿都不敢靠近。”\n“那要不我联系一下中央，让他们援助一批化肥和农具，咱们村……”\n“老胡。”夏邦银把茶缸递给他：“喝口水。”\n胡厚民接过茶杯，叹了口气：“那你说怎么办？”\n夏邦银说：“你看过三国演义没有？”\n“看过几次驴皮影。”\n“我记得三国演义里有一段，是诸葛亮舌战群儒，说人重病的时候要先吃稀粥，等身体调和了再吃猛药，才能治好病。说刘备驻扎在新野的时候兵微将寡，就像人重病的时候一样。”\n胡厚民喝了口水：“你意思是，我现在是刘备？”\n夏邦银点点头：“咱们现在一没人二没枪，就算真有村民愿意帮咱，说不定反倒害了人家。要我说，要么土改这事儿先放一放，等风头过去；要么，你拉下脸去要点援助，单靠咱们肯定不行。”\n“援助，你说的容易，我……”\n一阵马蹄声传来，两人不约而同看向门口。\n只见板门“吱呀”的推开，一个身穿军装的男人走进来。\n“许特派员？”胡厚民惊讶的站起身。\n许明广向二人敬了礼：“厚民同志，夏邦银同志的入党申请通过了，中央还特批塔井村成立党支部，你暂任支部书记，我任副书记。”\n二人惊讶的看着许明广，没等他们说话，后者又从挎包里取出一支信封：“我还带来了中央下达的文件。”\n“中央的文件？”胡厚民接过信封。\n“中央还给你们派来了援助，一百支步枪，两百枚银元，还有电台和卡车。我会负责塔井村和中央的联络工作……”\n一连串信息让胡厚民有些头昏，他木讷的撕开信封，展开里面的文件。"
 COX_Landreform.112.t: "猛药稀粥"
 COX_Landreform.113.a: "中共新疆局"
 COX_Landreform.113.d: "[GetDateText]\n东疆各支部：\n由于各地国民党军东逃，大量顽敌化整为零，盘踞于东疆连通中原的交通要道附近。总参谋处推测，东疆兵匪约1200人，以喀尔力克山一线为中心活动，主要是位于阇鲁克山谷的原陇右防区警备团，塔井村东部草场的新疆省防骑兵34团，和垭口河上游的暂编三师331团。\n三支兵匪的驻地分布与山脉走势相同，据点间有明暗哨相互联系，呈锁链式分布。\n为确保新疆苏维埃政权稳固，东疆前委应在今秋冬至雪季前（八月至十一月中旬）组织各支部完成如下工作，并有指示：\n一、东疆前委应与八十八旅团部成立联合指挥部，确保双方指挥体系协同。\n二、哈密、伊吾等地需尽快在喀尔力克山周边村镇发展基层组织，并动员民兵与赤卫队，以监视和限制兵匪收集过冬柴粮，与匪活动区接近的村要尤其优先，中央会提供一切必要支持，必要时可设法与当地地主暂时合作。\n三、入冬前，各村应做好防御措施，防止土匪劫掠钱粮，八十八旅应与配合民兵部队做好保卫工作，以确保兵匪无法过冬。"
 COX_Landreform.113.t: "《中共新疆局关于伊州剿匪问题致东疆前委电》"
 COX_Landreform.114.a: "“好啊！我马上给中央打申请！咱们分头行动……”"
 COX_Landreform.114.d: "塔井村西，一间不起眼的白毡房，便是塔井党支部和八十八旅的联合指挥部。\n许明广和夏邦银围在沙盘前，观察着四周的地形。胡厚民拿着文件来到旁边说：“中央的意思很清楚，就是剿匪，问题在于怎么剿？”\n“根据情报，塔井村的土匪主要是骑兵部队，要赶跑不难，要剿灭不易。”许明广转头看向二人：“有什么办法？”\n夏邦银抬手指着沙盘说：“引蛇出洞。”\n“天山一片荒山，人无食马无草。几百兵匪聚在一起，如果没有周边的地主接济，特别是咱们塔井村，他们根本过不下去。”夏邦银扶着下巴说：“换句话说，如果村里的地主感觉到了威胁，找土匪求助，咱们就能把土匪引到村来。”\n“咱们只需要设下两支伏兵，一路潜伏在兵匪的据点附近，一路潜伏在进村路上。兵匪一旦下山，我们一支伏兵攻据点，烧他们过冬柴粮；一支伏兵和村里的民兵配合，伏击兵匪，就算他们侥幸逃走，也没办法过这个冬。”\n许明广有些惊讶，他问：“你从哪儿学的这些？”\n夏邦银摆了下手：“看三国演义学的。”\n许明广重新看回沙盘：“纸上谈兵，这个计划至少需要一个营的兵力，现在村里连十个人都凑不出。”\n“不能找团部支援吗？”\n许明广摇摇头：“调几百兵来村里，谁都看得出是陷阱。况且团部要负责整个东疆的防卫，不可能抽调这么多人来。”\n正当毡房陷入沉默时，胡厚民“砰”的一声拍了下桌子，引得二人都不约而同看向他。\n“所以还是要土改！”胡厚民拿起一封旧文件，满脸得意：“老夏，我有个好主意！你们听我说……”"
 COX_Landreform.114.t: "伊州之蛇"
 COX_Landreform.115.a: "“你们把地主的枪缴了？”"
 COX_Landreform.115.d: "土改办事处内。\n“村南边的荒地已经压过盐了，现在还在上肥，估计后天就能开始犁地了。”夏邦银一边翻看农会成员名单一边说：“今天新登记两个人，农会已经有三十三个会员了。”\n胡厚民点点头：“我考虑发展一批民兵，还有党员，咱们是不是该考虑发展新党员了？”\n夏邦银摸摸下巴，显然有些顾虑：“农会成员人数还是少，现在就是组织训练，也只能在农闲时，农友肯定不乐意。”\n胡厚民叹了口气：“那也·提前准备一下吧，咱们的枪怎么样？”\n许明广说：“枪没问题，子弹也管够。教官可以让团部派，但训练场的选址是个问题，打靶枪声大。”\n“嗯……那先带他们练刺刀……”\n“不过，”许明广打断他说：“我对现在农会成员的思想觉悟，以我目前考察的结果……现在的农会会员大多是图农会的利益，别说是入党了，就是作为民兵，我看也……”\n“胡书记！”门外传来大喊，一个农会会员气喘吁吁的跑到门口：“咱们的人和徐老爷的家仆打起来了！”\n“什么！”胡厚民一下子站起来：“你说清楚！”\n“徐老爷今天带了好多人去挨家挨户敲门，说要收米粮捐，在集市的时候碰到咱们农会的人了，就跟他们吵了起来，好多人都去了，要动枪了！”\n“不好！”胡厚民抓起手枪说：“老夏！你去叫人！我现在过去！”\n“骑我的马去！”许明广说。\n胡厚民跨上马朝集市一路狂奔，看到集市中央一群人乌泱泱聚在一起，中间绑着几个穿着讲究的男人，旁边则站着几个拿土枪和铁叉的农会成员。\n“怎么回事！”胡厚民下马问道。\n“胡书记！姓徐的派人来抢粮，被我们拦住了，枪也被我们给缴了！”带头一个黑脸汉子说道。\n“书记，你看！”几个会员得意的炫耀手上的长枪，至少有七八支。\n“徐老狗刚才溜了，现在就抓住这几个王八蛋。”汉子踢了一脚绑着的几人说：“书记，你说怎么办！”\n夏邦银和许明广也带人赶到，三人目瞪口呆的看着他们。"
 COX_Landreform.115.t: "先兵后礼"
 COX_Landreform.116.a: "这才哪儿到哪儿"
 COX_Landreform.116.d: "除了过节，塔井村从没有这么热闹过。\n村民们聚在村口，看着三辆粗犷的柴油车停在村口，前后两辆是军绿色的布篷卡车，中间则是一辆印着“廣澳港”图案的橙色巨车，看上去有火车头那么大，车后拉着一个十几米长的钢铁井架。\n村民们的议论纷纷，而此时，布篷卡车上跃下十几名带着冲锋枪的战士，一边为车开道，一边示意村民们让开路。\n巨车很快驶入村里，引擎的轰鸣声传遍全村，无论是农民还是富户都不禁停下手中的活儿转头看两眼。\n很快，巨车停在村子南端的一片空地上，车上的液压机一节一节缓缓撑起塔架，直到矩形塔架直直的指向天空。\n紧接着，机器发出震耳欲聋的轰鸣声，井架的钻杆驱动牙轮钻头钻入地面，离得近的村民不禁捂住耳朵，脚底被地面震得发软。\n钻头钻孔的同时，一旁的机器将泥浆注入钻杆，再不断涌回地面。\n夏邦银不禁有些感叹，调来一架石油钻井机，只挖一口小小的机井，实在大材小用，况且这么一口巨井，估计都够三个村用了，要维护恐怕也十分麻烦。\n但看着四周村民们敬仰又崇拜的目光，他还是把手插进口袋。\n“老夏，这是个什么东西？”一个村民实在忍不住过来问他。\n“钻井机，我们要给这儿挖口水井。”夏邦银强忍得意说道。\n“噫，这东西跟金箍棒一样大！你们用它挖个井？这都能把地府捅漏了！”\n“老夏，你们用金箍棒挖水，你们岂不是成了孙猴子了？”\n“老夏，你们挖这么大的井，我们能用用不？”\n“老夏，那些拿枪的是你们的人不？这么威风！”\n“老夏……”\n夏邦银和村民们说笑着，而当他移过视线，余光中瞥见人群中，有人正不怀好意的看着他们。\n夏邦银冷笑了一下，转头继续和农民们聊了起来。"
 COX_Landreform.116.t: "大闹龙宫"
 COX_Landreform.117.a: "“我接着写吧。”"
 COX_Landreform.117.d: "“我给马木提汗放羊，从十七岁放到六十岁，整整四十三年！羊从十七只变成一千多只，可我还穿着露肉的破羊皮袄，问他要几尺布做件衣裳，他说：‘羊是我巴依的，你放的也是我的，凭什么要布？’”\n“我的弟弟……才十七岁，不知怎么惹了麦斯木，被吊在树上打得半死，见我弟弟没声音了，不解气，又割了他的喉咙……那棵树喝的是我弟弟的血！”\n“那年修水渠，水老是漏，他嫌堵不住，就指着我的邻居艾山说：‘把他扔下去！’几个狗腿子就把艾山推进渠里堵水……乡亲们，咱们穷人的命在他们眼里，连条狗都不如吗？”\n按规定，诉苦大会只该选最有代表性的几个人上台，可开了三场后，乡亲们都跑来问能不能去讲，许多原本没参加的村民也陆续过来，胡厚民就又安排了几场，这是第十二场诉苦大会。\n现在大会上仍不断有哭声传来，从第六场后，胡厚民和站岗的民兵们就不再流泪，他只是默默记录着，反复咀嚼着桩桩惨案。\n愤懑顺着指尖传遍全身，笔尖晃个不停，他不得不咬紧牙关，扶着额头放缓呼吸。\n“我来写一会儿吧。”许明广拍了拍他的肩膀，放下一支烟。\n吐出一口烟后，胡厚民捏捏鼻梁，见许明广的笔像切豆腐一样稳：“老许，你不难受吗？”\n“谁都难受。”许明广头也不抬的说。\n“你不愧是当兵的，我今天哭了好几次。”胡厚民扔下燃着的烟头，用鞋跟狠狠碾灭：“这穷人各有各的苦，我一想起那些狗日的地主，真后悔当时没再枪毙几个……”\n“老胡。”许明广回头看向他：“别人能这么想，你不行。”\n胡厚民不解的看着他。\n“你忘了上次枪毙地主的后果了？”许明广放下笔测过身说：“你是党员，共产党人干革命，不能是为了伸冤，更是为了改造社会，让农民和工人彻底取代地主资本家，结束人吃人的旧社会。”\n“嗯……”\n许明广叹了口气：“等这儿的事情忙完，我带你去认识一下咱们团的姜政委。”\n胡厚民吐出一口浊气，拿起笔。"
 COX_Landreform.117.t: "义愤填膺"
 COX_Landreform.118.a: "这就是革命的力量吧"
 COX_Landreform.118.d: "塔井村南的一片空地上，许明广和胡厚民站在昨天搭好的木台上，检阅着眼前阵型严正的首批赤卫队成员。他们中不少人都是不久前参与抗捐的农会成员，虽没有统一的制服和装备，脸上却都挂着骄傲和期待。\n一旁，夏邦银和团部来的老兵们一箱一箱搬来步枪和子弹，引得前来看戏的村民们一阵好奇。本来开授枪大会是夏邦银的提议，理应让他上台讲话，可夏邦银却说自己不会讲话，主动让许明广替自己讲。\n“同志们！今天，我们有五十二名成员参加了新疆赤卫军。”\n“五十二人，是塔井村全村的八分之一。而几个月前，咱们的红军战士解放了全新疆，正好也是全中国的八分之一。”\n“全中国的八分之一啊，有几百万的农民兄弟，过去几十年里过着猪狗不如的生活。我听咱们有人说，最穷不过农民，最苦不过农民，可我今天要说，最强大也不过农民！”\n“过去咱们农民穷、苦，是因为咱们农民兄弟们一盘散沙、各过各的，地主打了、骂了也不敢吭声，更别提日本人了。”\n“可今天，咱们几十个农民团结起来，不到半年就有了自己的土地，有了新水井，还种下了第一茬粮食，塔井村，还有谁敢打骂咱们农民！”\n“没有！！”战士们不约而同的喊道。\n“同志们都知道，不久前，咱们农会五个战士团结起来缴下了地主的枪。今天，咱们农会五十多个赤卫兵团结起来，就可以在塔井村翻身做主人！”\n许明广举起右拳：“要是全新疆几百万农民联合起来，国民党反动派绝不是咱们的对手！要是全国几万万人民都联合起来，我们就能赶走日本侵略者，把红旗打到山海关，解放全中国！”\n“打倒土匪恶霸！”\n“解放全中国！”\n“打回东北去！赶走侵略者！”\n喊到打回东北时，胡厚民看到许明广眼中带泪，而许多八十八旅的战士们也跟着喊了起来，声音洪亮到让他有些脊背发软，双手有些发颤。"
 COX_Landreform.118.t: "授枪大会"
 COX_Landreform.119.a: "烽火动沙漠，连照伊州云"
 COX_Landreform.119.d: "塔井村东，人声鼎沸。\n在村民们的见证下，最后一箱地契被倒在歪脖树下，又被旁边的赤卫兵用脚扫到树根旁，像枯叶般堆成一座小山包。\n“所有参与卖地的农户都登记过了，地契也都核查过，现在塔井村全村1100亩土地的所有权……”夏邦银用登记本拍了下胡厚民：“都在你脚边了。”\n许明广带着一瓶烈酒来到胡厚民身旁：“这瓶酒，是我们入疆之前，一个老神父给我的，说这个能保佑我们平安。”\n“今天我就用它来庆祝塔井村的新生吧。”\n说着，许明广把酒瓶甩向歪脖树，酒瓶“嘭”的一声在树干上炸开，碎片和烈酒散在地契之上。\n村民们安静了下来，无数视线逐渐汇聚在在胡厚民身上，有期待、有好奇、有尊敬，更有几双恶毒的目光隐藏于人群。\n他视而不见。\n刺鼻的酒精味弥散开来，可胡厚民不但不觉头晕，反而无比清醒。他知道，现在的塔井村距离真正的新生，还差一场烈火的淬炼。\n这些天来，在全村人的努力下，塔井村成了东疆土改最快的几个村之一，也因其重要的战略位置，使他成为了兵匪和地主的眼中钉，和中央东疆剿匪的最前线。\n眼下，地主们之所以如此轻易的交出地契，绝不是向他们投降，而是为了在彻底撕破脸皮之前，用地契稳住他们，拖延时间，胡厚民敢肯定，天山上的兵匪绝对已经在做战前准备，而他和他身边的新战士们，将成为这场剿匪战争的先锋……\n夏邦银将一支烟和火柴递到胡厚民面前。\n“大家都等着呢。”\n接过烟，胡厚民擦燃火柴，深吸一口。\n“是啊，都等着呢。”\n烟雾在眼前慢慢消散，胡厚民侧目看向那颗喝血的老树，几个月前，一个年轻的小伙子被吊在枝上，没想到那节看起来粗壮的枝干不堪其重，折断了。\n胡厚民吐出一口烟，将燃着的半截香烟扔向那被酒浸湿的纸堆，火星顺着酒精引燃成山的地契，跃动的火焰不断向上爬去，燃着将眼前的古树燃成烈焰。\n“就用这团火，作为我们开战前的烽火吧。”"
 COX_Landreform.119.t: "“烽火”"
 COX_Landreform.120.a: "优先牺牲，也是共产党人的义务"
 COX_Landreform.120.d: "民兵训练场上，枪声和喊杀声此起彼伏。\n“第一批民兵的战术技能考核已经全部通过了，我挑了一些成绩优秀的出来，名单在这儿。”许明广将一份名单交给胡厚民：“后续会安排他们进行机枪、侦察、爆破之类的专项训练，其他老兵可以作为新教官训练其他民兵了。”\n“好啊，太好了。”胡厚民坐在桌旁，拿着名单前后翻看，笑着说：“这段时间参加赤卫队的人翻了几番，我还真担心教官不够用。”\n但读着读着，他脸上的喜悦逐渐褪去，又认真的看了一遍。\n名单上的人他都认识，每看到一个名字，胡厚民都会想起他的长相，他的声音，他的家人和朋友。\n而不久后，他们都要去剿匪战场的第一线，面对敌人的刺刀和子弹。\n“就这么决定了他们死活，对他们……”胡厚民叹了口气。\n“不公平？”\n“嗯……”\n“这个问题，我当年也想过。”许明广拍了他的肩膀：“我的老军长是个狠心人，枪毙过很多人，其中一些人……也许是不该死的。当年抗联里很多人都不理解他，包括周旅长。”\n“后来周旅长说，如果没有老军长，我们估计也会被叛徒出卖、被围剿，根本没机会到苏联，跟别说解放新疆了。”许明广放开手，直起身：“我那时想通了这个道理。中国几万万工农，生来就被鬼子、地主、资本家决定了死活。可现在，他们有了改变命运的机会，就看革命能不能胜利，为了胜利，有时必须做出牺牲……决定他人的命运，是共产党人的义务。”\n“嗯……你说的有道理。”\n“你还年轻，未来也许还有机会解放中原，解放东北，甚至解放世界，要记得。”许明广拍了拍胡厚民的肩膀：“担得下革命的代价，对得起革命的牺牲。这是周旅长对我说的，现在这句话送给你。”\n胡厚民点点头，问道：“那个老军长，后来他怎么样了？”\n“去苏联前，他被叛徒出卖，牺牲了。”"
 COX_Landreform.120.t: "共产党人的义务"
 COX_Landreform.121.a: "《塔井前委至中共新疆局剿匪战役详报》"
 COX_Landreform.121.d: "塔井前委指挥部。\n胡厚民三人走进指挥部：“汇报情况吧。”\n“是。”记录员向他们敬完礼说：“三小时前，情报员送来情报，土匪正组织人手，计划下山劫掠，兵力约二百人，预计明天夜里行动。”\n“200人下山，不可能只是征粮。”许明广讲一面旗插在沙盘上：“他们肯定有别的目的。”\n“中央最近没有活动，这些天往东的贸易也基本暂停了。”夏邦银摸着下巴说：“目标肯定是咱们，我猜多半就是得到了村里地主报信。”\n“果然跟你之前计划的一样。”胡厚民转头看向夏邦银说：“怎么样，依之前的计划吗？”\n见二人都点头，胡厚民双手撑在沙盘上。\n“通知所有民兵停止训练，立即组织村民去预定的避难所，并把所有过冬物资集中起来以免被劫。老兵排和八十八旅武工队转入战备。”\n“老夏，你领一排、二排和机枪队，分别在村主街中端和后端组织口袋，一排接敌后立刻后撤佯装战败，吸引兵匪追击。待兵匪全部进入主街后，二排和机枪队再还击，务必把他们堵在主路。”\n“我领三排在村口附近埋伏，一旦所有兵匪进入主街，三排会在村口堵截，将所有土匪一并堵在主街，然后前后对进，将兵匪一网打尽。”\n“许特派员，你领武工队提前埋伏在兵匪的据点附近，待兵匪大部队下山和村里交火后，立刻组织攻山，山上的柴粮全部烧毁，断绝土匪后路。完成之后立刻下山，在村外围组织防御，不要放跑一个。”\n“还有其余民兵，要配合主力在村里各小路配合防御，村里的制高点要安排射手。”许明广指着沙盘说：“二排防线要架上绊马索，以免骑兵冲击。还要打无线电向团部申请支援，如果计划顺利，就协助我们在外围围剿；不顺利，团部也能提前做好准备。”\n“我也补充一点。”夏邦银说：“给团部的卡车架上机关枪，和三排一并埋伏在村外。”\n“就这么办，行动吧。”"
 COX_Landreform.121.t: "剿匪战争"
 COX_Landreform.122.a: "“名单送一份给前委，咱们没空核查，别冤人了。”"
 COX_Landreform.122.b: "“名单上的挨个处理，咱们是模范村，不能出错。”"
 COX_Landreform.122.d: "这几天，胡厚民忙的连轴转。\n塔井剿匪大获成功后，东疆局势改变。东西两端兵匪据点的纽带被切断后，被各自击溃，作鸟兽散。潜藏在天山各处的兵匪没有了粮食和木柴，除了冻饿死就只剩投降一条生路。\n塔井村党委立了头功，前委的表彰一个接一个，还收到了中央首长的邀请，请他们去中央做更详细的工作报告，还希望他们去南疆协助当地干部工作。\n三人商量一番后，胡厚民把去中央的机会让给了许明广和夏邦银，自己留在塔井村做收尾工作，为去南疆做准备。\n二人走后，胡厚民一边主持公审大会，主要匪首和地主劣绅在村民的热烈要求下被枪毙；一面领导赤卫队接收家产，所有地主的土地和牲畜都被收归农会；偶尔还得帮忙接收下山投降的土匪，忙得够呛。\n今天他刚写好新的土改方案，还没喝口水办事处门又响了。\n“胡书记，你在吧。”\n“哎。”胡厚民放下杯子：“进来吧。”\n“胡书记。”一个年轻的民兵战士走进屋，手上提着一个筐，脸色不好。\n“怎么了这是？”\n“胡书记，你看这些。”\n小战士把筐放在桌上，胡厚民这才看出里面是一大筐字条，有些是汉语，有些是维语。胡厚民拿出几张仔细观察，发现上面记录的是村里的民兵出勤时间和人数。\n又拿起几张，或是农会成员名单，或是工作组近期的活动记录……除此之外还有和所谓“救国军”的来往书信，以及一张几十人联名的“请愿书”，希望配合山上的国民党下山“平乱”。\n上面的名字胡厚民大多认识，除了地主，更多的是村里的富农，中农和牧户也有不少。\n胡厚民认真的看了许久，又拿起几张来，边看边低声问：“这哪儿来的。”\n“抄家时候搜出来的，有一大堆，去的时候已经烧了好多，剩下的就这些。”小战士低声问：“书记，该怎么办？”"
 COX_Landreform.122.t: "公审"
 COX_Landreform.123.a: "“唉……”"
 COX_Landreform.123.d: "“土匪！法西斯！”夏邦银将名册摔在桌上：“不走程序就杀人！你就这么做工作！”\n胡厚民第一次见夏邦银发火：“我没让他们杀人……”\n“你没让？我让的？”夏邦银气的扶着桌子。\n许明广拿起桌上的名册，数出三十四个人，他回来时名单上还活着的只有十七个。\n“真不是我……我就是让他们去查，没想到他们会把人打死。”胡厚民声音越说越小。\n“你屁话！”夏邦银猛拍桌子：“让一群人拿着枪去查？你把之前在塔井村惹的祸都忘干净了！”\n“我……”胡厚民低下头，没再说话。\n“那是谁下令动枪的。”许明广放下名册：“这么大的事儿，总得有个负责的。”\n“真不知道……那几天太忙了，也挺乱的，真不知道是怎么成这个样子的。”\n许明广叹了口气：“你们抄家抄出的那些情报，电报一份给前委，真也好假也好，这段时间都得做好保卫工作，防止土匪反扑。”\n“错杀人的事儿怎么办？”夏邦银问。\n“你负责查，开枪的、打人的、用酷刑的，都要查到个人，查完一并汇报给前委，该怎么处理就怎么处理。之前名单上的人，要查清楚到底有没有通匪，无辜的要平反。但不管有没有通匪，他们都是村里人，都要照顾好他们家人。然后是你——”许明广回头看向胡厚民：“从今天开始塔井村的工作交给夏邦银负责，你党内处分也少不了，要写检查，明天在村会做公开检讨。”\n夏邦银看了一眼胡厚民，又侧过头去。\n“今天回去就去收拾行李。”许明广把一封调令放在胡厚民面前：“你已经耽误很久了，明天做完检讨就启程去喀什，去负责那里的土改工作。”"
 COX_Landreform.123.t: "黯然离场"
 COX_Landreform.124.a: "“参加农会可以，但入党，要看出身的。”"
 COX_Landreform.124.d: "胡厚民坐在圈椅上，一言不发的看着对面的老人，只见他戴上刚摸出的眼镜，仔细看着胡厚民的“剿匪计划书”和“土改方案书”。\n曼苏尔江·图尔迪老爷，村里最年长也最有威望的老人，也是个不小的地主。\n夏邦银候在门口，一同候着的还有几个旁听的小地主和富农。\n大院门口，两名战士背着冲锋枪立在门口，但院外还是聚起一群村民，好奇的朝院里看。\n许久，图尔迪放下计划书说：“胡长官，我都看过了。实不相瞒，这山上的土匪，我们也一直害怕。”\n“不只有剿匪，还有土改。”胡厚民说。\n“是，是。”图尔迪笑着点点头：“土改也好，你们的要求我都看了，不是不能谈。”\n“哦？”\n“我早年和共产党打过交道，我都知道，你们无非是想给穷人分地。”图尔迪拿出烟杆，点上火：“家业虽大，保不住也没有意义，我们都理解。不过……”\n图尔迪吐出一口烟：“胡长官也该理解我们。共产党向来把我们当狼，眼下老虎来了，要我们帮忙，可老虎赶跑了呢？我们还是要被赶尽杀绝，那岂不是自掘坟墓。”\n“……那你想怎样？”\n“胡长官，您看这样如何”图尔迪为胡厚民添上一杯茶：“我曼苏尔江愿意献出全家八十亩地，只保留够我们家吃的地，我还愿意拿出500银元赞助农会，如何？”\n胡厚民狐疑的看着他：“条件是什么？”\n“说不上条件，只是两个请求，一是我家这些工头和佣人，他们对我家地的情况了如指掌，我献了地，他们也就失业了。我想，不如干脆让他们去农会帮你们土改。我这些家兵，你们剿匪也帮得上忙。二是……”\n图尔迪老爷眼睛微闭成一条细缝，眼神隐蔽的左右闪烁，像只狐狸：“我家长子念过书，他就对共产党的书特别感兴趣，特别想认识你们，眼下正是个缘分，我想能不能让您做介绍人，让他和你们多接触接触？”\n见胡厚民没有说话，图尔迪接着说：“如果您同意，那我们家愿意全力配合土改，我还会帮您去劝说其他家也配合土改，保证您能在入冬前能消除匪患。”\n胡厚民看着眼前的茶水，摸着下巴，迟迟没有说话。"
 COX_Landreform.124.t: "从善如登……"
 COX_Landreform.125.a: "“你们去中央告状，让他们枪毙我胡厚民！”"
 COX_Landreform.125.d: "在村头的那颗老树下，胡厚民坐在石磨盘上，眼前是十几位村里的流民，他们大多和胡厚民一样，多是为避兵祸逃荒至此的，眼中无不混着渴望和麻木，是革命最积极的火绒。\n胡厚民简单说明了和几位地主谈成的条件，只要加入农会，土地均分，每人两亩，水利和农具也由农会提供。\n“胡老爷。”一个皮肤黝黑的维吾尔老人问：“农会是不是图尔迪老爷开的那个？”\n“什么？当然不是了，大爷您怎么那么问？”\n“好多人都在说，说图尔迪老爷和赤匪搞了个农会，去他那儿干活要给赤匪交军粮……我家可交不起，一点儿粮都没有了。”\n“不不，农会是我们共产党组织的……你们可以先不交，先种着，等你们有粮再说。”\n“哦……图尔迪老爷是共产党，难怪他收粮税那么少……”\n“不是不是，我们才是共产党，是给农民做主……”胡厚民有点乱，摆摆手说：“大爷，您都听谁说什么了？”\n一个四十来岁的汉子说道：“胡书记，你说你是共产党，是给农民做主的，你和图尔迪他们谈什么呢？”\n一石激起千层浪，人们三三两两的讨论起来，原本死气沉沉的气氛现在又乱了起来。\n“乡亲们，乡亲们！”胡厚民站在磨盘上大声说道：“都听我说！我们和图尔迪谈判，是为了他们家的地，农会分给大伙的地就是从他手上拿来的！”\n“你要他就给？”那汉子反驳道：“那天你们谈的时候我就在外面听着！你让图尔迪他们家的人去农会管事儿，他才给了土地的！什么共产党！你们分明是财主党！”\n“王叔，你这话不对！”夏邦银从人群后走出来：“又不是我们想找图尔迪合作，我们出此下策还不是因为农会你们没人参加！如果咱们农民能团结在一起，我们才不和图尔迪合作，直接抄他的家！”\n“是啊，我们共产党既是为农民做主，也需要农民兄弟支持。”胡厚民也赶快说道：“和地主合作只是权宜之计，如果咱们塔井村人都能参加农会，我们就不用和图尔迪他们合作了！”\n“你说的好听，要是你们偷偷和图尔迪沆瀣一气怎么办？”\n“这简单，东疆前委就在哈密，要是我真和地主蛇鼠一窝……“"
 COX_Landreform.125.t: "财主党，共产党"
 COX_Landreform.126.a: "“……再来和他们算总账。”"
 COX_Landreform.126.d: "“不到一个月农会成员就破了千，民兵也有百多人。”许明广放下名册：“照这个进度，已经可以准备剿匪了。”\n“我看塔井村就快成土匪老巢了。”夏邦银低声说。\n“什么？”许明广回头问。\n夏邦银说：“我说，农会照这样发展下去。就不是给农民开的了。”\n“我们……和村里地主达成了一些协议。”胡厚民解释道：“他们派了很多人来参加农会，现在不少农会成员和民兵都是原本给地主干活的。”\n“是吗？”许明广又拿起名册仔细看了一边，仔细看了一遍各个成员的出身和登记信息，许久才问道：“那名单上的新成员，是被组织着参加的，还是他们自己参加的？”\n“被组织进来的居多。”\n“嗯……既然这样，那就先做群众工作。”许明广放下名单说：“现在是剿匪的关键时期，这些问题等来年慢慢处理。”\n“现在农会里救没几个真农民。”夏邦银叹了口气：“怕到了那时候，就变成地主的茶话堂了。”\n“给你们讲个故事吧，是我从一个老兵那儿听来的。”许明广笑着坐下：“说抗战那会儿，有个党委要开辟根据地，可一没钱二没枪，就派了三个人去。”\n“三个人到敌后去开辟根据地，听起来不可思议，可几个月过去，他们新党员发展起来了，党支部组建了，几个人愣是在当地拉起了几百人的抗日武装。”\n“真的？这怎么做到的？”\n“很简单，派去的党员是本地人，他们靠着当地的关系一面拉拢区长和乡绅，一面和当地穷人串联，靠地主援助的枪组织革命队伍。”\n见二人意外的表情，许明广补充道：“不过，夏邦银同志的担忧是对的。那片根据地过于依赖统一战线，当地几个主要官员阵亡后，群众运动也很快垮了。”\n“不管怎么说，多亏了你们，剿匪工作才能开展。”许明广站起身说：“这段时间你们就开始筹备群众工作，想想宣传口号，发掘一下积极分子，等剿匪结束……”"
 COX_Landreform.126.t: "冬后算账"
 COX_Landreform.127.a: "至于之前那个被杀的小伙子，恐怕也只能这么算了……"
 COX_Landreform.127.d: "几天前，许明广的电报传来，兵匪的据点已经被捣毁，但胡厚民一点也高兴不起来。\n兵匪虽被击溃，却大多没有被俘，残兵四散逃亡，几次有计划的袭击村里。\n造成损失倒是次要，关键是村里之前不是没有被袭击过，可每次袭击，农会的人似乎都能提前得知消息，组织民兵反击，每次往往胡厚民还没到场，农会的人就把袭击打退了。\n胡厚民一直想查清他们的消息来源，可每次得到的回答都是“碰巧了”“听谁说得忘了”“不知道”。\n而这几次，他们的“预警”似乎失灵了，几次袭击都没被发现，而每次都精准的袭击到他们存粮的地方。\n后来根据八十八旅的侦察兵报告，抢劫后的兵匪也没有散伙或者另找驻地，而且继续向西，随后不知去向……\n村里的事情同样让他忧虑，这段时间靠着分地和群众工作，全村一半以上的人都参加了农会，原本无地少地的流民佃农也都分到了土地，一切进展的有条不紊，没有发生一点冲突事件，甚至比外秧儿村的土改还顺利，他们还因此得到了中央的表彰。\n直到上个星期，农会的民主选举负责人时，除了胡厚民，其他被提名和得票高候选人，不是之前民团的首领，就是原本地主家的家丁，甚至曼苏尔江·图尔迪本人都票数不少（他因捐献土地给农会，出身被改为富农）。\n而整个投票过程又完全没有造假，这些人要么是对村里工作了如指掌，要么是在抵御匪患时立了大功，甚至是因为图尔迪自愿捐出土地，很多人被他的“仁慈”而打动。村民们是真心支持他们。\n对于民主投票的结果，他们没有一点办法，即便重新计票，估计结果也差不多。\n不过这些事情现在和他无关了，他此时已搭上前往乌鲁木齐的卡车，短暂中转后便要前往喀什赴任，协助南疆的土改工作。\n塔井村的后续工作将由夏邦银接手，他相信夏邦银会做的比自己更好，但他还是不禁思考，是不是有什么阴谋没有被发现？"
 COX_Landreform.127.t: "喜忧参半"
 COX_Landreform.128.a: "失之东隅，收之桑榆"
 COX_Landreform.128.d: "土改办事处内，胡厚民坐在最阴暗的一间房里，边抽烟边叹气，房里乌烟瘴气。\n他刚主持完入党仪式，尽管他知道仪式办的再隐蔽也是掩耳盗铃，明天全村人也都会知道那几个地主子女入党的消息。\n但他还是不敢公开办，他实在感觉丢人。\n“你还在这儿啊。”夏邦银和许明广走进房间。\n胡厚民看到二人又很快低下头，像做贼一样。\n“入党名单我给中央送过去了。”许明广说：“已经连同你和村里乡绅的谈判结果。”\n“中央能同意吗？”夏邦银问。\n“党都入过了，同不同意有什么用？”许明广叹了口气，转头看向胡厚民说：“没回头路了。”\n夏邦银没有说话，倚靠在门框上，也侧目看着胡厚民。\n“说别的也没用了。”许明广摘下军帽坐在桌旁：“现在你打算怎么办？”\n“图尔迪说，他们会把土地经过农会过继给村里的农户，农具之类的他们也……”\n“我问的是你打算怎么办！”许明广敲了敲桌子：“现在地主已经进了党支部，你绝对不能被他们牵着鼻子走，否则塔井村就要让地主当家了！”\n“还有你，夏邦银同志！”许明广转过头说：“这段时间你是不是一直在当甩手掌柜？你还是不是党员了！中央安排的工作，有意见你可以提，但必须积极完成！否则你还不如这些地主！”\n夏邦银也坐了下来，点点头。\n“只要剿匪结束，这几个地主就翻不了天。前委已经收到了山匪的情报。”许明广站起身，戴上军帽：“接下来半个月，我都要在前委准备剿匪工作。这段时间八十八旅的战士还会留在村里，你们要确保地主不会彻底把持党支部和农会。”\n“别让中央失望。”许明广向二人敬了一个礼，随后驾马离去。"
 COX_Landreform.128.t: "木人拜火，屠户持戒，地主入党"
 COX_Landreform.129.a: "“倒不是来枪毙我的……”"
 COX_Landreform.129.d: "土改办事处会场内，在“塔井村土地改革胜利大会”的横幅下，胡厚民坐立难安。\n与他一同坐在台上的人很多，偏偏夏邦银不在，而此时正在讲话的是土改积极分子，曼苏尔江·图尔迪。\n“村民们，今天我很荣幸能作为积极分子在此发表讲话！”\n“归功于在党和工作组的英明领导，咱们塔井村的农民翻身得解放，我也深刻认识到了自己过去的错误，号召全村人自愿献出土地给农会。走到今天，我无比感谢胡厚民书记对我们的宽容和照顾，如果没有胡厚民书记的引导，我图尔迪也没机会作为积极分子，在这里和村民们讲话！”\n会场中响起零星的掌声，随后其他人像是才反应过来，稀稀拉拉的掌声陆续响起。\n胡厚民硬着头皮听着，台下无数双麻木的眼神让他满头大汗，恨不得钻桌子下面。\n昨天，他刚接到中央的调令，让他去南疆赴任。可眼下这情况他怎么敢走？他前脚敢走，这群财主后脚就敢给农会挂上他们的牌子，甚至党支部都不一定幸免。\n胡厚民真恨不得回到去图尔迪家那天，狠狠抽自己几个嘴巴，居然就这么把塔井村的党组织变成了地主的安乐窝！\n“胡书记，你也说两句吧。”图尔迪不合时宜的转头说道。\n“我……”\n会场门“嘭”的一声被推开，紧接着两队八十八旅的战士沿两侧迅速进入会场，荷枪实弹，将会场包围起来。\n许明广虽人群一同走入，径直走到台上，一把夺过麦克风。\n“人都在这儿了。”许明广拍了拍胡厚民的肩膀：“收拾行李去吧，这儿我来处理。”\n胡厚民简直见到了救星，连连点头，起身离场。\n接着两个战士走到台上，对着其他人说道：“请你们配合工作，去台下等着！”没等回话就把几个财主从台上拽下去。\n“我是新疆局中央特派员许明广，现在代表中央接管塔井村土改工作！请所有人配合，现在开始重新登记党员和农会成员的阶级成分，所有人听到名字上台！”\n走出会场后门的胡厚民见到了夏邦银，显然早已等候多时，手上拎着行李。\n“给你。”夏邦银将行李扔给他：“该去南疆赴任了。”"
 COX_Landreform.129.t: "黯然离场"
 COX_Landreform.130.a: "“他们来了赶走便是，不必和他们一般见识。”"
 COX_Landreform.130.d: "伴着鸟鸣声，王道明从自己的土炕上醒来，收起昨日夜读的书，他来到院中洗漱。透过院中老榆树的枝干，太阳洒下斑驳的光。与一般农人不同，王道明不需要起的比太阳早。从他记事起，家里的田产便仅剩渠旁几亩，无论父亲还是他都仰赖教书过活，故而田里仅雇着几个帮工，任其打理操持。\n与往常一样，王道明推开自家小院的大门，准备前去村塾。似是农忙时节已经过去的缘故，田地里少了农民们忙碌的身影，只有麦浪在清风中翻滚如常。\n私塾位于村子的边缘，曾是一间小旅舍。教室占着朝南的主厢房，里面没有一个人影，见之，王道明只是叹了口气——地主的孩子们都十分跋扈，是否来上课，几时来上课，都不是他这个先生决定的了的。拉开木门，进屋，王道明拿起昨夜读的书，继续品读起来。\n直到临近晌午时分，村中大地主马赛义才领着他的大儿子来了。“马兄，好久不见啊。”有些惊讶于马赛义亲至，王道明问道。\n  “王先生，这不是刚刚才把不孝子抓回来嘛，顺便来你这边看看。” 说罢，又转向怯生生缩在自己背后的儿子，笑骂到，“你这遭了瘟的，老子不抓你就不来念书是吧？” \n “圣人说过，学而不思则罔，思而不学则殆。令公子若是手不释卷，才要出问题呢！” 打着圆场，王道明将学生带进教室，吩咐他先复习功课后，便领着马赛义进了偏厢。\n“马兄，你今天特地来见我，是有什么要事吗？” “哎，王兄确实懂我！你有所不知，最近村里又来了共产党。之前许旅长就把他们撵出去过，没想到这回他们趁着晚上又回来了。等我们早上发现的时候，他们已经把我家还有买买提家的佃户叫出去了大半，说是开了一晚上的‘夜校’！王兄，你说这是什么事？十里八乡的地主，哪个有我对农户好，那群人怎么就不领情呢？” \n这番令人哭笑不得的话确实符合王道明对这位发小的印象，榆驿村的水源都控在马赛义手里，他当然可以少收租子，可若是算上水费，那佃户们可一点没少交！但王道明毕竟也受了马家的关照，所以只能陪着笑，说道："
 COX_Landreform.130.t: "阳光明媚的日子"
 COX_Landreform.131.a: "王道明轻轻点了点头。"
 COX_Landreform.131.d: "从小到大，王道明酷爱阅读，毕竟除去那幢宅院之外，曾经走南闯北的父辈们留下的最大财富便是来自五湖四海的书了。他读过来自中原的圣贤之语，也领略过先知穆罕默德的智慧。在少时，他就能与村中阿訇辩经；而在父亲尚且健在之时，他也数不清在学堂廊下度过了多少激辩的夜——辩论的主题现在看来甚是幼稚——人是否生而平等？\n圣人孔子曾说“有教无类”，先知也提倡“只要遵守圣训，即便是奴隶亦可做埃米尔。”但现实却是，农民的孩子7岁便要下地帮工，而地主的孩子，王道明的“发小”们，却庸碌终日，全无半分“君子”样子。在王道明二十岁的时候，父亲旧疾发作，卧病在床。王道明只能接过了村塾的担子，开始教导起他发小的孩子们。一开始，他满怀热忱，教他们用古之君子的品行约束自身，要求他们在太阳升起之时起床，一丝不苟完成习作……但事与愿违，这很快激起了学生们的不满。当家长们带着家丁，来他家中“兴师问罪”时，王道明的父亲只能拖着病躯，匍匐着乞求原谅。\n是啊，王家看似风光，也不过是新贵们手中把玩的花瓶。自那之后，王道明似是卸去了心气，见人时总是俯身做小，无论学生多纨绔，也总是由着他们的性子——毕竟人心不古，但圣贤也要吃饭。\n又是一个平凡日子，在从村塾返回途中，王道明突遇了一个陌生人。衣着破烂，眼中却有着不似农妇的警觉。不知怎得，王道明与她攀谈起来，“你是共产党吧。” \n对方猛地一惊，迅速打量着王道明的模样，开口问道，“你就是王道明先生吧？”   “你寻我有事？”   “老乡们时常提起你，都说你是个有德行的人，不知道您愿不愿意帮……”   “不帮！不帮！你快回吧。”说罢王道明便一甩长袖，作势要离开。\n没想到对方蛮不讲理地将他一把拉住，继续说道，“一些笔头活计而已，乡亲们在垦荒，需要有人帮忙统计，你是唯一认字的。而且我们有报酬……”\n转念一想，每日的村塾工作实在是闲的发慌，若在间隙做点工作也无伤大雅，更重要的是如果有了另一笔收入，就能逐步摆脱对那些新贵的依赖……"
 COX_Landreform.131.t: "亘古不变的日子"
 COX_Landreform.132.a: "“无论如何，人们已经组织了起来，我们可以试着和地主们交涉……”"
 COX_Landreform.132.d: "来到东疆后，李敏没有度过一天安心日子——仅是在哈密简单的歇了歇脚，残酷的斗争形势便将她推向了交锋前线。东疆本就是新疆局地下活动的中心，土改初期就形成了数个以流民聚居地为核心的大型革命中心，但反革命势力也因此警觉，得以不分民族信仰地“同仇敌忾”——在来榆驿村中途，她就遭到了兵匪的袭击险些丧命。而在村中的日子更是战战兢兢，不仅要小心兵匪的骚扰，更要处处提防地主使绊子。幸得有着部分积极群众协助，革命力量才勉强在村中扎根。\n现在，这场小小的阶级斗争陷入了微妙的僵局。在得知中央做出“团结大多数，孤立一小撮”的方针后，李敏决定试着从王道明身上入手——毕竟他德高望重，与村中地主的关系似乎也不错。更难能可贵的是他在垦荒时表现出来的品质，他并没有腐儒架子，反倒不吝吸取“农民们的智慧”——他应当是一个可以争取的对象。\n\n在村中新垦荒地的田垄旁，支起了一副旧桌椅，当农民们一日劳作结束之时便陆续来到此处。农具的损耗，开垦的进度……王道明负责记录的正是这些琐碎之事，再依据出工多少测算未来的分成。此时的记录必须详尽，才能免于争议。在今日的活计结束后，王道明并没有如往常那般直接回家，而是应邀前往了村东头的一幢小屋——屋主人在早年间逃荒去了，现在被村中的共产党人简单翻新后，当作临时基地，此事鲜有人知晓。\n\n “王道明先生，最近辛苦了。”李敏递上了一杯井水，继续说道，“乡亲们没有刁难您吧？” \n “没有，无非是各尽其能罢了。” \n “我就是不明白，这么好的地，离水也不远，怎么就让它撂荒了？” \n “那块地原先是张家的，大概五六年前，张家人全回迁到内地了。近些年倒是再没听到他们的消息了，帮衬的人陆续都散了。地虽荒了，但终归还是人家的地。”\n “凭什么是他的地，就凭那张不知道谁签的地契？张家人生死不明，村中没地的农民却还要吃饭……”\n “年轻人，我并不反对你们的做法……但问题是，你们接下来怎么办？地册都经过我手，光凭张家的荒地可不够给穷人们分。更不用说还有水的问题……”"
 COX_Landreform.132.t: "一次会面"
 COX_Landreform.133.a: "有人鄙夷，有人则被触动，决定伸出援手。"
 COX_Landreform.133.d: "即便自认博览群书，王道明对共产主义也只有一知半解。从流传的小册子中，他只晓得共产党主张打倒地主，把土地平均——颇似古代流民军，值得同情，却从未听说有成功的范例——如此主张自然遭到了村中富有者的一致反对，共产党人的到来令邻里间鸡毛蒜皮的小事彻底平息。各家收拢自家佃农，严阵以待，才最终逼退了尚在地下活动，资源捉襟见肘的共产党……现如今，他们取得了政权。当原先驻扎在哈密的军队将这个消息带来之时，一度在村中激起了恐慌。\n\n但如今共产党人已在村中呆了相当长一段时间，除去组织流民们垦荒，确实没做什么“出格”之事。这足以让部分中小地主改观——毕竟流民若长期没有正规谋生的行当，就免不了做些鸡鸣狗盗之事，而今在共产党的协助下，村中除去地主家的纨绔子弟们，倒是再也不见其他游手好闲之人了。\n\n王道明更是有耳目一新的发现——他一度认为共产党人离他们许诺的天国之间横亘着难以衡量的距离，所以他们的想法不过是一步登天。但他们的工作日积月累，切实改变了村子的面貌。如果王道明能出一份力，或许真能改变乡亲们的生活……\n\n一日，借着讲学的由头，王道明将自己学生的家长们召集至学堂处。“大家记不记得，自己的祖上是那里人？我们王家的先祖来自山西，康熙平准噶尔时迁居到这里…” \n 众人虽不知王道明用意为何，也七嘴八舌地接起话茬，“俺家是河南的，当年应当是跟着曾国藩将军入的疆。” “……天津人，做生意赚了钱，却被回乱拦着，只能在这儿置办了田产……” “…山东的…” “…湖北的…”\n “夫子周游列国，也时常想起故乡鲁地。大家的祖先来自天南地北，但此时此刻，我们无疑是有根的，就在这榆驿村……我们的祖先背井离乡之时，却要斩断自己的根……路途艰辛，前途不定，他们是否在路上受到过别人的恩惠？又能否祈盼自己的后代有朝一日能有一地重新安家？” \n……\n“……乡亲们，我想说的是，我们的祖上或许也做过流民，他们与我们并无多少不同，比起冷眼旁观，难道我们不应该伸出援手，帮他们也在这片土地上扎根吗？”"
 COX_Landreform.133.t: "求变"
 COX_Landreform.134.a: "马赛义本就身处进退不能的境地，经王道明点拨，反倒如拨云见日……"
 COX_Landreform.134.d: "经过长期脚踏实地的努力，共产党人成功融入了榆驿村居民的生活之中。在流民眼中，党是赠与土地的救主；在贫中农眼中，党是公正的协调者；甚至在部分小富农眼中，党的行为有迹可循，远比大地主们的一时兴起更好打交道。这当然少不了王道明在背后的斡旋，更要归功于驻村干部夜以继日的工作。而今，确信村中大部分已团结在了党的周围，李敏决定迈出关键性的一步——\n\n“水利设施的共营符合乡亲们的利益。试想，每个人要种地，要喝水，都离不开这道沟渠。如果它只是一两户的私产，大家要交租才能用，便免不了矛盾——下游的嫌弃上游多用了自己的水——水从每个人的门前过，又怎么能算的清……我们将负责组织水道养护队伍，确保水路的巡查，及时把漏水的地方都堵了……”\n\n……\n\n“哎，简直不像话！”边嘟囔着，马赛义将私塾的门窗关好，对着自己的发小轻声抱怨道，“才多长时间啊，村子里现在到处是共产党！”\n\n “哦，马兄何出此言呢？”借着透过窗户纸的微弱阳光翻着书，王道明问道。——“他们要把我家的地分了！”——“可那些地不也一直荒着，没人种吗？”——“他们还要把我家的水源公有了！我们的水权证就明明白白地在那里，到底有没有王法了？”——“如果你实在不服，为什么不去请许旅长呢？”——“哎！许旅长的部队听说是碰到了困难，再说，那些人竟然都说共产党人比许旅长手下的兵好多了，要是他们再来村子，便死活不让他们再进村，碰自家婆娘……”\n\n见马赛义一副垂头丧气的模样，王道明思虑再三，还是出口劝阻道，“马兄，须知从来只有人效仿天道，从未听说过天意遂人愿——现在所有人都站在共党那边，他们有人有枪，你要是对抗便不可能全身而退。但你要是配合，说不定还能确保之后的日子衣食无忧……不妨想想我们王家，以前多辉煌啊，如今还不是如过眼云烟？”"
 COX_Landreform.134.t: "针尖对麦芒"
 COX_Landreform.135.a: "尽管忧心忡忡，王道明仍陪着笑脸，不住得点头。"
 COX_Landreform.135.d: "尽管付出了努力，流民问题始终无法得到妥善解决。新开垦的土地无法满足数量庞大的流民群体，而蔓延在村民之间的不信任更成为了挡在任何改革前的巨大障碍。尽管有着王道明从中协助，党离实现自己的承诺——彻底解决流民问题——仍有相当距离。在李敏犹豫之时，时间仍在流逝，群众对党的信任正迅速消磨，或许此时应当作出妥协，进行必要的迂回——\n\n“……”\n\n夕阳西沉，散学时间已过，王道明呆在学堂，翻着杂书，聊以度过闲暇。突然间，门被倏地推开，原来是他的老友马赛义。他满面笑颜，将门重重关上，说道，“王兄，真如你所说，这共产党真是通情达理！”\n\n明明自己这位老友数日前还找自己细细数落过共党的不是，此时态度竟有了如此大的转变，王道明好奇地问道，“马兄何出此言？”——“共产党人今早找到我，说是能不能将手头的地便宜租给流民们，我们细细算了一通账，都觉得可行。”——“他们没和你谈什么条件吗？”——“谈了啊，他们说租子必须要按最低的来，当然一点问题都没有！我家里多的是耕不过来的好地，正缺人手，要是流民们肯搭把手，不闹腾，那真是再好不过！”\n\n看着这位老友眉飞色舞的模样，王道明感到一阵恶心——他再清楚不过这人的伎俩，开出的地租看似便宜，可其他方面却肯定要动手脚——水费，种费，耕牛和农具的租金，乃至贷款的利息，这些人有的是手段与资源，把合伙的农民敲骨吸髓。和他们进行合作无异于与虎谋皮，那些共产党真能斗得过这些精明的地头蛇吗？"
 COX_Landreform.135.t: "无计可施"
 COX_Landreform.136.a: "“无论如何，人们已经组织了起来，我们便不怕他们的权威……”"
 COX_Landreform.136.d: "来到东疆后，李敏没有度过一天安心日子——仅是在哈密简单的歇了歇脚，残酷的斗争形势便将她推向了交锋前线。东疆本就是新疆局地下活动的中心，土改初期就形成了数个以流民聚居地为核心的大型革命中心，但反革命势力也因此警觉，得以不分民族信仰地“同仇敌忾”——在来榆驿村中途，她就遭到了兵匪的袭击险些丧命。而在村中的日子更是战战兢兢，不仅要小心兵匪的骚扰，更要处处提防地主使绊子。幸得有着部分积极群众协助，革命力量才勉强在村中扎根。\n现在，这场小小的阶级斗争陷入了微妙的僵局。在得知中央做出“团结大多数，孤立一小撮”的方针后，李敏决定试着从王道明身上入手——毕竟他德高望重，与村中地主的关系似乎也不错。更难能可贵的是他在垦荒时表现出来的品质，他并没有腐儒架子，反倒不吝吸取“农民们的智慧”——他应当是一个可以争取的对象。\n\n在村中新垦荒地的田垄旁，支起了一副旧桌椅，当农民们一日劳作结束之时便陆续来到此处。农具的损耗，开垦的进度……王道明负责记录的正是这些琐碎之事，再依据出工多少测算未来的分成。此时的记录必须详尽，才能免于争议。在今日的活计结束后，王道明并没有如往常那般直接回家，而是应邀前往了村东头的一幢小屋——屋主人在早年间逃荒去了，现在被村中的共产党人简单翻新后，当作临时基地，此事鲜有人知晓。\n\n “王道明先生，最近辛苦了。”李敏递上了一杯井水，继续说道，“乡亲们没有刁难您吧？” \n “没有，无非是各尽其能罢了。” \n “我就是不明白，这么好的地，离水也不远，怎么就让它撂荒了？” \n “那块地原先是张家的，大概五六年前，张家人全回迁到内地了。近些年倒是再没听到他们的消息了，帮衬的人陆续都散了。地虽荒了，但终归还是人家的地。”\n “凭什么是他的地，就凭那张不知道谁签的地契？张家人生死不明，村中没地的农民却还要吃饭……”\n “年轻人，我并不反对你们的做法……但问题是，你们接下来怎么办？地册都经过我手，光凭张家的荒地可不够给穷人们分。更不用说还有水的问题……”"
 COX_Landreform.136.t: "一次会面"
 COX_Landreform.137.a: "“你们要为主道而施舍，不要自寻伤亡，你们要行善，真主喜爱行善的人们。”"
 COX_Landreform.137.d: "王道明是读孔孟长大的，对村头那座立了百年的清真寺，始终抱着读书人的分寸 —— 敬而远之。乡亲们做礼拜，他从不靠近打扰；人家过宗教节日，他从不上门叨扰；就连村里的阿訇在路上和他打招呼，他也只是客客气气躬身回礼，不过多攀谈。孔孟讲的是 “修身齐家、济世安民”，和人家念经拜主的规矩，终究隔着一层摸不着的墙。所以哪怕村上印发了关于宗教政策的小册子，他也不以为意。\n这天下午散学，他送最后一个小巴郎到村口，走在回家的路上，长衫的袖口磨破了边，布鞋也裂了个不大不小的口子，正暗自思衬着工钱的着落。路过清真寺的雕花桑木门时，门虚掩着，里头突然传出来的争执声让他下意识停了脚步。\n“瓦克夫份地，是信众举意献给真主的神圣之地，其中的产出，首要是修缮清真寺的穹顶、完成主命的功课，这是祖辈传下来的法度。天课的规矩是先敬主，后济人。次序乱了，便是对经义的悖逆！共产党妄想平分土地，更是对安拉的亵渎！”\n王道明听出这是驻村老阿匍的声音。“师父，弟子不敢悖逆经义，可您从小教我们，真主至仁至慈。经书里写着，‘你们当谨守拜功，完纳天课，孝敬父母，和睦邻里，救济贫民’。您看，完纳天课、救济穷苦，本就是和拜功并列的主命，从来没有先后之分。”另一种声音响起，音量不大，却字字都撞在王道明的心头。他认出这是年轻的驻村阿匍。“师父，法度的根，是善。” 艾力再次开口，声音里带着恳切的震颤，“瓦克夫份地的设立，本就是真主教导我们践行慈悯的根基。我们守着份地的粮仓，先顾着殿宇的彩绘修缮，却看着活人挨饿受冻，看着孩子读不上书，这难道是真主想要的虔诚？”\n王道明靠在门廊的柱子上，浑身猛地一震，怀里的手抄课本差点滑落在地上。原来不管是读圣贤书的书生，还是信真主的信众，不管是写在四书五经里的 “仁义”，还是刻在《古兰经》里的 “慈悯”，人心底里那点见不得人受苦的软心肠，那份想让旁人过得好一点的本心，从来都是相通的"
 COX_Landreform.137.t: "辩经"
 COX_Landreform.138.a: "沙漠深处，是他选择的命运"
 COX_Landreform.138.d: "东疆土改宣告了胜利，村头的老榆树上飘扬着红布，在风中猎猎作响。王道明心中满是复杂，尽管工作队的行为在他看来过于出格、甚至专横，但他不得不承认，共产党终究实现了千百年来伊斯兰与儒学共同的梦想——耕者有其田。曾经颠沛流离，食不果腹的佃户与流民分到了土地，荒芜之地被开垦，往日的窘迫饥寒，渐渐被安稳取代。\n王道明理解分田的必要，可阶级冲突中的极端暴力令他万分惊恐。最难忘那场批斗会，马赛义被翻身农民围在中央，百年积怨尽数倾泻。他明白，马赛义祖上囤地盘剥，罪有应得，可血淋淋的场面仍让他辗转反侧：是否有更温和的方式，既能均平田产，又能守住仁恕底线？\n这份疑虑日夜困扰着他，他找到驻村工作组中最温和的干部倾诉。油灯下，两人激烈争论：王道明援引“己所不欲，勿施于人”“不以仁政，不能平治天下”的道理，劝说干部摒弃暴力；干部则直言阶级斗争残酷，不进行彻底的变革只会让剥削阶级反扑。一番争论后，王道明未被说服，只得行礼离去。\n马赛义的土地和牲畜被全部剥夺，不堪落差与羞辱的他，趁夜躲过巡查逃了出去。不久后，王道明从往返的村民得知，马赛义加入了抵抗组织，与溃散的前军阀、土匪山贼及其他失田权贵结伴，偷袭工作队、抢夺粮仓，执拗地对抗着新政权，王道明扼腕叹息，却又无能为力。\n一日夜里，风沙呜咽，月色晦暗。他备完塾课，已是更深夜静，刚要歇息，竟传来了几下敲门声。开门后，衣衫褴褛、满眼血丝的马赛义闪身进来，眼神决绝，没多余寒暄，只将一封油纸信塞给他，厉声说道：“你爹老相识在南疆，邀你过去。东疆已毁，别让他们再毁了南疆，你识字又有学识，比我们这般山野村夫能成事，要阻止红祸！”\n王道明攥着那封油纸信，内心满是踌躇与挣扎。他从未反对新生的人民政权，可又无法接受那些激进的行径。他反复权衡、辗转难安，几番挣扎过后，他终于做出了决定——次日清晨，他依依不舍地关闭私塾，将自家薄田托付给乡亲，背着行囊迎着戈壁晨露，毅然踏上了前往南疆的路途。"
 COX_Landreform.138.t: "彷徨"
 COX_Landreform.139.a: "不让东疆的悲剧在南疆重演。"
 COX_Landreform.139.d: "东疆的土改终是宣告了胜利，可这份胜利，可在王道明眼中，不过是一场荒唐的愚行。共产党先是声势浩大地分配土地，让贫苦乡亲抱着“耕者有其田”的希望开垦耕种；可没过多久，工作队便陷入了过激的误区之中，工作队定下的划级标准粗暴而荒唐，执行过程滥用暴力，毫无执政章法，赤裸裸暴露了他们的无能与鲁莽。\n土改的反复与剥削阶级的滥划彻底搅乱了村中秩序，许多百姓陷入困境。马赛义便是如此，马家的财产被没收分配，家中的耕牛、农具被悉数拉走，米仓被强行破开充公。他试图阻拦，被工作队斥责为“反革命阶层”、扬言惩戒。马赛义深知留下来必死无疑，便趁深夜躲过工作队巡查，悄悄逃了出去。\n不久后，王道明从逃返村民口中得知，马赛义加入了周边的抵抗组织，与前军阀残余、土匪山贼、破产地主，甚至还有在运动中受害的农民结伴，以偷袭工作队、抢夺粮食、破坏账簿的方式，执拗地对抗新政权，宣泄着愤怒与绝望。\n王道明心里只剩满心悲凉与失望。他信奉“修身齐家治国平天下”，期盼有一个清明政权让百姓安居、孩童向学，可眼前的一切击碎了所有憧憬。看着百姓流离、孩童失学，他心中的无力感化作愤慨。\n一日夜里，风沙呜咽，月色晦暗。他备完塾课，已是更深夜静，刚要歇息，竟传来了几下敲门声。开门后，衣衫褴褛、满身硝烟的马赛义闪身进来，眼神决绝，没多余寒暄，只将一封油纸信塞给他：“你爹老相识在南疆，邀你过去。东疆已毁，别让他们再毁了南疆，你识字有学识，比我们这般山野村夫能成事，要阻止红祸！”说完便冲进夜色。\n王道明攥着信纸，指尖因用力而泛白，未拆便已下定决心。他回望陪伴自己多年的私塾，毫无眷恋，熄灭油灯、锁上院门；分配到的几亩薄田，也任由其撂荒。夜色深沉，他背着行囊、揣着信，踏着风沙奔赴南疆，心中只有一个坚定念头......"
 COX_Landreform.139.t: "以怨报怨"
 COX_Landreform.140.a: "“虽千万人吾往矣”"
 COX_Landreform.140.d: "东疆的土改终是落下了帷幕，村头老榆树上飘扬着红布，在戈壁风中猎猎作响。工作队踏遍各村宣讲政策、公平丈量土地，既严惩了作恶多端的劣绅，也给主动交田的地主留足了情面。穷苦百姓分到土地勤恳劳作、满怀憧憬，昔日乡绅也大多放下芥蒂，或耕或商。\n由于政策的局部妥协，爱国富农与小地主的经济基础未被完全消解，影响力仍在乡里存续，部分激进农户对此颇有微词，工作队常在两个阶层间频频奔走调和，虽有细碎摩擦不断，总体局势仍在可控范围。\n王道明看着眼前安稳祥和的景象，心中满是欣慰。他虽只是一个手无缚鸡之力的书生，却也尽己所能，配合工作队的工作。走家串户，用孔孟的“仁者爱人”“不患寡而患不均”之道，劝说乡邻放下怀疑，理解土改政策的深意。尤其是苦口婆心地劝说抵触土改的马赛义，让其主动交出多余土地和耕牛，才得以保住最精华的水浇地，靠着自己的双手耕种。\n一日夜里，风沙呜咽，月色晦暗。他备完塾课，已是更深夜静，刚要歇息，竟传来了几下敲门声。王道明放下手中的狼毫，起身打开院门，一个将面容裹得严严的信使闪身进来，眼神决绝，没多余寒暄，只将一封油纸信塞给他，便窜入黑夜，不见踪影。王道明迷惑地拆开信件，纸上写道：“贤侄，东疆土改之风已至喀什，我等惶恐。我与诸位阿訇、乡邻非盘剥之徒，仅守薄产、清真寺与信仰。我等忧心政策南下，夺我祖产、毁我清真寺、践我信仰，致乡亲流离。”\n”吾与汝父至交，深知汝仁善有学识，懂孔孟之道，亦敬各族信仰。恳请贤侄速赴南疆，助我等谋划对策。事态紧急，切勿耽搁，晚则恐生祸端，悔之晚矣！”落款是父亲的旧友，一位在南疆德高望重的大阿匍\n王道明读罢心头震动，冷汗直流，瞬间明白邀请背后是希望他加入反抗新政权的队伍，可他清楚对抗只会连累无辜、引发动荡，但转念一想，对方的恐惧不无道理，加上碍于父辈的旧情。一番挣扎后，他决心借此机会只身前往南疆，传播苏维埃政权和土改运动的真貌。\n次日清晨，他将私塾托付给村党委，嘱托他们继续教书育人的工作。又将自家薄田交给马赛义代管。随后，王道明背着行囊，踏着戈壁晨露，毅然奔赴南疆。"
 COX_Landreform.140.t: "以德报怨"
 COX_Landreform.141.a: "风沙未止，前路漫漫亦茫茫"
 COX_Landreform.141.d: "东疆土改终是宣告了结束，宣传栏张贴着当地最大的反动地主乌依股尔被诱骗软禁在乌鲁木齐的消息。这场以“耕者有其田”为初衷的变革，在工作队对地主阶层的过度妥协中逐渐走样。地主们表面承诺低田租，转头却在水费、籽种、耕牛农具租赁乃至贷款利息上层层盘剥。\n王道明看着眼前看似平稳、实则暗流涌动的景象，心中只剩愤慨。在他看来，中央并不在意农村的真正福祉，所有举措不过是为了自己的巩固统治。他想起马赛义，当初自己苦口婆心地劝他配合工作，说服他只保留最精华的几亩水浇地，还赚了个”红色乡绅“的美誉。可让他彻骨心寒的是，马赛义竟仗着“红色乡绅”的身份，转头变本加厉欺压周边农户。世道兜兜转转，压迫从未消失，他对这片土地的前途陷入悲观。\n一日夜里，风沙呼啸。院门外传来敲门声，一个将面容裹得严严实实的信使闪身进来，塞给他一封油纸层层裹住的信，便窜入黑夜，不见踪影。\n王道明疑惑地拆开信件，纸上写道：“贤侄亲启，“贤侄，东疆均田之风已至喀什，更有东疆名门被诬至乌鲁木齐软禁。我等惶恐。我与诸位阿訇、乡邻非盘剥之徒，仅守薄产、清真寺与信仰。我等忧心政策南下，夺我祖产、毁我清真寺、践我信仰，致乡亲流离。\n吾与汝父为至交，深知汝仁善有学识。亦敬各族信仰。恳请贤侄速赴南疆，助我等谋划对策。事态紧急，切勿耽搁，晚则恐生祸端，悔之晚矣！”落款是父亲旧友，一位南疆喀什的大阿訇。\n王道明读罢心头震动，明白南疆地主与阿訇们对新政权的警觉。可他对东疆早已心灰意冷，这片土地的荒唐与不公，早已磨平了他所有的期待。一番思忖后，决心借这个机会独自前往南疆。\n次日清晨，王道明将私塾连同所有书籍教具托付给村党委，嘱托他们守住教书育人的本心。又将自家分到的薄田交由马赛义代管。告别乡邻后，他背着简单行囊，踏着戈壁晨露，忐忑地奔赴南疆。"
 COX_Landreform.141.t: "不尽人意"
 COX_Landreform.2.a: "重病下猛药！必须出铁拳！"
 COX_Landreform.2.b: "路得一步一步走，饭要一口一口吃。"
 COX_Landreform.2.d: "致临时苏维埃的各位同志：\n当前乌鲁木齐的情况万分危急，我们面临的不是短期内的物资供应不足，而是城乡交换体系的全面崩溃。周边的村镇与乌鲁木齐间根本无法进行有效的交换——由于常年商品积压，工业品的价格已经低于成本价，而日渐高企的粮价正促使更多粮商加入囤积居奇的队伍。\n究其原因，还是盛世才政府十年来失败的经济政策——城市工业过于依赖外贸，而乡村经济则缺乏彻底货币经济化。在西北危机爆发后，新疆对外贸易的渠道被彻底断绝，造成了大量中小企业破产，工人失业；再叠加旧政府统治末期滥发货币敛财，通货膨胀高企，乌鲁木齐——我们革命根据地的心脏，正径直坠入无可挽救的衰颓。危机迫在眉睫——城中缺衣少食，农村则缺少农具与过冬的煤炭，我们必须迅速行动，稳定经济秩序。\n在昨日举行的新疆苏维埃临时物资调配处成立会议上，曾主导军队后勤工作方面的杨至成同志认为，应该采取军事化管制，类似战时经济状态；尽一切力量优先保证物资供应。之后再慢慢建立正常的经济体系。但与会的陈云同志认为：杨将军的举措可能有些过火了，实际上只需要使用一些正常的经济手段就可以平复当前的情况。只要政府进行一些政策上的助力，不需要太强力的军事化制度就可以让经济正常化。\n但无论如何，决定权都在政治局的各位。"
 COX_Landreform.2.t: "……接过烂摊子"
 COX_Landreform.201.a: "能容骆驼之处难容人。"
 COX_Landreform.201.d: "胡厚民到喀什那天，是黄昏。\n驴车把他扔在村门外头，车夫指了指方向，掉头就走了。他扛着行李站在那儿，看着那座灰扑扑的村子，看着那些低矮的土房子和远处冒尖的清真寺拱顶。风卷着沙子打在脸上，生疼。\n他找了间空屋子住下。土墙，土炕，一扇漏风的窗户。夜里躺下，能听见隔壁孩子的哭声，能听见远处狗叫，能听见风把什么东西刮得哐当响。他睁着眼躺了很久，想，这就是南疆了。\n第二天一早，他开始走。一条巷子一条巷子地走，一户人家一户人家地敲门。有人开门，有人不开；有人给碗水喝，有人直接把门关上。他蹲在墙根底下啃干馕的时候，看见几个孩子围过来看他，他又把馕掰成几块递过去。\n与此同时，在几十里外的喀什城内，王道明也安顿下来了。\n亲戚给他腾了间屋子，不大，好歹不漏风。他坐在炕沿上，听着院子里亲戚一家人叽叽喳喳说话，说的维语他得仔细听才能听懂大半。\n第二天，他也开始走。不是去敲门，是去认路。小时候走过的巷子还在，可人都不认识了。他站在巴扎边上，看着那些卖馕的、卖瓜的、卖布的人来人往，忽然不知道该往哪儿走。\n傍晚回去的时候，他在巷口看见几个穿黄军装的人走过去。他没在意，低头进了院子。\n他不知道那些人里头有个叫胡厚民的，胡厚民也不知道有他。"
 COX_Landreform.201.t: "开凿顽石"
 COX_Landreform.202.a: "老虎威风在于虎皮， 巴依富有在于狡诈"
 COX_Landreform.202.d: "干枯的玉米杆耷拉着焦黄的叶子，连影子都缩成一团，躲在秸秆底下｡  一个佝偻的老人坐在地垄上，瘦小的身形几乎要被那点可怜的阴影吞没｡ 他的手掌撑在滚烫的沙土上，像一块被晒裂的土坯｡ \n\n在他对面， 土墙投下的一片阴凉里，一个肥硕的男人斜倚在摇椅上｡ 浓眉下眯着两粒小眼睛， 嘴里慢悠悠地嚼着葡萄，籽儿和汁水顺着嘴角淌下来，滴在胸前油亮的袷袢上｡ \n\n “喂！图尔荪 ‘驼背’!”那声音从阴凉处砸过来\n\n “你胆子比狮子还大啊，我让你歇着了? ”\n\n话音未落， 旁边摇扇子的随从已经窜了出来“聋了? 老爷说话听不见? ”\n\n图尔荪没吭声｡ 他一只手撑地，想把身子支起来， 可那只胳膊抖了抖， 又弯了下去｡ 他改用两只手，像一头快要累死的牲口那样， 四肢着地，缓缓把腰直起来｡ \n他抬起头｡ 库车的天还是那么蓝，蓝得刺眼｡ 他只是稍微抬了抬眼皮，太阳就猛地扎进他的眼窝，顺着眼窝钻进脑子里｡ \n巴依还在说什么｡ 嘴皮子在动， 吐出的葡萄籽在半空划了一道亮晶晶的线｡ 随从在旁边点头哈腰， 又转过脸来朝这边吼｡ 但图尔荪听不见了｡ 他只看见那两片嘴皮子一开一合，像干涸的河床上的两条死鱼 ｡ \n\n他站直了身子，晃了晃 ｡ \n\n远处的嘴皮子还在动｡ 图尔荪低下头，扛起搁在地头的坎土曼 ｡ \n\n那木杆烫手，但在他一生所有能下地的光阴，都要与之相伴。"
 COX_Landreform.202.t: "硕鼠"
 COX_Landreform.203.a: "饱狼舔起了饿狼的屁股。"
 COX_Landreform.203.d: "烈日照在那座废弃炮楼的顶上，剥落的墙皮泛着惨白的光，像一块被人剔净了肉的骨头。你若站在远处的土坡上望，那炮楼就像一根戳进天里的断指，指头没了，只剩下半截骨节。\n可你若把目光放低些，放到那炮楼投下的阴影里，就能看见日日都在重演的戏码——几个穿着旧军装、腰里别着家伙的男人踱着步子，军装的领章还留着摘掉的印子，像是褪不掉的胎记。他们身后跟着三两个歪戴帽子的喽啰，嘴里叼着烟卷，眼神往街两边扫，扫到谁身上，谁就低下头去。\n迎面过来个卖馕的妇人，他们便故意挡住去路。为首那个伸手从筐里捏起一块馕，掰下一角扔进嘴里，嚼了两下，又吐在地上。“馕是馊的，”他说，“得赔。”那妇人低着头，把筐里的馕全递过去，快步走远。几个人便相视一笑，笑得像一群豺狗。\n倘或有人敢在巷口嘀咕半句，当晚便会有人敲门。轻则一顿拳脚，重则人被架走。架走的人过些日子回来，舌头就短了半截，见了谁都只是摇头，像是嘴里被人灌了铅。没人敢问架走的那几天去了哪儿。\n有意思的是，那些巴依、那些阿訇，平日里在自个儿地盘上也是横着走的人物，可碰上这群穿旧军装的，也得赔笑脸。城东的巴依不知为了什么事跟他们杠上了，赶车的骡子就少了两头。巴依亲自提着礼盒上炮楼赔罪，下来的时候脸都是青的，逢人便说“误会误会”。\n炮楼里的人有恃无恐。他们在这块地方蹲了七八年，来的走的，走的来的，最后不都得跟他们打交道？这地界上的事，他们比谁都清楚——哪家巴依的粮仓在哪，哪个毛拉夜里走的哪条道，谁家闺女长得俊，谁家的羊最肥。\n第二日，几个穿旧军装的人依旧分头往城里去了，专拣那些富户家敲门。手里提着从巴扎上顺来的东西，脸上堆着笑，嘴里说的是“兄弟最近手头紧，借几块银元周转”。\n炮楼的影子越拉越长，把半个城都罩在里头。太阳快落山的时候，又有人被架进去了。这回是个年轻人，听说他前些日子在巴扎上多说了几句话。说什么来着？没人记得清，也没人敢记。"
 COX_Landreform.203.t: "头狼"
 COX_Landreform.204.a: "土地也会吃人"
 COX_Landreform.204.d: "三扇车门都敞开着，后备箱的盖子朝天掀着， 引擎盖也支棱起来｡ 这台嘎斯越野车就那么停着，一动不动，像是被什么东西从天上扔下来､ 插进这无边无际的荒原里的一件古怪的祭品 ｡ \n\n 沙地上有几串脚印， 已经被风磨得浅了，边缘正在塌陷 ｡ 它们绕来绕去，像找不到出口｡ \n\n 但一条拖痕却打破了僵局， 它两边散落着东西 ｡ \n\n 一只军用水壶，一张地图，被沙埋了一半，露出的那半张上密密麻麻标着红圈和箭头｡ 风掀动纸角，沙粒从上面滚落， 又回到沙漠里｡ \n\n 这是他们全部的物资吗? \n\n 拖痕的尽头，趴着一个人｡ \n\n 他穿着绿军装，后背的汗渍结成了白色的霜｡ 脸埋在臂弯里，看不见神情， 只能看见一双耳朵里灌满了沙｡ 一只手向前伸着，像是要抓住什么｡ 另一只手压在身下｡ \n\n 那身下护着一面红旗\n\n 那面红旗被他护在怀里，护得那样紧，像是要把它带到一个到不了的地方去｡"
 COX_Landreform.204.t: "大漠"
 COX_Landreform.205.a: "这回不一样了｡"
 COX_Landreform.205.d: "喀什的街头热腾腾的，像一口刚揭开盖的抓饭锅。驴车晃晃悠悠地走，胡厚民坐在车斗里，眯着眼看两旁的光景。\n路过铁匠铺时，火星子溅得老高。老师傅光着膀子，浑身汗涔涔的，铁锤砸下去，火星往身上扑，他眼皮都不眨。铺子门口站着个巴依，绸缎袷袢泛着光，正等他的英吉沙小刀出炉。\n又走了一会儿，是一间洋饭馆。门面雪白，窗户镶着彩色玻璃，人影绰绰。胡厚民伸长脖子看了一眼，瞧见一个戴皮帽子的男人举着银茶杯，对面女人耳坠子一晃，比钻石还亮。他第一次见这光景，不由得一阵迷眩。\n驴车猛地一刹。\n胡厚民整个人往前栽，额头磕在车帮上，火辣辣地疼。还没抬头，就听见前头有人骂，嗓门像惊雷。他从车斗探出脑袋，看见驴夫跳下车，弯着腰给人赔不是。\n那人穿着锃亮的长靴，摆摆手像要放驴夫一马。驴夫刚把腰直起来，一拳就砸在脸上了。\n驴夫仰面倒下去，那人掸掸袖口，转身走了，靴子在土路上踩出一串深印子。\n胡厚民跳下车扶起驴夫，满手都是黏的——鼻血、嘴里的血，和着汗，和着土。他撕下自己一片衣襟按在驴夫脸上，抬头往四周看。\n铁匠铺里，火星还在溅。老师傅还是光着膀子，那巴依已经走了，手里攥着新打的刀。饭馆门口围了一圈人，全是衣衫褴褛的瘦骨头，眼睛直直盯着楼上亮灯的窗户。窗户里头，偶尔有人推开看一眼，又迅速关上，像看见了脏东西。\n胡厚民脸上忽然一阵发烫，像被人扇了一巴掌。那股羞耻从耳根烧到脖子根，烧得他心里疼。\n等他把驴夫扶上车，重新坐回车斗里的时候，他抬起头，把刚才那些光景又看了一遍。"
 COX_Landreform.205.t: "芸芸众生"
 COX_Landreform.206.a: "“扬场风来助，有事众人帮”"
 COX_Landreform.206.d: "“他们说的地方就是这儿吧？看见柳树再往前，那个土坡……”\n胡厚民和另一个青年干部站在戈壁滩上，面面相觑。车在戈壁上颠了三个钟头，骨头都散了架，阳光毒辣，他们却连一个去处都没有。\n“哎！”一个声音突然从土包那边炸开来，“你们是不是喀什来的共产党？”\n两人猛一回头，土包后头冒出一个人来，跑得急，脚底下踢起一溜烟土。跑到跟前，一张黑红的脸笑得全是褶子，露出一口白牙。胡厚民上去一把抱住那兄弟，三小时的颠簸，一身的骨头疼，全给这一嗓子喊没了。\n“走，进屋说话！”\n那人拉着他们就往土包走，走近了才看出来是个半地窨子，门框矮得要弯腰才能进去。\n一脚踏进去，胡厚民愣在那儿了。\n屋里空荡荡的，正中间搁着一张歪腿的桌子，桌角垫着半截土坯。墙角倒着一只瘸腿的板凳，桌子上放着一盏油灯，灯芯冒着豆大的光，把几个人的影子拉得老长。\n“我去隔壁借几个凳子去，对不起了干部朋友！”\n那人一拍脑门，又跑出去了。两个干部站在那儿，一时不知该说什么。来的时候上面说村里穷，可谁也没想到穷成这样。\n那人又跑回来了，怀里抱着三四只板凳，有的缺腿，有的裂帮，好歹都能坐人。\n“村里的马木提和木合买提，已经搞了一个组织，”那人把板凳往地上一搁，一屁股坐下，“之前你们给的那个喇叭，我们用着也顺手的呢。”\n胡厚民挨着他坐下，往跟前凑了凑：“巴依们没找你们麻烦吧？”\n那人愣了一下，接着仰起头哈哈大笑起来：“那帮怂，现在怕我们呢！”\n他一巴掌拍在自己大腿上，笑得眼睛眯成一条缝：“每次他们威胁我们的时候，我们就站在一起。更不用说，有时候红军干部站在我们跟前，他们就像条狗一样，夹着尾巴跑掉了！”\n他说着又笑起来。胡厚民看着那张憨厚的脸，那满脸的笑褶子，自己也不禁咧开嘴。\n可他笑着笑着，又忍不住扭头，把这一圈土墙、那张歪腿桌子、那盏要灭不灭的油灯，一样一样看过去。\n等他再转回脸来的时候，笑还挂在嘴角，可眼神暗下去了。"
 COX_Landreform.206.t: "土村见闻"
 COX_Landreform.207.a: "喀什的冬天短，春天寒"
 COX_Landreform.207.d: "王道明还是没习惯南疆的干燥，本以为哈密的酷暑已经很难熬，但这里的热更令人难以忍受，像一团看不见的火，不把人身体里的水分全抽出来前誓不罢休。喀什的街头人头攒动，比哈密热闹得多，恐怕这里只逊色于乌鲁木齐。可这份热闹他总觉得不自在——人越多，他越觉着自己是个外人。\n\n 好在就快到了。前面那座房子门梁上刻着一朵菊花，整个和田， 只有毛拉的房子才有这样的门。他站在门口端详了一会儿，小时候的事模模糊糊涌上来——是这位毛拉去过家里?  还是父亲带他来过这儿？他记不清了，也懒得细想。\n\n 他轻轻把门推开一条缝，往里看了一眼。 小院正中坐着那位阿訇，花白的胡子修剪得齐整，神色安泰，带着不容置疑的权威。他对面坐着几个戴军帽的人，帽徽上的红星在日头底下闪着光。\n\n几人同时看见了他，话音戛然而止。瞬间的安静像一只手，猛地攥紧了王道明的心脏。\n\n毛拉却已经站起身，脸上浮出笑意，几步迎上来，握住他的手，握得很用力。\n\n “孩子，你来了。”\n\n王道明被那声“孩子”叫得鼻子一酸。他张了张嘴，想说什么，想问什么，可那些话堵在喉咙口，一个字也吐不出来。\n\n毛拉已经转身走回院里，在原先的位置上坐下，朝那几个军人点点头。 \n\n “好朋友们，我明白你们说的了，”他的声音不高 ，却清清楚楚送进每个人耳朵里，“你们放心交给我吧，别忘了你们答应我的。”\n\n看着毛拉花白的胡须在微风里轻轻颤动，王道明明白也许自己担心的事情不会发生了。"
 COX_Landreform.207.t: "星火微弱"
 COX_Landreform.208.a: "归档：南疆土改工作档案 卷四十三"
 COX_Landreform.208.d: "时间：一九五零年四月十二日\n出席人员：驻南疆工作团全体成员、各乡农民协会代表\n会议主题：总结近期减租减息工作推行情况\n一、自三月上旬全面铺开减租减息宣传以来，各乡通过张贴布告、召开集会等形式，已基本完成政策宣讲。\n二、地主富农普遍采取“表面配合、实质拖延”策略。工作组登门时，地主无不设茶备饭，口称“拥护政策”“愿为乡亲让利”，然谈及具体账目则顾左右而言他。个别地主为应付检查，主动交出少量边角薄地，或免除几户孤寡陈年旧账，以此博取“开明”之名，而大量肥沃良田与高利盘剥之账纹丝不动。\n三、贫雇农群体反应远不如预期热烈。多数人对工作组客气而疏远，畏惧心理普遍存在。有代表汇报，某村张贴减租布告次日，即有地主放出风声：“中央的政策是中央的，咱们的事是咱们的。”此言在佃户中传开，多有信者。个别佃户甚至在群众大会上表示：“老爷家也有难处，租子多少是人家的事。”\n四、当前工作推进之艰难，症结不在地主狡猾，而在贫农阶级意识薄弱。有代表情绪激动，言及“老百姓看见咱们就躲，听见减租就摇头”，在场多人默然。\n工作组负责人追问：“群众是否根本不相信减租能够实现？”\n各乡代表沉默良久，方有一人答曰：“也不是不相信咱们，是不相信咱们能一直在这儿。”\n会议于午时结束。各乡代表领取材料后陆续散去。与往日不同，今日众人多沉默，脚步匆匆，无人多言。\n记录人：宋大成"
 COX_Landreform.208.t: "关于减租减息工作推进情况的会议纪要"
 COX_Landreform.209.a: "饿狼面前绵羊是罪人"
 COX_Landreform.209.d: "白杨树在两旁站成两排，风吹过来， 叶子哗啦啦地响｡ 那声音从头顶灌下来，灌得王道明浑身不自在｡ \n\n 他是要去毛拉家的， 可他走在这条路上，越走越觉得脚步沉，想不出有什么值得再去一趟的理由。\n\n 巴依的院子这些天一直关着门，里头安安静静的，不知道在捣鼓什么。前阵子工作组的人在村里进进出出，宣传队也闹得热闹，巴依连门都不太出｡ 有人说他吃了瘪，有人说他怕了。王道明听了，心里还觉着痛快。\n\n 那些日子，村里的穷苦人腰杆子确实直了些。欠巴依的债，有人还上了，有人还了一多半。最勤快的那个易卜拉欣，居然把债全结清了。工作组又发了种子，发了农具，帮人开荒。巴依的存在感一天比一天低，低得快要没了。\n\n 可昨天， 工作组的人一声不吭就走了。走之前， 还专门去巴依院子里坐了坐｡ \n\n 王道明当时站在远处，看着那几个人从院子里出来， 巴依送到门口， 点头哈腰的。\n\n 今天再路过，他的脚步顿住了。\n\n 院子正中那棵老胡杨树上， 吊着个人。\n\n 两只胳膊反剪着，绳子拴在手腕上，人挂在半空，脑袋耷拉着。身上的褂子烂成一条一条的，露出来的皮肉上横一道竖一道，全是鞭子抽过的印子。\n\n 王道明一眼就认出来了——那是易卜拉欣 。\n\n第一个还清债务的人，第一个挺直腰杆子的人，第一个让巴依脸上挂不住的人。\n\n 这会儿他被吊在那儿，像一只褪了毛的⽺。\n\n 巴依坐在一旁的摇椅上，喘着粗气。手里的鞭子还攥着，鞭梢拖在地上，沾满了土。\n\n 站了一会儿，他转过身，继续往前走。\n\n 白杨树还在哗啦啦地响。那声音像什么东西在哭，又像什么东西在笑。\n\n他不愿再想了。"
 COX_Landreform.209.t: "余焰渐熄"
 COX_Landreform.210.a: "花猫成不了雄狮"
 COX_Landreform.210.d: "王道明在喀什住了下来。\n他住在一间土房里，离清真寺不远。每天清晨，邦克声从宣礼塔上飘下来，他就醒了。洗漱，穿衣，出门，走进寺里。做礼拜的人多，他挤在后头，跟着跪，跟着起，跟着念那些从小就会的经文。\n毛拉待他很好。那个留着花白胡子的老人，每次看见他都招手让他坐近些。\n日子就这么过去了。\n外头的消息断断续续传进来。今天听说打起来了，明天听说工作组散了，后天听说那些曾经跟着他们的人，有的跑了，有的跪在巴依门口求饶。传消息的人说得热闹，王道明听着，脸上没什么表情。\n又过了些日子，街上的气氛变了。巴依们又出现在巴扎上，骑着驴，仰着头，和以前一样。穷人低着头从他们身边走过，和以前也一样。\n 他有时候想，那些人要是没来过，会怎样？\n村里人大概也还那样，该干嘛干嘛。日子还是苦，可苦得安稳，苦得不会出大事。\n不会有人被吊死，不会有人被带走，不会有人半夜里哭得撕心裂肺。\n这么一想，他就觉得，现在这样，也挺好。 \n毛拉还在那儿，捧着经书，嘴里念念有词。王道明坐到他旁边，也捧起经书，低下头，继续念。\n那些阿拉伯文字从他嘴里流出来，像一条不起波澜的河。他念着念着，外头的声音就远了，那些消息、那些人、那些事，都远了。\n明天，还要去念经。第二天醒来，太阳照常升起。他洗了脸，翻开经，继续念。\n“你当向信道而且行善的人报喜，他们将享有下临诸河的乐园。”\n他念这一句的时候，脸上没有任何表情。"
 COX_Landreform.210.t: "薪尽火灭"
 COX_Landreform.211.a: "不公屹立千年，变革只争朝夕。"
 COX_Landreform.211.d: "从远处望，喀什城几乎看不见。那些土房子趴在戈壁滩上，只有偶尔冒出的洋楼，才让人知道那里头还藏着一座城。\n东门是唯一能走大驴车的门。大清早，门洞里就热闹起来。农民们赶着车从四面八方涌来，他们进来各有营生。有的扛着豁口的坎土曼找铁匠修补；有的攥着铜板想买好种子；还有的什么都不干，就是逛，就是看。那些摆在毯子上的手工茶壶、雕花的木箱，他们看了又看，像在做梦。\n逛累了，他们赶着驴车往回走。出了东门，走上半个时辰，就又能看见巴依的地，看见自己那几亩薄田。但那都是回去以后的事了。\n手工业者们坐在摊子前，背靠着墙，面前摆着一地家当。打铜的、做靴的、织毯的，各人有各人的绝活。老师傅眼皮都不抬，手里的錾子一下是一下，敲出的花纹比画的还周正。\n可他们怕那些不讲理的阿訇路过。怕那些穿长袍的人一伸手，说拿就拿，说抢就抢。遇上那种时候，只能缩着脖子，等人走远了，再对着地上的空当叹口气。\n至于那些聪明人——他们把自家大院推了，盖上两层洋砖房，窗户安着玻璃，亮堂堂的。再从日本人那儿买几台三四手机器，往院子里一摆，雇上二三十号人，叮叮当当干起来。整个喀什的手工业者加在一起，也比不过那一院子的货。\n工作组的人站在街上，看着这些，脑袋都大了。帮农民？巴依盯着。帮工匠？那些聪明人背后也有人。他们只能等着，等上面的信儿，等一个能把乱麻理清的法子。\n城门外头，又有驴车进来了。车上坐着几个农民，眼睛亮亮的，往城里头张望。"
 COX_Landreform.211.t: "循序渐进"
 COX_Landreform.212.a: "麦穗无粒头高昂"
 COX_Landreform.212.d: "阿帕：\n平安。\n我们来这里第四个月了。这边的风比乌鲁木齐柔顺，您担心的水土不服，我也克服了，肚子再没闹过毛病。\n前两天出了件事。那个巴依，把我们一个落单的同志抓了去——就是那个瘦瘦的、爱笑的汉族小伙子，您见过的。巴依把他关起来，要我们滚蛋才放人。\n我们急坏了，那几天我们主要就是到处找人，找那个巴依的亲戚，找村里说话管用的老人，想让他们帮忙说情。可那秃驴油盐不进，谈来谈去就是一句话：你们走， 我就放人。\n我们不是没有想过跟他们撕破脸，直接把人抢回来，但给他们护院的太多，贫农们也不愿帮忙。只凭我们几个，不放枪的话就一点办法没有了。\n昨天下午，我正跟胡组长商量事，忽然外面乱哄哄的。跑出去一看，原来是那个同志跌跌撞撞地自己回来了！他浑身是伤，看得我们心疼，赶忙把他搀到床上。\n是几个被强行抓来护院的贫农实在看不下去，偷偷把他放了。原来巴依早就威胁乡亲们，要是谁和工作组有来往，就把他扒皮抽筋，尸首吊在树上；就连毛拉也说，协助不信者的人要下地狱。\n胡组长给我们分析：乡亲们不是不愿意帮我们，而是被反动派唬住了！他在东疆时见过类似的情景，不过这里的反动派确实更加无法无天。但他们越是猖狂，我们就越不能退缩，要和他们针尖对麦芒，最后一定能让更多贫农支持革命事业！\n阿帕，等这里的土改胜利了，你一定要来南疆看看，这边的石榴比北疆甜，我吃过一个，甜得很。\n儿子\n艾尼瓦尔\n写于和田乡下"
 COX_Landreform.212.t: "一封家信"
 COX_Landreform.213.a: "孬地长满白荆棘"
 COX_Landreform.213.d: "“他们的境地没有那么不堪，每年能做到自给自足，还能有盈余……”\n报告大会上，做汇报的同志还在念。这“中农”——夹在中间的那一层，不冷不暖，不饥不饱，像戈壁滩上稀稀拉拉的骆驼刺，够不着天，也挨不着地。\n他想起上个月的事。那天他带着几个人去了一个村子。他们找了村里最有名的一户，叫肉孜，家里有不少地，日子比上不足比有余。\n肉孜坐在院子里搓绳子，看见他们进来，手上的活儿没停，只是抬了抬眼皮。\n胡厚民把来意说了一遍，要搞互助组，翻了身大家都有好日子过。说着说着，肉孜手里的绳子慢下来了。\n肉孜低着头，搓了两下，忽然问：“朋友，你们的想法很好，但你们最后能胜利吗？”\n胡厚民一愣。\n“我是说，”肉孜放下绳子，抬起头，“你们走了以后呢？巴依还在，他的地还在，他的债还在。到那时我怎么办？”\n院子里静了一会儿。\n胡厚民张了张嘴，什么也说不出来。\n肉孜又低下头搓绳子，搓了两下，补了一句：“红军朋友，你们说的我都听着。可我不想惹事，就想平平安安把日子过下去。”\n那天他们没坐多久就走了。胡厚民回头看了一眼，肉孜还坐在那儿搓绳子，头也不抬。\n后来他才知道，那几天巴依派人去肉孜家“坐了坐”，没打没骂，就喝了碗茶，说了一句：听说最近有生人来你家？\n胡厚民把手里的报告翻了一页。\n“……这部分人群摇摆不定，需要有针对性地开展工作……”\n窗外有人喊他：“胡组长，明天去库尔班家的事，还去不去？”\n“去。”他说。\n他站起身，走到门口。路两旁杨树的叶子被风吹得哗啦啦响，一会儿朝东倒，一会儿朝西歪。\n天快黑了。风还在刮。"
 COX_Landreform.213.t: "草随风动"
 COX_Landreform.214.a: "阿訇所为不应在清真寺，而应在穆斯林之中"
 COX_Landreform.214.d: "那个阿訇来的时候，是春天。\n没人知道他叫什么，只晓得他从北面来，骑着一头瘦毛驴。到村里那天，他的袍子磨破了边，脸上晒得脱了一层皮，眼睛却亮得很。\n那时候北边土改刚开始，村里人还不懂啥叫翻身。这个阿訇不一样，他挨家挨户地走，坐在穷人的炕沿上，跟他们讲经，也讲道理。有人信他，有人不信，有人信了也不敢说。\n可村里的年轻人愿意跟着他。夜里偷偷来，听他讲，听他念，听他一句一句把那些念了几百年的经文翻出新意思。\n他就这么在村里待了三个月。\n然后他死了。死得突然。前一天还好好的，第二天早上，有人发现他躺在清真寺的后院里，身上盖着一张破席子。说是夜里发的急病，没人知道，也没人救得及。\n他死了以后，清真寺里的人就闹了矛盾。一拨人站这边，一拨人站那边。这边的人说，他的话是对的，真主要的是人心干净。那边的人说，他那是歪理，是邪说，是让年轻人学坏。\n那边的人多，有钱，有枪，有巴依撑腰。他们站在台上，声音大，嗓门高，指着谁骂谁。这边的人少。少得可怜，只有一颗心，和他说过的那些话。\n日子一天天过去，这边的人越来越难熬。有人在巴扎上被指着鼻子骂，走路不敢抬着头。有人半夜听见门响，第二天发现院子里的羊没了。有人去渠里挑水，被人一把推下去，爬上来浑身湿透，旁边的人哈哈大笑。\n工作组的人看在眼里，急在心上。如果能借着这位阿訇的思想，实现旧信仰的改造，无疑将抽掉反动派愚弄群众的根。于是他们去找那些以前跟着听经的人。可那些人不见了。有的说不敢来了，有的干脆装作不认识，看见他们就绕道走。\n但正如先知在穷人间传道，尔萨受尽迫害，却仍坚持宣教，仅凭暴力无法熄灭思想的明灯。于是在这边的，被唾弃的人群中，又要走出一个衣衫褴褛的人，拖着钵，牵一头毛驴……"
 COX_Landreform.214.t: "孤星"
 COX_Landreform.215.a: "新疆苏维埃政府驻南疆办事处"
 COX_Landreform.215.d: "喀什城里难得听见引擎响。\n偶尔有那么一回，是哪个巴依从日本人那儿捣腾来一台拖拉机，开着它在城里显摆。那柴油机的声音能把半个城的人震醒，一路冒着黑烟。\n可今天这动静不一样。\n天还没亮透，一种低沉的轰鸣就从东门那边滚过来，越滚越近，越滚越响。三辆卡车排成一溜，慢慢往里开。头一辆车上坐满了人，一个个背着枪，穿着洗得发白的绿军装。后面两辆空着。\n路边的人渐渐多起来。卖馕的，手里的铁钩子还挑着刚出炉的馕，眼睛却跟着车走。抱孩子的女人把孩子往怀里紧了紧。那些平时在巷子里横着走的巴依狗腿子，这会儿缩在人堆里，睁大眼睛往死里盯着。\n车队停在一栋洋楼前头——巴格弯酒楼。\n这楼在喀什有名，白墙绿窗，二楼有雕花栏杆。老板几个月前跑了，楼一直空着，没人敢搬进去，怕他哪天杀回来算账。\n第一辆车上的战士跳下来，二话不说就往里走。\n后面的事，围观的人看了整整一天。\n战士们进进出出，把里头的东西往外搬——雕花沙发、花哨茶壶、巨大的水晶灯，小心翼翼地放到车斗里。那些东西在太阳底下闪着光，亮得晃眼。围观的人伸长了脖子看，有人小声嘀咕：“那是巴依们喝酒的地方，里头一个地毯比我全部家当还贵。”\n战士们只管搬，只管把那楼里里外外收拾干净。从早搬到晚，汗顺着脖子往下淌，军装湿了又干，干了又湿。\n围观的人换了一茬又一茬。\n等太阳快落山的时候，战士们忙完了。他们脸上有汗，有土，有一道一道的印子，可眼睛是亮的。那新门牌也在暮色里泛着一点白。"
 COX_Landreform.215.t: "进驻喀什"
 COX_Landreform.216.a: "不是为宗教而学，而是为生活而学"
 COX_Landreform.216.d: "工作组到了喀什之后，这座老城像被人从睡梦里轻轻推了一把。\n最先醒过来的是那些书店。以前关着门的，现在一扇一扇打开了。进进出出的人里，有的拿起书翻两页就放下，有的站着看半天不肯走，有的干脆把书买回去，揣在怀里，像揣着一块馕。\n更难得的是那些翻译的人。知识分子们白天忙完营生，晚上坐在油灯底下，把那些著作一页一页翻成维吾尔文，装订成册，寄给办事处。\n可隔三差五就有人来捣乱，砸玻璃、撕书。最厉害的一回，一帮人半夜摸到书店门口，泼了油，点了火。等工作组赶到，书已经烧成了灰。后来肇事者却自己来自首了。\n这事之后，城里反倒安静了些。\n今天是个平常的礼拜日。太阳照常升起来，照在那些做礼拜的人身上。人们进进出出，三三两两站在门口说话。\n可今天这门口，忽然吵起来了。\n起初只是几个人争论，声音不大，后来人越围越多。争论的是两个阿訇。一个年轻，三十来岁，眼睛亮亮的；一个年长，胡子白了，说话时拐杖点地，笃笃地响。\n“……经文上说得很明白，真主至大，一切以真主为准！”老阿訇声音发颤，可每一个字都咬得死。\n“没人说真主不大，”年轻阿訇的声音不高，却清清楚楚送进每个人耳朵里，“可真主给了我们眼睛，是让我们看的；给了我们耳朵，是让我们听的；给了我们心，是让我们想的。要是真主那么蛮横，给我们这些做什么？”\n旁边有人悄悄点头。\n老阿訇的拐杖又点了一下地：“你这是歪理！真主的旨意大过一切！”\n“大过一切，可不该大过人心。”年轻阿訇往前站了一步，“真主要的是我们做善人，不是做木头人。要是有人打着真主的名号，去管别人怎么活，去管别人信什么——那是真主的旨意，还是他自己的意思？”\n人堆里有人喊了一声：“说得好！”\n年轻阿訇转过身：“经文里写着，‘绝无强迫’。这话你们都听过。可这些年，有人拿经文去杀人，去放火。那是经文教他们的，还是他们自己想干，拿经文来遮脸？”\n人群安静下来。\n太阳升高了，照得满街都是亮的。后来有人轻轻说了一句什么，旁边的人点点头。再后来，卖烤包子的推着车过来了，热气腾腾的。\n礼拜日还是那个礼拜日。可有些东西，好像不太一样了。"
 COX_Landreform.216.t: "人性和理性"
 COX_Landreform.217.a: "劳动不会停留在农田，麦穗不会遗忘在麦茬"
 COX_Landreform.217.d: "图尔荪照常在那土坯房里醒来。\n睁开眼，天花板矮得像正在往下落。落了几十年了，还没落下来。他翻个身坐起，骨头咯吱响了几声。站起来，只走了一步，就推开了那扇歪斜的木门。\n门外头的天灰蒙蒙的，还没亮透。\n这把老骨头在土里刨了大半辈子，今天这气氛不对。田埂上，几个年轻人凑在一块儿嘀嘀咕咕，看见他走过来，声音停了；等他走过去，又在后头响起来。\n歇工的时候更明显。以前一到歇息，年轻人倒头就睡。现在三五个一伙，往远处走，走到巴依看不见的地方，围成一圈，说一阵，又散了。\n图尔荪蹲在地头上抽莫合烟，眼睛眯着，什么都看在眼里。\n有事情要发生了。\n他没声张。第二天照常下地，照常干活。那些奔走的人，他撞见过一回。天快黑时抄近路回家，远远看见几个人影——里头有之前来过的共产党，还有不认识的年轻人，也有跟他一样的老汉。\n日子一天天过去。\n那天半夜，图尔荪起来解手，听见远处狗叫。叫完了，又静下来。他站在月亮底下，看见几个人影从巷子口闪过，往林子的方向走。\n那晚他做了个梦。梦见年轻时跟人去北边挖渠，三个月后回来，巴依把他家门封了。他跪在门外，跪了一夜。\n惊醒时天还没亮。他坐起来，盯着那扇门。\n外头起了风，吹得破门哐当响。突然村里热闹起来。他推开门，到处都是人，到处都是脚步声。有人喊了一嗓子，像什么东西终于裂了。\n他们往巴依家走。不是一两个，是一群。人从巷子里、田埂上涌出来，汇成一股。\n院门被撞开时，图尔荪站在后头没往前挤。他听见里头有人喊，有东西砸碎，有狗叫。\n有人从里头冲出来，往下一家跑。\n图尔荪站在月光底下，看着人潮涌进那些他这辈子没敢正眼瞧过的大院。工作组的人也在里头，拦着这个，扶着那个，喊得嗓子都哑了。\n天亮时，什么都结束了。\n巴依们蹲在墙角，缩成一团，衣袍上沾着血，脸上全是惊惶。有人还在哭，有人已经哭不出来。\n图尔荪坐在自家门槛上，抽了一锅烟。\n太阳升起来，照得满街都是亮的。\n他想，今天还下地吗？"
 COX_Landreform.217.t: "风雨满楼"
 COX_Landreform.218.a: "破而后立"
 COX_Landreform.218.d: "库车是打响第一枪的地方。\n那天夜里到底发生了什么，后来谁也说不清。只记得枪响之后，整个城都醒了。天亮时，巴依们的院子空了，那些平日里横着走的人，有的蹲在墙角发抖，有的已经躺在地上不动了。\n消息顺着天山脚底传出去，像火掠过干草，一碰就着。\n库尔勒那边，农民们半夜爬起来，拿着坎土曼把巴依家围了。阿克苏那边，有人在巴扎上喊了一嗓子，人群就跟着走，走到巴依家门口时，已经黑压压一片。那些祖祖辈辈弯着腰的人，第一次直起身来，互相看了一眼。\n喀什城在那几周里成了所有人的谈资。巴依们关起门商量了一夜，第二天早上，大门开了，人出来了，举着手。\n喀什就这么解放了。\n可最麻烦的是和田。那边的反动派根子深，人又多，起义的冲了几回冲不进去。别处逃过来的也往那儿跑——库车逃的，阿克苏逃的，喀什逃的，一窝蜂钻进那几个大院子里，墙头上架着枪，谁靠近就打谁。\n夜里头，和田方向偶尔能听见几声枪响，断断续续的。\n南疆的天是变了。可这变了的天下头，还有一堆烂摊子要收拾。工作组的人进进出出，和刚直起腰来的农民弟兄一起，抹一把脸上的汗，又弯下腰去，开始收拾这片被踩烂了的地。\n远处的天边还有一团黑云没散。可近处的地上，火已经烧起来了。\n不是烧人的火，是烧荒的火。烧完了，好种新庄稼。"
 COX_Landreform.218.t: "炉中煤，火焰赤"
 COX_Landreform.219.a: "森林的眼泪是树苗"
 COX_Landreform.219.d: "消息传开那天，村里人都蹲在墙根底下晒太阳。天灰蒙蒙的，风从戈壁滩那边吹过来，打在脸上生疼。可没人回去，都等着一个准信儿。\n前天夜里，东边二十里外的庄子让人摸了。几个跑掉的巴依狗腿子，趁黑摸进村子，放了两把火，砍伤一个老汉。老汉的儿子追出去，被一枪撂倒在戈壁滩边上，血渗进土里，黑乎乎一片。\n西边也出了事。几个赶巴扎的妇女回来的路上让人拦住，抢了东西，还遭了糟蹋。其中一个女人的男人，一早就去了喀什，要找红军讨个说法。\n可红军才多少人？这么大的南疆，哪能处处都顾得上。\n墙根底下的人抽着莫合烟，谁也不吭声。烟味儿呛得人眼睛疼。\n后来有人站起来，拍了拍屁股上的土：“光坐着等，等不来平安。”\n“那你说咋办？”\n那被砍伤的老汉回答：“自己护着自己。”\n墙根底下静了一会儿。有人咳了一声，有人把烟袋锅往鞋底上磕了磕。\n“枪呢？没枪咋护？”\n“没枪有坎土曼，有铁锹，有棍子。反动派也是人，挨揍也疼。”\n又静了一会儿。人一个一个站起来，走过来。最后剩几个蹲着的，相互看了看，也站起来了。\n“我不是不怕死，”一个说，“可让人像宰羊一样宰了，我不干。”\n就这么着，村里的赤卫队算是有个影儿了。\n第二天，老汉带着几个人去喀什找办事处。办事处的人听了，没多说话，给他们批了几条枪，还有一箱子弹。临走时，一个干部握着老汉的手：“等我们把那些王八蛋收拾干净了，就好了。”\n回来的路上，他们把办赤卫队的事说给东边西边的村子。有人愿意跟着干，有人犹豫，有人关上门假装不在家。可愿意的，总比不愿意的多。\n半个月后，几个村子凑到一块儿开了个会。没说什么大道理，就分分工：谁放哨，谁巡逻，谁盯着戈壁滩，万一有事咋报警咋照应。\n开完会，天快黑了。风还在刮，沙子打在脸上还是疼。可那些人走在回家的路上，步子比来时稳了些。\n那个老汉走在最后头。他儿子没了，可他还得活着。他手里攥着那杆枪，枪是凉的，可他觉着，心里头有点热乎气了。"
 COX_Landreform.219.t: "一呼百应"
 COX_Landreform.220.a: "丰产之田胜过负心之汉"
 COX_Landreform.220.d: "距离大革命过去有一段日子了。\n喀什城里的尘埃落定，那些骑着驴横着走的巴依不见了，在清真寺里吆五喝六的阿訇也跑了大半。剩下的人走在街上，脚步都轻了些。\n可工作组的人轻松不起来。胡厚民桌上堆着的纸一天比一天高，最麻烦的是清真寺的地。\n那些地东一块西一块，有的夹在巴依地中间，有的藏在山沟里，但无一不是好地。胡厚民亲自去量过，地界都画不清。更气人的是，那些地明明荒着，可就是不让穷人种。以前有农民试着开荒，被阿訇派人打过——地是主的，人是主的奴，奴不能种主的地，那些阿訇就这么说。\n现在阿訇跑了，那些话还在。地还在那儿荒着，没人敢动。\n进步的毛拉们先急了。三天两头有人往办事处跑，有的抱着厚厚地契，有的拉着工作组的人要往牢里走——牢里关着的人肯定知道，打一顿就能问出来。\n胡厚民告诉他们：等红军。\n队伍是第三天到的。带队的排长姓周，甘肃人，话不多，办事利索。他见了胡厚民，第一句话就是：“地的事，上面交代了，办到底。”\n第二天开始，他们带着地契，一个村一个村地走。请来村里的老人，站在地头上，指着荒草，一块一块认，一块一块量。巴依跑之前把界碑拔了，把地契烧了，可老人们记得——哪块地是谁的，哪条沟是界，说得清清楚楚。\n半个月后，清查结果出来了。厚厚一沓纸，每一块地的位置、大小、现状，全在上头。\n周排长把那沓纸往桌上一放：“清了。”\n胡厚民拿起来翻了翻，没说话。可他知道，那些地，不会再荒着了。"
 COX_Landreform.220.t: "归还土地"
 COX_Landreform.221.a: "而那些破纸如今被火焰撕碎升腾"
 COX_Landreform.221.d: "这秃驴巴依到底把他的宝贝都放哪里了？”艾尼瓦尔粗暴地翻箱倒柜，把绸缎衣裳扔得满地。\n“你再学这种旧军阀的语气，我就扇你。”胡厚民头也不回，蹲在地上敲地砖。\n\n“开个玩笑哎，你咋……找到了！”\n艾尼瓦尔大吼一声，整个人快钻进墙里——挂毯被扯下来，暗格敞着，他正往外掏纸，一沓一沓，用布包着，油纸裹着，塞得满满当当。\n……\n天黑了。村里广场上点起一堆火。\n火苗蹿得老高，噼里啪啦地响。老人抱着孩子，女人跟着男人，连邻村的也赶来了。\n胡厚民站在火堆边，手里捧着那摞纸。风一吹，纸角哗啦啦响。\n他把纸举起来，让每个人看见。\n“这一张，托乎提的。三十年前按的手印，把自己卖给巴依当长工。”\n纸扔进火里，边黑了，卷了，烧成灰。\n“这一张，木拉提家的。借了三斗苞谷，利息要还二十年。”\n又一张扔进去。\n“这一张，是个母子俩。当娘的把自己和儿子一起卖了，给死去的男人还债。”\n火光照着他的脸，眼睛亮得也像烧着火。\n“这些纸，一张一张，都是拴在你们脖子上的绳子。绳子勒了你们一辈子。”\n他把剩下的纸全举起来，对着那些沉默的脸。\n“今天，这些绳子，咱们一把火烧了。”\n他用力一扬，纸散开，纷纷扬扬落进火里。那些红手印，那些黑字，那些压了几辈子的数字，全烧没了。\n人群安静了一瞬。然后有人哭了，有人喊，喊声越来越多，汇成一片。有人在笑，有人在哭，有人在骂，有人在祈祷。什么都混在一起。\n火还在烧。灰烬往天上飘，飘得高高的。\n艾尼瓦尔从人群里挤出来，抱着都塔尔，往胡厚民跟前一站，咧开嘴笑：“胡组长，来唱一个吧。”\n胡厚民瞪他：“我五音不全。”\n“那跳！跳总会吧？”艾尼瓦尔把琴一抱，手指一拨，弦响了。\n人群里有人拍手，有人扭身子，有人把旁边的人拽出来。\n火光照着那些脸。有的年轻，有的老，有的满是褶子，有的还带着泪痕。可这会儿，那些脸上都在笑。\n艾尼瓦尔一边弹一边唱，唱的什么胡厚民听不懂，可那调子热乎乎的，往人心里钻。"
 COX_Landreform.221.t: "未来曙光"
 COX_Landreform.222.a: "雄鹰飞翔不知累，勤者劳作不知歇。"
 COX_Landreform.222.d: "一位红军战士用毛笔蘸着墨，一笔一画，在那块刨光的木板上用维吾尔语写道：\n图尔荪·艾山\n写完了，他端详了一会儿，又在下面把汉语也补上。\n地是在村子东边，靠着一条刚修好的水渠。以前这片地是巴依的，种的是巴依的苞谷，收的是巴依的粮食。图尔荪在这块地里弯了快四十年的腰，从年轻弯到现在，弯得背都驼了。\n地还是那块地，可地头上插着那块牌子，牌子上系着红布条——这块地有了新主人。图尔荪站在地边上，两只手不知道往哪儿放。那块木牌立在地头上，在太阳底下清清楚楚。\n图尔荪看着那几个字，一动不动。\n战士走过去，拍拍他的肩膀：“图尔荪大哥，这块地，是你的了。”\n他往前走了一步，又走了一步，走到牌子跟前，伸出手，摸着那几个字。\n他的手是糙的，全是老茧和裂口，摸在木板上，沙沙地响。他转过身，对着那些穿军装的人，想说什么，可嘴唇抖得厉害，说不出来。\n他扑通一声跪下去。\n战士吓了一跳，赶紧去扶：“图尔荪大哥，快起来！”\n图尔荪不起来。他跪在那儿，两只手撑着地，抬着头，看着那战士，看着那块写着他名字的牌子。\n“毛主席……”他说，“他知道我吗？知道有我这个图尔荪吗？”\n“他知道。”战士说，“他让咱们来，就是让每个像你这样的人，都有自己的一块地。”\n图尔荪不知道该说什么。他活了六十多年，从来不知道该怎么感谢人。以前只有挨打挨骂的份儿，没有人给过他什么。\n他弯下腰，把额头抵在土地上。\n那块地，是他跪了一辈子的地。可这一次不一样。这一次，他是跪在自己的地上。\n他想起那些弯着腰的日子，想起那些挨鞭子的日子，想起那些饿着肚子睡觉的日子，想起那些跪在地上求饶的日子。\n那些日子，都过去了。\n他站在自己的地上。太阳照着。风吹着。\n他想，明天，该种点什么了。"
 COX_Landreform.222.t: "耕者有其田"
 COX_Landreform.223.a: "驯马用鞭，打狗用棒"
 COX_Landreform.223.d: "和田那边的事，早就有了苗头。\n那些跑掉的巴依、逃走的阿訇，还有以前给日本人干过活的狗腿子，凑成一堆。他们有枪，有马，有从国外运来的弹药。\n有一回，他们拦住一个去赶集的农民，把人绑在路边的胡杨树上，割了舌头，剜了眼睛，就那么扔在那儿，让人路过的时候看。\n还有一回，他们混进和田城里，在巴扎上扔了炸弹。炸死十七个，炸伤三十多个。死的里头还有三个孩子。\n那些刚分到地的农民，那些刚挺直腰杆的人，那些刚过上几天安生日子的老百姓，人人眼睛里冒着火。\n“打！”\n中央的命令下来得很快：“集中优势兵力，彻底干净全部消灭之。”\n部队从喀什出发那天，天还没亮。三千多人，有穿军装的红军，有穿着各式衣服的民兵，有扛着土枪的农民。马队、车队、步行的队伍，排成几路，往和田的方向开。\n路上碰见一群从和田那边逃出来的难民，赶着驴车，拉着家当。一个老太太看见队伍，忽然从车上爬下来，双手合起来像是舀水，嘴里念叨着什么。汉族同志们听不懂，但都知道她在祈祷胜利。\n部队在喀什城外集结了两天。步兵、骑兵，还有几门山炮。战士们擦枪，磨刀，检查弹药，没人多说话。\n出发那天早上，胡厚民站在路边送行。周排长骑在马上，朝他敬了个礼：“胡组长，等我们的信儿。”队伍开拔，马蹄声、脚步声、车轮声汇成一片，往和田的方向去了。\n后来的事，胡厚民是从报告里知道的。\n那些反动派缩在几个庄子里，以为墙高枪多就能扛住。他们错了。部队上去的时候，山炮一响，墙就倒了。那些骑着马杀老百姓的人，从马上滚下来，跪在地上求饶。\n有一个庄子打了一天一夜。那些人把老百姓推到前面当肉盾，部队只能停。后来是几个战士趁夜里摸进去，把那些绑着的老乡救出来，天亮再打。等打进去的时候，里头的人死的死，抓的抓，没剩几个。"
 COX_Landreform.223.t: "恶有恶报"
 COX_Landreform.224.a: "“……全体死刑。立即执行。”"
 COX_Landreform.224.d: "乌鲁木齐，人民法院的大门口，从天不亮就排起了队。\n\n有从和田赶来的农民，路途十几天，就为了亲眼看看那些杀人的人长什么样。有被炸死的孩子的妈妈，怀里抱着孩子的画像，眼睛肿得像核桃。\n\n审判在大礼堂里进行。座位不够，走廊里站满了人，窗户外面也挤满了人。\n\n那些罪大恶极的被押上来的时候，人群里起了一阵骚动。有人往前挤，有人开始骂，有人扔东西。维持秩序的战士费了好大劲才把人拦住。\n审判长敲了敲锤子，宣告开庭\n\n那些杀过人的，炸过人的，强奸过妇女的，活埋过干部的。证据摆出来，证人站出来，血债一笔一笔，算得清清楚楚。\n\n问到最后一个，是个大胡子，以前在和田城外杀过三十七个人。他站在那儿，还想狡辩，说是什么“圣战”，说什么“真主的旨意”。\n\n审判长打断他。\n\n“真主的旨意，让你杀三岁的孩子？”\n\n审判长站起来，开始念判决书。\n\n礼堂里静得连呼吸声都能听见。那些从和田赶来的人，那些死了亲人的人，那些被欺压了一辈子的人，全都竖起耳朵听。"
 COX_Landreform.224.t: "审判"
 COX_Landreform.301.a: "排除万难，去争取胜利！"
 COX_Landreform.301.d: "报告中央：\n\n.自土改政策全面铺开以来，广大贫苦群众分到土地、看到希望，翻身热情空前高涨。然而，这也彻底触动了盘踞乡里的地主、水霸等反动势力的根本利益，他们对此恨之入骨，公然与人民为敌。这些反动分子暗中勾结，恶意教唆地方流氓、地痞等社会不安定分子，趁夜偷袭、破坏我农村水利设施，妄图以此制造混乱，阻挠土改顺利推进，动摇人民群众的生产根基。\n\n事发之后，我地方赤卫队反应迅速、果断出击，现已将参与破坏的不法分子悉数控制。但这些人受反动势力威逼利诱，面对审讯顽固抵赖，对幕后指使者始终闭口不言、拒不交代。\n\n当前形势依然复杂，敌情尚未完全肃清。各地土改工作组，赤卫队已全面加强警戒巡逻，严查可疑人员，坚决守护好农村水利设施，确保生产不受影响，绝不让反动势力的阴谋得逞！"
 COX_Landreform.301.t: "水利设施遭到蓄意破坏"
 COX_Landreform.302.a: "这种行为绝不能被姑息！"
 COX_Landreform.302.d: "报告中央：\n\n在新疆推行土地改革以来，我们一方面深入乡村，丈量土地、清查田契，发动贫苦农民诉苦分田；另一方面，也明显感受到旧势力的暗中阻挠。近日获悉，一些反动宗教分子借礼拜之名召开公开集会，散布对党的土地政策的不满情绪。他们在会上歪曲土改方针，声称“祖业不可分割”，鼓动信徒警惕所谓“不信者”的花言巧语，企图以宗教情绪掩护封建利益。\n\n我工作组接报后迅速赶赴现场，然其已提前散去，仅留零星传闻在坊间流转。经调查，其宣讲在广大贫苦农民中反响有限，多数群众仍拥护分田分地的实际利益。但此举无疑为部分士绅、富户壮胆，使其产生观望甚至串联之意。当前形势虽未失控，却需我们加强政策宣传，团结中立群众，防止反动势力借宗教外衣扩大影响。谨此汇报。"
 COX_Landreform.302.t: "教徒私自展开集会"
 COX_Landreform.303.a: "那些可恶的反动分子！"
 COX_Landreform.303.d: "报告中央：\n\n新疆革命已推翻腐朽的盛世才政权，其旧部在政权瓦解后大多作鸟兽散，建制不复存在。然而，各地工作组均有汇报，相当一部分原属旧军队的武装人员并未真正解散，而是化整为零，落草为寇。他们打着“自筹军费”的名义，四处搜刮粮食、牲畜与财物，实则继续维持武装力量，对地方秩序造成严重干扰。\n\n随着土地改革逐步深入，这些残余武装开始同部分失去土地与权势的地主、乡绅暗中勾结，相互利用。他们利用熟悉地形和旧有关系网，时常在夜间袭击村庄，抢掠物资，甚至对支持土地改革的贫苦农民与基层干部进行残酷报复。据各地群众反映，个别地区已出现屠戮积极分子、焚毁农舍的恶性事件，严重威胁农村基层政权的稳定。\n\n当前形势表明，旧军阀残余与地方反动势力正在逐渐合流，其危害不可低估。我们建议各地进一步加强民兵组织与赤卫队巡防，严密侦察这些武装活动，同时发动群众揭发其行踪，及时予以清剿，以巩固革命成果，确保土地改革顺利推进。谨此汇报。"
 COX_Landreform.303.t: "土匪作乱！"
 COX_Landreform.304.a: "调集民兵！"
 COX_Landreform.304.b: "我们的人手有限。"
 COX_Landreform.304.d: "报告中央：\n\n新疆革命胜利之后，新生的苏维埃政权在各地群众的支持下逐步建立起来。当前边境防务主要依靠沿线哨所与各地组织起来的赤卫队维持警戒，勉强将新疆与动荡不安的西伯利亚地区隔绝开来，使土地革命与基层政权建设得以在相对稳定的环境中推进。然而，随着北疆的秩序在近期的土地革命中逐渐瓦解，当地治安日益混乱，使得边境的防卫出现了缺口。\n\n近来我们多次接到边境村落报告，称有陌生武装人员在草原与林地间游荡，伺机掠夺粮食、牲畜，甚至破坏交通与仓储设施。由于部分地区地广人稀、通讯不便，这些匪帮往往来去迅速，给地方民兵的防范带来困难。若任其发展，不仅会扰乱农村生产秩序，还可能破坏新近建立的仓库、道路与合作社，影响土地改革成果。为此，我们建议加强边境巡逻力量，整合赤卫队与民兵力量，及时清剿流窜匪患，以确保农村根据地的稳固。谨此汇报。"
 COX_Landreform.304.t: "西伯利亚匪寇袭掠"
 COX_Landreform.311.a: "必须不惜一切代价保护农业的生命线！"
 COX_Landreform.311.d: "报告中央：\n\n自土改政策在各地全面铺开以来，贫苦农民分得土地、翻身作主，群众热情空前高涨。但与此同时，地主、水霸及其依附势力也被彻底触动根本利益，因而变本加厉地展开破坏活动。近期查明，部分反动分子不仅暗中勾结流氓地痞，还串联旧保甲势力与散兵游勇，形成小股武装，在夜间潜入村庄活动。他们先后破坏多处水闸与灌渠，决毁坎儿井，并对积极参加土改的贫农与基层干部进行恐吓乃至暴力袭击，企图以恐怖手段动摇群众信心，迫使部分村庄停止分田与丈量工作。\n\n目前敌情明显升级，形势较为严峻。各地土改工作组已紧急加强夜间巡逻，组织群众护渠护田，同时扩大侦察范围，严密追查反动势力的联络网络，务求彻底粉碎其破坏阴谋，保障土地改革顺利推进。谨此急报。"
 COX_Landreform.311.t: "大型水利设施遭袭！"
 COX_Landreform.312.a: "我们必须争取农民的支持！"
 COX_Landreform.312.d: "报告中央：\n\n近日我区土地改革工作在个别乡村遭遇新的阻力。经调查，当地部分毛拉借宗教讲经之机，对党的土地政策加以歪曲和攻击，散布“分田违背教义”“新政权夺人祖业”等言论。在其煽动之下，一些原本持观望态度的农民逐渐受到影响，开始对工作组的丈量、登记等工作进行消极抵制，甚至聚集议论、阻拦干部入村。\n\n进一步查明，在这些人群中确有地痞流氓与地主家丁暗中活动，他们混入人群煽动情绪，借宗教狂热掩护自身目的，使局势迅速扩大。部分村庄已经出现集体拒绝配合调查、阻挠分田会议的情况，反对声浪一度颇为集中。虽然多数贫苦群众仍未直接参与对抗，但在盲信与谣言影响下，也出现迟疑观望的情绪。\n\n毫无疑问，此事已对我们在当地的群众基础造成一定损失。当前各工作组正加强政策宣传，争取中立群众，同时密切调查幕后指使，力求澄清谣言、稳住局面，恢复群众对土地改革的信任。谨此急报。"
 COX_Landreform.312.t: "宗教极端分子起事！"
 COX_Landreform.313.a: "惨重的损失！"
 COX_Landreform.313.d: "报告中央：\n\n现有一则极为沉痛的消息，不得不如实上报。近日在推进土地改革的过程中，我工作组数名干部在下乡调查与召开分田会议期间突遭袭击，不幸牺牲。这一事件给正在推进的土地革命事业带来了沉重打击，也在部分地区引起不小震动。事发当晚局势一度极为混乱，袭击者趁夜潜入、迅速行凶后逃离现场，至今尚未查明其确切身份。\n\n根据各方线索推测，此事很可能与多股反动势力有关：有地主家丁暗中报复的可能，也不排除流窜兵匪伺机作乱，甚至可能夹杂被煽动的盲信教徒参与其中。各种传闻交织，使调查一时难以取得突破。可以确定的是，这场悲剧绝非偶然，而是反对土地革命的敌对势力蓄意制造的恐怖行动。\n\n更为严峻的是，部分群众在恐惧与观望情绪影响下，对事件反应冷淡，不敢公开指认线索。这种气氛无疑助长了敌人的嚣张。当前各地工作组已加强警戒与调查，同时加紧做群众工作，力求尽快查明凶手，稳定局势，确保土地改革继续推进。谨此汇报。"
 COX_Landreform.313.t: "地方干部遭袭！"
 COX_Landreform.314.a: "一切反动分子都联合起来了……"
 COX_Landreform.314.d: "报告中央：\n\n近期各地工作组连续获得情报，显示地方反动势力正出现新的合流迹象。地主、阿訇以及四处流窜的兵匪等各类反革命分子，原本并无联系，如今却在暗中往来频繁，显然正在酝酿新的行动。他们利用当前土地改革带来的社会变动与局部混乱，在偏远村镇与集市之间秘密聚集、交换消息，并通过谣言与威吓裹挟部分麻木或动摇的群众，为其壮声势。\n\n据多名群众反映，近日夜间常有可疑人员往返于几处村庄之间，有时还借宗教聚会或集市之名暗中会面。虽然我们已掌握他们多次接触的情况，但其密谋的具体内容仍未完全查明。可以肯定的是，这些势力绝不会为人民利益打算，他们的活动极有可能针对正在推进的土地改革与基层政权。\n\n当前形势表明，敌对力量正在试图重新集结力量。各地赤卫队与民兵已加强巡查与侦察，严密关注其动向，同时发动群众提供线索，力求尽早查清其阴谋，防止其破坏革命成果。谨此汇报。"
 COX_Landreform.314.t: "反动派串联"
 COX_Landreform.315.a: "调集民兵！"
 COX_Landreform.315.b: "我们的人手有限。"
 COX_Landreform.315.d: "报告中央：\n\n新疆革命胜利之后，我区北方边境的防务主要依靠各地赤卫队，依托旧有哨所维持警戒。这些哨所多建于旧政权时期，年久失修，装备简陋，通信亦不畅。过去数年，西伯利亚一带军阀彼此争斗，无暇南顾，因此边境虽薄弱，却尚能维持基本安定。然而近日形势急转直下，边境情报接连传来异常动向。\n\n据可靠线索，一名在西伯利亚争斗中失利的俄罗斯军阀正在向南方集结残余兵力。他已收拢败散部队，并吸纳流窜武装，企图越境进入新疆，夺取我方根据地，以此作为重新组织力量、反攻西伯利亚的立足之地。近来边境多处已发现侦察小股武装活动，其人数与装备明显强于以往的流窜匪帮，显然是在为更大规模行动进行准备。\n\n若敌军大举南下，仅凭分散在边境各处的赤卫队与残旧哨所进行抵御，恐怕难以形成有效防线，极可能遭受严重损失，并危及北疆根据地的安全。为防患未然，各地已紧急加强侦察与警戒，同时请求中央重视边境形势，及早部署更有力的防御力量。谨此汇报。"
 COX_Landreform.315.t: "西伯利亚匪寇大规模袭击"
 COX_Landreform.321.a: "我们的人手有限。"
 COX_Landreform.321.b: "从外省调集民兵，维护秩序"
 COX_Landreform.321.d: "报告中央：\n\n在革命的心脏地带，当前经济恢复工作进展迟缓。中央既定政策尚未有效激活长期停滞的工商业生产，城乡之间的物资流通依旧受阻，市场供应紧张，粮价持续高企，群众生活承受较大压力。在此背景下，旧政权残余势力趁机活动，暗中煽动不满情绪，逐步转入公开对抗。\n\n近日城内已出现有组织的聚集与鼓噪行为，部分市民受谣言蛊惑，参与示威扰乱秩序。同时，这些分子还与周边农村潜伏的反动势力相互勾连，企图内外呼应，扩大事态规模。由于事发突然，我方在首都及近郊的兵力部署明显不足，未能在初期迅速压制，致使局势迅速蔓延，错失恢复秩序的有利时机。\n\n当前形势已趋紧张，如不果断处置，恐将危及首都安全与政权稳定。各单位一致认为，须立即从外地调集可靠民兵与骨干力量进驻首都，加强要点防控与秩序恢复，同时稳定市场供应，以防局势进一步恶化。谨此急报"
 COX_Landreform.321.t: "乌鲁木齐重度动乱！"
 COX_Landreform.322.a: "我们的人手有限。"
 COX_Landreform.322.b: "调集民兵，击溃这些叛匪！"
 COX_Landreform.322.d: "报告中央：\n\n我部在东疆推进土地改革过程中，遭遇前所未有之严重阻力。当地反动分子已由暗转明，纠集地主残余、旧武装与地痞势力，形成有组织的暴力集团，公然对抗土改政策与新生政权。他们设卡封路，袭击工作组，焚毁登记文书与仓储设施，甚至以公开示众的方式威胁积极分子，企图以恐怖手段迫使群众退缩。\n\n更为严峻的是，原本寄予厚望的农民群众在谣言与威压之下，多数转为观望，部分地区甚至出现被裹挟参与对抗的情况，致使我方群众基础明显削弱。由于前期判断失当，我们已错失果断处置的最佳时机，敌对力量借机坐大，局势迅速恶化。\n\n当前各地据点联系受阻，基层组织承受巨大压力。若不迅速采取行动，集中力量扭转局势，东疆土改成果恐将遭到全面破坏。为此，恳请中央尽快调集民兵与骨干力量，增援前线同志，恢复秩序、稳固群众基础，以确保革命事业不致受挫。谨此急报。"
 COX_Landreform.322.t: "东疆重度动乱！"
 COX_Landreform.323.a: "我们的人手有限。"
 COX_Landreform.323.b: "从南方调集民兵，将他们驱逐出去！"
 COX_Landreform.323.d: "报告中央：\n\n接连不断的流寇袭击叠加土地改革初期的阵痛，使北疆局势急剧恶化，我方对这一新疆革命策源地的控制几近丧失。昔日丰饶安定的牧场，如今匪寇横行、交通阻断，村落接连被洗劫，部分地区甚至出现反复易手的混乱局面。大量群众流离失所，支持土改的积极分子惨遭报复，基层干部伤亡严重，不少工作组被迫撤离，组织体系遭到严重削弱。\n\n当前敌情复杂，多股境外势力趁虚而入，相互呼应，使局势进一步失控。我们虽已组织残余力量维持据点，但整体上已处于被动防御状态。必须承认，我方已错过最佳干预时机，敌人气焰正盛。\n\n然而局势尚未完全绝望。若中央能迅速调集周边地区民兵与骨干力量，集中投入北疆，配合现有赤卫队展开反击，仍有可能遏制敌势、逐步恢复秩序。如若继续迟疑，任由混乱扩散，不仅北疆根据地将彻底丧失，更将动摇土地改革成果，对整个革命前途造成严重影响。谨此急报。"
 COX_Landreform.323.t: "北疆重度动乱！"
 COX_Landreform.324.a: "我们的人手有限。"
 COX_Landreform.324.b: "我们必须在这里站稳脚跟！"
 COX_Landreform.324.d: "报告中央：\n\n南疆土地改革近期遭遇前所未有的严重反扑。各类反动分子已由暗转明，纠集地主残余、宗教势力与流窜武装，裹挟部分受蒙蔽的群众，公然对抗我方政策。他们不仅强行夺回已分配土地，撕毁契据，更在多地设卡盘查，阻断交通，对革命干部与土改积极分子实施公开处决与示众，妄图以恐怖手段震慑群众、瓦解基层组织。\n\n由于初期判断失误，我们已错过最佳干预时机。当前反动势力已形成规模，彼此呼应，控制交通要道。我方仅存的据点被分割包围，彼此难以联络，形同反动浪潮中的一座座孤岛。部分地区民心动摇，群众在恐惧之下不敢公开支持土改，局势日趋危急。\n\n若不能迅速组织有力增援，巩固现有据点并展开反击，我方在南疆的革命力量恐将被逐步清除，既有成果难以保全。为挽回局势，南疆工作组恳请中央尽快调集兵力与干部支援南疆，恢复秩序，重建群众信心，确保土地改革不致功亏一篑。谨此急报。"
 COX_Landreform.324.t: "南疆重度动乱！"
 COX_Landreform.400.a: "狼不灭，畜群难安"
 COX_Landreform.400.d: "戈壁深处，火光压得很低。\n不是散兵游勇。这一次，他们有番号，有暗语，有从境外偷运来的地图。火光映出几张脸——北疆逃来的地主，袖里藏着联络名单；南疆流窜的兵匪头目，腰上别着两把驳壳枪；还有几个戴白帽的阿訇，手里攥着的是用羊皮写的“纲领”。\n他们凑在一处，不再是豺狗，是群狼。\n“各处庄子都联络好了。秋收前动手，先断水，再烧粮。”\n“民兵里有咱们的人。枪一响，他们自己就乱了。”\n沙地上摊开一张手绘的草图，标着红圈：水源、粮仓、村公所、办事处。画完了，一脚踩平。火光里只剩下阴沉沉的脸，和一句压在嗓子眼的话——\n“这回，要把他们连根拔了。”\n与此同时，喀什城的一座老宅里，老阿訇正对着王道明说话。他面前的茶早就凉了。\n他的声音不高，像在念一段经文。\n“你看这月亮，”他指了指窗外，“亮了又暗，暗了又亮。地底下的事，从来不是几把锄头能挖干净的。”\n王道明坐在对面，垂着眼，没有接话。\n老阿訇笑了笑，将手里的念珠慢慢拨过一颗。\n“有些人以为自己开了个头，就能结个尾。可这片土地上的根，比他们想的深得多。”\n他站起身，走到门口，回头看了一眼。\n“风要来了。你且看着。”\n王道明始终没说话。月光落在他肩上，薄薄一层，像是盖不住什么。"
 COX_Landreform.400.t: "山雨欲来"
 COX_Landreform.401.a: "箭在弦上，不得不发…"
 COX_Landreform.401.d: "零散的袭击持续了七天。胡厚民带着人四处扑火，东边救完，西边又烧起来。\n消息是一个接一个传回来的。先是北边的村子，半夜被摸进去，分地的农民被吊在树上，牌子砸碎，房子烧光。然后是东边，水渠被炸，井里扔了死牲口，村口挂着白旗。\n等他们想往外冲的时候，路已经断了。包围圈一天天收紧。\n喀什城里的办事处收到最后一封急信，上面只有四个字：援军未至。\n喀什成了一座孤城。\n王道明站在人群最前头。他穿着那件洗得发白的旧袍子，手里什么也没拿。旁边的人举着刀，攥着棍子，眼睛里烧着火。\n老阿訇站在后头，没有拦他，也没有送他。\n“你心里有恨，”老阿訇说，“恨比信仰管用。”\n王道明想起那些念经的日子，想起那些夜里翻来覆去睡不着的时候，想起自己到底厌恶什么。不是那些人，是那种让他喘不过气的、虚假的无意义的“新世界”\n喀什城门封锁线就在前面。他没有停。\n就这样枪响了，人倒下去，尘土扬起来，又落下去。有人从他身上跨过去，继续往前冲。没人停下来看他。\n老阿訇站在远处，看了片刻，转身走了。\n风把他身上的灰又吹回到了地上，像什么都没发生过。"
 COX_Landreform.401.t: "越界"
 COX_Landreform.402.a: "箭在弦上，不得不发…"
 COX_Landreform.402.d: "零散的袭击持续了七天。胡厚民带着人四处扑火，东边救完，西边又烧起来。\n消息是一个接一个传回来的。先是北边的村子，半夜被摸进去，分地的农民被吊在树上，牌子砸碎，房子烧光。然后是东边，水渠被炸，井里扔了死牲口，村口挂着白旗。\n等他们想往外冲的时候，路已经断了。包围圈一天天收紧。\n喀什城里的办事处收到最后一封急信，上面只有四个字：援军未至。\n喀什成了一座孤城。\n王道明站在人群最前头。他穿着那件洗得发白的旧袍子，手里什么也没拿。旁边站着几个年轻的信众，他看见面前的人举着刀，攥着棍子，眼睛里烧着火。他听到几声清脆的“咔哒”声，赤卫队上好了膛。\n冲突已不可避免。但这些站在两群人中间的青年，就要做最后一搏。阐述圣训，详述论证…声嘶力竭，歇斯底里……穷尽一切都无法熄灭他们眼中的火，人群仍在前进，王道明看到了老阿訇，那双时刻流露着悲悯的眸子，却不愿投来一瞥。\n利刃刺穿了王道明白袍下单薄的身子，紧接着枪响了，他因疼痛跌倒在地，有的人倒在他身前，更多人从他身上跨过去，继续往前冲。没人停下来看他。\n老阿訇站在远处，看了片刻，转身走了。\n风把他身上的灰又吹回到了地上，像什么都没发生过。"
 COX_Landreform.402.t: "越界"
 COX_Landreform.403.a: "身后是一切"
 COX_Landreform.403.d: "南疆的急电送到乌鲁木齐时，天还没亮。\n译电员念完最后一句，屋里没人说话。地图上，喀什像一颗被黑水围住的孤星，外围据点已全部标红。最近的援军也在千里之外，就算日夜兼程，也要半个月。\n“他们撑不了那么久。”有人低声说。\n命令是清晨下达的。骑兵团、汽车队，能动的全部出动。出发前没人问能不能赶到，只问往哪个方向开。车轮碾过戈壁，扬起几十里长的土龙。可路太远了，远得像永远走不到。\n喀什城里，胡厚民已经三天没合眼。\n外围丢了，民兵打散了，子弹不多了，就连周排长的兵也被敌人阻滞在了外郊。可没人跑。妇女在巷口堆沙袋，半大的孩子趴在房顶上传话，老汉把家里最后一块馕塞给守城的战士。\n第四天夜里，敌军摸到了城门口。\n胡厚民站在土墙后头，手里的枪栓拉得咔咔响。身旁只剩十来个人，人人脸上是土，眼睛是红的。\n他回头看了一眼身后——那些土房子，那些刚分到地的农民，那盏还亮着的办事处的灯。\n援军还远。\n他转过头，把枪架上了墙头。\n“打。”"
 COX_Landreform.403.t: "十万火急"
 COX_Landreform.404.a: "要有大象的力气，要有蚂蚁的毅力"
 COX_Landreform.404.d: "围城的第七天，敌人后方突然乱了。\n那些被他们视为“安稳后院”的村子里，刚分到地又被夺走地的佃农们，再也坐不住了。没有枪，就用坎土曼；没有组织，就自己串联。一夜之间，粮站被烧，水渠被填，运补给的驴车连人带车翻进了沟里。被打散的民兵像野草一样从四面八方冒出来，与失去联系的小股部队汇合，在敌人屁股后头点起了一把火。\n前线断了粮，后路被人抄，反动派内部先吵成了一锅粥。天亮之前，他们像退潮一样撤走了，只在城门外留下一地的空弹壳和烧焦的尸体。\n胡厚民站在墙头上，看着那队人马消失在天边的尘土里。他没有欢呼，只是慢慢蹲下来，把枪靠在墙边。\n“土改不是分完地就完了。”他后来在报告里写道，“只要还有一个人想把这地抢回去，斗争就没完。这不是一年两年的事，是十年、二十年的事。”\n远处，那些揭竿而起的农民正朝喀什走来，身上还带着泥，手里还攥着棍棒。\n风很大，把他们的影子吹得老长。"
 COX_Landreform.404.t: "偃旗息鼓"
 COX_Landreform.99.a: "张闻天"
 COX_Landreform.99.d: "刘少奇同志：\n几周以来，土改工作组已在哈密、喀什等地建立办事处，并初步完成了新疆各地区的调查工作，兹将三地报告摘要和初步土改计划转告。\n一、北疆地区。\n（一）阿勒泰地区自解放前就已与新疆局展开合作，当地群众对土改工作十分欢迎，现已自行完成初步土改，更有群众自发组建互助会和赤卫队。如该地完成土改，或可考虑在此发展新党员，缓解干部不足的问题。\n（二）自解放前，哈萨克及俄罗斯方向便时有马匪袭扰边境。如今全疆已经解放，应及早考虑边境驻防和剿匪工作。\n二、东疆情形\n（一）哈密地区紧邻中央，仅有的两条公路是联通乌鲁木齐与中原的唯一枢纽，对贸易活动至关重要。但由于多年战乱，当地出现了大量土匪流寇在此劫掠商队，并有情报显示，大量东逃的盛世才残部在此落草为寇，进一步加剧匪患，恐将严重破坏边区的贸易稳定，甚至威胁中央的安全。\n如不尽快剿匪，后果不堪设想。\n（二）由于明清时期两次大移民，哈密地区许多村落皆有汉维混居的情况，极有利于开展工作。同时由于中原连年战乱，大量流民涌入东疆，流民群体大多无地少地，难以融入当地，受压迫极重。早在解放前，新疆局便多次派出地下党在流民群众中开展工作，流民群体普遍对共产党和土改工作抱有好感。如以流民群体为突破口，动员贫下中农或联合进步地主，东疆地区能很快展开工作。\n三、南疆情形\n（一）南疆局势极为紧张，各地反动分子与土匪兵匪勾结，干部遇袭事件时有发生，调查工作难以进行，目前已经组织赤卫队已在各地建立哨所和联络站。但以当前形势，土改工作恐极难展开。\n四、土改计划\n（一）籍由目前各地的情况，当前工作方向应以北疆为先，东疆次之，待两地土改基本完成后，再集中力量攻克南疆。\n（二）目前根据地尚不稳定，土改工作不宜操之过快，政策方面，我建议延续抗战时期晋绥边区的经验，以减租减息为主，拉拢中农及进步地主打击反动农奴主，待政权稳固后再开展全面土改。"
 COX_Landreform.99.t: "张闻天关于全疆调查情况致刘少奇电"
 COX_lanzhou_core_effect_tt: "我们将会完成对兰州的整合！"
