 XIN_Sheng_Shicai_desc: "在每个人的内心深处，都会藏着一个梦想——是在现实中几乎无法触碰的、纯粹由狂热的信念和欲望钩织起的彼岸。对于盛世才而言，那个梦想，就是成为王。\n\n他几乎成功了。梦想得以兑现之处，是孤悬于塞外的新疆。\n\n很难想象一个辽宁人如何能够成为人们口中的“新疆王”，但盛世才凭借着他天生的强运和投机本领做到了。在1933年的风暴中，他驱逐了他的老上司金树仁，成为了新疆的实际统治者。然而，强敌环伺、风雨飘摇，而新疆王的宝座却黯淡无光。马仲英和张培元无时无刻不在觊觎着那个万人之上的尊位，盛世才只能向北寻找援助，并在作出了“亲苏反帝”的承诺后，得到了红军的援助，终于将他命定的土地牢牢抓握在手中。\n\n约定意味着代价。作为成王必须的代偿，盛世才不得不扮作左翼立场接纳从中原而来的共产党人，让他们进入自己的王庭。他始终用疑惑的眼神注视着这群过于活跃的赤化分子，同时沉默地向关内眺望。苏联轰然倒塌、国民政府一败涂地，而日本成为了亚洲新的主人，这一切都被盛世才看在眼里。盛世才要成为的是王，和新疆无关。他根本不在意新疆如何，只想要守护住他的王座。因此，他可以果断地投向日本的怀抱，也可以果断地屠杀共产党人，尽管前者并没有那么喜欢他，而后者曾是他的恩人与助手。\n\n十年时光倏忽逝去。自玉门关外吹来的风越来越强劲地穿越戈壁，吹入迪化的深深王庭，吹拂着王座上的盛世才。新疆王的外壳在人们的议论中一片片地剥去，盛世才终于显现出了他原本的样貌——他只不过是一个可以为了私利而不断投机的军阀，他说谎、屠杀，毫无气节地当了汉奸。盛世才已经没有维护他权力的手段，只能颤抖着、挣扎着等待最终命运的到来。\n\n——王治总有终结的一天，何况本就只是赝品。这一次，盛世才无处告解，也再不会得救了。"
