 XBJ_YUN_tatakai: "燃气来了！"
 XBJ.1.a: "“天爷，这咋没写的嘛……”"
 XBJ.1.d: "£gezifu £gezifu 李二穿了一身麻布烂衣裳，拄着个从路边捡来的棍，手里拿着个破碗，在青海的荒地上健步行走。\n\n£gezifu £gezifu 本来他应该走得一瘸一拐，免得被人认出来不像个乞丐，可是管他的，走了十里路愣是没见一个活人，倒是路过了两个已经连个狗影子都不见的无人村庄。本来他还想遵从营长的指示，好好调查调查——调查个球！怎么调查，五十个字都没得写！\n\n£gezifu £gezifu 当时营长问有没有人熟悉青海和马家军的，他还没反应过来，他旁边的新兵蛋子第一个举了手——不过是他李二的。\n\n£gezifu £gezifu “李大哥在青海那当过兵呢！他在不少地方都当过兵！”\n\n£gezifu £gezifu “你个小王八羔子……”李二急忙想收回手，可是已经晚了，营长的视线已经转过来了，连上面来的那个“特派员”也眼光一亮。\n\n£gezifu £gezifu 之后又选了些人，大伙在培训了十天后，顺便吃了营上专门开的十天小灶，都加深了对“执行渗透任务”的认知。\n\n£gezifu £gezifu ——又走了几里，李二远远望见有炊烟。好！有烟的地方就有人！他一改先前的健步如飞，慢悠悠一瘸一拐地晃过去。\n\n£gezifu £gezifu 刚进村，他顿时不好意思乞讨了：村口就躺了两个死人；再进去，各家门口都瘫着人——他们面黄肌瘦，头不是靠在门板上就是耷拉着，连李二走过去都懒得抬头看一眼——兴许是连扭头的力气都没了。\n\n£gezifu £gezifu “娘嘞……”虽然李二在先前的战争中已见过不少破落人家，但这么破的还是头一遭。有的人家全家都没衣服穿，赤条条的！身躯干瘪，眼窝深陷，肋骨突出……天爷，看着就得做几天噩梦！\n\n£gezifu £gezifu 他向那个唯一有炊烟的人家走去。“这家应该好些。”他想着。\n\n£gezifu £gezifu 他敲了敲半掩的门，低声哀嚎着讨求施舍，结果回应他的只有沉默。他敲了敲门，仍然没有回应；于是他大胆地推开了门。结果他就看见一个妇女瘫在灶边，穿得像是个殷实人家——尽管不过只是一件破破烂烂的衣裳——手里不知握着什么。他像是有些被吓到般，犹豫了一会，离开了这处是非之地。\n\n£gezifu £gezifu 晚上，结束了一天的“调查”，他找个没人的地方换了身衣服，回到上面给他设的“联络处”，开始写报告，他闭上眼，回想着这一天见的东西，两行浑浊的泪水从脸上滚了下来。"
 XBJ.1.t: "调查"
 XBJ.10.a: "马家治下，中小商会的日子也不好过……"
 XBJ.10.d: "£gezifu £gezifu “这日子没法过了。”李敬无奈地在自家商会里坐着，忍不住自言自语道：“老子当年带着资产来兰州重建业务，本以为这里没有日本鬼子和民国的狗官，会更好发展。但没想到啊没想到，天下乌鸦一般黑，那什么湟中实业有限公司摆明了就是马家的手套，骗我们这些关内人投资，好方便敛财，呸！”\n\n£gezifu £gezifu 说着，他忍不住想吐马继援满脸口水，但听说马继援已经垮台了，也就算了。\n\n£gezifu £gezifu 他大声地对几个整理物品的伙计说道：“这些东西是我们最后的家当了，你们拿去典当了，补给你们当工资的。”\n\n£gezifu £gezifu 说罢，他一步一步地走到商会门口，心中叹息：“也不知道今后怎么办。”\n\n£gezifu £gezifu 刚走到门口的他一眼就瞧到几个当兵的列队向自己的商会走来。\n\n£gezifu £gezifu 这下他的脑袋如响雷了一样，差点没摔一跤。但他随即又想起自己的商会早破产了，而且马家的人也早倒台了，才松了口气。\n\n£gezifu £gezifu “是李敬吧，原泗阳商会会长？”为首的一个红军说道。\n\n£gezifu £gezifu 李敬这时猛地想起，这些兵应该是那什么共产党的兵，共产党是要杀富济贫的，这下他死定了。他急忙弯腰说道：“兵爷，你是不是找错人了？我已经破产了啊！”\n\n£gezifu £gezifu 谁知，话音未落，他就听到几个红军哈哈大笑，为首的红军笑完缓缓说道：“找的就是破产的。”\n\n£gezifu £gezifu 听到这句话，李敬整个人仿佛丢了魂一般，差点瘫坐在地上。看来刚出狼窝，又进虎穴了。\n\n£gezifu £gezifu 见李敬整个人都不好了，一个红军士兵拿出一袋大洋说道：“我们只是来收购你的破产商会的，别多想。”\n\n£gezifu £gezifu 听到是误会一场，李敬大喜过望地接过钱，说道：“兵爷，里头请，咱们商会还是有一些产业能用的……”"
 XBJ.10.t: "合作"
 XBJ.11.a: "但生活不会一如既往。"
 XBJ.11.d: "£gezifu £gezifu 张思源已经是第二次干这种事了。\n\n£gezifu £gezifu 作为近卫八十八旅的战士，他跟着毛旅长从布里亚特到蒙古，又辗转来到新疆，打进迪化。随后，便在极度缺人的边区命令下，脱下了军装，下到基层里主持一个村庄的恢复生产和土改事宜。\n\n£gezifu £gezifu 而现在，他穿着军装，第二次在青海干起了恢复生产的工作。\n\n£gezifu £gezifu 走在村子里，比起在新疆村民的不信任，他在青海民众的眼里看见的更多的是麻木和害怕；害怕他们不过是新一代老爷，害怕他们带来的战乱与灾难，害怕他们会继续奴役他们……还有更多的是麻木，那种无数次希望后的绝望带来的麻木。但是，张思源知道，正如在新疆那样，他，他们，红军，将带给他们希望。\n\n£gezifu £gezifu 他踱进会场，会场正闹哄哄地忙着抓阄分畜生，虽然这里的民众还是对红军抱着不信任的态度，但眼前的好处摆在眼前，还是先拿到手再说。张思源耐心地等到他们分完，虽然不情愿，但是他还是走上台前，拿上地上的大喇叭，用不大，但很沉稳的嗓音宣布道：\n\n£gezifu £gezifu “乡亲们，今天大家把地主的牲畜分了，就各自回去生产……该种地的种地，该放牧的放牧吧，不用担心，缺草缺肥的明天县上会调一点过来，凑合凑合，大家就先回去吧！”\n\n£gezifu £gezifu 村民们满腹狐疑地回去了，但转头看看牵着的生灵，捏着绳索的手，不由自主地攥得更紧。\n\n£gezifu £gezifu 入夜，这个村庄渐渐入梦，但许多村民还是辗转反侧，因为，他们预感到，新生活要开始了。\n\n£gezifu £gezifu 窗外，太阳将照常升起。"
 XBJ.11.t: "第二次"
 XBJ.12.a: "任重而道远。"
 XBJ.12.d: "£gezifu £gezifu 在主持完青海人民政府的成立典礼后，刘少奇回到了自己的新办公室，虽说前期经过了不少磨合，但是在他这个新任的人民政府主席肩上，仍有不小的担子要担，工作的处理一天都耽搁不起。\n\n£gezifu £gezifu 他翻开了政府委员的花名册。青海的情况不比新疆，在面对日本人的时候，青海的大小利益群体都暂时放下了分歧共同对敌——一如当年的统一战线，在日军的屠刀前，社会各界群情激愤，地主纷纷将些许权力让渡于农民。各个阶级的代表组成了如今的这个“人民政府”，其阶级成分之复杂，从花名册就可见一斑。\n\n£gezifu £gezifu 视线扫过花名册上面的名字，刘少奇不禁头疼了起来，尽管共产党员还是占了相对多数，勉强把持了政府的行政权，但政府中剩下的净是日后的隐患。首先便是马惇靖和他的老部下，再往后翻，一个个开明乡绅，资产阶级还有开明地主的名字就映入了眼帘。尽管在抗日的大旗之下，他们大体上还支持政府的方针，但细细想来，除了“抗日”，这些人很难达成什么共识。可是这又有什么办法呢？不这么做的话，我们该怎么面对在兰州城中磨刀霍霍的西北军？又怎样抵抗日军今后的增兵？大敌当前，不得不团结一切可团结的力量……\n\n£gezifu £gezifu 合上花名册，他知道所谓的青海“人民政府”，远远算不上是一个为人民服务的政权。但在半个世纪革命的风雨中，刘少奇早已明白了一点——若想实现理想，必须进行适当的妥协。首先是团结起这花名册上的人物，然后是缓和愈演愈烈的矛盾，抓住剩下的时间，整军备战……"
 XBJ.12.t: "花名册"
 XBJ.13.a: "指挥官走向了自己的士兵。"
 XBJ.13.d: "£gezifu £gezifu 西北绵延的山丘以北，矮草覆盖的高原之上，一支军队正在行进。不知晓敌人是否仍紧追不舍，战士们不敢驻足休整，更不敢回头，埋葬倒下战友们的尸首。他们曾是光荣的国民革命军，但现在却成了一帮缠着破褂子，使着烂枪，狼狈逃窜的劫匪。\n\n£gezifu £gezifu  蒋经国不知道这样的日子何时才能到头。\n\n£gezifu £gezifu 自从父亲身死之后，统一战线便分崩离析。关于那段黑暗的日子，蒋经国的记忆已经模糊了，他只知道，军队四散奔逃，全国一片混乱…中国已经完蛋了。被一支溃军裹挟着，他来到了辽阔的西北——在那时为数不多尚未被战火触及之处。\n\n£gezifu £gezifu 在得知了父亲的死讯后，悲愤交加的他迫不及待地想要重新升起抗日的旗帜——在兰州，他得到了马步芳的接待。但除了这冷冰冰的“款待”之外，雄踞西北的马家不愿意提供再多东西了。他们“邀请”蒋经国留在兰州，说是要“暂避日本人的耳目”，但实际上，却将他软禁了起来。\n\n£gezifu £gezifu 于是时间便这样继续过去。马家仍旧垄断着西北贸易，唯一的差别只是赚的钞票换成了日元。大量的财富涌入了马步芳的口袋，兰州也因此夜夜笙歌不息。\n\n£gezifu £gezifu 对于蒋经国来说，那是一段梦幻的日子。美酒的香气熏得他如痴如醉，交往的名媛显露着举手投足的高雅，觥筹交错的响声让他流连忘返。他开始觉得自己回到了上海滩的十里洋场，回到了氤氲着薄雾的杭州西湖。在侵略者的旗帜下，中国人民正享受着半个世纪以来一直梦寐以求的宝物——和平。\n\n£gezifu £gezifu 但当蒋经国带着醉意迈入晚秋的寒夜时，却见到了别样的景象——兰州的街头，数个老兵正横在街上，他们饿得面黄肌瘦，身上的军装沾满了人类分泌的最肮脏的东西。但一旁的行人只是低着头，绕行经过，仿佛在避着什么瘟神……\n\n£gezifu £gezifu 此情此景，伴着深秋呼啸的晚风，让迷醉中的蒋经国猛地清醒过来——他本应看得到隐藏在“大东亚共荣”幌子下血淋淋的现实；他本应挺身而出，继承父亲的遗志；他本应与这些战士们并肩作战，一道牺牲在为祖国流血牺牲的路上……\n\n£gezifu £gezifu 摆脱了浑身的酒气，迈着稳健而刚强的步伐。"
 XBJ.13.t: "于绝望深处…"
 XBJ.14.a: "“告诉他们时间与场地，我们可以当面谈。”"
 XBJ.14.d: "£gezifu £gezifu 马惇靖怎么都没有想到，当宁夏军在绝望中举起叛旗后，竟奇迹般地得到了青海各地流民的响应。正如当日被回族人架上对日战车的马步芳一样，马惇靖如今成了被那些因动荡而迁至青海，又遭到本地人排挤的汉人的希望。\n\n£gezifu £gezifu 消息传播的速度远快于宁夏军的进军。起义军挺进的每一座村庄，受尽压迫的流民们群集相应，纷纷献上急需的补给，或是直接加入义军的队伍。即便是在起义军无法触及的远方，也有不少流民聚居地打出了宁夏军的旗号，一时间，马惇靖的部队遍布了青海各地。\n\n£gezifu £gezifu 马步芳的残酷盘剥，宗教官宦组织的欺压，不合理的拔兵制……这些积压着的矛盾，迎来了总爆发。到处都是急着追讨旧债，虐杀仇人的民丁。在缺乏足够的胆识，足以平息叛乱的威望，甚至是最基本的情报的情况下，马继援的部队只能四处镇压——无疑是火上浇油。\n\n£gezifu £gezifu 事态的发展已经超出了所有人的控制。马惇靖本想借这场起义团结渐生嫌隙的宁马与青马，共抗强敌。但在日军进犯之前，西北的堡垒就这样不攻自破了。回过神来，马惇靖竟发现自己已经成了民族罪人。\n\n£gezifu £gezifu 每一天，他都焦急万分地在自己的驻地踱着步，思索着将功补过的方法。\n\n£gezifu £gezifu 马惇靖一分一秒都不敢耽搁——就在青海的人民在械斗中流血之时，敌人正一刻不停地整军备战。每一小时，都有一辆满载军械的卡车抵达兰州，每一天，都有一班狂热的军国主义分子抵达前线……\n\n£gezifu £gezifu “将军，我们收到了一条电报……是新疆发来的。”\n\n£gezifu £gezifu “盛世才不是早就和鬼子搞暧昧了吗，他找我们能有什么好事？”\n\n£gezifu £gezifu “好像…对方不是盛世才。”通讯员支支吾吾地说着，似乎自己都不太相信电报的内容，“对方说自己是什么‘新疆苏维埃政府’，希望与您相谈援助相关的事宜。”\n\n£gezifu £gezifu 这时，马惇靖才突然想起——在青海的西部，那里的百姓好像得到了某个不知名势力的援助。看起来对方有这个能力，也有这个意愿提供帮助。与此同时，与共产党的交易也十分危险。\n\n£gezifu £gezifu 如果是父亲的话，只要能阻止敌军的进犯，保护一方人民，即便代价是放弃一切特权，他肯定会毫不犹豫地答应吧。\n\n£gezifu £gezifu 这样想到，马惇靖叫住了电报员——"
 XBJ.14.t: "转机"
 XBJ.15.a: "“等等，新疆什么时候…？”"
 XBJ.15.d: "£gezifu £gezifu 尽管马惇靖早已知道自己面谈的对象，但当他见到刘少奇的时候，还是为面前之人的样貌而惊讶——刘少奇风尘仆仆得像个乞丐，却带着决然的自信端坐在马惇靖的营垒中，尽管被杀气腾腾的兰州兵所围，他却能处之泰然：“我本以为西北所谓的赤党只是些打着这个旗号行事的流寇，没想到真是刘先生您啊。我还以为您和贵党一道在陕北殉国了……”\n\n£gezifu £gezifu “野火烧不尽，春风吹又生，我们共产党人的生命力一向这么顽强，只要有人民的地方，我们总是有办法东山再起。”刘少奇倒是不在意马惇靖举手投足间流露出的防备，“倒是你们马家在西北世代经营的基业，怎会在转瞬间就乱成了这个样子？”\n\n£gezifu £gezifu \"哎……\"想到西北的近况，马惇靖不自主地叹了口气，“刘先生有所不知，如今西北的乱局全因日本鬼子的蛮横所致。如今兰州已经沦陷，我们不得不栖身于此……值此国难之际，所有西北人理应团结抗敌，但如今的局面却是家家闭关，村村结营……假以时日，西宁恐将不保。”\n\n£gezifu £gezifu ”马步芳呢？难道“西北王”没有团结整个马家的气量？“\n\n£gezifu £gezifu “刘先生，若是老辈人还活着，坐在这里和您谈话的就不会是我了。”\n\n£gezifu £gezifu “令父的事，也请你节哀顺变……但我们共产党深知塞翁失马焉知非福的道理，老一辈人的逝去，说不定会让事情出现转机。”\n\n£gezifu £gezifu ”是么……“马惇靖突然话锋一转，“那和贵党合作，是否又是与虎谋皮之举呢？”\n\n£gezifu £gezifu “这是一个危险的赌博，马将军。我知道你在怀疑，共产党是否仍记着三十年前的血债。但我要说，我们虽铭记同志的牺牲，但把人民看得更重。若是能保卫西北人民免遭日寇荼毒，搁置旧怨又算得了什么？”\n\n£gezifu £gezifu “好…”马惇靖松了口气，“在如此短的时间内，你们就让西部边境恢复了安宁，所以从一开始，我就不曾怀疑贵党的能力…但愿我们的合作，能让西北恢复往日的安宁。”\n\n£gezifu £gezifu “那是自然，有着红色新疆作为我们的后盾，我们当然有能力处理青海的问题！”"
 XBJ.15.t: "为盟"
 XBJ.16.a: "马继援拔出了随身的手枪，指向了自己的脑袋。"
 XBJ.16.d: "£gezifu £gezifu “马将军，敌军已经逼近西宁……还请您速速做决定吧…”\n\n£gezifu £gezifu “什么决定，怎么决定？”马继援歇斯底里地骂道，“敌军是什么人？日军？乱民？还是宁夏军？是盛世才那条老狗？还是他妈的从坟里爬出来的共党？仗打了这么长时间，西宁都快丢了，还没搞清楚我们到底在和谁打仗？”\n\n£gezifu £gezifu “抱…抱歉，将军。部队早就被打散了，师长找不着团长，营长寻不到兵……”\n\n£gezifu £gezifu “不用辩解了…你去告诉还拿着枪的，想守的继续守，想回家的，就发点路费，遣散算了……”\n\n£gezifu £gezifu 目送着参谋离开的背影，马继援感到一阵强烈的无力感萦绕周身，这是一种他曾经历过的感觉——\n\n£gezifu £gezifu 数年以前，父亲的健康急转直下。每当他试图呼吸时，脓水便伴着鲜血从早已无法愈合的伤口处涌出。马继援无法缓解父亲的痛苦，只能跪在病榻前，徒劳地用手巾拭去淌得到处都是的体液。在生命的最后时刻，曾经的西北王只是用浑浊的眸子紧盯着自己的孩子，干瘪的嘴唇微微张合，但没能发出任何声音，就这样逝去了。\n\n£gezifu £gezifu 虽未能亲口说出，但马继援似乎知晓了父亲最后的执念——青海百姓的安危，抗击侵略者的夙愿，偌大马家的存续。儿子将父亲的遗愿扛在肩头，之后的日子里，他追随着父亲的背影，不断鞭策自己向前。他开始学着父亲的样子发号施令，不停歇地奔波在青海各处，调节这片土地上蔓延着的仇恨。他散尽了马家数十年的积蓄，重建了青海军，在西宁之战中痛击了日本侵略者……本来一切就这样走上了正轨，但怎么会走到如此境地呢？\n\n£gezifu £gezifu 暂时停止了胡思乱想，马继援轻轻走入了漆黑的里屋。在半截烛台昏黄摇曳的光芒下，马步芳遗像空洞的眼神，正死死凝视着跪在正中的儿子。\n\n£gezifu £gezifu “父亲啊…为什么…”马继援哽咽着，半晌挤不出一句话，“是孩儿…太无能了吗？”\n\n£gezifu £gezifu “孩儿…已经够努力了啊…难道在您伤重的时候…老天就注定要亡我马家吗？”\n\n£gezifu £gezifu 死人不会说话，父亲给不出任何的回应了。——明知如此，马继援仍旧在父亲的灵位前哭诉着。只有在父亲跟前，年轻的青海之主才能卸下沉重的伪装。断断续续的抱怨逐渐带上了哭腔，支离破碎的言论诉说着现状的绝望。\n\n£gezifu £gezifu 泪眼朦胧间，马继援看到了父亲的背影……由远，及近。\n\n£gezifu £gezifu 他已经累了，厌倦了处理人世间的种种琐事，他攒了好多话儿要和父亲讲，他已经没有耐心，再等五十年了……"
 XBJ.16.t: "背影"
 XBJ.17.a: "一篇符合刘同志风格的报告……"
 XBJ.17.d: "£gezifu £gezifu 青海的土改及牧区改革，取得了喜人的成效。这固然有客观条件的因素，譬如在日军入侵的威胁下，地主阶级总是倾向于做出一些让步与妥协——正如当年党在陕甘宁边区推行的“减租减息”政策，就并未遭到太大的阻碍。\n\n£gezifu £gezifu 但毫无疑问，在如此困难的环境下成功地完成了几乎不流血的土地改革，归根到底是得益于我党在新疆土地改革时积累的经验，我认为这些经验总结成文，将对党在西北的长期工作有益处：\n\n£gezifu £gezifu 1.注重西北地区特殊的阶级环境，即地主阶级与宗教势力间紧密的联系。在新疆，这表现为地主与宗教势力的合谋。而在青海，则存在着一个个”政教合一“的门宦，这些把持着世俗权力的门宦实际上成为了横行乡里的大地主。不只农民，不少世俗地主对于他们的统治亦有不满，但迫于他们掌握的宗教权柄，只能敢怒不敢言。通过引入新疆的伊斯兰老教教义，我们的工作组得以在部分人的心中破除了世袭门宦的神圣性，使得团结农民与小地主，富农一道斗争门宦阶级成为了可能。\n\n£gezifu £gezifu 2.注重工农武装的建设。在新疆，由于阶级斗争的烈度很高，农民组织的赤卫队是保卫土改成果的中坚。而在青海，情况则更加复杂，由于连年战乱，撂荒的土地往往占到一个地区耕地的一半，所以各地的土改工作组的重点便放在了重新安置流民，恢复生产。若遇到土地不足的情况，则适当地重新分配门宦阶级的土地。结果便是，除部分地主抵抗激烈外，青海的土地改革并未激起广泛的反抗。但在抵抗土匪流寇，以及未来日军可能的进犯中，一支强大的农民赤卫队仍是革命最重要的保障。\n\n£gezifu £gezifu 3.注重宣传机构与党的建设，特别是要注意民族问题。不管是在新疆，还是在青海，党组织都是从无到有发展起来的。党的规模扩大了，新入党的既有汉民，也有少民。许多人是第一次听说共产党与社会主义，在生活作风上，远达不到共产党员应有的修养。但无视民族差异，强行推行统一的标准，也是不合时宜的。这就要求我们必须对各个民族的文化进行改造，推行革命的新文化。\n\n£gezifu £gezifu 以上便是青海土改的具体事宜，至于牧区的集体化，也照新疆的模式而言更便捷些。原因是：在此之前，马家垄断的“茶马贸易”，使得牧区的生产资料相对集中。在公营了湟中实业后，我们便得以控制了牧区经济的命脉，借此推行集体化便事半功倍了。"
 XBJ.17.t: "青海的土改报告"
 XBJ.18.a: "“肝胆相照，团结自强，歼灭敌寇，凯歌唱！”"
 XBJ.18.d: "£gezifu £gezifu 当蒋经国作为留学生，前往新生的苏联时，也曾怀揣着祖国富强的梦想，而今风云变幻，日本的刺刀终于实现了军阀间的和平。但在这别人施舍的和平中，中华民族只是更加沉沦了——达官显贵和买办军阀们的生活愈加放纵。与其形成鲜明对比的，是居无定所的百姓，还有无处安身的老兵，他们结成行乞的队伍，充斥着兰州的街头巷尾。 \n\n£gezifu £gezifu 蒋经国常找这些老兵攀谈。只要带着烟草，他们便不会追问面前这个白净军人的身份，席地而坐，伴着香烟的刺鼻气味，他们一遍又一遍地讲起了自己的故事。\n\n£gezifu £gezifu 每个故事总是起始于1945年的大溃败，与长官失去联系的战士们，躲避着日军的追杀，开始了漫长的逃亡。起初，每个人都想回到自己的故乡，但在战时混乱的中华大地上，这是一件何其艰巨的任务！在旅途中，战士们耗尽了枪弹，新添了伤口，许多人就此落下残疾，返回故乡逐渐成了奢望，他们现在只想找个地方，安稳地度过自己的后半生。\n\n£gezifu £gezifu 于是，他们启程前往西北。\n\n£gezifu £gezifu 或是跨过黄土高原，或是越过秦岭高山，征战半生，如今却一无所有的战士们来到兰州，却发现残酷的自然环境只是他们面对的最不值一提的威胁——\n\n£gezifu £gezifu 盘踞千年的寺院和地主早已将此地稀少的耕地瓜分殆尽。运气好些的，能够投到某户人家手下，当个佃农。而运气差的，只能拖着疲惫的身子，四处打着短工过活。等到终日的劳动摧垮了身体，就拿个破碗，来到兰州城头，指望老爷们能够念着过去保卫国家的功绩，赏口饭吃。\n\n£gezifu £gezifu 讲到此处，老兵们往往抓起烟杆，猛吸一口。烟雾弥漫之间，再坚强的战士也难免要哭成个泪人……\n\n£gezifu £gezifu 在冬天最冷的那几天，老兵们挤在一起，周身缠着破布，希冀能够熬过看不到尽头的寒夜……蒋经国带来了烈酒和衣物。大家围坐在一起，喝着酒，唱着过时的军歌——\n\n£gezifu £gezifu  “起来，不愿做奴隶的人们……”\n\n£gezifu £gezifu 气氛活跃之际，蒋经国猛地起身，“诸位老前辈，实不相瞒，我是蒋委员长的儿子经国。今日是为了募集援助而来……日军正在向兰州进军，我需要……”\n\n£gezifu £gezifu “老子是锄不动地，但鬼子还是会打的！”老兵们纷纷直起了身子，借着酒劲，高唱着嘹亮的军歌——"
 XBJ.18.t: "…迸发希望之火"
 XBJ.19.a: "“黄埔建军声势雄，革命壮士矢精忠……”"
 XBJ.19.d: "£gezifu £gezifu 战士们知道此行十死无生。\n\n£gezifu £gezifu 日军的前锋已经冲破了红军匆忙搭建的防线，进入了西宁城。如果紧随其后的敌军主力入城，中国就将失去夺回西宁的机会……而到了那时，城中的百万民众将不得不承受西北军释放的全部兽性……\n\n£gezifu £gezifu 而唯一可以阻止这一切的，是蒋经国率领的西北新编第一师。\n\n£gezifu £gezifu 这支由参加过上一次战争的老兵组成的精锐部队，在此之前一直在西宁北方的戈壁中袭扰日军后方的补给线。而今，随着日军主力逐步进入西宁城，他们的侧后方也暴露了出来，如若有一支部队能够趁机包绕敌军的补给线，就能扰乱日军的进军，为红军重夺西宁城创造机会……\n\n£gezifu £gezifu 但在数年的激战中，新编第一师损失惨重——装备严重不足，人数也不及满编时的一半。在这种情况下进攻防备森严的日军主力部队，与自杀行为无异。\n\n£gezifu £gezifu 当蒋经国看向身旁的老战士时，他只是低头擦着手中的步枪，低声问道：“长官，我们何时进军？”\n\n£gezifu £gezifu  “红军说他们会尝试派出增援，我们可以再等等……”\n\n£gezifu £gezifu  “我没上过军校，但打了20年鬼子。我知道他们狡猾得很，在大的方面，他们很少犯错……现在的机会很难得，我们必须抓住，就像当年在台儿庄的时候一样。” \n\n£gezifu £gezifu  “但这仗打不赢……”\n\n£gezifu £gezifu  “打不赢又怎样？”他深陷的眼睛坚定地望向蒋经国，“我们是军人，能死在保卫国家的战场上，是最大的光荣。” \n\n£gezifu £gezifu  “总比冻饿死在街头好多了。”另一位老战士接话道，“死前能带走几个鬼子，几年前我想都不敢想呢！”\n\n£gezifu £gezifu  “好吧……能有你们这样的战士，是中华民族之幸…”蒋经国强忍住颤抖的声音，下达了最后的命令：“通讯兵，给红军发去电报……老前辈们，让我们唱起军歌前进吧……”"
 XBJ.19.t: "最后的冲锋"
 XBJ.2.a: "“以后这场景还不会少见哩……”"
 XBJ.2.d: "£gezifu £gezifu 慢慢来，慢慢来，都拿得到，都拿得到——别挤别挤，排队！排队！要排队！”\n\n£gezifu £gezifu 新兵蛋子枪背在身后，拉着变声的嗓音嘶吼着，同时和几个战友一起用手尽力地挡出一个队形，尽力地维持住粥厂的秩序。\n\n£gezifu £gezifu 可是还是于事无补，无他，这座小城的居民们已经很久没吃过饱饭了，一听到有人在发粮食，全城几乎是全部出动，冲来哄抢这天上掉下来的粮食。几千人蜂拥而来，新兵蛋子这一个班根本就是以石投水，毫无作用，粥厂里的女同志们正流着汗一面照料锅里的稠粥，一面费力地把熬好的粥分发给居民们，但蜂拥而至的饥民几乎要将粥厂冲垮，好在又有一个排冲过来帮忙，新兵蛋子他们才勉强维持住秩序。\n\n£gezifu £gezifu 经过三个小时的混乱，人潮终于散去，只有些零星的老弱妇女挨上来，小心翼翼地探头看着锅里的米汤，唉声叹气自己没有挤上去，粥厂的同志们自然早有准备，拿出准备好的冷粥，烧热了分给他们。\n\n£gezifu £gezifu 新兵蛋子自然累坏了，瘫坐在地上，他真想抽一支烟，可是他不抽烟。\n\n£gezifu £gezifu “唉……这都干的什么事啊……”新兵蛋子看着他们争抢粥米，仿佛看见了曾经的自己，吃了上顿没下顿，但是，他更气愤于这群饥民“不知感恩”，一个个的，拿了粥，却都在那里拜天地拜佛，哼，封建迷信！\n\n£gezifu £gezifu “这群白眼狼嘞，明明是我们发的粮食！要我看饿死他们算了……哎哟！”\n\n£gezifu £gezifu 他脑子突然被狠狠挨了一下，李二闪出来，手里依然是香烟，依然是笑嘻嘻的样子。\n\n£gezifu £gezifu “咋，这就开始生气啦？当凤仙郡郡主是吧？小心大旱三年哦。”\n\n£gezifu £gezifu “李叔！”新兵蛋子忘了喊疼，高兴地喊道，他都三个月没见到李叔了。\n\n£gezifu £gezifu 李二却没接他的话，而是念叨了一句："
 XBJ.2.t: "粮食进城"
 XBJ.20.a: "“……所言极是，我等众志成城，必将实现民族解放的夙愿！”"
 XBJ.20.d: "£gezifu £gezifu 蒋经国从未想象过有朝一日，中国人还能得到一场如此彻底的胜利。站在刚刚历经战火的西宁城下，蒋经国有些恍惚——不久前还在马家崩溃的漩涡中彼此攻讦的人们，现在竟欢聚在一起，打开经年的窖藏，举着各色彩旗，穿行在遍布战火痕迹的街市大道中。\n\n£gezifu £gezifu 是什么人，或是什么信念，令人们如此团结一致？\n\n£gezifu £gezifu 带着这样的疑问，蒋经国来到了城中的临时指挥部。\n\n£gezifu £gezifu  “请报出您的番号。”守卫冲着蒋经国敬了个标准的军礼。\n\n£gezifu £gezifu  “国民革命军西北新编第一师师长。”在遍及西北的冲突中，所谓的编制与番号早已混乱不堪。蒋经国本以为卫兵只是走个过场，但在听到对方准确地识别出了自己的身份时，着实吃了一惊。\n\n£gezifu £gezifu 指挥部就设置在一幢普通的民房之内，大部分空间都被各种通讯设备占据了，仅剩的空间摆着一张大桌子，有几个军官模样的人（红军似乎没有给军官配备显眼的装扮）正围着摊开的地图和档案，商讨着战后的计划。\n\n£gezifu £gezifu 见蒋经国前来，一个老人轻轻抬起了头。\n\n£gezifu £gezifu  “如果是新登记入编的……请稍等一会，我们正在开会……”\n\n£gezifu £gezifu  “我是西北新编第一师师长，来找红军的指挥官。”\n\n£gezifu £gezifu 刘少奇当然听过这支战功赫赫的精锐部队——当西北战争爆发时，马步芳以各地的老兵及后备兵为基础，建立了“西北新军”。其中的“新编第一师”，正是由参加过抗日战争的老兵组成的真正精锐。在残酷的西北冲突中，他们活跃在前线与后方，袭击着日军的补给线，展现出了惊人的战斗力。\n\n£gezifu £gezifu 这支传奇部队的长官，比刘少奇想象的要年轻许多。\n\n£gezifu £gezifu  “你就是经国吗……真是久仰大名了。”\n\n£gezifu £gezifu  “彼此彼此……刘先生您更是一代传奇，当年在陕北屡次挫败敌寇进军，在重重包围下岿然不动，如今又能拯救西北万民于水火之中……”\n\n£gezifu £gezifu  “小兄弟所言，我可真担待不起啊！被帝国主义欺压的这么多年间，没有一个中国人不想站起来，扬眉吐气的。与其说是一两个英雄人物改变历史，不如说是因为千万人民齐齐挥动拳头，才将豺狼逐出了西北……”"
 XBJ.20.t: "会面"
 XBJ.21.a: "（阅毕）"
 XBJ.21.d: "西北局的同志们：\n\n£gezifu £gezifu 向你们献以革命英雄的敬礼！\n\n£gezifu £gezifu 在万分危急的情形下，是你们的不懈奉献挽救了青海，更捍卫了新疆根据地的安全！\n\n£gezifu £gezifu 在西宁城下，你们更击退了日本侵略者，重挫了他们的嚣张气焰！人民今天取得的胜利将永远铭刻在革命的历史中。\n\n£gezifu £gezifu 值此欢庆的时刻，我们还要向你们传达一个好消息——重组的情报部门已经与西南的党中央建立了联络——在常年的斗争中，他们已经在云贵高原建立了广阔的革命根据地，现在，更是与龙云将军率领的护国军结成了新的抗日统一战线。我们西南的同志们如今正与日本帝国主义扶持的伪政府进行着激战。想必用不了多长时间，全民族抗战的号角将再度吹响！\n\n£gezifu £gezifu 党中央电令我们从西北发起攻势，以策应护国军的进攻。\n\n£gezifu £gezifu 趁着日军遭到重挫的当下，你们或许可以试着发起一次大的攻势，一举重夺兰州。\n\n£gezifu £gezifu 至于战役发起的时间与规模，还请你们自己定夺。\n\n£gezifu £gezifu 中共中央新疆局"
 XBJ.21.t: "乘胜而击"
 XBJ.22.a: "派遣斥候，我们必须从这场失败中吸取教训。"
 XBJ.22.d: "主席。\n\n£gezifu £gezifu 三周间，我军曾对兰州发起了数次突击，虽重挫了敌军，但始终无法取得决定性战果。我军现已精疲力竭，急需休整，在敌人恢复，发起追击之前，请电令全军，稳步撤回青海吧。"
 XBJ.22.t: "进攻结束"
 XBJ.23.a: "“开控制台开的。”"
 XBJ.23.d: "£gezifu £gezifu “刘少奇！你为什么要在攻打兰州时使用控制台！你明知这是不可明说的势力别有用心才提供的反动力量，且你也明知使用这种力量会给根据地、给党、给同志们的革命事业带来有如天灾般的损害，但你还是使用了它！你知道你犯下了什么滔天大罪吗？！”\n\n£gezifu £gezifu “我只是想完成组织交给我的任务，同时尽量减少战士们的伤亡……\"\n\n£gezifu £gezifu ”狡辩！我们的革命事业应该自己完成，而不是依赖于第四天灾的力量！刘少奇，本庭在今天就代表党代表人民，判你无期徒刑！“\n\n£gezifu £gezifu 、于是刘少奇被关押到乌鲁木齐疗养院，渐渐地精神失常，开始疯疯癫癫的了。新来的护工看见了很是害怕，但是老护工只会不在意地走过，并向新护工解释道："
 XBJ.23.t: "滔天大罪！"
 XBJ.24.a: "一路保重，千万小心"
 XBJ.24.d: "£gezifu £gezifu 在兰州的惨败驱散了弥漫在根据地的革命乐观主义情绪，取而代之的，是前所未有的恐慌与担忧。关于日军即将西进的流言传遍了西宁城，为了缓解人们的焦虑，更是为了制定正确的策略，我们必须再次出发，去探探日军的虚实。"
 XBJ.24.t: "调查组出发"
 XBJ.25.a: "中共西北局总书记  刘少奇"
 XBJ.25.d: "乌鲁木齐总参谋部：\n\n£gezifu £gezifu 我军近日的失败中，包括民兵，西北马家军，红军在内的伤亡共千余人，具体伤亡与毙敌数量仍在统计中。\n\n£gezifu £gezifu 这是我党我军近年来面临的最严重的失败，残酷的现实给高涨的革命热情浇了冷水。作为西北局的总负责人，我不得不承担失败的主要责任，以下是我对此次失败的总结：\n\n£gezifu £gezifu 一. 军事建设尚未巩固，各部队协调调动不佳，这是失败的主要原因。参与兰州作战的部队成分极为复杂，除去忠于革命的新疆民兵与西宁新根据地的民兵武装外，忠于马惇靖的西北军，及兰州周边的游击队一并参与了此次作战。在我指挥部不熟悉地形的情况下，各部队配合显著失调，马家军冒进的同时，民兵却被山路耽搁，晚于预定时间进入阵地。我方应痛定思痛，建设完善的指挥协调体系，\n\n£gezifu £gezifu 二. 敌军实力远强于预期，准备不足，这是失败的客观原因。任何斗争，除去主观的革命意志外，更要考虑外部条件是否充分，是否能达到革命的目的。在战前，根据对方长期与游击队对峙的现状以及全国革命的大好形势，我方对日军战斗力的估计为”装备耗损严重，士气不足，装备的坦克等重型武器不适合西北的山地环境。“致使我方未能充分预期在战斗中遭遇的困难，制定有效的应对方略，故而遭受了严重的失败。在今后，我方应想办法反制对方使用的筑垒与炮击战术。\n\n£gezifu £gezifu 三. 极端革命乐观主义的蔓延——实际上是一种机会主义，这是失败的根本原因。在常年的地下活动后，革命终于取得了喜人的进展。但一些新入党的同志，不知道斗争的残酷，不了解日本帝国主义的凶残，认为只要喊口号，摆姿态，就能无往不利。这种机会主义泛滥的后果便是，在西北政权仍不稳固，全国革命形势仍不明朗，日本帝国主义实际上占据上风时，盲目地暴露自身。我认为，如果不在党内整肃这股风气，党会遭受更加惨重的损失。"
 XBJ.25.t: "汇报"
 XBJ.26.a: "通知下去，休整几天，作战前准备"
 XBJ.26.d: "£gezifu £gezifu 看完新疆发来的电报后，西北局众人一时间陷入了沉默。\n\n£gezifu £gezifu “都说说，你们是什么想法。”虽然正坐着，但刘少奇的手还是在轻微地抽动着。\n\n£gezifu £gezifu “这仗打不得。”薄一波一口咬定，“日军虽受挫，但我军损失更甚。况且充当我军主力的民兵与马家部队间无甚默契，防守时尚不致命，但倘若进攻，这种部队实在难以取胜。”\n\n£gezifu £gezifu “我认为，我们不是没有机会。”陈云说，“据马惇靖所说，如今兰州附近还有为数不少的马家游击队。如果我们与这些人取得联系，合兵一处，至少能逼迫兵力不足的日军撤出甘肃的乡野。”\n\n£gezifu £gezifu “但即便与游击队取得了联系，日军在兰州的工事对我们来说也坚不可摧……”\n\n£gezifu £gezifu “一波兄，这不只是一笔军事账。”像是下了什么巨大的决心，刘少奇缓缓说道，“二十年间党中央音讯全无，但它仍是中央……党必须有，而且只能有一个中央，如此才能进退一致，我们才不至于沦为纯粹的军阀流寇。你想想当初的张国焘，还有西路军……”\n\n£gezifu £gezifu 众人再次陷入沉默。\n\n£gezifu £gezifu ……\n\n£gezifu £gezifu “…同志们，你们都应该清楚，我们的选项并不多，时间也并不充足…但我相信，只要党和军队尽可能协调一致，并非没有战胜的可能。”"
 XBJ.26.t: "隐忧"
 XBJ.27.a: "中共西北局总书记  刘少奇"
 XBJ.27.d: "乌鲁木齐总参谋部：\n\n£gezifu £gezifu 我军一度攻入了兰州城，但仍迫于敌人后续的压力，撤回了西宁。粗略估计，包括民兵，西北马家军，红军在内的伤亡共数百人，具体伤亡与毙敌数量仍在统计中。\n\n£gezifu £gezifu 虽然说不上是严重的失败，但残酷的现实仍给高涨的革命热情浇了冷水。作为西北局的总负责人，我不得不承担失败的主要责任，以下是我对此次失败的总结：\n\n£gezifu £gezifu 一. 军事建设尚未巩固，各部队协调调动不佳，这是失败的主要原因。参与兰州作战的部队成分极为复杂，除去忠于革命的新疆民兵与西宁新根据地的民兵武装外，忠于马惇靖的西北军，及兰州周边的游击队一并参与了此次作战。在我指挥部不熟悉地形的情况下，各部队配合显著失调，马家军虽一度攻入兰州城，民兵却被山路耽搁，未能即时提供支援。我方应痛定思痛，建设完善的指挥协调体系，\n\n£gezifu £gezifu 二. 敌军实力远强于预期，准备不足，这是失败的客观原因。任何斗争，除去主观的革命意志外，更要考虑外部条件是否充分，是否能达到革命的目的。在战前，根据对方长期与游击队对峙的现状以及全国革命的大好形势，我方对日军战斗力的估计为”装备耗损严重，士气不足，装备的坦克等重型武器不适合西北的山地环境。“致使我方未能充分预期在战斗中遭遇的困难，制定有效的应对方略，故而遭受了严重的失败。在今后，我方应想办法反制对方使用的筑垒与炮击战术。\n\n£gezifu £gezifu 三. 极端革命乐观主义的蔓延——实际上是一种机会主义，这是失败的根本原因。在常年的地下活动后，革命终于取得了喜人的进展。但一些新入党的同志，不知道斗争的残酷，不了解日本帝国主义的凶残，认为只要喊口号，摆姿态，就能无往不利。这种机会主义泛滥的后果便是，在西北政权仍不稳固，全国革命形势仍不明朗，日本帝国主义实际上占据上风时，盲目地暴露自身。我认为，如果不在党内整肃这股风气，党会遭受更加惨重的损失。\n\n£gezifu £gezifu 附.  虽然没有达成既定目标，但我军的攻势仍对日军造成了短时间难以弥补的损失。据前线发来的最新情报，日军已经撤出了边境阵地与孤立的乡村岗哨，将防线收缩至兰州城周边与黄河周遭的补给线附近，扫荡已显著减少。我们已经派出了敌后经验丰富的干部，前往联络各游击队势力。"
 XBJ.27.t: "汇报"
 XBJ.28.a: "这是否意味着日本的影响力正在衰退？"
 XBJ.28.d: "据日军华北军司令部情报，一支来路不明的部队已突破了外围防线，正向兰州进发。有不明消息称，这支部队正是二十多年前消失在中国大地上的共产党军队。\n继1960年以来日本帝国在中国西北进行的军事行动之后，这将是日本军队与中国方面进行的第二次军事冲突。华北日军司令部虽未发表任何评价。\n但可以预见的是：在南方已经陷入西南军阀大规模叛乱的泥潭时，甘肃一旦失陷，华北地区将彻底门户大开，这将对华北日军造成极大的战略被动。"
 XBJ.28.t: "[Get_newspaper_header]兰州暴动"
 XBJ.3.a: "“三天河东，三天河西啊。”"
 XBJ.3.d: "£gezifu £gezifu “快！快！把东西都收拾好！共匪马上就要进城了！”马晋一面收拾着自己的财物（大部分都是搜刮来的），一面转头对他手下的几个兵吼道。\n\n£gezifu £gezifu 青海内乱，这座小城自然也不太平，但是马晋和他头上的保安队长，县长还是靠着更严厉的手段和更多的子弹暂时稳住了局势，他们还从一个不知道打哪来的人的手上套了一堆钱。本来马晋打算过几天就跑的——可是共匪动作太快了！昨天县长在县公所门口就被人杀了，他刚下车，一个汉子突然骑马冲过来，两枪就把县长结果了……唉，他也是活该，人家共匪送了不少钱来，他还要双倍！保安队长一听，昨晚半夜就溜了，这下搞得他马晋也没法跟共匪交好了，他听着街上的传言，说共匪马上就要来了！他知道，这城的上上下下都被那个人买通了，到时候共匪一进城，搞什么公审大会，他还跑得了？他马晋干了什么他心知肚明！\n\n£gezifu £gezifu 马晋收拾好东西，换了身衣服，带着行囊冲出营房，街上依然一如既往地平静，人们似乎丝毫不知道周边的变化，依然在麻木地过自己的日子，马晋尽量不引人注目地走，可是他身后背的行囊实在是太显眼了，一路上不少人盯着他看，看得他心里发毛，不得不加快了脚步，可是又不能太快！被人看出来是逃命的就完蛋了！\n\n£gezifu £gezifu 终于快到城门了，穿过这条巷子就……\n\n£gezifu £gezifu 马晋突然感觉到一个东西顶住了他的腰，一个耳熟的声音略带笑意地对他说：“晋爷,咋回事啊这？不是谈好了你带人开城门，红军就保你一命吗？怎么自己偷偷跑了？”马晋冷汗直冒，包裹“啪”的一声掉在地上。\n\n£gezifu £gezifu 李二从他后面绕出来，后面闪出两个穿蓝军装的兵，枪口对着他。\n\n£gezifu £gezifu 李二端详着马晋快哭出来的绝望面容,想起不久前这人趾高气扬的模样，咧开嘴，笑嘻嘻地说：\n\n£gezifu £gezifu “马爷，三十年……啊，不对。”"
 XBJ.3.t: "神兵天降"
 XBJ.30.a: "马上给新疆发电报！"
 XBJ.30.d: "刘少奇看着桌上一摞报告，皱紧了眉头。\n兰州战役的失败早在他意料之中，一个大篷车一般的西北局，怎么能与辻政信苦心经营多年的兰州城与他狂热的西北方面军匹敌？在开战之前，他就预见到了这一失利，并早做足了准备，西北局的部队并没有遭受太大损失，后勤损耗也没有太严重，战役的失败对青甘宁革命根据地的影响被他控制在了一个相当微妙的程度——如果辻政信不西征的话。\n\n真是条疯狗。刘少奇暗暗骂了一句。长久以来，辻政信和他的西北方面军一直是这片地区驱之不散的阴云，对他的恐惧萦绕在每个西北人民的心头。而现在，刘少奇桌上的报告，无一不揭示着，这片乌云要确确实实地压上来了。\n大幅度调动军队、囤积后勤、军队演习、边境收紧、实行宵禁，种种迹象都表明着这条疯狗要有大动作。从兰州城内传回的情报显示，为了扩充部队，辻政信甚至发出了号召，邀请各地失意的年轻日本官兵前往西北方面军效力——而这无疑会极大地激怒陆军军部，看来，辻政信将自己的全部前途，赌在了西北战争的胜利上。\n想到这刘少奇就一阵头疼，比一条疯狗更加恐怖的便是一条孤注一掷的疯狗，他已经能够想到，为了确保战线的快速推进，辻政信会命令他麾下的军队怎样对待“敌占区”的人民，他还能想到，辻政信冲破了西北局的防线，长驱直入新疆……\n拳头狠狠砸在桌面上，光在这里想象是于事无补的，既然疯狗出笼已是定局，他刘少奇能做的，就只有兵来将挡。他要马上召集会议准备对策，但开会之前，他还有一件要紧事情得做。"
 XBJ.30.t: "事态紧急"
 XBJ.4.a: "他感受到了尊严的重量。"
 XBJ.4.d: "£gezifu £gezifu 李进又牛马般地过了一天。\n\n£gezifu £gezifu 可他就是伺候牛马的。\n\n£gezifu £gezifu 每天天不亮就打着哈欠起来，吆喝着牲畜出栏觅食，忍受着寒风，使劲地睁着被寒风劫掠的双眼，模糊地看着远处的牲畜，早餐往往只是萝卜片，晚饭也只有稀粥，午饭？什么午饭？那是他这种人能享受得起的吗……\n\n£gezifu £gezifu 他就这样过了十五年。\n\n£gezifu £gezifu 十五年！把一个从内地逃来的汉子摧残成了一个垂垂老矣的，如枯骨一般的虫豸！他在这里，给那个地主干了十五年，最终也只不过是能填饱肚子，他放了十五年的牲畜，结果呢？连口肉都吃不到！\n\n£gezifu £gezifu 共匪来了，他的主子自然是想着跑路，他也想跟去，共匪的传闻他听过！共产共妻！是恶魔！可是他那主子，一脚把他从马车上踹了下去。\n\n£gezifu £gezifu “臭放牛的，还有脸跟我走？”\n\n£gezifu £gezifu 共匪真的来了，他们把那地主没来得及带走的牛羊杀了几头，李进缩在一边看着，总觉得，他们杀的下一个，就是自己……\n\n£gezifu £gezifu 他们开始生火烧汤，都在传共匪要吃人脑髓，他们这是等着把锅烧开了，把自己砍了下酒吧？呵呵，自己牛马般地过了一辈子，没想到死都死得这么不体面，哈哈……李进闭上了眼睛，等待着他的命运。\n\n£gezifu £gezifu “老乡，醒醒。”一个小娃娃拍醒了他，怎么？他还没死？这群共匪怎么没杀他？！\n\n£gezifu £gezifu 一碗汤递到了他的面前，“老乡，这天冷的，喝碗热乎汤吧，暖暖身子。”他闻出来了，羊肉汤！那味道他最熟悉！以前他主子吃肉喝汤的时候，他就像今天这样缩在墙角下，闻着肉味……\n\n£gezifu £gezifu “老乡？怎么了？喝汤吃肉啊！”什么？！共匪要给他吃肉？！他李进居然能吃上肉了？！共匪还叫他老乡？！\n\n£gezifu £gezifu 他接过碗，汤的热气在他眼前氤氲，他掂了掂沉甸甸的碗，模糊了双眼。"
 XBJ.4.t: "重量"
 XBJ.5.a: "绝境之中，兄弟阋墙。"
 XBJ.5.d: "£gezifu £gezifu 以清王朝的轰然倒塌为界，中国进入了动荡的军阀时代。在这长达半个世纪的乱局中，涌现出了无数手握兵权，主政一方的能人。他们中的绝大多数都是纯粹的实用主义者——比起民族解放或是三民主义之类的口号，他们更看重如何守住自己的一方地盘（通常也是他们的故乡。）但在军阀的队伍当中，也有真正胸怀家国之人，在二十年前的民族存亡之际，正是这些人身先士卒，率领着父老乡亲，投入到轰轰烈烈的全民族抗战之中……而后，这些有血性的军阀，便选择作为一名保家卫国的军人，与统一战线一起化作历史的灰烬。\n\n£gezifu £gezifu 或许，那些能存续至今的军阀，都是向侵略者卑躬屈膝，出卖了灵魂，才得以幸免于难的。即便父辈们重新举起了抗日的旗帜，他们的子辈仍要互相掣肘，仿佛对方是比侵略者还要邪恶的敌人——\n\n£gezifu £gezifu “补给何时才能送得过来？”\n\n£gezifu £gezifu “西宁方面说枪炮弹药已经凑齐，粮草也备足了八成，但缺乏足够的民力和推车，仍要耽搁一个月……”\n\n£gezifu £gezifu “一个月？” 马惇靖想把一肚子窝火撒到通讯员身上，但看着他面黄肌瘦的模样，只能憋住了脾气，好声好气地吩咐道：“告诉马继援，当日兰州城前，西北将士同仇敌忾，虽最终不敌败退，我等仅以身免，但也肩负父辈抗日救国之夙愿。数月前的西宁城头，宁夏兵与青海兵并肩奋战，最终击破敌寇，取得大胜。但现如今，敌军仍盘踞宁夏，肆意屠戮我等亲朋，宁夏将士尚有守土抗敌之实力，更有解放故乡之决心，但无奈驻地人烟稀少，口粮不能自足，枪弹也极为缺乏。我等父辈情深义厚，西北诸省命运本系一体，于情于理，宁夏军与青海军都应团结一致，共抗外敌。”\n\n£gezifu £gezifu 尽管自己讲出的是肺腑之言，但仍有一个不详的念头时刻萦绕在马惇靖的心头。\n\n£gezifu £gezifu 在送走了通讯兵后，马惇靖招来了自己的副官。\n\n£gezifu £gezifu “吩咐众人，如若补给仍无法准时到达，就按原计划……兵谏吧。”"
 XBJ.5.t: "绝境"
 XBJ.6.a: "“乡亲们，红军是咱工农自己的武装……”"
 XBJ.6.d: "£gezifu £gezifu 西北，对红军而言，承载着太多的往事。二十多年前，当革命遭遇低谷。风尘扑仆的红军四处辗转，最后来到了这片土地。但还未安定下来，幸存下来的革命者们爆发了争执，以红四方面军为主组成的西征军西渡了黄河，浩浩荡荡地向西北进军，这次冒进遭到了马家军的迎头痛击。在之后，大溃退时的中共干部，并没能瞻仰这些逝去的烈士，而是一路向西，穿过重重封锁，抵达了较为安稳的新疆。\n\n£gezifu £gezifu 现在，红旗终于插上了西宁城头，饱经风霜的刘少奇登上了古老的城墙。\n\n£gezifu £gezifu 此时，城门口被大量的平民围得水泄不通，他们是农民，佃农，小商贩，手工业者。他们——挣扎于战火与苛政间的被压迫者，将西北局工作组，一面红旗，还有负责维持秩序的红军战士们围在中央。人们的脸上并无任何情绪，好似现实中没有任何东西能令他们动容。他们的视线扫过持着枪的战士，新变换的旗帜，最后都不约而同地落在了刘少奇的身上。\n\n£gezifu £gezifu 刘少奇知道，这里饱经磨难的人民并不如他们外表看起来一般麻木。他们正用看似木讷的目光检验着红军和新的政权。如何让这些挣扎在残酷的拔兵与扫荡中的人们，相信有一支全心全意为了他们服务的武装？如何让这些受尽地主盘剥和官家冷眼的群众，相信新的政权势将改天换地？\n\n£gezifu £gezifu 老共产党员饱经沧桑的目光同样也凝视着这一个个如同大地一样黝黑坚实的西宁人民，他知道，这些受压迫者们，才是中国的希望。这个民族的未来，不在于某个人的卧薪尝胆，或是什么人的决心终成。中国的未来，不在这些天上缥缈的云，而是这大地上真实的黄土。\n\n£gezifu £gezifu 他喉结上下微移，张开了嘴巴。"
 XBJ.6.t: "青海，青海"
 XBJ.7.a: "“这里是大堂…这里是会议室…”"
 XBJ.7.d: "£gezifu £gezifu 每个地方都有其象征着财富的地标，比如在纽约的华尔街，东京的东京证券交易所。\n\n£gezifu £gezifu 而对于中国西北地区来说，财富就是这座坐落在西宁的楼房。\n\n£gezifu £gezifu 但是现在，这财富的象征即将面临灭顶之灾\n\n£gezifu £gezifu “快快快，快把这些都烧掉！”\n\n£gezifu £gezifu “经理，这些借条也烧？”\n\n£gezifu £gezifu “烧烧烧，快点！”\n\n£gezifu £gezifu “经理，太多了，根本烧不完啊！”\n\n£gezifu £gezifu “妈的，天杀的红军，等他们来了，咱的钱就全没了！”\n\n£gezifu £gezifu “不是，经理，我这个月的工资…”\n\n£gezifu £gezifu “别提什么工资了！董事们早跑了！我的工资都没人发！”\n\n£gezifu £gezifu 这两人是湟中实业有限公司总部最后留守的人。虽然高层早就携款跑路，但是依然有大把大把没来得及带走的黄金，白银，大洋和日元。\n\n£gezifu £gezifu “行了，资料都烧得差不多了，”\n\n£gezifu £gezifu 两人看着冲天的火光发愣\n\n£gezifu £gezifu 在火中消失的，是公司几十年来剥削西北人民的证据，是财务报表，欠条，还有“还债”的报告。更有隐藏在之中，数量庞大，难以想象的贪污证据。\n\n£gezifu £gezifu 员工小声地说：“经理”\n\n£gezifu £gezifu “讲。”\n\n£gezifu £gezifu “我刚才把我们村的借条全给烧了”\n\n£gezifu £gezifu “…”\n\n£gezifu £gezifu “我们村是不是就不不用还钱了？”\n\n£gezifu £gezifu “…”\n\n£gezifu £gezifu “这都是因为红军，对吧？”\n\n£gezifu £gezifu “…”\n\n£gezifu £gezifu “好啊！红军万岁！”\n\n£gezifu £gezifu 过了一会，几十个红军跑步赶了过来，为首的人对着经理和员工敬了个礼，说：\n\n£gezifu £gezifu “我是中国工农红军新一师二连连长，请问贵公司的负责人在哪里？”\n\n£gezifu £gezifu 员工高兴地给他鞠了一躬，说：“全跑了，全公司就剩我们两个。”\n\n£gezifu £gezifu 连长指了指那个坐在地上发呆的人，问:“那个人是？”\n\n£gezifu £gezifu 员工说：“那个人以前是我的上司，现在让他一个人待会吧。”\n\n£gezifu £gezifu 连长点了点头，“根据中华苏维埃共和国主席的命令，我们前来国有化这湟中实业有限公司，希望您配合。”\n\n£gezifu £gezifu “配合，我一定配合。”员工激动地握住了连长的手，“这里面我可熟，让我带兄弟们转转吧！”\n\n£gezifu £gezifu “同志，不能叫兄弟，得叫同志。”\n\n£gezifu £gezifu “对对，同志，同志。”"
 XBJ.7.t: "查封湟中实业有限公司"
 XBJ.8.a: "“我要加入你们。”"
 XBJ.8.d: "£gezifu £gezifu “你一个共军，跑到青海来找我作甚？”努哈诧异地望着桌对面那个瘦小但精干的男人。\n\n£gezifu £gezifu 李二不急不忙，点着一支烟，惬意地抽了起来，嘿嘿笑着，“努爷的为人我是知道的，现在青海一团乱麻，民不聊生，想必努爷也不想看见这样的青海吧？” \n\n£gezifu £gezifu 努尔表情凝重起来，自打他出生起，他就没见过青海有一段安生日子，马惇靖的叛乱，更是让青海雪上加霜，他阿达是马家军军官，他也因此习得一手好枪法，在阿达战死后，他便离家出走，当上了土匪——有点原则的那种。\n\n£gezifu £gezifu  “自然不想，但你还是没有回答我的问题，你来，找我，做什么？”努尔不想去想这些，一把掏出他的毛瑟，拍在桌子上，恶狠狠地瞪向李二，周围的顾客见了都退开了，他面前的李二却还是一脸气定神闲的样子，扫了扫周围，确定没人偷听后，笑嘻嘻地开了口：“我们呢，本来是想跟这里主事的好好商讨商讨，好和平解放这里，可是上上下下都打点遍了，那司令却是狮子大开口，我们没有办法，只能来找努爷你了啊哈哈。”努尔被气笑了：“合着你们就是想让我帮你们杀人？”李二还是笑嘻嘻的“努爷，话不能这样讲啊，我们红军在新疆干的事，想必您也是知道的。您这一干，这个小城的人民就能快点过上好日子，努爷您在外面劫富济贫，不也是为了青海人吗？” \n\n£gezifu £gezifu “……”努尔沉默了，他在思考这事该不该做，李二看出了他的犹豫，拎出他那皮包，推到努尔面前“努爷，万事好商量。” \n\n£gezifu £gezifu 努尔白了他一眼，拎起皮包，一言不发地走了。\n\n£gezifu £gezifu 第二天晚上，李二没有睡觉，坐在桌子旁抽着烟，惬意地唱着他在内地当兵听来的戏曲段子：\n\n£gezifu £gezifu  “那梁山原是这等境况，怎把好汉做了强梁……” \n\n£gezifu £gezifu  “咚咚咚”门响了，李二咧嘴一笑，起身拉开了房门。\n\n£gezifu £gezifu 努尔脸颊沾血，立在他面前。\n\n£gezifu £gezifu  “事情已经办了，你们共军马上就能进来了。” \n\n£gezifu £gezifu 他接着又把皮包扔了回来。\n\n£gezifu £gezifu  “钱我不要了，我只有一个要求。” \n\n£gezifu £gezifu  “哦？努爷尽管讲。”"
 XBJ.8.t: "青海大镖客"
 XBJ.9.a: "谁行善谁得入乐园，他们不受丝毫的亏枉。"
 XBJ.9.d: "£gezifu £gezifu “敬主赞圣”“遵经从训”“教主之令，民需服从唯谨，虽令之死，亦所甘心。”\n\n£gezifu £gezifu 富丽堂皇的清真寺内，衣着华丽的阿訇一如既往的在宣读着本土化的苏菲教义，他高贵的圣言在清真寺之间环绕，余音不绝。\n\n£gezifu £gezifu  但今天，阿訇宣读到一半，就不禁皱起眉，睁开眼睛，看向清真寺内的信徒们。\n\n£gezifu £gezifu 他的目光环绕了清真寺内星星点点的信徒，不禁说道：“谁给他们的胆子不来礼拜的？”\n\n£gezifu £gezifu 他的圣言如惊雷，在台下礼拜的信徒耳边爆炸，惊得信徒们匍匐着身子，不敢回应。\n\n£gezifu £gezifu 许久，才有一个信徒开口说道：“阿訇大人，好像是……好像是因为最近外面从新疆来了个传道的阿訇……”\n\n£gezifu £gezifu “嗯？他现在在哪？”阿訇一步又一步地走下阶梯，站在匍匐着的信徒身边，问道。\n\n£gezifu £gezifu 还不等其他人回答，清真寺内的众人就听到外面人声鼎沸，似乎聚集起了大量的人群。\n\n£gezifu £gezifu “穆圣常去圣门弟子的园林中, 他不为穷人的贫穷而鄙薄他们; 他不为帝王的权势而惧怕他们; 他不分彼此, 一律号召他们走向安拉之道，穆圣最不愿发怒, 最青睐喜悦, 最体贴众人, 最善待众人, 最为大众谋利益”。一个身穿朴素袍子的阿訇在众人的簇拥下，缓缓走进清真寺内。\n\n£gezifu £gezifu “外力阿訇，难道以前的阿訇们说的都是骗话？”在外力旁边的一个牧民信徒问道。\n\n£gezifu £gezifu “这里的阿訇，假借真主之名，垄断私财，让信徒贫困，穆圣曾言：“我的教民中的贫困者, 将先于富裕者五百年进入乐园，他与穷人同坐，与贫民同吃，而这里的教主却行敛财之私事，是虚伪之徒也。《古兰经》圣言亦称：各人只得享受自己的劳绩，这里的教主盘剥尔等的财富以满足自己的私欲，这是不尊安拉，不敬穆圣的的行为，他们才是安拉的敌人。”\n\n£gezifu £gezifu 一边说着，外力一边指向清真寺内的阿訇，说道。在他身边，一群衣衫褴褛的信徒此时却如沐春风。\n\n£gezifu £gezifu 这是这么多年来，他们聆听的最美的圣言。"
 XBJ.9.t: "谁入乐土？"
 XI_BEI_WANG: "西北王"
 Xibei_jun: "西北军本部"
 Xibei_jun_desc: "在改组国民政府的西北剿匪失败后，西北马家一度以最后的中华民国正统自诩，并不断地威胁关内，为了维护共荣圈的压舱石的安全，顺便排挤一些主战的军官，西北方面军应运而生。\n\n当浩浩荡荡的剿匪部队杀入了中国西北的腹地，一时间犹如如无人之境，曾经对改组国民政府军队重拳出击的叛军游击队，连头都不敢冒。西北方面军一路杀向了甘肃，在兰州同马家军阀展开了大战，马家引以为傲的兰州碉堡群被西北方面军轻而易举的拔除，苟活的马家部队仓皇撤入西宁，帝国无敌的西北方面军将要继续向西宁开进，彻底终结中国西北的叛军势力……\n\n但噩耗已经传来，西北方面军太过深入敌后，一路上的补给被沿途的赤匪叛军袭击，即使是在改组国民政府境内，来自东京的物资补给经历过层层军阀的盘剥，也所剩无几。缺乏补给，枪械难以保障，人员难以补充。在反复的扫荡后，西北方面军实际控制的领土内，也没有额外的食物来源。而今的他们，已经成了被困在中国西北的一支孤军。\n\n可他们能撤退吗？不，不能，不仅仅是因为皇国陆军的尊严，更重要的是，为了西北方面军最高指挥的荣耀，他们一步也不能撤退。"
 Xie_Fuzhi: "谢富治"
