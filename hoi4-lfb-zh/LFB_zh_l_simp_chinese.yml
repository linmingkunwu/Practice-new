 COX_early_industrial_development: "新疆工业恢复计划"
 COX_early_industrial_development_desc: "\n\n\n\n\n\n\n\n\n\n土地改革的顺利完成，使得我们终于能够分出精力来处理新疆工业的烂摊子。在盛世才无能的治理之下，消极怠工已经成为了一种弥漫在工人之间的风气，无人维护的机床连开动起来都显得困难，罔论制造任何产品了。我们将通过抢修、购买机器和培训工人等等手段，挽救摇摇欲坠的新疆工业。"
 COX_east_sik: "各民族友谊的壁垒"
 COX_east_sik_desc: "在新政权的领导下，东疆的流民危机得到解决，作为千年来各民族杂居的通衢之地，此地将成为我们向东解放全国的桥头堡，更是我们展现新中国各个民族和谐共处愿景的生动例证。"
 COX_Economic_Association_Between_SOV_And_PRC: "中苏经济联系"
 COX_Economic_Association_Between_SOV_And_PRC_desc: "尽管已经沉沦，前苏联地区仍有着丰富的物产与可观的工业产出。随着我们与中亚，西伯利亚，以及远东的同志们已经建立了越来越紧密的联系，这些地区的经济也随之复苏。新疆卓越的水热条件提供的丰富副食，中西伯利亚工业区产出的工业制品，中亚的矿产与远东的良港，逐渐整合为一个有机的整体，将给革命带来难以想象的助益。"
 COX_Economic_Integration: "经济一体化"
 COX_Economic_Integration_desc: "目前革命事业已取得成功，建设事业成为中央与地方政府及全国各党派的主要要务。然而，当前的财政体系却支离破碎。各地财政独立，税收分散，资源配置效率极低，甚至出现了私立税目和横征暴敛的现象。中央政府难以有效调配各地资源，地方政府则缺乏足够的资金支持战后重建和赈灾事宜。\n\n国民大会必须采取行动，建立一个统一的中央财经部门。意识形态上的严重分歧虽不可避免地导致了该采取何种经济政策的争议，但并不意味着我们无法在现阶段达成共识，共产党仍然愿意遵循孙中山先生的遗教——“平均地权”和“节制资本”的原则。在三民主义这个最大公约数的约束下，国共两党将牵头组建一个财政经济委员会，负责制定和执行统一的经济政策和财政体制，推动国家经济的一体化进程。"
