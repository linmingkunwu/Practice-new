 COX_take_back_the_wc1: "我们将派出§R5§!个连队前往[FROM.Getname]清除叛乱！"
 COX_take_back_the_wc2: "一部分民兵返回中央！\n我们成功消灭了[FROM.Getname]的叛乱，这意味着：\n地主和宗教的不满将§G极大改善§!！\n我们将§G极大改善§!农民们的支持！\n失去的所有水利设施将被§G夺回§!！"
 COX_Talks_With_The_Old_Uighurs: "与老回鹘谈话"
 COX_Talks_With_The_Old_Uighurs_desc: "在劳动人民、各级干部以及爱国宗教人士的不懈努力下，极端主义及其他反动思想已经基本从新疆伊斯兰教中清理出去。但即使是最拥护党的领导的信众与阿訇们也会担忧：苏维埃最后会怎样对待宗教？是不是最后，新疆的土地上连一座清真寺都不允许存在？为了打消他们的顾虑，我们安排和一直以来支持党的宗教政策的爱国宗教领袖会见，向他们阐释党的长期宗教政策，并庄严承诺：只要不越过红线，全中国的宗教信仰与宗教自由都会受到苏维埃政府与社会主义法律的保护。"
 COX_Tea_Horse_Trade: "茶马贸易"
 COX_Tea_Horse_Trade_desc: "茶马贸易"
 COX_Temporary_Industry_Committee: "建立临时工业委员会"
 COX_Temporary_Industry_Committee_desc: "农业生产可以分散成为若干小的公社或者生产组织来进行，但是进行大规模的工业生产却不行。在接收和重建新疆工业设备与工业组织的时候，我们也应该建立起专门针对工业生产而准备的委员会组织，统筹协调像工业设备管理与引进、工人的教育和相应的绝大多数事物。在未来我们需要对这个组织改组，但现在这样一个临时的组织是有其存在必要的。"
 COX_The_End_Of_ROC: "民国梦醒"
 COX_The_End_Of_ROC_desc: "自1912年至今已近六十年，仍有许多理想者怀念辛亥革命和几次北伐时的热血沸腾，试图为“三民主义”擦去买办和汉奸们为它抹上的污渍。\n\n但共产党人和中国人民已经用行动回答：到此为止了。\n\n作为一个诞生于清廷末期，指导资产阶级的革命理念，三民主义已经完成了它的历史使命。可到今日，“三民主义”四个字的含义一变再变，从清廷治下孙中山的革命理想、到戴季陶的阶级合作、胡汉民的东方民族革命、蒋中正的力行新生活、汪精卫的大亚洲主义……\n\n如今我们已经没有耐心听人解释孙中山先生的哪本书、哪次讲话中的某句话说明了民权、民族、民生的什么涵义或相互之间的什么关系。我们仍会为三民主义保留最后的体面，让它代表着中国人民抗击封建统治的旧民主主义铭记于历史书上。\n\n现在该迎接新民主主义了。"
 COX_The_Fighters: "战士们…"
 COX_The_Fighters_desc: "你们是红军，是人民的军队，是我们民族争取自由与解放的希望。很快，你们将踏上真正的战场，与万恶的日本帝国主义拼个死活。诚然，侵略者有着世界最强的武备，他们有坦克，自动步枪与喷气飞机，但武器并不是决定战争的唯一因素——握着日械的伪军，不是已经败于自云南一隅起兵的护国军了吗？\n\n这里的很多人，都是三十年前逃难来的，但现在，全民族抗日的号角再一次吹响了！同志们，这次我们不会再逃了，让我们组织起来，一起打回老家去！"
 COX_the_frontline: "前线"
 COX_the_frontline_desc: "西宁是阻挡敌军西进、窥伺新疆的最后一道大门。如果西宁失守，广袤的西北平原将无险可守，后方的土改成果与工业萌芽也将被彻底践踏。我们必须把一切可用的枪支、每一颗子弹以及最后的预备队推向最前沿。在冰冷的祁连山脚下，一道由血肉与泥土筑成的长城必须拔地而起。"
 COX_the_home_front: "后方"
 COX_the_home_front_desc: "当前线在流血时，新疆的工厂、农村与矿山必须成为源源不断输送战争资源的动脉。妇女将走进工厂顶替奔赴前线的丈夫，老人将套上马车运送粮食。在这场决定中国革命生死存亡的考验中，后方没有旁观者，整个新疆都将转化为一架超负荷运转的战争机器。"
 COX_The_Homeland_Shines_Anew: "国土重光"
 COX_The_Homeland_Shines_Anew_desc: "随着最后一场公审落下帷幕，百年来的屈辱与血泪被淹没在烈士的尸骨之下，而统一的中国旗帜盖在他们身上。从喀什的戈壁到阿穆尔的雪原，从东南的渔村到漠北的草原，中华民族终于拥有了统一跳动的心脏。\n\n眼下，饱受折磨的中国未从病痛中恢复，殖民与同化的阴影仍需时间消散，各地的饥荒与瘟疫仍亟待处理，几近崩溃的国民经济更让人寝食难安。北方虽在战时便已开始重建行政机构、登记人口、分发救济粮，政府内部的混乱却使得重建工作难以进一步开展。\n\n但若我们看向前方，对于战胜了列强与日寇的五万万人民来说，这些因难终究会被克服。\n\n遭受重创的日本无力威胁我们，大洋彼岸的美国对我们充满兴趣，北方的苏维埃更对我们的胜利由衷喜悦。中国人民终将自豪的重回世界舞台。\n\n一唱雄鸡天下白，万方乐奏有于阗，诗人兴会更无前。"
 COX_the_hour_of_crisis: "危急关头"
 COX_the_hour_of_crisis_desc: "来自西南与兰州的无线电波中带着令人窒息的噩耗。敌人的装甲洪流已撕破外围防线，整个西北大地都在战栗，现在是时候直面这即将降临的灾难了。"
 COX_The_Last_Fight_Against_Japanese_Invader: "对日寇的最后一战"
 COX_The_Last_Fight_Against_Japanese_Invader_desc: "自从龙云在云南举起义旗的消息传到乌鲁木齐以后，西北的共产党曾紧急召开了几次会议，哪怕是最乐观的估计，“护国军”的胜机也相当渺茫，这看起来只是龙云单方面的“军事冒险行为”。但当西南党中央号召全民族抗战的消息传来时，我们还是集结了兵马，向盘踞兰州的西北军发动了攻击……\n\n尽管我们在那场战争中损失惨重，致使新生的根据地一度陷入困境。但出乎所有人预料的是，在日寇的铁蹄压迫之下，全国上下遍地的星火一触即燃，护国军一路高歌猛进，解放了华南的大部分地区，直到南京解放的消息传到西北以后，苏区上下为之一振。尽管此时的西北仍未从战火的余烬中走出，但在这场关乎全民族命运的抗战中，我们必将砥砺共进！"
 COX_The_Peasants: "农民们…"
 COX_The_Peasants_desc: "你们是中国的脊梁，千年来，你们承受的苦难数倍于其他民族。有人认为你们软弱，只会默默忍受压迫，心甘情愿引颈受戮……但中国的农民，同样有着悠久的抗争史；摆在我们面前的，是同样的一群贼寇，他们用枪炮抢来土地，豢养起奴才，就往安乐椅上一摊，心安理得地吸着整个亚洲的血！\n\n在东方，还有数亿同胞活在这样悲惨的压迫之下，农民同志们，你们能够忍受吗？既然我们已经在西北打倒了成千上万的小地主，烧掉了他们的地契，遣散了他们的家丁。那么全中国的每家每户，每个村庄都联合起来，我们就有摧毁日本帝国主义——这亚洲最大最可恶的地主的力量！"
 COX_The_Red_Corridor_Of_The_Northwest: "西北的红色走廊"
 COX_The_Red_Corridor_Of_The_Northwest_desc: "随着与外西北诸同志们的联系愈加深化，新生的苏区接收了部分苏联的遗产，而本是一盘散沙的俄罗斯军阀似乎也有了重新聚合的趋势。虽然中亚诸势力间仍存在着深刻的意识形态分歧与民族矛盾，但我们已经迈出了区域合作的第一步。\n有朝一日，亚洲中部将重新燃起革命的星星之火，届时，新疆必将作为革命的枢纽，奋战在抵抗帝国主义的前线！"
 COX_The_Red_Lighthouse_In_The_North_West: "西北的红色灯塔"
 COX_The_Red_Lighthouse_In_The_North_West_desc: "在我们的建设之下，新疆在短短数年之内就变得焕然一新，在整个中国西北，毫无疑问的是：新疆此刻正如一个璀璨的灯塔，吸引着深受马家军劫掠和日本西北方面军屠杀的人民前来此处。我们不仅仅要成为西北的灯塔，我们还要成为全中国的灯塔，将红太阳的光辉，将革命的光辉洒向全中国！"
 COX_the_sunrise_of_north_DESC: "“当年个老李下乡来，\n夜打灯笼走山崖；\n访贫问苦住我家哎，\n帮俺农民搞土改。”"
 COX_the_sunrise_of_north_NAME: "北境日升"
 COX_The_Urumqi_Soviet_Military_and_Political_College_was_established: "成立乌鲁木齐苏维埃军政学院"
 COX_The_Workers: "工人们…"
 COX_The_Workers_desc: "你们是党的仰仗，革命的先锋，民族力量的源泉。你们的战场在车间，在流水线，在铸造厂……虽无硝烟，但斗争必将同样恶劣残酷，敌人将千方百计的阻挠，破坏我们的生产，他们的轰炸机将丢下炸弹，他们的间谍将煽动破坏。但英勇的工人阶级必将挫败一切阴谋诡计！让敌人知晓，他们的旧秩序已经朽烂，而我们，无产阶级，有创造一个新世界的决心与能力！"
 COX_TIB_problem: "藏区问题"
 COX_TIB_problem_desc: "西藏虽获解放，但仍然问题重重：在下层，万恶的农奴制仍在荼毒人民；在上层，不服西藏当局的权贵人士们正蠢蠢欲动；向南边看去，自由印度政府态度尚不明确，而印度共和国对西藏产生了浓厚的兴趣。我们必须做出行动，在未来可能的骚乱甚至危机出现前，建立起对藏区的有效管辖。或者，更进一步——对藏区进行民主改革，§Y砸碎那祸害千年的、吃人不吐骨头的农奴制！§!"
 COX_To_The_Fields: "下乡"
 COX_To_The_Fields_desc: "如今，我们的干部们已经被派往了新疆各地的各个村庄，驻扎了下来。但这并不代表着新疆的人民已经得到了解放，一如盛世才统治时期一样，现在的地主阶级仍在农村横行霸道，农民仍饱受苛政折磨。我们必须如在陕北和赣南时一样，进行土地革命,而土地革命必须建立在对土地关系和剥削关系的深刻认识上。\n\n为此，驻扎在各个村庄的同志们将会立刻展开广泛的调查，统计出各个村子雇农，贫农，中农，富农和地主的人数和占有土地的数量，以及地主阶级常用的剥削手段。"
 COX_Towards_National_Liberation: "利剑斩断枷锁"
 COX_Towards_National_Liberation_desc: "随着东北与广东的战事尘埃落定，日本——这个如今的夕阳帝国不得不向自己曾经认为难成大患的中国求和。目前，正式和约正在紧张地协商之中。经过了不屈不挠的斗争，中国人民以利剑斩断了困在自己身上沉重的枷锁，用流淌的热血浇灌出璀璨的自由之花。在胜利中迈向全国解放！\n\n“会看射雕处，千里暮云平。”"
 COX_Trade_Route_Into_KMT_Area: "深入国统区的商路"
 COX_Trade_Route_Into_KMT_Area_desc: "深入国统区的商路"
 COX_Traditional_Method: "土办法"
 COX_Traditional_Method_desc: "尽管日寇的装备已与二十年前不可同日而语，然而他们内在的一些恶行与弱点却作为“武士道军魂”得到了贯彻与传承。在上次大战中，中国人民充分发挥了自己的智慧，用一切非常规手段打击侵略者，进行了不屈不挠的斗争——地道战，地雷战，麻雀战……根据家乡地形与作战烈度的不同，一系列因地制宜的“土办法”被创造了出来。\n\n现在看来这些”土办法“依然有用，我们将在广大的敌后战场将它们贯彻到底，让人民的智慧成为我们的制胜法宝。"
 COX_Train_The_Red_Guards: "训练赤卫队"
 COX_Train_The_Red_Guards_desc: "民兵是新疆军队的重要组成部分。在改组后，部分村镇赤卫队得到整编，能够与正规军一起作战。但与我们的敌人相比，他们仍旧缺乏充足的训练与战术意识。在演习中，许多指战员只顾蒙头向前——在实战中，这将造成难以估量的损失。\n对民兵开展进一步的实战演练与战术培训，并让他们参与抵抗土匪袭扰的作战，对于提高苏区整体作战能力而言至关重要。"
 COX_Training_skilled_workers: "训练熟练工人"
 COX_Training_The_Militia: "训练民兵"
 COX_Training_The_Militia_desc: "在盛世才政权的镇压之下，新疆地区的进步人士牺牲惨重。若想将土地革命进行到底，我们必须依靠人民的力量。我们应在地方上就地组织翻身做主人的农民成为受训的民兵，这样，我们便可以在每一条战线上巩固土改的成果，密切监视反动分子的异动。与此同时，我们也可以抽调较稳定地区的民兵回到乌鲁木齐，接受进一步的训练，以备不时之需。"
 COX_Training_The_Militia_tt: "§GActivate§! panel feature: §Y【Militia】§!"
 COX_Transform_The_Blue_Sky: "改换青天"
 COX_Transform_The_Blue_Sky_desc: "日本帝国主义在中国敲骨吸髓数十年之久，靠的不只是凶残的军队，还有奴颜婢膝的汉奸。\n\n这些汉奸背弃了曾经的理想，为了名利不惜出卖同胞的血肉换取日本人的残羹冷炙。如今我们击溃了日本人的军队，这些汉奸又转头乞求原谅，甚至想要继续为民国政府工作。\n\n中国人民不会原谅他们的背叛，但我们不会拘泥于民族仇恨，更不会浪费建设社会主义法治的机会。\n\n《惩治汉奸条例》已下发各级人民政府。陈公博、周佛海这些卖国贼都将接受人民群众的审判，再由人民政府执行判决，杜绝私刑和滥杀。第一批监狱和劳改营的建设也将提上日程，对于未害人命或罪行不重的汉奸，将允许他们在改造和服刑结束后回归社会。"
 COX_Try_Traitors: "审判伪廷"
 COX_Try_Traitors_desc: "祖国的大半领土虽已光复，但附骨之疽并未随之一扫而空。在民族危亡的至暗时刻，那些背弃信仰、投靠外敌的汉奸走狗，甘愿沦为侵略者的帮凶，助纣为虐，屠戮同胞，他们的罪行罄竹难书，他们的背叛会永远刻在历史的耻辱柱上。\n\n南京将设立联合特别法庭，审判汪伪政府的主要成员。对这些叛徒的正义审判，是对他们滔天罪行的清算。无论他们曾经身居何等高位，无论他们曾经多么受人尊敬，他们都必须为自己的背叛付出代价。\n\n这不仅是对受害者的安慰，更是对整个国家的警示。只有通过审判伪廷，才能让那些心怀不轨的人知道，中华民族是不可征服的，任何背叛国家的人都将受到最严厉的惩罚。"
 COX_tsuji_masanobu_death_tt: "人面兽心的怪物终于迎来了自己的结局：不是在战场上壮烈牺牲，而是被自己所蔑视的，蝼蚁一般的人们踩在脚下。\n"
 COX_tugai: "农奴与自耕农将会表示§M支持§!！\n世俗地主与宗教地主将会表示§R不满§!..."
 COX_tugai_qiangying: "农奴与自耕农将会表示§M支持§!！\n世俗地主与宗教地主将会表示§R强烈不满§!！"
 COX_tugai_shisu: "农奴与自耕农将会表示§M支持§!！\n世俗地主将会表示§R不满§!..."
 COX_tugai_shisu_qiangying: "农奴与自耕农将会表示§M支持§!！\n世俗地主将会表示§R强烈不满§!！"
 COX_tugai_zongjiao: "农奴与自耕农将会表示§M支持§!！\n宗教地主将会表示§R不满§!..."
 COX_tugai_zongjiao_qiangying: "农奴与自耕农将会表示§M支持§!！\n宗教地主将会表示§R强烈不满§!！"
 COX_unattainable_illusions_DESC: "天啊，我们现在到底在哪个世界线？"
 COX_unattainable_illusions_flag: "寻共和之旧途，成共治之新局。"
 COX_unattainable_illusions_NAME: "镜花水月"
 COX_Uncontrolled_Ocean: "有海无防"
 COX_Uncontrolled_Ocean_desc: "从庙街的冻土到北部湾的椰林，我国有着约30000公里的海岸线，但原有的海防体系已经荡然无存，“归功于”伪政府的废弛军备，旧有的防御工事早已失修，海防装备供不应求，能开动的舰只更是屈指可数。敌人的舰队可以轻易地在沿海地区上游弋，对我们进行封锁、禁运，甚至直接对商船开火。\n\n沿海城市的居民生活在危险之中，渔民们不敢出海，商船也不敢靠岸，国民经济和人民生产生活受到了严重的影响。\n\n国民大会必须采取行动，中国共产党将提出一项特别议案，紧急修筑海防工事，协调就近驻地的两党部队在海岸线上联合布防，加强沿海地区的防御能力。现在不是争权夺利的时候，任何拖延和犹豫的行为，都是纵容对人民权益的侵犯。"
 COX_Unfinished_Business: "未竟之事"
 COX_Unfinished_Business_desc: "1931年9月18日，东北的夜空被炮火撕裂，关东军以区区借口发动突袭，仅四月光景，锦绣黑土尽数沦陷。傀儡政权登场，日寇的铁蹄践踏三千万同胞，十四载苦难铺满山河。亡国的屈辱，沉重地压在每一个东北人的肩头。\n\n如今，战局生变，祖国大地迎来解放曙光。然则东北依旧在敌手掌控之下，攻势受阻，前线静默。战士的目光却从未离开那片故土，旧抗联的残部在西北集结，故人重逢，誓言未改。游击队于白山黑水间潜伏，地下组织在长春、哈尔滨、沈阳的阴影中积蓄力量，静待时机。\n\n秩序正在松动，裂隙逐步显现。日寇管理不善，伪政权已是风雨飘摇。西满洲将成为突破口，游击队与抗联老兵汇合，筹划反攻。战旗终将再度升起，硝烟将在白山黑水间燃烧，旧恨未消，新仇已至，东北的回归，已在路上。"
 COX_Unfinished_Business_PRC: "未竟之事"
 COX_Unfinished_Business_PRC_desc: "1931年9月18日，东北的夜空被炮火撕裂，关东军以区区借口发动突袭，仅四月光景，锦绣黑土尽数沦陷。傀儡政权登场，日寇的铁蹄践踏三千万同胞，十四载苦难铺满山河。亡国的屈辱，沉重地压在每一个东北人的肩头。\n\n如今，战局生变，祖国大地迎来解放曙光。然则东北依旧在敌手掌控之下，攻势受阻，前线静默。战士的目光却从未离开那片故土，旧抗联的残部在西北集结，故人重逢，誓言未改。游击队于白山黑水间潜伏，地下组织在长春、哈尔滨、沈阳的阴影中积蓄力量，静待时机。\n\n秩序正在松动，裂隙逐步显现。日寇管理不善，伪政权已是风雨飘摇。西满洲将成为突破口，游击队与抗联老兵汇合，筹划反攻。战旗终将再度升起，硝烟将在白山黑水间燃烧，旧恨未消，新仇已至，东北的回归，已在路上。"
