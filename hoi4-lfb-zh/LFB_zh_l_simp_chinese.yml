 MEN_Nomadic_Legacy: "游牧之遗"
 MEN_Nomadic_Legacy_desc: "From the earliest days of childhood every Mongol knows the horse, and in his song and dance the horse remains. It was on horseback that the Mongol race made a name for itself and it is this unique and unsurpassed tradition of horsemanship which must be marshalled in times of war. No one in the world can match our calvary, not even our missguided foes."
 MEN_paternalism: "Mengjiang United Autonomous Government"
 MEN_paternalism_ADJ: "Mongolian"
 MEN_paternalism_DEF: "Mengjiang United Autonomous Government"
 MEN_Prince_of_the_Steppes: "草原的王"
 MEN_Prince_of_the_Steppes_desc: "On banners and in schools, on newspapers and uniforms and even in yurts the face and symbols of Prince Demchugdongrub are found. Not one day will the Mongol go unreminded of the Prince and all he has done for the nation. It is under his banner that every Mongol of the steppes lives, workes, fights and dies. He is the Prince, and we are at last united under him: we shall not forget it."
 MEN_Saving_the_Country: "拯救国家"
 MEN_Saving_the_Country_desc: "This great land, sacred home to the great Mongolian peoples, has for generations been divided and weak. A people who were once lead by great Khans riding over the whole earth and making fools of the Chinese had become wretched vassals. Now we are once more united and free but for the treasonous men who we now must face. Let the pure sky and steppe not be polluted by these criminals, to arms!"
 MEN_Slash_And_Burn: "过刀过火"
 MEN_Slash_And_Burn_desc: "The price of treason is death. The price of harboring and aiding such criminals is death. The price of impeding those who seek to deliver justice to the betrayer is death. Entire families and even towns have become complicit in the betrayal of the Prince and the Mongol people, and for such a crime they cannot be allowed to live. The enemy behind is just as deadly as those ahead, and shall be destroyed just as swiftly."
 MEN_socialist: "Mengjiang United Autonomous Government"
 MEN_socialist_ADJ: "Mongolian"
 MEN_socialist_DEF: "Mengjiang United Autonomous Government"
 MEN_The_Relentless_Attack: "无情进攻"
 MEN_The_Relentless_Attack_desc: "We will not and frankly cannot allow this rebelion to continue. It must be crushed totally and swiftly. Our loyal men must charge and charge again into the enemy and chase him away before the damage done to Mongolia gets any worse. The harsher the war, the better the peace is a time honored fact, so let us go forth and conquer."
 MEN_ultranationalism: "Mengjiang United Autonomous Government"
 MEN_ultranationalism_ADJ: "Mongolian"
 MEN_ultranationalism_DEF: "Mengjiang United Autonomous Government"
 MEN_zedengbaer: "Yumjaagiin Tsedenbal"
 MEN_zhamiyang: "Zhamiyan Lekhagvasuren"
 men.1.a: "理应如此。"
 men.1.d: "蒙疆的德王亲自向天皇表示感谢，感谢我们在最近的骚乱中所提供的帮助。他同时还向我们保证蒙古草原上的秩序必将恢复，看来那些土匪也就刚开始的时候能占点上风，但他们无论是纪律还是军力都不可能比得上德王，正在我们说话的时候，那些叛匪的残党正在被剿灭。之前因为局势动荡而撤离的日本人正在返回，随着最后一批叛徒和盗贼从蒙疆逃到俄罗斯的荒野，日本得以继续发展他的商业。"
 men.1.t: "属于蒙疆的胜利！"
 men.10.a: "The Rising Sun remains supreme."
 men.10.d: "'Hey, Toyoda-kun, isn't it hot as hell today?' said the young Mongolian as he walked into the sergeant's tent.\n\n'Idiot, Altan. And you're not allowed to call me 'kun,' I'm still your superior officer!' \n\n'Alright, Toyoda-san,' Altan replied in his rough but clear Japanese.\n\nTwo months ago, Sergeant Toyoda was reassigned as an advisor to a Mongolian platoon, part of the first 'Observation Group' deployed to Mengjiang. His job was simple—to train Mongolians according to the doctrines and traditions of the Imperial Japanese Army. It sounded easy, at least at first—until he actually had to train these soldiers.\n\nThe Mengjiang Army was a hodgepodge of auxiliaries, former bandits, and professional soldiers. Almost no one could understand Japanese, let alone converse in it. The language barrier, combined with the extreme prejudice and contempt the Japanese advisors had for the Mongolians, made unit cohesion almost impossible, and Toyoda's unit was no exception.\n\n'Don't get the wrong idea, Altan, I still think you're nothing but worthless dog shit, but you're just a bit better than the rest—a taller dwarf in a crowd of midgets—and that's good enough for me.'\n\n'Why did you call me here then?'\n\n'Well, I'm appointing you as squad leader—I've seen you fight those rebels—and believe me, I won't miss a good soldier, especially one who isn't afraid of machine guns or being captured.'\n\nSergeant Toyoda walked out of the tent, slowly lit a cigarette, and took a deep drag before he left, he gently patted Altan on the shoulder. In the silence and solitude, Altan pondered some questions, unsure whether fighting his own people was worth it—but for him, despite its short-sightedness, joining the Japanese meant a new beginning in his life."
 men.10.t: "Training the Mongolian Army"
 men.11.a: "万岁！"
 men.11.d: "Our friends in the Imperial Japanese Army have returned the first batch of Mongolian trainees to active duty. Although their numbers have decreased, their fighting spirit has become as tough as steel, a far cry from what they were before. They pride themselves on the harsh training they've endured, showing no mercy to the weak. They stand tall, every button on their uniforms perfectly aligned. These men have been forged by the Japanese from soft clay into the sharp swords of the Emperor and the Prince."
 men.11.t: "New Auxiliary Forces"
 men.12.a: "Free up some auxiliary air units for service in Mongolia."
 men.12.b: "Officers and equipment will be sent to train Mongol units, alongside our air support."
 men.12.c: "Provide training, air support, and an armored brigade."
 men.12.d: "Status Report 57A - North China Area Army (TRUNCATED FOR BREVITY)\n\nFOREWORD: Prince Demchugdongrub's forces of the Mongol United Autonomous Government has been battling the forces of Yumjaagiin Tsedenbal's rebel government in the far steppes of Mongolia. Mongolia, while a backwater compared to the riches of Manchuria and China, is still a vital communications and logistics hub for transport through Beijing. As such, Prince Demchugdongrub's forces should be aided by the forces of the North China Area Army as much as possible. Colonel Kodohara, representing our Chief of Staff had come up with three proposals:\n\n(a.) The provision of air support from the 17th and 33rd Fighter Groups, as well as the bomber group of the Genzan Kokutai. The lowest possible commitment we can make, this would still mean significantly to the Prince's forces - intelligence reports have stated that the air capacities of Tsedenbal's rebels are lacking.\n\n(b.) Same as option (a.), but with the additional provision of the 33rd Reserve Battalion - as an advisor group for the Prince's forces on the ground. This would increase the land capabilities of the Mengjiang Army - but might be seen as a waste of resources if the Prince loses the war in the steppe.\n\n(c.) Same as option (a.), but with the added provision of the 2nd Armoured Brigade. The heaviest commitment we are able to make, this would increase the Prince's chances of victory exponentially - at the cost of massively lost political capital if the Prince were to be defeated.\n\nSigned: Lieutenant General Ishihara Tadachi, GHQ Outer Mongolia Observatory Group."
 men.12.t: "蒙疆请求支援"
 men.13.a: "我们心存感激。"
 men.13.d: "Our pleas to the Japanese have not gone unheard, and today our Prince has received word that Japan will send us pilots, aircraft and other aerial support to aid us in our fight against the rebels. Doubtless this will be a great help to our forces as the enemy has no viable air defenses, and the moral of our enemy must suffer in the face of airborne annihilation!"
 men.13.t: "日本送来援助！"
 men.14.a: "我们心存感激。"
 men.14.d: "Our pleas to the Japanese emperor have not gone unheard, and today our Prince has received word that Japan will aid us with air support along with officers to train and equip our troops for battle. The twin fists of Japanese aerial bombardment and the famous fighting spirit of the Imperial Army will doubtless give our men the upper hand in battle."
 men.14.t: "日本送来援助！"
 men.15.a: "感激不尽。"
 men.15.d: "Our pleas to the Japanese have not gone unheard, and today our Prince received word that the Japanese were indeed generous to us. We can shortly expect not only Japanese air support and military advisors but even a full IJA armored brigade. The generals are practically giddy with the thought of not one but two Japanese forces which the enemy has no good response to joining the battle. This conflict must now surely turn in our favor."
 men.15.t: "日本送来援助！"
 men.16.a: "又有叛乱了。"
 men.16.a.t: "§W我们会解锁§Y决议§!，在这场冲突中支持§Y[MEN.GetNameWithFlag]§!。§!"
 men.16.d: "在本岛与亚洲其他更富有的地区之外，蒙古草原又一次出现了动荡。我们的盟友德穆楚克栋鲁普亲王就如五十年代一样，没能控制住叛乱之火，似乎他又一次失败了。虽然我们还没有卷入这场冲突，但看着日本公民争先恐后地逃离几周前还是“友方领土”的地方，似乎我们不得不再一次支持德王。"
 men.16.t: "乌兰巴托叛乱"
 men.17.a: "这感觉就像在作弊。"
 men.17.d: "浅野中尉正用他的军官帽擦拭着额头上的汗，草原的酷热令他闷热难当。蒙古是他最不希望被分配到的地方：晋升前景渺茫，还常年与一群随时会在沙丘的掩护下遁入沙漠的敌人交战。然而，今天与往常不同，他的大队正围攻一座由泽登巴尔的部队顽强防御的小镇。\n\n“喂，彻！我们的空中支援到底他妈什么时候才能来？我他妈的就快要死在这了——只要泽登巴尔想的话，他现在就能亲自毙了我——”\n\n彻凌厉的眼神让这个菜鸟中尉闭了嘴。虽然从军衔上看不出来，但彻浅次郎军曹已经在蒙古的土地上奋战数个月了，从臭名昭著的关东军第四十二大队留下的剥皮俘虏到沙漠中蜷缩在一小桶水旁的日本和蒙古干尸，他已目睹过这里的一切。\n\n“什么都不打算说是吧？”中尉一边说，一边拿起他的步枪并把头巾系到额头上。\n\n“浅野中尉，请闭上你的嘴。”\n\n年轻的军官并没有听从老兵的警告，他爬出了堑壕。来自沙漠的热浪快把他逼疯了。蒙古的辅助兵们试图把浅野带回安全地带，但并没有成功。\n\n直到战斗轰炸机低空俯冲带起的冲击将神志不清的中尉从沙地上掀翻，他昏迷前所看到的最后一番景象是一缕亮丽的橙色，紧接着的则是一团令人窒息的黑云。中尉逐渐昏了过去，他已几乎听不到远处燃烧着的蒙古士兵发出的尖叫。"
 men.17.t: "空袭成功"
 men.18.a: "The sooner we win, the sooner such events end."
 men.18.d: "\"Suzume-1-A to Suzume-1-C, check your altitude, we're going down low\"\n\n\"Roger that Suzume-1-A, priming arms for attack run.\"\n\nThe bright, gleaming sun glances off the helicopter's cockpit and into the eyes of Captain Ito. For him, today's bombing run was merely another mission - whoever the targets were to be. Civilian or military, the Outer Mongolia Area Army couldn't take any chances - any potential resupply base for Tsedenbal's forces was a threat to the success of the campaign.\n\n\"No resistance, eh Cap? They'd usually swarm us with ack-ack by now!\" shouted Ito's (perhaps, overly) enthusiastic, door gunner.\n\n\"Shut the fuck up, Takayama, just focus on hitting your targets.\"\n\nTakayama cocked back his light machine gun's bolt, and loaded up high-explosive rounds. He'd been on enough missions to know which missions involved \"soft\" targets and which ones involved \"hard\" targets. Today's mission was \"soft\" - so far. At least until several airburst rounds scattered around the helicopter - maybe this target would not be as \"soft\" as Suzume-1-A expected.\n\n\"Bakayama, take out that fucking AA gun on the right! Everyone hang on, we're going in hot!\" shouted Ito.\n\n\"Suzume-1-A, Suzume-1-A! We took a hit! Going do-\", as the helicopter next to Ito exploded in a beautiful orange plume.\n\n\"Suzume-1-A to all Suzume-1 units, finish your runs, we're off for today. Good job Bakayama, scratch ten to your name when we get back!\"\n\nIn their jubilation and the rush of adrenaline, the pilots of Suzume-1 just barely missed the column of bloodied and wounded refugees pouring out of the complex, shrouded by the black plumes of an ammunition dump's explosion."
 men.18.t: "Report From the Air"
 men.19.a: "Grisly work."
 men.19.d: "Village by village, our men have begun to ensure sympathizers to the rebel cause can no longer hide within our territory, if they want to keep their lives. Door by door and step by step the traitors cannot be allowed to escape again. Weapons, horses, propaganda, a wrong look or an unforchinut relation cannot be allowed to continue if the Mongol state is to be strong and secure. No longer can mercy hold us back; the people need wholesome dread, they shall be given something to fear. They must have someone to frighten them and make them shudderingly submissive, lest the calamity of civil war be visited upon us again."
 men.19.t: "Traitors' Due"
 men.2.a: "亚洲的秩序不能被动摇。"
 men.2.b: "谁在乎野马和草原？"
 men.2.d: "我们的军队在最近几周已经不再看好德王和他的政权，显然最后的结果并未出乎我们的意料。一小部分随行人员和保镖护送德王——如今“蒙疆”这个名字唯一的象征，去到满洲国。我国政府中有许多人要求对蒙疆实施再征服，并且声称不让秩序恢复是不负责任的表现。然而另一些人早已厌烦这一切，并且再也不想搭理蒙古和失败的德王的烂摊子。"
 men.2.t: "蒙疆失败了…"
 men.20.a: "Where did they pull those from?"
 men.20.d: "One of our cavalry units, riding at full strength just days ago, has come back to us with horrendous losses and disturbing news. While pursuing what they thought was a fleeing enemy a pair of what we can only assume were armored tanks hit them from the side. While many were killed in the initial blast the true mauling came when the foolhardy commander ordered a screaming charge on the new foe. Our horsemen were mowed down in scores and the shattered remnants fled for their lives, some of the more isolated among them not even knowing what kind of beast had attacked them. It seems a new foe has appeared, one to which we have few good responses."
 men.20.t: "The Red Steppe"
 men.21.a: "How the hell did this happen?"
 men.21.desc: "Despite our vast numerical superiority over the Mongolian rebels, we have been pushed back on all fronts, resulting in the collapse of our primary access to the Asian mainland and the sphere's industrial heart, Manchukuo.\n\nWhile their victory has cost the Mongols greatly, this massive blunder will go down in history as the most embarassing moment of the Imperial Japanese Army."
 men.21.t: "An Unexpected Result"
 men.22.a: "Bite the bullet and get it over with."
 men.22.desc: "The Mongolian situation has become untenable, with the front ebbing back and forth in places and remaining static in others. While Prince Demchugdongrub has repeatedly assured our commanders that the Mengjiang Army will suffice for the operations in the steppe, and that \"victory is within our grasp\", his claims get less and less convincing with each passing day.\n\nThis presents us with a bubbling, but still manageable crisis, especially among the notoriously insubordinate Kwantung Army. Some of the more jingoistic and independent-minded officers want to directly drag Tokyo into the Mongolian rebellion, but this could lead to a dangerous precedence of wasting men, resources and materiel into small-scale conflicts that our proxies should be able to solve by themselves.\n\nOn the other hand, the idea of direct intervention isn't that bad, as it gives us an opportunity to experiment with airborne and helicopter tactics in coordination with armoured and motorised thrusts - a doctrinal boost in an ever-modernising battlefield. In addition, it also gives some of our newly-graduated airmen a proving ground - the skies of Mongolia are vast, and there's little opposition to shoot them down.\n\nLastly, it will remind Prince Demchugdongrub to not get cocky in his internal affairs, and hopefully this would be the end of our massive investments in the Mongolian conflict."
 men.22.t: "The Steppe Situation"
 men.23.a: "They have our full support."
 men.23.d: "After quenching Tsedenbal's rebellion, generals within their army was eyeing their next target, the remnants of the Siberian Red Army, the People's Revolutionary Council. They have stuck up in Tuva and terrorized the local population. Mongolia may be stable again, but it will never be whole, as long as its westernmost provinces exist under communist imperialist occupation. The wise prince Demchugdongrub wills it and the Shо̄wa will grant his wishes.\n\nThats the official version of the story at least. IJA officers know that the Mongolian officers will engage this conflict and bring combat to west Mongolia, and has figured that it would better to mobilize some divisions to assist the operation in order to guarantee success."
 men.23.t: "Mengjiang is moving troops"
 men.24.a: "Call Tokyo."
 men.24.a.tt: "Japanese forces will provide aid in our §Yongoing conflict§!."
 men.24.desc: ""
 men.24.t: "库伦的陷落"
 men.25.a: "Disappointing, but ultimately expected."
 men.25.desc: ""
 men.25.t: "Failure in the Steppes"
 men.27.a: "东京快递。"
 men.27.d: "蒙疆民族军装备简陋、训练不足，甚至不足以应付土匪和维持国内安全。虽然在士气和单兵能力上我们无可奈何，但我们还是可以通过向蒙疆提供一批（相对）现代化一些的装备为他们在平原上与泽登巴尔叛军的作战提供帮助。\n\n由于战后预算的限制和平衡，大部分战时的武器都被保存在帝国陆军和海军的库存中，其中大部分被用于训练、仪式和作为紧急储备。但即使是这样，大陆上的单位拥有的武器也远超他们的需求。因此，我们驻蒙疆军的观察员建议放弃一些保存中的装备，比如战时的九九式步枪和一些火炮，用以适当的武装蒙疆军队。\n\n通过这一军售，我们既可以为我们的国库赚得一笔收入，又可以将蒙疆军队从现在的乌合之众武装为一支堪用的战斗部队。虽然我们送去的装备或许早已过时，但这至少为将蒙疆军训练为一支堪用的反叛乱、剿匪部队奠定了基础。"
 men.27.t: "给蒙疆的物资快递"
 men.28.a: "The benevolent Japanese hand guides all."
 men.28.d: "Northwestern China had always been a backwater - a death sentence for the careers of the once-promising, a quiet retirement home for the weary, and a containment ground for the most rabid of IJA officers and personnel. While this odd mix of competence and incompetence was sufficient for peacetime operations such as anti-bandit raids as well as basic garrisoning, this shall not suffice for an actual war, or a large-scale rebellion.\n\nWith the escalation of Tsedenbal's rebellion, it would be wise for us to pour in more trained and effective assets into the North China Area Army. Specifically, deploying motorised and airborne assets would be useful for us to intervene readily in the Mongolian steppes in case Prince De's government falls to Tsedenbal's forces. In any case, we should ready forward cadres of these units and send them to Mengjiang as soon as possible - to act as forward operating units, as well as advisors for the Mengjiang National Army.\n\nHopefully, with this deployment we can increase the fighting capabilities of the Prince's army - with luck, we can extend our influence far to the Northwest against the Russians."
 men.28.t: "Advisory Battalions"
 men.29.a: "驰骋自如。"
 men.29.d: "While the Mengjiang National Army is descended from the once-valiant cavalry armies of the Khans, modern warfare has long supplanted the role of the horse on the battlefield. As seen multiple times in the Great War and the Greater East Asian War, cavalry has faltered to the advent of artillery and machine guns... except in specific circumstances.\n\nIn the far-flung deserts of Mongolia and Western China, the horse has still kept its usefulness and importance in the harsh environment. Tsedenbal's horse cavalry and mounted infantry have proven to be scarily effective in wearing down the Mengjiang National Army, be it through hit-and-run raids or reconnaissance missions which lay traps for the Prince's army. Through our experience in Manchukuo and Gansu, elements of the North China Area Army have also proven themselves adept in cavalry tactics.\n\nIt would be wise for us to loan cavalry vedettes to the Prince's army, especially if they would be augmented by our superior airpower and electronics capabilities. What the sand dune hinders, the aircraft will overcome - what the rainstorm hinders, the horse troop will overcome."
 men.29.t: "骑兵巡逻队"
 men.3.a: "蒙古的王需要重回他的宝座。"
 men.3.d: "在一次决定性的战役之后，我们的军队在大草原上再次取得胜利，蒙古的秩序再度恢复了。然而现在又有个新的问题：之前的蒙疆该怎么办？德王如果听说自己的威信不会被再度确立，一定会变得震惊而愤怒，许多人认为那样会使糟糕的局面进一步恶化。当然，也有人已经对德王失去了信心，并声称他的回归意味着十年后今天这场战争的重演。今后，蒙疆的问题需要我们用一些新的手段来解决。"
 men.3.t: "蒙古的命运"
 men.30.a: "Modernity is in our favour."
 men.30.d: "The relative unimportance of Northwestern China in the greater strategic picture has led to our forces neglecting needs both material and non-material for our allies in Mengjiang and the Hui State. While previously deemed to be a necessary sacrifice in favour of concentrating our efforts in the Pacific and China proper, it has come to haunt us in the wake of Tsedenbal's rebellion.\n\nWhile an extra diversion of cavalry and horse transport units has made it easier for us to supply Prince De's forces in the field, we should focus on gaining an advantage over Tsedenbal's forces through our superior technological capabilities. Namely, extending the Kalgan rail network would do wonders to supplying Mengjiang's cities and towns, even beyond Kalgan itself. However, construction might be costly - considering the harshness of the terrain.\n\nWe can only hope that the Kalgan rail network's expansion would be a welcome addition to our ever-increasing investment in the Northeast, and would aid us in defeating Tsedenbal's rebellion even quicker - there are more pressing needs for our construction companies and resources."
 men.30.t: "扩展喀拉干铁路"
 men.31.a: "United as one."
 men.31.d: "Prince De's administration stands on a platform of Mongolian nationalism guided by the benevolent Japanese hand, but anyone who looks at Mengjiang for more than five seconds knows that the concept is built upon a throne of lies. While this approach would have worked in the 1930s, when our influence over Asia was still in flux, it has been nearly 30 years since the establishment of Mengjiang - and the Mongol populace has not remained idle.\n\nIt would be wise for us to realign our dealings with Prince De to unite the mixed loyalties of the princelings under his purview - as an anti-Bolshevik front upholding the noble traditions of the Mongol nation, though ostensibly still under the firm, guiding hand of the Japanese. With this in mind, the North China Area Army has proposed that an All-Mongolian Conference of Unity is to be held in Beijing - neutral, safe ground away from the front lines, with the idea of forming a pan-Mongolian, anti Bolshevik front against Tsedenbal's forces.\n\nThose in attendance would be the high-ranking commanders of the Kwantung Army and the North China Area Army, as well as the Minister of Finance, Kanemaru Shin. With luck, we would be able to unite the disparate Mongol princes of the northwest, and make a concrete effort to ensure Tsedenbal's rebellion does not threaten our supremacy in the steppes."
 men.31.t: "The Northwestern Conference"
 men.32.a: "The Northwest is silent."
 men.32.d: "In the far northwest of our Empire, what was once a relatively quiet backwater has erupted into open rebellion. The Tsagaan Mongol Ulus, led by former Bolshevik Yumjaagiin Tsedenbal, has seized control of the far west from Prince Demchugdongrub's Mengjiang National Army. While a minor rebellion at present, losing Mongolia would mean losing our reaches into the far north and Central Asia, as well as threatening supply lines and our positions in Northern China. Should the war not go in our favour however, the hawks in the Imperial Japanese Army would have a sufficient warchest to knock down the standing of our administration.\n\nThe Japanese have sent sorties of Kenpeitai Agents across the border to keep a watchful eye over the recently recovered lands of our Empire. They arrived in great trails of heavy-duty military vehicles chugging across the Mongolian frontiers, secluding themselves from the National Army's high command. They were here to 'handle' communist guerrillas behind the frontline whilst we focused on the enemy, we were told by Tokyo, but their sinister appearance signaled as if they were here for much more than partisans. Unloading truckloads of equipment and arms, the uniformed agents drew particular attention from our own men who were apprehensive of such an unsettling presence.\n\nTheir silence was foreboding, as it seemed they refused to speak to anyone other than who they were permitted to. We thank them and shake their hands for their service now, but with whispers and suspicion of ulterior motives, must remain aware of their praetorian position within our borders."
 men.32.t: "Japan Sends Kenpeitai Agents to Do Rearguard Operations"
 men.4.a: "一切本就应当如此。"
 men.4.d: "今天，我们取得了胜利！叛乱已经结束了，蒙古已经得救了。现在正在进行的就只有最后的清理工作，随着秩序的恢复，所有来自日本的额外援助也将撤出。尽管在蒙古这样的地方，战斗从未真正停止，但很显然，和平的重现已经是板上钉钉的事实了：天空再也不会响起雷鸣般的炸弹爆炸声，地面再也不会因马蹄的踏过而颤抖。德王松了口气，蒙古的骑士们再一次紧随其后。"
 men.4.t: "王公大获全胜！"
 men.5.a: "早该如此了。"
 men.5.d: "德穆楚克栋鲁普王，以他那伟大的智慧，在很久以前就为蒙古设想了一个更好、更强大、更团结的未来。为了这个宏伟的目标，他已经辛苦奋斗了数十年，蒙古的人民，也出于普遍的忠诚与德王力量的正义而与他站在一边。而唯一的例外，是那些被孤立的、生活在共产赤祸之下的蒙古人。在蒙古的西方，他们散布着他们的污秽，对自己合法的统治者视而不见。就在最近，我们还刚刚与一位共军将军领导的部队交过手。不过现在我们终于团结起来了，我们终于可以解放那些生活在人民革命委员会统治之下的人们，从而让我们的人民真正团结起来了。"
 men.5.t: "我们的合法领土"
 men.6.a: "Summon the nobles, crush the traitors!"
 men.6.d: "The history of the Mongolian steppes has always revolved around division and conflict, teaching its people a lesson—unity is strength. From the earliest Xiongnu Confederation to the world-renowned Mongol Empire in 1206, it has been proven that when the Mongol tribes gather their strength and unite as one, they are unstoppable. Yet, time and again, we fall into internal strife, becoming slaves to the Chinese. In the Great War, with the help of our great leader and Japanese friends, Mongolia once again united its people. Following in the footsteps of Modu Chanyu and Genghis Khan, for the first time in centuries, he has united the people in his name, although not everyone agrees, he seems to have successfully earned his place among Mongolia's great rulers.\n\nBut today, the beautiful Mongolian steppes have once again seen division and bloodshed. Just a few weeks ago, bandits and Communist rebels swept across the Mongolian plains, catching our armed forces off guard and once again dividing our people. With a combination of luck and cunning, these bandits have gained the upper hand, even occupying our capital, Urga, which the Reds call 'Ulaanbaatar.' This cannot be tolerated! Mongolians will no longer fight their brotherly kin with Chinese knives in their backs. Our great Prince Demchugdongrub has called upon every true Mongolian to defend their country and monarch with the courage and passion of a thousand men. We will defeat these bandits, liberate Khüree from their hands, and show these foolish traitors the price of betrayal."
 men.6.t: "乌兰巴托叛乱"
 men.7.a: "Cowards!"
 men.7.d: "Ulaanbaatar has been engulfed in death and destruction! Those cowardly Japanese, knowing we lack air defenses, have begun shamelessly bombing our troops and people. Without honor, the Japanese, supported by their government, are terrorizing the innocent and even attacking defenseless civilians. Their jets know they have nothing to fear from our swords and guns, boldly diving over Ulaanbaatar, dropping bombs and missiles on our roads and buildings. While the common people are frightened out of their wits, our troops suffer even more. Bombs and bullets from the sky slaughter our warriors, reaping the lives of those with no place to hide or flee across the vast Mongolian plains. This is no war, no battle; it is shameful murder."
 men.7.t: "Bombs from Japan!"
 men.8.a: "理应如此。"
 men.8.d: "Our communications with Prince Demchugdongrub and our own deployed pilots have painted a beautiful picture of what is happening on the Mongolian steppes. Under modern airpower, Mongolian loyalists, and our material support, the fate of the Mongolian rebels was sealed long ago. It seems that soon, the Mongolian steppes will be safe once more, and peace will return to Asia."
 men.8.t: "A Swift War"
 men.9.a: "We must take control of the situation."
 men.9.b: "Enough, we will not waste more resources on these clowns."
 men.9.d: "It is clear that the situation in Mongolia is not developing in Japan's favor. The Prince has failed to seize the initiative or quell the Red rebel uprising, squandering our generous aid. As the war drags on, we can no longer see any benefit, and our generals are gradually losing patience with our Mongolian allies. We must change our current policy, either by intervening directly to end the uprising or by simply washing our hands of the matter."
 men.9.t: "The War Continues"
