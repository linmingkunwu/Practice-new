 MAN_Fort_Lv1: "满洲守备：玉碎"
 MAN_Fort_Lv1_desc: "我们在华北的努力最终还是付诸东流，我们不得不在满洲进行最后一战！在这帝国的心脏，我们宁为玉碎，寸土必争！"
 MAN_Fort_Lv2: "满洲守备：奋迅"
 MAN_Fort_Lv2_desc: "最黑暗的时刻到来了，为了不让千万万帝国志士们的血白流，我们必须不惜一切代价，誓死捍卫满洲！"
 MAN_Fort_Lv3: "满洲守备：瓦全"
 MAN_Fort_Lv3_desc: "核武器已经准备就绪，尽管山河破碎，新秩序已然乱亡，帝国终是转危为安。"
