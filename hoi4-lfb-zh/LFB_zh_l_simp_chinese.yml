 alertness: "日本帝国的警戒度"
 alertness_desc: "日本帝国本身矛盾丛生且财政困难，一般情况下不会劳师远征进攻偏远的西北根据地，征服西北的支出远远大于征服西北能获得的收入。而红色政权目前仍需要在阴影中发展，不能过于展示我们的力量，以避免日本帝国对我们的力量产生怀疑并不惜血本也要铲除根据地。\n日本帝国当前的警戒度是§R[?alertness]§!§R\n当日本的警戒度大于100时，他们将会我们宣战§!"
 alertness_reduce_1: "日本帝国的警戒度减少1"
 ALT.1.a: "（继续）"
 ALT.1.d: "£gezifu £gezifu 有多久没打开这本笔记了？我记不得了，从布里亚特离开后就一路忙乱，每天光是写库里的日志就够麻烦了，根本没时间打开这本。\n\n£gezifu £gezifu 自从图瓦境内动身以来，我们跋涉了一周左右，终于来到了阿勒泰境内。\n\n£gezifu £gezifu 一路上并不太平，旧时的道路虽然疏于维护，但还是比从布里亚特到图瓦的草甸好走的多。真正的困难在于沿途的劫匪——他们拿着土枪的稀疏袭击自然无法对抗我们训练有素的大部队，但这里歹徒的凶险与狡猾远超我们的想象。在意识到无法与我们正面对抗之后，土匪们竟然扮作当地百姓的样子设下埋伏，专门对付我们派出探路的先遣队。幸好我即时觉察到了这个圈套，先遣队才不至于全军覆没……在交火中，几位战士只是受了点擦伤。我们一边继续行进，一边寻找当地人的帮助。\n\n£gezifu £gezifu 今天中午，传令兵给我们带来了好消息，附近有一个不小的城镇。\n\n£gezifu £gezifu 在我们到来的时候，当地人似乎并不是非常欢迎我们，一位当地有名望的神父作为代表出面迎接了我们。根据他所说，由于八十八旅的战士们一路风尘仆仆的，有人看见他们以为土匪来袭击城镇了，这才对我们如此警惕。但是在看到了华西列夫斯基的亲笔信后，他相信了我们并不是土匪。并同意为中国旅提供一些必要的食物和补给，伤员也得到了村中医生的照料。\n\n£gezifu £gezifu 谢天谢地，看起来这位老神父和当地的居民对共产党是抱有善意的，这给我们解决了不少的麻烦。但我们仍不愿过多打搅当地人的生活，于是便找了个离城镇稍远，沿着河流的位置安营扎寨……"
 ALT.1.t: "西行漫记"
 ALT.2.a: "夜深了，聚会渐入高潮……"
 ALT.2.d: "£gezifu £gezifu …于是连部决定在晚上拉一拉歌，战士们自然很积极，在夜幕降临前，一个篝火便搭建了起来。虽然我们手头的补给并不充裕，没有酒水肉食，只有白天从当地人那儿换来的面包和附近的溪水，但战士们的兴致仍旧高涨，大家围坐在一起，拉开嗓子便唱了起来。\n\n£gezifu £gezifu 《神圣的战争》，《草原骑兵歌》…战士们唱起苏联的旧军歌，在雄壮的歌声中，多日行军的疲劳一扫而空。气氛炒至热烈之时，放哨的战士带给我了一个坏消息，说有一群当地人正在向我们的驻地靠近…手上还拎着一筐筐晃荡的瓶子！他担心那是燃烧瓶……\n\n£gezifu £gezifu 我一听就懵了，白天当地人虽然说不上有多好客，却也尽其所能善待了我们这支流兵。难道这一切都是障眼法？顾不得多想，我便和哨兵一起出去了，我们在阿尔泰的最后一晚，可不能出事……\n\n£gezifu £gezifu 结果到了才发现，领头的是亚历山德拉老神父，他们手中提着的也不是什么燃烧瓶，而是正儿八经的美酒。他们听到了我们战士的歌声，循声而来，发现我们正开着宴会。但当老神父看到我们手中的水壶和黑面包后，却皱起了眉头——\n\n£gezifu £gezifu “没有好酒，你们怎么开得了宴会？” \n\n£gezifu £gezifu “可我们已经拿了你们够多的东西了…”哨兵不好意思地说道。\n\n£gezifu £gezifu “孩子…”神父的大胡子抽动着，后来我才明白他在试着咧嘴微笑。“我们有好酒，却没有饮酒的由头。拿着这个，喝了它，俄罗斯的水土将流入你的身心。不论你身在何方，上帝都将护佑你平安……”\n\n£gezifu £gezifu 我带着他们进了驻地，神父招呼着几个年轻力壮的小伙子，拉了一车的美酒与熏肉。战士们本就唱得火热，在当地人加入后，气氛更是炒上了天。大家吃着熏肉，拼着酒，士兵们吹嘘着自己一路的征战，再掏出古旧的配枪，让许多务农的小伙子看的眼睛都直了！作为连长，我厉声喝止了这种行为。老神父在一旁大咧咧地笑着。"
 ALT.2.t: "欢宴"
 ALT.3.a: "亲友啊，让我们在天堂再会！"
 ALT.3.d: "£gezifu £gezifu ……当地人的酒桶似乎深不见底，不论我们消灭掉多少，他们总能又拉出一桶新的。酒至酣处，我也情不自禁地献声唱了一首《山楂树》。酒精多少让我的声音有些走调，但谁还在乎这些？唱到一半，我想起了家乡的阿红…我们小时候常在村口的树旁捉迷藏，十几年过去，我飘荡在异国他乡，她是否已嫁作人妻？\n\n£gezifu £gezifu 在俄罗斯的最后一个夜晚，似乎比我在这里荒废的十年还要漫长。伴着辛辣的酒精，大家将酸楚的泪水咽下，不去想明天何时到来，人们就这样沉醉在今朝……\n\n£gezifu £gezifu 似是怕胡子上沾了污渍，老神父喝得很克制。手中握着挂着十字架的念珠，老神父坐在营地的一角。趁着酒精，我向他搭话道：“我们明天就要回到祖国…那将是一场严酷的战斗，我们中的许多都要葬身沙场…即便能活过明天，也一定会在某个拯救我们民族的战场上洒下鲜血…所以我放纵他们饮酒…”\n\n£gezifu £gezifu “是啊，喝吧……”转着手中的念珠，神父咧开胡须，笑道：“当你们为了穷苦人的命运而战之时，你们就是祂的士兵。当你们为了祂的事业牺牲之时，你们都上得了天堂。” \n\n£gezifu £gezifu 放下念珠，老神父端起一碗烈酒，与我碰杯。"
 ALT.3.t: "今朝酒，醉今朝"
 ALT.5.a: "或许祈祷真的有用？"
 ALT.5.d: "£gezifu £gezifu 我记下这段文字时，我们已经与新疆的同志们会合了！本以为我们是革命最后的力量，谁知党在新疆也有深厚的组织，甚至还策反了一些军阀部队！根本没有恰当的文字，可以形容我们现在的心情！\n\n£gezifu £gezifu ……就在今早，当一夜欢歌散去之时，战士们还是做足了战备，准备离开阿勒泰，前往北疆。不知是否是昨夜欢乐的氛围延续到了今天，当我们离开俄罗斯时，我竟感到了留恋与不舍，尽管这里兵荒马乱，满目疮痍，但我早已将这里当作了第二故乡。希望当我们归来之时，这里能再次焕发出革命的生机。\n\n£gezifu £gezifu 我们每个人都知道，前方的道路上，将会遭遇无数艰难险阻，我们早已做好了牺牲的觉悟。\n\n£gezifu £gezifu 知道了我们要离开的消息以后，许多当地人在亚历山德拉神父的带领下给我们送行。神父穿着拖地的长袍，手持十字架，站在士兵与农夫面前，庄重地念着敬辞。虽然我并不相信上帝，但此时此刻，我也希望冥冥之中的存在可以庇佑我们成功抵达故乡。\n\n£gezifu £gezifu 仪式结束后，我们便离开了这个宁静的镇子。向南行进三四日，我们便抵达了祖国的边境。中俄边境形同虚设，没有边防站也没有巡逻队，只有古老的界碑向我们诉说着回到祖国的现实。进入阿勒泰后，我们一直用短波电台呼叫着附近的中国定居点……\n\n£gezifu £gezifu 两日后，我们等来了意外之喜——共产党率领的起义部队，就聚集在阿勒泰附近！他们已经和我们的先遣队的联络员取得了联系……"
 ALT.5.t: "归乡"
 America_KMT: "中华民国流亡政府"
 America_KMT_tt: "\n\n£GFX_modifiers_America_KMT_icon\n\n\n\n旭日的阴影仍笼罩着中国大地，可\"委员长\"的名号却早已在大洋彼岸冷却。那些自诩为所谓\"继承者\"、\"解放者\"的人，只不过是蜷缩在华盛顿的阴影里的丧家之犬，啃食着早已腐朽的权力残羹。由钢铁与谎言铸就的\"流亡政府\"，不过是苟延残喘的空壳；那些曾响彻云霄的\"反攻\"口号，早已沦为哄骗残部的催眠曲。\n\n被充分解构的\"三民主义\"口号仍时不时盘旋在南京城上空——但那不过是供人耻笑的历史余烬而已。\n\n\n\n\n\n\n    £GFX_modifiers_KMT_sun_ke        £GFX_modifiers_KMT_song_mei_ling  \n\n\n\n\n\n\n £gezifu"
 An_economy_of_exhaustion_and_fishing: "竭泽而渔的经济"
 An_economy_of_exhaustion_and_fishing_desc: "中国的军阀历来都有着“优良”的发展经济的传统。在三十年代的四川，就有军阀把税收到了1991年。而青海马家发展经济的力度与四川军阀的发展经济力度类似。\n\n马家以十年为单位的不断扩张自己的家族产业，残酷的盘剥其治下的群众，不计后果的攫取利益导致了西北成千上万的小生产者的破产，而无止境的征兵则使得务农人口急剧减少。\n\n随着湟中事业有限公司的成立，意味着马家的垄断产业彻底形成，整个青海在马家的盘剥下陷入无尽的痛苦。隐藏在“西北繁荣”背后的，是马家鼓囊囊的腰包，还有青海濒临崩溃的经济。"
 Another_Victory: "又一次胜利"
 Another_Victory_desc: "在无数次政治与经济的博弈中，我们再次取得了阶段性的胜利，这证明了我们路线的正确性。"
 Anti_Communist_Conference: "新疆反共联军会议"
 Anti_Japanese_guerrilla_army: "西北抗日游击军"
 Anti_Japanese_guerrilla_army_desc: "占领兰州并不是剿匪事业的终点，这只不过是剿匪事业的一个重要的拦路石而已，即使的马家军阀已经撤入西宁，在兰州乃至其他西北方面军的占领区内，到处都是奔走的游击队，到处都是不服皇军的暴民。\n\n更令西北军此刻的形势雪上加霜的是，不仅仅是兰州各地涌现了本土的游击队，在陕西西北，那些旧日红色幽灵的游击队同样活跃了起来……游击队掠夺补给线以壮大游击队自身，他们的力量也在不断强大……"
 Ashgabad_Tomb_Watcher: "守墓人"
 beijiangjieshao_text: "新疆最北端耸立着壮观的阿尔泰山脉。群山隔绝了西伯利亚的寒气与季风，却并未阻止苏联的长期渗透，在民族压迫的背景下，北疆成为了革命的温床。但最终孕育而出的三区革命却因苏联的崩溃而成为绝唱。\n\n这里的人民是新政权最早的支持者，但来自西伯利亚匪帮频繁的袭扰始终是此地的严重威胁。"
