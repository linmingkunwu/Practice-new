 XIK_jiangbingwen: "蒋鼎文"
 XIK_jiangbingwen_desc: "§Y中华民国第一战区司令长官§!\n§Y国民革命军陆军二级上将§!\n§F------------§!\n军人并非只有拳拳报国之心，事实上，在旧国民革命军中，多的是如蒋鼎文一般趋炎附势，狼心狗行之徒。作为曾与蒋介石一道，追随孙中山北伐的元老，蒋鼎文曾在对抗军阀的战场上屡建奇功，以战术灵活，敢于冒险著称。中原大战时，他更是发扬机动性的优势，左冲右突，迂回反转，“飞将军”之名响彻全国……\n\n历史上，不乏功勋傍身之人，因得些怪癖反倒落下骂名；蒋鼎文的一世英名（如果有的话）则毁得特别纯粹——30年代，随着全国战乱平息，他开始沉迷于赌博酗酒，抗战爆发后，他任陕西省主席。作为西北实质上的一把手，坐镇抗敌前线，他却大肆敛财，徇私枉法，吃喝嫖赌，连一点心思都不愿放在作战上。\n\n蒋鼎文的玩忽职守，最终导致了前线的溃败，他被左迁至河南，却好巧不巧地碰上日军发起的总攻。国民军兵败如山倒，一个月内连丢38城，损失20余万，蒋鼎文逃回重庆，被忍无可忍的蒋介石革职查办，留后督察……但日本人都打过来了，再不跑哪还有“后”啊！\n\n在重庆燃烧的战火中，“飞将军”再次展翅翱翔，带着所剩无几的残部，逃到西康这片无人问津的角落。国破家亡，数百万人的牺牲化为乌有，此情此景下，他是否有所改变？\n\n只消看他滑腻的笑容，圆润的肚皮，还有裤腰带下的疱疹，便能辨析一二！"
 XIK_liuwenhui_desc: "§Y西康省政府主席§!\n§Y国民革命军陆军二级上将§!\n§F------------§!\n如同此刻西康的许多将领，刘文辉也来自四川，更曾在天府之国的残酷厮杀中脱颖而出。在协助侄儿刘湘（比他大七岁）粉碎了杨森的势力后，刘文辉的权势达到极盛——雄踞半个四川，占领70多个富庶的县城，手下将兵多达十二万。理论上，他们刘家共分蜀地，应该没有什么大的问题，但无论血缘，一山总容不得二虎，二刘之间嫌隙渐生，最后竟到不可调和的地步。刘文辉实力虽强，但姜还是老的辣，刘湘不仅设计分化拉拢了刘文辉的部将，更组建了针对他的“包围网”，拉拢川东，川北的军阀一齐进军成都。数周抵抗后，刘文辉只能北逃，退往雅安，希冀能沿河防守，但此时的“安川军”声势极大，而刘文辉的基业早已土崩瓦解，他的手下或叛或逃，已再无抵抗的余力。\n\n不知是念及亲情，抑或是对失败者的嘲弄，刘湘放了刘文辉一条命，并向中央推荐他主政西康——这片民族杂居，治安混乱的是非之地。刘文辉早已失去了地盘，根本容不得挑拣，便就此上任。任上，他勤勤恳恳，礼佛，治理，兴教化，总算是把此处经营了起来。刘文辉本以为自己能偏安一隅，本分地积攒势力，但1935年，红军来了。在蒋委员长急电催促之下，刘文辉颤巍巍地率部守住了地形要冲，本以为占尽天时地利高枕无忧，结果大渡河，泸定桥皆被红军突破，自己所部损失惨重。\n\n多年来，刘文辉收起了锋芒，开始夹着尾巴做人，勤勤恳恳做事。他对南京政权虚与委蛇，却也不吝共产党递来的橄榄枝，虽说不上左右逢源，但也在西康这片土地上站稳了脚跟。\n\n可惜，上天似乎要一遍又一遍地夺走给予他的东西——随着抗战爆发，国民政府不得不西迁，西康不再是天高皇帝远的边地，而是“天子”近畿，自然容不得刘文辉只手遮天。看着陆续有隶属中央军的军官被委任过来，刘文辉无可奈何，只能不断将权力交出…直到重庆打败，溃兵们如同曾经的他一样西逃，刘文辉没有足够的能力，更缺乏野心，去争抢权力，收编溃退的部队，他早已厌倦了…\n\n如今，刘文辉独坐在西康省主席的板凳上，席下人头攒动，却无一人在乎他的命运……"
 XIK_NRA: "西康省"
 XIK_NRA_ADJ: "西康"
 XIK_NRA_DEF: "西康省"
 XIK_Shadow_Of_Retreat: "大溃退的阴影"
 XIK_Shadow_Of_Retreat_desc: "高原的恶劣环境，让久在平原作战的国民革命军残部苦不堪言，漫长的溃退之路夺走了成百上千的战士，身后是手刃战友同胞的日寇，前方是一望无际的白雪皑皑。\n\n即使时间不断流逝，在西康军的心中，雪山上仿佛已有神明随时准备惩罚他们的莽撞与突然打扰，§x今天死去的是最好的兄弟，明天也许就是自己。§!"
