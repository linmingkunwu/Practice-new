 COX_mobilize_peasants_tt: "兰州的父老乡亲们会来投奔我们，但这样的明显的行动将会降低我方渗透"
 COX_Mobilize_Xinjiang_Herdsman: "动员新疆的牧民"
 COX_Mobilize_Xinjiang_Herdsman_desc: "受制于有限的干部数量，我们在巩固阿勒泰周边地区的治理时遭遇到了意料之中的困难。与富庶的东疆汉人聚居区不同，迪化军政府对贫瘠的北疆实行了可谓相当粗放的管理，被俘虏的乡长只能报出几个包税地主的名字，对自己治下有几个村庄则一无所知，更不要说当地的农业情况了。另一方面，新疆支部的老同志们长期从事部队策反的工作，基本没有离开过数个中心城镇，对于广袤的农业地区也束手无策。\n\n在这种情况下，我们必须以更快的速度争取新疆牧民的支持——他们比我们更了解当地的情况，无论是恢复经济秩序、稳定局势，还是在日后培养本土干部，我们都需要他们的帮助。"
 COX_more_cadre: "更多的干部"
 COX_Nanking_Negotiation: "占位符"
 COX_Nanking_Negotiation_category: "§z南§!§V京§!谈判"
 COX_Nanking_Negotiation_category_desc: "\n£GFX_texticon_LFB\n\n\n\n\n经历了艰苦卓绝的抗战斗争，中国终于重新获得了自由；然而，两党暂时放下的争执与分歧，此刻又不得不得摆上台面来。是走向§z联§!§V合§!，还是分道扬镳？一切，都要由这场会议来决定。\n\n和谈中，不同决议会影响意向值的增减。双方必须同时要达到§G较为愿意§!及以上的等级，和谈才能成功；如果某一方的意向值达到了较低的程度，将会引发§R一些不可预计的后果§!……\n\n"
 COX_Nanking_Negotiation_tt: "\n一、对于日伪战犯处理，[GET_NN_choice_1]\n二、[GET_NN_choice_2]\n三、[GET_NN_choice_3]\n四、[GET_NN_choice_4]"
 COX_Nanking_Negotiations_Failed_flag: "南京谈判已经失败"
 COX_National_Assembly: "国民大会"
 COX_National_Assembly_desc: "§Y“可怖疮伤的绷带”§!\n--------------\n时至二十世纪末，没有人会否认——此时的中国已是个濒死的巨人，千年前的繁华早已不在；百年间的战火几乎放干了她的鲜血。当这个民族终于挣脱了束缚在身上的锁链，步履蹒跚地站立于世界民族之林时，浑身上下早已千疮百孔。外有强敌虎视眈眈，国内矛盾更日益尖锐——自由的中国顽强伫立，但汩汩鲜血正从伤口涌出，此刻，她需要的不是精细地缝合，而是粗暴的包扎。先克服失血的风险，再论其他！\n\n国民大会，便是这样一段被寄予厚望的薄纱。它残破、粗粝，因它建立在各党派的妥协，而不是某种愿景之上。尽管包扎之后，许多伤口仍渗着血；尽管许多人对它的存在颇有微词，但它仍将中国的各个部分绑在了一起，不至于四分五裂，以至于再次给邻家的豺狗可乘之机。"
 COX_National_Protection_Army_In_Nanjing: "南京的护国军"
 COX_National_Protection_Army_In_Nanjing_desc: "就在我军在西北发起攻势的同时，护国军的军人正在广州与长江沿岸集结，准备与日寇展开最后的决战。虽然在护国军中，也有为数不少的共产党员，双方的高层也通过西南党中央的斡旋，有过几次交流，但两军毕竟山水相隔，战士们都素未谋面，能否在两线配合作战，能否避免在日后的冲突，都是未知数。\n\n弱小的中国若想战胜强敌，就必须摒弃一切嫌隙，通力合作。\n\n我们应当派出正式的代表前往南京，共襄抗日复国之大业，也让中国，乃至全东亚的人民知道：国共两党的再一次合作，必将结成整个民族的坚墙。"
 COX_NC_MEN_revolution: "蒙古革命"
 COX_NC_MEN_revolution_desc: "\n\n\n\n\n\n\n\n\n日本对亚洲各国压迫的形式迥异，但残虐程度却有过之而无不及。十年前，在蒙古高原西侧，生性自由的当地人民曾掀起过规模浩大的抵抗；但彼时的日寇正值如日中天，而蒙古人民军除了图瓦的俄罗斯友军之外别无其他增援。在那时，蒙人阵几乎被完全歼灭，但即便如此，草原上的抵抗却从未终止。人民军的残部在边陲之地一边放牧牛羊，一边袭扰敌军后方，一度给日寇造成了不小的压力；但随时间推移，日军逐渐巩固了防御，在他们直升机部队日夜不停的巡逻下，蒙人阵的活动范围也被压制在了边境的贫瘠之地。\n现如今，随着中原战端再起，日军的注意力也从蒙古转移，这给了我们蒙古同志们一个宝贵的机会。尽管我们的大部队难以直接参与在蒙古草原的战斗，我们仍然可以尽力协助蒙古本土的同志，他们将开辟另一条战线，牵制伪政权的兵力，并成为我们北方战线上珍贵的盟友。\n由于地势险峻，交通不便，我们并无法获取有关当地局势的详细信息；尽管如此，我们还是通过零散的渠道拼凑出现状的概况：\n\n蒙人阵现在[Get_LFB_NC_MEN_state]"
 COX_negotiation_end: "南京谈判已经和平结束"
 COX_Neighborhood_In_Fire: "邻家起火"
 COX_Neighborhood_In_Fire_desc: "据边防部队报告，最近越来越多难民模样的人穿过马家军和我们的边界来到新疆。这种情况值得我们格外警觉。\n\n近年来日军与马家关系逐渐恶化，西北军对马家地界的侵扰时有发生。而马家军以抗日救亡为名的横征暴敛进一步激化了各种矛盾，逃往新疆的难民数量日渐增长已成常态。\n\n但最近的逃难潮已经到了不能忽视的地步。这暗示了一个令人担忧的事实——马家政权未能成功凝聚民力抵抗日寇，反而正在逐渐失去对各地的控制。\n\n毫无疑问，一旦日军的铁蹄踏足新疆边境，那一切都将暴露在旭日的阴影下。\n\n§R我们必须开始行动了§!。"
 COX_New_army_new_look: "新军队，新面貌"
 COX_New_army_new_look_tt: "我们将§G武装起§!一批§Y精锐部队§!"
 COX_New_Tactics: "新战术"
 COX_New_Tactics_desc: "距离伟大的抗日战争已有二十余年，在这二十年里，日军的武器装备在不断推陈出新，其作战理念，也在与世界其他列强的交锋中不断革新。我们面对的敌人已经改头换面。共产党人从来与迂腐守旧无缘，唯有与时俱进，才能确保我们的胜利不以大量的伤亡为代价。\n\n如何处理复合装甲的坦克？如何击毁低空巡飞的直升机？如何应对火力更猛的阵地碉楼?\n\n战争的形态已经发生了翻天覆地的变革，我们唯有发挥共产党人一贯的作风——学习敌人的战法，钻研透彻，然后将其击败。"
 COX_news_event.2.a: "白日再度黯淡一分。"
 COX_news_event.2.d: "在远离人烟的中国西北，一场旨在征讨民国旧日幽灵的血腥的战争仍在继续。\n一开始，帝国远征军很快征服了兰州，并击毙了匪首马步芳。帝国军队本以为这又是一场唾手可得的胜利，但当地人民的抵抗远远超出了日军的估计。在兰州城之外的广大荒原中，日军的巡逻队不断忍受着来自各种游击队的袭扰，又因为路途遥远，东京发来的补给不得不遭到了各种损耗，变得捉襟见肘。\n缺枪少弹的日军，对上意志坚定的中国游击队，这场发生在西北的冲突越来越像是上一场战争在二十年后的延续。但在最近的一次扫荡中，日军终于暂时击败了游击队的主力，辻政信立刻集结重兵，向着西宁进军。在这位疯狗将军看来，西宁之战，将成为这场血腥战争的转折点，帝国的又一场大胜触手可及。而马步芳之子——马继援已经重整了青海的残兵，在西宁构建了顽强的防线，抵御了日军的攻势，而就在日军止步于西宁脚下时，那些游击队又发动了大规模的袭击。在补给线被完全切断的风险面前，辻政信只得命令部队撤回兰州，在西宁城下，帝国军遭遇了屈辱的大败。"
 COX_news_event.2.t: "[Get_newspaper_header]西宁之战"
 COX_news_event.3.a: "他们的陨落就如崛起般迅速。"
 COX_news_event.3.d: "今日凌晨五时，本应被黑暗笼罩的中国大陆忽然迸发出剧烈的光亮，这光芒盖过了东京湾升起的朝阳，令战壕中瑟瑟发抖的日军难以直视其光辉。正当日本科学家试图将其解释为陨石撞击，极光现象或中国的核武试验时，这异象唐突地消失了。随之一同消失的还有与日军在朝鲜前线对峙的百万大军。\n自中国共产党突然从新疆杀出，只过去了数月时间，中国军队就踏破了北京，攻入南京，将日本势力近乎驱逐出了大陆。在鸭绿江畔，本应继续进攻的他们却停下了步伐。接着，每个中国人脑中都听到了一个湘西人坚定的口音——“中华人民共和国，中央人民政府，今天，成立了！”\n全世界屏息凝神，静待着这个突然成立的“人民共和国”会对政治格局有何影响。但伴随着今日的强光，强大的红军全部消失了，与之一同消失的还有共产党部分领导层。没有人知道新生的共和国内发生了什么，也不清楚他们将如何面对这场危机。"
 COX_news_event.3.t: "[Get_newspaper_header]始源的终末"
 COX_news_event.4.a: "全东亚的命运将在某种存在的目光下走向黑暗，抑或是光明。"
 COX_news_event.4.d: "在中国发生的一切奇怪的现象都因一个神秘的军阀宣布的惊人消息而截止：一支驻扎在中国新疆地区的沙漠上的共产党军队于今日郑重宣布：其不再承认中国对日本帝国的和平条约，并将联合中国地区的其他有意者重启针对日本帝国的任何战争手段。该军阀同样号召亚洲大陆上所有受日本压制的民族与他们协同进攻日本。换句话说，这场战争所针对的除了中国，还有东亚所有其他被日本控制的地区。\n在日本早已赢得了中日战争的当下，我们无法确定一个盘踞在荒漠上的军阀能有何作为。然而有消息报告称，自新疆地区出现的军队以不合常理的力量击碎了刚刚步往前线的蒙疆国军队，而该军阀新上台的控制者，正是先前传闻中，在中国人梦里出现的老人。结合之前发生的种种奇异的事情，我们只能这样猜测："
 COX_news_event.4.t: "[Get_newspaper_header]是为永恒"
 COX_news_event.5.a: "有什么东西要来了？"
 COX_news_event.5.d: "先是中国南部连续一周不断的雷暴天气，又是日本驻中国西北地区的武装拓荒团神秘失踪。中国地区开始出现了越来越多匪夷所思的怪事。然而日本帝国政府却在此时宣布“日本与日本在中国地区的盟友皆未发现任何异常。”\n然而同样有流言称，中国地区的大部分人在睡梦中不一而同地见到了一位长着痣的慈祥老者。尽管这种流言的真实性几乎为零，但该流言确实遍布于中国的几乎所有地区。因此，这引起了全球范围内奇幻爱好者的讨论。"
 COX_news_event.5.t: "[Get_newspaper_header]惊雷前梦"
 COX_news_event.6.a: "跟随着苏赫巴托尔，在欢呼声中将敌人埋葬！"
 COX_news_event.6.d: "东亚陷入紧张局势已有数月之久，从东京到柏林，各地都在屏息凝神地静待共荣圈的变故。而近日，沉寂已久的蒙古高原上传出一则消息：长久以来一直在蒙古草原西部抵抗的蒙古人民军正式开始向东进军，宣布将解放蒙古全境。在此之前，外界普遍认为蒙古人民共和国在五十年代就已经被共荣圈彻底消灭。没有人知道这支所谓的“蒙古人民军”是如何在荒凉的蒙古高原西部坚持至今的，但唯一能确定的是，这支势力持有坚定的反日立场，并且极有可能收到了远东新生的苏维埃政权或中国西部共产主义势力的支持。\n东京的新闻发言人每天都在重复着相同的谴责措辞，却迟迟不见日军对蒙疆的实质性支援——在东亚的战事早已令旭日帝国焦头烂额，无暇顾及蒙疆政府。而随着新的一轮动荡再度席卷蒙古，这片古老的草原也许将再次迎来新的主人……"
