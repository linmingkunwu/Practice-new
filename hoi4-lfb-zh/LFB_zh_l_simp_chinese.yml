 COX_integration_cost_power_decrease1_tt: "This will §Yslightly§! reduce the §Opolitical points§! required to integrate the territory."
 COX_integration_cost_power_decrease2_tt: "This will §Ymoderately§! reduce the §Opolitical points§! required to integrate the territory."
 COX_integration_cost_power_decrease3_tt: "This will §Ygreatly§! reduce the §Opolitical points§! required to integrate the territory."
 COX_integration_limitation_sik_unlock_tt: "§x现在我们将能够整合新疆根据地的领土§!"
 COX_integration_limitation_tt: "§BOnly after achieving a stage victory in socialist construction in the region can we begin§!§Yterritorial integration§!"
 COX_Intellectual_youth_go_to_the_countryside: "上山下乡"
 COX_interim_constiution_law: "£GFX_COX_interim_constiution 《暂行宪法》"
 COX_interim_constiution_law_desc: "“共和国为中国人民所有，一切权力属于人民。”\n\n“南京谈判”的顺利结束宣告了§x新§!§z中国§!§F的成立，在扫除了§e日本§!影响后，中国人民终于得以在这部新编的宪法中畅想国家的未来了。自戊戌变法以来，中国逐步迈向现代化，已逾大半个世纪，期间有无数思潮在这片古老的土地上生根，碰撞，交融，这部宪法或许就是这一进程的最佳体现。\n\n每一条款都容纳了不同的愿景，每一章程都是妥协的产物，其内容本身也不乏模糊不清，甚至自相矛盾之处。许多人都担忧这样一部面目全非的宪法能否履行其职能，但更多的人在额手称庆——毕竟自辛亥革命以来这么多年，终于有了一部看起来像样的宪法啊！"
 COX_Introduction_Of_Industrial_Manufacturing_Experience: "引入工业生产经验"
 COX_Introduction_Of_Industrial_Manufacturing_Experience_desc: "随着工厂的重新运转，一个问题也就此显现。过去盛世才政权并不注重统一工业制品标准的制定，只是根据政治投机的对象引入对应的工业，使得在现今的根据地中，苏制与日制设备都占有相当的比重。新旧生产标准的混用，导致产品的质量与规格参差不齐，更严重影响了生产安全。这在以前生产力低下时微不足道，但随着工业区域的扩展与工厂的扩建，我们急需统一所有的生产流程。因此，最快速的方法是，向中西伯利亚地区至全中亚地区寻找愿意合作的政权引入生产经验。苏联西伯利亚工业区的管理经验将有效的增加生产效率，同时保障工人们的生产安全。"
 COX_Iron_Red_Guards: "赤卫如钢"
 COX_Iron_Red_Guards_desc: "新中国建立后，红军原有的军事指挥体系显然已经不适应当前全国山河一片红的局势，也势必会拖累红军完成其保卫人民群众生产生活的新任务。\n\n建立一个全国范围内总的军事指挥架构已经是势在必行，按照地理特点以及历史沿革。全国将会被分成五大军区，方便中央抓总指挥统一调动，同时军队的指挥机构也将充分地与当地政府协调合作。在新解放区，民兵的挑选训练工作也在紧锣密鼓的进行中。\n\n与此同时，红军新的训练操典与新的规章章程编写也会启动。多方政策并管齐下，身经百战的红军将能够更好地适应新的形新的任务，并在新的斗争中与党和人民站在一道，成为打击国内外反动派最坚固的铁拳。"
 COX_iron_wall_of_northwest: "西北铁壁"
 COX_iron_wall_of_northwest_desc: "工事已经加固，指挥已经统一，战术已经传达。虽然面对敌人铺天盖地的飞机坦克，仅凭血肉之躯，根本挡不住他们，但知道归知道，战线中却没有人后退。因为在他们身后，是中国革命的曙光，是待燎原的烈火。纵使这道铁壁终将破碎，我们也必须崩掉敌人几颗带血的牙齿。"
 COX_Joining_Force_In_Dihua: "迪化会师"
 COX_Joining_Force_In_Dihua_desc: "在基本清扫了北疆的军阀部队抵抗后，中国旅的战士们在迪化与新疆支部的老同志会面了。胜利的果实固然是甜美的，军阀统治已经结束，新疆已告解放，但要做的工作仍然还有很多——南疆的局势令人忧心，而农奴们的处境也并未随着战争的胜利有多少改善。在旭日的阴影之下，新疆根据地亟需发展。"
 COX_Joining_Force_In_Dihua.tt: "§R接下来我们将要在日本人的地盘下进行隐秘的战斗和发展，不要让警戒度大于100，否则我们的红色政权将直接面临共荣圈的威胁。§!"
 COX_land_Abolish_personal_attachment_button_tt: "[COX_land_Abolish_personal_attachment_button_tt_show]\n\n[Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_land_reform_ongoing][Is_COX_land_Abolish_personal_attachment_completed_or_cooldown][Is_COX_Liberate_The_Serf_completed][Is_COX_land_Thoroughly_investigate_Lynching_completed]"
 COX_land_Abolish_personal_attachment_button_tt1: "与中原地区的封建农村有所区别，地主、乡绅以及宗教势力不仅垄断了土地，还借此牢牢地给农民套上了枷锁；为了谋生，农民们别无选择，只能签下卖身契，世世代代做农奴；而地主和农民们都认为这理所当然。但是，时代变了！苏维埃政府不会承认任何形式的人身依附契约、高利贷契约。在赤卫队与红军的武力兜底下，卖身契将会和封建土地所有制一起化为历史的尘埃。\n\n§W这将§!§G提振§!§W我们的民众支持度，但地主群体会§!§R表示强烈不满§!§W。§!\n\n§Y改革冷却期为30天！§!"
 COX_land_Abolish_personal_attachment_button_tt2: "与中原地区的封建农村有所区别，地主、乡绅以及宗教势力不仅垄断了土地，还借此牢牢地给农民套上了枷锁；为了谋生，农民们别无选择，只能签下卖身契，世世代代做农奴；而地主和农民们都认为这理所当然。但是，时代变了！苏维埃政府不会承认任何形式的人身依附契约、高利贷契约。在赤卫队与红军的武力兜底下，卖身契将会和封建土地所有制一起化为历史的尘埃。\n\n§W这将§!§G提振§!§W我们的民众支持度，但地主群体会§!§R表示强烈不满§!§W。§!\n\n§Y改革冷却期为30天！§!"
 COX_land_Abolish_personal_attachment_text: "[COX_land_Abolish_personal_attachment_text_name]"
 COX_land_Abolish_personal_attachment_text1: "废止人身依附"
 COX_land_Abolish_personal_attachment_text2: "终结封建义务"
 COX_land_Confiscation_of_private_land_button_tt: "[COX_land_Confiscation_of_private_land_button_tt_show]\n\n[Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_land_reform_ongoing][Is_COX_land_Confiscation_of_private_land_completed_or_cooldown][Is_COX_Redistribution_Of_The_Means_Of_Production_completed][Is_COX_land_Abolish_personal_attachment_completed][Is_COX_land_Organizing_peasant_associations_completed]"
 COX_land_Confiscation_of_private_land_button_tt1: "随着群众基础的扩大和基层组织的日渐成熟，我们可以在改革条件已经成熟的地区彻底再分配土地了。对于那些劣迹斑斑的地主以及其他反动分子，我们将直接剥夺他们的土地，其子弟将受到农会的再教育。而对于少数愿意配合革命又没有过多劣迹的地主乡绅，我们会采取相对温和的手段。但是我们的原则与目标绝不会改变：土地革命结束后，地主阶级必须随着地主土地所有制的终结而在政治上灭亡。没收来的土地将会由干部、老农与农业专家们来重新估值、划分，结合面积与农业价值均分给农民。\n\n§W这将§!§G大大提振§!§W我们的民众支持度，但地主群体会§!§x表示恼怒§!§W！§!\n\n§Y改革冷却期为30天！§!"
 COX_land_Confiscation_of_private_land_text: "[COX_land_Confiscation_of_private_land_text_name]"
 COX_land_Confiscation_of_private_land_text1: "没收私有土地"
 COX_land_Crack_down_on_high_land_rent_button_tt: "[COX_land_Crack_down_on_high_land_rent_button_tt_show]\n\n[Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_land_reform_ongoing][Is_COX_land_Crack_down_on_high_land_rent_completed_or_cooldown][Is_COX_Lower_The_Rent_And_Fight_The_Local_Bully_completed]"
 COX_land_Crack_down_on_high_land_rent_button_tt1: "封建地主对劳动人民最厚颜无耻的剥削方式之一就是开出农民只有在丰收年才能赚足的高额地租，也即依靠自己对土地的垄断性占有持续性竭泽而渔。一旦歉收，走投无路的农民们只得借高利贷或者卖儿鬻女。在不适宜立刻进行激进改革的地区，苏维埃政府与农会将对地主们的土地出租行为进行严格规范，在彻底改革前先行减轻农民的负担。而对于那些连最温和的改革措施都不愿意接受的地主，只好让人民武装来使他们接受了。\n\n§W这将§!§G小幅度提振§!§W我们的民众支持度，但地主群体会§!§Y略表不满§!§W。§!\n\n§Y改革冷却期为30天！§!"
 COX_land_Crack_down_on_high_land_rent_text: "[COX_land_Crack_down_on_high_land_rent_text_name]"
 COX_land_Crack_down_on_high_land_rent_text1: "严打高额地租"
 COX_land_Organizing_peasant_associations_button_tt: "[COX_land_Organizing_peasant_associations_button_tt_show]\n\n[Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_land_reform_ongoing][Is_COX_land_Organizing_peasant_associations_completed_or_cooldown][Is_COX_Liberate_The_Serf_completed][Is_COX_land_Thoroughly_investigate_Lynching_completed]"
 COX_land_Organizing_peasant_associations_button_tt1: "土地改革的斗争不能仅仅依靠党和红军来进行。面对强大的反动势力，如果不能充分动员并团结农民，土地改革必然举步维艰，甚至党和红军也会受到反噬。为了真正将广大农民团结在党的旗帜下，同仇敌忾对抗反动势力，我们将在土改地区建立具有基层治理组织与革命组织双重性质的农会，农民们将以团结统一的面貌在党的领导下对抗压迫他们上千年的旧秩序，亲手为自己夺得解放。\n\n§W这将§!§G提振§!§W我们的民众支持度，但地主群体会§!§R表示极度不满§!§W！§!\n\n§Y改革冷却期为30天！§!"
 COX_land_Organizing_peasant_associations_text: "[COX_land_Organizing_peasant_associations_text_name]"
 COX_land_Organizing_peasant_associations_text1: "组织农会"
 COX_land_reform_finished: ""
 COX_land_reform_on_going_law: "§R1963年§!£GFX_COX_jiaobiao_LFB §e中国土地法大纲§!"
 COX_land_reform_on_going_law_desc: "£GFX_COX_jiaobiao_LFB §e《大纲》§!§Y第一条§!\n废除§r封建性及半封建性剥削§!的土地制度，实行§e耕者有其田§!的土地制度。\n1962年£GFX_COX_jiaobiao2_LFB §x新疆人民政府§!成立之初，进行了§x土地改革§!，废除 §r封建地主§!的土地占有，实行§G土地私人所有制§!，并与此同时鼓励和支持农民建立或加入§x农业公社§!实行§x集体所有制§!，确立了人民对土地这个§Y生产资料§!的所有权，这一系列措施旨在消除§r封建剥削§!，推动农业发展，践行§G新民主主义革命§!，并加快步伐进入§x集体化§!，建立§e无产阶级专政§!。£GFX_COX_jiaobiao_LFB §e《大纲》§!的通过有助于提高农民的生活水平，减少§q社会不平等§!，是根据地稳定和进步的主要活力来源之一。"
 COX_land_reform_on_going_tt: "§R无法训练部队、解散部队或编辑部队模板。§!\n"
 COX_land_reform_succeeded: "宣告土改成功"
 COX_land_reform_succeeded_law: "§x第二次土地改革§!的成果"
 COX_land_reform_succeeded_law_desc: "在20世纪30年代的£GFX_COX_jiaobiao3_LFB §m中国§!，军阀割据，混乱不堪。此时正处于£GFX_COX_jiaobiao3_LFB §m国民党§!与£GFX_COX_jiaobiao4_LFB §x中国共产党§!激烈斗争的时期。正是在这个历史背景下，£GFX_COX_jiaobiao4_LFB §x中国共产党§!领导的§e土地革命§!成为了推动中国农村社会深刻变革的重要力量。而1963年在£GFX_COX_jiaobiao2_LFB 新疆进行的第二次§e土地革命§!，通过土地的再分配以及水利的建设和封建制度打击，极大的提高了£GFX_COX_jiaobiao2_LFB §x新疆人民§!的生活地位。自此我们宣布，第二次§e土地革命§!顺利完成。革命的£GFX_COX_jiaobiao2_LFB §x红旗§!将猎猎飘扬在£GFX_COX_jiaobiao2_LFB §x新疆§！上空。"
 COX_land_Reform_through_labor_button_tt: "[COX_land_Reform_through_labor_button_tt_show]\n\n[Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_land_reform_ongoing][Is_COX_land_Reform_through_labor_completed_or_cooldown][Is_COX_Redistribution_Of_The_Means_Of_Production_completed][Is_COX_land_Confiscation_of_private_land_completed][Is_landlord_res_high_yes]"
 COX_land_Reform_through_labor_button_tt1: "在土改中，党内外相当关切的另一个问题是如何处置被捕、被公审的地主、乡绅和其他各种反动分子。虽然在党内外许多激进的同志与群众中要把所有反动分子全部枪毙的呼声很高，但是杀人从来不能真正起到改造社会的作用。那些罪无可赦的反动派自然要迎来自己的毁灭。至于那些罪不至死的，我们要用劳动人民的教育让他们洗心革面，让他们在艰辛的劳动中改造思想，最终让他们心服口服地拥护社会主义。改造他们远比枪毙对革命有益。\n\n§W只有当地主骚乱倾向降低至20%及以下时，才能执行此任务。执行后，该地区的地主势力将§!§Y不能§!§W再掀起动乱。§!"
 COX_land_Reform_through_labor_text: "[COX_land_Reform_through_labor_text_name]"
 COX_land_Reform_through_labor_text1: "劳动改造"
 COX_land_Thoroughly_investigate_Lynching_button_tt: "[COX_land_Thoroughly_investigate_Lynching_button_tt_show]\n\n[Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_land_reform_ongoing][Is_COX_land_Thoroughly_investigate_Lynching_completed_or_cooldown][Is_COX_Liberate_The_Serf_completed][Is_COX_land_Crack_down_on_high_land_rent_completed]"
 COX_land_Thoroughly_investigate_Lynching_button_tt1: "土地革命开始以来，许多群众反映乡村地区存在严重的私刑问题。长期以来，许多地头蛇利用自己在当地的财力、权势以及反动宗教势力的背书，对于那些胆敢反抗他们压迫的群众处以残酷暴虐的刑罚，构成了长久以来乡村地区的封建专制主义白色恐怖。现在，人民武装将让他们血债血偿！我们的干部将会深入乡村，彻查过去的冤案与私刑案件，赤卫队将会为调查人员与证人提供保护。一旦查实，农会就将对犯下罪行的地头蛇展开公审。所有对人民犯罪的暴徒都将受到人民的审判！\n\n§W这将§!§G提振§!§W我们的民众支持度，但地主群体会§!§Y表示不满§!§W。§!\n\n§Y改革冷却期为30天！§!"
