 COX.24.a: "§G正义永不缺席！§!"
 COX.24.d: "£gezifu £gezifu （注：包清三为中国旅驻夏合勒克乡的几个战士之一）\n\n£gezifu £gezifu 今天的一次集会，气氛已经与最早的那几次完全不同了。正如张同志所说的那样，在发展了几个积极分子后，先前畏畏缩缩的氛围便消失了，受苦受难的农奴们认识到了自己手中的力量后，便纷纷站了出来，向我们讲述了自己所遭受的种种非人虐待。\n\n£gezifu £gezifu 土提（买买提力汗贴身奴仆阿合买的弟弟）：我哥哥小时候就被卖到和加家里当了苦尔（奴仆），他买买提力汗一有不顺心就要挨打骂，从来没被当成是个人。那天，买买提力汗和加的妹妹和一个非和加的相好，我哥因为没有报告挨了打骂，就因为嘟囔了一句“不知道”，就被倒吊了三天三夜，一直吊到满嘴流血，下来就死了。杀头牛还得合计半天，杀个人就是随随便便了！\n\n£gezifu £gezifu 吐尔逊艾依（四代农奴）：二十年来，每早做完礼拜后必须向和加请安，但有一天我为了找牛，破例没有请安，中午就被叫去拳打脚踢了一顿，打得脸都肿了，下午还要接着干活。\n\n£gezifu £gezifu 哈斯木（造反农奴）：我只是看不惯买买提力汗横行霸道的做派，结果就被抓到大院里，每进一道门，他就锁一道门，直接锁到第六道门。然后他就把我吊在房梁上打，打到十个脚趾甲都脱落了，两腿都皮破血流，才把我往驴圈里一丢。他常常爬到那个夏天乘凉的亭子里骂：‘老鼠想死向猫跟前跑，看看谁厉害。我是石头，你们是核桃，我什么时候想吃，就什么时候把你们砸碎。谁要反对我，我就打死谁。’这人简直比秃鹰做派还凶恶。\n\n£gezifu £gezifu 听了乡亲们的遭遇，我感到非常愤怒。虽然语言不通，但一说到地主是怎么压迫的，我们都很感同身受。今天下午我们去抄了买买提力汗家里的法庭和监房，看着各种血淋淋的刑具，想到乡亲们亲口诉说的遭遇，我恨不得把他拨皮抽筋，但后来念他还算配合我们的工作，所以我们也只是把刑具贴上了封条，家丁们都遣散了，就此作罢。\n\n£gezifu £gezifu 但我相信，他买买提力汗坏事做尽，一定逃不掉人民的审判。"
 COX.24.t: "包清三的日记"
 COX.25.a: "§G百万农奴翻身做主的一个缩影。§!"
 COX.25.d: "£gezifu £gezifu 在夏合勒克乡，买买提力汗和加是绝对的统治者。但他们家族的历史其实并不如他们所宣称的那样长久，自然，当传说的光环褪去之后，他们的发家史也与其他地主一样不甚光彩——就在六十多年前，这里的一千七百余亩土地还属于另一个叫阿米尔汗的和加，但后来，趁着阿米尔汗去麦加朝圣的时候，买买提力汗的祖父与当地政府勾结，才夺得了这广大的土地。自此之后，不论当政的是大清皇上，国民政府，盛世才还是日本人，都无法撼动他们家族的绝对统治。\n\n£gezifu £gezifu 所以当他收到从迪化发来的，自称是中国旅的队伍的信息时，他也没怎么在意。他心里清楚，自古以来，当政的没几个动得了他们这种乡绅。于是便换了个频道，翻了个身，顺带命令揉脚的农奴再卖力些。\n\n£gezifu £gezifu 当时的他，根本没有想到，仅仅几个月之后，脚下服服帖帖的农奴会掀翻自己的统治，现在舒舒服服地吃着瓜果的他，会战战兢兢地站在绞刑架前。\n\n£gezifu £gezifu “买买提力汗，现在宣读人民法院对你的判决。”\n\n£gezifu £gezifu 吐尔逊艾依洪亮的声音将他从过去光鲜的回忆中拽回了现实。“只有安拉能够判决我，你们哪里来的权力？”\n\n£gezifu £gezifu “你这混蛋还敢提安拉？”\n\n£gezifu £gezifu “下地狱去吧！”\n\n£gezifu £gezifu 台下顿时嘈杂了起来，得到解放的农奴纷纷挥舞着自己的拳头，唾沫星子横飞，还不时飞过来一两块石头。\n\n£gezifu £gezifu “乡亲们，安静一下。”吐尔逊艾依好不容易才平息了群众的愤怒，然后接着说道，“人民法院的权力是由人民赋予的，人民创造了你衣食住行的一切，当然有审判你的权力！你被指控犯下多起杀人罪，滥用私刑罪还有克扣工资罪。你还不配合人民政府的工作，态度十分恶劣。人民法院在此判处你死刑，立刻执行！”\n\n£gezifu £gezifu 话音刚落，买买提力汗身边的两个荷枪实弹的中国旅士兵将他押送到了绞架后，抬头，透过结实的木杆，大白杨的枝叶遮掩着明明灭灭的阳光。这是他平时乘凉的地方，没想到如今竟成了他的死地。\n\n£gezifu £gezifu “犯人，你还有什么遗言吗？”\n\n£gezifu £gezifu “吐尔逊艾依，真是出息了啊。”买买提力汗转头，看向站在讲台上，神气的乡委书记，说道，“这么巴结当官的，是不是你也想把我这和加的位置抢去啊？”\n\n£gezifu £gezifu “农奴制已经被废除了。如今大家都分到了土地，我们将会一起建设美好的新生活，而在新生活中，没有你这个剥削者的位置！”\n\n£gezifu £gezifu 难道时代真的变了吗？\n\n£gezifu £gezifu 在买买提力汗呼吸停止之前，他这么想到。\n\n£gezifu £gezifu 和加的尸体本来计划悬挂一整天，但在半天之后，就遭受了各种破坏，不成人样了，于是人民委员会紧急决定提前下葬，将买买提力汗葬在了村外戈壁滩上，十分匆忙地用小石块围了一圈，就像是他对待其他惨死的农奴一般。"
 COX.25.t: "公审"
 COX.26.a: "§G我抓紧了手中的步枪，跟着队伍向前进发。§!"
 COX.26.d: "£gezifu £gezifu 库车县哈勒喀村，是南疆最为缺水的一座村子。虽然我们早已经了解了此地的缺水状况，但当我们班到达这里时，这里的现状竟到达了惨不忍睹的境地——在村外，黄沙地上歪歪扭扭地斜着些麦子，包谷之类的作物，杂草竟比主粮还要长得旺盛。村内饿殍遍地，有七八个人直接躺在地上，也不知其是否还活着。\n\n£gezifu £gezifu “根本没得水，一滴水都没得，怎么种得了地？”老农塔依尔今年已经将近70岁了，仍下田干活，但现在他只能坐在田埂上叹气，“全村就一口（坎儿井），全是他（艾依提帕下尔和加）的。我和他签了协议，我给他干活，他给我三亩地，可是他光给地，不给水。（别人都说）给点东西，给点好处，就能来水，家里送了牛，送了女儿，现在只剩下几根老骨头和一把坎土镘了，叫我怎么办？”\n\n£gezifu £gezifu 我掏出自己带着作为干粮的包谷馕，递给了老人，而队伍里会说维语的小伙子则告诉了他我们的来意。\n\n£gezifu £gezifu 他的瞳孔难以置信地缩放着，看着我的脸，又看向我们腰间挎着的步枪，最后扭过头去，看向天空，嘟囔道：“安拉啊……”\n\n£gezifu £gezifu 顺着他的视线，我也望向天空。百年来，这里几乎没有下过一滴雨，甚至连云彩都很少会飘到这里来。我想，即便在如此的环境下，人们仍旧生存了下来，凭着自己辛勤的双手，在这片大漠戈壁中开辟了如此绿洲。创造了这一切的劳动人民的手中，早已齐备了那掀翻一切的权力，怎要去祈求上天呢？我将老人拉了起来，他似乎明白了我的意思，伸出颤颤巍巍的手，指向不远处白杨树环绕着的摇曳的影子。“塞夫丁就在那里，快去吧。”\n\n£gezifu £gezifu “感谢你，老先生。”"
 COX.26.t: "水"
 COX.27.a: "§G受苦人今天要报怨仇！§!"
 COX.27.d: "£gezifu £gezifu 作为村中大户，塞夫丁的家宅和田产全部位于水渠的上游，平日里不论水量是否足够，他家的地总是村中收成最好的。他将自己的大宅也建在渠旁，除了取用生活用水的方便外，也是因为别致的景观——塞夫丁在用完早饭后，总是慢悠悠地坐到白杨下的摇椅上，摇着蒲扇，看着渠中流过的汩汩涓流，抬头便是对岸劳作的农奴，真是一幅百看不厌的田园风光啊！\n\n£gezifu £gezifu 但此时此刻，村民们正围在塞夫丁的大院门口，吵嚷着要把村口这几亩高产的地分走。\n\n£gezifu £gezifu “你们这帮野人，强盗，想抢什么就抢什么吗！还有没有法度，还有没有道德了！”而现在正破口大骂着的女人，正是塞夫丁的妻子。\n\n£gezifu £gezifu “我家世代传下来的土地，你们没有地契，也不经过仲裁，凭什么就要占去！”在人群吵嚷了差不多一上午之后，刚醒的塞夫丁才从房里走出来，“我们大家都是讲道理的人，我把大家的地契都作废了，把地也分了，工具有不足的也都补足了。我家里现在就剩七八口人，十几亩地了，你们还要什么？”\n\n£gezifu £gezifu “没有水，我们的庄稼就都要渴死了。”带头的热合买说道，“现在的水总是堪堪够浇你家的地，去年还不是这样的，乡亲们都还记得，你在村外设卡，要我们给你送礼之后再放水给你，我们是来讨说法的!”\n\n£gezifu £gezifu “大伙冷静一下，村外的卡早就撤了，而且是在中国旅的监督下撤的。现在纯粹是天公不作美，这渠今年来的水就是很少，你们就算把我的家抄了，也来不了水啊！”\n\n£gezifu £gezifu “狗屁！你以前就这么干过，在我家田旁边开渠，逼得我们没法耕种，再把我家的土地低价买去了！”一个村妇嚷道。\n\n£gezifu £gezifu “你还放出那几头耕牛，踩踏我家的地！”另一个村民接着说道，“一年的收成让毁了一半，没办法只能把地卖给你换粮食吃。”\n\n£gezifu £gezifu “当年我家浇地的时候，你家的狗腿子拿着面镜子（怀表）看，说是浇地的时间一样，但总是给你自己的地多浇，给我们的地少浇。”\n\n£gezifu £gezifu “乡亲们，这个人面兽心的混蛋，过去坏事没少干！我们现在解放了，要讨回公道！”热合买大声吼道。“你要不现在把卡撤了，要不就把你这几亩有水浇的地分给乡亲们。”\n\n£gezifu £gezifu “这……”\n\n£gezifu £gezifu 见他怔在了原地，平日里受过的欺压化作了无比的愤怒，村民们一拥而上，任凭妻子怎么撕心裂肺的阻拦，一顿拳打脚踢，将塞夫丁打死在了街头。"
 COX.27.t: "算总账"
 COX.28.a: "§G人民用最简单的坎土镘和篮子，完成了惊人的壮举。§!"
 COX.28.d: "£gezifu £gezifu 在哈勒喀村有一句俗语：“一滴水难死英雄汉。”还有一句俗语：“安拉开恩，十地五荒，安拉降灾，十地九荒。”长年累月，地主光顾着收水利租，满脑子全是怎么把水价炒的比粮价高，却放任着村里的坎儿井日渐荒废，现在终于尝到了苦果——村子里有一半以上的土地已经完全荒芜了，无法耕种，剩下的一半必须通过轮耕才能勉强保持少得可怜的收成。\n\n£gezifu £gezifu “情况非常不乐观，如果不立刻采取行动的话，哈勒喀村很有可能撑不到明年了。”\n\n£gezifu £gezifu “迪化收到，4营1班，我们会全力给予援助。对了，中央最近一次的讲话的电报稿稍后会发给你们，有空的话可以看一下。”\n\n£gezifu £gezifu “收到，通话完毕。”\n\n£gezifu £gezifu 放下电话，陈恭鸿的心情十分沉重。刚刚的汇报并没有言过其实，即便在解放后，村中的情况仍是每况愈下，农民们不仅缺乏农具和肥料，最重要的水源也一天比一天稀少。村中的存粮早就见底了，如果下一季没有一个好收成的话，恐怕只能将村民们疏散了。当务之急，必须解决水源问题，可村子里的坎儿井是上一个世代修建的，如今，几乎已经找不到曾参与修建的人了，而不清楚具体构造的情况下，井的改造困难异常，如果不小心造成断流的话，后果将不堪设想……\n\n£gezifu £gezifu “班长，外头的老百姓说要来找大兵。”\n\n£gezifu £gezifu “他们有什么事呢？”\n\n£gezifu £gezifu “带头的那个老头说他在小时候下过一次井，想带人下去试试。”\n\n£gezifu £gezifu “好啊！”陈恭鸿拿起桌子上新印出来的电报，向门外快步走去，“村民们现在都在哪里？”\n\n£gezifu £gezifu “他们都在明渠那边呢！”"
 COX.28.desc: "£gezifu £gezifu 据曾经参与过坎儿井巡查的塔依尔所说，井由地面之上的明渠和地下的暗渠组成。整整一个世代，明渠和暗渠的巡查都停止了，直到解放之后，村民们才自发组成了护水队，沿路巡查明渠，防备有人盗水的同时，也检查是否存在漏洞。\n\n£gezifu £gezifu “明渠的各种漏洞，乡亲们已经拼尽全力填补上了。”陈恭鸿说道，“但现在水量仍然严重不足，那么我们必须要去暗渠看看了。”\n\n£gezifu £gezifu “当年建造的时候，就留有人员通道，路线也不复杂……至少当年是这样的。本来我们每十五天都要下去清理泥沙，但这么长时间过去了，不知道井下成什么样了。”说到这里，塔依尔老人掏出了一张泛黄的纸，“这是我父亲留下的检修通路的地图，你们拿去吧。”\n\n£gezifu £gezifu 带着老人和村民们的期许，维修队出发了。\n\n£gezifu £gezifu 村中所有腿脚利索的年轻人，在驻村的中国旅士兵的带领下，沿着细细流过的水流，前往古老的山岭之间，寻访劳动人民战天斗地的伟大结晶的痕迹。\n\n£gezifu £gezifu 搜索持续了一整个白天，烈日当空之下，他们不息地行走在炙热的白沙，怪奇的山岩之上，生怕错过任何还能使用的入口。在太阳即将落下的时候，他们终于找到了一处暗渠的入口。与塔依尔老人的估计差不多，渠内到处都是塌方与碎石，虽然水流没有中断，但只有汩汩细流无声地流淌在逼仄狭窄的渠道之间。\n\n£gezifu £gezifu 这注定是一场艰苦异常的任务，而又是一场事关生死的任务。村子里无论男女老少，富裕贫穷，都加入了这场与时间的赛跑。迪化城将为数不多的卡车派了过来运送土方。在开始抢修的第二天，大家在井口旁搭起了简易棚屋，当晚，村子里的女人们带着铁锅和烧好的苞谷馕来了，而后的一周时间，叮叮当当的修井声一直没有停歇。\n\n£gezifu £gezifu 在工程开始的十天以后，村子里干涸的明渠数十年来第一次注满了清水……"
 COX.28.t: "战天斗地"
 COX.29.a: "看来农会的改革很受欢迎。"
 COX.29.d: "£gezifu £gezifu 迪化宣传指挥部的小战士赶在太阳落山前把宣传墙上最后的宣传画报揭下，换上了新的大字报和宣传画。看着手里写满着“加快完成土地革命艰巨任务”的旧画报，小战士心想家里破裂的旧窗户得以修补，便高兴地沐着落日余晖消失在街头，他的背后是一片红色醒目字样：“多快好省，全力生产”“建设新时代民主农会组织”。\n\n£gezifu £gezifu 小战士圆满完成了宣传指挥部分发给他的任务，然而他不知道的是，西至阿克苏，东至哈密，近乎全疆的农会已然完成了它们第一阶段打土豪分田地的历史使命，不计其数的基层红军战士在最短的时间内走访于各大小乡村，与广大农民积极交流，初步完成了农民协会的改革。农会的工作重心不再是以往的公审地主，解放农民、农奴，而是摇身一变为广大农民提供便利，加大加快生产节奏的乡村组织。\n\n£gezifu £gezifu 前往阿克苏乡村进行农会改革工作的老战士满怀信心走下了村里的土围，他刚刚于此进行了一场激动人心的演说。从台下农民们清澈的满足的目光中，他敏锐地得知，在完成了与地主豪强作斗争，争来了自己的土地后，现在的他们更倾向于全身心投入生产。在作出向广大农民提供一切能提供的生产工具，生产方法等便利的承诺后，人们作出的反应要比他多年前在台上几句虚词空喊“打倒地主解放农民”的口号要热烈得多。思绪未断，他已经被纷纷涌来热情的农民群众所淹没了。"
 COX.29.t: "农会改革"
 COX.3.a: "“虽然反响平平，但总算迈出了坚实的第一步。”"
 COX.3.d: "£gezifu £gezifu 在红军出乎预料的快速进攻下，长期盘踞新疆的盛世才部只得宣布缴械投降。久别故乡的中国旅指战员们终于完成了解放故国的第一步。\n\n£gezifu £gezifu 但也只是最简单的一步而已。\n\n£gezifu £gezifu 在盛世才入主迪化的数十年间，他从来没有建立对整个新疆的实际控制。政令很少能传达到迪化城外，各地的少数民族并不欢迎这个东北来的“新疆王”，巴依老爷们仍旧经营着自己的一个个小王国，对所谓盛世才将军的权威嗤之以鼻。而他统治失败的证据就是如今立在迪化城内，却鲜有人收听的广播站。\n\n£gezifu £gezifu 对于一个只想偏安一隅的军阀而言，新疆的现状虽不算好，也还过得下去，但对于想要将其作为解放全国基地的中国旅而言，这样的状况必须被改变。新疆的人民必须被组织起来，打碎束缚他们的锁链，掀翻一直骑在他们头上的压迫者。而这一切，将从这里开始——\n\n£gezifu £gezifu 站在广播站前，毛岸英这样想到：\n\n£gezifu £gezifu 不知道萨布林发出那次著名的广播时，是否和此刻的自己有着同样的心情？\n\n£gezifu £gezifu 广播员将麦克风递到了他的面前，他深吸了一口气——\n\n£gezifu £gezifu  “请注意！请注意！迪化城在广播！迪化城在广播！现在，将通过无线电播送重要消息！我们，信仰共产主义的中国旅，已经击败了军阀盛世才。\n\n£gezifu £gezifu ……\n\n£gezifu £gezifu 我们承诺将民主，自由与社会主义带给这片土地和她辛勤的人民！” \n\n£gezifu £gezifu 这份广播稿，先后用汉语，俄语，蒙古语以及维吾尔语播送了一遍。"
 COX.3.t: "解放新疆！"
 COX.30.a: "“安拉将不信者降下祂的神罚。”"
 COX.30.d: "£gezifu £gezifu 自出生以来，西日阿洪就如他名字的寓意一般，是命中注定要统领百兽的雄狮。他不懂什么历史——他只知道自古以来更高贵的人便应得他人的服侍。他也不懂什么宗教——每日诵《古兰经》，也只知道书中的安拉要使卑贱者卑贱，而高贵者高贵。农奴劳作，给地主缴租，他只知千年来尽是如此，哪怕是在久远的未来，亦不会有什么变化。\n\n£gezifu £gezifu 但在两年前，那些打着红旗的不信者开进村来，村民们于是便被蛊了神智。分土地，打地主，烧地契，甚至连村中的清真寺也贴了封条。风光如西日阿洪，也只能灰溜溜地夹起尾巴，朝“翻身“的贱民们赔上笑脸。\n\n£gezifu £gezifu 他不知道这样的日子何时才能过去，只是每日诵经时摆起最虔诚的样子，希望安拉可以看到地上是非颠倒的模样，早日给亵渎者降下灾殃……\n\n£gezifu £gezifu 好像真的应了他的祷告，两年过去，所谓的“土地革命“已经陷入了危局。\n\n£gezifu £gezifu 地主与阿訇结成统一阵线，在两年间不休止地掀起叛乱，阻挠新疆的生产。大量耕地撂荒，数不清的水利设施在不休止的低烈度冲突中遭到破坏，农业产量只是堪堪维持着革命前的水平。如今，两年过去了，土地革命初期农民们改天换地的热情正急剧衰退，而包括西日阿洪在内的传统主义者们终于等到了合适的时机——\n\n£gezifu £gezifu 主们散尽家财，召集了数量庞大的私兵，阿訇们则借着安拉的圣言，呼吁信徒们拿起武器。在新疆广大的乡村地区，情况已经超出了迪化政府的控制。在那里，红旗被泼上黑漆，来不及撤离的共产党干部和红军战士，遭到了新组建的宗教法庭的审判，然后被残酷的处刑。\n\n£gezifu £gezifu 在对真神的赞美声中，沿着世上唯一正确的道路，西日阿洪荣归故里，重拾权力。"
 COX.30.t: "踏着正道，还乡"
 COX.31.a: "“我是张治中，打上海‘一·二八’的张治中！”"
 COX.31.d: "£gezifu £gezifu 随着一声枪响，终结了一个狐假虎威的老土狗的生命，也吸引了周围已经入城接管秩序的红军战士的注意。\n\n£gezifu £gezifu “是谁！？这是怎么回事！？”一个红军战士看着倒在地上已经没了大半个脑袋的“土狗”，和一个拿着手枪，身穿旧时国民党军服的军官。\n\n£gezifu £gezifu 那名军官见到红军战士的前来，将手枪随意地丢在地上，举起双手大喊道：“我投降，地上死掉的老狗是盛世才！”\n\n£gezifu £gezifu 见那名国民党军官放弃了武装，那红军战士赶忙上前控制住军官。\n\n£gezifu £gezifu 刚控制住没多久，毛岸英就走近了案发现场，一眼就看到了地上倒着的尸体，和被控制住的国民党军官，人有些发愣，一时间不知道发生了什么，不禁问道：“发生了什么事情？”\n\n£gezifu £gezifu 见到这个疑似红军大人物的人到来，这个国民党军官急忙大喊：“红军先生，我是起义的！躺那里那条老狗就是盛世才，我是支持你们！”\n\n£gezifu £gezifu 毛岸英对着那名红军战士温和地说道：“赵白，快给壮士松绑吧。”随后，拍了拍国民党军官的肩膀，说道：“欢迎起义，先生。请问，您是？”"
 COX.31.t: "旧日老将"
 COX.36.a: "那交响曲的名字叫气概。"
 COX.36.d: "张成橹排长脚下，单调而无生机到令人绝望的地步的灰漠土向四方延伸到苍蓝的天际；而在这片无主的荒野上，年龄、面容各异的工农兵正一用一个个铿锵的步子向灰漠土发起无告的攻势，在张成橹的监视下机械地重复着每日的训练科目。\n尽管那些训练中的工农兵和张排长的军衔并不相同，阳光却平等地灼热着他们的皮肤。正当张成橹又一次厌烦地试图抹去额头硕大的汗珠时，拉玛赞上尉拍了拍他的肩膀。“张中尉，这就是您日常训练计划的全部内容吗？”\n为照顾张成橹的俄语水平，拉玛赞刻意一字一句地将这话讲出来，但这反而让张成橹听出了一丝挑衅或挖苦的意味。“是的，就是这么多了：队列训练、搏击与射击的练习。凭着这样的训练，我们建立了全世界最大的武装革命根据地之一！”\n拉玛赞摇摇头，用稍快的语速说道：“张，我向列宁同志保证，我的这番话没有你理解的恶意。和你们交流经验，”拉玛赞特意把重音放在“交流”一词上，“这正是我前来你方的主要目的。没有经验的交流，就没有胜利的到来。”\n张成橹黝黑的脸上突然迸出开怀的笑。“哥们，你他妈别把我的操蛋话往心里去！我没有那个意思，你应该多讲些！”事实上，俄语如此蹩脚的张竟把脏话运用得如此娴熟，着实让拉玛赞吃了一惊。后者郑重其事地说：“与游击的战术相比，队列的作用是微乎其微的。如果要在机械性重复上消耗同样的体力，我们应该把这些体力用在高效的纯体能训练上，而不是低效的队列。同时，基本的战场救护训练和各种攻、守阵法也是必不可少的。至于射击训练，尽管根据地的子弹十分宝贵，但我们不能吝惜定期的实弹射击训练，不能再让他们对着靶子放空枪。这些子弹是训练有素的军队所必须的投资。”\n“你说得对，但是我们的子弹的短缺程度恐怕比你想象中还要夸张。”张成橹边往笔记本上飞速记着他听不大懂的句子，边回复道：“但相信你的同志们在此次合作中也会向我的同志们提出相同的建议，这样，上级一定会重视这个问题的。”\n灰漠土上的士兵们练得更起劲了。沙砾中微小的晶粒上，映射的是几个民族共同的坚毅面庞；就像这被践踏了千万次的土壤一样，他们的民族受尽苦难与凌辱，但这些面庞仍坚毅地望向东方或西方。他们有各自的故土要收复，有各自的敌人要推翻，但至少此刻他们的心意相连，那清澈的爱同脚下淋溶的碱土、身边荣枯的草木一起，越过时间长河，与历史上每个伟大的瞬间共鸣着。"
 COX.36.t: "荒漠之歌"
 COX.3601.a: "哈萨克人就是这样——永远能在创痛与惊险中作乐。"
 COX.3601.d: "艾尔肯很是气恼。作为根据地派到哈萨克苏维埃政权代表方阵的一员，他将在明天盛大的欢迎仪式上用整齐划一的步伐与嘹亮的歌声展示根据地的蓬勃发展，但现在，他居然被一句玩笑话气得睡不着觉。\n虽然艾尔肯不这么认为，但这件事说起来其实很好笑：看到他训练中不善展现表情的死板脸配上圆睁的眼睛和古怪的胡子的样子后，那些小屁孩都知道中国代表方阵里有一个“福尔摩斯”！艾尔肯为检阅担心了千百遍，他担心过背不过哈萨克军歌的歌词闹出笑话、担心过自己顺拐的毛病在参军14年后因紧张复发，但却万万想不到自己竟因此事辗转反侧、彻夜难眠！\n就在此时，阿斯塔纳的夜似乎颤抖了一下。艾尔肯通红的脸下，大脑立即转而冷静地高速运转。他谨慎地把脑袋偏到异变来源的方向侧耳倾听，事实证明他没有耳鸣。窗边是一阵诡异的低语。与生俱来的警惕告诉他，这串起伏的耳语非同寻常——半分钟后，他意识到，之所以有这种感觉，是因为耳语者所用的语言是陌生的。不像哈萨克语或维吾尔语，那语言与自己的母语——柯尔克孜语并无相似之处。或许是塔吉克语——\n突如其来的彻骨的寒意中断了语言音海中的搜寻。艾尔肯的心脏快要停跳了：窗外的影子掏出了一套大家伙，并弯下腰。那分明是雷管的轮廓！显然，其目标正是他的宿处！\n艾尔肯不知道有几只眼睛正透过窗户纸盯着他的剪影。他屏住呼吸，按捺住颤动的身体，并谨慎地让手在床上不出声响地移向配枪。窗外有两个影子，一个高个的黑卷发家正鬼鬼祟祟地替自己的同伙张望，后者是个在黑夜无法辨别发色、留平头的胖子，他的眼镜框依稀可见。\n在令人窒息的数分钟后，两人重新潜入了阿斯塔纳漆黑的夜。艾尔肯则在等待良久后轻轻穿上便装，提着枪一路直奔街上不远处挂着红星的建筑物。在难眠的三个小时后，深蓝的凌晨还未染上清澈的金红色时，不满哈萨克族政权已久的两名俄族年轻男子扎柳茨基与米哈伊洛夫束手就擒。\n第二天正午，尽管官方从未声张，但观众席上的每位哈萨克居民似乎都知道这次欢迎仪式前繁杂的入场排查是出于何种原因；他们兴奋地指着那位面相特殊的来自中国根据地的柯尔克孜族战士，人人都知道他叫“福尔摩斯”·艾尔肯。"
 COX.3601.t: "福尔摩斯"
 COX.37.a: "常联系！"
 COX.37.d: "£gezifu £gezifu “嘟———嘟——嘟——嘟——”\n\n£gezifu £gezifu 清脆嘹亮的起床号在营房上空响起。徐光来躺在床上，紧紧闭着眼睛，然而号声还是传进了他没有捂住的耳朵里，搅得他心烦意乱。其实，徐光来早就醒了，多年的部队生活让他的作息变得极为规律。但是今天，他无论如何也不想离开床。\n\n£gezifu £gezifu “徐班，该出操了……”\n\n£gezifu £gezifu “别烦俺别烦俺……去去去。”\n\n£gezifu £gezifu 徐光来躺在床上嘟囔着，挥手赶开凑近的战士们。他不能不烦恼——就在昨天，毛旅长已经下了命令，要他今天一早就离开连队前往乌鲁木齐接受培训。投诚部队发生的种种麻烦事徐光来有所耳闻，他也很愿意为老旅长分忧，但真到了别离的时刻，却又迈不开腿脚。他拉上被子蒙住头，还是听到了房门关上的声音。这会，他的战友们应该已经夹着脸盆，向着盥洗间走去了。\n\n£gezifu £gezifu 棉被隔绝了外部的声响，徐光来感到安静又惬意。昨晚他愁得翻来覆去一宿没睡着，现在居然有点困了。就在他迷迷糊糊的时候，房门被什么人猛地推开，声音之大震得他一哆嗦。\n\n£gezifu £gezifu “徐光来，你怎么回事？”\n\n£gezifu £gezifu 排长的大嗓门向着徐光来逼近，徐光来赶紧攥住被子不撒手。果然，排长开始拽他的被褥，他虽然死命撑着不让被子被抢走，但是躺着不好用力，眼看着人就要从床上滚下来了。\n\n£gezifu £gezifu “咚——”\n\n£gezifu £gezifu 徐光来摔了个屁股蹲。幸而有被子垫着，还不觉得疼。他抬起头，看见排长正对他怒目而视。"
 COX.37.desc: "£gezifu £gezifu “你他娘的劲还挺大……怎么，让你上乌鲁木齐去学习是委屈你了？不想去就不挪窝，徐光来同志，你的眼里还有没有组织纪律？”\n\n£gezifu £gezifu 既然已经赖不住了，徐光来只好磨磨蹭蹭地站起身来，半是自己走，半是被排长押着换好了衣服、盥洗，然后又进了食堂。匆匆嚼完早饭之后，哭丧着脸的徐光来又被排长押到了军营的大门外，被征召的战士们在这里集合，正在陆续登上前往乌鲁木齐的班车。\n\n£gezifu £gezifu “徐班！”“徐班！”\n\n£gezifu £gezifu 萎靡不振的徐光来听到有人在叫他的名字，他抬起头来，发现同班的战友们正站在架子车路旁。看到徐光来注意到了他们，这群小伙子就开始对着老班长鼓掌起哄。\n\n£gezifu £gezifu 徐光来看着他的战友们，熟悉的笑脸让他不禁鼻头发酸。\n\n£gezifu £gezifu “徐班，你莫伤心，毛旅长选你做指战员，咱们一个班也都脸上有光啊。”\n\n£gezifu £gezifu “话虽说是这……”徐光来揉揉眼睛，调整了一下情绪，“本来打算着部队打回俺家的时候带恁四处转转，现在估计也靠不住啦……我可对不住大伙哟……”\n\n£gezifu £gezifu “不打紧的，徐班你有多大本事，能离了咱部队不成？”一个年纪最小的战士咧嘴笑着，“徐班的老家在哪里，咱都听得耳朵起茧子了，等部队打回去的时候，咱就来找你，不信还能找不着！”\n\n£gezifu £gezifu “怎么说话呢？”徐光来又板起面孔，不过这次是装的，“无组织无纪律，跑去别的连队串门子可要不得！”\n\n£gezifu £gezifu “徐班你赖着不走，还是给排长押来的，就这还有脸说他！”\n\n£gezifu £gezifu 话音刚落，徐光来和战友们都不禁笑出了声。班车上响了铃，发车的时刻近了，徐光来和他的老战友们一一握别，登上了轰鸣着的班车。火红的太阳正从戈壁滩上缓缓升起，照射在徐光来的身上，感觉暖洋洋的。他隐约觉得，这次去了乌鲁木齐，就要做起一番大事业了。"
 COX.37.t: "告别老战友"
 COX.38.a: "回乌鲁木齐，我们有麻烦事要处理了。"
 COX.38.d: "£gezifu £gezifu 毛岸英拉低了他的帽檐，饶有兴致地观察着周围。现在的他看上去就像是个普通的连级中国旅指战员——在出发之前，他曾对着镜子反复检查过自己的扮相，应当是万无一失的，至少到现在为止他还没有被任何人认出来。由于部队的总数并不多，进行全部检阅没有耗时太久，观看完阅兵的老同志们也各自返回乌鲁木齐休息，但毛岸英仍旧感到兴致勃勃，他乔装打扮，目的就是暗访部队驻地，观察战士们训练的情况。毛岸英知道，如果他被人认出来，连队一定会停止操演向他致意，所以一路上他都小心翼翼，甚至显得有点鬼鬼祟祟。好在操场边的小路上没有什么行人，应该没有人会把他当作坏分子扭送政治局，毛岸英一边慢慢地踱步，一边仔细地观察着操场上的动态。\n\n£gezifu £gezifu “一二一，伊耳伊，乙尔乙……”\n\n£gezifu £gezifu 身着粗布军装的战士以整齐的队形在他眼前跑过，但口号的声音却显得不那么统一，战士们严肃的表情与奇怪的发音让毛岸英忍不住笑了出来。这些战士属于中国旅，其中有不少哈萨克人、俄国人和蒙古人，现在他们在每日固定的训练之外，还要上汉语补习夜校；为了在中国的土地上进行革命，就必须要闯过语言关。毛岸英目送着中国旅的队伍渐渐跑远，一支新的连队进入了他的视野，这支队伍虽然略显松散，但尚且保持着不错的队形，口号声也算得上响亮——作为盛世才的旧部，他们的表现相较刚投诚时的散漫已经有了很大改观，假以时日，或许这些旧军阀的部队也能够被改造为中国旅那样意志坚定的革命军队。毛岸英闭上眼睛，仿佛已经看见了高举红旗的队伍战无不胜的英勇姿态，他们从新疆出发，一路摧枯拉朽，粉碎一切反动军阀，将日本侵略者和他们的无耻走狗干净利落地从中华大地上扫除出去……"
 COX.38.desc: "£gezifu £gezifu 然后，操场上突然的异动打断了他的遐想。\n\n£gezifu £gezifu 毛岸英循声望去，场地正中央有两拨人正在紧张对峙。他不知道这些士兵是在休息中发生了口角，还是蓄谋在此斗殴，但这种事情绝不应该在这里发生。争吵的声音传进了他的耳朵：\n\n£gezifu £gezifu “老陈，你他娘的到底有没有拿老子的香烟？”\n\n£gezifu £gezifu “你自个抽不过瘾，赖到老子头上来了？有种你就去仓库里抢，老子才敬你是真汉子！”\n\n£gezifu £gezifu “我看你兔崽子是他妈找打！弟兄们，给我揍他！”\n\n£gezifu £gezifu 看起来像是头目的人一声令下，两拨人嚎叫着扭打在了一起。毛岸英的笑容收敛了，他发现自己忽略了一样非常重要的事情——也许旧军队内部的兵头和小团体并不是消失了，而是暂时隐藏了起来。既然内部的结构毫无变化，对于这些军阀部队来说，现在只不过是换了个新东家而已，即使训练得再完美，没有作为革命军队的觉悟，他们就永远是一群散兵游勇。\n\n£gezifu £gezifu 尖锐的哨声在操场上空回响，几个骑马的教官已经赶往斗殴地点，试图约束打得不可开交的士兵。毛岸英来时的好心情此时已经消失得无影无踪，他注视着这场闹剧，心中不由地浮现出了一个想法：他需要用一批新的指战员取代那些不老实的旧军官了。"
 COX.38.t: "盛世才旧部斗殴！"
 COX.39.a: "我想要换个新名字，同……志。"
 COX.39.d: "£gezifu £gezifu 投诚、易帜、接受改编，这就是王富贵不断重复的前半生。蒋委员长死在重庆的消息传出后，残余的国民革命军一哄而散，王富贵在一夜之间失去了他的老部队，只能凭借着自己的好枪法在大大小小的地方军头那里混一碗饭吃，迷迷糊糊地度过了十几年不断易主的生活，最后变成了盛世才的手下。接着，另一支军队从北面打来，王富贵抵抗了一阵，便老老实实地做了俘虏。\n\n£gezifu £gezifu 投降对于王富贵而言，本已驾轻就熟了，俘虏他的这支部队的番号却还是让他大吃一惊：这群士兵自称隶属于红军中国旅。他最末一次听说“红军”，也已经是在二十多年前的那段记忆之中了，这多少让他有些失去了实感。红军对他很好，在检验了他的枪法之后，很快就把他编入了部队当中，几个原来的老伙计有时还会偷偷跑来找他打牌喝酒，总的来说，他并没有任何不满的理由。\n\n£gezifu £gezifu 但是，他现在失眠了。\n\n£gezifu £gezifu 王富贵大睁着眼睛，看着土黄色的天花板。他不能闭眼，只要闭上眼睛，眼前就会浮现出一张哈萨克老妇人老泪纵横的面孔。这是五六天前的事了，那时他正跟随部队在克孜勒奥尔达境内作战，巡逻到一个小村子附近时，发现了马蹄的扬尘。他们追击过去，发现了正在劫掠的马匪。班长命令他们开枪，王富贵瞄准一个看起来像是领头的家伙，一枪就把他的脑袋打开了花，剩下的匪徒见状纷纷扔下马袋逃散，也被红军与哈萨克部队一一击毙。当他们打扫战场的时候，一个走路颤颤巍巍的老妇人找到了他，握着他的手激动地说了许多他完全听不懂的话。翻译告诉他，刚刚那群土匪把村里的粮食席卷一空，如果他们没有来的话，这里连越冬都会有困难，老妇人是在感谢他打死了土匪头头。王富贵一头雾水地听着，在此之前，没有一个人因为他开枪打死了谁而这样地感谢他——从那天起，老妇人的脸就在不停地使他烦恼。\n\n£gezifu £gezifu 如果——只是如果。如果他开枪并不是纯粹为了杀人，而是真的能够帮到谁的话……\n\n£gezifu £gezifu 门上传来轻轻的敲击声，这是他的老伙计在喊他出去喝酒了，但王富贵并没有应答。他等到敲击声停下后，从抽屉里拿出了他所有的香烟，一根接一根地抽到咳嗽不止，然后把剩下的全部扔到窗外，和衣倒头就睡。\n\n£gezifu £gezifu 第二天王富贵醒得很早。他没有去食堂，而是在军营里漫无目的地走着，直到他被一道突然出现的门拦住。他多少还能认识几个字，知道门上写的字里，有一个是“人”，他突然知道自己要做什么了。他推开了这扇门，看到一个办事员坐在书桌后面，正在用询问的眼光看着他。\n\n£gezifu £gezifu 王富贵的嘴唇蠕动着，他开口了。"
 COX.39.t: "新连队，新生活"
 COX.4.a: "继续前进，我们马上就能见到同志了！"
 COX.4.d: "自西伯利亚的政权崩溃以来，新疆的北境从未有过一日安宁。哨站与简易营房散布在边境的山谷与戈壁之间，其中驻扎着疲惫的士兵，时刻抵御着俄罗斯混乱的外溢——虽说如此，其实冲突的烈度相当有限——试图跨越边境的多是些偷渡者与难民，或是误入此地的牧民，即便是军匪流寇，也至多不过百人，他们手中老旧的武器，根本无法威胁边防军的工事。\n但谁都没能想到，就在北疆再度爆发骚乱，补给线遭到切断的紧要关头，会有一支前所未有庞大的部队从西伯利亚进犯。炮楼在牵引式大炮的轰鸣下倒塌，在边防军做出任何有组织的抵抗之前，敌军已经渗透到了近前。士兵失去了战意，长官也只能缴械投降。\n“你们怎么是中国人？”\n“闭嘴，回答我们旅长的问题——”\n\n………\n\n时隔多年再度踏足祖国大地，毛岸英却没有任何特别的情感，一路上的风餐露宿，他与许多战士一样始终提心吊胆，不知道归国后将面对怎样的局面。在消息闭塞的西伯利亚得知的只言片语中，新疆已经由盛世才——一位有能力的军阀治理了三十余年，他会接纳归国的八十八旅吗？即便他能接纳，又该如何说服他全面转向抗日呢？在旅途中辗转反侧的每一个夜晚，毛岸英始终担心着这近万名弟兄的未来……直到从边防军军官口中，他才得知了此刻新疆的面貌——盛世才的统治早已难以为继，经济凋敝，军备松弛，中共残余在北疆发动了一场起义，他们号召牧民，农奴与不满的士兵，组成了名叫“新民族军”的武装。具体情况虽不知晓，但已在北疆成燎原之势——"
 COX.4.t: "突袭"
 COX.40.a: "好极了！"
 COX.40.d: "£gezifu £gezifu 对盛世才部队的打散重编工作已经接近尾声。"
 COX.40.t: "乌鲁木齐改编顺利完成！"
 COX.41.a: "《关于贯彻打击地租工作的意见》"
 COX.41.d: "£gezifu £gezifu 从踏入办公室、把带来的文件放在桌上的那一刻起，刘明利便紧张得喉咙发干——接过文件的苏维埃主席只是看了一眼封面，脸色随即变得阴沉起来，而且越是翻阅下去，忧愁的神情就越是明显。更糟糕的是，他本人在来之前已经读过了这份报告，却并没有看出不妥之处，不安的等待让他的双手都渗出了汗。\n\n£gezifu £gezifu 许久，毛岸英才放下了手中的文件。他抬起头来，盯着面前这个从南疆归来的干部。\n\n£gezifu £gezifu “我想问一下，为什么在明确了打击征收地租的工作任务之后，仍然有地方存在地主征收农民生产所得的情况呢？”\n\n£gezifu £gezifu 刘明利没法回答这个问题。他是盛世才政府里少数几个被根据地政府录用的人，并不熟悉土地工作，听着毛岸英的质问，连头上也开始出汗，急忙从口袋里掏出一张手帕开始擦。\n\n£gezifu £gezifu “我想这应该只是少数的个别情况，主席同志，我亲自下过基层巡查过，大部分村庄的农民们是已经不用缴纳地租的……”\n\n£gezifu £gezifu “是，这确实只是少部分负隅顽抗的地主……但是更多的地主还在观望，你觉得这种无视问题的工作态度，会造成什么样的影响？”\n\n£gezifu £gezifu 办公室里静得出奇，毛岸英看着刘明利一言不发擦着汗的样子，长长地叹了一口气。“罢了……你先回招待所休息吧。”\n\n£gezifu £gezifu 刘明利听到这话，仿佛得了宽恕似的，急忙从房间里退了出去。等到走廊里的脚步声也消失以后，岸英便从抽屉里拿出了稿纸，点着了一根香烟——他不抽烟，但是升腾的烟雾能够莫名地给他一种慰藉，帮助他思考。南疆的问题明显是严重的，农奴地主抗拒政策继续催收地租的情况很有可能比报告中提到的更加普遍，因此，必须再起草一份意见来解决眼前的问题。"
 COX.41.t: "南疆第三调查组报告"
 COX.42.a: "……"
 COX.42.b: "……好吧。"
 COX.42.d: "£gezifu £gezifu 办公室的门“吱呀”一声被人推开了，正在伏案书写工作笔记的李卫东抬眼一看，是平日里做事比较毛躁的付星来了，他气呼呼地将一摞文件重重地放在破旧的办公桌上，大声喝道：“这减租减息委员会的委员老子不当了，谁爱当谁去当！”\n\n£gezifu £gezifu 李卫东摇了摇头，起身给付星倒了一杯水，递给了付星，眼前这个尚未满十七岁的孩子，是他战友付满财临终前托付给他的，付星生在军营，也长在军营，性格比较直爽，也比较粗莽，这让李卫东十分头疼。\n\n£gezifu £gezifu “说说吧，你们在这次减租减息工作中都遇到了哪些阻碍。”\n\n£gezifu £gezifu “那些农民，根本就不值得被解放，我们工作组的人好劝歹劝，他们根本听不进去，就是一根筋的认为阿訇还有什么满拉就是那狗屁圣人，我们去清真寺做工作，还被他们拿着农叉挡在门口，还说我们再不走就和我们红军拼命！”\n\n£gezifu £gezifu 付星说得慷慨激昂，李卫东听着却直摇头。\n\n£gezifu £gezifu “孩子，你要明白，我们目前的工作是减租减息，而不是停租停息，做任何工作都需要有一个漫长的过程，那些从小就受到教义熏陶的农民几十年如一日地敬奉他们的真主，而你们一伙过去二话不说就要打碎他们的信仰，只会适得其反，激起更为强烈的反抗，你们这批年轻人的性格太过于激进了，是件好事，也是件坏事。”\n\n£gezifu £gezifu “那我们就让那群阿訇们继续骑在农民的头上作威作福？他们每年要收多少农民的租子，我们就这样不管了？”\n\n£gezifu £gezifu “所以我们才要减租减息，你们再去做一下清真寺那里的工作，第一就是务必将租息调到最低，第二就是协商将他们清真寺来源不明以及经营不善的土地调剂给贫农和赤农耕种，由根据地作保。”\n\n£gezifu £gezifu 李卫东拍了拍付星的肩膀，语重心长地说道：\n\n£gezifu £gezifu “革命不是一蹴而就的，饭要一口一口吃，路要一步一步走。”"
 COX.42.t: "油盐不进"
 COX.43.a: "让政治保卫局领导地方民兵开展工作！"
 COX.43.b: "能否邀请部分开明人士召开制法会议呢？"
 COX.43.d: "£gezifu £gezifu 法律是阶级统治意志的体现——任何一个马克思主义者都会这么说。\n\n£gezifu £gezifu 当然，除了一个国家的统治阶级所推行的法律之外，宗族和寺庙作为成规模的社会生产与再生产组织，其内部也会存在某种法律，并且亦有一套暴力工具来维护其存在。\n\n£gezifu £gezifu 这些内容看起来像是简明教科书中的原理，但实际上却是现实问题。迪化人民法院建立三个多月了，却没有任何人来这里打官司。法庭空荡、法槌噤声，就像当前苏维埃政府法律的威信一样。\n\n£gezifu £gezifu 这令人尴尬的现象都说明了一个事实：苏维埃政府的法律被无视了，反动派们还在维护着自己的法律体系，他们还在用私法牢牢地抓着根据地的法律主导权。\n\n£gezifu £gezifu 为了解决这个问题，苏维埃中央不得不召开了一次紧急会议，但会议从最初的讨论很快就变成了党员们的愤怒指控。激烈的“讨论”足足持续了四个小时，最后由会议主持者张闻天总结。\n\n£gezifu £gezifu “……总之，私法的存在，是依靠宗族和教派们的武力保障而存在的，我们若是想推行苏维埃政府的法律，那么就必须得消灭他们的武装，缴了他们的枪。”张闻天揩了揩脸上的热汗，“那么，如果没有异议的话，下面开始提名表决负责这项工作的人选……”\n\n£gezifu £gezifu “同志们，请等一下。”一直沉默地旁听争论的王震突然发言了，“执行缴枪工作需要相当的武装力量，但目前只有政治保卫局的部队还能够调度了，这恐怕是远远不够的……如果我们没有能力在南疆地区广泛执行缴枪政策，最好还是不要用过于强硬的态度无意义地激怒敌人。”\n\n£gezifu £gezifu 毛岸英心情复杂地注视着会场里的同志们。从内心深处，他是支持会议讨论的成果的——靠着自己的双手来改变世界的劳动者，凭什么要由这些打着宗教旗号的反动派来审判呢？但同时，他也不得不承认，王震所说的确实有道理，风险是存在的，现在他们的力量不足以应对反动派的大反扑。\n\n£gezifu £gezifu 委员们或热切或迟疑的目光汇聚于他的身上，他知道自己应当发表意见了。"
 COX.43.t: "罪与罚"
 COX.44.a: "我们不能让这些群众和战士的血白流。"
 COX.44.b: "让我们听听他们的条件吧……"
 COX.44.d: "£gezifu £gezifu 晚上八点的苏维埃楼，除了警卫之外已经没什么人了。但是…\n\n£gezifu £gezifu “主席同志！”一声急迫的喊声响起。一位工作人员手上拿着一封信，径直推开了办公室的门。他的头上满是热汗，显然有要事要说。\n\n£gezifu £gezifu 在房里批文件的并不只有毛岸英，还有陈潭秋和抽着烟缓解压力的陈赓。坐在门口旁边的陈赓看到工作人员手中的信，便起身接了过来。\n\n£gezifu £gezifu “首长，南疆地区加急信，有人袭击之前勇于检举的群众。”他一只手擦了擦汗，另一只手把信件递给陈赓。陈赓低头略微一扫，脸色顿时沉了下来，一言不发地把信递给毛岸英。\n\n£gezifu £gezifu “你慢慢说，不要急。”毛岸英镇静地接过信件，同时心里默默估算着时间：从南疆到迪化的加急信，最快应该是今天下午四点发出的，这件事应该才发生不到一天。\n\n£gezifu £gezifu 毛岸英拆开信，里面只有简短的几行字——库车县暴徒闹事，他们把向苏维埃政权诉苦的积极分子抓起来游街示众，随后用浸水的木棍狠狠地殴打；当地的苏维埃办事处被暴徒围了个水泄不通，几十个民兵正在极力抵抗；派去此地的宗教办事组也全员失踪，生死不明。\n\n£gezifu £gezifu 毛岸英捏着信纸的力气越来越大，以致于信的边缘都变得皱巴巴的。他早就料想到会有反动派站出来闹事，但没想到仅仅是发动群众诉苦，揭露宗教分子和地主阶级之间的共生关系，就引来了如此之大的反弹。\n\n£gezifu £gezifu 又是一阵急促的脚步声。一个卫兵拿着一张沾染着血迹的信纸冲了进来，毛岸英没有多想，直接接了过来。\n\n£gezifu £gezifu “宗教办事组在暴徒的手里，下午四点多一点的时候被处了私刑。虽然勉强保住了性命，但是被打坏了腰，恐怕很难再站起来了。情况危急，请中央尽快处理。”\n\n£gezifu £gezifu 毛岸英无声地看着这封信——中国旅又失去了几位好战士。\n\n£gezifu £gezifu 陈潭秋站在一旁看完信，然后拿起杯子喝了一口水，缓缓地说道：“反动势力又露出了他们的獠牙。这些年我们在新疆失去的同志太多了……”\n\n£gezifu £gezifu 在多年的斗争生涯里，他早已目睹过无数同志的牺牲。但当他再一次遇到这种情况时，心中还是免不了一阵感伤。\n\n£gezifu £gezifu 陈赓把信拿起来仔细看了看，然后冷哼了一声。\n\n£gezifu £gezifu “这帮兔崽子反动派…！”\n\n£gezifu £gezifu 毛岸英劝了陈赓几句。他不想看见这位老将军气坏了本就不好的身体。"
 COX.44.t: "一封信"
 COX.45.a: "不管用什么手段，我们必须让伯克低头。"
 COX.45.b: "情况已经足够糟糕了。或许我们只需要主持订立一份合理的新地契就行……？"
 COX.45.d: "£gezifu £gezifu 周有明揣着记事本，百无聊赖地在小村庄里闲逛。闲逛的理由是，他不想回到工作站去。而且，天气很好，下午的阳光黄灿灿的，连远处绿杨阴下掩映的砖房也看得格外分明，那是本地伯克的大宅。\n\n£gezifu £gezifu “老东西……”\n\n£gezifu £gezifu 这样暗暗地咒骂着。\n\n£gezifu £gezifu 他不能不感到愤怒——正是这老头闪得他有家难回。按照惯例，工作组成员回到工作站后，就要预备汇报今天的工作进度，可是他今天等于没有任何的工作进度。周有明看着纸上潦草的笔迹，用力地挠着他已经毛发稀疏的脑袋，默默地发愁。\n\n£gezifu £gezifu “并无强迫租佃等事……租子俱不甚重，除完税及自家吃用外，尚有余粮可售。”\n\n£gezifu £gezifu ——摆明了是放屁么。\n\n£gezifu £gezifu 周有明不知道别处是怎样的，但在他负责的这个村落里，几乎每一户都是佃农。只要有这一层关系在，即便是勒令减租，伯克们也总能从其它地方克剥佃户们的米钱。办法是很多的，例如在租用耕牛农具上下绊子，或是在打谷舂麦时稍稍使点心眼，就能把减去的租子照旧找补回来，甚至还能多赚一些。为此，首先就要把这层依附关系破除掉，否则空谈减租毫无意义。\n\n£gezifu £gezifu 但问题也随之而来。到今天为止，他还从未见过一份地契，更不要说了解当地的租佃关系了。佃户们说什么也不愿意把地契拿出来，而且矢口否认这种不合作的态度和伯克有任何关系。至于真相如何，自是不言而喻。\n\n£gezifu £gezifu 一边胡思乱想着，周有明在村子里瞎走一气，最后还是疲惫地回到了工作站去。推开门，他就看到他的战友们同样愁眉不展地向着火。\n\n£gezifu £gezifu “看你这愁眉苦脸的样子……”\n\n£gezifu £gezifu “群众不敢说嘛！”\n\n£gezifu £gezifu 周有明猛地把记事本摔在桌上。他不是有意要摆脸色，只是觉得有股火，非发出来不可。\n\n£gezifu £gezifu “不知道那个伯克还是和加——去他的，管他叫什么——和佃户们说了什么，都一口咬死地不给看地契……没有证据，就凭我们几个，总不能提了驳壳枪去把老驴抓来！我看呀，再这样耗下去，群众又怕伯克使坏，又怕我们折腾，工作可以不用再做了！”\n\n£gezifu £gezifu 没人接他的话。周有明喘了一回气，重重地坐在条凳上，又想了一回，觉得非得写封信反映情况不可了。他把那几页没用的记录从记事本上扯下，揉成一团丢进了炉子里，开始动笔写作。"
 COX.45.t: "解放"
 COX.46.a: "我们总会有办法的。"
 COX.46.b: "也许我们可以稍微许诺一点宗教自决权…？"
 COX.46.d: "£gezifu £gezifu 杨威沉默地蹲在屋前的泥地上。\n\n£gezifu £gezifu 没有人应答。他和赵锋已经交替着敲了半小时的门，但是小屋里仍然是一片寂静，听不出任何有人要来开门的迹象。杨威知道，这个村子里唯一的阿訇就住在这里，他们在来之前已经反复确认了住址，也弄清楚了这个阿訇今天并没有外出，但眼前的事实却是这令人尴尬的寂静。\n\n£gezifu £gezifu “……狗日的老回子。”\n\n£gezifu £gezifu 两人的嘴里不由自主地冒出了同一句话来。其实，这种窘境倒还在他们意料之中——佃农们在好心地指路之余，也不无担心地提到了前几天阿訇莫名其妙地在礼拜结束之后被叫走的事情。\n\n£gezifu £gezifu “远远地看见一个包着白头巾的人和他说了些什么，这几天就谁人都不肯见了。我看他怕是未必能给你们开门呢。”\n\n£gezifu £gezifu 回想了片刻后，杨威不由得烦躁地叹了口气。\n\n£gezifu £gezifu “我还以为巴拉提被抓起来之后工作会更顺利些……”\n\n£gezifu £gezifu 他的自信是有底气的。在巴拉提被逮捕审讯后不久，苏维埃中央就将他定为勾结反动地主欺压人民的坏典型，在广播中播送了他的斑斑劣迹。几天之后，新疆各地的巡回法庭便陆续接到了群众的申诉。虽然报案人普遍还是感到战战兢兢，但相比之前无案可审的状态要好太多了。因此，他们今天才怀着趁热打铁的心态，想要来联络当地的阿訇。\n\n£gezifu £gezifu “但这群新教会比我们的速度更快。”赵锋在泥地上摁灭了烟蒂，“我看，改日还得再来。不管那群老狗说了什么，我们一定要争取贫困阿訇的支持。”\n\n£gezifu £gezifu 杨威抿紧了嘴唇。作为一个老红军战士，他是坚定的无神论者，但这并不代表根据地的一般民众也能够快速地转变想法——至少短期看来，他们的生活仍然无法缺少宗教。在这种情况下，即使打倒一个劣迹阿訇，也会有另一个被推举上来，最终不过是无意义的循环罢了。所以，必须要通过传播新的教义，从根源上消灭新教的权威。\n\n£gezifu £gezifu 而传播教义的人选……\n\n£gezifu £gezifu 他抬起头来，看着低矮的小屋。"
 COX.46.t: "闭门羹"
 COX.47.a: "红军在哪儿都是红军。"
 COX.47.d: "£gezifu £gezifu 一个三十几岁的班长抽着烟。今天他的部队是过来保卫分地现场的秩序的——尽管苏维埃已经完成了对整个新疆的平定，但对于基层的掌握还是并没有完全超过曾经的盛世才政府。今天是来打击土豪劣绅重新再分配他们的土地。当然第一批最恶劣的恶霸劣绅已经在解放新疆的时候枪毙了。而现在执行的是用强制手段逼迫更多的地主重新分配他们的土地。这个过程并不顺利，还是有许多地主不愿意放弃他们祖辈传承下来的“财富”公然对抗苏维埃。为此不得不把正规军拉出来维持分地时的秩序……\n\n£gezifu £gezifu 这次很幸运，地主眼里尽管不时闪过不怀好意的目光，但还是没有人动枪。班长甚至掏出了一根烟抽起来。看着眼前一派井然有序的分地景象，看着穷苦农民拿到自己土地之后的激动神情，班长深深地吸了一口烟。这时候一个年轻的战士问他：“班长咋了。”\n\n£gezifu £gezifu “哦没啥，不你班长我陕西人吗……”年轻的战士们并不知道班长的过往。纷纷都围拢了过来。\n\n£gezifu £gezifu “我出生那年日本鬼子刚占了东北，然后我记事的时候红军就来陕北了，我家当年也是这些分地的穷苦老百姓的一员啊……”班长喃喃地说着。\n\n£gezifu £gezifu 有几个机敏的战士意识到了后面的事。\n\n£gezifu £gezifu “可惜啊，陕甘宁啊……这辈子应该还可以回去吧。”\n\n£gezifu £gezifu 很显然，这个班长的家早就毁于抗日战争中，和陕甘宁边区一起。\n\n£gezifu £gezifu “砰砰砰” “来来来接下来烧白条了！”"
 COX.47.t: "回忆"
 COX.48.a: "从来就没有什么救世主，也不靠神仙皇帝。"
 COX.48.d: "£gezifu £gezifu 简陋的脚手架依靠在清真寺洁白的穹顶上，光膀子的民工正热火朝天地挥舞着大锤，太阳毫不吝啬地播撒着炙热的光芒，雪白的砖块携带着如雪的尘土挥洒着，与黝黑的民工形成鲜明对比。\n\n£gezifu £gezifu 数个虔诚的伊斯兰信徒颤抖着跪倒在崩塌的清真寺前，嘴里不停地嘀咕着什么，似乎在向他们的真主求情。更多的信徒只是站在雪白的土灰雨中，憋红着脸，嘴里喘着粗气，一双双硕大的眼睛凝视着眼前不知疲倦的红军战士们。\n\n£gezifu £gezifu “干得不错啊，王副营长，不对，现在得叫王大队长。”小警卫员刘建抖了个机灵。\n\n£gezifu £gezifu “托他们的福，”王兴用笔记本指了指不远处跪拜的阿訇，“公有化宗教场所运动的人手不足，营级以下的干部都被抽调过来了。”\n\n£gezifu £gezifu 王兴话音未落，几个推着装载碎玻璃的小推车的小战士嚷嚷着让两人让路，刘建瞥了一眼车上残破的玻璃：“王大队长，你说奇怪不奇怪，这些玻璃张贴在屋顶上是那样金碧辉煌，被打碎拆下来却如此黯然失色。”说到这里，刘建不禁嘻笑起来。\n\n£gezifu £gezifu 喜怒不形于色的王兴并没有回答小刘的问题，他目光如炬，望向眼前已经失去穹顶的清真寺，嘴里只是揶揄道：“你小子警卫员当得不赖嘛，说话文绉绉的。”\n\n£gezifu £gezifu 见王兴没有继续讨论的兴致，刘建便一头溜进施工现场，寻找需要帮忙的工人们。\n\n£gezifu £gezifu 太阳很快结束了她一天的工作，刘建一屁股坐在尚有余温的草堆上，伸了伸懒腰，脸上仍充满好奇：“王大队长你说，为啥这里的人都这么爱信教呢？”\n\n£gezifu £gezifu 王兴合上笔记本：“因为他们的生活不能自己做主，只能乞求于神佛给予他们一个温饱，可是许多掌握教权的人变本加厉，颠倒黑白，反而让他们更愚昧贫困了。”\n\n£gezifu £gezifu “哼！我就说那几个阿訇没几个好东西。”刘建激动地从草堆上站起来。\n\n£gezifu £gezifu 王兴用宽厚的大手轻轻把小刘拍回草堆上：“不只是教会的人，地主劣绅利用人们对宗教的愚昧盲从，宗教场地的买卖就没有停过，苛捐杂税也愈发严重。”\n\n£gezifu £gezifu “可恶的地主老财，总有一天，咱们要把他们全都打倒！\n\n£gezifu £gezifu 王兴抬头望了望余晖中只剩骨架的清真寺:“我们还有很长的路要走，孩子。”"
 COX.48.t: "坍塌、消失"
 COX.49.a: "似乎是送别一般的歌声。"
 COX.49.d: "£gezifu £gezifu 天已然黑了，新疆的夜可不似内地那么温和，只听呼啸的北风刮个不停，刮的月亮又昏黑了几分，微弱的月光落在了一片白杨树林里，照亮了这些笔直的树。\n\n£gezifu £gezifu 林子中两棵白杨树似乎活了过来，在月光下慢慢地挪动着身影，向着东北方走着。待到风小了一些，才看得清原来是两个裹着毯子、相互搀扶的人。\n\n£gezifu £gezifu 两人穿着一身军装，身上满是白杨叶子和沙土、似乎刚经过了一场恶战，若是不仔细看，在这昏黑的夜里活像两棵白杨树。年轻一些的战士的一只胳膊用碎布条绑在了腰上，他的胳膊似乎是骨折了，只得把一支冲锋枪挂在了胸前，军帽也不知道丢到哪里去了。他正搀扶着那个老一些的人，这老人戴着一副眼镜，一只腿拖在地上，左胳膊已不知所踪，脸上还插着一些可怖的弹片，半个身子都是血，活像一个地狱里杀出来的修罗恶鬼。\n\n£gezifu £gezifu 二人就这么相互搀扶着，顶着北风，向前走着。\n\n£gezifu £gezifu 四周的白杨树笔直地立着，像是哨兵似的，拱卫着这两人，白杨树们无畏的顶着猛烈的北风，在沙土里不折不挠的耸立着。\n\n£gezifu £gezifu 年老的人停下了脚步，似乎是走不动了，他叫喊了几句，便被年轻人强拉着背在了身上。年老的战士没什么反抗的力气，只说着：\n\n£gezifu £gezifu “你快些走，若是为了我拖累到了你，那掩护咱冲杀出来时牺牲的同志们…就死不瞑目了。”这人说话有些文绉绉的，似乎当过什么教书先生。\n\n£gezifu £gezifu “老哥们儿，二次长征你都没…这次可别…”\n\n£gezifu £gezifu 年轻的战士想说些什么，但没说下去，似是没了力气，只是一声不吭地挪动着愈发沉重的脚步，向前走着。\n\n£gezifu £gezifu 白杨树只是极为普通的一种树，在中国更是遍地都是，坚韧的就像中国的农民一样，在西北，你总能看见一株白杨树耸立在一块荒原上，却依旧笔直得很，或是一排白杨树抱在一团，像是哨兵一样，保卫着那一片绿色的青草，不受风沙的侵害。\n\n£gezifu £gezifu 又走了一会儿，北风变得更大了，年轻的战士一个没站稳，摔了，二人都躺在了地上。过了约莫四五分钟，年轻的战士爬了起来，顶着风想把老战士拉起来再背在背上。\n\n£gezifu £gezifu “快，快起来，别睡了，老哥们儿。”\n\n£gezifu £gezifu 老战士没有说话，而是用仅剩的右手，抓下了头上绣着红星的布琼尼帽，递向了年轻的战士。\n\n£gezifu £gezifu “……活下去，戴着这顶帽子，里面有我的津贴，和写给婆娘的书信。”\n\n£gezifu £gezifu 年老的战士目送着年轻的战士顶着风走远了，他感受着自己的身体逐渐冰冷起来，于是艰难地从口袋里摸出半支烟，叼在了嘴上，想靠着烟来烤烤身子，但却没能摸到火柴。他知道自己也许是要死了，但他没想到自己会如此之淡定，或许是见得死亡已多了。\n\n£gezifu £gezifu 他吐掉了烟，用一只手撑着身体，环顾四周顶着呼啸的北风、却屹立不倒的白杨树。\n\n£gezifu £gezifu “呵，这白杨树多像我们啊。”\n\n£gezifu £gezifu 白杨树就是这种平平无奇、却又坚强不屈的树，但它从不会为狂风所屈，它算不得好树，却坚强、正直得很。他有着极强的生命力，就像这片大地上最质朴的那群人一样，抵御着黑暗中刮来的狂风。\n\n£gezifu £gezifu 年轻的战士走得更远了些，老战士躺在地上一动不动。北风更大了，刮得月光又昏黑了下去，但漆黑的夜，刺骨的风，却没能压住一阵沙哑、细微的歌声。\n\n£gezifu £gezifu “仇恨的风在头上咆哮怒吼…黑暗势力向我们下毒手…”"
 COX.49.t: "踽踽独行"
 COX.50.a: "呃……不管怎么说，可喜可贺。"
 COX.50.d: "£gezifu £gezifu 乌里扬诺娃是个做事雷厉风行、说一不二的女同志，或许是因为这一点，毛岸英主席选择委任她为新组建的宗教管理局书记。相由心生，她有一头栗色的长发，多年战斗中打磨出的身体丰腴、高挑，腿修长的像是一只圆规，穿着一双长硬底马靴，就这么吧嗒吧嗒地走在屋里、目不斜视的和人交谈着，美丽且傲慢。\n\n£gezifu £gezifu 宗教事务局的办公楼就在苏维埃大楼旁，现在整个屋子里都是些宗教界有头有脸的人，乌里扬诺娃挥了挥手，几个虎背熊腰的战士便“友好”地请两位活佛、两位老教的阿訇进了一个小房间里。\n\n£gezifu £gezifu “主席同志打算通过地方苏维埃的监督，来管理好宗教…还望多多配合。”\n\n£gezifu £gezifu 乌里扬诺娃的国语说得不是很好，但却很好听懂。几个人就这么聊着，老教的阿訇还好，在见过苏维埃铁拳砸碎了新教的负隅顽抗后都配合得很，而两位有头有脸的活佛就显得有些油嘴滑舌，对着乌里扬诺娃的一句句追问只是打着哈哈，模棱两可地说几句“阿弥陀佛”，也不知是什么意思。\n\n£gezifu £gezifu 两位活佛静静地吃着茶，全然一副滚刀肉的样子，稍微年轻些的活佛的眼珠骨碌碌地打量着乌里扬诺娃。\n\n£gezifu £gezifu “这秃驴是把我当成信众的妻子了吗……这么看着我。”\n\n£gezifu £gezifu 乌里扬诺娃挥了挥手先让两位阿訇出去吃茶，接着压下心头的怒火，耐着心思地问道：“不知活佛可否…交上旧的转世印信，由苏维埃政府管理后续事宜呢…”她挤出了一个柔媚的、带着些皱纹的笑容这么说着。\n\n£gezifu £gezifu “实在是不好意思，我们丞化寺…”年轻一点、大概五十多岁的活佛说到一半，看了一眼身旁的老活佛，在得到了对方的眼神许可后才继续说下去。“我们丞化寺的活佛印信，已经失掉了。”\n\n£gezifu £gezifu 这点小动作被乌里扬诺娃看得一清二楚，她还是维持着微笑，站了起来用盖碗喝了口茶，语气柔和面带笑意地说：“失掉了的意思，是找不见了吗？”\n\n£gezifu £gezifu “是啊，岁数大了容易忘事情嘛，就找不见了。”两位活佛笑盈盈地说道，他们只觉得自己碰上了一个好说话的女人，正为此而暗自庆幸。\n\n£gezifu £gezifu 就在年轻一些的活佛正拿起盖碗吃着茶，细细地品嚼茶叶时，只见乌里扬诺娃一脚重重地踢在了他的脸上，让自己的硬头皮靴和他的脸做了个亲密接触，连带着盖碗都踢了个粉碎，白瓷碎片深深地刺进了他脸上。随后，他只觉一个人粗暴地提起了他的衣领，将他拎了起来，又是一阵雨点般的拳头接连地打在了他的肚子上，打得他痛不欲生。\n\n£gezifu £gezifu 手松开了，年轻些的活佛摔在了地上，张着嘴吐出了几颗门牙和一口血，看着甩着手的乌里扬诺娃，捂着自己的肚子说不出话。之后的事情就简单多了，乌里扬诺娃精湛的外科医术成功地治好了这两个老活佛的失忆，在场的战士都目睹了这一场医学奇迹，两个老活佛在倒豆子般一五一十地说干净后被送去了劳改场。\n\n£gezifu £gezifu 一旁的书记员这么记载着准备呈送给苏维埃主席团的公文：宗教人士们都对苏维埃的宗教集中管理表达了同意，其中两位稍有不理解宗教政策的佛教人士在乌里扬诺娃同志与其交流意见后也表达了赞许。"
 COX.50.t: "能说会道的乌里扬诺娃"
 COX.51.a: "在劳动中感受人类的平等吧！"
 COX.51.d: "£gezifu £gezifu “你们这些旧地主，以前作威作福惯了，如今体验一下曾经被剥削的奴工们干的活就受不了了？”\n\n£gezifu £gezifu 中午，一位迪化来的红军干部不解地看着已经受不了的在改造中的旧地主们。\n\n£gezifu £gezifu 旧地主们要么七零八落地躺着，要么嚼着还算正常的午餐。\n\n£gezifu £gezifu “兵爷啊，我们的情况，您也是清楚的啊！”\n\n£gezifu £gezifu 一个旧地主愁苦地说道。他昔日的罪尚不致死，但还是判了几年劳改，以示惩戒。可他们身体怎么干的动？\n\n£gezifu £gezifu “这座矿坑里头在解放前是奇纳尔的主管的，在他的管理下，每年都有几百个奴工死在里面。如今奇纳尔就在底下挖矿，以前奴工每天挖的工作量的七分之一就是你们每天挖的工作量。而且伙食比你们差得多，他们受得了。你们这些老爷就受不了？感情你们这种素质才是低贱的人是吧？”\n\n£gezifu £gezifu 这个干部嘲讽道：“你们是不是心里还觉得自己是靠脑子吃饭的？如果你们真的比我们以前的矿工们聪明的话，想来也可以想得到一些保持劳动成果同时减少劳动量的活。”\n\n£gezifu £gezifu 这座矿坑除了旧地主们以外，还有昔日的奴工，今日的矿工们在工作。\n\n£gezifu £gezifu 他们这些如同土地一般硬朗的汉子们沉默地吃着午餐，一边吃着，一边认着字。\n\n£gezifu £gezifu “多里库，你在吗？”\n\n£gezifu £gezifu “我在！”\n\n£gezifu £gezifu 一个认字的汉子听到自己名字被叫到后，起立说道。\n\n£gezifu £gezifu “我们复习一下数学吧。你算算你今天上午挖的数量能和几个地主的一样多?”\n\n£gezifu £gezifu 干部递过来一张纸条，纸条上写着旧地主上午挖的数量。\n\n£gezifu £gezifu 这顿时难住了这个汉子，但在干部的帮助下，他还是艰难地算了出来。\n\n£gezifu £gezifu “七个！”\n\n£gezifu £gezifu “累吗！”\n\n£gezifu £gezifu “不累！”\n\n£gezifu £gezifu 干部满意地点点头，回到地主们面前，说道：“我们给你们定的工作量也不是很多，远远比不上一个正常矿工的工作量，但人家干得比你好，还有闲工夫去认字。你们看看，你们和他们，到底是有什么不同的？”\n\n£gezifu £gezifu 旧地主们沉默了。\n\n£gezifu £gezifu “你们以前尊贵之人，可为什么尊贵之人身体没有矿工硬朗，脑子也不如别人灵光？”这个干部质问道。\n\n£gezifu £gezifu 旧地主们沉默了。\n\n£gezifu £gezifu “因为真主保佑。”有个人念叨了一句。\n\n£gezifu £gezifu “真主是如何保佑你们的？保佑你们下矿坑工作？”\n\n£gezifu £gezifu 顿时旧地主们没了声音。\n\n£gezifu £gezifu “你们就多多思考为什么吧？同时在矿坑里体验一下工作，等工作久了，你们大致也明白为什么为什么你们过去的一些认知有多可笑了。”\n\n£gezifu £gezifu 这个干部算了算时间，结束了今天的思想教育。\n\n£gezifu £gezifu "
 COX.51.t: "真主保佑？"
 COX.52.a: "“杂种操的，咋不死了你恁！”"
 COX.52.d: "£gezifu £gezifu 李大有是内地躲避战乱，迁移来的汉人。\n\n£gezifu £gezifu 他不再说什么，而是缩着头慢慢退出了伯克老爷的堂屋，退在了路边蹲着。\n\n£gezifu £gezifu 他是来请求伯克老爷取消减租的，宁愿一切照旧。只因那些大兵前脚一走，伯克老爷就宣布虽然按照新例减租，但不能拖欠任何租子。也就是说他今年会颗粒无收，连豆子、茄子、南瓜这些副产品都要搭上。若是按照旧例，他还能省些口粮来吃。\n\n£gezifu £gezifu 这是他第三次来求伯克姥爷了。但正同以往的两次一样，他的请求落了个空。\n\n£gezifu £gezifu 但他不肯甘心，觉得还该再做一番努力。而且，他更忽然发生一种痴想，以为当着客人在场，伯克老爷也许会赏个脸。他窥伺着，每当他们在寒暄中显出得意的神情时，他也凑趣地笑一笑；同时移向门槛边去，打算有机会就开口；但他总又迟迟疑疑地吞口唾沫完事。\n\n£gezifu £gezifu 实在是忍不住了，开了口。\n\n£gezifu £gezifu “伯克爷…”\n\n£gezifu £gezifu 伯克老爷恶意地笑了下。\n\n£gezifu £gezifu 李大友垂头丧气地回了家，中间还回了几次头，脑海里还是那阵伯克老爷的臭骂。\n\n£gezifu £gezifu “觉得不值当，去找那个毛大人说去，和我扯什么！”\n\n£gezifu £gezifu 他住的村叫枣子包，因为在村口枣树下的一个小土包，村里的土地有五分之一都是伯克老爷管，汉人们不懂新疆土语，便也不叫伯克老爷本名，只叫伯克老爷。\n\n£gezifu £gezifu 伯克老爷招了十五六家佃户，租子比一般取地重。但他有个让手，佃户每年可以酌量拖欠一点，不必一定缴足。而这租子正像一条绳子，捆住佃户们只好终身替他做牛马，没有一个人能够自由自在地活着。\n\n£gezifu £gezifu 李大有奔着家走着，时不时地停下脚步来抱怨两句。他毫无敬畏地咒骂着伯克老爷，也不忘骂几句那个新来的姓毛的军阀，只觉得他的政策害了自己，与自己作对，反而让伯克老爷欺诈性地执行了起来。\n\n£gezifu £gezifu 他走到半路，累了，看着朗朗的晴天骂道："
 COX.52.t: "减租？（一）"
 COX.53.a: "“去我大哥那儿，那里人少！”"
 COX.53.d: "£gezifu £gezifu 路旁钻出一个他要叫做婶子的缺牙老太婆，上前问李大有。\n\n£gezifu £gezifu “又是空跑吧？”\n\n£gezifu £gezifu 李大有怒了，指着天继续骂：\n\n£gezifu £gezifu “还是那个话，让我们去迪化，找那个姓毛的扯！”\n\n£gezifu £gezifu 表婶把嘴唇紧紧抿住一片，然后松口气说：“我就讲那个狗操的老回子说不进油盐吧！早就跟你讲过，赶快搬起走呵！”\n\n£gezifu £gezifu “说不进油盐算了！表婶，他一定要减租，我只有一条命！”\n\n£gezifu £gezifu 李大有这么怒骂着，他是有想过逃的，但家里的老母亲和老婆，加上三个孩子，走起来可不容易，之前有一家佃户逃了，伯克老爷就来警告，再有同类事件发生，他们须得分别偿付逃跑者历年来的拖欠。这就叫他更加为难，又怕牵累旁人，又怕旁人知道了走漏消息。\n\n£gezifu £gezifu “你家大大小小那一窝，比不得我们老两口，做了牛马也无所谓了，由得你了。”\n\n£gezifu £gezifu 婶子唉声叹气着走了。\n\n£gezifu £gezifu 李大有吐出了两个字。“我不！”随即往家里走。\n\n£gezifu £gezifu 家只有三间茅棚，左首一间茅棚的屋顶快要塌了。门前有一小方晒场。晒场尽头便是耕地，相当平坦，母亲正领了大的孙儿在扯豆子。望见儿子走来，她便伸直腰不动了。\n\n£gezifu £gezifu 母亲虽然身材高大，但也只剩下一张皮和一把骨头了，他就这么痴痴呆呆的看着自己儿子走过来。\n\n£gezifu £gezifu 李大有嚷嚷着：“老婶子说得容易，好像蹬草鞋一下就走得了。”\n\n£gezifu £gezifu 母亲拿在手里的豆秸忽然坠下，她苦涩地说：“逃得脱，逃你们的！——不用管我！”\n\n£gezifu £gezifu 李大有沉默了一小会儿，叫道：“让他一锅熬了算了！”\n\n£gezifu £gezifu 李大有老婆是个垮嘴角黄脸女人，她惊惊惶惶从屋里赶了出来，问道：“还是不答应么？！”李大有骂说：“狗操的老回子可恶透了！就咬住那一句话，你拿鸡大腿调他都不换！”\n\n£gezifu £gezifu 深深咽一口气，老婆翻身在门边一段木料上坐下。\n\n£gezifu £gezifu 木料一端泥地上爬着一个两岁多的女儿，穿着破烂，脸上没有一点血色。她在专心一意玩着灰土，现在却向母亲走过去了，但那当娘的劈脸就给她一个耳光，接着又跟孩子一同嚎哭起来。\n\n£gezifu £gezifu 老婆边哭边说：“我看又怎么做！就把豆子秆卖了，也不够她的啦！”\n\n£gezifu £gezifu 母亲颤巍巍说：“我不拖累你们，赶快自己找路子逃命呵！”\n\n£gezifu £gezifu 李大有烦乱地大叫：“逃命？！他要找旁人扯皮啦！你那天听见的……”\n\n£gezifu £gezifu 老婆站起来抓住他：“早听我的话哪有这场事啊？！搬都搬起走了！”\n\n£gezifu £gezifu “搬哪儿去？”"
 COX.53.t: "减租？（二）"
 COX.54.a: "“还走个屁！狗操的老回子明天要派人守山了！”……"
 COX.54.d: "£gezifu £gezifu 当第一次请求失败的时候，她就向丈夫提议过，去找她哥租一点地，阴悄悄搬起走。但大有顾虑多，又对伯克大爷有幻想，现在他可又认悔了。\n\n£gezifu £gezifu 大有软弱的辩护着：“早知道会有佃户先走一步…”\n\n£gezifu £gezifu 老婆也不耐烦了，一屁股坐在地上，像是撒泼似的说：“那一家口就死守在这吧，豆子不够吃了，就卖娃娃，卖我也成！”\n\n£gezifu £gezifu 李大有不知道说什么好，只顿足大骂：“妈的…”\n\n£gezifu £gezifu 他又心里怨恨起了那没见过的毛大人，因为没有减租的话是不会出这一堆麻烦的。当减租法令刚才传播开来的时候，正同旁的佃户一样，他也着实高兴了一通。以为租子既然很重，今年又是歉收，这一来可以少带一点账了，哪里知道伯克老爷一减租又是欺诈！\n\n£gezifu £gezifu 老婆和母亲也没地方撒气，便也跟着骂了起来，待到怒气发泄够了，老问题又强迫他们做答案了：死守呢或者跑掉？\n\n£gezifu £gezifu 李大有连夜去了妻子的大哥那，那是一个十分偏僻的山沟。\n\n£gezifu £gezifu 大哥不知道说些什么好，他在这儿住了三代人了，很清楚这一带的实际情形，做梦都想能够往出面搬。即或没办法在坝里租庄稼，便是山地也好。因为这儿实在是太荒凉了，便是山岳林莽都对人不和气。而且租佃条件也不便当，住下去永无翻身之日！\n\n£gezifu £gezifu “其实搬上来做啥呵！”大哥问道。\n\n£gezifu £gezifu 大有绝望地插嘴说：“没地方好走啦！眼前就没口粮。”\n\n£gezifu £gezifu 大哥插嘴说：“那就只好上来拖了！拖一辈子，就跟我样！”\n\n£gezifu £gezifu 大有抽口气勾了头；但他忽又扬起脸呼嚎道：“我也只求眼前能够拖起走呵！”\n\n£gezifu £gezifu 事情很快就决定了，由大哥来做保，帮大有向这儿的伯克租了地。\n\n£gezifu £gezifu 这儿的伯克老爷叮咛说：“减租，我这儿可不兴啊。”\n\n£gezifu £gezifu 大有情急地连连说：“不！……不！……不减租！”\n\n£gezifu £gezifu “对喽，拖欠一点又算啥呢，别太认真，你去问问你大哥，他还拖着不少呢。”\n\n£gezifu £gezifu 大哥忸怩一笑，随即叹口气道：\n\n£gezifu £gezifu “所以只好永远都替你变牛啰！”\n\n£gezifu £gezifu 然而，大有是没法顾到这一层的，只要目前不会逼得上吊，就万幸了。\n\n£gezifu £gezifu 李大有一路向着家走去，一路老是设想，他应该怎么做？但他终于也想通了。装作走亲戚样，先让母亲带了大娃动身，然后老婆带两个小的走。自己压后搬运家具。而这么一来，便是抄小路也容易多了。因为他家具并不多，所有的破烂装不满一担箩筐。走到村口时已经半下午了。中途他碰见表婶在路边息气，身后立着一个背篼。\n\n£gezifu £gezifu 表婶是才推了磨回去的，她带点责难地迎着他说：“三番两次劝你不肯听啦！”\n\n£gezifu £gezifu “狗操的老回子…！”听了婶子的话，他赶紧奔着家走去，一路上垂头丧气的。\n\n£gezifu £gezifu 老婆正在阶沿上奶孩子，看他满面晦气，她带点担心问道：\n\n£gezifu £gezifu “地没有租好哇？”\n\n£gezifu £gezifu 李大有没有答；于是老婆的疑心更加重了。\n\n£gezifu £gezifu 老婆紧接着抱怨说：“我就猜到了吧！上面到处都是荒地……”\n\n£gezifu £gezifu 李大有翻身跳起来了，哭声哭气地反问道：“你就晓得我地没有租好哇？！……”\n\n£gezifu £gezifu 老婆害羞地笑起来，叹口气说：“看你那张马脸……”\n\n£gezifu £gezifu 李大有打断她，说：“只有你才高兴得来，心里想走就走掉了！”\n\n£gezifu £gezifu 母亲边从屋里出来边说：“不用管我，——地租好就快走呵！”\n\n£gezifu £gezifu 李大有跺脚甩手地大叫道："
 COX.54.t: "减租？（三）"
 COX.55.a: "至少这笔钱省下来了。"
 COX.55.d: "£gezifu £gezifu 今天是一个令人高兴的日子，整个吐鲁番县城都沉浸在喜悦的氛围中。无论是街上的行人还是路边卖馄饨的小贩，脸上都堆满了笑容，一些高兴的人甚至在街上跳起了舞。\n\n£gezifu £gezifu 馄饨摊的小贩穆罕穆德-吾布力正聚精会神地揉搓着手里的面团、他勤快得很，从烤馕、到馄饨、拉面他都会，但即便如此，每年也攒不下几个银钱来，以往的阿訇来吃饭都不会给钱，每个月还有香油钱、念经钱、什一税，说是什一税，但实际上收的跟什二税差不多。每次阿訇嘴上念叨着真主与你同在，带着一堆打手来收税的时候，吾布力只能嘴里小声念叨着“驴日的穆罕穆德，搞出这一帮徒子徒孙。”然后乖乖交税。\n\n£gezifu £gezifu 这税交了好些年了，每年都会精确地把吾布力的一丝积蓄卡走，渐渐地他觉得努力劳作也没什么出路，整个人无精打采的。\n\n£gezifu £gezifu 但今天不同以往了，已经到了收税的点儿，裹着头巾的阿訇还没有来，这让吾布力很是好奇。直到来了几个老客人，李哥儿和小阿里，他们都是附近货站的挑夫、往日里下了工交了税都没什么余钱，只能买几碗拉面来吃，但今天却不同以往、兴冲冲地点了几大碗肉馅馄饨，又要了几碗酒。吾布力觉得很奇怪，一打听才知道，从迪化来了新规定，除却天课以外的一切香火税从今天开始都可以不用缴纳了。\n\n£gezifu £gezifu 李哥儿说着说着，从汗水浸透的背心内口袋里小心翼翼地拿出了《星火报》、磕磕巴巴地读了起来。\n\n£gezifu £gezifu “勒令一切新教阿訇与相关清真寺，即日起不得再征收天课外所有税金……”\n\n£gezifu £gezifu “李哥儿，这新教阿訇是个嘛啊？”小阿里插嘴道。\n\n£gezifu £gezifu “我也不知道……”李哥儿擦了一把汗，放下报纸拿起了酒碗。“管他是个嘛，谁不收税我就拥护谁。”\n\n£gezifu £gezifu 小阿里和李哥儿吃完喝完便挥手与吾布力告别。这个馄饨摊主一边收拾着碗筷，一边默默地想着。他不知道这新出台的政策到底对不对，但是心里却暗暗感到窃喜。"
 COX.55.t: "馄饨摊上的新一天"
 COX.56.a: "“姑娘，你们那还缺人手吗？”"
 COX.56.d: "£gezifu £gezifu 新疆的清晨来得很早。天空的远处还悬挂着模糊的月亮，气温还有些寒冷，但阿卜杜勒早早就起来整理农田了。阿卜杜勒嘴里吐出一团白雾，两只手从兜里掏出来使劲搓了搓。\n\n£gezifu £gezifu 打开牛圈的大门，一股酸臭味扑面而来，他下意识地用手掩住口，轻轻咳嗽了两声。然后他左手按住右手臂的关节，使劲向上掰扯。“这身体，一天不如一天了……”\n\n£gezifu £gezifu “爷爷，爷爷，您这么早又要出去干活啊，换我来吧，您都这岁数了！”尼叶蒂从里头跑出来，拉住他的手。\n\n£gezifu £gezifu “不行！”他拍掉孙女的手，“你这丫头，快回去把泥糊脸上！小心又被人看到了！” 尼叶蒂脸色一下子阴沉了下来，头一低，立刻向房里跑去。看着孙女回去的背影，他眼一酸，但还是忍住不让泪水流出来。这日子可怎么过啊！明天地主就要来收租，大后天那群阿訇们还要来收开斋捐。要是只要钱就算了，那个叫巴拉提的还看上了自己的孙女。见鬼，如果那条该死的狗敢碰她一下，阿卜杜勒发誓一定要和他拼到最后一口气。\n\n£gezifu £gezifu 尼叶蒂回到房间，小心翼翼地从枕头底下抽出一张传单。她偷偷地跑出去在窗外听过几次那个什么中国旅开的扫盲班，所以认识几个大字，但是最耀眼的还是那颗红星。“池……赤纬……卫队……团结，团结……解法……解法新教……”\n\n£gezifu £gezifu 她下定决心了。那天巴拉提的眼神扫到自己那一刹，她就清楚这一切不可能和平结束。她活到现在一直很胆小，但是当她想到秋毫无犯的中国旅，想到扫盲班里那些朝气蓬勃的战士和他们在扫盲班放学的时候笑着对她说“有困难来找我们”，心中就多了几分勇气。她拿上传单，跑出门……\n\n£gezifu £gezifu 杨威正坐在板房里打转。房间里坐满了新招募的赤卫队队员。自打中国旅的战士分散下乡，武装也分散了。他的队伍里不是贫苦农民就是被中央团结的老教阿訇，武器基本都是鸟枪土炮，和割据势力硬碰硬肯定吃亏。但如果能抓到那些新教阿訇和地主之间利益勾结的证据……\n\n£gezifu £gezifu 在最近的调查中，他很清楚地了解到底层人民都处在爆发边缘了。只需要星星之火，就可以燎遍草原。\n\n£gezifu £gezifu 房门被叩响了。杨威下意识就拿起手边的莫辛纳甘步枪一拉枪栓，但是被老赵拉住了。\n\n£gezifu £gezifu “你听这声音！”\n\n£gezifu £gezifu “我们的下线也不是今天交接啊？”\n\n£gezifu £gezifu “怪了，先看看是谁吧。”\n\n£gezifu £gezifu 赵锋把驳壳枪拿在手上，无声无息地靠近门，透过门上的猫眼往外看——一个小女孩正一脸焦急地站在门口——他认得她，扫盲班的一位学生。\n\n£gezifu £gezifu 他开门把她放了进来，瞅了瞅外面有没有人，然后迅速关闭了大门。\n\n£gezifu £gezifu “求求你们，帮帮我爷爷！明天地主就要来收租了，后天巴拉提还要，还要……”\n\n£gezifu £gezifu “姑娘，你慢点说，巴拉提是谁，怎么了？”\n\n£gezifu £gezifu “地主告诉巴拉提，就是那个阿訇，说我长得挺漂亮，然后巴拉提就要，就要强行娶我！”\n\n£gezifu £gezifu 杨威拿起一本厚厚的册子翻了起来。\n\n£gezifu £gezifu “老赵，巴拉提不在名单上，应该是新教份子。”\n\n£gezifu £gezifu 思索了一会儿，杨威露出了一脸狡黠的笑容："
 COX.56.t: "不义的婚约（一）"
 COX.57.a: "反动的家伙，你们骑在人民头上作威作福的日子到头了！"
 COX.57.d: "£gezifu £gezifu 巴拉提一脸威风地走进了阿卜杜勒家，地主早就站在门口了，两人一脸坏笑地走向那个低矮的地板房，边上一个佣人吓得哆哆嗦嗦的：“大-大-大-大-大爷，这是您-您-您-您的茶-水-水-水……”\n\n£gezifu £gezifu “巴拉提，我早和你说了，收完租你来要开斋捐，然后五五分成嘛！我和你说，那些蠢驴们怎么懂嘛，你就再来个其他什么捐啊，功啊啥的，就说可以让真主早早降临不就完事了……嘿嘿嘿！”\n\n£gezifu £gezifu “穆罕默德，你这笨脑子怎么现在这么灵光了！好主意啊！不过先去看你说的那个天仙美人儿！而且我和你说，马家军那边，我早就联系上了，怕什么最近那批红匪流动？哈哈哈哈！”\n\n£gezifu £gezifu “就是，什么日本人俄罗斯人汉人，钱在我们手里就是赢！哈哈哈哈哈哈！”\n\n£gezifu £gezifu ……\n\n£gezifu £gezifu 两人得意忘形，全然没注意到旁边的那个佣人早就消失无踪了。\n\n£gezifu £gezifu 就在两人得意忘形的一刻钟后，街上所有的广播喇叭全部响了起来。 “巴拉提，我早和你说了，收完租你来要开斋捐，然后五五分成嘛！……”\n\n£gezifu £gezifu ……\n\n£gezifu £gezifu 此时两人还在勒索阿卜杜勒，听到广播后面面相觑，呆在了原地。\n\n£gezifu £gezifu “什么情况？”\n\n£gezifu £gezifu 围墙外已经开始聚集起愤怒的人群。赵峰顺势撞开了门。“乡亲们，你们听到了吗！跟我进去，把他们两个抓起来！”\n\n£gezifu £gezifu 此时，在城镇中心的广播塔上面，杨威用望远镜注视着这一切。他边上放着一个小铁盒子。\n\n£gezifu £gezifu “这留声机挺好用啊，盛世才那家伙好玩意还真不少。”\n\n£gezifu £gezifu ……\n\n£gezifu £gezifu 愤怒的人群已经如同潮水一样冲进了大院……"
 COX.57.t: "不义的婚约（二）"
 COX.58.a: "吃我红军铁拳吧，反动派们！"
 COX.58.d: "£gezifu £gezifu “他妈的，一定要杀得这帮反贼五十年内不敢张嘴吱声！”\n\n£gezifu £gezifu 一位苏维埃委员做了批示，政治保卫局又有活儿干了。\n\n£gezifu £gezifu 李国福正拿着看着手上的文件，见了脏话就猜到了是哪位委员做的批示了，他了然于胸地上好了子弹，喊着同志们坐上卡车出发，奔向了迪化人民法院。\n\n£gezifu £gezifu “既然是那位首长下的指示…应该就是重拳出击的意思。”他这么理解着，毕竟那是一位对反动派杀人不眨眼的首长。\n\n£gezifu £gezifu 迪化人民法院今天特别热闹，但并不是前来打官司的群众，而是各个民间法庭的“执法队”把这里围了个水泄不通。\n\n£gezifu £gezifu 在今天上午，一对青年男女因为一些琐事，被一个小宗教法庭判处了鞭刑，心有不甘的他们选择来到了人民法院，寻求“真主的红军”的庇护，但也引来了一群手持长刀短枪的民间法庭“执法队”，他们早就对迪化人民法院的“垄断司法权”而心有不满很久了。\n\n£gezifu £gezifu 门口的士兵正在制止他们进入法院，几个少数民族的干部也在用方言劝导着他们。\n\n£gezifu £gezifu “这里是人民法院…你们不能进去拿人！”\n\n£gezifu £gezifu “人民法院？只有真主和阿訇才有资格审判恶人！”\n\n£gezifu £gezifu “你们快下去，再过来我就要动手了！”\n\n£gezifu £gezifu 但这将近百人的队伍可不认什么理，一个大胡子的人挥了挥手，看起来是要攻打人民法院了。门口站岗的两个战士就像两个小芝麻粒，快要被“执法队”们淹没了，靠前的几个人已经开始抢夺起战士的枪支了。\n\n£gezifu £gezifu “吱——嘎——”伴随着一阵刺耳的刹车声，武装到牙齿的战士从两辆卡车上跳了下来，为首的正是政治保卫局直属中队队长李国福。\n\n£gezifu £gezifu “操你妈的，你红军爷爷来了！”一个高个子的战士见状怒吼道。\n\n£gezifu £gezifu 战士们冲进了人群之间，几个不长眼的“执法队”还鸣枪抗议、试图抢夺战士们的枪支，甚至有胆子大的把枪口对准了战士们，突然，一个戴着头巾的男人手里的枪走火了，打在了一位战士的脚边上。\n\n£gezifu £gezifu 空气为之安静了一瞬，这声枪响成功地引燃了火药桶，战士们怒吼着冲了上去，迎接暴徒的只有枪托和子弹。在打倒了几十个暴徒、枪毙了几个顽固分子后，李国福被铁砂枪打中了胸口，幸亏装药少，只是浑身上下都是血看起来吓人，他像一尊杀神一般，成功地带着战士们抓住了正要逃跑的大胡子，随后又缴了“执法队”们的械，把他们用绳子栓成一条线，在群众的叫好声中，用枪押送进了迪化人民法院。\n\n£gezifu £gezifu 迪化人民法院的第一次庭审，开始了。\n\n£gezifu £gezifu 从今往后，南疆的反动派在反抗苏维埃政府的政令之前，都要好好掂量掂量了。从此之后也出现了一个啼笑皆非的传闻——“迪化汉人军队的兵都有真主护体，刀枪不入，凡俗的枪炮都伤不了他们。”"
 COX.58.t: "废止私刑！"
 COX.59.a: "属于人民的解放。"
 COX.59.d: "£gezifu £gezifu 哈兹若有所思地盯着那箱过去比与其等重的黄金更贵重，但现在一文不值的草纸，虽然还是夏天，太阳落下的很晚，但是西山上的太阳已经很暗淡了，红红的一大轮挂在天边，甚至可以直视它，但是和一般的这个时候不一样，哈兹的影子并没有在他身后拉成一条长长的线，而是在脚下聚成一团。这是因为他手上的火把正发出璀璨的光，将阴影逼进了脚下。\n\n£gezifu £gezifu “这就是全部了吗？”两个汉子抬过来另一个大箱子，里面装着同样的草纸，哈兹朝他们挥手示意“对，这就是全部了！”两个汉子把箱子丢在地上，说：“八什老爷家我们翻了个里外朝天，羊毛堆我们都翻了三番，不可能再藏一张欠条啦！”\n\n£gezifu £gezifu “好小子，干得漂亮！”哈兹笑了起来，把火把凑近那堆草纸，火光映照出纸上的字迹：“赫勒古乡阿里普，今借粮十斤，定息二厘……”借条并不长，但是后面续了五六个补正记号，显然阿里普并没有按时还上粮食……哈兹微微一笑，三年前阿里普跳河的原因可能找到了。\n\n£gezifu £gezifu 不过，那些都不重要了。哈兹一把掏起一沓草纸“乡亲们，咱们清点一下！听好名字！”他低头看了看那沓纸“亚里坤家的地契！五亩！”\n\n£gezifu £gezifu “在！”亚里坤举起手，他瘦得像根柴，但是眼睛里却射出一股光。\n\n£gezifu £gezifu “艾孜买提的欠条！五十斤粮！”\n\n£gezifu £gezifu “在！”艾孜买提也举起手，瘦的凹陷下去的脸上带着灿烂的笑。\n\n£gezifu £gezifu 清点工作并不是那么容易，把整整五个大箱子装满的地契和欠条即便是把名字都念一遍也不是一件容易的事，天慢慢地黑了下去，哈兹的影子在火光的照耀下在身后拖成长长一条。而乡亲们或站着，或坐在地上，认认真真的听着哈兹的点名。\n\n£gezifu £gezifu “这就是全部了！”哈兹念完了最后一个名字，他扫视着广场“还有哪家人没有点到吗？”\n\n£gezifu £gezifu “没有了！”一个年轻人答道，脸上溢满了喜悦。\n\n£gezifu £gezifu “好！”哈兹笑了起来，把手上那沓草纸丢在地上——那些地契和欠条已经在地上堆成了小山，然后像一个孩子点燃二踢脚那样，慢慢的把火把凑上去，干燥的草纸在瞬间就燃烧了起来，火焰将纸堆吞进腹中，发出满意的爆鸣声。\n\n£gezifu £gezifu “沙迪尔的名字到处传，十五岁就成了英雄汉;头一次让清军抓了去，就被发配到考姆勒尖……”\n\n£gezifu £gezifu 不知道是谁低声唱了起来，马上就引来几个人跟着应和：\n\n£gezifu £gezifu “层峦叠嶂的天山，是我可爱的家园;如何是你当道嘛，县官，要杀要砍随你便!”\n\n£gezifu £gezifu 歌唱的人越来越多，一些小伙子们拍起手来：\n\n£gezifu £gezifu “囚禁在衙门的牢房，头发长得有三尺长;我拿肋骨当尖刀，定要凿通这牢狱的高墙!”\n\n£gezifu £gezifu 几个小伙子和姑娘跳到广场中心，跳起舞来。\n\n£gezifu £gezifu “喂！哈兹！别傻站着！把我的都塔尔拿来！”一个老者挤进来，瘦削的身躯发出和年龄完全不匹配的洪亮歌声：\n\n£gezifu £gezifu “翻过了一山又一川，两腿累得直发酸，烧焦皮裤当饭吃，简直像鲜美的羊肝。”\n\n£gezifu £gezifu 都塔尔被拿过来了，老者席地而坐，边弹边唱，众人伴着火光，翩翩起舞：\n\n£gezifu £gezifu “我爬出了衙门的监牢，又集拢了昔日的伙伴;跟那追来的清兵，激战了三夜三天。”"
 COX.59.t: "烈火熊熊燃烧"
 COX.6.a: "或许我应该看看这是什么样的光芒？"
 COX.6.b: "也许只是又一次打雷，还是继续工作吧。"
 COX.6.d: "£gezifu £gezifu 又是繁忙的一天。自新疆革命成功后，毛岸英就由一位小小的旅长，转变成了全新疆的主席。当然，职位的晋升并不意味着好事；南疆暴动、土地问题以及混乱的边界，各种各样的事务无时无刻不在困扰着这位年轻的主席。正当毛岸英伏案处理事务时，一道刺眼的光芒突然从窗外闪过。这时他想到："
 COX.6.t: "迪化一夜"
 COX.60.a: "前方的路依然很长。"
 COX.60.d: "£gezifu £gezifu 周有明觉得自己喝得太醉了。他听得到枯枝燃烧时噼啪作响的声音，知道欢宴的群众已经各自回家，而火塘也已几近熄灭，但眼前只能糊糊涂涂地看到大片的黑色与跳动的橙色斑块。这个半老头子从没像今天这样高兴，一不留神多喝了几杯酒，意识就模糊起来。四周的空气越来越冷，周有明紧了紧披着的大衣，揉了揉眼睛，直起身来。\n\n£gezifu £gezifu “回去吧。”\n\n£gezifu £gezifu 不知是托揉眼睛的福还是冷风让他头脑清醒的缘故，周有明总算能勉强看得清了。这时他才注意到，行将熄灭的火塘边还坐着一个人。那是一个叫吾拉木的维吾尔族红军战士，地方上新征募的民兵队的队长。吾拉木用树枝拨着火，好让不旺盛的火烧得久些。他看到周有明直勾勾地盯着他，露出了一个不太熟练的微笑。\n\n£gezifu £gezifu “我想给你看一样东西……没想到你能睡到现在。”\n\n£gezifu £gezifu 一边这样说着，吾拉木扬了扬手里捏着的纸片。周有明摇摇晃晃地走过去，接过那张纸片。这似乎是被投入火中的一份地契，但是焚烧得并不充分，字迹仍然可以辨认。他看不懂维语，也不知道吾拉木从灰烬中扒出它的用意，只能把纸片又递还给吾拉木。\n\n£gezifu £gezifu “很抱歉……”\n\n£gezifu £gezifu “这不是地契。”吾拉木打断了他的话，“这是一份维语抄写的经文——”\n\n£gezifu £gezifu 周有明被酒精麻醉的大脑猛地清醒了。\n\n£gezifu £gezifu “——恐怕是害怕伯克事后又追讨地契吧。”\n\n£gezifu £gezifu 吾拉木揉了揉那份假地契，把纸团子扔进了火塘，然后站起身来。\n\n£gezifu £gezifu “具体是哪几个人，我心里也大概有数。他们和我一样，不善于撒谎。所以才会烧得慌慌张张。”\n\n£gezifu £gezifu 他握住了周有明的手。\n\n£gezifu £gezifu “周同志。我见识过伯克们拷打佃农的手段，我自己就被狠狠地殴打过。想要克服这种恐惧是不容易的……老实说，我本以为今天会有更多的人用假地契糊弄，但是我错了。我们真的给了他们希望。”\n\n£gezifu £gezifu 周有明不知道该说什么，但他感到自己比醉酒时还要激动。\n\n£gezifu £gezifu “所以，我们也一定要对得起他们的信任。”\n\n£gezifu £gezifu 说完，吾拉木松开了手。他的微笑仍然很不熟练，看起来有些古怪，但充满了热情与决心。"
 COX.60.t: "小小的忧虑"
 COX.61.a: "真主准许买卖，而禁止利息。"
 COX.61.d: "£gezifu £gezifu “木合塔尔·木拉提！快把这个月的利钱还了！“\n\n£gezifu £gezifu 木合塔尔忽然听到有人在一边拍打着大门一边喊着他的名字。低矮阴暗的屋子里没有电灯，他睁开眼睛仔细地听了片刻，知道这不是和加派来催税的狗腿子，于是摇了摇头，开始准备起今天的礼拜。\n\n£gezifu £gezifu 木合塔尔·木拉提是断崖村的阿訇。结婚、屠宰、割礼、起名，村里的重大事务，样样都要他参与。有时还要给村民讲经，处理邻里纠纷。然而他的身份并不能改变他的命运——他的积蓄早已被和加盘剥得一干二净。这村子里，十户有八户用的是和加的土地，剩下那两户也给和加的水井交钱。但是所有的村民都或多或少欠和加的钱。上次艾哈迈德的儿子生大病，借了和加的马车，孩子是救回来了，但是债也还不完了。\n\n£gezifu £gezifu 再这样下去，怕是这座小屋都要被和加收去。\n\n£gezifu £gezifu 木合塔尔正思索着如何脱身，以至于都没发现几个穿着绿色军装的人站到了他面前。\n\n£gezifu £gezifu ”对不起，现在还没到礼拜的时间。“\n\n£gezifu £gezifu ”你就是这里的阿訇吧，我们有事找你。“\n\n£gezifu £gezifu “度改工作队？”\n\n£gezifu £gezifu ”土改工作队，你们村的情况我们都了解了，那个和加放高利贷，强抢土地，我们要把他的地分给穷人。\n\n£gezifu £gezifu “你是阿訇，在村里有很高的威信，我们要你帮忙发动群众。明天，我们会开诉苦大会，我们需要你带个头。“\n\n£gezifu £gezifu 木合塔尔想起来自己来到断崖村当阿訇的初衷，他想起来自己年轻的时候，也想要保护一方村民，指引他们正路。难道说自己跟着师傅学习经法那么多年，就是为了被恶霸欺负？\n\n£gezifu £gezifu ”我帮你们。“\n\n£gezifu £gezifu 第二天，木合塔尔站在全村的广场中间，他从来没感觉断崖村的太阳有这么热。台下有和加的狗腿子，也有老实巴交的村民。村民的眼睛都巴望着他说些什么。\n\n£gezifu £gezifu 木合塔尔害怕，但他知道，他必须迈出这一步。\n\n£gezifu £gezifu 如果债务者是穷迫的，那末，你们应当待他到宽裕的时候；你们若把他所欠的债施舍给他，那对于你们是更好的，如果你们知道。\n\n£gezifu £gezifu 信道的人们啊！如果你们真是信士，那末，你们当敬畏真主，当放弃余欠的利息。\n\n£gezifu £gezifu 吃利息的人，要像中了魔的人一样，疯疯癫癫地站起来。这是因为他们说：买卖恰像利息,奉到主的教训後，就遵守禁令的，得已往不咎，他的事归真主判决。再犯的人，是火狱的居民，他们将永居其中。\n\n£gezifu £gezifu -第2章，第275节"
 COX.61.t: "虔信者与被离弃的"
 COX.62.a: "“我的汇报完毕，感谢诸位同志以及乡亲群众的收听！”"
 COX.62.d: "£gezifu £gezifu 一月一度的农会月度大会召开了，刚刚被民主投票选中的新农会负责人哈迪克手里攥着演讲稿，十分紧张，还有几分钟就要上台总结月度工作了，这是他第一次面对这么多人进行演讲，而在半年以前，他还是农奴主手下一个没有名字的两脚牲口，他忘不了那天下午在广场看红军枪毙农奴主的场面，从那一刻开始，他成为了一个真正的人。\n\n£gezifu £gezifu “下面请哈迪克同志进行这个月工作总结报告！”\n\n£gezifu £gezifu 这句话将哈迪克从回忆中拉了过来，他展开已经被手汗浸湿的演讲稿，怯着步伐走上临时搭建的演讲台，看着下面齐刷刷坐着的整齐的同志们，他有些眩晕了。\n\n£gezifu £gezifu “同……志们，乡亲群众们！”哈迪克的汉话说得还不够流利，但这已经是他半年多以来天天努力学习的成果了。\n\n£gezifu £gezifu “自从我们的农会建立以来，我们农会和周边的三个村子合作，彻底肃清了地主和奴隶主们，废除了严苛的土地私有制，建立了土地公有制，使得每个人都能拥有自己的土地，感谢前任农会领袖谭家立同志的忘我工作！”\n\n£gezifu £gezifu 谭家立坐在第五排，笑着跟人们鼓起了掌，这个哈迪克，竟然拍他的马屁，会后得好好批评一下他。\n\n£gezifu £gezifu “这个月，我们农会又进行了根除不良习俗的运动，直到昨天，我们成功动员了妇女进田劳动，让她们不再被禁足于家中，我们还将村中的清真寺改造成了红军小学，让村中的男孩和女孩拥有同样平等的受教育权利，这是非常可贵的，我们要在平时的日常生活中尽量减少宗教的余毒继续毒害我们的下一代！”\n\n£gezifu £gezifu 又是一阵激烈的掌声，哈迪克似乎已经被同志们的激情彻底点燃了，他的汉语也越说越流利。\n\n£gezifu £gezifu “接下来的一个月，我们农会要和周围村庄进行合作，建立农民卫队，目的是保卫目前根据地的改革成果，以及清缴几个村庄周围的土匪流寇，这项工作现在已经开始实施，另外，农会还要积极扩充会员规模，我们农会终究不是高高在上的，我们要与群众们结合起来，争取让所有村民全部加入农会！这是一个长久的目标，需要所有同志们的努力！”"
 COX.62.t: "汇报大会"
 COX.63.a: "好同志……"
 COX.63.b: "我们承受不了更多的损失了。"
 COX.63.d: "£gezifu £gezifu 天蒙蒙亮的时候。\n\n£gezifu £gezifu “主席！”秘书不顾礼节地冲进了正在开会的办公室，毛岸英看了这位气喘吁吁的秘书，安慰道：“不着急，慢慢说。”\n\n£gezifu £gezifu 毛岸英带着陈潭秋一行人走了出去，伴随着秘书磕磕巴巴的解说，他走到了苏维埃办公楼的大门口。\n\n£gezifu £gezifu 一位生死未卜的战士伏在地上，一只手还抓着一直布琼尼帽。他的身边有好几个警卫战士，为首的一个战士见了岸英，上前敬了一个礼，说道：\n\n£gezifu £gezifu “主席同志，这位同志是来通知迪化郊区三十公里的硫磺村农会组织受到了还乡团的报复，赤卫队们都牺牲了…”\n\n£gezifu £gezifu “先不管这个，这位同志怎么样了？”毛岸英焦急又失仪地问道，他不想再失去更多的同志了。\n\n£gezifu £gezifu “那是他见了我们…说出的唯一一句话，他的血…都流干了。”\n\n£gezifu £gezifu 毛岸英握紧了双拳，随后赶过来的陈潭秋和陈赓，听了这话也沉默了下来。"
 COX.63.t: "踽踽独行"
 COX.65.a: "出动民兵！"
 COX.65.b: "按兵不动。"
 COX.65.d: "£gezifu £gezifu 被抢了！"
 COX.65.t: "遇袭"
 COX.66.a: "没有民兵部队，我们什么也做不了…"
 COX.66.d: "£gezifu £gezifu 被抢了！"
 COX.66.t: "遇袭"
 COX.67.a: "出动民兵！"
 COX.67.b: "按兵不动。"
 COX.67.d: "£gezifu £gezifu 被抢了！"
 COX.67.t: "遇袭"
 COX.68.a: "没有民兵部队，我们什么也做不了…"
 COX.68.d: "£gezifu £gezifu 被抢了！"
 COX.68.t: "遇袭"
 COX.7.a: "但愿我们在下个月能做得更好。"
 COX.7.d: "£gezifu £gezifu 致苏维埃中央：\n\n£gezifu £gezifu 我们在上一个月的工作中取得了一些成绩，但是总体而言，做得还是不够好。我们的政策不够连贯，推行政策的空窗期让反革命分子得到了可乘之机——他们散布谣言，声称苏维埃的革命势头已经到此为止了，地主老爷们很快就会重新掌握乡村地区的秩序。虽然我们的战士们已经尽了最大的努力来驳斥这种胡言乱语，但还是无法避免局部恐慌的发生。如果我们并不打算向农奴地主作出妥协，就有必要加快我们的进度了。"
 COX.7.t: "月度报告"
 COX.70.a: "但他再也没有机会回家了。"
 COX.70.d: "£gezifu £gezifu 意识从朦朦胧胧中归来，在无人问津的深夜，赵白才依稀记得，自己是八十八旅的一名下乡战士。\n\n£gezifu £gezifu 有了自我意识，他的眼皮才缓缓睁开。\n\n£gezifu £gezifu “扑簌扑簌。”耳边忽然传来了食腐鸟类拍打翅膀的声音，不仅如此，拍打的翅膀打在了意识还很模糊的赵白头上，更是让他现在的情况雪上加霜。\n\n£gezifu £gezifu 在被翅膀拍打的几个瞬间，他的大脑一片空白。半晌，他才意识到，自己正被吊在村外的树上。\n\n£gezifu £gezifu 是的，是这样没错，为了动员农民群众，他和同伴来到农村劝说农民们参与革命，打地主，分土地。可并没有人理他们。他在喊口号的时候，看着麻木的农民们，也感觉到无力感。他感觉到十分无力。\n\n£gezifu £gezifu 悲剧不仅仅于此，在这里的农村，农民们是十分笃信宗教的，一般的主管宗教的人士叫阿訇，就和神父差不多。很多情况下。阿訇老爷和巴依老爷串联一起，在精神上蒙骗老百姓，在物质上盘剥老百姓。他们驻村工作没几天，这里的反动势力就联合起来，在一次半夜偷袭了他们。\n\n£gezifu £gezifu 回忆到此而止，他缓缓睁开了眼睛。\n\n£gezifu £gezifu 他的眼中，看到了新疆大地伸手不见五指的黑夜，只有一轮明月，斜挂在天边，反射着来着太阳的光，但这光十分的微弱，微弱到，连前路都看不见。\n\n£gezifu £gezifu 痛，全身都在痛，被反动分子抓住后，他先是被挂起来游街，之后又被麻木的农民们围殴，之后被挂在树上，被食腐动物啃食。\n\n£gezifu £gezifu 他活不久了……他有些怀念地再看了眼这个人间,他不怪罪麻木的农民们，不应该寄希望于自己振臂高呼农民就一呼百应参与……这种革命只存在于幻想之中，必须要有具体行动唤醒人民……因为只有人民才是一切……\n\n£gezifu £gezifu 但赵白知道，自己没有机会了，因为他就快死了。\n\n£gezifu £gezifu 他曾幻想过很多次回家的场景。"
 COX.70.t: "举步维艰"
 COX.71.a: "必须想办法唤醒阶级意识。"
 COX.71.d: "£gezifu £gezifu 根据组织的安排，我组于半月前开始在阿克苏的农村地区进行了初步的社会状况调查，除了对当地的农业生产状况和生产关系进行初步调查，还根据中央的精神重点对农奴阶级的阶级意识进行了研究，即本报告的主要内容。\n\n£gezifu £gezifu 由于时间有限，当地群众亦对我党不熟悉，虽说我党的行动干部不用像一开始一样时时刻刻担心生命安全，但为了安全起见，我组采用了低调谨慎的调查方法，以免引起反动派的警惕，对同志们造成不必要的风险。这样获得的信息虽然来源广度与调查深度都十分有限，但依然可以如实反映阿克苏当地封建农村的现实状况，为土地改革的推进提供参考。\n\n£gezifu £gezifu 在调查中我们发现，至少在阿克苏当地，以农奴为代表的被压迫阶级对革命的态度远不如我们之前设想的那样热情，其阶级意识的淡薄程度更是令人震惊。在我们随机调研的三十多位农奴中，三分之二的人认为是地主的“慷慨仁慈”让自己有了饭吃，甚至更有农奴恳求苏维埃不要打倒地主收走土地，否则他们这些人没地可种就会饿死。\n\n£gezifu £gezifu 也许我组的调查结论在全疆范围内并没有普遍性，但是很显然阶级意识的缺乏以及劳动人民对自身力量认识的匮乏将会严重影响群众对革命的正确认识和参与革命的积极性。请中央务必重视。\n\n£gezifu £gezifu                                    中国共产党阿克苏支部土改调查14组"
 COX.71.t: "下乡：阶级意识报告"
 COX.72.a: "他们所作的罪恶，将来要对他们显现。"
 COX.72.d: "£gezifu £gezifu 经上级组织决定，我小组于一月前开始调查当地社会状况。\n\n£gezifu £gezifu 经初步调查发现：当地农奴大多畏惧宗教领袖，其当地地主豪强，部分神职人员常常以宗教理由征收苛捐杂税，甚至以捐赠为名强行霸占土地，和阗挨体杂尔清真寺就霸占了该清真寺附近超过六千亩的土地。\n\n£gezifu £gezifu 据走访调查发现，当地基层阿訇和群众对于宗教领袖颇有微词，但碍于阶级意识淡薄，再加上统治阶级借助宗教理由掩盖其剥削目的。因此当地群众缺乏斗争精神，持宿命论观点, 相信剥削是“真主的意愿。”是“穷命”难以引发大规模抵抗。\n\n£gezifu £gezifu 在封建时代，神职人员是掌握知识的群体。因此神职人员很容易蒙蔽农民，也很容易让农民反对地主。在历史上，常常有神职人员联合统治阶级，或者神职人员作为统治阶级剥削农民。但也有部分良心发现的神职人员，帮助农民反抗封建统治阶级的残暴统治。这部分神职人员在宗教内的地位低下，甚至有的阿訇贫困不已，可以考虑拉拢贫困阿訇，跟大阿訇争夺宗教的解释权\n\n£gezifu £gezifu 我小组认为：此报告较为真实地展示了和阗周边地区的状况，此和阗之情况可能不同于新疆其他地区，但仍可用作参考。\n\n£gezifu £gezifu \n\n£gezifu £gezifu                            中国共产党和阗支部土改调查第三组"
 COX.72.t: "下乡：宗教"
 COX.73.a: "民主，平等，社会主义。"
 COX.73.d: "£gezifu £gezifu 今天是个特殊日子，伊斯哈科夫穿好正装，正襟危坐地坐在等候室，等着毛岸英的到来。\n\n£gezifu £gezifu 在此之前，新盟在共产党治理下的新疆，地位有些尴尬。新盟内部甚至还出现了“共产党人要把我们全部解散”的悲观论调。\n\n£gezifu £gezifu “久等了，我们的社会主义同志。”还在门外，伊斯哈科夫就听到了毛岸英的声音。随着声音而来的，就是身穿军装的毛岸英，他走入等候室内，就径直给伊斯哈科夫来了一个拥抱。\n\n£gezifu £gezifu “岸英同志，我们新盟……”拥抱结束后，伊斯哈科夫小心谨慎的询问道。\n\n£gezifu £gezifu 岸英则哈哈笑道：“新盟作为新疆本土共产主义者组成的同盟，当然是我们中国共产党的好同志，所以不存在什么解散，共产党也不会去领导新盟。我们是同志，是战友，是一同建设共产主义的同路人。”\n\n£gezifu £gezifu 听闻岸英的解释，伊斯哈科夫总算松了口气，说道：“那就好，之前新盟的一些成员的悲观论断也影响到了我。”\n\n£gezifu £gezifu 岸英点点头，说道：“我们详细聊一聊新盟的权利和义务吧，治理新疆需要足够多优秀的基层干部，但我们中国共产党目前难以承担大部分的基层干部，很多地方都是依靠前地主进行管理的，如果可以的话，新盟的成员们能否和共产党的党员一起下基层……”\n\n£gezifu £gezifu 这间房子里，不断传出二人交流的对话。"
 COX.73.t: "同新盟会晤"
 COX.74.a: "自由，博爱，社会主义。"
 COX.74.d: "£gezifu £gezifu “咱们共产党对伊斯兰教的要求很简单，就是不主动去强行传教，逼迫他们信教，待在自己的一亩三分地上好好的过日子，招待信徒就行了。工作要自己干，自己动手丰衣足食，别想让别人招待你。”\n\n£gezifu £gezifu 年轻的阿訇，萨比尔聆听着来自共产党干部的指示。\n\n£gezifu £gezifu 听完后，萨比尔点点头，说道：“这问题不大。”\n\n£gezifu £gezifu 的确问题不大，因为现在的实权阿訇大多都是曾经不得志的底层贫困阿訇组成的，曾经的他们在贫困中坚持教义，亲自参加劳动养活自己，忍受曾经实权阿訇的压榨。如今击倒了那些假借真主之名盘剥百姓的罪人，获得了在清真寺中传播主真正的福音的权利。\n\n£gezifu £gezifu 这是他过去难以想象的。\n\n£gezifu £gezifu 那名共产党的干部正准备离去，萨比尔忽然拉住他，说道：“我太想谢谢你们了，你们改变了新疆的教派的面貌。曾经腐败糜烂的教派不在了，我感觉现在的教派充满生机，充满朝气。我也明白了真主福音里有关天下皆兄弟的理念……”\n\n£gezifu £gezifu “你们也要注意，不要又变成以前那个腐败的教派就行了。”干部点头点头应和道，忽然又说道：“记住啊，不准强行给不信教的人传教，也不要强行给孩子们传教！”\n\n£gezifu £gezifu “好的，我会记住红线的。”"
 COX.74.t: "宗教的红线"
 COX.75.a: "“阿迪里明白！”"
 COX.75.d: "£gezifu £gezifu “我志愿加入中国共产党，作如下宣誓：牺牲个人，努力革命，阶级斗争，服从组织，严守秘密，永不叛党。”\n\n£gezifu £gezifu 一大早，天才蒙蒙亮，太阳还刚刚冒出一点头来，挥洒着淡淡的光辉照耀的大地。就传来了整齐划一的宣誓声。\n\n£gezifu £gezifu 年不过二十多的阿迪里自豪地挺起胸膛，大声地念完了入党宣誓词。作为一个原农民，他难以想象就在这短短的一两年里，他的日子发生了这么大的变化。\n\n£gezifu £gezifu 他从一个连名字都没有的贱农，变成了反对巴依的战士，再到光荣的合作社农民，如今更因为表现亮眼，学习理论知识突出，成为了中国共产党党员。\n\n£gezifu £gezifu 不仅仅是他，在他周围的同志们，要么是表现突出且私下里自学成才的流水线工人，要么是奋战在矿坑的采矿工人……要么是工人，要么是农民，就是这一批中国共产党新鲜血液的成员。\n\n£gezifu £gezifu 不过不同的地区有不同的情况，还有的地方还会有进步学生入党，还有一些新招收的军队战士也会入党。\n\n£gezifu £gezifu 但这些都和阿迪里没什么关系，他们这片地方入党的就只有工人和农民。\n\n£gezifu £gezifu “阿迪里，入党了就更要奋战在第一线，千万千万不要忘记自己过去，也不要觉得自己当了党员就了不起噢！想一想巴依老财，如果内心腐化了，就有可能会变成他们。”先辈递给阿迪里一个小小的党员证，语重心长地说道。\n\n£gezifu £gezifu 阿迪里想起过去的巴依，顿时全身一个哆嗦，想起了些不好的回忆，如果他也变成巴依那种人的话，那他还算什么党员……他被吓得不轻，连忙答道："
 COX.75.t: "新党员"
 COX.76.a: "文字是我们团结他们的重要武器。"
 COX.76.d: "£gezifu £gezifu “说真的，新疆地太大了，到处都是方言，同一个民族同一个语言之间的差别可以说得上是天差地别。”\n\n£gezifu £gezifu 李源整理文书的同时，对旁边的同志抱怨道。\n\n£gezifu £gezifu “学维吾尔语快把我学哭，但我们是教人识字的，总不能让人家去学汉语吧？还得我们先把维吾尔族语学了。共产党员不吃苦，难道让老百姓吃苦？”\n\n£gezifu £gezifu 一旁的周舟摇摇头，翻过一页，继续编纂着有关于汉语和维吾尔语对映的字典。\n\n£gezifu £gezifu “你说得对。反正俄语我都学会了，再多一门也没关系。”李源点点头，说道：“以后这都是官方语言，可千万不能小觑。”\n\n£gezifu £gezifu “希望回家后我们还能记得几句家乡话吧”周舟一笑，说道。\n\n£gezifu £gezifu “哈！我真的忘记了……”李源说着，忽然神情有些悲伤。\n\n£gezifu £gezifu 看起来刚才的话语勾起了李源的思乡之情,他愤愤不平地说道：“现在的内地汉奸当道，当日本人的走狗，我家乡铁定生灵涂炭……家里亲人，也不知道能活几个……”\n\n£gezifu £gezifu 周舟沉默地看了眼东方的方向，但被一层墙壁挡住。半晌，他张口说道：“家里脏了，就拿扫把扫掉。就跟扫掉这里的地主老财一样。我们帮助维吾尔同志解放了，他们也会来帮助我们。”他停顿了一会，继续说道："
 COX.76.t: "同心同德"
 COX.77.a: "顿时，大家都开始讨论起来。"
 COX.77.d: "£gezifu £gezifu “岸英同志指出，在解放新疆和随后的土地改革运动中，我们干部的规模前所未有的扩大了。”南疆的干部们挤在从地主手中缴来的老收音机前，听着从百里之外的乌鲁木齐乘电波而来的播报员的声音。“革命队伍涌入了新鲜血液，这是绝对的好事，但许多非马克思主义的，资产阶级的，甚至是封建主义的意识形态也一并涌了进来。许多新同志不知道马克思列宁主义的基本理论，不熟悉中国和世界的革命历史。现在，新疆刚刚解放，但偌大的中国还处于国民党反动派和其背后的日本帝国主义的压迫之下，我们的先锋队肩负着解放全国的沉重使命……发起整风运动，在与全党范围内的各种反动思想进行斗争势在必行。”\n\n£gezifu £gezifu 在广播结束之后，干部们开始讨论起来。\n\n£gezifu £gezifu “整风，真的有这个必要吗？”新干部伊利亚不解地问道。“我们原来都是穷苦人，就算当了干部，也都是和乡亲们一起吃住，一起劳动，这还不足以当一个合格的党员吗？”\n\n£gezifu £gezifu 南疆土改最终能在极为苛刻的情况下取得胜利，离不开新疆解放后入党的干部们的不懈努力。他们前往了最偏远的村庄，将解放之声带给了最保守的那些头脑。维护水利，组织民兵，批斗地主，他们不知疲惫的身影出没在土改的每一条战线。旧社会的沉重压迫让他们每个人都拥有了共产党员最宝贵的那些品质，就算得不到任何物质上的回报，他们也无怨无悔。正因如此，在场的每一个干部，都向伊利亚投去了赞许的目光，还有一两句帮衬的话。"
 COX.77.t: "整风运动"
 COX.78.a: "不仅要有阶级意识，还要有理论知识。"
 COX.78.d: "£gezifu £gezifu “那你能说说出我们的最终目标是什么吗？”耐心地听完了众人内心的不解，在场唯一解放前就入党的联络员问道。\n\n£gezifu £gezifu 人七嘴八舌地答道：“解放天下的穷苦人，平分地主的土地。”“让人人都能吃上饱饭！”“让劳动的人都能吃得上饭。”\n\n£gezifu £gezifu   “共产主义社会就只是吃饱穿暖吗？”\n\n£gezifu £gezifu “这是乡亲们的愿望，也是我的愿望。”伊利亚的话并无半分虚假。\n\n£gezifu £gezifu “不只是这样。马克思说，共产主义社会将是一个极大发达的社会，人们不仅仅满足了自己的物质需要，也能自由地劳动，到那时，一个人的全面发展是整个社会全面发展的前提……”\n\n£gezifu £gezifu 顺着联络员激动的叙述，这些在地里弯腰匍匐了大半生的人们终于第一次，开始畅想一个更美好的未来。他们不仅仅是为了吃饱穿暖而战，而是为了一个没有压迫与剥削，人人皆自由的世界而奋斗……\n\n£gezifu £gezifu “同志，我明白了…”伊利亚的声音因激动而颤抖着，“我们现在是为了解放全中国的穷苦人，然后是为了消灭一切压迫者和打倒一切帝国主义，但之后呢？到底应该怎样做，才能从现在的一穷二白，抵达马克思所说的共产主义社会？”\n\n£gezifu £gezifu 联络员笑了笑，说道：“我正好收到了珍贵的课本，下次再来的时候，咱们来聊聊中国和苏联的革命吧。”"
 COX.78.t: "共产党员的初心"
 COX.79.a: "浮生一日路漫漫。"
 COX.79.d: "£gezifu £gezifu 早，五点半：起床，洗漱，并准备好工具。\n\n£gezifu £gezifu 六点：去最近的早餐铺喝一碗羊汤，并买两个馕，吃掉其中一个的一大半。\n\n£gezifu £gezifu 七点半：去往工作地点，打卡，在第一批人潮到达前初步检查一遍路面情况。\n\n£gezifu £gezifu 八点：在人潮到达时休息，补充体力。\n\n£gezifu £gezifu 九点：正式开始工作，开始跟随其他人员扩建路面\n\n£gezifu £gezifu 十一点：反常的下雨让扩建不得不中止，只好前往附近的仓库避雨。在仓库遇到了几名干部，报告了路面的一些问题与未来扩建方向的建议。之后和其他工友聊起周围的各种传闻。\n\n£gezifu £gezifu 十二点半：雨还在下，冒着雨去周围买了一大杯热奶茶，就着早上的馕，喝了下去。并回到仓库找了片空地睡午觉\n\n£gezifu £gezifu 两点一刻：雨停了，开始继续动工扩建，加紧了速度好在夜晚的人潮来临前完成任务，期间有一名工友倒下了，但是除了护送他走的人以外所有人仍然在做自己的工作。（注：所幸只是劳累过度而晕倒了，领队给他冲了一碗糖盐水）\n\n£gezifu £gezifu 晚，六点五十：今日的任务超额完成了，无论是领队还是工友们都很开心，于是剩下的工作只是再检查一遍路面，而后一起凑了点银元与粮票，在附近找了一个副食店，买了点肉，喝了点小酒。\n\n£gezifu £gezifu 八点：带着一丝醉意走在回去的路上，想想明天要干些什么，并看看来去的人。\n\n£gezifu £gezifu 九点：到家了，蒸了几个土豆沾了盐，点着灯想写些什么，但是没有头绪，于是只记下了这篇日记。\n\n£gezifu £gezifu 九点半：洗漱，想了想明天的事情。无聊，熄灯睡觉。"
 COX.79.t: "一名护路工的一天"
 COX.8.a: "继续前进！"
 COX.8.d: "£gezifu £gezifu 致苏维埃中央：\n\n£gezifu £gezifu 我们在上一个月的工作中做得不错。边区人民对于我们果决、连贯的政策推行表示满意，虽然偶有坏分子试图妖言惑众，但他们的阴谋很快就被我们的战士所拆穿，没有产生太多的负面影响。唯一不那么好的消息是，有数个工作组已经在报告后附上了当地农奴地主的异动情况，对于可能发生的叛乱，我们必须做好准备。"
 COX.8.t: "月度报告"
 COX.80.a: "“被压抑的思想要回潮，被压迫的人民要造反！”"
 COX.80.d: "£gezifu £gezifu “早期宗教都带着不少左翼民粹思想。早期基督教因为其同情穷人的理念在罗马帝国时期迅速发展；伊斯兰教同样有赈济税用来补助贫穷穆斯林。可等到宗教相继成为国教之后，慢慢地就演变成了封建统治的走狗，把左翼民粹思想丢到了一边……”曾留学苏联，跟着毛岸英旅长从西俄革命阵线回来的张牟拍了拍黑板，继续说道：“宗教是新疆很多老百姓的信仰，我们不能简单地把他们打掉，这不仅不切实际也会激起他们的怒火；因而对于宗教，目前唯一途径是想办法改造它。”\n\n£gezifu £gezifu 只不过，底下的学生们却有些受不了，有人说道：“可马克思曾说过，宗教是人民的鸦片……”\n\n£gezifu £gezifu “马克思就在这一句话的前面说过，宗教是被压迫生灵的叹息。宗教之所以是鸦片，是因为现实的苦难让他们把幸福寄托在来世，而这会消磨他们在现实的斗争性。”张牟无奈地说道。\n\n£gezifu £gezifu 连掉书袋都被顶回去了，这下几个不满意的干部也没话说了。\n\n£gezifu £gezifu “那我们具体该怎么办呢？”另一位干部询问道。中央会议上提出了要将宗教去反动化的决议，但具体如何落实却没有什么经验可以借鉴，着实让这些干部愁白了头。\n\n£gezifu £gezifu “具体实践方法肯定需要同志们在实际操作中体会。不过我们可以把握这几个主要的思路：一，发扬早期宗教的左翼民粹思想，二，公开批判反动思潮，三，拉拢进步宗教人士……”"
 COX.80.t: "宗教的启蒙意义"
 COX.81.a: "只有真主的圣言能抚平他们心灵的创伤。"
 COX.81.d: "£gezifu £gezifu 外力本是巴依家中的次子，从小就被送进清真寺，终日没有别的工作，只是埋头诵经。\n\n£gezifu £gezifu “奉至仁至慈的真主之名，一切赞颂全归真主，众世界的主…”\n\n£gezifu £gezifu 但不论他怎样研读先知的圣言，费尽心思想要揣摩真主的圣意，他心中始终都怀着一个疑问——明明信安拉的皆为兄弟姐妹，可为何一部分人的自由会被完全剥夺？明明真主至仁至善，为何周遭的世界充满了暴力和恐惧？疑问在外力一次次翻开那鎏金的绿色书封时不断增长着，在一次次漫长的早间祈祷中扎下根来。受苦受难的信徒们真诚地向他们这群圣言的传播者寻求答案，但每次外力只能说出违心的话。将谎言与对彼岸的空洞许诺作为安抚信徒们的鸦片，外力恨不得将自己的舌头拔掉。\n\n£gezifu £gezifu 直到有一天，一群穿着军装，带着枪的不信者来到了村子里。在他们的煽动下，农奴们奋起反抗，分了巴依的地，给小清真寺贴上了封条。看着自己的父亲和老阿訇在公审大会上全无平日的风光，外力不仅没有感到遗憾，反而从心底涌出了畅快之感。\n\n£gezifu £gezifu 外力孑然一身，成了个普通农民。不再有漫长的经书要诵读，不再有繁琐的仪式要举行。他现在只是诚实本分地劳动，践行着先知的教诲。但不知为何，那群无神论者又把村中的清真寺开了起来，他们找到了外力，要他担任新的阿訇。\n\n£gezifu £gezifu 只读过《古兰经》的外力正要拒绝，却看到了清真寺外正围着一群农民。外力看到了十几个迷茫的灵魂，在尘世的变化无常间受尽苦难。顿时，他理解了——"
 COX.81.t: "迷途"
 COX.82.a: "“就从《共产党宣言》开始吧。”"
 COX.82.d: "£gezifu £gezifu 还是在曾经的小清真寺内，还是被迷茫的灵魂所环绕，手中捧着同样的《古兰经》，但新阿訇外力知道，不论自己对圣意的揣摩是否准确，他今日说出的，都将是发自肺腑的话——\n\n£gezifu £gezifu “世上不论种族、贫富、贵贱，凡是信安拉的，都是安拉的子民，都是兄弟姐妹。兄弟姐妹间，应该和睦共处。先知穆罕穆德，与穷人常坐，与贫民同吃……《古兰经》里说，各人只得享有自己的劳绩……安拉也宽恕了异教徒卡非尔，希望我们能与他们和睦共处。”\n\n£gezifu £gezifu 若在往常，布道结束之后，信众们必须沉默地离开，但今天，新阿訇却请求大家提出自己的疑问。\n\n£gezifu £gezifu “外力阿訇，共产党人也说人人平等，可他们并不信安拉啊？”一位中年信众问道。\n\n£gezifu £gezifu “好问题。”外力将《古兰经》合上。在他失去曾经“光鲜”的一切，孑然一身的时候，他也无数次想过——真主的教诲如何在共产党人理想的新社会中存续？而今，他要凭借自己的思考，解答信徒的疑问：“真主创造这个世界，祂的智慧是无垠的，祂的心灵是至善的。（真主造世，祂智无垠，祂心至善）而人类的视野却很狭隘。有的人口头充满对真主的盛赞，但实际上却背离真主之途，这些人伪装成穆斯林，实际上比不信者更危险。而有的人虽口头不念真主，实际上却在践行真主之道，在我看来，真正的信徒都应当与他们一起。”\n\n£gezifu £gezifu 听了新阿訇的解答，众人都若有所思地点了点头。而外力对自己的答案还不太满意。或许有朝一日，自己也应该找几本共产主义的书来读读。"
 COX.82.t: "布道"
 COX.83.a: "若敢来犯，定叫你大败而归！"
 COX.83.d: "£gezifu £gezifu “连长，咱是不打仗了吗？”\n\n£gezifu £gezifu “不是，怎么不打仗？到处是土匪，不打谁打？”\n\n£gezifu £gezifu “那还种地？”\n\n£gezifu £gezifu “奶奶滴，不然吃啥？”\n\n£gezifu £gezifu 阿布勒海尔踹了新兵一脚，新兵挠挠头，好像觉得是这个理。\n\n£gezifu £gezifu 阿布勒海尔算好了日子，从建设兵团分配他们到这块田那天开始，到今天正好是黄萝卜收获的时候。全连战士接到突击命令，立刻下了田，要在一个星期内把萝卜采集完毕，后一个星期又要种上新的作物，为日后的严冬做足准备。\n\n£gezifu £gezifu “连长！连长！你上来一下！”\n\n£gezifu £gezifu 哨兵塔上的哨兵叫唤着正挽起袖子的阿布勒海尔，他也爬上了哨兵塔。\n\n£gezifu £gezifu “你看那帮子人是谁？”\n\n£gezifu £gezifu 在防护林外，隐约能看见一众人骑着马，什么身份基本看不着，过了一会，那众人靠得近了些，能看清他们的马。\n\n£gezifu £gezifu “妈的，是东边来的马匪，趁着咱收庄稼偷袭来了！”\n\n£gezifu £gezifu “为啥啊？我看不到啊。”\n\n£gezifu £gezifu “哎呀你看他们马多壮实。”\n\n£gezifu £gezifu 阿布勒海尔急得解释了一句，拿起铃铛就摇个响，塔旁接应的士兵立刻拉起了警报，下地没多久的士兵又跑回兵营去拿枪，迅速布置在既定的阵地上。阿布勒海尔则紧紧地盯着那队人马，他们一步步靠近，没有停下来的意思。\n\n£gezifu £gezifu “连长，打吗？”\n\n£gezifu £gezifu “不急，再近些。”\n\n£gezifu £gezifu 三百米，马匪停在了一座小坡上，可能是看见了红军一排黑洞洞的枪口，随后就调头离开，突袭不了了之。"
 COX.83.t: "犁与枪"
 COX.84.a: "终将在新的土地上放射出耀眼的光。"
 COX.84.d: "£gezifu £gezifu 这天清晨，老广正如往常一样起床、洗漱、吃早饭：要赶在开工前检查一遍机器的状况。自从他在光复新疆的战斗中负伤后，党组织安排他去一个五金厂上班。抗日前他在陕西也是在五金厂工作，还被评过优秀机组成员，所以虽然腿部受了伤，但是在新的工厂里也还算是顺风顺水。\n\n£gezifu £gezifu 不过，今天再次踏进工厂时，他停了下来。\n\n£gezifu £gezifu 停在门前的几辆卡车明显是苏式的，而车上插的旗子则表明了它们来自布里亚特红军。看着这些车，老广想起了那段在贝加尔湖旁与布里亚特红军战士并肩作战的日子。\n\n£gezifu £gezifu 不过，为什么他们的车子在这里？\n\n£gezifu £gezifu 疑惑的老广缓慢地踱着步子，走近了卡车。车中空无一物；旁边的俄罗斯人正在用俄语和厂长交谈。他们在说什么？老广听不懂。于是他只好收敛起好奇心，向着工厂内加快步伐走去：小伙子们正等着他来帮忙呢。\n\n£gezifu £gezifu 当他跨进工厂大门，映入他眼中的则是大惊喜：多了几台陌生的车床。而在此之前，就厂里那些用两只手就能数得过来的玩意，即使是他也觉得枯燥无味。他走上前去，用手拍了拍轴箱，饶有兴趣地看着这些泛着古旧绿色的东西。诚然，这些家伙和厂中其他的东西一样有了时日；但老广知道，有些经历了时间洗礼的东西依旧可靠……"
 COX.84.t: "来自老地方的礼物"
 COX.85.a: "“任重而道远啊。”"
 COX.85.d: "£gezifu £gezifu 由于地理和历史原因，在新疆过去的时代，政府就有专门的水利部门负责管理全疆水利。但不知为何，本该权势滔天的原水利局办公室，只剩下一个破旧的水利局办公室还表示这个机关曾经存在。\n\n£gezifu £gezifu 老革命家陈潭秋对工作环境并不挑剔，只见他匆匆走入办公室内，打开了桌子上老旧的新疆地图，陈潭秋被满满飞舞的灰尘弄得咳嗽了两声。\n\n£gezifu £gezifu 担心老革命身体的护卫们连忙上去想要扶他，被陈潭秋制止了：“小问题，不用急。”\n\n£gezifu £gezifu 随后他就投入于观察这幅新疆水利设施图。“据《新疆图志·沟洫志》记载，至光绪末年，新疆地区共有干渠944条，支渠2333条，灌溉面积达1100多万亩。”他默念了曾经看到过的图书的内容，一点一点地比对的这图上的内容。\n\n£gezifu £gezifu “左宗棠修的防洪工程全被标记上了年久失修……林则徐修的阿齐乌苏渠被好几个大地主瓜分？通惠渠被地主瓜分为好几段，水已经干了……”陈潭秋检查了一些比较知名的水渠，看得他头痛不已。随后又看了一些前水利局成员留下的日志：“民国四十五年乌力买力斯坎儿井年久失修，无修坎儿井其术，不可修，以至于败……民国五十年年图木斯克大水，溺死者十余人，良田数百亩……五十一年科克肉玛大旱，庄稼无活，百姓旱死数十”\n\n£gezifu £gezifu 许久，陈潭秋缓缓放下卷宗。哑然一笑，说道："
 COX.85.t: "水利局成立"
 COX.87.a: "天边红旗招展。"
 COX.87.d: "£gezifu £gezifu 当清晨的第一缕朝阳照射到高原草甸上时，巩哈游击队已经收拾起了毡房，踏上了新一天的旅程。草甸上凝结的露水浸湿了驮马的蹄铁，也打湿了游击队员们的靴子，人和马的影子被熹微的阳光拖得很长很长，阿不都克里木·阿巴索夫挎着一支勉强还能打响的步枪，牵着他的蒙古马走在这支队伍的最先头。数十年来，他和他的队伍一直游荡在蒙古高原之上，用他们的枪支和勇气保卫着蒙古和新疆的牧民，过着居无定所的生活。不过，今天，这支队伍有着相当之明确的目标——他们要回家了。\n\n£gezifu £gezifu 已过不惑之年的阿巴索夫还能回想起二十年前那段火热的革命岁月。那时，他带领着新疆人民奋起反抗新疆当局的经济压迫，并和在东部发动进攻的国民革命军残部一起推翻了盛世才的统治。然而，盛世才并无合作的打算，这群急于落脚的败兵不顾一切地发起了进攻，在火炮的轰击之下，革命队伍损失惨重，领导人之一莫斯里莫夫也被弹片击中，不幸牺牲，阿巴索夫只能放弃县城，带领着失去了领袖的巩哈游击队转入广袤的荒原与戈壁继续斗争。艰苦的游击生活并不是常人能够忍受的，战士们携带着马匹枪支离开的情况时有发生，当泽登巴尔联系到阿巴索夫并希望他能够为蒙古人民阵线作战时，这支来自新疆的游击武装仅剩下了数十人。在乌兰巴托，游击队得到了新的战士和装备补给，但他们的奋勇冲杀并不能改变人民阵线败于蒙疆与日本军队联合绞杀的命运，心有不甘的阿巴索夫收拢部队，没有选择跟随泽登巴尔撤回人民革命委员会境内，而是回到了蒙古与新疆的边境上继续进行游击作战。这个中年人似乎已经能看到他的未来：战士们一个接一个地离开队伍，直到只剩下他一个人。当然，这一切的前提是他没有见到那个来自新疆的红军士兵。\n\n£gezifu £gezifu “盛世才的统治已被消灭，苏维埃欢迎你们的归来。”\n\n£gezifu £gezifu 他应该信任这个战士吗？阿巴索夫思考了许久，他依稀记得，这个红军战士口中的中国将军和他的部队在不久前曾经跟随着华西列夫斯基阻击了蒙疆的进一步侵略，至于他们是如何进入新疆，又如何建立起红色政权，红军战士没有提起，阿巴索夫也没有问。\n\n£gezifu £gezifu 也许他们是该回去了。一个属于人民的新疆是他的梦想，即使现在也是如此，他想要亲眼见证。而且，他的战士们也应该安顿下来了。\n\n£gezifu £gezifu 红军战士离开的第二天，巩哈游击队就作出了决定——回家。\n\n£gezifu £gezifu 阿巴索夫举起手，示意队伍停下，这里距离新疆的边境线已经只有数千米之遥，按照之前那个红军战士的说法，苏维埃会派出部队在边界上接应他们进入新疆。他举起望远镜，向远方看去。"
 COX.87.t: "高原清晨"
 COX.88.a: "他仍然可以在军队中服役。"
 COX.88.b: "为他在参谋部安排一个位置吧。"
 COX.88.d: "£gezifu £gezifu 巩哈游击队的领袖阿巴索夫在我们的欢迎下带领队伍来到了新疆。虽然这位将军并没有失去他的勇气与决心，但多年的艰苦游击生活严重损害了他的健康。为他的身体着想，或许让他退休是一个更好的选择？"
 COX.88.t: "游击队的将军"
 COX.9.a: "希望他们平安无事……"
 COX.9.d: "£gezifu £gezifu 致苏维埃中央：\n\n£gezifu £gezifu 目前我们正在和反动武装进行间断的武装冲突，除少数携带无线电的工作组外，我们和大多数下乡战士之间的联系都受到了或多或少的阻断。在这种情况下，想要估计进度几乎是不可能的，我们只能寄希望于民兵武装早日结束暴乱了。"
 COX.9.t: "月度报告"
 COX.90.a: "民政之事并不轻松。"
 COX.90.d: "£gezifu £gezifu 毛岸英希望乌鲁木齐中央苏维埃能快些接手全疆的政务，却总是忍不住去多插手那么几下，但他也知道，若是自己一直插手的话，那么中央苏维埃的威信就立不起来，成堆的公文还是会发到自己这儿，对一些恶劣的事情还要自己亲自去处理。\n\n£gezifu £gezifu 现如今在新疆，主席的命令才是军民都会服从的铁令，中央苏维埃的命令就像小细娘一样，不那么受人尊重。\n\n£gezifu £gezifu 尤其是许多地方农会的中国旅老兵和干部，一和中央苏维埃的人闹了不愉快，就耍起自己的小性子来，伸出自己的大手说：“你算个什么鸡巴？岸英主席握过我这只手，拍过我这肩膀，勉励我好好做工作！”\n\n£gezifu £gezifu 而中央苏维埃的大家也变得有些捉摸不透了，他们现在很少再和岸英争论政务，而是默默地执行，出了问题后再说自己只是执行主席的命令。\n\n£gezifu £gezifu 这些问题都是毛岸英在行军打仗中不曾见过的，指挥军队作战，无论胜负都找不到推诿的地方，总能找到负责的军事主官。\n\n£gezifu £gezifu 但到了民事行政这里，却因为主席令这种权宜之计，和中央苏维埃的命令发生了些冲突，早在阿勒泰一地的时候，毛岸英尚且能总览全局，但有了一整个新疆根据地后，毛岸英根本管不过来了，所以中央苏维埃的行政机关只能扩大。\n\n£gezifu £gezifu 现在根据地仅仅坐拥一个新疆，就已经乱象频出…等未来收复了西北后又会怎样呢？\n\n£gezifu £gezifu 这东西，毛岸英想着就头疼，老同志陈潭秋则鼓励岸英应该做出些什么改变，以改变现在的状况。\n\n£gezifu £gezifu 但岸英对此毫无头绪。"
 COX.90.t: "民政之事"
 COX.91.a: "相隔只有一层薄纸，却似乎很远很远。"
 COX.91.d: "£gezifu £gezifu 李承祥曾是伊尔库兹克的旅居华人后代，中国旅的一个入伍时间不长的新兵，如今的一名下乡工作干部。\n\n£gezifu £gezifu 新疆的天晚上凉得很，是需要生炉火的。当地的伯克老爷很热情地接待了李承祥这个“新官儿”，他是中国旅在村子里的唯一干部，派他来只是摸摸情况的。\n\n£gezifu £gezifu 李承祥哪见过这架势，他穿了身熨得笔直的军装，又擦亮了新鞋子，梳了一副体面人都有的大背头，心里高兴地告诉着自己：“我是在做大事！已经可以和这些伯克老爷打交道了。”\n\n£gezifu £gezifu 炉火烘的整个屋子都暖洋洋的，他坐在热炕上，和盘腿坐着的伯克老爷交谈着，说着中国旅的施政方针、岸英主席的帅气、将来的新疆会多么多么的好。\n\n£gezifu £gezifu 同其他地方的剑拔弩张不同，这里的伯克老爷看着眉目慈祥，这渐渐让李承祥放轻松的警惕。\n\n£gezifu £gezifu 伯克老爷时不时地奉承他几句，这让他觉得很受用，李承祥觉得自己已经做到“农村的工作”了，已经有人在笑着听自己的话了。伯克老爷就这么听着李承祥的话，又挥了挥手让下人打开窗：“天不太冷，火太热了，别让它烤坏了我，去拿些水果来招待下贵宾。”"
 COX.91.desc: "£gezifu £gezifu 听着这“贵宾”二字，李承祥更开心了，全然不顾这是不是奉承的客套话，就不自觉地笑了起来，面色也被火烤得更红润了，他觉得面前的伯克老爷简直就是知己，直到聊到深夜，对方送上一篮子水果，他才依依惜别。\n\n£gezifu £gezifu 李承祥很高兴，他觉得自己既下了农村，又有了一位体面的知己，世界很美好。\n\n£gezifu £gezifu 直到一盆冷水浇在他的头上。\n\n£gezifu £gezifu 在伯克老爷的屋子外面，躺着那么一个人，穿的破破烂烂的，就躺在自己刚才和伯克老爷高谈论阔的窗户下边儿，因为那儿有热气飘出来。这个叫花子正咬紧牙齿，对着北风喊“要死”！\n\n£gezifu £gezifu 李承祥看了看这个叫花子，又看了看冒着热气的伯克老爷家，此刻的他才想起来有一种东西叫农奴。他想起自己和伯克老爷的高谈论阔都被这叫花子听了个遍，他颓然觉得刚才的自己就是一个小丑。他把水果篮丢在了一旁，任清甜的水果散落一地，他只觉得烘了伯克老爷的暖，吃了伯克老爷的水果，又拿了一篮子走的自己简直是卑劣至极！\n\n£gezifu £gezifu 他抬起头，眼睛狠狠地盯住了伯克老爷那大开的冒着热气的窗户。\n\n£gezifu £gezifu 可怜屋外与屋里，"
 COX.91.t: "相隔一层纸"
 COX.92.a: "她笑着，倒在血泊中。"
 COX.92.d: "£gezifu £gezifu “你就是不信！你们和卓，从来就是想着如何把我们压得世世代代抬不起头！”\n\n£gezifu £gezifu 在那清真寺的门前，在真主见证下，一场临时公审正进行着不少。只见一名瘦弱的维吾尔族阿妹，拳头攥得死紧，怒目注视着面前那个身着华贵的和卓（农奴主），却见那和卓小脚一翘，继续舒舒服服坐在椅子上，\n\n£gezifu £gezifu “这可不是我信不信的问题啊，这十斤麦子，就是人家从你家里面搜出来的！你们迪待克（女奴），生下来骨头就黑，那个手就是贱！”\n\n£gezifu £gezifu “我的骨头不是黑的！”\n\n£gezifu £gezifu 阿妹眼睛里噙着泪。\n\n£gezifu £gezifu “你有本事，就给老乡们证明看看，给我当场把你这右手砍下来，看看里面裹着的是黑骨还是白骨，你敢砍，那真主也一定会宽恕你。”\n\n£gezifu £gezifu 旁边几位“安拉的使者”朝清真寺的方向拜了一下，互相商量，也向那阿妹说：\n\n£gezifu £gezifu “真主会宽恕你的。”\n\n£gezifu £gezifu “你们…老乡们！你们所有人看好了！死死地看好了！”\n\n£gezifu £gezifu 阿妹拿起清真寺前铺路的一块裂石，那裂石仅被风蚀了一面，一拿起便露出了锋利的一角。\n\n£gezifu £gezifu 所有围观的人都傻了眼，怔怔杵在原地，和卓的老婆们吓出了声，母亲把孩子的头紧紧抱在自己怀里，在场所有人都露出了难看的表情。\n\n£gezifu £gezifu 啪！喀啦！\n\n£gezifu £gezifu 和卓和使者被吓得镇了一下，和卓身子肥胖，那木椅子因为突然的震动断了一根腿，和卓一下子摔了下来。\n\n£gezifu £gezifu 嘶啦！\n\n£gezifu £gezifu 观众哗然了，并逐渐演变成骚动，嫁祸阿妹的几个和卓的私人卫队跑下去拦住了想冲上去的老乡，但平时瘦小的农奴们，这时好像被赋予了无穷的力量，卫兵被摁倒在地，被冲上清真寺门前的老乡们践死了。\n\n£gezifu £gezifu “拦住他们！贱种们造反啦！”\n\n£gezifu £gezifu 那几个使者根本没理和卓，扭头就朝清真寺里躲去，和卓不仅身子肥大，刚摔一下还把脚给扭了，立刻被冲上来的老乡控制住。\n\n£gezifu £gezifu 咵啦！\n\n£gezifu £gezifu 阿妹高举自己的手臂，可以清晰看到，那薄薄的血与肌肉间，是雪白雪白的骨头。\n\n£gezifu £gezifu 阿妹“剁臂示清白”的故事，很快传遍了全疆。\n\n£gezifu £gezifu “在已经解放的新新疆，为什么还会出现这样恶劣的农奴主欺压百姓的事件？”\n\n£gezifu £gezifu 毛岸英两夜睡不好觉，明明，盛世才势力在全疆都已经被消灭殆尽，土匪也很少明目张胆地冒头，可压迫与苦难依然持续地降临在人民的头上…\n\n£gezifu £gezifu 更多的工作组被派向基层，特别是全疆妇女联合会，进一步扩大了一倍的会员。"
 COX.92.t: "白骨"
 COX.93.a: "“看来农会的改革很受农民群众的欢迎。”他想道。"
 COX.93.d: "£gezifu £gezifu 迪化宣传指挥部的小战士赶在太阳落山前把宣传墙上最后的宣传画报揭下，换上了新的大字报和宣传画。看着手里写满着“打倒地主分田地的旧画报，小战士心想家里破裂的旧窗户得以修补，便高兴地沐着落日余晖消失在街头，他的背后是一片红色醒目字样：“多快好省，全力生产”“建设新时代民主农会组织”。\n\n£gezifu £gezifu 小战士圆满完成了宣传指挥部分发给他的任务，然而他不知道的是，西至阿克苏，东至哈密，近乎全疆的农会已然完成了它们第一阶段打土豪分田地的历史使命，不计其数的基层红军战士在最短的时间内走访于各大小乡村，与广大农民积极交流，初步完成了农民协会的改革。农会的工作重心不再是以往的公审地主，解放农民、农奴，而是摇身一变为广大农民提供便利，加大加快生产节奏的乡村组织。\n\n£gezifu £gezifu 前往阿克苏乡村进行农会改革工作的老战士满怀信心走下了村里的土围，他刚刚于此进行了一场激动人心的演说。从台下农民们清澈的满足的目光中，他敏锐地得知，在完成了与地主豪强作斗争，争来了自己的土地后，现在的他们更倾向于全身心投入生产。在作出向广大农民提供一切能提供的生产工具，生产方法等便利的承诺后，人们作出的反应要比他多年前在台上几句虚词空喊“打倒地主解放农民”的口号要热烈得多。思绪未断，他已经被纷纷涌来热情的农民群众所淹没了。"
 COX.93.t: "改革农会"
 COX.94.a: "厂房里顿时充满了干劲。"
 COX.94.d: "£gezifu £gezifu 霉味与铁锈味充斥着整个旧厂房，一众年轻机械工人在灰尘中杂乱地站着，显然他们对这这批盛世才的工业遗产略显手足无措，眼前只有空气中阳光涉及的灰尘稍显明亮。\n\n£gezifu £gezifu “都傻站着干什么？”一位戴着厚框眼镜的老者推开吱呀的铁门，信步走到人群面前，显然他是这次翻新任务的领导者。\n\n£gezifu £gezifu 未等老者继续发难，一名工人用螺丝刀指着一座锈蚀严重的机床，皱眉道:“老冯，您看看，这些设备根本没法下手啊。”\n\n£gezifu £gezifu 老冯如抚摸新生婴儿般摩挲着眼前这部废旧车床，拭下一层厚厚的灰尘:“我理解同志们的难处，可是呢，这批设备，非常地珍贵，是咱们前线同志努力争取来的。”老冯猛地一拍掌，手中灰尘如烟花般散开，“咱们能修好多少就修多少，我一把老骨头干不动了，各位有什么难处都尽管问我。”老冯扶了扶厚厚的镜片:“想当年我老冯在延安的土房窑洞里，也是操作车床的一把好手……”老冯正要滔滔不绝，刺鼻的铁锈味便堵住了他的嘴。\n\n£gezifu £gezifu “优先修好翻新这批电动铣床”老冯指了指角落里那批最古怪的锈绿机器，“能修复多少就修多少，咱以后最精密的零件全得靠它，别的设备先往后放放。”一名长相稚嫩的工人好奇地探出头:“老冯，咱修好这批设备，是不是能像德国佬那样造导弹啦？”老冯咧嘴笑了:“这傻小子，还导弹，你也不看看咱什么设备别人怎么设备，西方早就用上数控机床啦，咱还在这手搓零件，差得远着呢，干活去吧！”"
 COX.94.t: "翻新旧有设备"
 COX.95.a: "就这样了吗？"
 COX.95.d: "£gezifu £gezifu 天微微亮，燥热，但是蒙着小雨。\n\n£gezifu £gezifu “老头子，醒醒，村委会说了，今天就要批斗尤素福了”王姐推了推还在床上睡着的丈夫。\n\n£gezifu £gezifu “什么啊，不过是说说罢了，咱没必要掺和。”床上的男人略带不满地甩甩手，试图再睡一会。\n\n£gezifu £gezifu “说是要分田…”\n\n£gezifu £gezifu 听到后三个字时，那个男人一个鲤鱼打挺跳下了床，令女人产生了一些错觉。\n\n£gezifu £gezifu 穿上衣服，吃过早饭，安置好孩子，便向集市赶过去了。\n\n£gezifu £gezifu 一眼望去，集市上已经全是人了，但以往说书或唱戏的高台上，是被押着的，是狼狈不堪而愁容满面的老吴，而村委会的干部正坐在一旁的桌子上说着什么。那顶杆上挂着的，便是那群新来的“共产党人”的旗子。王姐和阿鲁木图在吵闹的人群中，一时间不知道要说什么。\n\n£gezifu £gezifu 过了一会，随着一声喝止，人们安静下来，一齐看着台上站着的那新来的新村长。\n\n£gezifu £gezifu “乡亲们，今天我让大家来到这里，是为了斗巴依老爷的！乡亲们也不要怕！盛世才已经倒下了！有苦的诉苦，有冤的伸冤！谁来打这头一炮？还乡亲们一个公道！”\n\n£gezifu £gezifu 但无论台下的乡亲们如何躁动不安，王姐只听到“那么认真吗”，“这事能行吗”诸如此类的话，即便她自知乡内积怨已久。\n\n£gezifu £gezifu 而那混合着热气的雨令人恼火而窒息地压在这土地上。\n\n£gezifu £gezifu 更不用说那尤素福此时正不为人查的笑着。\n\n£gezifu £gezifu 但终是没有一个人站出来。"
 COX.95.t: "风雨前夕"
 COX.96.a: "三千年来谁曾问，而今便要报总仇！"
 COX.96.d: "£gezifu £gezifu 不过还在僵持着。\n\n£gezifu £gezifu 也许是几周内的转变无法扭正千百年来的生活所带来的水土不服，眼下农民们确实不知道该如何拿取那本属于自己的东西。而同样尴尬的还有那些来到这里的干部们，他们虽然已提前做好了准备，但计划总是赶不上变化的。\n\n£gezifu £gezifu 就在这时，明亮的声音击碎了这有声的沉默。\n\n£gezifu £gezifu “我来！”\n\n£gezifu £gezifu 顺着声音的源头望去，一个乡亲们熟悉的人从人群中走上来，那正是以前因尤素福而家破人亡的王浩。如今，他身上的衣服已经发黄了，腰间的带子也已经泛了灰。但是与破旧的衣服截然相反的，则是他的那张脸，那张因劳作而染上土色的脸，此刻因愤怒而散发出杀气与红光。\n\n£gezifu £gezifu 他沉默地走向台前，无声而坚毅。他没有看一眼乡亲们对他或是敬佩或是认为他是出头鸟的眼神或声响，他没有看向台旁的干部，他甚至没有看向颤抖的尤素福——这个男人早已将害惨了他的人的相貌铭刻进了骨髓。\n\n£gezifu £gezifu “就是三年前，天降大雨弄坏了我家的地，我田中的洋芋…都坏掉了。于是，于是…”\n\n£gezifu £gezifu 随着几声哽咽，紧邻的便是声泪俱下的怒吼。\n\n£gezifu £gezifu “他们家的狗腿子，砸了我家里的东西，抢了我家里的钱，粮食，我眼睁睁地看着我的孩子在病…病中归了西，我唯一的孩子啊，你知道他最后说什么吗！！？？”\n\n£gezifu £gezifu “他说！爹，我好饿！而我什么都做不到啊，做不到啊！！！”\n\n£gezifu £gezifu 此刻，作为父亲的悲愤已经达到了顶点，他猛地跺了地，用带着颤的怒火质问着。\n\n£gezifu £gezifu “我们就该这样吗？让这该死的逃掉？不应该！我们不能沉默！亲人们，尤素福这个狗东西连着他的祖宗欺压了我们多少年啊！共产党来了，我们应该站起来！我们该向他们算总账了！不能沉默！”\n\n£gezifu £gezifu 而后，那本来寂静无声的人群中，忽地伸出一个手，怒骂着台上早已吓傻了的罪人，而后，便是二，三，十……\n\n£gezifu £gezifu 阿鲁图木夫妇永远也无法忘记，当王浩在乡亲们激昂的声音中走下台时，他这土汉子早已哭成了泪人。\n\n£gezifu £gezifu 而那天晚上，几年难见的雨洗刷掉热浪，也冲走了人们心中的大石。"
 COX.96.t: "雷鸣"
 COX.97.a: "红军确确实实在成长。"
 COX.97.d: "£gezifu £gezifu 这天的赵指导员很头疼。\n\n£gezifu £gezifu “没想到之前只是个战士，怎么会被派来收拾他们。”他低头一边打理着绑腿一边自言自语道。他的面前背对着他，军装参差不齐的人群，是盛世才时期遗留下来的士兵，从他们不间断的窃窃私语和不安的肢体动作可以看出，这些士兵也把毛岸英当作了下一个盛世才，正在谋划着如何最轻松地获得下一份军饷。\n\n£gezifu £gezifu 想到这里，赵指导员感到肩上的责任重大，他将烦恼和顾虑暂时抛到脑后，别好了胸上的党章，径直向人群面前走去。\n\n£gezifu £gezifu 赵指导员把步伐放的很慢，因为他还在思量着如何对这些旧式军队思想仍未抛弃的士兵们宣传社会主义思想，让他们真正融入红军战士的大家庭。\n\n£gezifu £gezifu 他联想到毛岸英父亲著名的三湾改编--那次具有伟大创新性的军事决策;也是促使他自己作为一个学生投笔从戎，为广大士兵宣传马克思主义的事件。他心想，毛泽东能够说服上千起义的泥腿子正式为党服务，我赵指导员也能够将这百来号人成功收编。\n\n£gezifu £gezifu 想到这里，赵指导员已不知不觉来到士兵们的跟前。未等他发话，半数的士兵已悉数起立：“长官好！”另半部分的士兵则是继续盘腿坐在原地，狡黠地打量着起立的人群和赵指导员。\n\n£gezifu £gezifu 他略感尴尬，显然士兵们也把他当作了军阀的爪牙，他清了清嗓子:“同志们，请不要紧张，都坐下吧。我们不是旧军阀，我是代表红军来和你们沟通的，”他担心被个别士兵嘘声打断，便紧接着说到:“我们欢迎各位加入红军的大家庭，如果有人不愿意加入，我们也不强求，我给你们带了盘缠。”\n\n£gezifu £gezifu 几个瘦弱的士兵颤抖着站起:“长官，俺们要回家。”\n\n£gezifu £gezifu “不用叫我长官，叫我赵指导员就好，这是你们的路费，回去要照顾好家人。”赵指导员走到几人面前轻声道。\n\n£gezifu £gezifu 众人意识到眼前这位军容整肃的方面汉子也许并不像以往那个严酷的瘦脸长官般可怕，几个活泼开朗的士兵首先开口与赵指导员攀谈起来，赵指导员早已放下架子，一一回答着士兵们的疑惑。\n\n£gezifu £gezifu 简易的校场上讨论的声音愈发响亮，赵指导员笑了，显然今天的成果出乎他的意料，从与一众士兵的讨论中，他逐渐意识到，这些跟随盛世才驻扎新疆的士兵对本地的风土人情和军事形势的熟悉程度是他们中国旅不可比拟的。"
 COX.97.t: "扩展党支部"
 COX.98.a: "一展红旗在阳光下灿灿生辉。"
 COX.98.d: "£gezifu £gezifu 惨白的即将西落的月光下，几只被枪声惊醒的乌鸦绕着干枯而死的树木，发出凄厉的报丧声，给凌晨的天增添了死亡的气息。\n\n£gezifu £gezifu 它们血色的眼珠中，隐约看到几个佝偻的身影无力地走着。\n\n£gezifu £gezifu “人是跑不赢马的……”一个人捂着因为受伤而不断流血的伤口，说道。他旁边的人目光中有着浓浓的疲惫感，但仍强撑着，回应道：“快到了，不要怕。”\n\n£gezifu £gezifu “他们已经追上来了！而我已经中枪了！我想不明白！为什么追我们这些矿工这么狠!”他无力地摆了摆另外一只手。\n\n£gezifu £gezifu 似乎是为了印证他的话，寂静的黑暗中，传来了隐隐约约奔腾的马蹄声。\n\n£gezifu £gezifu “他们不会追太狠的,你们沿着这个方向走，我把他们引到另外一个方向去。”说罢，领头的人从怀中抽出了一把老旧的苏制莫辛纳甘。\n\n£gezifu £gezifu “老艾孜买提，你……”流亡队伍中的另外几个人见状，有些语塞。\n\n£gezifu £gezifu “快走，没时间了！”老艾孜买提提醒道。\n\n£gezifu £gezifu 受伤的人也停下了脚步，说道：“我就不必了，我已经受伤了，只会暴露行踪，老艾孜买提，我就留下来陪你吧。“艾尔克？”\n\n£gezifu £gezifu 其他人还想说些什么，被艾尔克驱走了。\n\n£gezifu £gezifu 就这么短短一段时间，远方的马蹄声已经越来越清晰。\n\n£gezifu £gezifu “这里离新疆不远……他们应该能平安到新疆，那时候，他们应该能活得不一样吧………”艾尔克跟着老艾孜买提走到了一处掩体后，喃喃自语道：“自由……”\n\n£gezifu £gezifu 老艾孜买提观望了马家军骑兵来的方向，抽出一把小刀，说道：“只有这个了。到时候你加油吧。”\n\n£gezifu £gezifu 之后，就是一阵漫长的沉默，如死一样的寂静的夜里，只有远方的马蹄声和近处的呼吸声清晰可闻。\n\n£gezifu £gezifu 马蹄声愈来愈近，呼吸声也愈发沉重。\n\n£gezifu £gezifu “砰！”\n\n£gezifu £gezifu 随着一道枪声响起，似乎是带动了交响乐般，远方紧接着传来了一阵又一阵枪声。\n\n£gezifu £gezifu 追来的数名马家军骑兵应声倒地。\n\n£gezifu £gezifu 老艾孜买提和艾尔克看了看枪声传来的方向。\n\n£gezifu £gezifu 远方太阳缓缓升起，橘黄色的光驱散了夜的死寂。"
 COX.98.t: "逃亡（其一）"
 COX.99.a: "КПСС ＆ CCP"
 COX.99.d: "£gezifu £gezifu 纬度越北，晴天和黑夜的时间就越发漫长。夏季的乌鲁木齐，天黑不过五个小时，白昼就匆匆降临了。这里的天总是湛蓝的，悠闲地挂着一片片云朵。\n\n£gezifu £gezifu 被整理过的街道显得十分干净，老工人看着面前一个像是施工车的红色机械，像是在看自己的孩子。机械充满着美感，崭新的红油漆附着在散发着淡淡光辉的金属外壳之上。盖子下头安放着一个全新的发动机，老人知道，只要注入燃料，这钢铁铸就的冰冷心脏也将如人类一般炙热地搏动。黑色的座舱是刚刚安放的，一排操纵杆摆放在伸手就能够到的位置。虽然现在整个西北，乃至整个中国都少有能驾驶这台机械的技工，但他们已经迈出了史无前例的一步——这些天来厂里大家的努力并没有白费，闭上眼睛，无数漫长的白昼黑夜仿佛就在昨日，汗水和希望，还有同志情谊，令这辆俄罗斯血统的拖拉机最终在乌鲁木齐降生。\n\n£gezifu £gezifu 而最下头一动不动的履带，让老人想起了久远的往事——那天，父亲正准备着秋收，自己跟在后面，清风拂过麦浪，但他只感到太阳火辣辣的晒。而后，侵略者的坦克碾过麦田，发出可怕的轰鸣声，短促的枪声响起，走在前面的父亲突然倒下了……\n\n£gezifu £gezifu 这台机器是厂里所有工人的孩子——老人想到。它勤劳的父母们不希望自己的孩子再制造出更多悲剧。它今后将会投入轰轰烈烈的大生产中，它搏动着的心脏将服务于人类战天斗地的事业，而钢铁铸造的身躯将重新支起这个苦难民族的脊梁。\n\n£gezifu £gezifu 他充满老茧的手小心翼翼地摩挲着他的孩子，这台拖拉机旁的金属铭牌上在光的照耀下，有些反光。\n\n£gezifu £gezifu 这些光映入他的眼睛，在他的瞳孔中反射出一堆字母。"
 COX.99.t: "拖拉机"
 COX.999.a: "中华苏维埃共和国！"
 COX.999.d: "£gezifu £gezifu 党和政府经过重组，现向外界宣布成立中华苏维埃共和国。"
 COX.999.t: "中华苏维埃共和国？"
 COX.999998.a: "无论多长时日，中国必将自由。"
 COX.999998.d: "£gezifu £gezifu “欸，兄弟，‘红皮本’要不。”城南菜市场角落，一位书贩子正拦下一个眉目清秀，戴眼镜的年轻人。书贩观察了他好几天，见他是个脾气温和的读书人，于是在今天他来摊上买教辅材料时，冷不丁地小声问了一句。年轻人吓了一跳，“什么？”“《抗战必胜》，毛岸英写的。”“保真吗？”“童叟无欺……”听得此言，青年轻轻点了点头，书贩便在他要的教辅资料里塞了一本封面什么字都没有的红皮小册子。\n\n£gezifu £gezifu 家门口，教师公寓底楼，两个警察正在重新粉刷墙面，“娘嘞，这帮地下党真的是没完了，天天写标语，今天是这里，明天又到南边学校围墙上写。真是不要命。”年轻人向他们打了个招呼，随后抓紧脚步走到公寓门口。“小薄啊，这么早就放学啦。”“是啊，李阿姨。今天要教的课时少。”左拐上楼，拿钥匙拧开门锁，进门，换好拖鞋，顺便把门带上，这对他来说已经是可以闭眼完成的事了。走到书桌前，合上昨天晚上备课的教案，拿出刚买的书，从中抽出了那本薄薄的小册子。还挺新的，没有明显的褶皱，看来是最近在哪个地下工坊印刷出来的。翻开没有内容的封面，第一页便是油印的标题《中国人民正义的抗日战争必将取得辉煌的胜利》，再翻过一页，便是正文。“第二次抗日战争正进入崭新的阶段，日本帝国主义为了维持其在东亚大陆的势力范围，对华北地区展开了军管，沿黄河布置了防线。他们的舰队封锁了海岸，由此阻止了中国寻求外援的渠道……\n\n£gezifu £gezifu 但中国人民的反抗，令整个大陆的殖民地反倒成了日本帝国的拖累。那些汉奸卖国贼政府，越是要通过镇压维系自身存续，人民就越是清楚地看到他们的真面目，不只是中国，越南，马来西亚，菲律宾的人民也已经起来反抗了。貌似强大的日本帝国主义，只是张牙舞爪的纸老虎，中国人民不屈不挠地斗争，已其拖入了泥潭。”\n\n£gezifu £gezifu ……\n\n£gezifu £gezifu 天色渐晚，残阳西斜，年轻人咀嚼着这篇文章的一字一句。文字将他带回了战败前的最后时日，那时，全国的抵抗几近崩溃，虽不知西北境况如何，但西南已再无抵抗的余力了——日机的投弹焚烧着昆明的古建与男女老少，更烧蚀着人们抵抗的意志。在日寇如猛虎般的攻势下，中国挣扎着窒息……或许，中国人其实本不是没有取胜的机会？点起油灯，青年仔细端详着面前的薄本——纵使其结论已被证明是过于乐观的估计，但字里行间，都蕴含着当今最为稀缺又弥足珍贵之物——希望。\n\n£gezifu £gezifu 窗外清鸣着鸟啼，街巷浮着炊烟与晨雾，青年摩挲着睡眼。下定莫大的决心，他将本子夹带在今日的教案之中，决定找个避人耳目的时间，与同学们聊聊此物。"
 COX.999998.t: "道阻且长"
 COX.999999.a: "“好嘞，李叔！”"
 COX.999999.d: "£gezifu £gezifu 李二点着了烟锅，蹲在城门的一隅，叭叭叭地抽着，眉眼带笑地看着进城的红军。\n\n£gezifu £gezifu 说实话，他真没有想到，一切都是那么的……顺利，南边的龙大帅（他还是愿意这么叫他，尽管这习惯已经被指导员教育过不少次）居然打下了南京，马上就要和日本鬼子干起仗来；更让他没想到的是红军——居然这么快就把辣鸡麻麻的榆林城打下来了！\n\n£gezifu £gezifu “这是天公在助我们哩,天上也见不得这鬼子的手段……”李二想想自己在这地界见过的畜生事情，呓语一样喃喃着，看着烟雾消散在天空中，像他刚来西北时见到的那缕绝望的炊烟。\n\n£gezifu £gezifu 烟抽完了，红军也快全部进城了，自己也得干活了不是？李二站起身来，拍拍屁股，走回联络站，站里面有他和地下战线同志们收集的榆林城资料和详情，对红军接收和维稳作用不小。他趿拉着鞋子，吊儿郎当地走在街上，他看见街边的商铺正在拆掉以前的膏药旗和青天白日，转头又把红旗挂了出来；他看见过街的红军被行人用敬畏的眼神打量着；他看见有小孩举着风车从红军边跑过，又被他的母亲扯了回去……\n\n£gezifu £gezifu 任重而道远啊……李二没奈何地想着，这榆林城里的百姓已经被军队作贱怕了，无论是哪来的军队都有种刻进骨子里的惧怕，希望我们的红军能让他们改观吧，就像我一样。\n\n£gezifu £gezifu “李叔！”李二听见一声大喊，随后后背被猛地一拍，“妈了个……你个小王八羔子！你给我吓死了！”李二低声恶狠狠地对着新兵蛋子嚷着；他刚刚以为出意外情况了，要不是他还想着观察到底是什么事，他就要把新兵蛋子给摔地上去！“嘿嘿，李叔，好久没见你了，街上看见你就没忍住…\"新兵蛋子不好意思地笑着，李二也没了气”部队呢？你咋不跟大部队走？没组织没纪律的不怕关禁闭？“”跟连长打了报告了，他准了！诶诶李叔，你在榆林城待了有段时间了，这里日子跟我们那比怎么样？“新兵蛋子关注点明显没在他话上。\n\n£gezifu £gezifu ”日子么……“李二想起来他一路上见的畜生事儿，再想想以前在新疆的日子，不禁痛苦地摇了摇头，但对着新兵蛋子的目光，他还是不忍心跟这个小孩子说。”这样吧，你先回部队，你李叔去办点事情，办完了带你下馆子，好好跟你说！“"
 COX.999999.t: "解放榆林"
