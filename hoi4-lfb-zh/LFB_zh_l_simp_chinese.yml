 COX_Launch_First_Five_Year_Plan: "启动一五计划"
 COX_Launch_First_Five_Year_Plan_desc: "青海问题的平稳解决标志着苏区初步解决了外部的危机，新生的苏区终于可以喘口气了。但是我们仍不能就此止步。内外的敌人都在看着我们，我们必须继续发展苏区的力量，巩固苏区的统治。虽然许多人存在异议，认为中国作为一个农业国，党应该专注于提高农民的生活质量。但为了真正的拥有解放全国的力量，党中央仍然坚定的决定了开始启动第一个五年计划。让那些内外反动派说我们这也不行，那也不行去吧。"
 COX_Learn_From_War: "在战争中学习"
 COX_Learn_From_War_desc: "我们的赤卫队尽管斗志昂扬，但他们仅有的实战经验只有对抗还乡团与土匪山贼。无论接受了怎样的训练，举行了多少演习，都无法得到宝贵的随机应变的能力。战争的形态已经发生了深刻的变革，就连我们军队的指挥员——上一次大战的亲历者，都无法在指挥部中预料这场战争的模样。\n\n要让我们的指战员真正的适应现代战争，唯一的方法是让他们在战争中学习，在战场上蜕变。我们将总结战士们用鲜血得到的宝贵经验，更有力地痛击侵略者。"
 COX_lease_field_management: "宽松的土地方法"
 COX_lease_field_management_desc: "在尚未土地革命地区，不分田，不减租，不减息。这是目前出台的新土地方法，这种行为无疑是对反动势力控制下的农民兄弟们的背叛……但，在我们的势力范围之外，我们的减租减息政策往往也只是加重农民兄弟们的负担，进而让他们怨恨共产党……我们只能如此……我们的力量太过薄弱。"
 COX_Lease_The_Sov_Grid: "租用旧联盟设备"
 COX_Lease_The_Sov_Grid_desc: "青海工业建设进展迅速，随之而来的是用电量大幅提升，现有的发电设备已不能满足需求。然而边区的经济水平显然不足以支撑庞大的扩建开支。好消息是，中亚的邻居可以提供这些东西——随着苏联战败，人民生活水平迅速下降，用电量亦然。用电量的下降也使许多发电设备闲置下来。与其让这些设备在电厂里吃灰生锈甚至被拆除，不如由边区政府出面以一个合适的价格把设备租用下来。"
 COX_lessons_in_blood: "血的教训"
 COX_lessons_in_blood_desc: "过去为了对抗共同的强敌，我们收容并联合了各路地方军阀武装以及国民党的残部。然而，各自为战、指挥不灵的弊端在兰州战役中暴露无遗，并让我们付出了血的代价。这样的悲剧绝不能重演。在这个生死存亡的时刻，必须建立绝对统一、高效的红军指挥体系。"
