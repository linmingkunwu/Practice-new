 XBJ_COX_shentou_END2: "§G大风止息，壮士扼腕......§!"
 XBJ_Crack_Down_On_Iman_System: "打击门阀"
 XBJ_Crack_Down_On_Iman_System_desc: "在伊斯兰教传入西北的过程中，从中亚来的苏菲派学者们建立了门宦制度。除了如其他教派一般研读《古兰经》，遵循圣训之外，这一系的苏菲派还宣扬对教主的神化，信众必须无条件服从教主的命令，世代膜拜名为“拱北”的墓葬。教主子承父业，代代为神主，而教民如不遵从，则会失去进入天堂的资格。因此，凭借门宦的世袭特权，教主家族往往都是阡陌万里的大封建主。我们必须将这一腐朽的思想彻底埋葬，将人民从思想束缚中解放出来。"
 XBJ_DEF: "中共中央西北局"
 XBJ_despotism_party: "宁夏马家军"
 XBJ_despotism_party_long: "宁夏马家军"
 XBJ_everything_is_normal: "§Y没有未解决的突发事件§!"
 XBJ_Experience_Of_Xinjiang_Land_Reform: "新疆土改的经验"
 XBJ_Experience_Of_Xinjiang_Land_Reform_desc: "新疆与青海都地处西北，深受中亚的文化与宗教的熏陶，在土地分配与剥削的手段上，与新疆有许多共同之处。我们可以将我们过去在新疆时的土改经验活用于青海之上，加快青海土地革命的进程，同时防止新疆土改时的悲剧再次发生。\n与新疆类似，在靠近草原的北部边境，牧业占据着重要地位。对于牧区的改革同样可以参照新疆的宝贵经验，引导牧民走上集体生产的道路。"
 XBJ_Guard_Against_Enemies_In_The_East: "防范东部之敌"
 XBJ_Guard_Against_Enemies_In_The_East_desc: "就在我们焦头烂额于马家统治崩溃带来的失序局面时，西宁以东，仅百公里之外，辻政信率领的西北方面军正摩拳擦掌，随时准备向西，碾碎途中的一切抵抗。我们不知道是什么拖延了这帮豺狼，没有嗅着鲜血的味道趁虚而入，攻入西宁，但他们的进攻终究不可避免。为了保卫新生的西北苏维埃政权，我们必须早做防范，搭建新的防线，修缮因混乱而废弃的堡垒，我们必须抵抗日军的攻势！"
 XBJ_Hami_working_group: "哈密工作组"
 XBJ_Hami_working_group_desc: "在解放前，哈密就是新疆工商业较为发达的地区。在土改运动中，此地的干部积累了许多城市工作的经验，对于如何在多民族杂居的城市展开工作得心应手。在稳定青海城市地区的过程中，他们的经验可以起到很大的作用。"
 XBJ_Infiltrate_Powder_Keg: "渗透火药桶"
 XBJ_Infiltrate_Powder_Keg_desc: "据边防战士报告，青海的局势此时已是一团乱麻，他们零碎的描述了袭击边境的土匪马贼，盘踞山巅的高门寺院……四散的难民带来了破碎的消息——日军大举西进，西宁已成废墟，受人民爱戴的马惇靖将军举起了义旗……信息虽多，然而真假难辨。我们仍对南边的这个火药桶知之甚少，我们的情报部门羽翼未丰，但情况紧急，必须有人前往青海，了解那里到底发生了什么。"
 XBJ_JAP_tatakai: "塔塔开，塔塔开！"
 XBJ_Li_Xiannian_for_desc: "§Y外交部长§!\n§Y毛泽东思想§!\n------------\n§L李先念,1909年出生于湖北省黄安县。\n1936年11月，受党中央之命，他作为西路军军政委员会委员，率领一支部队进军马家领地，试图建立河西根据地，以打通前往新疆的道路，与共产国际建立联系。西征的过程并不顺利，不熟悉地形的红军遭到了马家军顽强的反击，屡次有全军覆没的风险。但在战士们的英勇奋战，以及李先念的灵活指挥下，三十军先是强行突破黄河天险，又先后在凉州和永昌之间同敌军恶战，歼敌4000余人。\n西征虽没有如预想般开辟河西根据地，却打开了前往新疆的通路。1937年，李先念率西征军余部翻越祁连山分水岭，先是在冰峰雪岭中行军20多天，又穿越荒无人烟的大漠戈壁，于4月底到达甘肃、新疆交界处的星星峡，这一批部队，成为了后来共产党新疆局的骨干力量。\n1938年，随着抗日战争愈发激烈，李先念回到了陕北，当日军的铁蹄踏入重庆时，他并没有随党中央一道前往西南，而是率领着一支偏师，坚持在已沦陷的陕甘宁地区进行游击斗争。50年代初，随着国民政府发起了旨在歼灭陕北抵抗的围剿作战，李先念只好率部再次前往新疆。如果上一次旅程是长征，那么这一次真称得上是大溃败了。\n幸好，在祖国的西北边陲，还有人可以为这位转战了大半个中国的老革命者接风洗尘——在战后的数十年间，中共新疆支部在盛世才政府取得了一定的发展。战后的和平时光，转眼便到了1962年，李先念做梦也没有想到，全国革命的又一次火种，会在新疆引燃。当第八十八旅奇迹般地接管了迪化后，这位老革命又一次跨上了骏马，拿起了驳壳枪。\n在西北危机中，虽然已年过半百，但李先念还是自告奋勇，冲锋在前。面对疮痍满目的青宁大地，他锁紧眉目，终日思虑着如何驱散笼罩在西北人民头顶的阴霾——那§R如虎狼版凶悍的日本军队。§!§!"
 XBJ_Liu_Shaoqi_desc: "在最低谷处为革命找寻生机，在最绝望的时候为全民族觅得希望，这便是刘少奇坚持至今的，属于共产党人的“党性”。他将自己的青春献给了大革命，将热血挥洒在抗日的战场，而他憔悴的晚年，则为了党的存续穷尽了一切——当战败已经注定之时，党不得不放弃了延安根据地，展开了前往西南的新长征，刘少奇自愿留在延安，维系共产党残破的地下党组织。\n\n陕北的斗争一日比一日艰苦，日军扫荡的压力与日俱增，他们的身前匍匐着汉奸党羽，他们手中拎着禁锢群众的锁链，党越来越无法在陕北辗转腾挪……在最危险的几个年份，党被分割包围在黄河两岸。为了保存火种，刘少奇只能率领残破的党向西北撤退……\n\n共产党的西行相当顺利，在顺利通过了山西与青海的军阀控制区之后，刘少奇幸运地在新疆找到了党组织。尽管盛世才政府愿意给共产党提供一席之地，但刘少奇很清楚军阀们首鼠两端的做派，所以当不可避免的背叛到来时，共产党已经做足了准备，最大程度地减少了损失。\n\n刘少奇经历过党最黑暗的时光，竭尽全力地拯救了危难中的党，这在他性格中留下了不可磨灭的印记。比起积极地发动群众，他更相信缜密的谋划与情报的运用，尽管采用更加实用主义的立场，但没有人能怀疑他对革命的忠诚。"
 XBJ_Ma_Dunjing_hog_desc: "§Y政府首脑§!\n§Y军阀§!\n------------\n§L做派首鼠两端，立场摇摆不定——任何在乱世中割据一方的军阀都不约而同地总结出了这相同的生存哲学。得益于此，军阀们在某种程度上建立了形形色色的，还算稳定的政权。\n半个世纪悄然逝去，中华大地乱局如故，所以正如世界上的其他政权一样，他们也需要合格的接班人。军阀们通常会将自己相中的直系后代或家族中有前途的年轻人们早早地安插在部队中，给他们“参谋”，“师长”之类的职务，教导着这些人军阀的生存之道。\n马惇靖，便是这些年轻人中的佼佼者。\n他自幼熟读诗书，从小便懂得阿拉伯文，能根据大人的意思解经。在他父亲马鸿宾的部队中。他步步高升，从营职升到了团，旅，师……不到30岁，他就当上了81军的参谋长。在旁人看来，他不过是凭着父亲的权柄扶摇直上——虽然马惇靖屡次与众人争辩，但他的父亲却不避讳这一点——西北的冲突本就不似中原般激烈，在父亲的计划中，自己的儿子们将在剿匪与小规模冲突中积累功勋与经验，等到成熟之时，他就可以光荣卸任，把防务交予值得信赖的儿子们……\n但事与愿违，日本帝国对中国的全面入侵击碎了无数军阀可悲的地区主义幻想，无数年轻人被抗日的热情所感召，而敏锐的军阀们则从统一战线的建立中嗅到了剧变降临的前兆。尽管心中所想并不相同，但马惇靖和马鸿宾——这对父子仍一道踏上了抗日的战场。\n在绥西的残酷战争中，马惇靖目睹了无数敌寇的暴行，也深受无数壮烈牺牲的晋绥人民的感召。战火令他迅速成长为一名经验丰富的将领，一位高唱爱国歌曲的领袖，却越发偏离一个合格军阀的道路。他的心中早已充满了全国人民同仇敌忾的气魄，中华民族应当生死与共，“偏安一隅以求自保”从来不是一个现实的选项。\n当时的他不会料想得到，即便汇聚了全民族的力量也无法确保战争的胜利。他更想不到的是，有朝一日，战火也会烧到自己的故乡。如今西北的人民每时每刻都承受着与当日绥西相比有过之而无不及的暴行。为了自己亲爱的故乡，马惇靖愿意献出一切，以求早日将日寇驱逐。§!"
 XBJ_Nationalized_Huangzhong: "国有化湟中实业有限公司"
 XBJ_Nationalized_Huangzhong_desc: "湟中实业公司是早年马步芳将西北两大商行合并后产生的垄断机构，通过这个机构，马家得以在二十年间垄断了西北三省与内地的经济交流（也就是所谓的“茶马贸易”）。这个公司为马家赚取了超额利润，也代表马家对西北人民进行了残酷的剥削。尽管马家安插在高层的奴仆罪不可赦，但多数基层骨干只是奉命行事，通过对他们进行思想工作，我们可以进一步将湟中实业国有化，通过它为全西北的人民谋福祉。"
