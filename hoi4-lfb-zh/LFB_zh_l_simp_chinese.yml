 Get_NLF_Leader_desc_COX: "第二次统一战线战败后，中国被日本肆意践踏，国破家亡。\n此情此景，绝不容再次发生。\n在人称“云南王”的龙云归来后，西北共产党的革命者们也从西北的大漠中挥师东进，加入第三次统一战线，为反抗日帝国主义对人民的压迫而做出拼死一搏。有些被时代淘汰的人将这种行为视为飞蛾扑火，是赌上中国独立自由之未来的豪赌。但，在中华民族的儿女心中，那希望的星星之火，可以燎原；无论是谁，都无法扑灭。当解放的那一天来临，众人进军汇聚的那蓬勃的希望，即使是那高升的旭日帝国，也将因此陨落。"
 Get_NLF_Leader_desc_default: "第二次统一战线战败后，中国被日本肆意践踏，国破家亡。\n此情此景，绝不容再次发生。\n人称“云南王”的龙云已归来，散落在东南亚各地的第二次统一战线残部已联合起来，从云南到东北，各地抗日势力已联合起来，组成第三次统一战线，反抗日帝国主义对人民的压迫。有些被时代淘汰的人将这种行为斥为无用功，只不过是空流血一场。但，在中华民族的儿女心中，那希望的星星之火，可以燎原；无论是谁，都无法扑灭。当解放的那一天来临，众人进军汇聚的那蓬勃的希望，即使是那高升的旭日帝国，也将因此陨落。"
 Get_NLF_Leader_name_COX: "第三次统一战线 - 西北共产党"
 Get_NLF_Leader_name_default: "第三次统一战线领袖"
 GFX_COX_water_icon_tt: "为中原带来丰沛降水与富饶的的季风从未度过玉门关。但这并不意味着当地的百姓只能依赖屈指可数的绿洲与泉水谋生。以坎儿井为代表的水利工程技术使得来自高山的雪水能将莽莽荒原化为千顷良田。而近代以来，随着中国一步步迈向深渊，新疆的弊政与经济废弛导致古旧的水利设施在长期高负荷使用下大多损坏，尚能使用的旧设施也大多被地主乡绅垄断，进一步恶化了新疆的农业与经济形势。\n\n为了实现新疆的土地改革，在技术上对农业水利设施的重建工作迫在眉睫。修缮、翻新、兴建、改良，我们必须想尽一切办法建设水利工程。没有良好的水利，就没有繁荣稳定的新疆。\n\n为了了解地方水利情况，我们必须进行调查。\n[Is_COX_Account_The_Water_Conservancy_completed]"
