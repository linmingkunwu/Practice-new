 COX_sec_bar_landlord_tt: "地主抵抗度：[?COX_acted_state:COX_landreform_landlord_resistance|§-§!]%"
 COX_sec_bar_lmam_tt: "宗教抵抗度：[?COX_acted_state:COX_landreform_lmam_resistance|§-§!]%"
 COX_sec_bar_local_mil_tt: "地方民兵征募比例：[?COX_acted_state:COX_landreform_local_mil_rate_display]%"
 COX_sec_Combat_potential_hostile_forces_landlord_button_tt: "现在我们已经部分地掌握了地主势力的武装藏匿情况，尽管他们目前还没有大举进攻的计划，但这并不妨碍我们先下手为强，打击他们的嚣张气焰。在事情变得更糟糕前，这样的冒险未尝是不可取的。\n\n§W我们将出动§Y地方民兵§!提前打击地主势力的骚乱计划。即使地区的治安相对良好，也可以通过这一计划压制他们，并§!§Y最终解决骚动风险§!§W。倘若地方民兵与可调用的中央民兵数量不足地方民兵上限的§!§Y50%§!§W，计划将难以实施。§!\n\n计划执行后，地主势力的骚动倾向将会被一定程度压制。\n\n§W我们需要§Y耗费30天的时间§!以完成这项任务，你可以在决议界面查看进度§!\n[Is_COX_Battle_The_Landlord_Troops_completed][Is_COX_Battle_The_Religious_Force_completed][Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_COX_sec_Combat_potential_hostile_completed_or_cooldown][Is_the_mil_enthough_to_do_4]"
 COX_sec_Combat_potential_hostile_forces_landlord_text: "打击潜在地主武装"
 COX_sec_Combat_potential_hostile_forces_lmam_button_tt: "现在我们已经部分地掌握了极端宗教势力的武装藏匿情况，尽管他们目前还没有大举进攻的计划，但这并不妨碍我们先下手为强，打击他们的嚣张气焰。在事情变得更糟糕前，这样的冒险未尝是不可取的。\n\n§W我们将出动§Y地方民兵§!提前打击极端宗教势力的骚乱计划。即使地区的治安相对良好，也可以通过这一计划压制他们，并§!§Y最终解决骚动风险§!§W。倘若地方民兵与可调用的中央民兵数量不足地方民兵上限的§!§Y50%§!§W，计划将难以实施。§!\n\n计划执行后，极端宗教势力的骚动倾向将会被一定程度压制。\n\n§W我们需要§Y耗费30天的时间§!以完成这项任务，你可以在决议界面查看进度§!\n[Is_COX_Battle_The_Landlord_Troops_completed][Is_COX_Battle_The_Religious_Force_completed][Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_COX_sec_Combat_potential_hostile_completed_or_cooldown][Is_the_mil_enthough_to_do_4]"
 COX_sec_Combat_potential_hostile_forces_lmam_text: "打击潜在宗教武装"
 COX_sec_Conduct_recapture_operations_button_tt: "情况已经万分危急！安全局势完全失去了控制，赤卫队和红军干部也无法联络，敌对势力的骚动将这一地区渗透得千疮百孔，现在他们又一次占据了上风，并开始庆贺他们的胜利。倘若我们还有武装力量可以调度，最好尽快将其组织起来，在事态变得更加糟糕前展开夺回作战。\n\n§W我们将会动用可用的§!§Y民兵§!§W对地区执行武装打击，以恢复苏维埃边区对这一地区的控制权。如果民兵的数量不足§!§Y2000§!§W人，夺回作战将无法顺利进行。\n§W我们需要§Y耗费30天的时间§!以完成这项任务，你可以在决议界面查看进度§!§!\n\n[Is_COX_Battle_The_Landlord_Troops_completed][Is_COX_Battle_The_Religious_Force_completed][Is_COX_acted_state_active][Is_the_mil_enthough_to_do_3]"
 COX_sec_Conduct_recapture_operations_text: "执行夺回作战"
 COX_sec_local_mil_icon_tt: "民兵武装是苏维埃边区政府维持地方治安、打击敌对势力骚乱的必要力量，也是保卫革命果实的关键所在。如果民兵武装数量不足，会导致治安情况恶化，使得当地的敌对势力骚动气焰持续增长（每月最多增长4%），并对地方水利设施造成损失。单一地区的民兵征募数量达到上限的50%以上后，就能有效地规避骚乱度自然增长和水利破坏，因此在向中央调拨民兵前，请先确保地方的民兵武装数量充足。"
 COX_sec_num_Text: "现有中央民兵：[?COX_landreform_centre_militia]k"
 COX_Secure_Cement_Supply: "确保水泥供应"
 COX_Secure_Cement_Supply_desc: "考虑到西北苏区的实际情况，在五年计划中，重工业并不是发展之重。作为至关重要的建筑原料，我们必须增加水泥的产量，以满足不断扩张的城市与车间，还有边境筑垒的需要。因此，除了扩建乌鲁木齐与西宁现有的水泥厂以外，我们还需从苏联引入设备，建设新的水泥厂。这些新的工业区因分散布置，掩蔽于城市周遭的山岭之间，随时准备进行战时生产。"
 COX_secure_north: "关注北方安全！"
 COX_secure_north_desc: "同南疆不同，北方的诸多地区我们还保留着极强的控制力，我们必须先稳固我们在北方的统治。这样才能面对最主要的敌人。"
 COX_Secure_Supply_Lines: "保障补给线"
 COX_Secure_Supply_Lines_desc: "以前在延安的时候，我们的军队建设一穷二白，甚至不能保证武器和子弹的自给。如今我们再一次面临与日本人的全面战争。这一次，我们的子弹一定能打的和日本人的一样远，手榴弹一定能炸得和日本人的一样疼。这需要我们不惜一切代价维护补给线的通畅。\n\n从西北的工厂将物资输送至前线是一段艰难的路程。马家多年的经营早已在战火与混乱中被付之一炬，这里没有一条铁路，卡车能通行的路段也十分有限，许多地方必须依靠人畜力进行运输。除去恶劣的自然环境，敌人的轰炸仍能构成可观的破坏。我们将规划可行的路线，动员根据地的人民参与确保补给线的畅通。"
 COX_SEE_army: "前出侦察"
 COX_SEE_army_tt: "这将小幅增加我们对于西北军的渗透！"
 COX_Set_Up_Bayi_School: "开设八一农校"
 COX_Set_Up_Bayi_School_desc: "随着农业集体化的试点逐步进行，我们要着手解决另一项问题了：在原先，我们那点可怜的农用机械储备完完全全的可以满足同样数量稀少却能驾驭他们的人使用。而现在的情况则是，农用机械的产能提升了，能熟练操纵这些机器的农民数量却没有增加太多，于是因生疏而造成的机械伤人事件时有发生。同样的情况也发生在了普通的农用品上：诸如农药的使用量，农业生产的方式，化肥的用法等等。因此，我们需要建设一个统一的教育地点，用可行的各种方式吸引民众并对其进行农业方面的再教育。同时，我们也同样要设法吸引先进农户，利用他们来弥补我们在经验方面上必然会出现的不足。"
 COX_Set_Up_Hami_First_Textile_Factory: "哈密一纺"
 COX_Set_Up_Hami_First_Textile_Factory_desc: "哈密一纺"
 COX_Set_Up_Spy_System: "重组特别事务科"
 COX_Set_Up_Spy_System_desc: "无论是什么时代的何种战争，情报永远是保证胜利的关键一环。长期以来，中国共产党重视情报的运用，使得革命能够在敌人的重重封锁下越烧越旺。但随着抗日战争的失败，党的情报机构四散各地，大多就此隐蔽起来。虽然不知道他们能否在敌人的围剿下存续二十年，我们仍需尽可能的重建情报系统，哪怕是勒紧裤腰带也要把它搞回来：因为每多一份情报的支持，我们的战士就能少流一滴血汗；每联系上一个新的地区，我们的革命就会多出一份可能。"
 COX_Seypidin: "赛福鼎"
 COX_Shaanxi_runaway: "晋陕地区的局势正在激化"
 COX_Shaanxi_runaway_desc: "一旦到期，华北的紧张局势将被§R彻底引爆§!，我们将不得不§R发动进攻§!"
 COX_Shannxi_ruanaway: "时间正在流逝……"
 COX_Shannxi_ruanaway_effect_tt: "倘若我们未能在当地站稳脚跟，就不能维持黄河以南地区的控制……\n§R陕西的解放势必会引起日军的注意，我们将会正式卷入与日本的冲突！§!\n§Y在时间流失殆尽前，请确保我们已经做好了万全准备。§!"
 COX_Shannxi_ruanaway_trigger_tt: "我们已经完全占领了陕西"
 COX_Shoot_The_White_Sun: "射落白日"
 COX_Shoot_The_White_Sun_desc: "高宗武的肖像、共荣圈的海报、伪政府的国旗——数不清的反动符号仍然残存在新生人民政权的国土上。\n\n如今，我们不仅要在地理上收复每一寸国土，更要在思想上肃清这面旗帜所留下的流毒。从今以后，凡以“中华民国”名义发布的法律、条约、机关条例、公职身份，一律自即日起停止效力。任何个人不得再以旧政权任命的官职为由主张权利，不得再以旧法统为掩护进行政治活动，不得在任何公文、证件、票据中使用旧国旗、旧国号、旧纪年。\n\n这不是一次简单的改朝换代。新中国的法统并不从伪政权中继承，而是诞生于中国人民的共同意志。"
 COX_sik: "新疆革命根据地"
 COX_sik_ADJ: "新疆"
 COX_sik_DEF: "新疆革命根据地"
 COX_socialist_party: "新疆保卫和平民主同盟"
 COX_socialist_party_long: "新疆保卫和平民主同盟"
 COX_Song_Qingling_for_desc: "§Y外交部长\n£mingewei §P中国国民党革命委员会§!籍\n“国母”§!\n--------------\n与国共双方的人大多出身底层不同，宋家的这一代人是真正含着金钥匙出生的。宋庆龄十四岁远赴美国留学，最后于卫斯理学院毕业。据说她和孙中山只使用英文交流，而不是国语或者粤语。她于1916年与孙中山结婚。孙中山死后，她当选国民党中央执行委员会的委员。但是蒋介石的暴政越来越为宋庆龄所不容。1928年，宋庆龄宣布不参加任何国民党工作。随后以中立人士的身份继续影响着中国的政治，支持着共产党和各大民主党派的运动。在抗战开始之后，宋庆龄又是联合社会各界人士声援抗战。在中国统一战线的号召发出时，宋庆龄又是首先响应的。“内战必须不再发生，和平统一必须实现”就是她的号召。即使中国沦陷，汪精卫政府也只敢将宋庆龄软禁，不敢越雷池一步。然而软禁无法困住宋庆龄的思想，在汉奸政府的眼皮底下，她依然联合了社会中的进步派和反抗者，共同撑过了漫漫长夜，直到黎明。\n\n如今自由的她比以往有着更强大的力量，无论是共产党，国民党，还是各民主党派，都无法忽视宋庆龄和她本身所代表的意义。她既是孙中山的影子，也是她自己。"
 COX_Song_Ziwen: "宋子文"
 COX_Song_Ziwen_for_desc: "§Y外交部长\n£guomindang §z中国国民党§!籍\n“体面人”§!\n--------------\n与国共双方的人大多出身底层不同，宋家的这一代人是真正含着金钥匙出生的。宋子文出生在全中国最好的医院，就读于美国最好的大学，实习在美国最大的银行。如此光鲜的履历在全中国的经济学者中无出其右。1927年，宋子文成为广州国民政府的财政部部长，在两年内将国民政府的收入增加了十倍。北伐成功后，建立中央银行，并且于1928年实现中国关税自主。履历加上背景，使他成了蒋介石的心腹。之后抗战爆发，宋子文长期以民国政府外交部长的头衔驻留美国寻求援助。最后共借款五亿美元，无利息，无抵押，无期限。随着战争局势的恶化，宋子文不得不延长他在美国停留的时间。他从内心希望着，局势会好起来的，他有一天会回去的。直到他看到小妹来到美国避难，直到他听说了妹夫的死讯。\n\n如今随着中国的再生，宋子文也从纽约回来，随时准备将他在这数十年中在美国积攒下的金钱和人脉投入到中国的建设中去。"
 COX_south_sik: "喀什教义辩论"
 COX_south_sik_desc: "这场辩论是起点，标志着革命不仅要改变物质世界，更要重塑人们认识世界的方式。"
 COX_SOV: "中华苏维埃共和国"
 COX_SOV_ADJ: "中华苏维埃"
 COX_SOV_DEF: "中华苏维埃共和国"
 COX_split_field: "打地主，分田！"
 COX_split_field_desc: "听啊！新疆的农奴们数千年被剥削的哀嚎，我们怎么能够对我们的农民兄弟们弃之不顾呢？在我们红军的带领下，我们将要开展立刻，马上的分田运动和水利公有化运动，把本属于农民兄弟的土地，还给农民兄弟们！我们的红军所克之地，就应当迅速的把所有地主的土地还给农民！"
 COX_State_Monopoly_Of_Purchasing_And_Marketing: "统购统销"
 COX_State_Monopoly_Of_Purchasing_And_Marketing_desc: "统购统销"
 COX_Streamline_Production_Process: "简化生产流程"
 COX_Streamline_Production_Process_desc: "是的，在生产物资的时候，我们应当保质保量，但是面对武装到牙齿的日本人，红军的战士们常常苦于物资不足而无法取胜或扩大战果。战士们需要更多的枪炮弹药，我们需要把物资更快地生产出来以供给前线。\n\n我们现有的生产线本就十分老旧，且数量稀少，除了三班倒不间断生产外，我们必须引入简化的生产流程以提高产量。幸运的是，在长期的冲突中，俄罗斯军阀正好积累了大量“简化”生产与土造武器的经验。"
 COX_Stuff_The_Granary: "让谷物堆满粮仓！"
 COX_Stuff_The_Granary_desc: "毫无疑问，充足的粮食供应对战争的胜负至关重要。在上一次对日战争中，中国军民从不缺乏视死如归的勇气与战斗到底的决心，但凭借着对中国农业生产的完全摧毁，日军还是艰难地赢得了持久战的胜利。\n\n如今，苏区的大部分地方刚经过了土改，其农业基础仍十分脆弱，但我们别无选择，只能紧急征收农民手中本不多的余粮，建立战时粮仓，以供应前线战斗与后方生产的需要。\n\n争取民族自由的斗争，容不得任何踌躇犹豫。"
 COX_Sun_Fo: "孙科"
 COX_Sun_Fo_CR_hog_desc: "§Y中华共和国总统\n£guomindang §z中国国民党§!籍\n“巨人之子”§!\n--------------\n在中国城市和大平原的许多人的心目中，对辛亥革命的记忆正熊熊燃烧。这是一个关于压迫和自由的故事，是国家胜利的颂歌。孙中山先生的儿子孙科，也许正是这道光芒中最为明亮的那个人。\n\n同他父亲的追求一样，孙科在年轻时就博览群书，徜徉在西方和中国作家的书页中流连忘返，他在前往美国求学时也将这些书带在了身上。当孙科登上返回大陆的轮船时，中国已经被革命的火山口所吞没，他随即担任了广州市长的职务，成为了中国内战棋盘上的又一颗棋子。当蒋介石掌握着国家的缰绳时，他就站在委员长的对立面，看着日寇的进攻横扫中国的大好河山。\n\n当中国的战车最终被掀翻时，他离开了他为之牺牲良多的土地，返回了美国：这里是他在青年时曾无限向往的地方，但时移事易，他现在却希望能够回到祖国。\n\n几十年过去了，孙科眼睁睁地看着日本把祖国凿刻成了他无法辨认的碎片，建立了一个伪装成他父亲多年前为之而奋斗的耻辱政府。然而，他看到了阳光再次普照东方，护国军夺回了他为之奋斗的遗产。他终于可以呼吸着祖国的空气，再次欣赏中国的土地。在他生命的这一刻，他只希望能够在办公室里朝着无垠的地平线极目远眺，听着下面街道上的喧嚣回声。他清楚地知道，他并不是因为公正无私而得以归国的，但能够回到家乡、能够生活在他的同胞之间，这就已经足够了。\n\n§a在这样一个危机四伏的关头，时代呼唤着如他父亲孙中山一样的铁腕领袖。性格温和的孙科本就是国民党内部诸派系互相妥协的结果，他能否弥合党内，乃至联合政府本身日益加深的裂痕，只有时间能证明一切…… §!"
 COX_Sun_Fo_DRC_hog_desc: "§Y中华民主共和国总统\n£guomindang §z中国国民党§!籍\n“巨人之子”§!\n--------------\n在中国城市和大平原的许多人的心目中，对辛亥革命的记忆正熊熊燃烧。这是一个关于压迫和自由的故事，是国家胜利的颂歌。孙中山先生的儿子孙科，也许正是这道光芒中最为明亮的那个人。\n\n同他父亲的追求一样，孙科在年轻时就博览群书，徜徉在西方和中国作家的书页中流连忘返，他在前往美国求学时也将这些书带在了身上。当孙科登上返回大陆的轮船时，中国已经被革命的火山口所吞没，他随即担任了广州市长的职务，成为了中国内战棋盘上的又一颗棋子。当蒋介石掌握着国家的缰绳时，他就站在委员长的对立面，看着日寇的进攻横扫中国的大好河山。\n\n当中国的战车最终被掀翻时，他离开了他为之牺牲良多的土地，返回了美国：这里是他在青年时曾无限向往的地方，但时移事易，他现在却希望能够回到祖国。\n\n几十年过去了，孙科眼睁睁地看着日本把祖国凿刻成了他无法辨认的碎片，建立了一个伪装成他父亲多年前为之而奋斗的耻辱政府。然而，他看到了阳光再次普照东方，护国军夺回了他为之奋斗的遗产。他终于可以呼吸着祖国的空气，再次欣赏中国的土地。在他生命的这一刻，他只希望能够在办公室里朝着无垠的地平线极目远眺，听着下面街道上的喧嚣回声。他清楚地知道，他并不是因为公正无私而得以归国的，但能够回到家乡、能够生活在他的同胞之间，这就已经足够了。\n\n§a在这样一个危机四伏的关头，时代呼唤着如他父亲孙中山一样的铁腕领袖。性格温和的孙科本就是国民党内部诸派系互相妥协的结果，他能否弥合党内，乃至联合政府本身日益加深的裂痕，只有时间能证明一切…… §!"
 COX_Sun_Fo_ROC_hog_desc: "§Y中华民国总统\n£guomindang §z中国国民党§!籍\n“巨人之子”§!\n--------------\n在中国城市和大平原的许多人的心目中，对辛亥革命的记忆正熊熊燃烧。这是一个关于压迫和自由的故事，是国家胜利的颂歌。孙中山先生的儿子孙科，也许正是这道光芒中最为明亮的那个人。\n\n同他父亲的追求一样，孙科在年轻时就博览群书，徜徉在西方和中国作家的书页中流连忘返，他在前往美国求学时也将这些书带在了身上。当孙科登上返回大陆的轮船时，中国已经被革命的火山口所吞没，他随即担任了广州市长的职务，成为了中国内战棋盘上的又一颗棋子。当蒋介石掌握着国家的缰绳时，他就站在委员长的对立面，看着日寇的进攻横扫中国的大好河山。\n\n当中国的战车最终被掀翻时，他离开了他为之牺牲良多的土地，返回了美国：这里是他在青年时曾无限向往的地方，但时移事易，他现在却希望能够回到祖国。\n\n几十年过去了，孙科眼睁睁地看着日本把祖国凿刻成了他无法辨认的碎片，建立了一个伪装成他父亲多年前为之而奋斗的耻辱政府。然而，他看到了阳光再次普照东方，护国军夺回了他为之奋斗的遗产。他终于可以呼吸着祖国的空气，再次欣赏中国的土地。在他生命的这一刻，他只希望能够在办公室里朝着无垠的地平线极目远眺，听着下面街道上的喧嚣回声。他清楚地知道，他并不是因为公正无私而得以归国的，但能够回到家乡、能够生活在他的同胞之间，这就已经足够了。\n\n§a在这样一个危机四伏的关头，时代呼唤着如他父亲孙中山一样的铁腕领袖。性格温和的孙科本就是国民党内部诸派系互相妥协的结果，他能否弥合党内，乃至联合政府本身日益加深的裂痕，只有时间能证明一切…… §!"
 COX_Sun_Liren_sec_desc: "§Y国防部长\n£guomindang §z中国国民党§!籍\n“虎贲”§!\n--------------\n想象一个你身边的精英人物，他聪明，狡诈，能完成上级给他的一切任务，但是却处理不好社交关系。孙立人就是这样的人。在国民革命军中，孙立人从来没有得到过赏识，蒋介石永远更偏爱黄埔系的将领，然而孙立人却毕业于美国弗吉尼亚军校。当时从军校毕业的孙立人没有立即回到中国，反而是游历西欧以了解最新的军事思想。换句话说，孙立人的地位真正来源于他自己的实力，而不是同时期中国军队中十分普遍的裙带关系。回国后，孙立人担任宋子文麾下税务警察的团长，并且将其打造为警察中最精锐的队伍。在抗战前期，税务警察以独立旅的身份参战，战功卓著。然而好景不长，戴笠盯上了这支部队，经过一番运作，孙立人不得不交出独立旅的一班人马，作为补贴，孙立人将以这半个旅组建新编三十八师，升任少将。1941年，日军进攻东南亚，孙立人主动请缨要去参加中国远征军。受到蒋介石的接见。次年在缅甸大破日军，闻名中外。在当时至暗的世界局势中，孙立人的大捷给人们带来了一丝希望。然而缅甸战场的胜利无法拯救中国正面战场的节节败退。那天，重庆沦陷，两位巨人身死的消息传到了孙立人的耳中，他没有多说什么，而是带领着所剩无几的部下撤向云南和缅甸的边境，回到了最开始出发的地方。在这个不毛之地又以国民革命军的名义又奋战了二十多年。龙云起兵的那天，孙立人才离开丛林回到阔别已久的昆明。但是他来不及看看云南的变化，就要再次上前线去。而现在，虽然中国境内已无战争，但是更大的责任仍然等待着他。这位飘零半生的国防部长将会把他的后半生致力于剔除军队中的裙带关系，解决山头林立的现状，将之建立为一支完全听命于政府的现代化军队，就像他当年在美国所见的一样。"
 COX_support_high: "§Y得到广泛支持§!"
 COX_support_low: "§R得到小范围支持§!"
