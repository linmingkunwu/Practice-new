 COX_mil_mobilization_militia_to_centre_button_tt: "在地方民兵充足的前提下，可以将其中的一部分调往中央以备不时之需。中央民兵可以执行全疆境内的武装打击任务，但无法参与到地区的日常治安维护中。\n\n[Is_COX_Training_The_Militia_completed][Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_COX_mil_mobilization_militia_to_centre_completed_or_cooldown]"
