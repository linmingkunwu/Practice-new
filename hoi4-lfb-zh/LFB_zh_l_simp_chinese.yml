 Collect_Opinions_desc: "广泛听取各界代表、技术官僚与地方士绅的意见，确保政策的制定能够兼顾多方利益。"
 complete_lanzhou_rebuild: "完成兰州重建"
 comrade_friendship: "同志之情"
 comrade_friendship_desc: "共产主义是有关无产阶级解放的学说，这里的无产阶级不是一个地区或者某一些限定的个体，而是全世界的无产阶级。无产阶级是饱受资本主义制度压迫的，进而延申到全世界的被压迫者，都是共产主义学说要解放的对象，\n\n从纳粹德国漆黑工厂里的奴工，再到俄罗斯废土上挣扎求生的农民，亦或者新疆大地上的农奴，又或说日本势力范围下被兼并了土地被赶去工厂的农民工，也有南美血汗工厂内化为国家机器燃料的工人……这一切的一切，这所有的被压迫者，都是共产主义要解放的对象。而红军是所有被有压迫者的军队，各国的红军都是同志，我们有着共同的阶级基础，我们将会互相帮助,弥补彼此之间的不足，守望相助，一起去帮助那些§G被遗忘的劳动者们§!"
 confiscation_of_land: "没收私有土地"
 Construction_Corps: "建设兵团"
 Contact_Malaya_Evacuation: "联系马来亚撤侨"
 Contact_Malaya_Evacuation_desc: "一旦局势失控，我们必须准备好疏散我们在马来亚的侨民，保护他们的生命与财产安全。"
 Convene_National_Economic_Committee: "召开全经委"
 Convene_National_Economic_Committee_desc: "召开全国经济委员会会议，协调各部门的利益与资源，为经济腾飞奠定制度基础。"
 CountryInfo_Development_Content_desc.11: "您可以通过§Y以下§!渠道了解本§W子模组§!的相关信息\n也欢迎加入QQ群：§W262293916§!进行讨论\n请务必随时查看我们的最新动态！"
 CountryInfo_Development_Content_desc.12: "duc，Fairrairtha，LeaderOne_Official，LemonLover，MKMASASYK，阿巴巴阿巴，博尔赫斯的沙之书，明天的太阳，访古砖，龚兴仁，海军上将哈尔西，梁王绚辻词，梁希隐，某科学的宇宙河豚，某转生的史莱姆，氢氦锂铍硼，史上最会打灰的人，温赫扎，哮喘桃，心酱，斫青客\n\n§W特别感谢§!§Y是非真假一座桥§!§W为本模组做出的贡献！§!"
 CountryInfo_Development_Content_desc.13: "这装不下这么多人！"
 CountryInfo_Development_Content_desc.14: "《新秩序：欧洲末日》，其中文汉化包及其子模组“光自贝加尔湖来”（以下简称“本模组”）可能包含受版权保护的素材。\n本模组如有对受版权保护的素材的使用，均是以揭露法西斯主义、纳粹主义等极端主义思想的危害性为目的。本模组至今从未，未来也不会试图利用受版权保护的素材营利。因此，本模组认为其对这些素材的使用符合《中华人民共和国著作权法》第24条第2款所规定的“适当引用”、《美利坚合众国法典》第17卷第107条所规定的“合理使用”以及其他司法管辖区相应法律标准的情形。\n若您希望将受版权保护的素材用于“合理使用”（或您所处的司法管辖区的相应法律标准）之外的目的，则应当取得相应素材的版权所有者的许可，否则可能构成侵权。"
 CountryInfo_Development_Content.11: "关注LFB最新动态"
 CountryInfo_Development_Content.12: "鸣谢"
 CountryInfo_Development_Content.13: "（占位）"
 CountryInfo_Development_Folder.112: "光自贝加尔湖来-开发团队"
 COX: "中国旅旅部"
 COX_136_a_tt: "以§V中共中央西北局§!的视角继续游戏"
 COX_136_b_tt: "以§x中共中央新疆局§!的视角继续游戏"
 COX_A_Base_New_Born: "新生的根据地"
 COX_A_Base_New_Born_desc: "土地革命胜利了！在这段时间无数下乡干部，人民群众的共同努力下，曾经盘踞在新疆人民上空的封建地主阶级和借宗教奴役人民的阿訇已经被扫进了历史的垃圾堆，我们如今的新疆根据地已经焕然一新了，到处都是因为得到了自己土地而充满激情工作的农民。根据地已经脱胎换骨了!"
 COX_A_Devastated_Country: "国步艰难"
 COX_A_Devastated_Country_desc: "中华人民共和国及其各级政权机关成立以后，首当其中面临的考验是处理伪政府在经济方面留给我们的烂摊子，如何扭转解放战争以来国民党反动派所遗留下来的财政经济的极端混乱的状况。红军所接收的城市，由于战乱导致的通货膨胀，物价高涨，必须平衡财政收支和保证物资供给。又必须按照新的条件和新的需要，调整全国的工商业,整理交通,使之为恢复生产服务。除此以外，人民政府还必须立即进行对于国民党反动统治和战争所造成的灾荒和失业的救济。多年革命斗争与根据地政权建设所培养的行政干部就犹如沧海一粟般渺小。\n为了攻克这些难题，我们必须采取一切必要的金融管制和行政手段，开辟一条意义不亚于军事战役的经济战线，使溃烂的国民经济得到遏制和疗愈。"
 COX_A_Helpless_Peace_Dove: "脆弱的纸鸢"
 COX_A_Helpless_Peace_Dove_desc: "议案停滞，军队四分五裂，经济结构依旧断裂，新国家仍未找到稳定的航向。政治博弈未曾停歇，利益角力层层交织，旧秩序的阴影挥之不去，新的制度框架尚在挣扎成形。\n\n尽管前路未明，微妙的变化已悄然发生。更多议员开始携手，共同推动国家机器运转，裂痕虽未愈合，方向却逐渐清晰。改组接近尾声，修宪即将落锤，沉寂已久的大会堂将再次回响正式会议的声音。新生政权站在分水岭上，等待的是重塑国家结构的关键时刻。\n\n未来的走向仍未定夺，妥协与博弈仍在进行，政坛的空气充满不安。两党维系的政治平衡能否支撑国家前行？分裂的根源是否会在风暴来临之际彻底撕裂脆弱的结构？大厦将成，抑或再度坍塌，一切的答案终将交由时间书写。"
 COX_A_Letter_To_General_Baurjan: "给包尔江将军的信"
 COX_A_Letter_To_General_Baurjan_desc: "在实战中磨练，才能真正胜任指挥员这一职务。在我们根据地的西面，驻扎着包尔江元帅的哈萨克红军，现在他们正为境内层出不穷的匪患而困扰，而这正是训练我们指挥员作战技能的大好战场。\n\n我们将去信中国旅的昔日战友包尔江元帅，以共产主义战友援助的名义申请入境帮助他们剿灭匪患，并在此过程中让我们的新指挥员得到成长。这将是对我们双方都大有好处的益举，相信哈萨克红军将会非常乐于接受我们的援助。"
 COX_A_New_Born_Government: "新生的政权"
 COX_A_New_Born_Government_desc: "盛世才的统治结束了。现在，共产党人接管了迪化城，以及整个新疆——虽然仅仅是名义上的。喜悦的情绪并没有持续太久。革命者们很快意识到了打败盘踞在新疆的盛世才部只不过是解放这里最简单的一步。\n\n迪化城的广播站日夜不停地播报着48小时前毛岸英的演讲，但整个新疆响应者寥寥。看来若想将地广人稀，民族成分复杂，封建势力根深蒂固的新疆改造为解放整个西北乃至全中国的根据地，必然道阻且长。但为了故乡的解放，为了已经牺牲的同志们，我们必须立刻投入工作。\n\n§R“雄关漫道真如铁，而今迈步从头越。”§!"
 COX_A_New_Road_Design: "铺设新道路"
 COX_A_New_Road_Design_desc: "旧有道路的翻新正在如火如荼地进行，得益于我们战士的努力，在翻修旧路之外，我们尚有余力开辟一些新的道路。虽然现在这些新修道路沟通的都是无人的沙漠与戈壁，但在可预见的未来，它们将会在成为沟通新疆工业的新动脉。"
 COX_A_Red_Army_Reborn: "工农红军新生"
 COX_A_Red_Army_Reborn_desc: "随着根据地部队质量与数量的显著提升，赋予我们的革命军队一个正始的名称逐渐成为了共识。就在刚刚，决议已被通过，为了完成前人未竟的事业，我们将继承烈士们的遗志，继续沿用此前的工农红军番号。中国旅与其他各部队被整编为中国工农红军第一军，由毛岸英同志出任军长，刘少奇同志任政委，两项提名均得到党内全票通过。\n\n经历了四十年火与血的洗礼，一度陷入困境的工农红军重新从深渊中崛起，涅槃重生。持久的战斗仍在继续，为了全民族的解放与无产阶级的权益，工农红军将与日本侵略者与其军阀帮凶斗争到底。新疆只是我们的起点，我们将会从这里出发，将中华大地彻底打扫干净！"
 COX_A_Tough_Decision: "艰难决定"
 COX_A_Tough_Decision_desc: "曾经效命于盛世才的一些旧军官被证明是不值得信任的，苏维埃需要一批新的指挥员来带领革命军队继续向前。然而，新疆并没有任何一所陆军学校，即使从现在开始培育军事人才也是远水难解近渴，我们只能将目光放在中国旅的同志们身上——他们有丰富的作战经验和坚定的革命信仰，只要略加培训就能胜任基层指挥员的任务。许多老同志可能舍不得离开自己战斗的连队与出生入死的战友，无论对于我们还是他们，这都是个艰难的决定；然而，为了革命事业光明的未来，这是不得不做出的牺牲。\n\n我们将从中国旅的战士们中挑选经验丰富的老兵，并将他们培养成指挥员。"
 COX_Abolish_The_Privilege_Of_Religion: "废除宗教特权"
 COX_Abolish_The_Privilege_Of_Religion_desc: "长期以来，主张信安拉者皆兄弟的伊斯兰教蜕变成了压迫人民的工具。阿訇们与农奴主们勾结在一起，组成了新疆的统治阶级，为全疆的农奴和农民们戴上了沉重的枷锁。人民必须从这种宗教压迫中解放出来，但如若执行的太快的话，可能会把相当大的一部分人民推到我们的对立面去。为此，我们必须一面分化阿訇群体，一面向人民揭露他们的真面目。"
 COX_Abolish_The_Privilege_Of_Religion_tt: "§GActivate§! reform: §Y【Expose Beneficial Relationships】【Win Over Impoverished Aho】§!"
 COX_Accelerated_literacy: "速成识字法"
 COX_Account_The_Water_Conservancy: "水利情况普查"
 COX_Account_The_Water_Conservancy_desc: "在解放之前，新疆曾有过不少水利计划。但旧政府建设这些设施的目的并不是改善人民的生活，而是与地主阶级合谋，中饱私囊，这就导致了这些水利设施如今很少有能发挥作用的。叶城县托普克村的民族渠是其中的典型。村民都说，“挖渠三十年，挖满了地主爷的钱包，废了咱家里的男丁。”三十年来，统治阶级借着挖渠之名大肆征收税款，征发劳动力，搞得劳民伤财，水道却迟迟未通。有鉴于此，盛世才时期留下的水利统计数据就不能不令人怀疑了。我们的工作队已经出发，并将进行对全疆水利情况的勘察测定，预计在数周之后，我们就能得到一份相对更真实可信的报告。"
 COX_Account_The_Water_Conservancy_tt: "§GActivate§! feature: §Y【Crush the Water Bullies】§!\nWe will §Gobtain§! §Ydetailed information§! for each province!"
 COX_Achievement_Of_The_Second_Land_Reform: "第二次土地改革的成果"
 COX_Achievement_Of_The_Second_Land_Reform_desc: "在同志们几个月以来的艰苦工作，还有全疆人民的不懈追求下，新疆的模样发生了翻天覆地的变化——农奴得到了解放，供水得到了保障，宗教也进行了改组。我们已经基本上达成了土地革命的目标，现在的新疆，耕者有其田，自给自足的小农既不会受到地主的剥削，也不会被沉重的劳役负担所压迫，又能得到足量的用水，生产积极性大为提高，全疆的粮食产量普遍增长了一倍以上。\n虽然这种小农经济离真正的社会主义经济还差的很远，但经过了这场运动，我们的革命已经坚实的扎下了根，现在，革命终于可以迈出下一步了。"
 COX_acquiescence_squire: "默许乡贤政治"
 COX_acquiescence_squire_desc: "在我们中国共产党辐射势力范围之外的大部分乡村里，与农会相比，乡贤们才是真正的乡村之主，农民们信任乡贤更胜过信任红军，在乡贤的统治下，我们的下乡战士们在进行土地革命工作时总是“失踪”“意外身亡”。我们已经经不起这样的损失了，或许默许我们势力范围以外的地方的乡贤政治，是一个不错的选择？"
 COX_ADJ: "中国旅"
 COX_Advance_The_Building_Of_Agricultural_Organization: "完善农会制度"
 COX_Advance_The_Building_Of_Agricultural_Organization_desc: "在土改的过程中，在新疆的广大乡村里普遍建立了人民农会组织。这一制度在土地改革的顺利推行以及对流窜在乡间的反动分子的打击行动中起到了重要作用。而随着土地改革的完成以及镇压反革命的基本胜利，农会却还没有及时完成从斗争组织到民主生产生活组织的转变，在生产建设中行事过分激进，或者说，“没有分清人民内部矛盾与敌我矛盾的问题”。我们将对各地农会的工作进行指导，促进农会的主要职能转换，从而更好地为全疆农民服务。"
 COX_Agricultural_Water_Supply_System: "农业用水调拨体系"
 COX_Agricultural_Water_Supply_System_desc: "在土改时期，我们曾辛劳建设过新疆的水利工程。直至今日，这些成就也在造福着本地群众，但很明显还不够：虽然新疆人普遍具有朴素的节水意识，但水资源仍有浪费现象；同时水的产能还能再提高一些。因此，一方面，随着工业体系的初步建成，我们可以稍微地扩建一下原有的水井，并采取更系统化的水源分配措施。而另一方面，我们也需要改进诸如漫灌之类耗水量巨大的生产方式。"
 COX_Aid_From_Old_Red_Army: "老红军的援助"
 COX_Aid_From_Old_Red_Army_desc: "在两次世界大战过后的今天，大战中形成的战术思维已经显得十分落伍了。然而，我们的指战员们大多都没有听说过何为“现代战争”，更谈不上如何去进行一场现代战争，这会使得我们在未来面对日本军队及其仆从时落入相当不利的境地。为了尽可能地消除这一隐患，我们将尝试向西蒙的流亡红军申请一批教官——倘若他们还有余力能够派出任何人的话。"
 COX_alertness: "日本帝国隐约觉察到了我们的存在......"
 COX_all_messed_up: "现在的新疆，到处都是混乱过后的痕迹，战火破坏了村落，农田，和无数的家庭。我们尽了最大的努力了，但这个世界就是这么无情……"
 COX_all_that_can_be_done: "人事已尽..."
 COX_all_that_can_be_done_desc: "至此，我们已做好了准备。整个苏区军民已被动员起来以应对这前所未有的威胁。\n我们已经做了能做的一切…但是…我们真的能战胜他们吗？"
 COX_Among_The_People: "群众路线"
 COX_Among_The_People_desc: "在延安时期，与趾高气昂的国民党官员和乡绅不同，我们的党是如此深入群众，以至于没人能将一个共产党员和一个操劳的农民区分开来。我们的党员从群众中来，到群众中去，深受群众的拥戴，这也是我们最终能在陕甘宁建立起牢固的根据地的基础。\n面对新疆革命的严峻形式，我们更要发扬“群众路线”，我们的战士们将深入广大乡村，与群众打成一片，只有这样，才能逐步建立我们对于基层的控制。以便于下一阶段工作的开展。"
 COX_An_Insurmountable_Gap: "江舟难渡"
 COX_An_Insurmountable_Gap_desc: "一条大江横亘在我们面前。\n\n它不是由水构成，而是由意识形态、猜疑与尚未干涸的血构成。江的一边，是旧的世界，是褪色的共和国幻影；另一边，是崭新的世界，是通往光明的唯一蓝图。\n\n而我们，就乘着一艘名为“联合政府”的扁舟，航行于江心。\n\n立于当下这片崎岖的礁石之上，遥望对岸那座象征着权力的殿堂一那是我们共同的目标，也是斗争的终点。那里有我们规划好的一切：水坝、铁路和没有饥谨的未来。\n\n但船上的水手是昔日的死敌，他们宁愿凿穿船底，也不愿让对方掌舵。每一次政策的推行，都像是用一支小小的船桨，去对抗咆哮的、名为“不信任”的激流。\n\n江水很宽，暗流很急。我们能否抵达对岸，还是在这江心之中倾覆，都只在一念之间。"
 COX_Ancient_Country_But_New_Life: "古国新生"
 COX_Ancient_Country_But_New_Life_desc: "第二次抗日战争的爆发震撼了全世界，全球都将目光再一次投向了这个东亚的破碎国度。\n\n那些试图探寻真相的记者的者所看到的，是一个同仇敌忾，共御外侮的民族；是一个摒弃矛盾，上下一心的国家。原先神秘的古国褪去了死气沉沉的暮气。虽然她的手足仍为锁链束缚，浑身的脓疮与疤痕仍深可见骨，但她已从半睡半死的迷梦中清醒了！\n\n重新抖擞精神，周身萦绕着新生的活力，中国誓要将帝国主义的罪恶荡涤一空！"
 COX_Anger_Boiling_Over: "满腔的怒火已经沸腾"
 COX_Anti_sweep: "反扫荡战术"
