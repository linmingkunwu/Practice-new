 COX_armed_military: "高强度武装的民兵！"
 COX_armed_military_desc: "人民群众的力量是无穷无尽的！我们共产党人必须相信群众！让我们把农民兄弟武装起来！保护属于他们的田地！"
 COX_army: "§M经过整编的工农红军将在乌鲁木齐集结。§!"
 COX_Army_And_Country: "军与国"
 COX_Army_And_Country_desc: "铁与火淬炼出的军队，本该是国家意志的延伸，维护领土完整、捍卫民族尊严。然而，今日之局势却令人警醒——军权分散，战旗交错，国防体系支离破碎。国家直属部队数量微薄，难以支撑稳定局势。\n\n西北之地，镰锤旗飘扬，人民红军自成体系，游离于国家体制之外；南京近郊，护国军与国民党的军队各据一方，黑天血日旗与青天白日旗混乱交织，军令无法统一，指挥权形同虚设。这片土地上，每一支部队都有自己的信仰和主张，却缺乏一个共同的意志。若无变革，内耗无可避免，国防现代化将无从谈起。\n\n国民大会必须出手。各党派的武装力量必须被整合，零散的军权必须收束至国家之手。唯有如此，军队才能真正服务于国家，战争机器才能高效运转，国家安全才能得到保障。任何犹豫与拖延，都是对未来的怠慢。历史不会容忍懦弱，时代不会等待迟疑，军与国的统一，势在必行。"
 COX_army_change_tt: "§G八十八旅将组织一个珍贵的炮兵营并前往北疆同当地游击队会师§!"
 COX_army_reform: "§M工农红军将在乌鲁木齐集结。§!"
 COX_assassinate_officers: "刺杀日军军官"
 COX_assassinate_officers_tt: "这将有效打击日军的士气，但如此激进的行动会降低我方渗透"
 COX_assemble_soldiers: "收拢下乡战士！"
 COX_assemble_soldiers_desc: "敌人的威胁迫在眉睫，我们必须将我们的下乡战士们和民兵们全部召集起来组成战斗部队，巩固我们仅存的领地，守护我们最后的革命之火。"
