 COX_GAW_GUI_SpecOp_Requires_NF_tt: "完成国策§Y“挺进华北”§!以解锁特殊行动"
 COX_Gaze_At_The_Far_East: "眺望远东"
 COX_Gaze_At_The_Far_East_desc: "如今，新疆根据地似乎已经足够稳固了，但我们面临的内外状况仍旧严峻——堪堪复苏的农业难以保证大量人口的温饱，日本帝国主义随时有可能发起的进攻更是令我们如鲠在喉。为了保卫根据地不受外敌侵犯，更为了迈向全国的解放，我们必须了解中国内地的情况与日本帝国主义的动向。\n我们的革命伙伴布里亚特，正与我们面临着相同的威胁，与他们建立有效的合作将大大促进两国的革命运动。"
 COX_get_law_tooltip: "[GetAssortedLawsDescCOX]"
 COX_Grassroots_autonomy: "基层自治"
 COX_Grassroots_autonomy_tt: "这将增加我们对两地区的整合！"
 COX_guerrilla_warfare: "游击运动战"
 COX_guerrilla_warfare_desc: "大兵团对抗绝非我们所长。利用祁连山脉和荒漠戈壁的复杂地形，派出小股精锐迂回敌后。提前勘测地形，建立藏匿点，随时准备骚扰、切断敌军的补给线，用漫漫长夜的游击战拖垮他们的锐气。"
 COX_guide.1.a: "祝你玩得愉快！"
 COX_guide.1.d: "欢迎游玩《新秩序：光自贝加尔湖来》！无论你是从国家选择界面的中国旅跳转到布里亚特，亦或者是自主选择布里亚特进行开局，当你看到这个消息的时候，证明你已经正常开始了本模组的流程。\n接下来，你需要击败伊尔库茨克，之后西行经历数个tag后，本模组的主tag才会出现在新疆北部。\n\n特别提示：如果你是从国家选择界面的中国旅跳转到布里亚特的，由于钢4原版的Bug，你需要切换地图：先按一下F2，再按一下F1，这样才能正常显示陆军地图界面。"
 COX_guide.1.t: "欢迎游玩！"
 COX_guide.2.a: "......好吧。"
 COX_guide.2.d: "欢迎来到新疆执政府，伟大的省主席盛世才的领地！在这里，盛世才主席的统治将会…\n等等，什么叫你是来找中国旅旅和毛岸英的？我们这里没有叫这名儿的军队，我不明白你在说些什么。\n哦，我明白了，你是共产党的人！他们的故事现在还不在这里，你要做的是退出到选择国家tag的页面，然后选定中国旅。\n快跑吧！要是盛世才发现了你，他是不会留情面的！"
 COX_guide.2.t: "欢迎来到执政府"
 COX_has_GAN_remenants_tt: "西北方面军的残部已经在陕西构成了问题"
 COX_Heavily_Restricted: "举步维艰"
 COX_Heavily_Restricted_desc: "在巩固了迪化城后，中国旅指战员与新疆支部决定前往农村，撬开千年未变的平静生活的表象，揭露其下残酷的阶级斗争的内里，继而号召受苦受难的人民起来，推翻压迫者。\n\n——尽管有着这样的雄心，但他们的工作进行的并不顺利。这一方面是因为巴依和阿訇对这些无神论者长久以来的污名，也有横贯在他们之间的民族鸿沟。但最重要的是，相比于新疆的广阔疆域，中国旅的人数实在是太少了。一个又一个的战士被派往偏远的村庄，大多数无功而返，而部分狂妄的巴依甚至鼓动群众，对迪化派来的战士除以残暴的私刑。\n\n§R任务艰巨，时间紧迫，我们必须想出更好的办法。§!"
 COX_helmsman: "舵手"
 COX_help_army_anti: "援助游击队"
 COX_help_army_anti_trigger_tt: "已经与马家军残部建立了联系"
 COX_help_army_anti_tt: "这将降低我们在西北军渗透的衰减！"
 COX_Hidden_factory: "隐蔽工厂"
 COX_Hidden_factory_tt: "我们将会获得额外的生产单位，但这样的工业调动将会降低我方渗透"
 COX_hidden_supply_lines: "隐蔽交通线"
 COX_hidden_supply_lines_desc: "现有的新疆与青海之间的主要交通线不仅稀少，而且极易被破坏。为了保证前后方的生死命脉，运输队和筑路工必须冒着生命危险，在玉宇琼宫间强行开辟出几条极其危险、地形恶劣但能躲避敌袭的隐蔽路线。哪怕是用人背马驮，物资也必须送上去。"
 COX_hoard_weapons: "囤积武备"
 COX_hoard_weapons_desc: "迪化的兵工厂在全力以赴地轰鸣，但这远远不够。我们必须动用一切手段，通过西伯利亚的黑市、走私网络以及任何能联系上的渠道，哪怕是用珍贵的矿石和黄金去换，也要换来枪支、电台和维护工具。我们要把每一个仓库、每一间地窖都塞满武器，无论是新造的还是缴获的旧货。"
 COX_Hold_Cadre_Meeting: "召开干部大会"
 COX_Hold_Cadre_Meeting_desc: "据可靠情报显示，我们的邻居马家军即将爆发一场内乱。新疆苏区自成立以来第一次受到外部威胁。这次动乱是苏区上下干部不得不接受的考验，另一方面也是一次机会。\n\n治安、交通、军队、经济，都是应对此次动乱的重点。\n把这些部门的干部都召集过来！"
 COX_Hold_The_Gun: "将钢枪紧握在手！"
 COX_Hold_The_Gun_desc: "装备低下，充盈着革命热情的赤卫队；整编后的新疆军阀部队；还有规模庞大，作战经验丰富，但仅听命于马惇靖的宁系马家军……此时的西北“红军”，更像是新疆与青海军队粗暴的融合。就常理而言，这样民族构成复杂，甚至存在意识形态分歧的部队，其内部必然充斥着矛盾与冲突，几乎不可能步调一致的行动。但第二次抗日战争的爆发，使得红军与宁系马家有了共同的目标，在抗日的旗帜下，目睹了日军在兰州暴行的战士们同仇敌忾，抛下了民族与宗教的分歧。每个人都将步枪紧握于手，誓与敌寇拼死活！"
 COX_Hold_The_Long_Cord: "长缨在手"
 COX_Hold_The_Long_Cord_desc: "从1921至今，历经半个世纪、两代共产党人的流血牺牲，中国人民终于实现了长久以来的梦想：建立起独立自主的社会主义中国。但解放只是迈向社会主义的第一步。\n\n在内部，无数的国民党残部与日伪份子仍未被清算，半数国土尚未开始土改，经历过两次大战的红军战士筋疲力尽，已再难支撑起下一场大战，而无数敌特分子仍潜伏暗处，为日寇重整军备争取时间。\n\n在外部，残暴的日本帝国主义绝不会甘心咽下失败的苦果，总有一天会卷土重来；朝鲜人民和台湾同胞们仍生活在日寇的刺刀之下，期盼着我们的解放；西方，新生的苏维埃联盟仍在与凶悍的纳粹德国对峙，下一场西俄战争早已进入倒计时，紧随其后的定然是解放全欧洲的世界革命；而大洋彼岸，我们仍不可知新生的国际共运对那古老的资本主义堡垒意味着什么。\n\n不过，无论未来如何，当下我们都是毫无疑问的胜利者，只要抓住眼下的时机重整旗鼓，我们一定能再次创造奇迹，扫除眼下的一切困难，让中华民族和共产主义重回世界舞台的中心。"
 COX_huabei_jinan: "§Y济南§! [Get_COX_GAW_GUI_City_S_Fort]\n--------------\n\n\n£Jinan_tt_pic \n\n\n\n作为日本华北派遣军的总部，济南被打造成了一座难以企及的堡垒。从空中的巡逻飞机到黄河上的炮艇，城中的每个角落都密布着杀意。然而，一旦这座城市落入抗日力量手中，不多时解放的红旗就会飘扬在黄海的岸旁。"
 COX_huabei_peking: "§Y北京§! [Get_COX_GAW_GUI_City_N_Fort]\n--------------\n\n\n£Beijing_tt_pic \n\n\n\n如果你偶然抬头看见古城墙上覆盖的青苔，也许会感慨封建王朝的兴盛衰亡，但当你看到天安门时，就只剩下惊叹。如今，门楼和城墙上的机枪与耸立在大地上的格格不入的碉堡，无一不显示着日本对于中国北方政治经济中心的统治。"
 COX_huabei_taiyuan: "§Y太原§! [Get_COX_GAW_GUI_City_N_Fort]\n--------------\n\n\n£Taiyuan_tt_pic \n\n\n\n拨开层层叠叠的铁丝网，往日当地军阀留下的兵工厂此刻正不分日夜地运转，将这片土地的血液锻造成钢与火，以阻挡抗日势力进军华北平原的步伐。晋阳之地曾见证了无数王朝的迭起兴衰，而现在它将见证中华大地的命运。"
 COX_huabei_zhengzhou: "§Y郑州§! [Get_COX_GAW_GUI_City_S_Fort]\n--------------\n\n\n£Zhengzhou_tt_pic \n\n\n\n中华文明的发源地早已被侵略者及其走狗所玷污。日寇和保卫团的刺刀总是蒙着一层粘稠的暗红，城中蜿蜒的河流则堆满了反抗者和无辜者的尸首。就连黄河也被这血色染红，于是她咆哮着从远方召来了复仇的浪潮。"
 COX_Huang_Yanpei: "黄炎培"
 COX_idea_huabei_15: "中共华北支部"
 COX_idea_huabei_16: "兄弟党的协助"
 COX_idea_huabei_17: "作鸟兽散"
 COX_idea_huabei_18: "往日之影"
 COX_Imam_of_the_People: "人民阿訇"
 COX_Imam_of_the_People_desc: "有了新疆多位著名宗教领袖的公开拥护以及宗教去反动化斗争中的全面胜利，是时候为年轻一代的教职人员（“阿訇”或“毛拉”）的培养订下标准了。新一代的教职人员的资质需要得到苏维埃政府民族宗教事务部门的审核，他们应当热爱祖国，热爱人民，拥护革命，宗教素养过硬，科学常识过关。在党的引导下，新生代的教职人员们将被培养成合格的社会主义建设者，保护、研究宗教文化遗产，与党员干部一起为人民服务。"
 COX_Import_New_Machinery_From_Buryatia: "引进布里亚特设备"
 COX_Import_New_Machinery_From_Buryatia_desc: "仅仅依靠抢救盛世才时期遗留的旧机床是不能满足我们的生产需求的，然而，我们的根据地连生产一支像样的步枪都困难，更不要说补充工业设备了。为此，我们计划向布里亚特苏维埃共和国购买一些机床。虽然他们的工业化状况也不尽如人意，但比起我们要好得多。"
 COX_Imported_Buryat_equipment: "进口布里亚特设备"
 COX_In_The_National_Assembly: "庙堂之上"
 COX_In_The_National_Assembly_desc: "国民大会的成功召开，是新生共和国的一个重要里程碑。它象征着国家的统一，标志着一个崭新的政治时代的开始。\n\n然而，国共两党虽然在形式上达成了合作，但政治氛围却颇为微妙，弥漫在会场内外的与其说是共商国是的谨慎，更像是彼此戒备的紧绷气息——谁都死死攥住自己的底牌不肯退让半分。议会内，双方代表的关系既有合作的成分，也充斥着竞争和猜疑。每一次议案的提出和讨论，都像是在走钢丝，既要维护表面的团结，又要在政策上争取更多的主动权。\n\n尽管人人都默认国民大会是当下难得的议事平台，但积攒多年的猜忌也不会因一纸决议就消散。众人都抱着共建国家的初心相向而行，不过能否在磨合中走出一条光明的前途，只有交由时间来证明了。"
 COX_industrialization: "新疆工业恢复计划"
 COX_industrialization_desc: "土地改革的顺利完成，使得我们终于能够分出精力来处理新疆工业的烂摊子。在盛世才无能的治理之下，消极怠工已经成为了一种弥漫在工人之间的风气，无人维护的机床连开动起来都显得困难，罔论制造任何产品了。我们将通过抢修、购买机器和培训工人等等手段，挽救摇摇欲坠的新疆工业。（点击齿轮或电力图标选择模式）\n§B目前有§! §M[?machine_tool|0Y]§! §B单位的机床可以支持我们的工业恢复计划§!\n§B目前有§! §M[?worker_available|0Y]§! §B单位的空闲工人可以分配§!"
 COX_initialize_negotation_willing: "初始化谈判意愿"
 COX_Inspect_The_Army: "检阅革命军队"
 COX_Inspect_The_Army_desc: "得益于土改与政治革新的顺利推行，新疆地区已经不再是独裁军阀的小王国，各族人民在此安居乐业，共同为了建设苏维埃而努力奋斗。先前分散在地方维持稳定、打击坏分子的部队已经完成了任务，正在陆续返回乌鲁木齐，在短暂的休整后将继续投入日常的操演训练中去。苏维埃计划在近期开展一次阅兵，我们将再次审视自己的革命军队，同时也向新疆人民展现我们保卫革命的信心与能力。"
 COX_integrate_state_decision: "Integrate §M[THIS.GetName]§!"
