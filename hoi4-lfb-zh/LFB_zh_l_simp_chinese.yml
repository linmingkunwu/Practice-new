 COX_back_home_country_flag: "逐尽侵疆之敌，复故土以安四方。"
 COX_back_home_DESC: "卢沟宛平寸土决不让，淞沪笕杭陆空双捷战志昂。"
 COX_back_home_NAME: "国土重光"
 COX_Banditry: "匪患"
 COX_Banditry_desc: "在战火硝烟尚未完全散去的土地上，黑暗的阴影依旧盘踞。日本侵略者虽已溃败，但他们残留的散兵游勇仍然在丛林与山地间苟延残喘。而更为狡诈险恶的，是那些在国民党溃败时遗留下的反动武装与特务——他们并未随政权的覆灭而消失，反而如毒蛇般潜伏在各地，伺机而动。这些武装分子与地方横行多年的土匪恶霸勾结，形成了一张错综复杂的地下网络。\n\n这些匪患并非乌合之众。他们有组织、有计划，甚至拥有从敌占区遗留下的武器与情报支持。白天，他们潜伏在山林和乡村的暗角，夜幕降临之际，便开始肆无忌惮地行动：抢掠粮食、袭击哨所、煽动叛乱，甚至在某些地区制造了骇人听闻的大规模屠杀事件。他们不仅威胁到人民的生命财产安全，更试图动摇新生政权的根基。\n\n每一次枪声的回响，都是对人民政权的挑衅；每一次村庄的燃烧，都是对社会安宁的践踏。若任其滋生蔓延，这片苦难深重的土地将永无宁日。我们绝不能坐视不理，不能让这些毒瘤继续侵蚀国家的肌体。铁与火的洗礼已经结束，然而新的斗争才刚刚开始。"
 COX_Base_Stability: "基层安定"
 COX_Battle_The_Landlord_Troops: "打击地主武装"
 COX_Battle_The_Landlord_Troops_desc: "在中国的自然经济进一步解体，以及天灾人祸的加持下，自然而然的出现的“无绅不豪，无豪不劣”的情况。在新疆也是如此，由几个大地主牵头组织的“私兵”或“家丁”们总是鱼肉乡里，对忤逆的人施以各种酷刑，是地主阶级对农民进行残酷压榨的根本仰仗。他们是一股不可小觑的力量，若想要土地改革继续下去，我们必须砸碎地主的一口铁牙。"
 COX_Battle_The_Landlord_Troops_tt: "§GActivate§! feature: §Y【Crush Potential Landlord Militias】§!"
 COX_Battle_The_Religious_Force: "打击宗教武装"
 COX_Battle_The_Religious_Force_desc: "宗教武装是高度依附于封建土地所有制、也就是地主、寺庙的庄园经济存在的，它们是一套环环相扣的封建宗法的动员系统，先是由大的维吾尔、哈萨克宗族长老牵头，然后大庄园、大牧场主出钱粮，而宗教人士则负责传递真主的旨意，张牙舞爪的在宣礼塔上鼓动无知的年轻人为统治集团的阶级利益而流血牺牲。\n不得不承认，宗教天然有着一股动员能力，假以时日，平静的清真寺中也将走出无数信仰坚定的战士。为了确保土地改革顺利进行，我们必须对宗教武装进行迎头痛击。"
 COX_Battle_The_Religious_Force_tt: "§GActivate§! feature: §Y【Crush Potential Religious Militias】§!"
 COX_Beat_Wolves: "端起猎枪打豺狼"
 COX_Boiling_Iron: "沸腾的铁水"
 COX_Boiling_Iron_desc: "沸腾的铁水"
 COX_Bookmark_DESC: "从冰天雪地的阿尔汉格尔斯克一路向东，以“西俄罗斯革命阵线外交使团”为名号的近卫步兵第八十八旅，跟随着旅长毛岸英一路辗转来到了贝加尔湖畔——最高主席团的势力范围中。虽对这些风尘仆仆的战士们本身并无兴趣，但最高主席团首脑亚戈达敏锐地觉察到，八十八旅的到来正是巩固主席团“正统性”的良机。他不仅许诺当俄罗斯情况稳定之时，支援他们还乡，还为这支远道而来的部队恢复了荣誉番号，并进行了补员。大量走投无路北上的原东北抗联部队，流离失所的中国党员与战士，还有数量不少的蒙古、哈萨克乃至布里亚特原住民战士被亚戈达一并塞到了八十八旅之中。\n \n作为主席团权威的象征，八十八旅频繁地出现在阅兵，巡逻与镇压“内部敌人”的运动中，却在远东人民真正需要他们之时被调离对抗法西斯的战场。毛岸英深知他们都已经成了亚戈达掌中的“锡兵”：任其摆布，毫无选择的自由。因而，无论是虚假的赞誉或是羞辱，他都一概接受。在NKVD的紧密监视下，毛岸英一度几乎要接受了自己的命运……但久违的重聚却令这些离散异乡的战士们共同发出了灵魂深处的希冀——回家！二十年来，故乡被侵略者残酷地蹂躏，人民被屠戮，奴役，但他们不愿再等下去了。他们要回去，去到白山黑水，黄土高坡；他们宁愿死于返乡的征途，也不愿溺死在这死气沉沉的远东。\n于是，当贝加尔湖右岸的一个青年发出反抗暴政的先声后，八十八旅迅速揭竿而起。汇聚在反抗暴政的红旗之下，战士们气势如虹；倘若将那暴君擒下，就要踏上那漫漫还乡路……"
 COX_Brand_New_United_Front: "崭新的统一战线"
 COX_Brand_New_United_Front_desc: "时隔二十年，无数出身不同，口音迥异，信仰截然相反的人，再一次以“中华民族”的名义，在民族存亡的时刻中建立起遍及整个社会的广泛同盟。但与上次名存实亡的统一战线不同的是，二十年间帝国主义的残暴统治，教育了每一个中国人谁才是真正的敌人。这一次，我们的统一战线将团结如钢，也更加有信心战胜日本帝国主义与腐朽的”大东亚共荣圈“，让中华民族真正地自立于世界民族之林！\n\n§e肩并肩的站起来吧，挣扎在枷锁下的人民啊：我们别无退路，唯有解放一途！§!"
 COX_Bring_A_Spring_Of_Liberation: "带来解放的新声"
 COX_Bring_A_Spring_Of_Liberation_desc: "在迪化军政府的治理下，新疆的情况相较二十年前并没有根本的改善，甚至在局部地区还出现了恶化。水利堰塞、农田盐碱化，工厂因为产能低下竟被手工业淘汰，这在任何地方都是奇观。兵痞可以置人民的死活于不顾，但我们不同，我们的革命军队将一直都是人民解放的先声，在西蒙就是，在新疆也是。我们要将社会主义的新声与承诺带给这里饱受落后生产关系压迫的人民，鼓舞他们加入全疆解放的生产斗争。"
 COX_Broken_Blade_Sinking_Into_The_Sea: "断刃沉海"
 COX_Broken_Blade_Sinking_Into_The_Sea_desc: "战火的硝烟虽然已经散去，但它留下的创伤却深深地刻在了这片土地上。南京城内，曾经的辉煌已被战争摧毁殆尽，残垣断壁诉说着无尽的痛苦与牺牲。在那些瓦砾之间，偶尔还能看见半幅褪色的楹联，墨迹被雨水洇成一团模糊的影子，像是一个时代临终前没能写完的遗言。\n\n国共双方虽然在废墟之上达成了停战协议，但彼此之间的猜疑与敌意未曾消弭。\n\n两党在各个议题上的高度分歧，使得这个新生的国家如同一艘在风雨中摇摆的巨轮，船身的裂痕交错，而甲板上的人却在为航向争执不休。远方天际线上，乌云正在酝酿一场新的风暴。而这艘巨轮，仍在两股主要力量的对峙中，等待着它真正的航向——或者，等待着下一道将它彻底撕裂的惊雷。"
 COX_BRY.1.a: "“布里亚特的同志们，上午好。”"
 COX_BRY.1.d: "£gezifu £gezifu 马尔赫耶夫感到昏昏欲睡，从萨布林在广播中宣布起义，反抗亚戈达的暴政以来，他已经快要四十八个小时没有合眼了——亚戈达的后续部队现在到了哪里？目前在贝加尔湖北部的战况如何了？NKVD的渗透行动又是否已在进行当中？还有太多的工作没有做完，然而火热的革命激情并不能战胜身体的本能，现在他已疲惫不堪。\n\n£gezifu £gezifu 或许他需要一杯咖啡，他想。但在偏远的贝加尔湖畔，这种东西可不是那么容易搞到的。马尔赫耶夫眼前的事物已经模糊了起来，如果电报员没有适时地嚷叫起来，他恐怕要就这样睡过去了。\n\n£gezifu £gezifu “米什卡同志，我们监听到了一个陌生的无线电呼叫！距离我们和主席团在贝加尔湖南岸的对峙线只有几公里远！”\n\n£gezifu £gezifu 这突然的消息让马尔赫耶夫瞬间清醒了过来，他扑到电台边，注视着闪烁的指示灯，那是一个他没有印象的陌生信号。起义事出突然，在贝加尔湖北岸作战的数个民兵师基本没有装备军用电台，布里亚特苏维埃现在掌握的唯一一支正规军队使用的电台也不在这个波段，是谁会在这种情况下呼叫他们？\n\n£gezifu £gezifu “给三师发报，让他们查查主席团各支部队的电台波段。”\n\n£gezifu £gezifu “可……”电报员面露难色。\n\n£gezifu £gezifu “没事，给他们发报吧。”马尔赫耶夫挥了挥手，“反正我们的电台从一开始就在被NKVD的狗崽子们监听，已经不存在什么保密工作了。”\n\n£gezifu £gezifu 帐篷里的小小指挥部安静了片刻，也许因为电台颠簸的原因，正在进军中的三师应答信号不是很清晰，马尔赫耶夫侧耳倾听，只能听到断断续续的对话，不过他注意到，电报员的脸色随着对话的推进而变得越来越凝重，等到通话挂断时，基本已经只能用惨白形容。\n\n£gezifu £gezifu “这个信号……是近卫步兵中国旅。”电报员摇了摇头，“一支骁勇善战的荣誉部队，亚戈达吹嘘的一大资本。米什卡，你知道这意味着什么。”\n\n£gezifu £gezifu 中国旅。距对峙线数公里远。马尔赫耶夫的头开始痛了起来，他明白这支部队已经进入了攻击阵地，只要他们想，就能随时发起进攻，而在那里没有任何人能够阻止他们。在这种情况下，为什么还要呼叫布里亚特的军用电台？是为了炫耀高明的破译技术吗？\n\n£gezifu £gezifu “……米什卡。他们还在试图呼叫我们，要应答吗？”\n\n£gezifu £gezifu “答吧。反正不外乎是劝降……”\n\n£gezifu £gezifu 马尔赫耶夫说完这句话后，便重重地坐回了行军椅上。他听到电台滋滋地响了几声，随即接通了，指挥部里的战士们都放下了手中的工作，紧张不安地屏息倾听。\n\n£gezifu £gezifu 然后，一个有力的男中音响了起来——"
 COX_BRY.1.t: "理想主义的共鸣"
 COX_BRY.10.a: "合作共赢"
 COX_BRY.10.d: "£gezifu £gezifu 自八十八旅南征已经过去了数个月有余，布里亚特苏维埃也抚平了曾经内战的伤口，整个苏维埃地区一片欣欣向荣。而近日，在听闻了蒙古地区的人民革命委员会在对日作战上取得重大胜利之后，布里亚特的人民也为此举行了一场庆祝会，之后，在岸英同志的推荐下，华西列夫斯基同志派遣人员前来布里亚特苏维埃商讨合作的相关事项。\n\n£gezifu £gezifu 在简单的讨论之后，布里亚特苏维埃和人民革命委员会决定就部分过剩资源的处理上展开经济合作，如，布里亚特苏维埃将会连接两个地区的旧联盟电网，确保人民革命委员会治下，中西伯利亚计划遗留下来的工业区生产，而人民革命委员会也将提供机床机器，交付给布里亚特，增强其的工业生产。同时，两地区的红军将展开一些合作演习，增强彼此的力量。"
 COX_BRY.10.t: "与人革委的合作条约"
 COX_BRY.11.a: "但现在，男人只想讨点酒喝。"
 COX_BRY.11.d: "£gezifu £gezifu 随着苏联的轰然倒塌，伟大的俄罗斯自此坠入谷底。她的人民在贫瘠的大地上颠沛流离，这里什么都缺，但唯独一样东西早已堆满了仓库——那便是流传于此地的英雄传说。\n\n£gezifu £gezifu 在贝加尔湖冰雪将消的日子，一个远行者踏入了一间湖畔的酒馆。无视了老板鄙夷的神情，他大踏步地迈开沾满泥水的毡靴，跨坐到一张木桌前。消融的积雪带走了大地的热量，他迫切需要一杯伏特加来暖暖身子。\n\n£gezifu £gezifu “你们这边收日元吗？”猛灌了一口伏特加，男人问道。\n\n£gezifu £gezifu 话音刚落，酒馆中所有尚且清醒的人一齐看向了这个男人，\n\n£gezifu £gezifu  “只收伊尔库兹克卢布。” \n\n£gezifu £gezifu “那东西贬值得这么厉害，你们怎么还在用啊？” \n\n£gezifu £gezifu “因为这里不是符拉迪沃斯托克，也不是萨马拉。”老板坚定地说道，“日本佬的钱在东方和南方是硬通货，但在这儿，除了NKVD的‘友好慰问’，它换不来任何东西。” \n\n£gezifu £gezifu “那……我脚底这双靴子能当酒钱吗？” \n\n£gezifu £gezifu “单是那双破靴子的话，不行，我洗都懒得洗。”老板拿起酒杯，重新斟了满满一杯伏特加，“但如果是它走过的路的话，就还能再值一杯……已经很久没有人从更东边过来了，这一屋子的老酒鬼，都愿意听听我们熟悉的远东已经变成了什么模样。” \n\n£gezifu £gezifu 这时，男人身边已经被凑热闹的客人们围了个满满当当，看起来如果他的故事无法令人满意，要交出的就不只是靴子了。男人深吸了一口气——周遭的酒气呛得他直咳嗽——又猛灌了一口伏特加——\n\n£gezifu £gezifu  “我来自堪察加，大陆的最东方……”"
 COX_BRY.11.desc: "£gezifu £gezifu “我听说那里不是被日本人占了吗？”“屁，那里现在是美国的一个州吧。”“瞎猜个啥，那里肯定是德国人的补给站，就像我一直在说的，他们的潜艇能够驶过北方的冰盖……”\n\n£gezifu £gezifu “咳咳……”男人猛咳了一声，周遭的七嘴八舌好一会才沉寂了下来，“那里是俄罗斯最后一支海军的驻地——我敢肯定。因为我就是从那里出发的。太平洋舰队的水兵们控制了港口与城市，民兵们设置了岗哨，控制了整个半岛。他们甚至还有一艘战列舰——十月革命号，我曾经就在上面光荣的服役。尤马舍夫——一位苏联时代的海军上将，指挥着现存的太平洋舰队和整个堪察加……”\n\n£gezifu £gezifu “那么你又是为什么离开呢？” \n\n£gezifu £gezifu “……唉。”男人叹了口气，将酒一饮而尽，“一位暮气沉沉的船长，指挥着一堆老掉牙的破船，游弋在破碎国家的海岸线上。我感到自己就躺在棺材里，只不过因为埋我的守墓人也死了，所以还能够呼吸……海上咸湿冰冷的海风，不比这里好上多少。” \n\n£gezifu £gezifu 或许有朝一日，那里将成为新生俄罗斯国家海军的基石，又或者，十月革命号的炮响将震颤整个世界，水兵们的勇气，又将点燃俄罗斯的激情——"
 COX_BRY.11.t: "身在方寸之地，威震四海之敌"
 COX_BRY.2.a: "为什么不去中国旅旅部亲眼看看呢？"
 COX_BRY.2.d: "£gezifu £gezifu “号外，号外！又一支部队加入了我们的队伍中，暴君的专制统治要到头了！”\n\n£gezifu £gezifu 上乌金斯克的天才蒙蒙亮，街面上就已热闹了起来。载满乘客的电车隆隆驶过，上早班的工人们夹着午餐，一边讨论着前线的战况一边向工厂走去。瓦列里·萨布林也在这支工人的队伍中走着，当他经过那个叫卖的报童时，报童不由分说地将一份报纸塞在了他的手里。\n\n£gezifu £gezifu “同志，看看今天晨报的头版吧！天大的好消息，我打赌你一定会喜欢的！”\n\n£gezifu £gezifu 萨布林对着男孩笑了一下，接过了递来的报纸。当然，头版上的那则新闻，他早就知道了——昨天晚上，马尔赫耶夫就打电话告诉了他——不过他还是很好奇宣传部的同志们会怎么报道这件事。他展开报纸，首先看到的就是一个超级长的标题：“英勇善战的荣誉部队近卫步兵中国旅加入革命队伍，对NKVD头子亚戈达残暴统治的沉重一击”\n\n£gezifu £gezifu 紧接着，头版用了足足半个版面来介绍中国旅此前的经历：他们参加了西俄罗斯战争，在叶戈罗夫元帅麾下与德国人搏斗并获得荣誉番号，战争不幸失败后以西俄罗斯革命阵线外交使团的名义跨越俄罗斯的皑皑荒原来到远东，最后又决定举义反抗亨利希·亚戈达的统治。文中还深情地描写道：“在谢廖沙同志的领导下，他们无畏地穿过反动派肆虐的雪原，兹拉托乌斯特的繁华不能蛊惑他们，卡冈诺维奇书记和他轰鸣的工业心脏也没能挽留他们……在托木斯克，沙龙中的小资产阶级分子要求武装监视他们过境，但他们并没有被吓倒，终于勇敢地到达了远东地区，再一次找到了组织。”\n\n£gezifu £gezifu 萨布林边走边看，边看边笑着摇头。虽然报纸上的记载大部分都是正确的，但是写得实在太过抒情夸张，他能理解同志们兴奋的心情，可现在这份报道简直像是亚戈达当年接待中国旅时那次广播演说的翻版。他看完了头版的内容，就把报纸夹在腋下，快步向不远处的临时苏维埃中央的驻地走去。当他快走到门口时，听到奥托正在屋里嘟囔着些什么。\n\n£gezifu £gezifu “宣传部的那群人是怎么想的……今天的晨报登了个啥玩意？近卫步兵中国旅里头又不只有从阵线来的老兵，还有中国与哈萨克红军的残部、中国东北的抗联和布里亚特人呢，这头版里一点没提到！我要去找宣传部的负责人！”萨布林在门口静静听完，不禁哑然失笑。当他把手举起来，准备叩响大门的时候，心里已经打定了主意。"
 COX_BRY.2.t: "晨报"
 COX_BRY.3.a: "按照你说的执行计划吧，谢廖沙同志。"
 COX_BRY.3.d: "£gezifu £gezifu 古西诺奥泽尔斯克，贝加尔湖南岸的小镇。倘若在平时，这个被冷杉树林所环抱的、常住人口堪堪万人的镇子，是一定不会被人们所注意到的；而现在，它成为了布里亚特苏维埃对主席团作战的最前线基地之一，近卫步兵中国旅就驻扎在这里。萨布林是跟随着一批武器弹药被运送到这里来的。虽然火车工人们自愿加班加点工作，但现有的铁路运量本就只能勉强应付补给需求，不可能为他单独拉一节客车。他坐在锅炉间里热得一身是汗，在去军营的路上又被冷风吹得瑟瑟发抖，只能努力控制着自己寒颤的身体，同时东张西望地观察着。一路上他见到了不少中国旅的士兵，由于还来不及换上新的制服，只能先在胳膊上绑红布条用以标识身份，除此之外，他们的精气神和布里亚特的其它起义队伍，没有任何区别。\n\n£gezifu £gezifu “萨布林同志！”\n\n£gezifu £gezifu 突然的呼喊让萨布林有些吃惊，循声望去，看到几个穿着厚外衣的人迎面而来，走在最前方的男人看起来像是个中年人，但是两鬓已经斑白，显得有些因为操劳而过度衰老了。他微笑着向萨布林伸出手来，萨布林也回握过去。\n\n£gezifu £gezifu “您就是萨布林同志吧？奥托和我们说了你要来的事情了，我和同志们在军营里左等右等等不到，就出来走走，真巧就遇到了……”\n\n£gezifu £gezifu 看着来人面孔清晰的东亚特征，萨布林终于反应过来，他现在正与之握手的人就是近卫步兵中国旅的旅长毛岸英，西俄罗斯战争的战斗英雄。一霎那，他的脑海中浮现出许许多多的好奇——亚戈达向来是把中国旅的到访视作西俄罗斯革命阵线对他所谓“最高领导地位”的承认，因此把中国旅的故事描绘得神乎其神，而真实的情况又是如何？他想要开口询问，但毛岸英好像看出了他的想法似的，对他微笑着摇了摇头。\n\n£gezifu £gezifu “以后我们自然有时间说那些。我现在想要和您讨论一件更重要的事情。”\n\n£gezifu £gezifu 毛岸英从身边人的手中拿过一份伊尔库茨克省的军用地图，展开举在萨布林面前，地图上用红蓝铅笔勾画得满满当当。萨布林虽然对这些标识没那么了解，但他也能看得懂，那个最大的红箭头，正是从古西诺奥泽尔斯克一直指向伊尔库茨克大坝。\n\n£gezifu £gezifu “亚戈达的核心统治区是围绕大坝向外辐射的，只要我们能够拿下大坝，切断他们的电力供应，主席团就坚持不了多久。”毛岸英用手指着大坝的位置，“现在亚戈达的部队基本都布置在北方，南部只部署了一个摩托化师，我准备赶在伊尔库茨克当地的NKVD部队被召集前，立刻发动进攻。因此，我希望能够得到步兵三师的协助……即使没有协助，我们也会进攻的，可那样胜算就会小得多。”\n\n£gezifu £gezifu 萨布林仔细地看了看地图。他得承认，这是一个极其冒险的计划，但是他们将有机会在最短的时间里结束内战，将伊尔库茨克的人民从暴政下解救出来。不管怎么说，这场起义本身就是一次冒险，何况步兵三师本来的任务就是守备南部战线，那么，有什么理由不去放手一搏呢？"
 COX_BRY.3.t: "突袭计划：1962.1.6"
 COX_BRY.4.a: "“我奉劝你好好想想，究竟谁才是叛徒。”"
 COX_BRY.4.d: "£gezifu £gezifu 谢富治快步走在伊尔库茨克空荡荡的大街上，战争已经结束了。就在今天的早些时候，近卫步兵第八十八旅的先头部队已经进入了坝区，在消灭了卫戍部队的微弱抵抗后，成功切断了主席团的电力供应，而亚戈达也很快被抓获。这个干瘪的老头坐在他断电后漆黑一片的地下指挥所里，攥着手枪等待着他最后的命运——当中国旅的战士们推开铁门时，亚戈达向他们发动了袭击，但却没有能够击中任何一人，在吞枪自尽前就被按在了地上。现在，谢富治正按照旅长的吩咐，带着宪兵队押解着亚戈达前往火车站，让他回到乌兰乌德，接受人民法庭的审判。\n\n£gezifu £gezifu “一群叛徒。”\n\n£gezifu £gezifu 由于怀疑NKVD部队在市中心安置炸药以作最后一搏，伊尔库茨克的居民已经被紧急疏散，整座城市如死一般寂静。因此，亚戈达尽管走在队伍的后方，但谢富治还是听到了他的话。\n\n£gezifu £gezifu “你说什么？”\n\n£gezifu £gezifu 靴子踩踏瓦砾的吱吱声停止了。谢富治示意队伍暂时停下，然后走到了亚戈达的面前。这个NKVD头子并没有被捆起来，也没有戴上手铐，只是被收缴了武器，因此现在只是冷冷地盯着谢富治看，好像完全听不出刚刚话中的诘责。这时，谢富治才想起自己刚刚说的并不是俄语，于是又用俄语问了一遍。\n\n£gezifu £gezifu “你刚刚，在说什么？”\n\n£gezifu £gezifu “我早该想到你们会叛逃。”亚戈达怒目圆睁，“你们——蒙古人、布里亚特人、哈萨克人——你们毁了苏维埃！你们毁掉了共产主义最后的希望！八十八旅就是叛乱者的集合，我早就应该想到！”\n\n£gezifu £gezifu 谢富治叹了口气，任凭这个老头继续吵闹下去。他从胸挂里掏出一根折断的香烟，划着火柴点燃，然后深深地吸了一口。烟雾随着俄罗斯大地冷冽的空气进入他的肺部，又让他想起了跟随东北抗日联军在松林雪山上游击的最后几年日子——所不同的是，不要说折断的劣质香烟，就连火种也几乎无法取得。那时，抗联在不得已的情况下作出了一个决定：全体撤入俄罗斯境内，寻求最高主席团的帮助。亚戈达确实向他们伸出了援手，但在伊尔库茨克的日日夜夜，他从未觉得自己像是一个革命部队的战士，而只不过是可以被呼来喝去的勤务兵。他削了无数的土豆，作为所谓的“中国友人”参加了无数的政治造势，一遍又一遍地接受亚戈达的检阅，并欢呼喝彩。如果可以重新选择，他宁可留在白山黑水之间，与日寇拼至流尽最后一滴鲜血，也不愿意在监视下的安逸中蹉跎时光。\n\n£gezifu £gezifu 香烟已经快要燃尽了。谢富治吸了最后一口，看向仍然喋喋不休地辱骂着布里亚特的亚戈达。\n\n£gezifu £gezifu “亨利希·亚戈达，你并没有资格对我们这样说三道四。”他把烟蒂扔在地上，轻轻地碾灭。"
 COX_BRY.4.t: "共产主义的叛徒"
 COX_BRY.5.a: "让我们去看看安那其主义者的生存状态吧。"
 COX_BRY.5.d: "£gezifu £gezifu 清晨的雾霭从贝加尔湖上升起，伊尔库茨克的街灯次第熄灭，这座叶尼塞河上的工业城市又一次从长夜中醒来。近卫步兵第八十八旅的驻营地比起往常更加热闹，战士们一面拆除帐篷，一面热络地讨论着革命胜利后的生活。日常的生活秩序已经恢复，而战争留下的痕迹正在被机械和劳动者的双手渐渐移除，因此今天他们就会开拨上乌金斯克进行休整。\n\n£gezifu £gezifu “谢廖沙同志！”\n\n£gezifu £gezifu 几个牵着马匹的布里亚特战士在忙碌的人群中穿行，大声呼唤着毛岸英的名字。毛岸英正在帮助通信员将电台移动到卡车上，听到这呼唤声，便转过身来向他们挥手示意自己的位置。\n\n£gezifu £gezifu 虽然战士们可以短暂地休憩，但他还有任务在身。八十八旅的指战员们被委任为临时外交使团，将要前往西比利亚黑军境内知会政权更迭的消息。这可能是因为八十八旅本就有横穿俄罗斯的壮举，也有可能仅仅是因为他们距离黑军更近，总之，毛岸英并没有去细想缘由。他的行李早已收拾妥当，在绑扎完毕后，他从布里亚特战士的手中接过缰绳，翻身骑上了马背。\n\n£gezifu £gezifu “从这里向北二十公里，您会看到一座田野上的雷达通信站，我们的卡车就停放在那里。伊尔库茨克省北部的路况不佳，供电也还没有完全恢复，所以还是立刻就出发为好。”\n\n£gezifu £gezifu “明白了。”"
 COX_BRY.5.t: "启程"
 COX_BRY.6.a: "我已见过天堂，如今要去挽救那地狱。"
 COX_BRY.6.d: "£gezifu £gezifu 在朦朦胧胧中，毛岸英总觉得有人在拍着他的肩膀，和他说着什么。他尽力去倾听，可那个声音实在是太小、太远了，远到他怎么抓也抓不住。\n\n£gezifu £gezifu “……游子莫念还乡……。”\n\n£gezifu £gezifu 毛岸英猛地睁开眼。可是，并没有任何人在他旁边，只不过是自己在颠簸的车厢里睡着，撞到了肩膀罢了。他叹了口气，擦了擦卡车玻璃上凝结的水雾，向窗外看去，西伯利亚洁白的积雪冻土正在他眼前不知疲倦地奔流。\n\n£gezifu £gezifu 革命胜利了。为了将这个消息尽快地传播给布里亚特苏维埃潜在的盟友，毛岸英和数位布里亚特代表造访了西伯利亚无政府主义苏维埃，今天正是国事访问结束的日子，黑军调用了一辆卡车将他们送到边境线上，再由布里亚特方面接应入境。在坎斯克度过的几天是愉快的，虽然黑军委婉地拒绝了向布里亚特提供任何实际性援助，但他们仍然向新生的苏维埃政权致以了祝福，毛岸英甚至还受邀和公社领导人尤里跳了一支哥萨克舞，这大开大合的舞蹈把他累得够呛。\n\n£gezifu £gezifu “虽然总的说来，我们没有拒绝工业技术交流的理由，不过这件事还需要知会各级公社，征得同意……我知道，你们和我们持有不同的信仰，但我还是要祝你们好运，我的朋友。”\n\n£gezifu £gezifu 想起尤里送别时说的话，毛岸英揉了揉眼角，再次将目光投向窗外。或许——或许，一个完全由公社梳理经济的国家确实是能够成功的……至少，他在无政府主义苏维埃看到了和布里亚特同样的生机与活力。\n\n£gezifu £gezifu “……打……打回内地去……”\n\n£gezifu £gezifu 车厢的另一边，疲倦得同样打起瞌睡的谢富治正在有一句没一句地说着梦话，从很久前开始，这个半老头子的梦话就只有这几句。毛岸英几乎是无意识地笑了一下——无论是黑军还是布里亚特，终究都不是他的归宿。每当他看到这里的人民愉悦而满足的样子时，就不由得想起仍被踏在日本铁蹄下那千千万万的中国人，他们理应享有的权益已经被剥夺了太久太久，而中国旅的战士们也背井离乡太久太久了。\n\n£gezifu £gezifu 不管以怎样的方式，他都要把革命重新带回中国；既然黑军和布里亚特的公民能够自豪而有尊严地活着，那么所有的中国人也都应当拥有同样的权利。"
 COX_BRY.6.t: "访问无政府主义苏维埃"
 COX_BRY.7.a: "在旅途的前方，在图瓦的草原，秃鹫正盘旋在黑云之下……"
 COX_BRY.7.b: "还是留在贝加尔湖吧。"
 COX_BRY.7.d: "£gezifu £gezifu 在西伯利亚广袤的原野之上，中国旅已经前行了数日。\n\n£gezifu £gezifu 一开始，他们乘着伊尔库茨克的卡车。但出发第三天的一场大雨使草原变成了烂泥滩，战士们不得不抛弃部分辎重和车辆，徒步前行。\n\n£gezifu £gezifu 毛岸英曾听过红军过草地的故事，他本以为其中的许多内容都是后来人的添油加醋，但现如今的情况与传说相比也有过之而无不及了——踩在润湿的草甸上，每一步都小心翼翼，每一步都不可避免地沾上更多淤泥，每一步都比上一步更加沉重。不同于中原总是一瞬间降下的暴雨，西伯利亚的阴雨连绵不绝，独属于这里的寒气，得以穿过一切衣物的阻隔，将任何人的四肢冻僵，好像不再是自己身上的部件一般。\n\n£gezifu £gezifu 在翻过一座丘陵后，中国旅决定在背风处驻扎休整。\n\n£gezifu £gezifu 毛岸英与几位指挥员登上了高处，规划着明天行军的方向。哪里有简易的道路，哪里有村庄和人影，哪里可供辎重车通过，哪里是容易积水的沟谷……当这些测量完成后，毛岸英抬头望着天——灰蒙蒙的云层间，冰冷彻骨的雨点似乎随时就要落下来。他摇了摇头，又向北方望去，此时，贝加尔湖畔的人民正在新生的苏维埃共和国的旗帜下，展开火热的建设吧。临行时萨布林的祝福回荡还在耳畔——\n\n£gezifu £gezifu  “祝彼此的革命早日成功，祝我们都早日战胜帝国主义。” \n\n£gezifu £gezifu 新生的革命火苗是如此脆弱，岸英怎能不想悉心呵护它呢？但中国旅不能逗留，他们必须走过这新长征的道路，抵达受尽苦难的故乡，将自贝加尔湖畔发源的希望之光带回去，不惜任何代价……\n\n£gezifu £gezifu 想到这里，毛岸英又望向西方——"
 COX_BRY.7.t: "远望草原之上"
 COX_BRY.8.a: "终有一天，麻醉剂将不再需要。"
 COX_BRY.8.d: "£gezifu £gezifu “克里卡廖夫同志，您应该适当地控制吸烟和饮酒了。”\n\n£gezifu £gezifu 军医移动着贴在克里卡廖夫胸口的听诊器，脸上露出忧惧的神色。这个中年的俄罗斯人数天前因为严重的咳嗽症状不得不离开前线，现在却满不在乎地敞着胸脯，听凭那块冰凉的金属挪来挪去。\n\n£gezifu £gezifu “瞧您说的，怎能不吸烟不喝酒呢……”克里卡廖夫嘟囔着，“啊，大夫，我可以把衣服放下来了吧？”\n\n£gezifu £gezifu 得到肯定的答复后，他把卷起的上衣一把拉了下来。听诊器大概实在是太冷了，克里卡廖夫的喉咙里呛出了几声被压抑着的咳嗽，他等到呼吸平复，便又继续说下去。\n\n£gezifu £gezifu “人苦闷的时候，就想要抽上几根，来那么一口……同志，我上过文化课，知道烟酒都不是好东西。不用您说我也清楚，我的肺和肠子，估计已经被它们弄出几个洞来了。”他挠了挠稀疏少毛的脑袋，“但是想戒掉，可真不容易。您看，我家里有个老妈妈，还有没成年的儿子——老婆呢，嫌我没出息，早就跑了。一到夜里，我想到儿子没有教育，将来找不到工作，妈妈又腰疼得在床上翻来覆去，怎能不发愁呢？这时候，我就只好又抽又喝，这样才能睡得着……”\n\n£gezifu £gezifu 说着，他站起身来，拿过担在椅背上的大衣，伸手套上。\n\n£gezifu £gezifu “大夫，我身体没啥大碍，都是老毛病了，您快给我开份报告吧，我好回部队报到。”\n\n£gezifu £gezifu “我想我同您说过，您如果不能控制吸烟与饮酒……”\n\n£gezifu £gezifu “同志。”克里卡廖夫转过身来，看着困惑不解的军医。从他浑浊的老眼中射出了有力的光。\n\n£gezifu £gezifu “您不必担心，斗争的最前线就是我的特效药。虽然那里既泥泞又寒冷，但我总是有盼头，一点也不觉得苦闷。想到我们的事业，我就浑身是劲。”"
 COX_BRY.8.t: "麻醉剂"
 COX_BRY.9.a: "冰封已裂,枷锁将碎。"
 COX_BRY.9.d: "£gezifu £gezifu 老钱坐在贝加尔湖畔哨站里,近来的大雨让外面的道路一片泥泞，连日的大风吹倒了树木，堵塞了道路,补给恐怕要晚个好几天才能送到。他并不关心这些,他只是抽着闷烟听着广播。前几天，布劳恩同志还在广播里用德国腔很重的俄语严厉谴责了亚戈达政权的修正主义暴政;而今天，播音员正在热情洋溢地向听众们宣布:党代会刚刚全票通过支持萨布林临时书记正式当选总书记。随后播放的是萨布林同志在党代会上的演讲。他的嗓音尚还年轻,却充满俄罗斯大地上最匮乏的东西:理想与决心。无论在哪个地方，为人类的解放事业而斗争永远是光荣的，毛岸英同志是这么说的，老钱确实也这么觉得。但如今，听着萨布林演讲后豪放的“乌拉！”欢呼，老钱却怅然若失。\n\n£gezifu £gezifu 广播里不再有人声，而是放起了《国际歌》。这是广播台休息时间的固定曲目。老钱不知道自己在期待着什么，他懒得关掉从不会传出中文的广播， 也没有兴致去看好像永远都不会解冻的贝加尔湖。\n\n£gezifu £gezifu 广播里国际歌慢慢淡出,半睡半醒间老钱模模糊糊听见了播音员的声音。她用俄语说:\n\n£gezifu £gezifu “我们现在……在反抗修正主义暴君的战斗中立下……中国旅的旅长、革命英雄的长子……毛岸英同志向全体华侨同志发表讲话! \"随后，收音机里传出了亲切的中国话:“88近卫旅的将士们，所有正在收听的华人华侨们以及全体光荣的共和国公民们，下午好! \"\n\n£gezifu £gezifu 老钱从床上猛地坐起来，赶忙把收音机的音量旋钮拧到最大。当他正准备专心致志地听毛岸英的讲话时.风声呼啸的窗外突然传来了隆隆的巨响。老钱立刻下意识地套上头盔，提起架在床边的枪冲了出去。难道是死硬分子或者法西斯分子的袭击?但谁会在人迹罕至的湖畔搞袭击?\n\n£gezifu £gezifu 他冲出了哨站。老钱茫然地望向四周，没有反动派，只是呼啸的大风与从浓密黑云中钻出的恢复温度的太阳,连同贝加尔湖暗中涌动的波涛一道，在撕裂贝加尔湖久封的冰面。破碎的巨大冰块被波浪推上了岸，它们终将融化。\n\n£gezifu £gezifu “……党支部已经正式做出决定：我们将离开俄罗斯的土地，为了解放中国人民的事业而战！”乡音与风的呼啸在老钱的耳畔回响，热泪与弹夹落入他的行囊。"
 COX_BRY.9.t: "乡音与贝加尔湖"
 COX_buy_machine: "向布里亚特购买机床的相关决议将被解锁。"
 COX_central_urumqi: "国营企业试点"
 COX_central_urumqi_desc: "尽管是不得已而为之，盛世才时期硕果仅存的重工业已被尽数国有化。包括新疆兵工厂，迪化水泥厂，新疆机械制造厂在内的诸多企业，将成为苏区进一步发展的基石。"
 COX_Check_What_We_Missed: "查缺补漏"
 COX_Check_What_We_Missed_desc: "我们的工作大抵上是胜利推进了，但这是否意味着我们每一步走的都是完美无缺的，没有任何遗憾的呢？想来并不是，没有什么东西是一下子就能十全十美的，我们必须回过头来审视我们的政策和行动，找到不足的地方加以改正。不管是我们党还是党员，都必须要好好的审视自己之前所做的工作。查漏补缺。"
 COX_Chen_Geng_sec_desc: "§Y安全部长§!\n§Y新民主主义§!\n------------\n§L陈赓，1903年出生于湖南省湘乡市。孙中山的侍卫、蒋介石的救命恩人、伤员王庸——陈赓拥有许多身份，正如他有着神通广大的本领。他出色的军事指挥能力与卓越的谍报工作经验在最为艰苦的年代中保全了新疆支部，使高层干部成功地撤离重庆、一次又一次地免于暗杀。\n\n只要坚持下去，就有希望。怀着这样的决心，陈赓耐心地保护着新疆支部的安全，同时等待着时机的到来。然而，岁月不饶人，繁重的工作与旧时的枪伤越来越剧烈地折磨着陈赓的健康，心肌梗塞不断地威胁着他的生命。老将军心里清楚，他能够为国服务的时间已然屈指可数了。§!"
 COX_Chen_Tanqiu_hog_desc: "§Y政府首脑§!\n§Y毛泽东思想§!\n------------\n§L陈潭秋，名澄，字云先，号潭秋，他是一位值得尊敬的老共产党人，作为中国共产党的创始人之一，陈潭秋已经见过太多太多历史的沉浮。他见证过国民大革命时万家农民农会齐动员的盛景，也曾见证过国民党反革命对革命势力举起的屠刀；曾在中央红军长征后留下来以满地的废墟中抵抗着如狼似虎的国民党军队，也看到过四万万人齐抗日的绝景。\n一直到1939年9月，他奉命回国，担任中共中央驻新疆代表。\n在盛世才公开的进行反共工作时，他则与毛泽民一起，同盛世才进行了艰苦卓绝的斗争。\n斗争总是艰难的，随着毛泽民同志在斗争中牺牲，陈潭秋带领其余共产党员撤入新疆基层，开始了长达十年的地下斗争。\n一转眼二十馀年过去，中国共产党辛苦点燃的点点星火似乎将在无边的黑暗中熄灭之际，那些俄罗斯的游子们打着如同火焰般燃烧的红旗，击败了曾经不可一世的新疆王盛世才。\n陈潭秋才在恍惚中回想起了自己那如火一样的青年时代，他在毛岸英的身上看到隐约中国革命的希望。也许总有一日，可以见得到马克思主义的光辉洒向全中国。但他知道，他的时日无多，漫长的党内一线斗争已经差不多将他的身体搞垮了，年长刘少奇两岁的他看着却像是老上整整二十岁。眼下，自己已经时日无多，岸英却还没有成长起来……§!"
 COX_Chen_Yi: "陈毅"
 COX_Chen_Yi_2_for_desc: "§Y外交部长\n毛泽东思想§!\n--------------\n"
 COX_Chen_Yi_for_desc: "§Y外交部长\n£COX_XBJ_text §x中国共产党§!籍\n“赤色外交”§!\n--------------\n在第一次抗日战争的最后时日，新四军接到了中央“撤往西南”的决议后，便与延安失去了联络。作为他们的领袖，陈毅率领新四军踏上了一段不为人知的艰苦长征。从江淮出发，穿越战后愈发混乱的华夏大地，当他们最终在广西与中央取得了联系时，曾经规模接近十万的新四军早已不过万余。时至今日，陈毅也时不时为自己当时的种种决断感到后悔与自责——由于不知晓中央转移的具体方位，新四军走了不少弯路，不少战士因此丧命。\n\n这次征程也在他身上留下了隐疾，使他无法长时间在前线指挥作战。但这位指挥官并没有就此消沉下去，他很快在外交场合找到了自己的用武之地。得益于留学法国的经验，他被中央指派去与越盟接洽，协调两个兄弟党在东南亚的行动。\n\n中国共产党支持独立自主的外交政策，主张中国应主动地成为东亚反法西斯灯塔，与其他被压迫的民族团结一致，共同对抗日本帝国主义。在这一方面，熟悉东南亚事务的陈毅无疑是最佳的部长人选。"
 COX_civ_war_bandits: "匪患连绵"
 COX_civ_war_bandits_desc: "硝烟散尽，但和平与稳定远未降临在这片大地之上。\n\n在二次抗战胜利后，东北仍有数量不少的、来不及撤出的日伪军啸聚山林；至于国民党反动派的顽固分子，除了被打散后成为盘踞中原各地的小股匪军外，其余的大多转进了西南的深山老林中进行着武装抵抗，他们与东南亚的反共分子互相勾结，不断骚扰着新生共和国的边境。\n\n这些匪寇虽然不足以威胁红色政权的稳固，但他们的活跃将阻碍土改进程，扰乱群众正常生活，对人民群众的生命与财产安全造成极大的威胁。人民政府已着手制定剿匪计划，红军已被再次动员，与各地民兵一道处理了数股较为孤立的匪患。但显而易见的是，与反革命分子的斗争是一项长期且艰巨的任务，新生共和国的安定将不得不长期仰赖一支规模庞大的治安武装。"
 COX_civ_war_bourgeoisie: "背弃之盟"
 COX_civ_war_bourgeoisie_desc: "在第二次抗日战争期间，中国的“民族资产阶级”曾因不满日本帝国主义的残酷剥削而加入了统一战线，与无产阶级及贫农结成联盟，他们的专业知识为统一战线的胜利奠定了物质基础。但在战后两党对峙的形势之中，他们却选择与日占期间的旧买办资产阶级同流合污，共同推举国民党反动派充当代理人，妄图镇压革命，恢复“秩序”，推行所谓的“宪政民主”。\n\n无产阶级与贫农的神圣联盟绝不允许这样的背叛，随着资产阶级代理人在军事上的全面崩溃，工农联盟在土地革命的战线上也取得了伟大的胜利。对阶级暴力的恐惧促使大量资产阶级逃亡海外，他们卷走了大量贵金属与精密器械，尽其所能地破坏生产资料。即便是完好的设施，人才匮乏的共和国也难以对其进行利用。\n\n好在仍有部分有良知之人选择留了下来，他们终将成为火种，成为快速扩张的新中国教育系统的支柱……"
 COX_civ_war_land_reform: "土地革命"
 COX_civ_war_land_reform_desc: "人民政府一贯坚持进行强制土地改革的政策，在战争时期，红军解放一个地区后，随之而来的便是经验丰富的土改队，他们批斗地主，焚烧地契，召开“诉苦会”，废除高利贷……这些雷厉风行的手段为人民政府争取到了中国数量最广大的贫农阶级的鼎力支持。\n随着对国民党反动派战争的彻底胜利，人民政府很快通过了在全国范围内进行彻底土地改革的决议，§Y持续了数千年的封建土地制度，将在华夏大地上被彻底废除！§!"
 COX_civ_war_ruined: "疮痍之国"
 COX_civ_war_ruined_desc: "我们赶跑了日本侵略者，打败了国民党反动集团，但付出的代价惨重到触目惊心：数年战火令全中国几乎化为了废墟，或直接或间接地造成了千万死伤，更造就了各地数以百万计的流民。无数村庄被废弃，数十座小县城被夷平，北京，南京，上海，广州……这些昔日的大城市无不笼罩在一片萧索之中。\n\n为了尽快让国土恢复稳定，新生的人民政府展开了中国历史上前所未有的大规模动员，以期尽快让一切重回正轨。§Y假以时日，废墟之上终将崛起伟大的社会主义新中国！§!"
 COX_civil_war: "中国人民解放军"
 COX_civil_war_ADJ: "解放区"
 COX_civil_war_DEF: "中国人民解放军"
 COX_Collectivization_Of_Husbandry: "牧区改革"
 COX_Collectivization_Of_Husbandry_desc: "牧区改革"
 COX_Commend_Our_Men: "表彰英雄模范"
 COX_Commend_Our_Men_desc: "在漫长且艰辛的土地革命之中，发生了无数可歌可泣的故事，也涌现出了无数典型的英雄模范，这些土改的先进份子理应得到表彰，来牢记这段艰辛的岁月，来展望未来，我们即将到来的新生活。"
 COX_Commend_The_Sharpshooter: "总结经验"
 COX_Commend_The_Sharpshooter_desc: "显而易见，我们与日本侵略者之间的装备代差短时间内是无从弥补的，就连地方军阀也对我们保持着一定的装备优势。尽管如此，我们并不会坐以待毙，我们将从人的因素入手，通过提升士兵的素质来保证我们在战场上不落于下风。\n\n从工农红军创建伊始，运动战就是我们作战思想的核心，现在它依然没有过时，也不应当被我们抛弃。运动战训练将被重启，战士们会以比敌军更快的速度穿越复杂多变的地形，到达计划中的作战地点，对敌军执行猛烈的穿插包围战术。很快我们的敌人就会发现，苏维埃军队将从他们无法想象的位置出现，而一切徒步的逃窜都将化为徒劳。无论是山地、丘陵还是茫茫的戈壁滩，这些帝国主义走狗都再无侥幸逃脱的可能。"
 COX_communist_3_party: "中共中央新疆局"
 COX_communist_3_party_long: "中共中央新疆局"
 COX_communist_party: "中国共产党 - 八十八旅支部"
 COX_communist_party_long: "中国共产党 - 八十八旅支部"
 COX_communist_party_PRC: "中国共产党"
 COX_communist_party_PRC_long: "中国共产党"
 COX_communist_party_XIN: "中共中央新疆局"
 COX_communist_party_XIN_long: "中共中央新疆局"
 COX_comrades: "革命战友"
 COX_comrades_add: "革命战友"
 COX_Comrades_In_North_Shaanxi: "陕北的同志们…"
 COX_Comrades_In_North_Shaanxi_desc: "二十年前，为了保存革命的火种，党中央的大部进行了艰苦卓绝的第二次长征，来到了西南。那些留守根据地的同志，我们一度认为他们遭受了与留守井冈山的同志们相同的命运……\n\n但时至今日，随着通讯网的恢复，我们惊奇地发觉仍有一小部分同志仍在陕北坚持，虽然他们一度被逼入绝境，但凭借人民的支持以及对地形的熟知，他们仍熬过了战后最艰难的岁月。如今，他们经营着几块小根据地，彼此分散，缺枪少弹。我们要找到他们，然后联合他们，趁着日军对陕西失去控制的契机，夺回曾经的革命圣地。"
 COX_conference_of_alt: "召开紧急会议！"
 COX_conference_of_alt_desc: "毛岸英同志已经辞去主席职位，中共中央最高领导人的职位出现了空缺，再选出新主席之前，由中共中央政治局共同管理当前政事，应对反动分子的叛乱。"
 COX_construction_troops: "生产建设兵团的相关决议将被解锁。"
 COX_Consultations_with_Xinmeng: "与新盟磋商"
 COX_Consultations_with_Xinmeng_desc: "尽管叛徒的出卖与重庆的沦陷导致祖国完全沦为殖民地，汉奸们却从未能杀尽爱国民主思想的种子。在不成功的三区革命中一度遭受挫折的新疆本土共产主义者，构成了社会主义民主党派“新疆保卫和平民主同盟”的骨干，反对着军阀政府的独裁统治。党的新疆支部在全面起义前就已经与他们多有联络，而武装斗争的胜利与土地改革的顺利推进也使得众多民主人士离开沦陷区来到边疆。为了独立、统一、民主的新中国，我们要万众一心，方能看到黑暗尽头的曙光。"
 COX_Consume_machine_tools_to_create_GDP: "消耗机床创造GDP"
 COX_Convene_National_General_Congress: "召开全国代表大会"
 COX_Convene_National_General_Congress_desc: "终于，我们千疮百孔的祖国母亲夺回了属于她的自由。曾经彼此失去联系，四分五裂的共产党组织也终于能够重新联系在一起。二十年的风雨见证了无数牺牲，更蹉跎了幸存至今的人的面容，在这胜利的时刻，是时候召开久违的全国代表大会了。来自五湖四海的同志们将汇聚在北京，共同讨论我们党，以及中国的未来。\n\n但在此之前，先让我们举杯，庆贺党的幸存与人民的胜利！"
 COX_coring_category: "§xRegional Integration§!"
 COX_coring_category_desc: "In the land of China, ravaged by the Japanese invaders, countless people are barely surviving under extremely harsh conditions. To make a living, they have no choice but to compromise with the local Japanese puppet governments. After the failure of the revolution in Yan'an, many have lost faith in communism. On the path to liberate all of China, we must lay a solid foundation in the rear. Gaining the trust of the people is simple: first, they must believe that we are here to liberate them, not to oppress them like the reactionary forces; second, we must improve their living standards through a series of reforms. If we achieve these two points, our work in the revolutionary base areas will become much easier. We believe that the day of the §Rblazing prairie fire§! will §xcome§!!"
 COX_coring_integrate_beijiang: "Integrate §lNorthern Xinjiang§!"
 COX_coring_integrate_hami: "Integrate §lTurpan Basin§!"
 COX_coring_integrate_nanjiang: "Integrate §lSouthern Xinjiang§!"
 COX_coring_lanzhou_tt: "我们正在重建兰州"
 COX_CountryInfo_Content_desc.1: "如同中华民族的命运一般，§R中国共产党§!的历史充斥着顽强的抵抗与屈辱的失败。在它成立的近半个世纪间，党数次遭受重创，但受尽苦难的人们仍前仆后继，革命在磕磕绊绊中始终向前……\n\n英雄鲜血铺就的道路最终到达了§R延安§!。在那里，共产党人呼吁团结一致，共抗外敌；在那里，人们边战斗边生产，新世界的图景缓缓揭开，似乎预示着一个不一样的未来——没有贪官污吏，没有军阀买办，人们能够自由的劳动，自由的生活……延安成了一座灯塔，指引着全中国进步的力量，大胆追寻这个古老民族的未来。\n\n在那场旷日持久的战争中，党领导的军队深入群众，拥护党的人民在敌后作战。共产党的根据地遍布中原大地，地下党的活动渗透了日伪最坚固的堡垒。日军的刺刀可以攻占城镇，火炮足以摧垮一切古城墙，但城市之外，在广阔的乡野之间，共产党领导的中国军民仍在战斗。"
 COX_CountryInfo_Content_desc.2: "但随着战争旷日持久，法西斯最终还是占了上风。随着苏联的崩溃，外援几乎断绝，常年的征战摧毁了中国本就脆弱的农业经济，正面战场的接连失利最终导致了§G国民党军§!在1945年的大溃败。随着敌寇一步步进逼延安，党不得不抛弃陕北根据地，踏上了新的§R长征§!。\n\n此时，统一战线仅剩§W云南，青海与甘肃§!三省尚存。有些人提议就近撤往西北，但§R毛泽东§!却认为马家在西北根基牢靠，且在抗日战争中出工不出力，反倒是积极反共。西北缺乏革命的土壤，共产党应当前往西南，那里§R“天地广阔，大有作为”§! \n\n于是，共产党再次踏上了凶险的征途。战争末期的华夏大地凶险异常，但§R毛泽东§!总是一次次带领着党脱离险境。在日寇侵占的重庆近郊，队伍遭受了日本战机的轰炸。毛泽东指挥队伍隐蔽在林间，寻不到目标的飞行员盲目地丢下两发航弹，便返航了。\n\n航弹被层叠的枝杈阻截，在空中爆炸，破片四散，惊起林中飞鸟。\n\n几颗弹片落到了队伍当中，夺去了数人的性命——其中就包括§R毛泽东§!"
 COX_CountryInfo_Content_desc.3: "当历经千难万险的队伍抵达云南时，却发现此处已换了人间——在西北易帜后，云南独木难支，只得与日寇媾和。新上台的§G卢汉§!为了讨好日本主子，大肆搜捕西南的抗日武装。此时的共产党群龙无首，又经历了漫长的远征，本以为能得到休整，却不得不陷入了新的战斗中。\n\n但正如§R毛泽东§!生前所预料的，这里的百姓抗日情绪高涨，又是日本难以触及的西南边陲。在遭受了最初的损失后，共产党迅速在云南扎下根来。新的根据地在边境的丛林间拔地而起，新的战士怀着满腔怒火应征入伍，西南根据地挫败了卢汉的数次围剿，时至今日，已是全国最大的革命根据地。\n\n但西南根据地并不是仅存的火种。在§R陕北§!，第二次长征时遗留的党组织顽强地生存了下来，甚至在与“中华民国”新军的交锋中不落下风。如今，尽管被敌人重重包围，但在山西军阀，蒙疆与帝国西北军的夹缝间，共产党顽强地维持着遍布陕北的游击区。\n\n而在关外，中共40年代派遣的§R新疆局§!仍活跃在盛世才的小小政府中。他们并不需要直面严峻的武装斗争，但在这片与中原迥异的土地上，共产党人显得势单力薄……"
 COX_CountryInfo_Content_desc.4: "当战事不利时，并不是所有§G军阀§!都甘愿在统一战线的旗帜下奋战至死。出身辽宁，却最终主政新疆的§G盛世才§!深知投机的艺术。自三十年代独揽新疆的军政大权后，盛世才便在国民政府与苏联间左右逢源，二十年过去，两个强权轰然倒塌，东亚新秩序笼罩在旭日旗的阴影之下，盛世才却拿着南京政府的任命状，继续稳坐§R新疆王§!的宝座。\n\n日本对这片西北边地只有名义上的统治，盛世才得以做两手准备，在迪化包庇了一批抗日势力，甚至接纳他们进入政府。风水轮流转，无论是§W国民党§!还是§R共产党§!，现在都得唯盛世才马首是瞻。\n\n但在新疆王为自己长久的统治而沾沾自喜时，事情正一步步超出他的掌控。1944年，强征牧民马匹的行为引爆了北疆的§R三区革命§!，起义军从未被真正的剿灭。与此同时，就在盛世才新进收编的军队之中，§W抗日情绪§!与§R社会主义§!正在蔓延，这背后无疑有共产党的推动，但其根源，毫无疑问是每一个中原士兵心中都萦绕着的故国沦亡的苦痛……"
 COX_CountryInfo_Content_desc.5: "§R近卫步兵第八十八旅§!，是战后俄罗斯大地上的又一个传说，他们展现着非凡的勇气，对抗全俄罗斯的法西斯与暴君……这群颠沛流离的异乡人，有着一段曲折的故事——§R毛岸英§!，这支功勋部队的旅长，是曾领导中国革命的巨人——毛泽东之子。在人生的早年，他被送往苏联学习，之后，世界大战爆发。联盟破碎，故国沦丧，他一下子失去了自己的两个祖国。\n\n历经了西俄罗斯的血战，跨越了西伯利亚的苦寒，抵达了贝加尔湖的战士们向南望去——发觉故国早已沦亡于日寇之手。§R亚戈达§!许诺为中国革命提供帮助，以期把他们招入麾下。\n\n八十八旅接受了亚戈达的改编，自此便驻留在贝加尔湖。作为亚戈达政权的宣传材料与“样板部队”，他们得到了最好的装备与人员的补充，但这也仅是为了维系摇摇欲坠的远东国家。\n\n数年间，归国的承诺仅停留在口头上，也无怪乎当贝加尔湖右岸的人民奋起反抗之时，八十八旅作为急先锋，将残暴的亚戈达政权推翻……\n\n随着革命的胜利，离乡多年的游子们终于得偿所愿踏上了归国之路。在漫长征程的前方，等待着他们的是已然陌生的§R祖国大地§!……"
 COX_CountryInfo_Content_desc.6: "盛世才早期的统治为新疆带来了难得的和平与繁荣。在苏联崩溃之前，整个新疆施行“反帝、亲苏、和平、清廉、建设、民族平等”的§R六大政策§!。在许多进步人士心中，盛世才是难得的“开明军阀”。\n\n但随着苏联的崩溃，盛世才撕下了“联共”的幌子，大肆搜捕共产党人。§R六大政策§!遭到废除，其原则遭到彻底的背弃——少数民族遭到排挤，政权的全部精力转到了镇压与“维稳”上来。在“抗日反共”的旗号下，腐败官员勾连乡绅欺压百姓，加上对苏贸易中断导致的消费品短缺，新疆的民族矛盾，阶级矛盾就此空前地激化……\n\n这一切最终促成了1944年爆发的§R三区革命§!——巩哈的牧民拿起武器，反抗政府强征军马的行径。革命者势如破竹，一度威胁迪化政权的统治。但随着盛世才调动重组的精锐部队，加上革命者缺乏外部援助，起义军最终没能攻下迪化。幸存者只能撤往盛世才政权鞭长莫及的北疆，进行持久的游击作战。\n\n对盛世才政权失望的不仅有劳动人民。随着盛世才完全废除了六大政策，新疆的§G进步人士§!对他失望透顶，他们成立了§G“新疆保卫和平民主同盟”§!，秘密地为革命者提供支援。"
 COX_CountryInfo_Content_desc.7: "“西域”并不是中原王朝的传统疆界。“西出阳关无故人”描绘的荒凉情景，仍可形容当今§R新疆§!地区的隔绝状态。尽管在盛世才主政前期，北疆的部分地区兴建了一批轻工业，但时至今日，农业仍占据着新疆经济的绝大部分。\n\n盛世才深知农业是新疆社会稳定的根本，所以在他执政的二十年间，没有一刻不在强调整修水利与发展农业生产。然而，随着内外压力的消失，盛世才越来越执着于只是简单地维持自己“§R新疆王§!”的地位，在进步势力弃他而去的同时，一度被压制的腐败开始滋长，地主与贪官污吏将政府的权威架空，使得§R政令不出迪化§!。\n\n水利税变成了官员中饱私囊的另一项名目，农业生产的生命线——引水渠却鲜有维护。收成一年不如一年，税负却逐年加重。许多农民不得不卖了土地，沦为佃农。在南疆的许多地区，落后的§W农奴制§!不但没有消失，反而在这种超额剥削的社会环境下愈发巩固……\n\n革命者们很快就将发觉，击败盛世才不过是最简单的一步。"
 COX_CountryInfo_Content_desc.8: "领导新疆人民，赢得§R土地革命§!的胜利！\n\n静待时机，创建新的§R统一战线§!，将鬼子赶出§R中国§!\n\n当新的斗争失败之时，走过一条§R苦难长征之路§!……"
