 The_Crumbling_Six_Policies: "摇摇欲坠的六大政策"
 The_Crumbling_Six_Policies_desc: "§Y反帝、容日、和平、清廉、建设、民族平等§!，这是盛世才引以为豪的政治发明，也就是所谓的“六大政策”。在1946年将六大政策中的“亲苏”修改为“容日”时，盛世才一再保证，这并不意味着容共的政策会有所改变，也不意味着日本人从此可以左右新疆，然而这两样保证，他一样都没能贯彻。\n\n50年代，在盛世才的授意下，全疆开始了清共运动，一大批新疆局的干部被捕，包括民政厅厅长毛泽民在内的人士被秘密杀害。随后，新疆经济便陷入了长期紊乱之中，导致盛世才不得不积极地吸引日本人来此投资。因此，全疆上下讥讽他“名为容日，实为通日”的声音随处可闻。§R指引新疆前行的六大政策，已经快要走到生命的尽头。只要有人向它踢上一脚，它便会瞬间土崩瓦解。§!"
