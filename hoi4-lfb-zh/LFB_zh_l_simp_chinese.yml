 ultranationalism_qutbism_subtype: "库特布主义"
 ultranationalism_qutbism_subtype_desc: "一千多年前，阿拉伯半岛的人们沉浸于蒙昧与无德之中：他们对人造的偶像加以膜拜，在水中溺死初生的女婴，整个社会自上到下都弥漫着血腥与欺诈。然而，一位义人跟随着真主的指引，从部落民中脱颖而出，向他们传达有关谦卑与服从的旨意。昔日弱小、贫穷而自相倾轧的阿拉伯人很快在伊斯兰信仰的指引下团结一致，战胜一切威胁他们的敌人，并开创了一个文化与科学都蓬勃发展的黄金时代。\n\n然而，对赛义德·库特布和他的追随者来说，那个繁荣和辉煌的时代早已化为尘封史书中的几笔干墨，割开虔信与正义的假象，映入眼帘的只有无穷无尽的蒙昧和堕落。伊斯兰世界曾经辉煌万丈的心脏早已停止跳动，昔日横跨欧亚大陆的帝国也早已沦为诸多向异教徒帝国主义者屈服的人造国家。无能无德的统治者们为西方殖民者的暴行欢呼，对自己人民的苦难视而不见，放任恶习与放荡在社会中蔓延，犯罪则成了在这样的世界中生存的必然前提。\n\n对库特布主义者而言，要想解决穆斯林世界正面临的危险，就不能崇拜华而不实的外来民族主义思想或复杂枯燥的阶级二分法，而只能回归真主与先知的话语。只有组织一支由少数虔信者组成的先锋队，清除物质世界的甜蜜陷阱，重新确立真主在大地上的统治，才能将无知与欺骗从社会的每一个缝隙中清除。只有这样，乌玛才能回到那个团结与繁荣的时代，创造一个没有帝国主义殖民者和放荡欲望的新世界——一个人人都毫不在乎空浮的物质，而只关注自己与教胞在天堂中的阶位的世界。"
 Unfinished_Railways: "哈密-阿克苏铁路"
 Unfinished_Railways_desc: "东西向穿越新疆省的哈密-阿克苏铁路及其规划，是前民政厅厅长毛泽民为新疆留下的一笔遗产。按照规划，这条铁路将会连接轻纺工业聚集地哈密与棉花产地阿克苏，从而使原料更加高效快捷地流动，但随着毛泽民的身故，铁路的建成工期便无限期地延长了。\n\n对于新疆当局而言，这条未能完全修成的铁路令他们无所适从：一方面，他们没有能力自主完工，而日本人也对这个项目不感兴趣；另一方面，他们也没有能力维护和运作好现有的线路。§Y在许多人眼中，哈密-阿克苏铁路，就是新疆持续十年经济衰退的缩影。§!"
 unite_like_a_fortress: "众志成城"
 UTL_gate_of_timur: "帖木儿之门"
 UTL_gate_of_timur_desc: "力量从不源自正义。\n\n在某个愚蠢而无知的历史学家揭开帖木儿棺椁之后的第一个日出如同往常一样平静温暖，第二个也是如此，第三个则伴随着柴油的刺鼻气味、螺旋桨的嘶鸣和染红东欧草原的鲜血。这位跛子征服者的亡魂确实从火狱的最深处召来了魔鬼的军团，朝着太阳升起的方向扑去，碾压与绞碎沿路的一切。\n\n但在他安息的土地上生长的人们对此毫不知情。所以他们登上了离乡的军列，就永远没有再回来。不，他们中有一些回来了，但他们早已不再是他们了。\n\n前线的炮火和泥泞、集中营的饥饿与拷打、沦为叛徒的挣扎和自责、为纳粹所奴役的屈辱与麻木、前线寒夜的事变……如果这些还不足以摧垮一个人的良知和责任心，那上千公里的死亡跋涉、被打包扔进集装火车的路途与阿富汗人再次系上的狗链也绰绰有余了。那一天，上千名穿着破旧纳粹军服的武装分子结束了环绕里海一圈的路途，跨过阿姆河扑向了曾被他们称之为家的土地，靠着阿富汗人的支持在两河之间建立起了自己的军阀王国，好似帖木儿特地调遣了一支军团去惩罚打扰他安寝之辈。\n\n“无论是谁打开我的坟墓，都会释放出比我更可怖的征服者。”"
 UTL_Mustafa_Shokay: "穆斯塔法·绍凯"
 UTL_Mustafa_Shokay_desc: "1890年，穆斯塔法·绍凯出生在哈萨克草原上的一个富庶且地位卓著的贵族家庭。流淌着克烈与扎尼别克血脉的他自幼就展现出了惊人的天赋，后来又前往圣彼得堡法学院继续深造。穆斯塔法·绍凯的未来似乎注定如同草原上空的耀日般，明亮而灼目。然而，随着萨拉热窝的一声枪响，一切都幻灭了。沙皇政府很快就在内忧外困中倒台，红色浪潮扫过了双头鹰旗帜下的每一寸土地，包括他的家乡。当时他正与同僚们共同商讨着突厥斯坦的自治，为中亚人民谋取决定自己命运的权力，但回应他的只有布尔什维克的刺刀与铅弹。穆斯塔法·绍凯由此踏上了流亡的旅程，几经辗转后在巴黎安定下来，这一走就是二十年。\n\n1941年，纳粹帝国的战争机器席卷东欧，所有出生在苏联领土上的知名侨民都遭到了占领军的逮捕，绍凯也不例外。但短短几个星期后，纳粹就提出希望由他领导“突厥斯坦军团”——一支由侨民和战俘组成的辅助部队，为争取突厥斯坦的自由而对抗苏联。在东方事务部长阿尔弗雷德·罗森贝格的引荐下，绍凯披上了黑色军服，带领军团见证了红色巨人的毁灭，但德国人并没有履行他们的承诺。自那以后的每天每夜，军团的战士们都忙于镇压匪徒和游击队，只有战斗的间隙才能坐在阿斯特拉罕的河滩上，遥望国境线另一侧的广阔草原。\n\n十年后，事情又一次迎来了转机。西俄罗斯革命阵线发动了背水的一战，突厥斯坦军团再次投入进了对抗布尔什维克的战斗中。但在某个大雪纷飞的夜晚，瑟缩在前线指挥部中的军团士兵们忽然发现，一支戴着手榴弹臂章的党卫军部队向自己发动了攻击。穆斯塔法·绍凯嗅到了危险的气息，他知道德国人终于要对自己下手了。突厥斯坦军团迅速脱离了战斗序列，一路跋涉穿越混乱的高加索，来到了里海沿岸的伊朗境内。但沙阿不愿破坏与德国盟友的关系，于是把军团打包装进了火车，运向东方的阿富汗。在那里，穆斯塔法·绍凯得到了一个机会，一个期望已久的返回故土的机会。\n\n这就是穆斯塔法·绍凯用来减轻自己负罪感的说辞。所有人都知道“突厥斯坦军团”不过是一群受过训练的土匪，他自己也不过是个懦弱的投机家，但绍凯本人对此毫不理会。但在某间门窗紧闭的办公室里，桌上那张插满军团旗帜的中亚地图早已浸透了泪渍。"
 UZB_bury_in_the_whale_stomach: "困于鲸腹"
 UZB_bury_in_the_whale_stomach_desc: "过去二十年间的种种事变让整个中亚如坠冰窟，但没有哪个国家的地缘政治态势比乌兹别克更糟糕了：卡拉卡尔帕克人在哈萨克的怂恿下宣布了所谓的独立并强占了花剌子模绿洲，吉尔吉斯人则趁着乱局“和平接管”了东部物产富饶的费尔干纳盆地，甚至包围了塔什干，封锁了这座城市的所有出入口。至于南方已经化为恶鬼豺狼的昔日同胞，他们大概已经无力将兵锋挥向布哈拉与撒马尔罕，但持续不断的袭扰也在消耗边境地区本就紧缺的资源，其控制区内数十万居民遭其蹂躏的现实也不免令人痛心。\n\n对乌兹别克来说，这个世界就是一头巨鲸，而她现在正被困于其腹，被它一点点撕碎、蚕食、消化。也许她能握紧刀剑，在自己被完全吞噬之前将这头怪兽开膛破肚，但她的心神与灵魂恐怕已经先于身躯被消化殆尽了。"
