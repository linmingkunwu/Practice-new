 MEA_Dashijn_Damba: "达西·丹巴"
 MEA_Dashijn_Damba_hog_desc: "§Y人民委员会主席§!\n§Y民族共产主义§!\n------------\n（占位）蒙古溃败后本地抵抗势力，负责与中国接触。"
 MEA_DEF: "蒙古人民共和国"
 MEA_Oleijtijn_Badrakh: "奥勒扎·巴德拉克"
 MEA_Oleijtijn_Badrakh_eco_desc: "§Y经济部长§!\n§Y民族共产主义§!\n------------\n（占位）蒙古覆灭后从苏联归国参加游击运动的原农村派（左派）成员。"
 MEA_Shagdarijn_Gungaar: "沙格达里·贡嘎尔"
 MEA_socialist_party: "Inner Mongolia People's Revolutionary Party 'Daur Faction'"
 MEA_wulanbatuo: "Ulaanbaatar"
 MEA_Yumzhaagijn_Tsedenbal: "尤睦佳·泽登巴尔"
 MEA_Zhamyangijn_Lkhagvasuren: "扎米扬·勒哈格瓦苏伦"
 MEA_Zhamyangijn_Lkhagvasuren_sec_desc: "§Y国防部长§!\n§Y民族共产主义§!\n------------\n扎米扬·勒哈格瓦苏伦于1912年出生于一个军官家庭，1932年，二十岁的勒哈格瓦苏伦应征入伍，随后被分配到第十五骑兵师。1935年，勒哈格瓦苏伦被选中参加优秀军官培养计划，随后他的晋升速度可以用“坐火箭”来形容。1939年7月，勒哈格瓦苏伦以第一苏蒙集团军的蒙古骑兵部分的指挥官的身份，参加了诺门罕战役，而他的顶头上司则是朱可夫。 \n\n在诺门罕战役中，勒哈格瓦苏伦首次见到了机械化骑兵集群的威力，并且暗暗下定决心，要为蒙古打造自己的机械化骑兵部队。但苏联和中国的战败，让勒哈格瓦苏伦不得不收起他的梦想，转而逃命。不过，如果有一天蒙古被解放，或许勒哈格瓦苏伦还有机会实现他的梦想。"
 MEA_Zolbingijn_Shizhee: "卓勒宾·希耶"
 MEN_attack_idea_1: "仓促作战"
 MEN_attack_idea_1_desc: "50年代中期的惨败，给残破的蒙古人民军蒙上了挥之不散的阴霾；而60年代伊始的第二次俄罗斯大动乱，则迫使仍在积蓄力量的人民军离开图瓦的驻地，返回西蒙古。\n\n在最近十余年间，蒙古人民军屡遭失败，在多地辗转之中，最早的起义者早已十不存一。此时的人民军远未从之前的创伤中恢复，仓促作战间，他们能依靠的只有自己的袍泽。\n\n§Y“乌鸦活千年也不会有白发，事业过万年也不会衰朽。”§!"
 MEN_attack_idea_2: "待时而发"
 MEN_attack_idea_2_desc: "50年代中期的惨败，给残破的蒙古人民军蒙上了挥之不散的阴霾；而60年代伊始的第二次俄罗斯大动乱，则迫使仍在积蓄力量的人民军离开图瓦的驻地，返回西蒙古。\n\n尽管在最近十余年间，蒙古人民军屡遭失败，在多地辗转之中，最早的起义者早已十不存一，在中国同志的支援下，人民军暂时恢复了实力。虽不及他们的高峰，但如今的蒙古人民军仍恢复了建制，作为一支小而精的部队，他们信心十足，向乌兰巴托进发。\n\n§Y“乌鸦活千年也不会有白发，事业过万年也不会衰朽。”§!"
 MEN_attack_idea_3: "同仇敌忾"
 MEN_attack_idea_3_desc: "50年代中期的惨败，给残破的蒙古人民军蒙上了挥之不散的阴霾；而60年代伊始的第二次俄罗斯大动乱，则迫使仍在积蓄力量的人民军离开图瓦的驻地，返回西蒙古。\n\n尽管在最近十余年间，蒙古人民军屡遭失败，在多地辗转之中，最早的起义者早已十不存一，但在中国与远东同志的支援下，人民军得以迅速扩编。如今的蒙古人民军由风尘仆仆的老兵与满腔热血的年轻人组成，他们的装备或许老旧，但没人能质疑他们多年来积累的作战经验与保家卫国的决心。\n\n§Y“乌鸦活千年也不会有白发，事业过万年也不会衰朽。”§!"
 MEN_attack_idea_4: "旧日魂灵"
 MEN_attack_idea_4_desc: "§Y“威武面前不屈膝，困难面前不折腰。”§!\n\n虽然对东京的权贵们而言，赤色幽灵早在50年代就已经销声匿迹，但人民军的再度崛起，其实早有先兆——当草原的利益不断被出卖，当人民的生活越陷越深，权贵们挥金如土，借着日本的名头踩在广大人民的肩头，这一切积聚着，经年累月，也无怪于此时壮烈的爆发！\n\n随着人民军的再度举义，整个蒙古遍布了起义的火焰。随着人民军坚定的脚步，自西向东地洒向整片草原！\n\n§x旧日的幽灵自每个人面前显现——它是穷苦人的救星，更是卖国贼的梦魇！§!"
 MEN_batedaoerji: "Baatar Davaajav"
 MEN_Beg_Japan: "乞求日本"
 MEN_Beg_Japan_desc: "How did it come to this? We lost. The eyes of heaven have turned away from us and cast us away. There is only one more option left to save the state: we must go to Japan."
 MEN_By_the_Princes_Orders: "亲王之令"
 MEN_By_the_Princes_Orders_desc: "Prince Demchugdongrub was born into a servile and divided Mongolia, home to an atomized and nearly forgotten people. But by his hand and in the way of the great Khan from who he is descended the Prince struck out against all of his peoples enemies. It is such a great man who the people are commanded by, and who they should love and fear in equal measure. For by his orders, we ride."
 MEN_conservatism: "Mengjiang United Autonomous Government"
 MEN_conservatism_ADJ: "Mongolian"
 MEN_conservatism_DEF: "Mengjiang United Autonomous Government"
 MEN_Death_From_Above: "死从天降"
 MEN_Death_From_Above_desc: "The Japanese bombing campaign has been just as successful as we had hoped. While large formations do not often appear in steppe warfare the supply trains and treasonous camps in which they live have had no peace. By redoubling the effort and supplies of the bombing campaign the traitors will be blasted from this earth."
 MEN_despotism: "Mengjiang United Autonomous Government"
 MEN_despotism_ADJ: "Mongolian"
 MEN_despotism_DEF: "Mengjiang United Autonomous Government"
 MEN_Destabilize_the_Ulaanbataar_Rebels: "动摇乌兰巴托叛军"
 MEN_Destabilize_the_Ulaanbataar_Rebels_desc: "While the rebellion captured much territory and people this does not mean the occupied land is secure. The hearts of the loyal remain true even behind enemy lines and the enemy caravans are guarded only by the lightest of arms. By raiding the enemy and empowering those still true to us the bastard enemy will falter."
 MEN_Destroy_Resistance_Agents: "消灭抵抗分子代理人"
 MEN_Destroy_Resistance_Agents_desc: "The people are being lead astray by the insidious agents of the rebellion; like a plague rat wherever they are found soon after the sickness of discontent rears its head. They must be destroyed as the harbingers of pain and deceit they are, and the nation returned to a state of harmony, lest we fall back into anarchy once again."
 MEN_fascism: "Mengjiang United Autonomous Government"
 MEN_fascism_ADJ: "Mongolian"
 MEN_fascism_DEF: "Mengjiang United Autonomous Government"
 MEN_For_the_Final_Victory: "为了最终胜利"
 MEN_For_the_Final_Victory_desc: "This is it: the final push. Our battles and skirmishes so far have not yielded any decisive victory, and the broken state of the Mongol people persists against all that is right, and the peoples own will. This ends now, as our forces and all the people of Mongolia must come together and destroy these devils who brought such suffering upon the land. This time, there will be no turning back!"
 MEN_gonggeer: "Shagdaryn Gongor"
 MEN_Intensify_Japanese_Bombing: "增加日本轰炸"
 MEN_Intensify_Japanese_Bombing_desc: "Perhaps the most potent weapon in the Japanese arsenal is their air forces: flying in uncontested skys with clear targets and few restrictions the Japanese pilots will surely shine as they have rarely been able to before. By their bombs and their guns the treasonous shall flee in fear."
 MEN_japanese_help: "日本援助"
 MEN_Japanese_Support: "请求日本援助"
 MEN_Japanese_Support_desc: "A saddening number of Mongols have been lead astray by the lies of bandits and into rebelion, even capturing our capital city. The Prince has seen dark days before, and just as he once rode beside the Japanese to unite the people he may now request the old friendship be called upon again to correct the people. Who would not ask for a friend's aid in times of need?"
