 MYA_poppies_ocean_desc: "到处都是罂粟田，到处都是罂粟花，到处都是割果实的孩童……鸦片的巨额利润让这片土地上的所有势力都眼红，只要一块土地，一些耕作的老农，再加上一点点罂粟花种子，就能够榨出巨额的利润，至于粮食？没人会喜欢赚不了大钱的东西。军阀在种它，土司在种它，中央政府派下来的官员也叫下属种它……这土地上有头有脸的人物都在种，乃至于反对这些人的游击队们……\n\n§e于是，罂粟花肆意盛开。§!"
 MYA_white_sun_shines_in_Myanmar: "白日耀缅"
 MYA_white_sun_shines_in_Myanmar_desc: "在那场帝国建立大东亚共荣圈的伟大远征结束后，缅甸的总督却头疼地发现，随着旧国民政府的轰然倒塌，自己所管辖的境内出现了一支战斗力强劲的军队，他们隐藏在丛林里，像恶鬼一样收割着北方头人们的生命，起初还只以为是哪支精锐的游击队，可前线却传回他们与游击队并肩作战的报告。要想将他们与土邦游击队区分开来很容易，他们独特的旗帜让他们的历史一览无余。\n\n那是一面§z青天§!§W白日§!§x旗§!。"
 Myanmar_KMT: "§z国民革命军§!控制区"
 Myanmar_KMT_tt: "§F在将乱云纷飞的二十世纪拦腰折断的那几年里，备受史学家青睐的话题无非是第二次世界大战的余波消逝、苏联在政变与地方叛乱中被撕裂以及新秩序在三级的主导下建成。至于那轮曾照耀大半个中国的青天白日，早已和布哈林的红星、中欧的旧地图一并被当作历史的注脚，被归档，被遗忘。\n\n而有一支深知自己命运的部队，他们当下最为迫切的愿望便是向世界昭告这青天白日仍在人间。然而，十年北伐，十年抗战，十余年颠沛流离，从他们在瘴气环生的密林中踏过国境线的那一刻，他们早已成为弃子。同样奔腾不息的清澈河水被国境线分成了怒江与萨尔温江，同样饥寒交迫的民众被国境线分成了南京政府与缅甸政府的子民，而眼神不再坚定的儿女们在国境线那边是抵抗军，在国境线这边则是孤军残阵，是各色势力的眼中钉、肉中刺。\n\n作为这支缅北孤军的首领，孙立人绝非什么理想主义者。一个为复国大任矢志不渝的理想主义者统领不了这样一支部队——这里有来自渤海湾旁饱经沧桑的老兵，也有家在云南、不堪亡国之辱愤然随孤军转进的新兵蛋子；这里有人誓要杀光从南境蛮夷到东洋倭寇的一切异族，也有人在胸上同时别着孙文与列宁的头像，时刻鼓捣电台上的旋钮，寻找着辗转流亡在北境的同志们的音讯。孙立人本人也是矛盾的。军中的三种主要主张：反攻云南、割据缅甸、投诚散伙，孙立人都看在眼里。然而，此前向云南境内发起的袭扰并不奏效，只是白白损失了部队。事到如今，似乎只有一条路可走：盘踞在缅北这片仰光暂时鞭长莫及的权力真空带，在这支人丁逾万却缺衣少食的孤军彻底沦为乌合之众前保存实力。他们焦急地等待着北方的云南或南方的仰光的一点点风吹草动，一旦时局再度迷乱，那便是“国民革命军”这个沉寂已久的名号重新响彻的最好时机。§!"
 nanjiangjieshao_text: "跨过广阔的大沙漠，便是“南疆”地区。这里现代文明的痕迹几乎不存在，传统的维吾尔社会形成了一个个闭塞的村落，在这里，地主掌控着水源，阿訇阐释着经书。物质与精神双重压迫之下，农奴们过着悲惨的生活。在此地开展任何形式的改革，都需要庞大的资源与坚定的决心。"
 Nanjing_Negotiations: "南京谈判"
 Nanjing_Negotiations_desc: "声势浩大的护国战争终于落幕，被外敌奴役二十余年的中国终得解放。中国共产党与国民党，在半个世纪的风云激荡中分分合合，最后还是站在了一起，结成统一战线以争取民族的自由。\n\n但摆在这个受尽苦难的民族面前的，仍是不确定的未来——该如何清算战犯，治愈全面战争带来的创伤？有着根本分歧的两党，能否在一面旗帜下继续携手共进？飞机启程前往南京，南方的天空鲜见日光，内战的阴霾，已经笼罩在地平线之上……\n\n而中国人民的真正§x未§!§z来§!，全押在这台谈判桌之前。"
 National_Assembly: "§z国§!§x民§!大会"
 National_Assembly_desc: "国民大会介绍\n\n目前£COX_XBJ_text §x中国共产党§!在国民大会中有430席\n共产党介绍\n\n目前£guomindang §z中国国民党§!在国民大会中有430席\n国民党介绍\n\n目前£minmeng §M中国民主同盟§!各成员党在国民大会中共有290席\n民盟各成员党（民盟、农工党、国社党、第三党（民革、小民革、民联））介绍\n\n各党派对当前议案的支持度为：\n£COX_XBJ_text §x中国共产党§!（[?ROOT.CPC_support]/430）\n£guomindang §z中国国民党§!（[?ROOT.KMT_support]/430）\n£minmeng §M中国民主同盟§!（[?ROOT.CDL_support]/85）\n£guoshedang §n中国国家社会党§!（[?ROOT.CNSP_support]/35）\n£mingewei §P第三党§!（[?ROOT.LKMT_support]/85）\n£mingewei §C中国农工民主党§!（[?ROOT.CPWDP_support]/85）\n§B无党派人士§!（[?ROOT.Independents_support]/50）"
