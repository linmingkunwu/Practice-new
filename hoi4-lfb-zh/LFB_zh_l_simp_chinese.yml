 COX_eid_worker_proficiency_increase_greatly: "工人熟练度§G大幅增加§!"
 COX_eliminate_violence: "消除暴力"
 COX_eliminate_violence_desc: "我们必须停止当前新疆的混乱局面，让暴力停息，让一切回到过去的那样……"
 COX_emergency_situation: "进入紧急状况！"
 COX_emergency_situation_desc: "我们的土改行动失败了！反动势力组成的联军已经在失控地区组成了一个全新的新疆政府，他们正在集结军队向我方进攻，我们需要做出应对！"
 COX_Employ_Skilled_Workers: "聘用熟练工人"
 COX_Employ_Skilled_Workers_desc: "随着我们的外交人员成功的签订了有关工业生产流程的参考协议，我们现在可以着手准备更深层次的东西了：在辗转腾挪中，我们确定了几个足够友善，工业水平又相对先进的政权。我们将尝试用相对更高的待遇吸引少数熟练工与技术工人来到这里传授生产知识并培养更多的工人。虽然待遇方面的差异可能会招致部分本地工人的不满，文化的隔阂也会产生略带敌意的摩擦，但高涨的革命友情终将克服这些障碍。"
 COX_Encourage_Commodity_Economy: "鼓励商品经济"
 COX_Encourage_Commodity_Economy_desc: "鼓励商品经济"
 COX_Endless_Radio_Waves: "永不停息的电波"
 COX_Endless_Radio_Waves_desc: "“山河无恙否？\n”“尤有艰难。”\n陕北，华中，四川……甚至东北的雪原与云南的密林，虽然我们收到的只是短短的几句密语，但仍惊喜于如此多的同志们奋战至今。由于山水相隔，敌众盘踞，我们没办法对他们提供任何援助。但终有一日，这脆弱的电波会交织出地下革命网络的新生。"
 COX_enlist_forces: "收编地主武装"
 COX_enlist_forces_desc: "我们的政策获得了一定的成效，有部分地主愿意同我们交流，并停止反革命叛乱。他们的地主武装可以被我们整编，以应付那些更顽固的敌人。"
 COX_equipment_delivery: "分发装备"
 COX_equipment_delivery_tt: "红军力量增加§G10§!"
 COX_Establish_equal_relations_between_commanders_and_fighters: "确立指战员平等关系"
 COX_Establish_Mobile_Maintenance_Teams: "建立流动维护队"
 COX_Establish_Mobile_Maintenance_Teams_desc: "建立流动维护队"
 COX_Establish_The_Central_Military_Commission: "改组中央军委"
 COX_Establish_The_Central_Military_Commission_desc: "自1926年红军初具雏形时，指挥系统便在硝烟与炮火中逐步成型。从井冈山的密林深处到万里长征的千山万水，再到最终的胜利会师，每一步都离不开一个强有力的军事指挥核心。然而，革命的枪声虽已沉寂，国家的重建之路却仍漫长而艰巨。在这个历史的转折点上，我们必须着眼长远，为巩固人民政权、维护国家安全奠定坚实的军事基础。\n\n是时候重塑军队的灵魂，改组中央军事委员会了。它将统筹全国武装力量，统一战略部署，确保军令如山，行动迅捷果断。不仅如此，中央军委还将主导海陆空三军的重建与现代化，为未来的任何威胁做好万全准备。无论是高空翱翔的战鹰，还是乘风破浪的舰队，亦或是坚如磐石的陆地钢铁洪流，都将在中央军委的调度下紧密配合，构筑起一道坚不可摧的钢铁长城。"
 COX_Establish_Urumqi_Agricultural_Tractor_Factory: "成立乌鲁木齐农用拖拉机厂"
 COX_Establish_Urumqi_Agricultural_Tractor_Factory_desc: "第一次五年计划的重点在于恢复与发展农业生产，现在，苏区有了充足的水泥，过硬的钢铁和智慧的人民群众；当这三种东西结合到一起时，我们便可以让工业发展的成果及时地惠及广大的农民朋友。通过对前苏联设备的改造与仿制，我们将在乌鲁木齐建设第一个能大量生产农用拖拉机的工厂。虽然以整个西北的规模而言，这样的机械化还远远不够，但这样即时的援助将促进工农联盟的稳固。"
 COX_Establish_Xining_Iron_And_Steel_Works: "西宁钢铁厂"
 COX_Establish_Xining_Iron_And_Steel_Works_desc: "西宁钢铁厂"
 COX_Evaluate_Industry_Level: "评估工业现状"
 COX_Evaluate_Industry_Level_desc: "盛世才撤退到新疆的时候，带来了中国国民党的部分遗产，这使得新疆地区的工业建设水平要明显好于其它军阀。然而，这些老本毕竟不能连吃二十年，根据我们此前在乌鲁木齐找到的年度工业产值报表来看，新疆的工业生产已经陷入负增长当中了。此外，之前的维吾尔族起义者与突厥斯坦分离主义者也在地方上对工业设施进行了无差别的破坏，很多工厂已经无法再修复了。为了确认我们目前控制地区的工业情况，一场大筛查势在必行。"
 COX_event_landreform_1_tt: "§G土改胜利完成！§!§R1963年§!£GFX_COX_jiaobiao_LFB §e中国土地法大纲§!、§x第二次土地改革§!的成果已添加到杂项法律中"
 COX_Eventually_Bind_The_Dragon: "终缚苍龙"
 COX_Eventually_Bind_The_Dragon_desc: "在党的领导下，中国人民了结了日本帝国主义者对中国的占领与奴役洗刷了百余年间的耻辱。尽管蹒跚，但如今的中国已然重新挺立起来，重新回到世界的牌桌上。\n\n现在的形式仍不乐观，内是百废待兴的国土，外有日帝国主义不死心的环伺。然而我们已经迈出了最为艰难的第一步。我们坚信，在党中央的带领下，在全国人民的劳动下，新生的红色中国必会继续扫清国内外的一切牛鬼蛇神，并成为全世界民族解放的范本，全球受奴役人民的灯塔。并给这黑暗的世界带来一丝破晓的曙光。\n\n§R由此上溯到一千八百四十年，从那时起，为了反对内外敌人，争取民族独立和人民自由幸福，在历次斗争中牺牲的人民英雄们永垂不朽！§!"
 COX_Expand_The_Fertilizer_Making_Technique: "推广小化肥制作技术"
 COX_Expand_The_Fertilizer_Making_Technique_desc: "漫长岁月以来，新疆的农民秉持的还是封闭落后，靠天吃饭的的封建小农经济，这样的经济，不仅不稳定，而且产量堪忧。漫长岁月的分田包干看起来并不能增加粮食产量，那该靠什么呢？大抵应该是要靠化肥的，但就目前而言，根据地根本做不到像西方工业化国家一样大规模产出化肥，但在全疆各地劳动人民千百年以来的实践劳动中，也有许多靠土方法制土化肥的方式，如最原始的用粪便堆肥等，这种堆肥方式最为普遍。\n同时由于新疆有足够的煤矿产业，我们可以尝试炼焦煤炭，煤炭在炼焦过程中会生成少量氨气，这是由于煤本身含有一定的含氮杂环，在炼焦过程中这些氮元素会以氨气的形态释放出来，混合在焦炉煤气之中。在人类没有搞出合成氨的年代，人类就是通过这种方法少量提取化肥的。而如今。根据地在乌鲁木齐的工厂也可以通过这种笨方法少量的制取化肥。\n同时，新疆存在着不少盐湖，这些盐湖内都可以制取硝酸盐，我们可以动员并教导安居在盐湖附近的农民制取硝酸盐作为根据地土化肥的原材料。"
 COX_Expand_The_Party_Branch: "扩展党支部"
 COX_Expand_The_Party_Branch_desc: "将支部建立到最基层是工农红军一直以来的优良传统，如今盛世才的旧部队已经完成重组加入到工农红军的战斗序列当中来，我们自然也要把党支部拓展到这些新部队当中，向他们宣传社会主义思想，引导他们成为共产党员。对于很多曾经为军阀效力的战士来说，政治生活离他们太过遥远，他们也不知道自己为什么而战，只是浑浑噩噩地拿着饷银度日，如今这种状态要开始改变了。在党支部的带领下，他们将会成长为有知识、有纪律的红军战士。军阀可以把人当作狗来驱使，我们就要让他们重新成为人。"
 COX_Expand_Workers_And_Peasants_Soviets: "拓展工农苏维埃"
 COX_Expand_Workers_And_Peasants_Soviets_desc: "拓展工农苏维埃"
 COX_Experience_Of_National_Protection_Army: "他们的经验"
 COX_Experience_Of_National_Protection_Army_desc: "西南的护国军比西北的红军更加早的与所谓”共荣圈“战斗，他们对日军的技战术风格相当熟悉，对如何反制敌人棘手的先进装备有着成熟的经验。”知己知彼，方能百战百胜。“为了日后能更好地应对武装到牙齿的日军，我们有必要向学习护国军他们的作战经验。而出于双方合作的目的，他们想必很乐意倾囊相授。"
 COX_Exploration_Of_Karamay_Oilfield: "试掘克拉玛依油田"
 COX_Exploration_Of_Karamay_Oilfield_desc: "经过初步的资源探查，我们在克拉玛依地区发现了石油矿藏。但一方面，由于探测技术原因，这片被认为有油矿的地方其实只是有很多的地下水也说不准。。。另一方面是，我们现有的技术似乎无法做到挖掘石油，更不用说对于新疆根据地而言，“挖掘石油”这种事情还是第一次。但既然连中华民国都能做到，那么有理由相信我们也是可以做到的，而工人们也因石油矿的发现而摩拳擦掌。当然，必须谨慎，因为我们不能因热情的心而忽略了我们在经验与技术上存在的不足。"
 COX_fab: "我们将会获得 1 单位的空闲工人"
 COX_fac: "我们将会获得 1 单位的机床"
 COX_fae: "4 单位的机床和 2 单位的空闲工人\n将会被分配给这项任务\n完成建设后，我们的工人将会就地开展生产"
 COX_failed: "新疆革命根据地"
 COX_failed_ADJ: "新疆革命根据地"
 COX_failed_DEF: "新疆"
 COX_fam: "2 单位的机床和 1 单位的空闲工人\n将会被分配给这项任务\n完成建设后，我们的工人将会归队"
 COX_Far_From_Home: "为了阔别的故乡"
 COX_Far_From_Home_desc: "自1947年重庆停火以来，革命春雷的余响已在中华大地上沉寂了十五年，现在中国旅的归来要改变这无边的死寂了。对于中国战士们而言，这是一次向故土的大进军——故乡的山山水水令他们魂牵梦绕，故乡的情况让他们挂肚牵肠。专制军阀骑在人民头上作威作福的好日子已经进入了倒计时——我们的队伍阔别热土已久，如今将带着革命的星火再度归来。"
 COX_fasten_field_development: "加快农会建设！"
 COX_fasten_field_development_desc: "仅仅是分田是不够的，我们必须迅速的推动农会建设，让农会替代原来的乡绅组织，成为农村的基层政治组织，在进行阶级斗争之余，维护农民权益，继续生产活动。"
 COX_Fei_Xiaotong: "费孝通"
 COX_Fei_Xiaotong_eco_desc: "§Y财政部长§!\n£minmeng §M中国民主同盟§!§Y籍\n“救国学者”§!\n--------------\n大部分人都只知道费孝通在社会学的科研成就，但作为民主党派的一份子，他也时刻关注着中国的未来，在他看来，给中国的农民找一条出路，便是给中国社会找一条出路。\n\n历任云南大学、西南联大、清华大学教授，而后重建在战火中破碎的社会学科，云游华东、西南各地，在凋敝的农村之中，他观察、思考、归纳。他不同意共产党人追求的“立刻，无偿”的土地革命，认为那会摧毁中国社会的根基；也不赞同国民党的“赎买”政策，认为其在中国的实施将得到与印度相似的失败。要增加农民收入，不能光靠农业增产，而是应当通过教育，鼓励乡村办副业，推动中国农村的有机转型。\n\n费孝通常以完全摒弃政治性、独立于两党之外的“纯学者”形象示人。这为他赢得了“客观中立”的好名声。结合他令人眼花缭乱的学术造诣，足以证明他可以胜任土地改革舵手的重担。"
 COX_fight_bar_tt: "目前,\n本地的农民支持度为：[?COX_acted_state:COX_landreform_famer_support|§+§!]%\n全局平均农民支持度为[?COX_global_fs_display|§+§!]%\n这导致了以下结果：\n政治点数获得：[?COX_global_fs|§=2+§!]"
 COX_fill_the_granaries: "填满粮仓"
 COX_fill_the_granaries_desc: "新疆的土改虽然带来了粮食的增产，但面对漫长而惨烈的围困，这还远远不够。我们必须推行极端的‘战时余粮征集制’。派遣工作队下乡，政工干部们必须耐心地走入每一个村庄，向刚刚获得土地的农民解释——如果政权亡了，地主会回来，一切都会失去。为了保卫胜利果实，我们必须先把粮仓填满，在保证群众最低生存口粮的前提下，强行征收一切结余。这会引起动荡，但为了前线战士不饿着肚子战斗，我们别无选择。"
 COX_Fix_The_Old_Paths_In_Xinjiang: "重整旧有道路"
 COX_Fix_The_Old_Paths_In_Xinjiang_desc: "新疆自古以来就存在数条主要商道,在十九世纪后半期到二十世纪中期也有政府主导修建的几条道路,但是它们已经因为缺乏维护而基本不能使用了。因此，摆在根据地政府的一项重要事项之一就是修整道路。修整道路的好处很多，只要这为我们发展和建设新疆带来好处，作出多少努力都是值得的。"
 COX_fix_the_timeline_DESC: "“千年的铁树要开花。”"
 COX_fix_the_timeline_flag: "涤荡浊乱，定赤旗于天下之央。"
 COX_fix_the_timeline_NAME: "世界线修正"
 COX_Flattened_Management: "扁平化管理"
 COX_Flattened_Management_desc: "我们目前的层级基本沿用了中国旅时的建制，但在传播革命的过程中，我们的战士分散了，团长们往往距离自己应当指挥的营数十公里，这要求我们的同志必须有足够的自主性。以期发挥他们的主观能动性，因地制宜地在每一座村庄展开工作。\n\n我们国家的革命有许多独特的地方，最重要的一个便是革命发源于农村，扎根于农村，这就要求我们的干部必须成为素质的全面性与“多面手”，而不是仰仗与苏联一样组织严密的科层制。他们或许不是最专业的指挥者或是计划经济专家，但从发动群众到组织游击战，他们几乎无所不能。我们也将鼓励我们的战士们努力适应这样的角色。"
 COX_For_The_Farmers_Who_Suffered: "为了受尽压迫的农民"
 COX_For_The_Farmers_Who_Suffered_desc: "新疆的贫农们在黑暗的封建地主和各种统治阶级的压迫下已经生活了数千年了。数千年来，新疆的农业生产者们无时无刻不在心惊胆战中度过，生怕见不到第二天的太阳。但即便他们再怎么如履薄冰，反动统治者们总能找到各种理由从他们身上榨取“油水”：结婚要结婚税，买粮食工具要商品税，修房子要建筑税……同时，新疆的混乱局势也让他们的情况雪上加霜：地主武装“割据”、盗匪横行、极端宗教大肆破坏；新疆的广大农民正处在水深火热之中。\n\n而我们的任务，就是解放新疆，把新疆农民们从那些压迫者的铁腕下拯救出来！"
 COX_fortify_positions: "铸垒"
 COX_fortify_positions_desc: "马家军留下的旧防御工事太过粗糙。我们需要在原有的地基上，利用西宁周边的地形，重新构筑坚固的防御堡垒。每一面城墙、每一道堑壕，都将是我们阻挡敌军推进的血肉关口。"
 COX_Free_Lanzhou: "解放兰州！"
 COX_Free_Lanzhou_desc: "由于训练不足，部队配合失当，以及敌人的激烈抵抗，使得我们上次进攻兰州的尝试收效甚微。\n\n但根据情报部门传回的消息来看，随着龙云在南方的胜利，西北军的部署似乎出现了许多漏洞，补给不畅，大军进退失据，游击队的活动也更胜以往。我们已经初步具备了解放兰州的条件，现在要做的就是加紧战备，开始动员。让西北的那条疯狗早日迎来他的末日！"
