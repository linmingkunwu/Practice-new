 COX_water_bar_tt: "目前，本地的水利为：[?COX_acted_state:COX_landreform_water_conservancy_progress_real|§+§!]%\n本地可用的水利为：[?COX_acted_state:COX_landreform_water_conservancy_progress|§R§!]%"
 COX_wc_build_Karez_button_tt: "坎儿井是我国古代水利的经典杰作，劳动人民的智慧结晶，它能将高山冰雪的融水通过遮光的地下渠道输送到田间用于灌溉，毫无疑问是新疆农业的命脉之一。但如今，许多乡村地区有修建坎儿井的条件，却由于各种历史与现实原因没有修筑；已有的很多坎儿井设施经调查也已经严重老化，难以继续使用。要确保土地革命后农业生产的正常进行并改善农民的生活水平，就需要我们动用有限的资源翻新旧井、兴修新井，彻底解决灌溉问题。当然，要实现全部的建设目标自然不容易。\n\n§W相关的工程投入可以帮助我们§!§G小幅度改善§!§W地区的水利情况。§!\n\n§Y小提示：同时按下鼠标左键+Shift键点击时，可以一键为全疆修建坎儿井！选项冷却期为30天。§!\n\n[Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_COX_Popularize_The_Karez_completed][Is_COX_wc_build_Karez_completed_or_cooldown]"
 COX_wc_build_Karez_text: "修筑坎儿井"
 COX_wc_crack_down_on_bullies_button_tt: "水在新疆的价值可比黄金，是新疆农业的命脉。但在农村地区，许多地主劣绅利用各种龌龊手段霸占了群众好不容易才获得的宝贵水源和水利设施。农民可能会妥协，但我们怎能答应！赤卫队战士很快就到他们家门口！当然，对于那些性质不那么恶劣的垄断者，和平解决依然是第一选择。毕竟一旦反动分子狗急跳墙，后果可能不堪设想。\n\n§W这将允许我们收回在动荡的局势中被反动分子夺取的水利设施。当地区§!§G治安良好§!§W时，我们将§!§Y无法§!§W通过执行再没收以改善水利情况。§!\n\n[Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_COX_Account_The_Water_Conservancy_completed][Is_COX_wc_crack_down_on_bullies_completed_or_cooldown][Is_the_wc_broken_by_enermy][Is_this_state_stable]"
 COX_wc_crack_down_on_bullies_text: "打击水霸"
 COX_wc_line_segment_tt: "目前，本地的水利为：[?COX_acted_state:COX_landreform_water_conservancy_progress|§R§!]%\n由本地可用水利，产生以下效果：\n每月农民支持度：[?COX_acted_state:COX_wc_fs_monthly_change_display|§=+§!]%"
 COX_wc_socialization_button_tt: "虽然客观情况还不允许我们进行激进的、理想的所有制改革，但是某些关键产业必须马上从地主与阿訇们的手中扒出来——尤其是水利。长期以来，新疆的水利设施大多掌握在农村地区的地主乡绅手中。他们借此垄断了农业给水甚至生活用水，以此压迫和剥削农民。这种状况很快就会结束。无论是在公审的时候把地主的财产充公，还是让他们服从革命、同意赎卖设施，新疆的水利设施最终都会归村集体或者国家所有。当然，这样的措施无疑会引起反动势力的反抗。\n\n§W我们将动用强制手段，使地主吐出他们所有的灌溉设施，或者至少让他们无法再用它们牟取暴利。这将一次性§!§G快速改善§!§W地区的水利情况，但也将§!§x大大触犯§!§W地主群体的利益。§!\n\n[Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_COX_Account_The_Water_Conservancy_completed][Is_COX_wc_socialization_completed_or_cooldown]"
 COX_wc_socialization_text: "水利公有化"
 COX_we_are_too_aggressive: "我们太过激进！"
 COX_we_are_too_aggressive_desc: "经过中共中央长达数天的争吵与讨论，我们最终得出了以下的决议：“我们高估了中国共产党现实的行政能力，以目前中国共产党当前的人手，难以管辖两百余万平方公里的新疆，唐突的将宝贵的干部下放到南疆地区，除了造成无意义的伤亡外，不仅没有完成土地革命，还让地主辖区内的民众不再信任我们……我们无能为力,只能……做出一定的妥协。”"
 COX_we_are_too_weak: "我们太过软弱！"
 COX_we_are_too_weak_desc: "经过中共中央长达数天的争吵与讨论，我们最终得出了以下的决议：“我们对地主与反动势力的态度太过软弱，一次次的纵容他们剥削农民，欺瞒政府。如果我们的军力无法一次性的将分散在全疆各地的反动武装击败的话，那么就趁此次叛乱，将敌人的反动武装全部歼灭！”"
 COX_women_event_tt: "§G我们需要更彻底的土改。\n人民的苦难尚未消除,我们就不会停息…\n我们不会忽视女性的权益！§！"
 COX_worker_training: "培养工人的相关决议将被解锁。"
 COX_Workers_Training_Agency: "建立工人培训机构"
 COX_Workers_Training_Agency_desc: "尽管曾经新疆有一小批工人存在，但是他们的生产技术和掌握的生产知识是严重不足和缺乏的。这对工业建设是严重的障碍。对于这一点我们的解决方法有两条，第一条，将我们本土的工人群众的生产经验进行总结和相互交流。第二条则是向我们的北方的同志们虚心求教。但无论怎样解决，我们都需要建立相应的专门机构来负责工人的再教育。"
