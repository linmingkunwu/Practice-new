 Where_Are_They: "他们在哪里？"
 Where_Are_They_desc: "在经历了重庆停火后和二次长征之后，中共残部的一部分流向新疆，与以陈潭秋为代表的中共支部和当地原有的社会主义组织汇合。红色力量的不断增长，使得盛世才坐立难安，不得不撕下了“容共”的面具，大肆屠杀——共产党人确实随着屠刀的挥舞消失不见了，可这绝不意味着他们已然灭亡。\n\n他们在哪里？十年倏尔而逝，新疆的共产党人依旧坚持着他们的斗争。他们行走在北疆的旷野上，出没在全疆各地的村镇与城市的街头巷尾，甚至有可能已经又一次打入了执政府的心脏；§x他们绝不会宽恕，也绝不会忘记。§!"
