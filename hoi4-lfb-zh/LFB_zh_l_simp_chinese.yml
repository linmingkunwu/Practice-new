 Maintain_Growth_desc: "保持经济的高速增长态势，通过持续投资基础设施与优化产业结构，实现可持续发展。"
 Maintain_Stability: "保持稳健"
 Maintain_Stability_desc: "在快速发展中，必须确保社会秩序的稳定，避免因过度改革引发不必要的动荡。"
