 COX_mil_safety_patrol_button_tt: "必须牢牢记住：旧势力绝不会甘心失败，他们一旦遭受挫折，一定会缩回暗处舔舐伤口，随后卷土重来。只要让赤卫队仔细搜查，就一定能找到他们密谋的蛛丝马迹——比如藏匿的一批军火——从而在骚乱发生之前就将其扼杀在摇篮之中。\n\n§W我们将出动该地区的民兵部队执行巡查，并§!§G小幅度降低§!§W地主和极端宗教势力可能的叛乱倾向。已被调往中央的民兵将无法参与此任务。§!\n\n[Is_COX_Training_The_Militia_completed][Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_COX_mil_safety_patrol_completed_or_cooldown][Is_the_mil_enthough_to_do]"
