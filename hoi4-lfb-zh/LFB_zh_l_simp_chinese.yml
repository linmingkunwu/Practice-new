 XIK_socialist_party_long: "藏族共产主义革命运动小组"
 XIK_The_Last_Anti_Japan_Army: "最后的抗日军"
 XIK_The_Last_Anti_Japan_Army_desc: "西康军主要由重庆之战后的溃兵构成。在现今之中国，这里绝不是唯一一支还在抵抗日本的力量，却是在名义上唯一保持独立的势力。凭借山川险峻与将士用命，西康顽强地扛着抗日的旗帜……\n\n但事实上，这里只是一片被世界所抛弃的荒山。日本人看不上这里可怜的资源，国民政府更是鞭长莫及，难以将哪怕是名义上的掌控延申至此处。§R这里没有满腔热血的民族战士，只是新秩序下无人问津的角落……§!"
 XIK_XIKANGWANG: "西康王"
 XIK_Xue_Yue: "薛岳"
 XIK_yangsen: "杨森"
 XIK_yangsen_desc: "§Y中华民国第九战区副司令长官§!\n§Y国民革命军陆军二级上将§!\n§F------------§!\n动荡的军阀时代，能人辈出，中国社会百年沉寂的势，化作磅礴的时代大潮，唯有最机敏的人才能驾驭。杨森出身一般，但也能早早乘上时代的浪，操柯弄潮——他在清廷尚在时加入川军，随后入滇，参加了护国战争。袁世凯——这位独夫民贼被逼削去帝号，但军阀乱战的大幕才刚刚拉开帷幕。杨森抓住机遇，脱离滇军，一举入川，事业极盛之时，他一度控制了成都与重庆，麾下拥有七万多私兵，成为川东一霸。\n\n百密必有一疏，1927年，随着蒋介石发动四一二政变，北伐宣告失败，中原大地又陷入到新的战火中。杨森自恃兵强马壮，以为能从中渔利，却撞了一头包，出川的精锐损失殆尽，旧敌刘湘又卷土重来，数年积累，顷刻间化为乌有，杨森从时代的风口跌下，但却并未自暴自弃，而是稳守一方，默默治理百姓。\n\n直到日寇进犯，杨森奉命率军出川，隶属薛岳麾下。淞沪之战，武汉会战，长沙会战…川军展现了惊人的血性与勇气，每逢最艰苦的战场，总有川军屹立不倒的身影。直到长沙之溃后，出川时的数万亲兵，已十不存一…战局早已糜烂，杨森如今能做的，只有带战士们返乡。在走过了艰苦的征途后，川军回到了家乡，无奈敌人却紧随其后。背靠长江，身旁的四川汉子们壮烈地拼死一搏，但杨森却活了下来。\n\n杨森打了一辈子仗，他从不缺乏对敌的勇气与转进的理智，更对薛岳将军抱有绝对的敬仰与忠心。唯一绊着他脚步的，只有年岁。老将军每每向东望去，想到大半辈子的起起伏伏，最后竟落得埋骨他乡，也只能唉声叹气。"
 XIK_ys: "表里不一"
 XIK_zhaozili: "赵子立"
 XIK_zhaozili_desc: "§Y中华民国第九战区司令长官参谋处参谋长§!\n§Y国民革命军陆军少将§!\n§F------------§!\n赵子立出身寒微，虽断断续续地上过私塾，但都没取得什么看得过眼的实绩。18岁时，他选择参军，希望搏出一番功名。营附，师参谋，团附，参谋主任…在这些年，中国虽无大的战事，但内战不断，并不乏立功的机会，赵子立就这样稳扎稳打的熬着资历，在抗战爆发之时，已是陆军工兵中校。\n\n战争初期，国民军损失惨重，再加上扩军十分紧急，高级军官的缺口越来越大，于是赵子立迎来了飞速晋升。他被委任至薛岳麾下的第九战区任参谋长。二人在很多方面都堪称配合无间，心有灵犀，在前三次长沙会战中，赵子立配合着薛岳从侧翼袭击敌寇，截击补给，包绕合围，完美执行了“天炉战术”。\n\n可惜好景不长，随着战事日深，二人之间还是产生了裂痕。赵子立埋怨薛岳的战术过于保守僵化，“天炉战术”看似天衣无缝，如若不做变化，日军迟早会找出破绽。但薛岳却自信地认为，日军多线作战，战线从东亚一直延伸到太平洋，此时早已无暇发动一场大规模攻势，湘江沿线，敌寇必然以守为主，必然无法集结足够的兵力，进军长沙…\n\n但很快，事情的发展便印证了赵子立的预料——当日军集结20万重兵再次进军长沙之时，第九战区根本没有足够的时间准备；当日军排开重炮，把岳麓山的炮兵阵地摧毁之时，中国军队已失去了先机；而当日军最终以梯次推进，对包绕上来的国民军进行反包围时，薛岳才顿感大事不妙——“天炉战法”已被破解，长沙已再无生机。\n\n而提早发出警告的赵子立，却被晾在一旁，在回到重庆后，便被扣上了“指挥失利”的帽子，削去了军职…而后在重庆城破后，追随薛岳来到了西康。\n\n薛岳仍把赵子立当作第九战区的嫡系，委以重任，但赵子立早对这个既无能力又无眼界的“岳飞”嗤之以鼻，只是无奈自己手头并无兵权，只能暂且屈居人下……"
