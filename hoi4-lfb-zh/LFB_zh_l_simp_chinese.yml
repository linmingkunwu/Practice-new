 COX_deal_with_comrade_desc: "幸运的是，在我们陷入混乱的时候，我们周围有能够帮助我们的共产主义同志，我们需要请求他们的帮助。"
 COX_dealing_with_local_unrest: "§G我们已在此处理地方骚动！§!"
 COX_dealing_with_local_unrest_button_tt: "在反动分子的诓骗与煽动下，当地反革命骚动正在日渐恶化。当地苏维埃、党支部与群众近日连连受到了反动分子和被煽动的群众攻击，如不及时采取措施，情况将不可避免滑向全面失控的边缘——我们应该立刻调动赤卫队，并阻止全面叛乱的爆发。\n\n§W我们将会动用可用的§!§Y地方民兵§!§W进行对地区的武装巡视，这将改善地区的治安并压制敌对势力的叛乱气焰。如果地区尚未陷入骚动，或地方民兵的数量不足上限的§!§Y30%§!，§W则此计划将不可用。§!\n\n§Y请注意，这一措施只能用于解决已发生的骚动，而不能从根本上解决地方潜在的暴乱威胁。§!\n\n计划执行后，正在蔓延的地方骚乱将会下降一个烈度等级。§Y（一级烈度下重复点击处理骚动选项，会导致民兵资源浪费！）§!\n[Is_COX_Battle_The_Landlord_Troops_completed][Is_COX_Battle_The_Religious_Force_completed][Is_COX_acted_state_active][Is_the_state_controlled_by_us][Is_the_state_not_stable][Is_the_mil_enthough_to_do_2]"
 COX_dealing_with_local_unrest_text: "处理地方骚动"
