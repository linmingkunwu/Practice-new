 Esheiti_Iskhakov: "艾斯海提·伊斯哈科夫"
 ETR_Elihan_Tore_desc: "由海向陆的狂风自玉门关吹向新疆，将枯树上刚抽出的新芽连根拔起，又悻悻而归，希望早已远去，此地唯有无穷无尽的混乱。而在混乱中，一位学者兼野心家异军突起，这便是艾力汗·吐烈。\n\n自小长大自残酷的沙皇俄国，吐烈目睹了一战期间沙皇对中亚的残酷镇压——仅仅是不愿意履行义务，去打不属于他们的战争，沙皇便下令，让中亚血流成河；即便是高举民族自决的布尔什尔维克，也无意让中亚的人民取得真正的独立，于是吐烈再度举起叛旗，却遭到残酷的镇压。吐烈仅以身免，逃亡新疆，得到了伊宁的一位大巴依老爷的赏识，在本地当了个阿訇。\n\n数十年来，这里的情形便与哈萨克如出一辙——真主的信众被异教徒统治与奴役，而在一场“革命”后，不信者们就打着“民族平等”的幌子，继续着无尽的压迫。艾力汗·吐烈认清了现实，中俄两国境内的真信者们必须从外国暴政中得到解放。蛰伏多年，他终于得到了机会——随着共产党人在新疆的统治土崩瓦解，吐烈很快召集了追随者，凭借对经书的熟稔与多位旧巴依的支持，他的势力迅速壮大。很快，拨乱反正的时刻即将来到，“压迫者们”的废墟之上，“突厥民族”的国家将崛起，而他，艾力汗·吐烈，将成为这片土地上的第一位埃米尔——真主意志的代行者，唯一的真理。"
