 COX_GAN_lose_supply_countdown: "西北军正在失去补给"
 COX_GAN_war_ended_tt: "我们对兰州的进攻已经结束"
 COX_GAN_war_lose_tt: "\n尽管我们竭尽全力，但西北军仍然得以§R全身而退§!。\n在西北军撤退时，他们对当地实施了惨绝人寰的焦土政策，这将使我们的整合进度§R倒退§!20点。"
 COX_GAN_war_start_tt: "§Y60天§!内，如果我们能够及时攻占天水，便能彻底切断西北军的后路，将其一网打尽！"
 COX_GAN_war_started_tt: "我们已经开始了对兰州的进攻"
 COX_GAN_war_win_tt: "\n西北军被§G全数歼灭§!，通往陕西的大门已经大开！\n由于我们之前的渗透，兰州的整合将§G增加§!至[?Lanzhou_integrtion_index]。"
