 LFB_GAW_GUI.1.a: "事已至此，暂且从权……"
 LFB_GAW_GUI.1.a.tt: "§Y满洲地区将会分治§!,§G华北地区将会根据现状进行分配§!"
 LFB_GAW_GUI.1.b: "公道得胜，十死无悔！"
 LFB_GAW_GUI.1.d: "抗日民族统一战线持久不懈的斗争终于取得了成果！\n\n日本派出了一支由其外相带领的外交团队，来到南京，向统一战线方提交了和谈请求。这是战争趋于白热化之后，第一次主动由日方提起的谈判要求，很快得到了统一战线的同意。在南京郊外的一处隐蔽之处，国共代表与日方外交团一起举行了一次秘密会谈。\n\n尽管整个世界都知晓日本在战争中处于劣势，但他们仍摆出了“东亚之主”的高傲姿态。他们愿意承认中国的独立地位，并同意以山海关划定两国边界——但这一切的前提是，统一战线必须即刻撤出满洲，且承认满洲国的存在。\n\n是的，这就是日本人的“让步”，尽管中方有相当一部分代表认为这完全不可理喻，无法接受，但日方代表却隐隐暗示着我们不接受的后果：由于满洲撤侨已告完成，日军可以“使用一切手段促使中方接受和平条件”。同时，各方面传来的情报也明示着日本已经召回了其在亚洲的所有可支配的军事力量，决定破釜沉舟，与统一战线鱼死网破。愈加严峻的海岸封锁，昭示着即将到来的全面登陆，而我们有理由相信，日本不会吝惜其手中的最后底牌——核武器。\n\n日本要求的条件在许多人看来都难以接受，这不仅是对中国主权的继续践踏，也是对牺牲在抗日战场上的将士们的亵渎。较为理智的代表们据理力争，争得了日方的些许让步——他们同意西满洲区域独立以作为中日间的缓冲地带。\n\n谈判进行了半日，除去愤而离席的护国军高层，其余大部分代表已经对和谈表示赞同，但毫无疑问，我们的军队仍然踏在东北的土地上，所以撤军与否，和平与否，都在我们一念之间……"
 LFB_GAW_GUI.1.t: "日本提议和平"
 LFB_GAW_GUI.10.a: "中国，统一而不可分割！"
 LFB_GAW_GUI.10.d: "随着解放战争的进行，经过中央以及前委对如今形势的研判，一致认为现在正是进军西藏、武力解放藏区的最好时机；尤其要赶在国民党反动派之前，对西藏施加有效的影响。\n先行部队、物资等已开始在玉树集结准备，我军预计将在一个月之后进入藏区作战。"
 LFB_GAW_GUI.10.t: "准备解放西藏"
 LFB_GAW_GUI.102.a: "但无论如何，兰州已经解放了。"
 LFB_GAW_GUI.102.d: "兰州市，简称“兰”“皋”，古称金城。地处西北要地，兰州自秦朝以来已有两千多年的建城史，自古就是“联络四域、襟带万里”的交通枢纽和军事要塞。日本远征军占领这里后，辻政信更敏锐地觉察到了此地的战略价值，不远万里从满洲拉来钢筋水泥，就地征调民夫，将兰州城内外围成了名副其实的铁桶。\n\n但无论怎样牢靠的工事，都有其弱点。随着战争的旷日持久，辻政信越来越难以给远征军弄来补给与兵员，远征军早已疲态尽显，无法再像之前那样对西宁城保持压力。遥遥无期的战争消磨着帝国的耐心，每周，辻政信都会收到本部敦促他撤离的电报，但皇国之魂仍促使他继续战斗，不到殒命沙场，武士总会持刀屹立，期盼着事态有所转机。\n\n游击队的活动极大的限制了远征军在乡野的活动，兵力不足，补给短缺，辻政信只能命令士兵固守几个大的聚居点。这使得他们对红军的攻势几乎没有防备，几乎在数天之内，红军就拔除了挡在面前的数个据点，完全将兰州包围。\n\n直到此刻，辻政信仍做着他的春秋大梦——只要兰州的坚墙挫败了红军的锐气，远征军就能趁机反攻，一举粉碎西北的抵抗，他就能衣锦还乡，继续当帝国的英雄……\n\n于是惨烈的攻城战开始了，担心破坏兰州城的古迹，更害怕伤及无辜，红军并未调集重炮攻城，只是在山炮与重机枪的支援下，分批次地对城头发起了冲锋。在付出了一些伤亡后，红军拔掉了城外的日军阵地，迫使他们入城固守。等待着红军的，是更加残酷的战斗——坚固的街垒遍布昔日四通八达的街巷，高一些的民居中都精心布设着火力点，最为关键的是，日军根本不在乎民众的死活，城中的居民完全没有得到疏散，而是在刺刀的逼迫下，献出最后一口存粮，流干最后一滴汗，再被当作肉盾，迫使红军付出大量的牺牲，一栋接一栋地进行扫荡……\n\n城中激战持续了数周，待到尘埃落定之时，兰州城早已伤痕累累。好似战争造成的破坏还不够，在撤退前，日军的后卫在城中大肆纵火，火势一度蔓延至数个城区…….\n\n将日本逐出兰州的战役中，中国军民付出了难以计数的伤亡……"
 LFB_GAW_GUI.102.t: "黄河明珠之殇"
 LFB_GAW_GUI.103.a: "他素未谋面的故乡哟……"
 LFB_GAW_GUI.103.d: "在先头部队开进陕北的一天后，白俊杰所在的部队也跟着进入了陕北。他本是想打报告进先头部队打头阵的，可指导员知道之后不仅没同意，还专门命令他的班长看着他，免得白俊杰做出保尔式的行为。\n\n这让他很不服气，他明明体格健壮，训练科目成绩放眼全营也是傲视群雄，可为什么——其实他也知道理由，他是他们白家的独子，得留他传香火，更何况，他身上还有着他娘交他的使命。\n\n白俊杰家以前在陕北也算得上殷实，可日本鬼子打进来后便不可收拾地败落下去，乃至到了不能活命的程度，那怎么办呢？只有逃。白俊杰的爹便带着老婆和她肚里的孩子逃离了陕北，走时除了家里的族谱，什么也没顾得上带。白俊杰便在颠沛流离的路上出生了，好在不久后便在新疆落了。白俊杰的爹劳累过度早早归了天。留他娘俩相依为命，红军来后，他们的日子宽裕许多，但他娘早被过多的操劳搞垮了身子，不久后也去世了。\n\n白俊杰揣揣自己的行囊，在哩！他娘去世的时候，只把族谱按到他手里，然后不住地叨着寻根二字就咽了气。这便是娘的遗愿了，白俊杰想着。他出生在逃难路上，在新疆长大，对于陕北没有多少印象，只是听着爹娘晚上落泪中流出的哀诉，沉默不语罢了，可这是娘的最后愿望，恐怕也是爹临死的执念，他必须回一趟自己未曾谋面的家乡。\n\n进了陕北后，他向指导员请了假，指导员这次便大方起来，不仅同意了，还掏出几枚银元交给他，连里还给他发了套新军服，好让他“衣锦还乡”。\n\n 寻根的路不是容易的，他又没在陕北待过，怎么寻根？凭着手里的族谱还有娘临死前的交代，靠着老乡指路，他最后好不容易寻到了白家的祖屋。白家留在陕北的人也不好过，除去白俊杰一房，留下的三房里有两房也断了香火，仅剩的一房也仅有一个老妇和孙子们了。老妇上下打量着白俊杰，从他手上接过族谱，搂在怀里呜呜哭了起来，被孙子们扶起来后便踉跄着进了灶房。端出一碗擀面皮出来，白俊杰是从没见过这种吃食的，但当他坐下捞起一条面皮，吃进嘴里后，一种无以言说的感觉从他的嘴里爆开来，与他的味蕾紧紧相拥。他骨子里白家的血脉，对陕北的记忆霎时苏醒，他跪在地上，嚎啕大哭。"
 LFB_GAW_GUI.103.t: "寻根"
 LFB_GAW_GUI.104.a: "“我叫……呃……我叫，我叫孙兴民！”"
 LFB_GAW_GUI.104.d: "£gezifu £gezifu 大同煤矿一号坑的一名矿工从不会想到，还能再从别人和自己的嘴中听到自己的名字。\n\n£gezifu £gezifu 正如编号，他是1962年1月1日来到这里的第5位矿工。也是从那一天开始，他的名字就变成了一串数字。\n\n£gezifu £gezifu 他不知道这里是哪里，他只知道这里是一座煤矿。他的家在哪里呢？他也不知道具体方位。进县城买机织布的时候，被日本人看到是个壮小伙，就给他抓进了宪兵队，再被套上头套一通拳打脚踢送到了这里。他问过工友们，大家都是这么被强制抓进来的。\n\n£gezifu £gezifu 进来的第一天，他立刻就想逃跑，可看到四周的铁丝网、门口巡逻的日本鬼子、集合时四面对着他们的黑洞洞的枪口，他还是打消了这个想法。在这里的五年，对他而言是比种庄稼辛苦得多的五年。天刚蒙蒙亮，就被宿舍外的大喇叭喊起来，随后，日本兵粗暴地踢开漏风的宿舍门，甩动手里的鞭子。将身边的工友们一个一个挥醒。穿上灰不溜秋的工作服，吃早饭。平心而论，这里吃的比家里好一点，至少有干饭。但也只是维持在一个饿不死人的水平罢了。随后就会被赶去矿坑，在队长的带领下开始一天的工作。\n\n£gezifu £gezifu 好几里且每日延伸的矿道、几百米的竖井、沿路加固的木梁与手推矿车，这些都是他每日司空见惯的事情，正如他那从来没有干净过的衣服一样。他没有文化，所以干不了像是埋雷管爆破之类的技术活，他每天需要做的就是和另外几十个工友一起，把满载的矿车推上去。\n\n£gezifu £gezifu 又过了很久，组长看了看表，告诉他们收工了。回到地面后，他们早已黑不溜秋，像个被墨汁洗过一遍的人一样。这时，他总会想到小时候自己调皮不愿意上私塾，喝了一大口老师书案上的墨水，然后被戒尺抽手心的往事。在脑子放空的这个时候，也是队长带着日本人过来的时候，那个日本人每次都叽里咕噜地说一堆，由跟着他的翻译转达，无非是“你们在这里有吃有穿，还保证你们的安全，你们一定要好好工作。”有时还会把人拉出队列一顿打。此外每个月，都会宣布增加生产定额，不过工具倒鲜有革新，下矿时发给你，上来时一个一个收走。\n\n£gezifu £gezifu 待久了之后，他也会想着逃跑，就像其他很多人一样。不过逃出去的绝大多数人都在第二天早上的例会时“回来”：尸体被绳子绑着，拖在地上，日本兵攥着绳子，骑着高头大马，在门口的空地上骑着马，尸体被拖行。嘴里叫骂着不许离开这里，不然这就是下场。再把尸体脖子套上绳子吊起来，直到脖子断了为止。\n\n£gezifu £gezifu 在这样的环境里，一串数字替代了他的名字，他丧失了自己的名字。他想过或许有一天他会像前人一样，埋在矿里。\n\n£gezifu £gezifu 这天，外面先是一声爆炸，接着便是枪声四起。组长和他们都被惊醒，谁也不敢往外看。躲在宿舍里大气不敢出，一整个宿舍都笼罩在不安的气氛中。等到后半夜枪声稀疏了，突然有人敲门，“有人吗？”组长忙把门打开，是两位荷枪实弹的士兵，他们的军服，没有人见过。“工人兄弟们！”站在前面的那个士兵向房间里喊话，“我们是共产党领导的红军，我们已经把这里的鬼子赶跑了！现在我们需要对这座煤矿进行登记，请各位工友们，依次过来登记！”\n\n£gezifu £gezifu 等轮到他的时候，一瞬间，他似乎忘记了自己的名字，那个他、这个数字，似乎没有关联，两个平行的人生。午夜睡不着想家时，嘴里轻轻吐出aa三个音节。下一个瞬间，他望着面前比他高上一头的正在写字的士兵，哆哆嗦嗦地："
 LFB_GAW_GUI.104.t: "我的名字"
 LFB_GAW_GUI.105.a: "编者注：［本文章刊登于洛阳解放当日的洛阳晚报，未经删改，编辑室内闻者无不落泪。］"
 LFB_GAW_GUI.105.d: "£gezifu £gezifu 洛阳，古称神都、洛邑、洛京。在前不久结束的战役中，战士们凭借着掩体和废墟逐渐渗透进洛阳市的中心，终于，在一声枪响后，洛阳解放战役基本宣告结束，剩余的俘虏被转送至后方处理。\n\n£gezifu £gezifu 王贵安失神地望着眼前的一片废墟，他是个土生土长的洛阳人，在他小时候，这里还是一片广袤无际的山区丘陵，他有时候顽皮，跑到山顶去和小伙伴们玩捉迷藏，偶尔又会去一些似乎是很久很久以前的人们所建起来的破房子那去寻找宝藏。但他总是会被妈妈发现，在被痛打一顿后，妈妈像是唱摇篮曲一般跟王贵安讲起这个古城的故事和生活在这里的人们的故事。但自从日本鬼子占领了大半个中国后，王贵安和父母在逃难的过程中走失了，他已经整整十年没有见过他的父母了。\n\n£gezifu £gezifu 小时候王贵安听大人说，时间是个了不得的东西，久了就什么事情都忘了。但亲生父母的面容，声音，往事，如同刀刻一般在他的脑海中久久不散，一天比一天清晰，也一天比一天痛苦。他忘不掉也不敢忘，这份仇恨太过强烈，即使重返故乡的土地，也不能使他释怀，小时候在废墟里痛哭时听到的飞机轰鸣声、喊叫声，现在仍然在耳边响起，只是这次，他不再是孩子了。\n\n£gezifu £gezifu 他的眼睛又重新恢复神采，端起枪继续向前出发。\n\n——————————————————\n\n£gezifu £gezifu “据粗略统计，洛阳市除周边村庄外，其余基础设施，工业设备均受到不同程度的人为毁坏，九成以上的日军已被歼灭，一成日军携带着一部分重要资料逃往满洲。洛阳重要文物如龙门石窟，白马寺等具有重要历史意义的文物均受到不同程度的损失，大量佛像被损毁，大量文物古籍被盗走，侵略者如果带不走的就砸烂，放火，如同一百多年前的英法联军对圆明园所犯下的恶行那样。自然环境被严重破坏，对洛阳的修复工作迫在眉睫，这座在中国历史上具有重要意义的城市，见证了如隋唐等朝代兴盛衰亡的古都，如今竟近乎毁于侵略者之手，笔者恨不能提枪上阵，剿灭敌人……以前我们只能眼睁睁地看着侵略者玷污我们的土地，侵犯我们的人民，亵渎我们的文化，但是现在，红军来了，红军来了！他们对着整个黑暗世界宣告着对日本军国主义侵略者的最强烈反攻已经开始，这是中国人民的伟大时刻，也是中华民族的伟大时刻！”"
 LFB_GAW_GUI.105.t: "洛阳解放"
 LFB_GAW_GUI.106.a: "我们还有很多事情要做！"
 LFB_GAW_GUI.106.d: "£gezifu £gezifu 此刻，北平城中，政府大院内一片混乱，不断有人抱着一摞摞文件向空地上冒火的铁皮桶里倒，从一楼到六楼，时时有人在翻箱倒柜地搜集角落里的纸片，刻刻有人将手中的文件抛洒出去。\n\n£gezifu £gezifu 视线离开这里，前往外城，德胜门、安定门内外的民房正在熊熊燃烧。警察失去了往日的威严，没有日本人撑腰，他们这些外地调来的只能关紧警局大门，任由外面的秩序不断恶化。北平城此前从未被共军占领，所以市民们正在研究门口挂什么好。大清的龙旗显然不行，民国的青天白日呢？这帮人信马克思，可能也不行。思来想去，扯了一块红布，一块白布，到时候两面一起挂！\n\n£gezifu £gezifu 翌日，经过一天一夜的战斗，城外的枪炮声渐稀，偶有枪声响起。城门被炸开了，城墙内外联系断绝，不知道城外的百姓如何，不过这不是内城的老北京们最关心的，家家户户房门紧闭，北城侥幸存活的居民，躲在藏兵洞中。大家都在等待着自己的命运。\n\n£gezifu £gezifu 不知是谁大喊了一声“过兵了！”只见一队队穿着朴素的士兵沉默地从西直门进入北京城内。家家户户依旧家门紧闭，一双双眼睛从夹缝中偷偷地盯着这群士兵。想象中热闹的进城仪式并没有发生。"
 LFB_GAW_GUI.106.t: "进京"
 LFB_GAW_GUI.107.a: "我们会让那群畜生血债血偿！"
 LFB_GAW_GUI.107.d: "£gezifu £gezifu 根据陕西红军保存下的中央资料，山东，一直都是各大抗日根据地里最活跃的一个。那里的人民全力生产，那里的游击队奇兵频出，那里的根据地军民和谐，那里的抗日情绪永远高涨……\n\n£gezifu £gezifu 可当红军时隔20年又来到济南边的一个村庄时，他们却没有看见半点生机。\n\n£gezifu £gezifu 红军并没有看见一个他们设想的饱受战争摧残仍挣扎求生的村子，而是一个流淌着血与泪的死村。\n\n£gezifu £gezifu 村子里到处都是燃烧的房屋，村子外老远就能闻见味，战士们皱着眉头捂着鼻，一步步向村庄靠近，可是为什么在呛鼻的烟中，还有一股烤肉的奇怪味道？继续往那走吧，不过可得小心，可能还有没来得及撤离的日军埋伏着他们，派排里最机灵的小张去侦察，他会好好看的。小张先行朝着村庄去了，但过了一会，却传来他凄厉的叫喊。\n\n£gezifu £gezifu 怎么回事，小张遭了埋伏？战士们的心骤然缩紧，快步赶上去。小张的叫喊还在继续，呜咽在空中久久不能散去。战士赶到了村口，一个被戕害的村民躺在那里，双眼满是恐惧。战士们的枪都有点握不紧了，他们大概明白小张凄厉的叫喊是为什么了。村子里四处都是村民的尸体，他们有的胸上有一团血花，有的被捆在门柱上，有的被割去了双耳，有的嘴中插着一把刺刀。每个战士都咬紧了牙齿，每个人都死死攥住他们的枪。\n\n£gezifu £gezifu 在村子的中心，他们找到了小张，他跪在地上，以头抢地不停呜咽着。他的身旁躺着一个妇女的尸体，一丝不挂。她的腹被剖开来，双腿张着，双手掌心各有一把刺刀，她的双目圆睁着，了无生气的眼珠中似乎蕴藏着无止境的憎恨，排长踉跄着走过去，试图为她阖上双眼，却怎么也抹不闭她的眼，身经百战的排长怔怔地看着这双仇恨的眼睛，呜呜地哭了。\n\n£gezifu £gezifu 两个小时后，全排在村子中心沉默地集合，面对着二百余具村民的尸体，每个人都一言不发，但泪水早已掩面。排长攥着一面日本的军旗，狠狠掼在地上。"
 LFB_GAW_GUI.107.t: "惨象"
 LFB_GAW_GUI.11.a: "将革命的红旗插到祖国的最高峰上！"
 LFB_GAW_GUI.11.d: "“同志们！我听说，军中有人看不起西藏这块地方，但日本人，甚至是印度人，都在千方百计地想把它搞出去。现在藏军就布防在通天河南岸和金沙江西岸，不把西藏拿回来，我们未来的国防边界就不是喜马拉雅山界，而是金沙江边，国土丧失百万平方公里，子孙后代都会骂我们啊！进藏确实苦，可是西藏人民世世代代在农奴主残酷压迫下，生活岂不更苦？人民解放军以解除人民痛苦为己任，我们怎能眼看他们受苦而无动于衷？”\n……\n“邓委员特地为我们题词，题词是这样写的：‘接受与完成党所给予的最艰苦任务,是每个共产党员每个革命军人无上的光荣’。这说明，中央非常重视进藏工作，因为藏区情况相当特殊。全军必须认真学习上级颁发的解放西藏的有关文件，行动上严格遵守三大纪律、八项注意和约法八章，尊重藏族同胞的风俗习惯,从思想上提高对政策的认识,理解民族平等、民族团结的重要性。而我们作为进藏的先遣军，必须发挥好模范作用！”\n……\n“干部要带起带头作用，所有的人思想都要通，要高高兴兴地去西藏！”"
 LFB_GAW_GUI.11.t: "在进藏动员大会上的讲话（节选）"
 LFB_GAW_GUI.2.a: "“朕深鉴于世界大势及帝国之现状，欲采取非常之措施，收拾时局，兹告尔等臣民……”"
 LFB_GAW_GUI.2.a.tt: "§G日本投降了,我们胜利了！§!"
 LFB_GAW_GUI.2.d: "[JAP.GetLeader]已经数日没睡个好觉了。\n\n军部传来的净是些坏消息。无论陆军海军，在战前哪个不是趾高气昂，从不把地球上的任何一支军队放在眼里？如今却被曾经瞧不起的中国人搞得焦头烂额——尽管战报从来都是“我军胜利进击”，“即刻剿灭匪首”，但只要有心之人随便翻翻往日的期刊，会发现红军已经完全溃灭了四次，护国军已经损失了上千万……面对国内淤积的不满，他只能与军方一起不断罗织着谎言，却无法掩盖战线不可避免的溃散。直到某一天，军部递来了一封简短的信。\n\n是满洲来的消息，内容很简短——满洲的沦陷已成定局，侨民疏散计划已经失败，在中国的军队也陷入包围。帝国现在只剩两个选项，是启用核武，在满洲对敌人予以重创；抑或是和谈，屈辱地放弃百年来苦心经营的东亚霸权。\n\n [JAP.GetLeader]不禁怒极反笑，当初信誓旦旦地承诺问题不大的是军方，前线的消息从未准确过，是政府一直顶住压力，承受人民的唾骂。事到如今，他们反倒要把责任全甩到政府——还有他本人身上。他们给予的两个选项，一个是要政府成为屠杀亿万人的刽子手，让日本在外交场上自绝于世界，乃至使得整个世界陷入火海；另一个则是要让他自绝于日本人民，被写进教科书，世世代代钉在耻辱柱上……\n\n 他走进东御苑地下，藏着帝国最高机密之处，看着在玻璃柜内，一个朴素的红色按钮。驻足良久，他终是没有动作，转身离开。\n\n统一战线的两大政权，都扎根于西南或西北内陆的崇山峻岭之中，打击大城市对中国的影响微乎其微，若想扭转战局，帝国需倾尽其核武库，以期喝退疯狂的中国人。但将大陆化为废土后，帝国在实际上也将失去那里的资源与人力，更不要提冷战的另外两极正时刻虎视眈眈……帝国将赢得这场战争，但将失去未来。\n\n再三思量过后，他还是带着内阁草拟好的诏书，往皇居走去……"
 LFB_GAW_GUI.2.t: "旭日陨落"
 LFB_GAW_GUI.21.a: "“你好，我是中国共产党北平特派员高庆。”"
 LFB_GAW_GUI.21.d: "“长官，我这药给孩子送去的，您行行好哈，我孩子很急着用的，真的…”北京城自沦陷时开始，就设置了非常严密的安保检查措施，无论是带了什么东西，都得检查一遍才能过，小到铅笔盒，大到卡车，只要不是日本人的，那都得照例进行检查。\n\n“不是我为难你，哥们，但是你这药我必须查，你良民证拿出来倒是能缩短一下流程，当然还得稍微这么忍痛割爱一下不是。”治安员凑过来和高庆小声说道。\n\n“欸好嘞好嘞，不过我要和您谈谈，我良民证在这呢，咱们去那旁边聊聊？”高庆和治安员走到警卫室旁边，高庆左探右望，确认没人后这才开了口。\n\n“哥们，活的咋样啊，滋不滋润？”\n\n“治安员一听这话，就知道高庆不是什么一般人，打量了一番高庆后说“说吧，你是共的还是南边的。”\n\n高庆本来想着只是能进城，但是在一步步试探之下认为这人很可能是北联的，“不如赌一手”高庆嘀咕了一下，和治安员说“北平联合俱乐部，不知道兄弟有没有听说过？”\n\n“俱乐部啊，你现在进去把你孩子安顿好，我们晚上在中日友好医院门口见吧，我带你去玩玩。”说罢治安员就把高庆带进城门，“那晚上见”。\n\n高庆穿梭在大街小巷之中，遍地都是流浪汉，还有日本兵横行霸道，这些人的日子就更不好过了，那日本兵念着蹩脚的所谓协和语，使唤着人，高庆已经对这种场面司空见惯了，只是低着头往前走。这些流浪汉里有汉人也有日本人，他们当初漂洋过海来投机，却落得这么个下场。但高庆顾不得这些，快步回到他在北平的家，休息去了。\n\n到了晚上，高庆去医院门口等到了治安员，治安员带着他走进了一个台球厅，把一个小皮革本交给高庆，说道：“这位同志你好，我是北平共产主义小组的洪元良。”"
 LFB_GAW_GUI.21.t: "深入敌后"
 LFB_GAW_GUI.22.a: "“我们将会一视同仁地援助各位”"
 LFB_GAW_GUI.22.b: "“我们会先与各位进行一下谈话”"
 LFB_GAW_GUI.22.d: "一开始，没有人在意这个小村庄的村民在干什么。对于改组政府的官员还有当地的乡绅来说，只要他们把每次的地租交够，把主子派的差役做完，为什么又要多花精力去得知他们在干什么，想干什么呢？直到这个村子里发展出的运动渐渐危及到这片土地上的每个达官贵人时，他们方才意识到他们曾经干了什么傻事。\n\n在现实的重压下，在战争的阴云下，一队又一队的农民举起了他们的旗帜，霎时间四处都飘扬着他们的旗帜，四处都回响着他们的口号。\n\n“王侯将相，宁有种乎？！”\n\n“分田地，均贫富！”\n\n“反日复明，再造天朝！\"\n\n”打倒帝国主义，分粮分牛分地！“\n\n”苍天已死，黄天当立！“\n\n总之，坐在张英才面前的这群反抗组织代表，大致就是提出或者喊出这些口号的人。他看着面前这群穿着简朴，却互相争吵，气势汹汹的农民们，不禁揉了揉额头。这些争吵的人，大多都是苦命人，因受不了日渐加重的压迫才揭竿而起。他们发起运动的背景，运动的手段、意识形态也不尽相同，可能让他们愿意同时坐在他这个共产党干部面前的，也只有共同的敌人：改组政府还有他们的日本主子。\n\n张英才清了清喉咙，刚想说两句——”喂，‘苏维埃’先生，我听说你们的地盘是不是搞共产共妻？“却被这样的疑问，或者说诘问给噎了回去，他身边的两个小战士正想挺身激辩，却被他用眼神制止了——先说正事。抵抗组织虽不少，但许多却是缺枪少弹，没有长远发展的可能，而今天他能够邀请这些代表来他这里，也是要商讨援助的事宜，这也是他们愿意应邀的真正原因。"
 LFB_GAW_GUI.22.t: "从田间来，到田间去"
 LFB_GAW_GUI.23.a: "铁幕难买自由贵，青春誓给人民累。"
 LFB_GAW_GUI.23.d: "又是一年华北的严冬，透过薄薄的窗纸，寒风吹进阁楼，惊醒梦中游子。\n\n在梦醒的醍醐味中，他忆起了老家无为，时值新春，大街小巷是否挂满了鱼灯？离家多年，他曾无数次在梦中回到了那座安徽古镇，但他却不能回去，现实与自傲禁锢着他。他对故乡的记忆，还停留在自己收到北大哲学系的录取通知书之时。那是他一生中最辉煌的时刻，父亲摆开大宴，半个镇子的人全来庆贺，老先生赠予长诗祝他前程似锦，婆姨们也交头接耳“准是那文曲星下凡了…”。\n\n而北京——这座古城却没有对他张开欢迎的臂膀。寒冷的天气，艰深的课业，当地人根深蒂固的排外，都令他水土不服。但他仍坚持了下来，毫不懈怠。他时常待在图书馆中，与先哲为伴；哲学的学习免不了激辩，他便每每自告奋勇，操着浓厚的乡音打赢了一场接一场的论战。第一年，他奋力攻读德国古典哲学，希冀从其中寻到救国良方，但从康德到谢林，从黑格尔到费尔巴哈，每前进一步，都是新一套层层嵌套，愈加困难的体系，思维不仅没有明晰，反倒愈发头昏脑胀；于是在第二年，他折回古希腊，期望能从柏拉图与苏格拉底的著作中窥见现代文明的根基……世事变迁，他仍翻着古书，沉沦于先哲的智慧，却对周遭的现实充耳不闻。\n\n但现实终是找上了他，并结结实实地，将他拖入了深不见底的泥潭——一封检举信，实名举报他持有“破坏大东亚共荣”的危险思想，令他失去了继续深造的资格；一封家书，则言明了因天气大旱，故乡发生饥荒，虽不需要他进行接济，却不得不停止生活费的供应。象牙塔顶的雏鹰被抛入生活的深渊，折断了未丰的羽翼，就此沉沦……\n\n起初，他曾试着给报纸的时评专栏投稿数次，却无一通过。无奈之下，只好一边在一家不入流的书店当会计，一边投稿到淫秽杂志，聊以为生。先哲的智慧沁润了他的头脑，却对他的现状无计可施。他省吃俭用，把一块钱掰成两块花，却远远追不上因经济衰退飞涨的物价……北风朔朔，寒意彻骨，他只得紧裹漏着絮的棉衣，瞥向窗外，北平城繁华的市街如今人迹罕至，巡行的士兵监控着每一条街巷……\n\n起身，收拾好背囊与通关的文书，他今天就要离开这座正在窒息的城市，去到河北的乡间，调查不断向北蔓延的饥荒。轻推房门，他没有丝毫犹豫地离开了发霉的书斋，隐隐之间，他似乎有一种预感——或许，在书斋之外，自己能寻到人生苦寻的价值，又或许，某个持激进立场的报纸，会接收自己沿途所见，作为一篇“特别报道”。"
 LFB_GAW_GUI.23.t: "沉沦"
 LFB_GAW_GUI.24.a: "要留在他们的队伍中，与他们同行"
 LFB_GAW_GUI.24.b: "要回到城中，用他们的事迹传播希望"
 LFB_GAW_GUI.24.d: "用一整天的时间，他通过了审查与盘问。离开北京，越是向南走，饥荒的影响似乎就越重。在严苛的配给制下，城内的人只是面有菜色，至于城外的村庄，则无不掩埋于深雪之下，傍晚时不见炊烟，直到晚上也只有几点与萤火无异的亮光。幸得月光明朗，青年才得以继续前行。他在朋友家中落脚，以数枚银元换口吃食，行了快半个月，就这样在京城周围走了一遭。\n\n在肥力衰退的土地上，农民仍费力耕耘，无奈天公不作美，今年的收成仍旧不好。持续到入冬的大旱不仅令秋收光景惨淡，更夺走了将近一半的越冬麦。往年的瑞雪预兆着来年的丰收，但如今压在厚雪之下的，只有干瘪的尸首。能拯救华北免于来年饥荒的，除了奇迹，就只有政府的救济了。但青年知道，还是前者的可能性要更大些——\n\n聊胜于无的储备粮早在60年代初的自然灾害时就被吃光了，随着农民绝望地吃光了种粮，自给自足的小农经济便迎来了总崩溃。地主趁机兼并土地，哄抬物价，农民只得逃荒，或沦为佃农。他曾与同学就此大声激辩，也曾与市民们坐地绝食，鼓动政府发放救济，抑制粮价……他自觉做了一切力所能及的事，却无法撼动这悲惨的现实分毫。或许真如黑格尔所说，唯有绝对精神的运动才能促成变革，而中国，这个民族的精神早已在腐尸中衰朽，禁锢于历史与帝国主义打造的层层监牢之中，所以他只能将报纸上的一幕幕惨剧看在眼里，看人们扒树皮，刨树根，看绝望的人抛妻弃子……\n\n自那之后，灾难从未结束，无论年景好坏，饥荒的阴影始终笼罩在华北平原之上。\n\n他本以为目睹了一幕幕惨剧后，自己会感到震惊，哀伤，愤怒……但在盖着皑皑白雪的林间，他遇到了一群衣衫褴褛的人。他们自称是数年前的农民起义军，尽管华北已戒严多时，尽管他们缺吃少喝，头顶没有片瓦遮头，但他们仍邀请青年来到林间的营地，大家围坐在篝火旁，喝着稀米汤，唱着质朴的歌谣：“政府说得都好听，口口声声为人民。我农民实在难忍，哎哟，哎哟，我农民实在难忍；四两米稀饭照见鬼，田里草长得比人深，一亩七斤、八斤，哎哟，哎哟，一亩七斤、八斤……”\n\n报纸上将他们描述成无耻的匪帮，背叛大东亚共荣的“国贼”。但在青年看来。他们似乎并没有那么不堪。他们的首领是一位矮小黝黑的中年人，队伍刚吃完饭，他就把青年拽到跟前。他没读过书，却能侃侃而谈。他谈到老乡们因何揭竿而起，暴动又如何化为起义…他谈到血腥的镇压，谈到他们是如何与沦为土匪的同僚们分道扬镳的，在华北戒严的当下，曾经的同僚因遭到群众唾弃而遭到绞杀，而他们这支队伍却吸收了一次次抗税运动的新血，因而生生不息…伴着摇曳的火光，他们谈到深夜，在最后，首领从怀中掏本印刷劣质的红皮薄书，递到青年手中——\n\n“你是读书人，算弟兄们求求你，能不能给俺讲讲这书讲了些啥？”\n\n书的名字是《论持久战》，作者他并不认识。但相比于青年常看的著作，这本书写得很白，连对军事一窍不通的青年，也能看个大概。青年边翻书，边给首领转述着上面的内容。而结合自己的经验，首领总能在简单的文本背后读出普适性的军事理论，仿佛他才是学识更渊博的那个……\n\n冬日的黎明总是来得很迟，但它终究来了。透过林间细缝，望着远处缓缓升起的清冷的太阳，青年不禁决定——"
 LFB_GAW_GUI.24.t: "立众"
 LFB_GAW_GUI.31.a: "快速进军，我们必须粉碎他们的痴心妄想！"
 LFB_GAW_GUI.31.d: "长官：\n\n第一批跨过山海关的指战员们发回了最新消息，他们已经正面遭遇了日军的防线。日军似乎并未料想到华北防线会被突破，在东北的设防并不稳固，但鬼子兵们一个个张牙舞爪，抵抗总体来说要比在华北时激烈许多。据侦察兵汇报，伪满洲国的部队已经完成全面动员，日军正在整个东北的乡村坚壁清野，大量日侨正匆忙地撤往朝鲜——我军已踏上日本帝国的心脏，敌人必将动用包括核武器在内的一切手段，全力以赴地试图挽回局面。"
 LFB_GAW_GUI.31.t: "进入东北"
 LFB_GAW_GUI.41.a: "百年海军，道阻且长"
 LFB_GAW_GUI.41.d: "凌晨的港口蒙着一层轻薄的雾霭。平静的海面上漂浮着三艘航船。官兵们神情肃穆地站在岸上，没有礼炮，也没有欢呼，中国人民海军就在这一片灰色中正式成立了\n\n刘昌毅站在一处荒弃船台地高出，身边是几位身经百战的地下党员，还有远东苏维埃派来的海军顾问，他们身上的白色海军军服是临时赶制的，却在海色的映衬下闪着耀眼的白。\n\n“同志们，我们赢得了胜利。我们欢庆党的成功，民族的解放，国家的独立。我们从祖国的江山上赶跑了日本人，彻底地洗刷了百年来的耻辱。但是在这胜利之中，我们更需要惊醒：我们的国家落后，所以才饱受欺辱；我们的军队落后，为了打败日本人，我们要用肉身去博人家的飞机和坦克；而我们的海军呢？我们没有海军，所以祖国的海疆洞开，敌人能封锁我们，困死我们，从我们意想不到的地方发起进攻。而我们只能缩进内陆，躲进山里，和敌人在自己的国土上绞杀，这就是一片狼藉，生灵涂炭啊……”\n\n说到此处，他顿了一顿，将自己的衬衣解开，露出一道道触目惊心的伤疤：哪怕是再坚毅的战士，也不禁倒吸一口冷气。\n\n“这么多道疤，得有一半都是在天津被那鬼子的军舰给炸的。他们的船看着吓人，有的插满了炮管，像刺猬一样，更有的像座小岛，能在上面开飞机。就凭这些东西，他们把半个天津炸成了废墟。当时我就在想，咱们这哪是在进攻啊，鬼子直接把要塞和机场开到了家门口……”\n\n“放心吧首长，改天咱们就能把战舰开到东京去！”不知哪位年轻的战士在下面打趣。\n\n“看把你能的！”刘昌毅指向身后的三艘舰船：“就凭这几艘老船，不行。他们顶多算小炮楼，跟鬼子建村子里那种似的，可没法跟人家硬碰硬，只能护着海疆。但也不是说就没法打，咱们不老是讲这个‘农村包围城市’，鬼子要是再来，咱们就给他们点颜色看看，啥叫‘小炮楼围大要塞’……”"
 LFB_GAW_GUI.41.t: "且看那大海"
 LFB_GAW_GUI.42.a: "漆黑中，有人点亮了小餐馆的灯。"
 LFB_GAW_GUI.42.d: "汉城郊外曾经有一家小餐馆，老板的手艺很好，价格也便宜，饱受邻里街坊的欢迎。\n\n“那家店啊，我小时候经常去吃。”遥指着街边荒芜破落的餐馆，青年说道：“但是，老板不知道从什么时候起就消失了。” \n\n“是吗，还真可惜。”发问的老人得到了令他满意的回答，转身向那家餐馆走去。\n\n他站在门口，用手抚摸着破旧的门锁，然后从口袋里拿出了许久未用过的钥匙。门锁虽然生锈，但是依然忠实地履行着职责。在赶走了占据房屋的老鼠之后，老人把门锁好，把窗户闭起来，拿出了第二把钥匙，用来开地下室的钥匙。\n\n二十年前，这个明面上的餐馆曾是朝鲜共产党情报网的一部分，当时日本联合舰队在太平洋战争上逐渐陷于被动，无数意识形态迥异的组织为了夺取新生国家的领导权，在全国各地设立了大大小小的情报站，此处便曾是其中之一。\n\n当年的老人无比坚信，韩国获得自由的日子很快将到来。\n\n然后夏威夷就湮灭在了核子火焰当中。一开始，没人愿意相信日本人就能凭此获得胜利，但是旧金山协议的签署掐灭了最后一丝希望。往后的岁月，复国无望。\n\n撤退的那天非常狼狈，他只销毁了重要的文件和电台，甚至没有时间销毁挂在墙上的独立标语。这么多年了，他从来没回来过。\n\n现在看来，他可能是多虑了，因为那个标语还好端端地挂在那里\n\n饥饿者寻食，渴饮者求水，我韩人争自由。\n\n这句话写下已经有五十年了，韩国依然在日本的统治之下。\n\n而现在，日军撤回了鸭绿江以南。在战败的阴云笼罩之下，言论管制必以往更甚，汉城内外一片死寂。但这并非希望的终结——日占朝鲜表面的静默之下，实则暗流涌动。日本的“东亚新秩序”已经彻底地被撼动了，而北部边境上的异动更是只增不减。在自己新盟友的支持下，一度式微的抵抗死灰复燃，而这次，他们不会退缩。"
 LFB_GAW_GUI.42.t: "故土"
 LFB_GAW_GUI.9.a: "中国，统一而不可分割！"
 LFB_GAW_GUI.9.d: "或许是因为我方在二次抗日战争中的惊人表现，在经过几轮漫长的谈判之后，西藏当局在玉树宣布：西藏将以自治区的形式回归我国统治。\n自此，中国大陆上最后一个受日本影响的区域得到了解放。"
 LFB_GAW_GUI.9.t: "和平解放西藏！"
 LFB_GAW_STATUS: "西部暴动的结果"
 LFB_IF_COX_TIB_WAR_tt: "§R我们将会在一个月后向西藏发起进攻！§!"
 LFB_IF_PRC.101.a: "旧时代的龙，再也不能兴风作浪了。"
 LFB_IF_PRC.101.d: "李木匠坐在自家门槛上，用磨得发亮的刨子修整着一块木料。刨花卷曲着落下，像时间的碎屑。他的大半辈子，都活在龙的阴影下。\n\n那条龙，人们曾叫它“青天白日”，叫它“国民政府”。它曾是希望，是驱逐满清、缔造共和的英雄。但很快，它变成了别的东西。它变成了四大家族的金库，变成了保甲长的勒索，变成了兵匪不分的抓丁，变成了抗日时节节败退的借口，最后，变成了与同胞兵戎相见的冷酷机器。\n\n它盘踞在这片土地上，太久了。它的鳞片是苛捐杂税，它的爪牙是特务和宪兵。它承诺给人民一个国家，却只给了他们一个不断更换主人的枷锁。\n\n先是日本人来了，龙被打断了脊梁，却还死死缠在地上。然后，红色的火焰从北方烧来，和这条衰老而顽固的龙缠斗在一起。李木匠的儿子，就在那场最后的战斗中，再也没回来。\n\n如今，枪声彻底停了。报纸上说，“反动派”的最后据点被攻克，那条苍龙终于被彻底捆缚，咽下了最后一口气。\n\n李木匠抬起头，看向远方。天，还是那片天，但似乎更清明了些。街上走着穿着统一灰色制服的干部，他们说话的方式很直接，很有力，虽然有时让人听不太懂，但他们的眼神里没有龙的贪婪。这个国家，终于不再被那条衰老、腐朽的巨龙所撕扯。\n\n龙死了。它的骸骨将化为新世界的基石。这或许是好事。\n\n李木匠低下头，继续刨着他的木头。新的房子需要梁柱，新的学校需要桌椅。生活要继续，国家要重建。在龙的尸体上，他们要建起一个属于“人民”的世界。\n\n他不知道这个新世界会是什么样子，但他知道，它必须，也必然会和旧的不同。"
 LFB_IF_PRC.101.t: "龙骸之上"
 LFB_IF_PRC.1644.a: "母亲，归期到了，快领我们回来！"
 LFB_IF_PRC.1644.b: "虚与委蛇，令人发指……"
 LFB_IF_PRC.1644.c: "昔日的三极之一已难掩颓势。"
 LFB_IF_PRC.1644.desc: "中日战争结束后，双方围绕着满洲问题在谈判中进行了多轮拉锯。最终，满洲西部的大片地区被划为了待议领土，由满洲帝室成员溥杰为首的重建委员会负责该地区行政。不过战后满洲地区混乱的局势决定了重建委员会根本无力对地方进行有效掌控，西满洲地区事实上已经成为了一片无政府地区。\n\n但近日，一支名为“东北民主联军”的武装力量异军突起，控制了重建委员会驻地承德，并宣称已经在整个西满洲地区建立起了有效的基层政权。据悉，这支武装力量的领导人正是原东北抗日联军的领导人之一。\n\n东京方面措辞严厉地谴责了中国支持武装分子、试图破坏满洲地区稳定的恶劣行径；而北京方面则表示这不过是东北人民追求民主的自发行为，中方支持人民的选择。值得注意的是，新京方面对于此事未发表任何意见，这种态度很可能暗示着满洲政坛目前正处于动荡之中。"
 LFB_IF_PRC.1644.t: "[Get_newspaper_header]西满洲剧变"
 LFB_IF_PRC.1917.a: "我们的伟大友谊万岁！"
 LFB_IF_PRC.1917.desc: "亲爱的主席同志：\n\n请允许我对你们在战胜日本帝国主义者中付出的巨大努力致以崇高的敬意，中国人民的英雄主义和自我牺牲的精神最终铸就了对日帝国主义的伟大胜利，而这一成就极大的鼓舞了世界各地的被压迫人民，我们对此向你们表示衷心的感谢。\n\n我们的现在的境遇也和不久之前的你们一样，在我们解放全国的道路上充满了各种困难。在这种情况下，我们的人民一度对将来与纳粹主义者的决战充满忧虑。但现在，你们证明了帝国主义者绝非不可战胜，世界上从来都没有无敌的军队，过去的成吉思汗和拿破仑是这样，现在的日本军队也是这样，将来的纳粹军队亦将会是这样。\n\n尽管我们目前的遭遇是痛苦的，我们与纳粹主义者的斗争是一场力量对比极其悬殊的斗争，但中国人民的斗争为我们提供了一个良好的榜样，我们也将如你们一般尽一切力量争取独立与自由。你们的胜利就是我们的胜利，日帝国主义者遭受的失败也将是纳粹主义者遭受的失败。\n\n同时，苏维埃社会主义共和国联盟真诚希望实现我们两国的共同利益，并不顾敌视这种关系的帝国主义势力的反抗，使我们之间的友谊建立在不可动摇的基础之上。我们深信，苏维埃社会主义共和国联盟和中华人民共和国一定能团结起来，迫使帝国主义者放弃破坏中苏两国关系与远东地区稳定、将我们逐个击破的妄想。\n\n让我们在为全世界无产阶级共同利益而进行的伟大斗争中更紧密地联合我们的队伍。中国劳动农民万岁！中国工人万岁！苏、中两国无产阶级联盟万岁！\n\n我们怀着最真诚的愿望祝中国无产阶级兴盛与自由，也祝愿我的中国朋友们健康幸福。\n\n                                                 苏维埃社会主义共和国联盟外交人民委员\n                                                                             李德"
 LFB_IF_PRC.1917.t: "致中国同志的一封信"
 LFB_IF_PRC.1977.a: "以革命的名义，锻造他们。"
 LFB_IF_PRC.1977.d: "政委张海平站在一群年轻的士兵面前，他们的脸庞还带着田埂上的泥土气息和城市的迷茫。他们是新中国的第一代士兵。他们的父辈，曾在不同的旗帜下作战——有些是八路军，有些是国军，有些甚至是被强征的伪军。他们带着旧时代的仇恨、习惯和伤疤。\n\n而张海平的任务，就是将这一切从他们身上彻底剥离，然后将他们重新锻造成一种全新的、坚不可摧的物质。\n\n“你们以为你们手里拿的是什么？”他的声音不大，却像鞭子一样抽打在每个人的耳膜上，“是烧火棍吗？是你们从地主家抢来的锄头吗？错！”\n\n他走到一个因紧张而发抖的年轻士兵面前，拿起他的步枪。\n\n“这是阶级斗争的工具！这是无产阶级专政的铁拳！它的准星，瞄准的不是某个具体的人，而是剥削、是压迫、是帝国主义和一切反动派！”\n\n他放下枪，目光扫过整个队列。\n\n“你们当中，有的人的父亲是国军，被我们击败了。很好！那证明了旧军队的腐朽和反动！你们要做的，不是继承他们的失败，而是从他们的失败中吸取教训，站到人民的一边！”\n\n“有的人的哥哥是八路，在抗日时牺牲了。很好！那证明了我们这支军队的荣耀与传承！你们要做的，就是继承他的遗志，将革命进行到底！”\n\n“忘掉你们是哪里人，忘掉你们的出身！在这里，你们只有一个身份——人民解放军战士！你们的信仰只有一个——共产主义！你们的敌人只有一个——所有试图阻碍人民获得解放的势力！”\n\n张海平的声音在空旷的训练场上回响。他不是在训练一群士兵如何开枪，他是在一个巨大的熔炉边，用意识形态的铁锤，将一块块成分复杂的生铁，反复捶打，淬火，直到它们变成坚硬、纯粹、标准划一的钢。\n\n这支军队，将不会再有派系、山头和私心。它将成为一把指向未来的、赤红色的利剑。"
 LFB_IF_PRC.1977.t: "熔炉与铁砧"
 LFB_IF_PRC.1978.a: "……先处理完下一份吧。"
 LFB_IF_PRC.1978.d: "南京的深夜，寂静无声。\n\n毛岸英揉了揉酸痛的太阳穴，试图从堆积如山的报告中抬起头来。胜利的喜悦早已褪去，只剩下无尽的、冰冷的现实。他觉得自己不像一个国家的领袖，更像一个濒临破产的作坊主，绝望地翻看着永远也还不清的账单。\n\n一份报告来自河南：春旱已经持续了两个月，数百万人的口粮告急。地方干部请求中央紧急调粮，但国库里的小米，连下个月首都的配给都不够。\n\n另一份来自东北：刚刚从废墟中恢复的钢厂再次停产。那里的设备大多是日本人留下的，图纸和备用零件都找不到，现在全凭着几个经验丰富的老工人在勉力维持。一份报告称，高炉的技术数据已经丢失，再强行开工可能会导致毁灭性的事故。\n\n第三份来自福建沿海：内务部的同志们送来了一份长长的名单，上面全是潜伏下来的国民党特务和他们联系的地方宗族势力。报告的结尾用血红的墨水写着：“若不施以雷霆手段，东南沿海恐生巨变。”但“雷霆手段”意味着什么？又一场清洗？又一次流血？\n\n还有来自甘肃的电报，说那里的铁路修了一半就停了。当地的干部和工程队就路线规划问题产生了严重分歧，一方认为应优先连接贫困地区，另一方则坚持要先打通资源产区，双方都引用着语录指责对方是“唯心主义”和“官僚主义”，工程已经停滞了数周。\n\n……\n\n每一份报告都是一个正在流血的伤口。每一份报告都需要一个决定，一个方案，一笔他根本拿不出来的资金。他打赢了日本人，又打赢了国民党，他以为最艰难的部分已经过去了。但他错了。消灭一个旧世界，远比建设一个新世界要简单。\n\n他靠在椅背上，闭上了眼睛。窗外，是四亿五千万嗷嗷待哺的人民。桌上，是这个国家数不清的沉疴与顽疾。他感觉自己被压得喘不过气来。\n\n这条路，到底要怎么走下去？"
 LFB_IF_PRC.1978.t: "无尽的报告"
 LFB_IF_PRC.7.a: "“叫你尝尝人民的铁拳！”"
 LFB_IF_PRC.7.desc: "在车上颠簸了一整天后，罗卫华和他的战友们——一个专门抽调来的步兵营终于来到了贵台镇，广西十万大山中的一个普通城镇。\n\n营长先去了当地人武部了解情况，各连连长则吆喝着同志们把武器装备卸下车来，罗卫华和班长老李抬下一条板条箱，箱子上“七六式单兵火箭筒”字样清晰可见。\n\n“这筒子可是好东西，打解放战争的时候，打工事，拔碉堡贼好用”老李摩挲着板条箱上的文字，“那会还是北边的苏联同志援助过来的，叫什么……RPG，现在我们也能自己造啦……嘿嘿，到时候要那群山匪好看！”罗卫华放下板条箱，直起腰望了望不远处的贵台镇，镇子并不热闹，门店开得不多，送葬的队伍冒着细雨在土路上行进。“这贵台镇怎么没点生气呢……”罗卫华正自己嘀咕着，老李却自顾自的接过了话：“这山匪窝在山里边，时不时地就下山抢钱抢粮，有时候还要抢女人上山去，末了还杀人，哪个地方经得起这么糟蹋！”\n“那为什么地方的驻军……”\n“你是说想要地方的驻军来剿匪？地方的同志们还得保卫关键地方生产呐！这群山匪胆子大了是真敢进攻城市的！要是地方的同志顾得过来中央也不会调我们来了……”老李突然自顾自的气愤起来，“妈的这群山匪，就知道欺软怕硬打劫老百姓，要叫我碰见……”“砰”地一声，他的拳头猛然砸在板条箱上：“你看我用不用火箭筒把你们送上天！”"
 LFB_IF_PRC.7.t: "涤瑕荡垢"
 LFB_IF_PRC.918.a: "白雪之下，黑土之中，沉眠的种子即将发芽。"
 LFB_IF_PRC.918.desc: "在两股伟力的激烈碰撞下，草原东部洒满了鲜血，隆冬时节，西伯利亚的信风送来厚雪，埋葬了未及时收敛的尸体，还有一切誓言，荣耀，与人世间的重要之物。而后春日降临，繁华更胜往日的草甸间缀满了繁花，若有人踏青驻足，便会理所应当的为这和平之景赞叹。但在此时此地，并无人有此闲心逸志——受尽压迫与战乱折磨的人们正想法设法地跨越边境，他们拖家带口，越过危险的无人区——虽然硝烟已经散尽，但草甸间仍潜藏着大量地雷与未爆弹。\n\n人们冒着生命危险也要离开的原因，便是因为此时西东北混乱的时局。虽然这片地区名义上是中国和满洲之间的争议领土，但仍在各方面与旧满洲国有着千丝万缕的联系。而在某些层面而言，反倒是“青出于蓝”——作为一片非军事化的地区，地方政府根本无法对各地施行有效的控制，以致六十年代一度被压制的匪患再度猖獗。故此，几近沦为无法之地的西满洲，就这样以澎湃的动力向西方输出着难民潮。\n\n元气大伤的日本帝国乐见西满洲忠实地履行着“缓冲区”的职能，并未过多地干涉此地的混乱，而这反倒给了新生的人民政府可乘之机。踏着薄草甸，一支游击队正逆着人潮行进，各异的制服，疲惫的神色，汇成一条铅色的涓流，汩汩向东。作为旧日“匪患”的一部分，他们有着一个更响亮的名字——“东北抗联”。如今解放军受条约所限无法直接进入争议地区，只能转而暗中支持已经销声匿迹许久的东北抗日武装。他们背负着夺回故土的责任，奋战在解放的最前线，与各色匪帮战斗，与日本帝国的肮脏汉奸代理人战斗……"
 LFB_IF_PRC.918.t: "雪消时节"
 LFB_IF_start_tt: "我们将会进入紧急战备状态，获得额外的生产单位与正面修正！"
 LFB_IF_TIB_peace_tt: "§G西藏回归了祖国的怀抱。§!"
 LFB_NC_MEN_mid: "§Y正枕戈待旦，厉兵秣马§!，足以在革命爆发后向伪蒙政权发动凌厉的攻势。"
 LFB_NC_MEN_strong: "§G为即将到来的革命做出了万全准备§!，他们将会摧枯拉朽地给予伪蒙政权沉重打击。"
 LFB_NC_MEN_tt: "我们将能够通过决议支持§V蒙古革命§!！\n蒙古的革命者们将会视时机发动§V革命§!，在草原上§G牵制敌军§!，但他们的力量§R不足以直接参与第二次抗日战争§!。"
 LFB_NC_MEN_weak: "§R尚未从战败的阴影中走出§!，倘若革命现在爆发，他们仓促组建的部队将难以有效对抗伪蒙政权。"
 LFB_RGOC.1.a: "中国人不感谢陈公博。"
 LFB_RGOC.1.desc: "（占位）陈公博对于自己“鞠躬尽瘁”（大嘘）却换来这种结局愤愤不平，那群刁民不知道自己为他们做了多少努力，那群狗一样的同僚也只会幸灾乐祸，明明天灾是无可避免的，为什么要把问题怪罪到他头上？他妈的，难道你周佛海来就能干的更好？他蒋介石来就能干的更好？还骂他“赤匪”，赤匪来也不会比老子干的更好！（没点逼数了这人）陈公博越想越气，最后只能把问题归结于中国人的劣根性，不懂得感恩的民族配不上他这种伟人。（经典不找自己的问题）"
 LFB_RGOC.1.t: "黯然退场"
 LFB_RGOC.1001.a: "又一个王朝的气数将尽……"
 LFB_RGOC.1001.b: "善后救济部的人都滚去哪了？"
 LFB_RGOC.1001.desc: "尽管大多数专家的分析预测都表明，连日来华北海河流域的暴雨很可能会引发大范围的水灾，但没人预料到这场灾难的规模会如此之大：天津近乎成为汪洋，冀中与冀南的绝大多数城镇更是完全与外界失联，仅可统计的死伤人数就已逼近十万。甚至有渔民声称自己在海面上看到了成片的尸体和垃圾，少数胆敢进入灾区的记者更是传回了一幅幅如同地狱般的景象。\n\n被寄予厚望的当地水利系统在洪水面前不堪一击，纷纷决堤或倒塌，令舆论指责南京当局的失职造成了大量不必要的损失。随着洪水逐渐消退，当地基础设施近乎完全被毁，大量村庄被夷为平地，数千万人流离失所，无家可归。也许，本就摇摇欲坠的南京改组派政府很快将要面临又一场滔天巨浪。"
 LFB_RGOC.1001.t: "[Get_newspaper_header]海河大洪水"
 LFB_RGOC.1002.a: "此所谓奉命于危难之间。"
 LFB_RGOC.1002.b: "不过是换了个傀儡登台唱戏。"
 LFB_RGOC.1002.desc: "40年代末汪精卫死后，时任改组政府立法院长的陈公博成功击败了诸多觊觎者，登上总统宝座。然而，自50年代其颁布一系列社会改革法令以来，反对与质疑之声就从未断绝：一些人认为他的改革收效甚微，另一些人则接称其为“赤匪”。虽然得益于改组派在党内的扎实地位，陈公博得以顶住两方面的压力暂居总统大位。然而，频频发生的自然灾害一次次沉重地打击了改组派，而当局救灾不力、劳民伤财，致使民怨沸腾、党内震怒。63年这场破坏力空前的大洪水更是成为了压垮骆驼的最后一根稻草，在多方声讨下，陈公博最终选择引咎辞职，结束了他饱受争议的总统生涯。\n\n依据宪法，总统大任自然就落到了副总统赵尊岳手中。虽然外界对其人知之甚少，但可以肯定的是，无论他接下来有什么打算，第一步必定是处理前任留下的烂摊子。"
 LFB_RGOC.1002.t: "[Get_newspaper_header]陈公博引咎辞职"
 LFB_RGOC.1003.a: "履新易，治国难。"
 LFB_RGOC.1003.b: "他真以为自己是勾践？"
 LFB_RGOC.1003.desc: "陈公博总统黯然辞职后，海内外均翘首以待何人可居总统宝座。而今日尘埃落定，国民大会选举高宗武接任总统一职，消息一出，朝野哗然。\n\n高宗武，素来无强大派系为依托，于党内亦行止低调，乃至一度被视作“边缘人”。然政事之妙，出乎常理。据前特高课高官私下透露，此番安排，实为党内诸派博弈后所达成之一种“无害妥协”。\n\n然而，无人知晓风平浪静的表象能维系几时。高氏虽荣登总统之位，其能否驾驭国内大势、调和党内诸般分歧、提振中国之国运？其所谓“五个现代化”的愿景又能否化作现实？一切仍有待时间检验。"
 LFB_RGOC.1003.t: "[Get_newspaper_header]中国政坛风云暂歇"
 LFB_RGOC.2.a: "此即为妥协的艺术。"
 LFB_RGOC.2.desc: "（反正玩家看不到不写了，大致就是牢高对自己被推出来非常惊讶，三更半夜睡不着）"
 LFB_RGOC.2.t: "荣登大宝"
 LFB_SEA_Myanmar.1001.a: "国民党的军队？他们和南京是什么关系？"
 LFB_SEA_Myanmar.1001.desc: "据前线消息，一支身份不明的华人武装突然出现在缅北地区，打着\"国民革命军\"的旗号，迅速对政府军发起攻势，突破缅军防线，一度逼近仰光郊区，并与当地多支游击队形成配合，导致政府军节节败退。然而，几天后战事突然平息，这支武装似乎悄然撤离，去向不明。  \n\n该武装的背景和意图尚不明确，而更令人疑惑的是，缅甸政府至今未对此事作出任何公开回应，既未谴责，也未采取军事行动。外界担忧，若北部冲突持续升级，缅甸可能陷入更大规模的动荡，现有秩序或将面临严峻挑战。"
 LFB_SEA_Myanmar.1001.t: "[Get_newspaper_header]缅北暴乱"
 LFB_SEA_Myanmar.1002.a: "缅甸的麻烦。"
 LFB_SEA_Myanmar.1002.desc: "今晨，缅甸总统府发生重大刺杀事件。昂山总统与国防部长波木昂被发现在办公室内身亡，现场有明显打斗痕迹。初步调查显示，行凶者可能来自极端民族主义组织\"爱国党\"下属武装力量。\n\n\"爱国党\"长期与昂山政府对立，其领导人吴素自40年代起就与昂山存在政治恩怨。该党推崇排外政策，主张民族纯粹性，其纲领被指模仿欧洲法西斯政党，多次引发国际社会批评。  \n\n尽管尚无直接证据表明吴素下令行刺，但分析人士指出，此次事件与近期北部叛乱存在关联。总统与防长同时遇害导致缅甸权力核心真空，军政系统陷入瘫痪，目前缅甸全国各界保持沉默。  政治观察家表示：\"缅甸政局的稳定基石已被击碎，其未来局势可能彻底失控。\""
 LFB_SEA_Myanmar.1002.t: "[Get_newspaper_header]昂山遇刺"
 LFB_SEA_Myanmar.1003.a: "好机会，快叫南方局的同志接电话！"
 LFB_SEA_Myanmar.1003.b: "又一个国家殒于战火。"
 LFB_SEA_Myanmar.1003.desc: "昂山的殒命为这个早已四分五裂的国家再添了一把火；而现在矛盾已经再也掩盖不住了——据前线报道称，缅甸各处早已再次陷入战乱之中。各地土邦与军阀政客你方唱罢我登场，纷纷想在这片土地上谋得一份利益。我们虽无从得知哪个政治势力将再度统治缅甸，但我们可以唯一得知的是：这一次，新宪法和缅军或许再也无法保护缅甸了。"
 LFB_SEA_Myanmar.1003.t: "[Get_newspaper_header]缅甸内战"
 LFB_SocIntern_status: "共产国际"
 LFBCG.111.a: "这片大海，终将属于我们。"
 LFBCG.111.d: "黄海的海风带着一股咸腥的铁锈味。\n\n年轻的水兵李文清靠在“海兴”号巡逻舰的栏杆上，这艘船比他父亲的年纪都大，是联合政府从汪伪海军那里接收过来的遗产之一。船身布满了修补的痕迹，引擎在脚下发出有气无力的呻吟，仿佛一个濒死老人的喘息。\n\n“又来了，”身旁的老兵，前国民党海军的一名士官，吐掉了嘴里的烟头，下巴朝远处的海平线扬了扬。\n\n李文清顺着他指的方向望去。一支小型的日本舰队正在那里大摇大摆地驶过，护卫着几艘满载的货轮。它们没有悬挂海军旗，但那流线型的船身和高耸的雷达，无一不在嘲笑着“海兴”号的落后与笨拙。那些船，正航行在中国的领海之内。\n\n“他们甚至懒得绕远路了，”老兵的声音里没有愤怒，只有一种深入骨髓的疲惫，“我们发了信号，要求他们表明身份并离开。他们回复说，这是‘自由航行’。”\n\n自由航行。多么刺耳的词。李文清的拳头不自觉地握紧了。他们打赢了战争，把日本人从陆地上赶了出去，从头到尾付出了几千万人的生命。可在这片大海上，他们什么也不是。这片本应属于中国的海洋，依旧是日本人的后院游泳池。他们可以随意进出，运输着从东南亚掠夺来的橡胶和石油，而新中国的海军——这些拼凑起来的、锈迹斑斑的古董——只能在一旁看着。\n\n这感觉，就像你把一个强盗赶出了家门，却发现他每天依旧大摇大摆地在你家院子里散步，而你手里只有一根无力的木棍。\n\n“长官，”李文清的声音有些颤抖，“我们……我们不能做点什么吗？开炮警告？”\n\n老兵转过头，看了他一眼：“用什么？用我们这门连炮弹都不齐的老古董吗？孩子，别犯傻。我们赢得了陆地，但我们从未拥有海洋。”"
 LFBCG.111.t: "有海无防"
 LFBCG.114.a: "愿风，能温柔一些。"
 LFBCG.114.d: "王师傅是一个拉洋车的，他的一生都在这座城市的街巷里度过。他见过清朝的辫子，见过民国的旗帜，见过日本人的太阳旗，如今，他又见到了两种旗帜——一种红，一种蓝——同时挂在政府大楼前。\n\n对他来说，主义和政治都太过遥远。他只知道，街上的日本兵不见了，这是一件天大的好事。他也知道，他的生意并没有好起来。城市里到处是复员的士兵，他们和王师傅一样，空着肚子。\n\n他拉着车，经过曾经的银行区。那里，穿着西装的先生们进进出出，脸上挂着和日本人还在时一样的、精明的焦虑。他又拉着车，经过新开的“工人文化宫”，门口挂着巨大的领袖画像，穿着灰色制服的年轻人高唱着他听不懂的歌曲，歌声里充满了力量，也充满了不容置疑的命令。\n\n这个国家就像他坐下的洋车，两个轮子被强行安在了一起，一个想往东，一个想往西，全靠他这个车夫在中间拼了命地维持平衡，才不至于当场散架。每一步都走得摇摇晃晃，吱嘎作响。\n\n傍晚，收了车，他看到自己的小孙子正在瓦砾堆旁放一个纸鸢。那纸鸢是他用旧报纸和竹条糊的，歪歪扭扭，却在风中努力地向上攀升。\n\n王师傅停下脚步，抬头望去。那小小的纸鸢，在广阔而阴沉的天空下，显得如此脆弱。一阵微风就能让它飞得更高，一阵狂风也能将它瞬间撕碎。它就像这个新生的国家，承载着所有人的希望，却又在看不见的风中摇摇欲坠。\n\n它能飞多久？它能飞多高？\n\n没人知道答案。但只要它还在天上，就总归是好的。"
 LFBCG.114.t: "风中的祈愿"
 LFBCG.123.a: "一个久违的黎明。"
 LFBCG.123.d: "老张头已经不记得，自己有多久没有像今天这样，真真正正地“逛”过街了。\n\n二十多年了，从他还是个小伙计开始，出门就是一种煎熬。你必须习惯低着头走路，习惯在看到日本兵的巡逻队时，那深入骨髓的、条件反射般的鞠躬。你必须习惯街角那个伪政府警察局楼顶上，那面刺眼的、代表着耻辱的旗帜。你必须习惯，这座城市不属于你。\n\n但今天，一切都不同了。\n\n他像往常一样，清晨时分踱出家门。阳光和往常一样，透过梧桐树叶洒下斑驳的光影。可老张头觉得，空气本身似乎都换了味道。\n\n他下意识地抬头，看向街角那栋楼。旗杆是空的。那面让他恶心了二十年的旗帜不见了。他愣在原地，看了足足一分钟，才确信自己没有眼花。\n\n他继续往前走。原本属于日本宪兵队的营房门口，现在站着两个年轻的士兵。一个穿着朴素的灰色军装，另一个穿着合身的黄绿色制服，他们有些尴尬地站在一起，但他们的脸，是中国人的脸。他们没有要求路人鞠躬，只是静静地站着岗。\n\n路过熟悉的茶馆，他没有听见里面传来几个日本商人高声的笑骂，而是听到了几位老茶客用南京本地方言，肆无忌惮地讨论着联合政府的报纸。声音很大，充满了生气，没有丝毫的压抑和恐惧。\n\n老张头在街口停了下来，深深地吸了一口气。这口气里，没有了恐惧的味道。他终于可以挺直腰板，用自己的眼睛，去看属于自己的城市。\n\n国土重光。原来，就是这种感觉。"
 LFBCG.123.t: "南京的清晨"
 LFBCG.1644.a: "母亲，归期到了，快领我们回来！"
 LFBCG.1644.b: "虚与委蛇，令人发指……"
 LFBCG.1644.c: "昔日的三极之一已难掩颓势。"
 LFBCG.1644.desc: "中日战争结束后，双方围绕着满洲问题在谈判中进行了多轮拉锯。最终，满洲西部的大片地区被划为了待议领土，由满洲帝室成员溥杰为首的重建委员会负责该地区行政。不过战后满洲地区混乱的局势决定了重建委员会根本无力对地方进行有效掌控，西满洲地区事实上已经成为了一片无政府地区。\n\n但正是这种局势给予了满洲地区的地下抵抗势力可乘之机，尽管早在二战结束前满洲地区的抵抗运动就已经近乎销声匿迹，但事实证明，反抗的火种从未熄灭。近日，一支名为“东北人民自治军”的武装力量夺取了重建委员会驻地承德后宣称已经掌控了整个西满洲地区，并迅速与中国方面展开接触。据悉，这支武装力量的前身即为二战时期活跃于满洲地区的东北抗日联军。\n\n东京方面对于满洲局势反应异常激烈，认为中方有意支持武装分子颠覆满洲政权，试图重启战端；而南京方面则表示目前的局面不过是民心所向，中方的行为完全出于对东北人民自由选择的尊重，绝对无意破坏来之不易的东亚和平。"
 LFBCG.1644.t: "[Get_newspaper_header]西满洲剧变"
 LFBCG.8.a: "“不知要扯皮到几时。”"
 LFBCG.8.desc: "青天白日旗与镰刀锤子旗在主席台上方形成微妙的夹角，夹角下是今天会议的轮值主席。周恩来环视会场，一屋子的代表着装各异，互相交谈着，也许是在交流今天的议案，也可能是下次的选举，或者单纯只是在交谈今天午餐的去处。到了开会时间，周恩来也只能请大家先安静，随后宣布今天的会议开始。\n\n第一项是关于南京的战后重建项目，周恩来在主席台上聆听着陈述，时不时做一些记录。但代表刚刚结束陈述走下台，台下的一名议员就大声提出了自己的疑问“南京现在的战后损害都已经修缮得差不多了，怎么还要另外拨资金去‘重建’？该把重建的精力放在其他地方了吧？西安的工厂之前在鬼子的轰炸下破坏惨重，到现在都还因为资金不足，修复工作断断续续的！”周恩来认得他，陕南地区地下党出身。此时的他从自己席上站起来，对着大会的众人大声地阐述着重建西安地区工业的重要性，与昔日身为地下工作者的时的表现大相径庭。\n\n“南京是国家首都，重建好有什么不可？！”很快，有人同样大声打断了他的发言，是一个商人出身的代表，“国家现在是急需对外放引进外资的时候，把首都重建好才能展现我们的精神风貌，这可比重建西安工厂有益得多！闷头重建内地，你上哪弄钱去！”此言一出，代表们的话匣子纷纷被打开了，也全然不顾了会场秩序，各自开始激烈的表达意见……\n\n不出意外，最后代表们也没有达成共识，议案只能搁置。散会后，周恩来回到自己的办公室，对着桌前自己拟的“完善国民议会开会流程”的议案，揉了揉眉头。"
 LFBCG.8.t: "“百家争鸣”"
 LFBCG.918.a: "白雪之下，黑土之中，沉眠的种子即将发芽。"
 LFBCG.918.desc: "在两股伟力的激烈碰撞下，草原东部洒满了鲜血，隆冬时节，西伯利亚的信风送来厚雪，埋葬了未及时收敛的尸体，还有一切誓言，荣耀，与人世间的重要之物。而后春日降临，繁华更胜往日的草甸间缀满了繁花，若有人踏青驻足，便会理所应当的为这和平之景赞叹。但在此时此地，并无人有此闲心逸志——受尽压迫与战乱折磨的人们正想法设法地跨越边境，他们拖家带口，越过危险的无人区——虽然硝烟已经散尽，但草甸间仍潜藏着大量地雷与未爆弹。\n\n人们冒着生命危险也要离开的原因，便是因为此时西东北混乱的时局。虽然这片地区名义上是中国和满洲之间的争议领土，但仍在各方面与旧满洲国有着千丝万缕的联系。而在某些层面而言，反倒是“青出于蓝”——作为一片非军事化的地区，地方政府根本无法对各地施行有效的控制，以致六十年代一度被压制的匪患再度猖獗。故此，几近沦为无法之地的西满洲，就这样以澎湃的动力向西方输出着难民潮。\n\n元气大伤的日本帝国乐见西满洲忠实地履行着“缓冲区”的职能，并未过多地干涉此地的混乱，这反倒给了新生的中国政府可乘之机。在白山黑水之间，一支游击队正轻巧地穿行，作为旧日“匪患”的一部分，他们有着一个更响亮的名字——“东北抗联”。受条约所限，新生的共和国无法直接派兵进入争议地带。因此，在经过谨慎的政治考量后，他们决定转而支持由在东北游击多年的朝鲜族抗联将领金日成，凭借他多年的游击经验组织起一支新的武装，与各地匪帮和日帝国主义的代理人战斗。"
 LFBCG.918.t: "雪消时节"
 LFBNN_tt_7: "与§z国民党§!§F的不和意味着第二次内战的爆发已经在倒计时。而这一战，将会决定中国的§x命§!§z运§!。"
 LFBNN.1.a: "“难不成他真的百战百胜？” "
 LFBNN.1.desc: "尽管南京仍然是破碎的，但是中国已是完整的。\n“国破山河在。”\n毛岸英这样想道。不免陷入沉思，默默在心里规划起未来南京城的建设。\n一旁的秘书陈宽用声音打断了他的思绪：“主席同志，前面就到了。”\n中共代表团在南京的第一站，是梅花山上的中山陵\n按护国军那边的说法，在这里见面是护国军的礼物。是对于中国红军在北方战胜日本军队的肯定。\n随着汽车到达会场，国民党，护国军，西南局还有南京当地的各界要人全都在这里。熙熙攘攘的人群都想见一见这位名满中国的将军。\n毛岸英熟练地走下汽车，向人群挥手致意，人群也向他挥手，脱帽，甚至有人欢呼，高喊着他的名字。\n“毛先生，我们可都是望眼欲穿了！”\n来接他的人正是国民党的一号人物，孙科，这位七十多岁的老人步伐还是很平稳。\n“抱歉啊孙先生，飞机不是很平稳，我还是更喜欢在陆地上奔波。”\n“毛先生，不要担心！你来的路上不平，中国的前路不一定不平啊！”\n说完，孙科握住毛岸英的手，提醒他面向镜头：“看这边，这张照片是要上美国时代杂志的。”\n咔嚓，咔嚓咔嚓。毛岸英还不是很习惯这种场景，但是他会习惯的。\n台上的毛岸英依然穿着那一身军装，摘下帽子向人群致意。人群再一次像之前那样，爆发出掌声和欢呼声。\n“不是，为喃样（为什么）大家都制份（这么）喜欢他呢？。”一个护国军宪兵正在询问他的同伴：“你讲嘎，他再拽能有龙大帅拽咯？”\n同伴说：“你不认字吃亏了嘛，制个（这个）大帅是从新疆一路打到北平克呢，我是天天看报纸呢嘎。”"
 LFBNN.1.t: "南京谈判（一）"
 LFBNN.2.a: "真叫人头疼。"
 LFBNN.2.desc: "“移交除西北以外的全部解放区？还要裁军至十二个师？贵方不觉得这种条件有些苛刻吗？” \n国立中央大学一向是很安静的，但很显然今天不是。\n“毛先生不要太诧异。”蒋经国注视着毛岸英的眼睛说道：“贵军早在一九三七年就已经归入我军编制，而我军对于下辖部队进行整编也是正常的。”\n“好，那么请问，为什么我方要交出所有解放区？中央政府可没给我们拨过一分钱，也没有发过一条枪。”\n“但贵方也没有给中央缴过一分税，更何况，中央要求接收原敌占区恢复秩序是完全合理的，我方又没有索求贵方经营已久西北地区。”\n毛岸英此时怒火中烧：“蒋先生，您是在否定我方上下军民的努力吗？”\n蒋经国摊开手，故作可惜的样子说：“很抱歉啊毛先生，战争已经结束了，我们不是在开论功行赏大会，我们在决定中国的命运。”\n此时的毛岸英已是怒不可遏，正要发作时，蒋经国突然大声念起了中华民国宪法：“中华民国宪法总纲第一章第四条： 中华民国领土依其固有之疆域，非经国民大会之决议，不得变更之！早前贵党另立政府，本就是分裂国土之罪。念在抗战有功，暂时不予处罚。将来之中国，必为统一三民主义之中国。如若不将军队统一于国民政府军事委员会之下，国事统一于国民大会之中，将来之中国必将再次陷入国难。”\n讲完这些，蒋经国将半个身子探到谈判桌上，说：“希望阁下三思。”\n不等毛岸英反应，一旁的秘书陈宽突然抢过话头：“主席远道而来，今日能参与仪事已属不易。望蒋先生尽地主之谊，先使我等暂且歇息，诸多要事，明日再议。”"
 LFBNN.2.t: "南京谈判（二）"
 LFBNN.3.a: "“就算最差的结果，也不过是兵戎相见。”"
 LFBNN.3.desc: "夜晚，毛岸英和秘书陈宽离开了他们下榻的房间，前往宾馆的会议室，和中共代表团的其他人碰头。\n来到会议室，李先念，警卫员和周恩来早已在那里等候：“已经排查过了，没有监听，大家可以畅所欲言。”警卫员报告完之后就出去了。\n毛岸英首先坐到了长桌的正座上，然后把他的帽子摘了下来，放到桌子上。眼睛直直地盯着桌子，一副斗败的公鸡的样子。\n周李二人看到他这副样子，也不敢出声，只能默默坐到附近的座位上去。\n沉默半晌，毛岸英长叹一声，说：“我搞外交，还是太年轻了。昨天孙科给我喂足了糖衣炮弹，让我放松警惕，以为谈判会很顺利。谁知道蒋经国又给我一个下马威。”\n“至少你坚持了不交地，不交枪，想想上一次妥协的后果，你做出了正确的决定。”\n李先念点点头，毕竟党的老成员都亲身经历过妥协的后果。\n”不过话说回来，一开始谈判就开如此大的价码，确实不常见。一般这种情况，只有两种可能，要么他们压根就不想谈，要么就是吓唬人。”\n毛岸英听到两位老人的分析，又把帽子戴回到了头上。\n他说：“我们目前的条件是暂时保留苏区和红军，先组织起国民大会，联合政府，完成军队国家化以后，再交出苏区的行政。”\n“是啊，到时候军权不在任何一党的手里，也不会有清党的事件发生了。”\n“还有我们土改的结果，必须要保留。”\n”是的，我进城的时候，看到有人打白色土改的标语。这是要学习印度的经验，如果白色土改成功施行，恐怕我们之前的努力都会白费。”\n“就这样吧，只要坚持底线，走一步看一步也没问题。”\n说完，毛岸英起身，回去休息。"
 LFBNN.3.t: "南京谈判（三）"
 LFBNN.4.a: "“除此之外，我方还有一个问题。”"
 LFBNN.4.desc: "第二轮谈判的气氛明显不太一样。\n蒋经国一改之前的咄咄逼人，变得畏缩起来，他的眼神不敢看向毛岸英，显得浑身不自在。\n国民党代表团的其他人也显得垂头丧气，很难想象是什么让一个五十多岁的老将像个小孩一样。\n就在中共代表团不解之时，那位举止端庄的女士来到了谈判桌前，这不是她第一次干预政事，但是可能是最后一次。\n她的到来，令在场的所有人肃然起敬，在在世的所有革命遗老中，没有人比宋庆龄更有权威，更有影响力。早在蒋介石统治的时期，她就曾保护过无数人的性命。\n“诸位先生，我今天来这里，是为了保障中国的未来。这本来是我们这一代该做的事情，但是事情总有意外，现在，责任落到了你们的身上。”\n说完，宋庆龄把头转向共产党一方，微笑道：“毛先生，昨天的要求并不符合中共对中国的贡献。因此，我希望…”她又把头转向国民党那一方，“谈判能在互相尊重的情况下进行。”\n蒋经国刻意躲避了宋庆龄的目光，在确认了宋庆龄不再望向他之后，再把头转了回去，正对着毛岸英。\n“咳，毛先生，对于之前开出的条件，我方也认为有所不妥。为表诚意，我们同意贵方暂时维持对东北和华北原敌占区的控制，在日后组建省政府时，贵方控制地区的省主席可由贵党指定。其次，红军要进行一定的缩编，大概五分之一的红军要复员，毕竟战争结束了，国民革命军和护国军也会复员的。最后，因国内百废待兴，国民大会延迟召开，待祸乱戡平，再行宪政。”\n说完，蒋经国点了点头，示意他的发言已经结束了。\n“多谢蒋先生的提案，但是我方还有一个问题，平均地权是国父的遗愿，请问贵方对此有何见教？”\n“陈宽先生，关于这个问题，我们打算学习印度土地改革的经验，比如限制过多土地的持有，减少农民的地租以及减少地主乡绅对于乡村的影响。我们认为贵党的土改过于暴力，有太多不必要的纠纷。啊，当然了，贵方已经完成土地改革的地区，我们可以既往不咎。”"
 LFBNN.4.t: "南京谈判（四）"
 LFBNN.5.a: "“这些条款可以接受。”"
 LFBNN.5.b: "“你在糊弄我们吗？”"
 LFBNN.5.desc: "“除此之外，我方还有一个问题。据我方的上报，最近我多地解放区遭遇贵方小股部队骚扰，爆发了一些冲突。譬如昨夜，我陕西解放区小河口村遭到国民革命军的袭击。村中的党支部和村政府干部遭到杀害。在会谈期间发生这样的事，请问阁下怎么解释?”\n“有这种事情?请您等一下，我马上核实。”\n半晌，蒋经国的秘书才回来，两人耳语几句之后，秘书又匆匆地走了。\n“诸位，我蒋某人不怕大家笑话，实际上，自从我南京政府统一中国之后。国民革命军便成了一盘散沙，不复当年北伐之勇。家父在时尚可节制。如今国民革命军名义上统一。实则部分编制早已在这几十年间割据一方，如青海，川西，还有我兄长的。此疾一时间难以根除。经我排查，昨夜确有一个驻地在小河口附近的排缺勤，排长目前正在被关禁闭。”\n“这就是蒋先生对此的解释？中国境内的日本战俘尚未遣送完毕！就干出同室操戈的事情来！如果贵方的军队缺乏纪律，我们不介意帮助你们训练一下他们。“\n“毛先生，请您冷静，我已经下令将那名排长军法从事，我相信在军队彻底国家化之后，这些问题都会迎刃而解的。”\n\n说完这些，蒋经国再次把头转回毛岸英那里，看着他说：“那么，毛先生是否满意我们的提案？”\n所有人都在等待他的回答。"
 LFBNN.5.t: "南京谈判（五）"
 LFBNN.61.a: "“我在做梦吗？…这真的可能吗？”"
 LFBNN.61.desc: "“这些条款可以接受。”被冰封的会场又融化了，蒋经国笑得像考了满分的学生，他激动地站了起来，把上半身往毛岸英那边探了过去。\n“毛先生，我代表中国国民党感谢您对中国的未来做出的贡献。”\n而毛岸英也站了起来，同蒋经国握了握手。\n“蒋先生，我代表中国共产党接受你的好意。”\n“那么接下来，我们来讨论下细则…”\n晚上，彻底敲定协定内容的国共双方在南京老正兴饭店设宴，请各界人士来见证中国的新生。\n“诸位，今天的宴会，首先是为了庆祝国共和谈顺利，中华民国重生。其次，也是为了欢送毛先生即将离开我们回到共统区。等到国民大会召开之后，则中华民国再度走上正轨！”\n\n蒋经国说完，台下的人无不鼓掌，他们的脸上溢满了笑容。是啊，蒋经国向他们承诺了最宝贵的东西，那就是一个充满希望的未来。\n“接下来，我们让毛先生讲两句，大家欢迎！”\n掌声停息后，毛岸英开始了他的临别讲话：\n“多谢南京的父老乡亲们。今天我和蒋先生谈了很多，最后得到这样双方都能满意的协定实在是不容易。现在中国抗日战争业已胜利结束，中国重建的新阶段即将开始，必须共同努力以和平民主团结统一为基础，国共长期合作，坚决避免内战，建设独立自由和富强的新中国。这种精神，这种理想，都是值得赞扬的。国共仍将在互信互让之基础上继续商谈，求得圆满解决。”"
 LFBNN.61.t: "南京谈判（六）"
 LFBNN.62.a: "谈判失败了，对吧？"
 LFBNN.62.desc: "“你在糊弄我们吗？”\n毛岸英这一言让全场的气氛又冷了下来。\n\n“你们的条文与其说是让步，不如说是糊弄我们！请问你明白了吗？”\n蒋经国涨红了脸，争辩道：“毛先生，这已经是我们给出的最大让步，复员和行政上的安排都是合理的，不会对贵方的安全造成任何影响。希望您不要得陇望蜀。”\n“蒋先生，在我们党的内部，其实是有很多人反对和谈的。毕竟我们从未忘记第一次国共合作的失败。如果我带着您给出的条件回去，那到时候做决定的恐怕就不是我了。蒋先生，届时的中国将再次陷入战火。”\n\n“毛先生，这是我方能给予的最惠条件。如果这样的条件您都不同意，那我也没什么好说的了。”\n“蒋先生，我无法独断，这样的结果我方无法接受。”\n蒋经国叹了口气，打开了另一份文件：“那么让我们讨论一下另一些事项，比如说汉奸惩治问题…”\n晚上，讨论过了汉奸惩治内容的国共双方在南京老正兴饭店设宴。\n“诸位，今天的宴会，首先是为了庆祝国共和谈顺利进行，其次，也是毛先生的欢送宴。”\n蒋经国说完，台下的人无不鼓掌。\n“接下来，我们让毛先生讲两句，大家欢迎！”\n掌声停息后，毛岸英开始了他的临别讲话：\n“多谢南京的父老乡亲们。今天我和蒋先生谈了很多，现在中国抗日战争业已胜利结束，中国的新阶段即将开始，必须以统一为基础，各界人士共同努力，国共长期合作，这种精神，这种理想，都是值得赞扬的。国共仍将继续商谈，力求求得圆满解决。”"
 LFBNN.62.t: "南京谈判（六）"
 LFBNN.7.a: "这一次，我们不会再重蹈四一二的覆辙。"
 LFBNN.7.desc: "飞机慢慢降落在乌鲁木齐的跑道上，没有人来迎接它。毛岸英如常来到他在乌鲁木齐的办公室，而屋里屋外都是忙来忙去的人，很少人注意到他回来了，就算是那些注意到的人，也只是敬个礼，问声好。因为他们没有时间关心他一路上的趣事。\n简单审理了这几天的公务后。他换了便服，来到乌鲁木齐政府大楼的门口的台阶上，点燃了一支烟。\n看着眼前人来人往的大街，毛岸英能感觉到欣慰。\n但是他真的有能力保护好眼前的一切吗？\n还是说，他已经错失了命运给他安排好的机会，注定走到毁灭的道路上去呢？\n如果是父亲面临同样的问题，他也会做出同样的选择吧。\n正在他思考的时候，一声惊雷打破了他的思绪，随后下起了大雨。乌鲁木齐是不经常下雨的，但是这一次下得很大。\n倾盆的大雨让街上的商贩匆匆盖住刚刚还在售卖的瓜果，街上的行人也赶紧找好躲雨的地方。人群中，一位五十多岁的大爷看到毛岸英在抽烟，就想过来蹭一根。\n“兄弟，有烟吗？”\n毛岸英盯着他，在确认了他看起来没有恶意之后，拿了一根烟给他，还把打火机也递了过去。\n“没事，我自己有。”\n身上有火而不带烟，一看就是经常蹭烟的人。\n“你看看这雨，下个没完，真糟心，”那人指指面前的大雨：“一下大雨就什么也干不了，咱们也没有办法。”\n“怎么会没有办法呢？”毛岸英摇摇头：“如果是不得不做的事情，就打伞穿雨衣去做，再大的雨也要做好，如果没有要紧的事，还可以读书看报，充实自己。再说了，狂风暴雨不过是一时的，太阳总会出来的。”\n说完，毛岸英起身离开，到大楼里找到了他的秘书。\n“陈宽，通知军事委员会，我十分钟后要过去。”"
 LFBNN.7.t: "山雨已来"
 LFBNNsub.1.a: "难道天上真的会掉馅饼？"
 LFBNNsub.1.desc: "老赵！嘿嘿嘿，好久不见，自从咱们光复武汉之后就分开了…\n对对对，我是那个国民革命军的，害，多久不见了，你怎么还是连长，我都当上团长了。\n打完仗你要去做什么？回家种地？兄弟，你是我见过的最有能力的护国军军官。当时那一群高宗武的狗汉奸冲上来的时候，你临危不惧呀！不光有勇气，在那种情况下的指挥也井井有条。还有那次你在湖南动员农民的时候，三言两句就把他们说得热血澎湃…我知道你没读过书，没读过书都这样，读了书那还了得！\n像你这样的人在国军里太难找了。像你这样的人，就应该继续保卫中国，回去种地实在是太可惜了。\n我跟你说，你要是到我们这边来，起码能当团长，甚至旅长！你放心吧，我能给你保证。是，现在日本人走了，很多人要复员了，但是你可不能回家，你想想，种地一年到头才几个钱？你还没娶媳妇吧，你家老太太，老太爷还得靠你养活，是吧？你到我们这边来，保你吃香的喝辣的，到时候高头大马，衣锦还乡，多威风！也让家里人看看你出息的样！ 共党？共党能给你几个钱？他们穷得要死，哪像咱们一样？是，是，我也听说他们的纪律好，但是光纪律好有啥用啊？他们和咱们不一样！都不让兵抢东西，长不了！\n谢我？欸你谢什么，这是你应得的。那就说好了，明天来一趟我们国军的这个办事处，就在陈纳德路二十一号。要不要我派车接一下？不用？好，好，明天在那见吧！"
 LFBNNsub.1.t: "十五从军征（一）"
 LFBNNsub.2.a: "又要换一个新团长了。"
 LFBNNsub.2.desc: "老赵已经就任团长有三个月了，他从来没有过这样舒服的日子。美食，美酒和柔软的床，起初，这一切都让一个老兵感到不安。繁重的公务在哪呢？自己真的有权力享受这一切吗？当他还是护国军的时候，他的连曾经光复武汉，当时武汉的市民夹道欢迎他们，还有人向他们敬礼。老赵怀念那种感觉，那一种受人簇拥，能感觉到人们真心喜欢他的感觉，而不是现在这种空虚的，被虚荣填满的感觉。\n咚咚咚，有人在敲门，应该是老冯来了，当初就是他把自己推荐到国军的。\n要不就算了，这个活真的干不了。\n打开办公室的门，来人军装笔挺，气宇不凡。\n“您好，我是赵天佑团长，您来找谁？”\n“赵团长是吧，我接到可靠举报，称你有倾向共党的嫌疑，想让您跟我去一趟军统。”\n“什么？您听谁说的？这怎么可能呢，我一个共党都不认识啊。”\n“您如果认识，我就不会这么礼貌了。跟我走一趟吧，清者自清。 啊，对，你的那个老朋友，他也在军统等你…”"
 LFBNNsub.2.t: "十五从军征（二）"
 LFBNNsub.3.a: "“可惜我无法亲眼见到了。”"
 LFBNNsub.3.desc: "中国的拯救者，蔡锷将军的精神继承人，此时正躺在他的卧室里。\n滴答，滴答…墙上的钟表不断发出声音。仿佛在提醒龙云的大限将至。\n即使是在监狱里，龙云也从来也没这么虚弱过，从前他的精神是自由的，而肉体被囚禁。现在他的肉体可以去到中国的每一个角落，而精神却被禁锢在这老去的躯壳中。\n“或许我早就该死了，只是老天爷可怜我，让我做完了事情再死。”龙云喃喃道。\n以前的自己，又怎么会想到能到今天这般地位呢？\n龙云想起自己刚刚成为云南王的时候，想起来他发动政变赶唐继尧下台，想起他从云南讲武堂毕业，想起他第一次杀人的那一天。\n\n最后龙云的思绪回到那一天下午，两个六岁的孩子，他自己和卢汉，被武术师傅折磨得腰酸背疼，但还是倔强地坚持练功。现在回想起来，那天的天气很热，那天的天空很蓝。\n“我真的原谅卢汉了吗？”他问自己。\n“都到这份上了，也没有什么原谅不原谅的，就当是原谅我自己吧。”\n回首自己这一生，也算是一个传奇了。\n\n“还有中国的土地还没有回来，唉，我做的也够多了。”\n听说，国民党和共产党又在谈判了，希望这一次不会是历史开的玩笑。\n不知道以后的中国会是什么样子…\n一定是一个民主统一的中国吧…\n\n希望以后的中国…永远自由…\n滴答，滴答，时间依然在流逝。"
 LFBNNsub.3.t: "垂死病中"
 LFBNNsub.4.a: "小河口消失在了地图上。"
 LFBNNsub.4.desc: "陕西小河口村的居民们正在庆祝抗战的胜利，这是他们的村长王有禄组织的。\n自从红军从傅作义手里接管这个村子，进行土改之后，以往嚣张跋扈的地主就逃离了这里。\n批斗地主的时候，王有禄是第一个站起来的。他细数赵地主一家犯下的种种罪过，将农民们遭受的不公列成目录。在他的带头下，其他的村民也加入了对赵家的批斗。\n最后大家签了新的地契，拿回了属于他们的那块地，也给老赵家留下了一块不错的耕地。毕竟乡里乡亲，谁也不想把对方往死里逼。\n土改后来的某一天，赵地主带着他藏匿的财产和全家老小跑到县城去了。\n村里的人害怕他去县城搬救兵，结果赵地主都走了好几个月了。地长草了，房子也破了，于是村里人开始把他的地也一并种了。\n这样的日子过了很久，直到庆祝抗战胜利的这一夜，布满星星的夜空被子弹打破。\n“砰！砰！砰！”三声枪响过去，大家停下手中的事情，看向枪声的来源。\n原来是几十年前，那个赵家的二儿子回来了。\n他的身后还跟着国民革命军新编的一整个排。他们手中的火把，背后的步枪令人生畏。\n“乡亲们！好久不见啊！我赵某人离开小河口已经几十年了。现在，已经当上了国民革命军的排长！出息了！回来看看大家！”他讲着讨喜的话，脸上的表情却不讨喜。\n没有人敢回答他，除了几个妇女叫自己的孩子赶紧回家里躲着以外，没人敢出声。\n王有禄看了看四周，决定像之前一样再次站出来。\n“赵家二小子，你们家老爷子和大小子还好吧？”\n只见赵二一枪把王有禄打倒在地，彻底撕下了伪装。赵二手下的兵也把枪口对准了小河口的村民。\n“他妈的王有禄！老子最恨的就是你！”赵二走到王有禄身边，一边咒骂，一边用脚踢向王有禄的身体。“当年共产党分我们家的地！你就是他们第一个带头的！你怎么这么该死！我们赵家从陕西跑到重庆，又从重庆跑到西安！我爹前几个月就死了！要不是靠我大哥上下打点，能在国民党谋个一官半职！我也得死！”\n对着王有禄补了数枪过后，赵二又看向他的士兵。\n“所有和共产党有关系的人！ 一个不留！”"
 LFBNNsub.4.t: "“衣锦还乡”"
 LFBNNsub.5.a: "冥冥之中自有天数。"
 LFBNNsub.5.desc: "南京，两位国民党的大员正在一个秘密的地方交换他们对于会谈的情报。如果提前选对了风向，那么步步高升将不再是梦想。如果内战真的打响，也可以提前转移家眷家资，免受战火。\n“国华，据你那边打听的，会谈还顺利吗？”\n\n“道渊，我这边还没听到什么决定性的新闻。咱们先等等吧。”\n“真的假的？我听说会场里有人大喊大叫的声音。都这样的还能谈下去？”\n“要对这些政治家有信心，道渊。他们啊，上一秒大发雷霆，下一秒就能嬉皮笑脸。这些事情，你以前在军法处那边不知道，我作为前委员长的秘书可是很了解。”\n“好好好，如果蒋建丰还当权的话，你应该能得到重用。但是现在掌权的人变了。蒋副总统以前是在军队的，这次党内各派将他和孙科总统妥协出来，也是念及两位前人的旧情，但是我党日后命运如何，就不好说了。”\n“你们那边，现在是什么态度？”\n“很他妈糟糕。大部分人蠢蠢欲动，他们相信共产党从始至终都是苏俄的傀儡，搞笑，现在哪还有苏俄。”\n“如果这么说，毛岸英确实是苏联回来的。”\n“所以我们这边倾向于立刻发动内战，彻底将全中国置于国民政府的统治。”\n“真疯狂，日本人现在是百足之虫，虽死不僵。如果打内战，谁知道要打多久！以后五十年的中日关系是什么样的，你我都不好说。”\n“你们呢？”\n“我们当然是要趁着这个机会，将国体从训政转为宪政。如果成功，那么我们文官的势力无疑会加强。所以，如果我党与共党不再爆发内战，那当然是最好的。”\n“话是这么说，但是以后究竟会如何呢？”"
 LFBNNsub.5.t: "两个朋友"
