 dihuajieshao_text: "乌鲁木齐——辽阔的牧场——是新疆无可置疑的心脏。这里一度滋养着新疆仅有的轻重工业。但如今，过往的繁华都在盛世才政权的短视中迅速腐败。随着对外贸易渠道的断绝，工厂空有产品却无销路，人民空有纸币却换不到粮食。\n\n新政权必须开展行动，为这颗心脏重新注入血液。"
