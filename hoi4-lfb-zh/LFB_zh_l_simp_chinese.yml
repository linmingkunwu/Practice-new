 COX_Develop_New_Party_Members_From_The_Local: "新鲜血液"
 COX_Develop_New_Party_Members_From_The_Local_desc: "土改的胜利让我们党在新疆真正意义上站稳了脚跟。然而，与新疆广袤的土地与众多的少数民族百姓相比，我们的党员不仅人数稀少，而且大多是来自东部或者新疆大城市的汉族人。少数民族百姓对汉族党员们并没有什么意见，但是真要做到广泛的深入群众，在党员规模不足的情况下，习惯、语言甚至面容的隔阂无疑雪上加霜。所幸，在土改时期我们就已经建立了众多培养当地党员及干部的党校和各种理论班，团组织也在各地广泛吸收有志为共产主义事业奋斗终身的青年。有了这些后备力量，党组织真正“接地气”是时间问题。"
 COX_dihua_gaiming_wulumuqi: "将迪化改名为乌鲁木齐"
 COX_Dihua_Reorganize: "乌鲁木齐改编"
 COX_Dihua_Reorganize_desc: "旧军阀部队的打散重编工作接近完成，冥顽不化的兵痞被干脆利落地扫地出门，新指挥员也陆续到位，我们终于可以自豪地声称，残存的反动要素被我们彻底清算，这些曾经的散兵游勇已经被改造为了有组织有纪律的新军队。虽然对他们思想的改造还要持续一段时间，但这只是时间问题。今天上午，毛岸英同志代表新疆根据地在乌鲁木齐授予了他们新的番号，勉励他们努力训练，为保卫革命根据地而英勇斗争。此后，这些部队将与中国旅并肩作战，我们的根据地又多了一层牢靠的保障。"
 COX_dispatching_vanguard: "派遣前锋部队"
 COX_dispatching_vanguard_tt: "红军力量增加§G15§!"
 COX_dispersed_production: "离散生产"
 COX_dispersed_production_desc: "在绝对的空权劣势面前，集中在大型城镇的工业区无异于敌方轰炸机的活靶子。利用后方幅员辽阔、战略纵深广大的优势，把大型工厂拆解，将车间机床分散搬迁至荒漠、峡谷甚至是偏远的村落之中。"
 COX_Dissension: "秤砣之争"
 COX_Dissension_desc: "当前的政治格局已经形成了一个微妙的平衡。国共两党在议会中势均力敌，任何一方都无法单独掌控局面。\n\n仿佛一杆两端都摆满了筹码的天平，这不是静态的，而是双方锱铁必较的结果。\n\n我们的党和其他任何政党一样，力图为自己争得政治上的统治。但也必须承认，经过烽火连天的岁月，和平统一才是群众和社会的希翼。不过这并不意味着共产党人会坐以待毙，我们将争取各民主党派，动用规则内的一切手段，以争取在己方一侧加上一枚秤砣。\n\n这是一场无声的冲突，它不在战场上进行，而在人事任免的名单里，在深夜签署的法令中，在对某项预算的拨款额度上。我们的每一次胜利，都让天平向着革命的终点滑近一寸；对方的每一次阻挠，都让中国那模糊不清的未来延长了一天。\n\n中国的命运，就在这枚秤砣的来回滑动中，摇摆不定。目前，它奇迹般地维持着平衡。但所有人都知道，这只是暂时的。"
 COX_division: "割裂的经济状况"
 COX_division_desc: "国共双方的控制区，在合并前就施行着截然相反的经济制度。合并后，统一经济制度政令虽已经下达，但收效甚微：北部已经完成土地改革的区域拒绝无谓的转型，而南部或是只进行了浮于表面的土地分配，或是完成了“白色土改”。\n\n出现这种现象的政权主体，§Y往往很难被冠以“国家”的名号……§!"
