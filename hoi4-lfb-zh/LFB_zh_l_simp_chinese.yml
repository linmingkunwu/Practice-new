 COX_Liberate_Shaanxi_desc: "\n\n\n\n\n\n§R春回大地，惊雷阵阵！§!护国军坚定的步伐宣告了全民族抗战的再度爆发，§G西北军民§!万众一心，终于将帝国的疯狗逐出了兰州。\n\n放眼东去，当今的§j日本帝国§!，正不计代价地拱卫着华北地区——其在中原地区的§j统治核心§!。为此，它不惜悍然入侵晋系军阀，将那里的秩序撕个粉碎。如今，山西省已被划入华北军管区，大量日军入驻此处，征召民夫，修筑工事，而陕西省则被弃之不顾，沦为“群盗四起”的混乱之地。\n\n但在所谓的“匪盗”中，我们惊喜的发现了同志的身影。在陕北的黄沙峭壁间，仍有§e扛着红旗的战士屹立至今§!。在我们做好与日本爆发全面冲突的准备前，我们可以对他们送出力所能及的援助，以协助他们重夺§G中国革命的圣地§!。"
 COX_Liberate_Shaanxi_pro_left_1_tt: "当前红军对陕西的占领程度为[?Shaanxi_occupied_index|R%%0]，每周将增长1%+0.1*红军力量"
 COX_Liberate_Shaanxi_pro_right_1_tt: "当前红军力量为[?Shaanxi_strength_index|B%%0]，每周减2%"
 COX_Liberate_Shaanxi_pro_tt: "傅作义加入护国军倒计时"
 COX_Liberate_The_Serf: "铲除农奴制遗毒"
 COX_Liberate_The_Serf_desc: "农奴制在新疆普遍存在，在这种制度下，农奴主占据了大片庄园，依靠农奴的无偿劳动供自己享乐。在耕种地主的土地时，农奴经常消极怠工，而另一方面，他们自己的土地也因为各种问题而导致歉收。这导致了新疆的人民总是处于饥饿之中。我们必须更进一步，废除这种严重落后的制度。农奴将得到人身自由，以及足够耕种的土地。"
 COX_Liberate_The_Serf_tt: "§GActivate§! reform: §Y【Thoroughly Investigate Private Punishments】【Abolish Personal Dependence】【Organize Peasant Associations】§!"
 COX_Liberation_of_Lanzhou: "解放兰州"
 COX_Liberation_of_Lanzhou_countdown: "机不可失…"
 COX_Liberation_of_Lanzhou_countdown_desc: "护国军在西南的战术胜利打乱了日军的阵脚，驻扎兰州的西北方面军开始紧急调动。这产生了一个稍纵即逝的机会，我们必须尽快做好准备，发动进攻。"
 COX_Liberation_of_Lanzhou_desc: "\n\n\n§C起来，不愿做奴隶的人们！§!当西南的护国军冲进长沙的城门之时，§e日寇§!便已不得不凝神谛听中华民族追求自由的怒吼。\n可以预见的是，日寇即将对中华大地掀起一场血腥的，旷日持久的战争，在这种情况下，唯有§D整个中华民族§!的联合才能御敌求自由。现在便是向日寇宣战的最佳时机，尽管我们在第一次夺取兰州时遭遇了挫折，但同时也取得了一定成果：日军在我们的打击之下被迫收缩，兰州城外四处活跃着§C抗日游击队§!。为了全中华民族的自由，我们将第一次与§w武装到牙齿§!的日军正面对峙。\n如果我们能够夺下兰州，即可有效分散我们的盟友在其他区域的压力，相信§V全中国乃至整个东亚§!一旦联合起来，我们便能够看见§M自由的曙光。§!"
 COX_Liberation_of_Lanzhou_progressbar_1: "当前渗透进度为[?Lanzhou_infiltration_index|B%%0]"
 COX_Liberation_of_Lanzhou_progressbar_2: "当前整合进度为[?Lanzhou_integration_index|R%%0]，每周会自然增长2%"
 COX_Liberation_of_Lanzhou_war_timer: "…时不再来"
 COX_Liberation_of_Lanzhou_war_timer_desc: "就在红军开进兰州的同时，西北军也在执行着他们的撤退计划。如果我们未能在一定时间内将他们切断，就会彻底失去这一歼灭敌军一大主力的机会。"
 COX_Light_The_Fire: "把炉火烧得通红！"
 COX_Light_The_Fire_desc: "19世纪以来，工业生产对于战争的重要性不言自明。此时的西北仍没有成体系的工业，我们能做的只有充分利用好手头的一切资源。为数不多的生产线将迁至山间，在西北崇山峻岭的庇佑下，它们将免遭敌人的破坏。工人们将被组织起来，投入战时生产。钢铁与木材，硫磺与硝石，数目虽不大，但将源源不断的涌入产线。经过不间断的生产线，它们最终将汇入抗日的铁流，化作射向敌人心脏的子弹！"
 COX_Links_With_Central_Asia: "探索中亚群山"
 COX_Links_With_Central_Asia_desc: "黑云压境，苏维埃边区必须寻找信得过的盟友。然而边区东临旭日、南隔高原，只有中西伯利亚与中亚值得一试。经过权衡，苏维埃最终选择向中亚抛出橄榄枝。中亚国家大多是前苏联加盟国，一方面治理水平相对较高，另一方面中亚有许多苏联遗产，这对新疆的民生大有用处。"
 COX_Literacy_Campaign: "扫盲识字运动"
 COX_Literacy_Campaign_desc: "我们成功地在西北掀起了一场广泛的革命，动员百万人加入到我们的队伍当中，但当苏区转入建设途中的当下，根据地低下的文化水平必将越来越多的成为我们发展的掣肘。如果干部大字不识一个，我们怎能建立初步的工业基础？如果广大人民仍旧愚昧落后，我们怎能逐步消除宗教对他们的荼毒？扫盲运动迫在眉睫，我们应当以提高文化为首要任务，定要使苏区变成一个巨大的学校。"
 COX_Liu_Shaoqi_2_eco_desc: "§Y财政部长\n£COX_XBJ_text §x中国共产党§!籍\n“新民主主义实干家”§!\n--------------\n作为共产党西北局资历最老的党员之一，在他漫长的人生中，刘少奇没有一刻不在思索该如何在中国——这个落后的半殖民地半封建国家建成社会主义。\n\n在这个农民占人口90%以上的庞大国家，问题的症结显然在农业。从毛泽东的“新民主主义”理论出发，结合苏联的社会主义建设经验与西北土地改革的实践，刘少奇最终总结出了一套经济理论——即在新民主主义的旗帜下，继续团结民族资产阶级和小资产阶级，发展和巩固作为主体的市场经济，以集中力量在农村进行立刻、完全的土地改革，消灭地主阶级的经济土壤，将广大农民从人身依附中解放出来，进而解放农村生产力的同时，为工业化创造条件。\n\n虽然在党内，这套理论被一些声音批评为“向资产阶级妥协的修正主义”，但在全国各地，它引起了许多偏左翼分子的广泛共鸣。沿着新民主主义的康庄大道，必能实现全国农村面貌的焕然一新！"
 COX_Liu_Shaoqi_3_eco_desc: "§Y财政部长\n新民主主义§!\n--------------\n"
 COX_Liu_Shaoqi_eco_desc: "§Y经济部长§!\n§Y新民主主义§!\n------------\n§L在最低谷处为革命找寻生机，在最绝望的时候为全民族觅得希望，这便是刘少奇坚持至今的，属于共产党人的“党性”。他将自己的青春献给了大革命，将热血挥洒在抗日的战场，而他憔悴的晚年，则为了党的存续穷尽了一切——当战败已经注定之时，党不得不放弃了延安根据地，展开了前往西南的新长征，刘少奇自愿留在延安，维系共产党残破的地下党组织。\n\n陕北的斗争一日比一日艰苦，日军扫荡的压力与日俱增，他们的身前匍匐着汉奸党羽，他们手中拎着禁锢群众的锁链，党越来越无法在陕北辗转腾挪……在最危险的几个年份，党被分割包围在黄河两岸。为了保存火种，刘少奇只能率领残破的党向西北撤退……\n\n共产党的西行相当顺利，在顺利通过了山西与青海的军阀控制区之后，刘少奇幸运地在新疆找到了党组织。尽管盛世才政府愿意给共产党提供一席之地，但刘少奇很清楚军阀们首鼠两端的做派，所以当不可避免的背叛到来时，共产党已经做足了准备，最大程度地减少了损失。\n\n刘少奇经历过党最黑暗的时光，竭尽全力地拯救了危难中的党，这在他性格中留下了不可磨灭的印记。比起积极地发动群众，他更相信缜密的谋划与情报的运用，尽管采用更加实用主义的立场，但没有人能怀疑他对革命的忠诚。§!"
 COX_Logistics_Support: "后勤保障"
 COX_Look_Ahead: "展望新的道路"
 COX_Look_Ahead_desc: "经过了漫长的建设与斗争，新疆落后的封建土地所有制已经废除，水利设施得到了适当的维护，农业收成创下历史新高……\n新疆地区几乎没有任何现代工业设施的窘境。雪上加霜的是，为了向日本帝国掩盖自身的存在，我们几乎没有与任何政权建立直接联系，而工业化所须的技术，必须依靠外界支援才能取得。\n为了解放全国人民，我们必须继续向前——但不是东进，而是望向北方的俄罗斯大地，与同志们取得联系。在平等互惠的社会主义友谊中迈向初步工业化。"
 COX_lose_trust: "土地革命的前进脚步不容停顿。如果我们不能保证总有一项改革措施正在推行，农奴与自耕农将会感到§Y不安§!..."
 COX_Lower_The_Rent_And_Fight_The_Local_Bully: "减租反霸"
 COX_Lower_The_Rent_And_Fight_The_Local_Bully_desc: "虽然在新疆人民所遭受的重重压迫中，沉重的地租只是其中的一种。但根据我们在赣南和陕北的经验来看，农民最不满的就是自己幸苦耕种的成果被别人无偿占去。减租反霸运动可以作为土地革命的突破点。我们可以初步发动起贫下中农，让他们自己为自己征得生活条件的改善，与此同时，公开反抗我们的农业地主与宗教土地持有者也将会被打击，通过这场运动，劳苦大众将会得到第一次教育——认识到自己手中掌握的无穷力量。"
 COX_Lower_The_Rent_And_Fight_The_Local_Bully_tt: "§GActivate§! reform: §Y【Strict Rent Reduction】【Reduce Religious Taxes】§!"
 COX_lr_success_1: "初步土改：失利"
 COX_lr_success_1_desc: "西伯利亚的寒风未能吹散旧世界的腐朽，即便仍自称为“苏维埃共和国”，乌鲁木齐的新政权也要面对土改退潮后的残酷事实——在广大的乡村地区，地主阶级仍牢牢把控着土地，牧场与水源。土改宣告失败，但革命仍存——土改促使许多新进干部加入了革命队伍，他们或许曾被反动分子的暗算与酷刑所伤，因农民们麻木的冷眼而失落，但他们幸存了下来，带着学到的教训与愈加坚定的决心，成了风雨飘摇的革命政权最后的屏障。"
 COX_lr_success_2: "初步土改：焦灼"
 COX_lr_success_2_desc: "西伯利亚的寒风未能吹散旧世界的腐朽，随着阶级斗争的烈火暂息，新政权必须承认一个残酷的事实——土改在一些地区取得了成效，许多村庄建立了革命政权，甚至能组成赤卫队支援别处，但反动派仍控制着广大乡村。新疆的土改并非是能急于求成之事，好在革命政权已站稳了脚跟，并持续积蓄力量——土改促使许多新进干部加入了革命队伍，他们或许曾被反动分子的暗算与酷刑所伤，因农民们麻木的冷眼而失落，但他们幸存了下来，带着学到的教训与愈加坚定的决心，他们将成为下一场更为暴烈的阶级斗争的生力军。 "
 COX_lr_success_3: "初步土改：成功"
 COX_lr_success_3_desc: "西伯利亚的寒风驱散了旧世界的衰朽，新疆的土地改革取得了初步成效，许多村庄建立了革命政权，甚至能组成赤卫队支援别处；许多开明地主也认清了形势，使得仍负隅顽抗的反动力量成为了真正的少数，难以威胁新政权的存续。虽然全国革命的胜利仍将是漫长的斗争，但土改已经为新政权创造了一支生力军——许多新进干部加入了革命队伍，他们熟知反动派的手腕，更通晓将农民群众团结起来的办法。他们是阶级斗争的胜利者，带着学到的教训与愈加坚定的决心，他们将成为全国解放的先驱。"
 COX_lr_success_4: "初步土改：完胜"
 COX_lr_success_4_desc: "西伯利亚的寒风驱散了旧世界的衰朽，新疆的土地改革取得了完全，除了那些最偏远的村庄，一个个革命政权拔地而起，赤卫队捍卫阶级权益的场景随处可见；许多开明地主也认清了形势，极少数仍在抵抗的反动派要么暂且偃旗息鼓，要么就是各自为战，难以威胁新政权的存续。虽然全国革命的胜利仍将是漫长的斗争，但土改已经为新政权创造了一支生力军——许多新进干部加入了革命队伍，他们熟知反动派的手腕，更通晓将农民群众团结起来的办法。他们是阶级斗争的胜利者，带着学到的教训与愈加坚定的决心，他们将成为全国解放的先驱。"
 COX_lr_wc_success_1: "支离破碎的农村水利"
 COX_lr_wc_success_1_desc: "土地改革触及了旧时的水利制度。虽然旧时压榨百姓的不合理用水规章得以尽数废除，水利设本身却在阶级斗争的烈火中变得支离破碎，河道淤塞、渠网破损严重。农民得到了土地，却无法得到足够的水，无疑是给农民们高涨的生产积极性泼了一盆冷水。"
 COX_lr_wc_success_2: "几近荒废的农村水利"
 COX_lr_wc_success_2_desc: "土地改革触及了旧时的水利制度。虽然旧时压榨百姓的不合理用水规章得以尽数废除，水利设本身却因阶级斗争的暴烈与缺乏关注并未得到妥善养护。农民得到了土地，却无法得到足够的水，无疑是给农民们高涨的生产积极性泼了一盆冷水。"
 COX_lr_wc_success_3: "足用的农村水利"
 COX_lr_wc_success_3_desc: "土地改革落地后，当地水利面貌焕然一新。旧时压榨百姓的不合理用水规章尽数废除，盘踞一方欺压民众的水霸势力被彻底肃清。随着各地相继组建了护水队与修渠队，原先陈旧衰败的水利设施得到了修缮。尽管如此，反动派的负隅顽抗仍使得部分水利设施受损，农民得到了土地，却无法得到足够的水，势必会影响未来的农业生产。"
 COX_lr_wc_success_4: "完备的农村水利"
 COX_lr_wc_success_4_desc: "土地改革落地后，当地水利面貌焕然一新。旧时压榨百姓的不合理用水规章尽数废除，盘踞一方欺压民众的水霸势力被彻底肃清。随着各地相继组建了护水队与修渠队，原先陈旧衰败的水利设施得到了充分修缮。如今整个新疆的水资源分配公正均等，更加激发了农民们的生产积极性，为今后的丰收奠定了基础。"
 COX_Maintain_Border_Security: "维护边境治安"
 COX_Maintain_Border_Security_desc: "新疆与青海的边境地区一向是两地政权管辖范围外的灰色地带。许多土匪与山贼盘踞在这里。他们总是趁着农忙季节倾巢出动，袭扰周遭乡村。尽管赤卫队日夜巡逻，但哈密的部分村镇仍遭到过匪贼的突袭与劫掠。\n随着新疆根据地日渐稳固，我们必须集结一支可靠的边防力量，保障农民的劳动成果。"
 COX_Maintain_Communication_Equipment: "通讯设备换新"
 COX_Maintain_Communication_Equipment_desc: "新疆原有的电台不仅稀少，也早已老旧不堪。但是事情有了一些变化：在过去与俄罗斯到蒙古的艰难辗转中，中国旅曾偷偷收缴过来自过去蒙古红军的一整套电台设施……因此，我们也不再需要找其他人购买了。现在，我们将尝试以这台完好的电台为参照，设计属于我们自己的崭新电台设施。通过与布里亚特的技术交流，我们可以重头开始，绘制出可堪一用的电台网络雏形。"
 COX_Maintain_Wartime_Production_Order: "维持战时生产秩序"
 COX_Maintain_Wartime_Production_Order_desc: "生活需要物资，战争更加需要物资。在抗战的热情感染着根据地的同时，我们的一些同志似乎热情过头了，这不仅没能带来效率的提高，反而在一定程度上破坏了生产秩序。这对于战时后勤的损害不可谓不大，我们将采取一些措施维护生产秩序。\n\n除此之外，敌人的渗透同样值得我们重视。并不是所有人都全心全意地投入了全民族抗战之中。毋宁说，对于某些已经被打倒的反动派来说，战争的爆发反倒为他们提供了机遇。他们中的许多本就不在乎发生在千里之外，与自己“毫无关系”的抗战，更有甚者，为了重建他们的腐朽统治，不惜与日寇勾结。对于这种民族的败类，我们必须坚决予以打击。"
 COX_Manage_Refugee: "安置难民"
 COX_Manage_Refugee_desc: "自二十余年前日本帝国主义践踏中国大地开始，有史以来规模最大的人口迁移就开始了。这次大迁徙也使得曾经富饶的中原逐渐沦为一片废墟。数以百万计的民众为了远离日军的枪炮和刺刀，而背井离乡拖家带口，艰难地向西部省份行进。时至今日，仍有许多人在寻找落脚的地方——他们风餐露宿，冒险穿越危险的西北戈壁，直至新疆。\n随着边境管控逐渐改善，我们将增派人手专门负责西迁民众的安置工作。新疆将成为这些受苦同胞新的家园。"
 COX_Manage_The_Arsenal_In_Altay: "检查阿勒泰军火库"
 COX_Manage_The_Arsenal_In_Altay_desc: "坐落于新疆与西蒙边境的阿勒泰并不是一座庞大富庶的城镇，但它对于盛世才及其军政府而言同样具有着举足轻重的意义。迪化当局在此处修建了庞大的阿勒泰军火库，其库存能够辐射数百公里长的边境线，是构建新疆北部防线的核心。为了尽快与我们会合，新疆的起义部队将大量不便携带的重装备存入了这座军火库并进行了急行军，现在军阀部队既然已撤出准噶尔地区，是时候打开大门，看看究竟还有多少好东西没来得及被带走了。"
 COX_Mao_Anying_2_sec_desc: "§Y国防部长\n毛泽东思想§!\n--------------\n"
 COX_Mao_Anying_CR_hog_desc: "§Y中华共和国总统\n£COX_XBJ_text §x中国共产党§!籍\n“壮志终成”§!\n--------------\n革命之子，中华之希望，抗敌的旗手……当他自贝加尔湖踏上悲壮的长征时，他从未想到自己在十年后会获得如此多辉煌的头衔。他更无法料到，仅十年时间，整个亚洲的局面已经天翻地覆，日本帝国在大陆百年的经营于中华民族绝望的怒吼中倾覆，从天山到东海，中国的每一寸土地，无不被激战的鲜血染红，举目四望，每一座城市，人们无不栖居于断壁残垣。中国人民挣脱了帝国主义的锁链，贪婪的大口呼吸久违的自由之时，其佼佼者却在一片萧瑟中望向不确定的未来——毛岸英正是其中之一。\n\n整整一个多世纪，中华民族受尽了苦难，在绵延的战乱中流干了最后一滴血，但这个新生的国家将要面对的净是前所未有的挑战——如何重建家园，安置流民？如何团结如此多的民族？如何调节各自拥有庞大武装的两党间的关系？\n\n尽管毛岸英心中有着对于中国社会主义未来的宏图愿景，但他必须谨小慎微的处理这些棘手难题，尤其是与南京国民政府的关系——在抗战刚结束时，双方尚保持着共同抗敌的情谊，但对于中国的未来，双方似乎有着根本性的分歧，近来，在控制区边境，双方的摩擦迅速升温，擦枪走火时有发生。统一战线绝不能再次分裂！因为日本帝国仍在舔舐伤口，这豺狼正匍匐在新中国门口，虎视狼顾……稍有不慎，过去的梦魇就将再临。"
 COX_Mao_Anying_desc: "毛岸英不仅是中国革命领袖的长子，也是革命的孩子。自出生以来，他就随着父母为了革命事业四处奔波，在8岁时，他的母亲被捕入狱，不久后就牺牲了，他和自己的兄弟被地下党接到上海生活。但上海的地下党组织不久后就被破坏，他们只能流落街头。在这段时间，他当帮工，捡破烂，送报纸，推人力车，虽然环境残酷，但他革命的热情从未被磨灭，反到在旧社会的残酷不断锤炼下愈发坚韧了。\n\n1936年，他前往苏联学习，就在一年后，日军大举侵华，抗日战争爆发。他不知道的是，不久以后，自己就将成为革命的独子。卫国战争爆发后，他自愿进入军校学习，抗击法西斯侵略者，然而战争的发展出乎了所有人的意料，苏维埃联盟就这样被击败了，与国内的联络也随之切断。报纸上有关中国的战况变幻莫测，而越来越多溃退进入远东地区的中国溃军带来了越来越精确的消息——自己的父亲失败了。最后，一位老共产党员给他带来了一封信件，信上潦草的字似乎出自父亲的手笔——“游子莫念还乡。”\n\n牢记父亲的教诲，毛岸英一直没有回到故乡。在从军校毕业后，他为西俄罗斯革命阵线而服役，在经历了西俄战争苦涩的失败与不愉快的政治斗争后，他终于决心离开，向东而去。在旅程的重点——贝加尔湖畔——他的身边逐渐汇集起了一支由中国人组成的军团，这些人有的自十月革命以来就为苏维埃服务，有的是东北抗日联军的溃军，还有些是勉强撤离沦陷区的老工农红军。\n\n随着时间的推移，韶山的青山绿水，上海的外滩窄巷，东北的沃野，黄土的高原从清晰的回忆变为了模糊的映像，故乡的图景模糊了，思乡之情却历久弥新。西伯利亚的季风每年都向南方刮去，离家已久的游子也越发思念故乡。而故乡的山水已经被侵略者占领，故乡的人民正被他们当作牛马使唤。作为中国革命的独子，不能再坐视不管了。"
 COX_Mao_Anying_DRC_hog_desc: "§Y中华民主共和国总统\n£COX_XBJ_text §x中国共产党§!籍\n“壮志终成”§!\n--------------\n革命之子，中华之希望，抗敌的旗手……当他自贝加尔湖踏上悲壮的长征时，他从未想到自己在十年后会获得如此多辉煌的头衔。他更无法料到，仅十年时间，整个亚洲的局面已经天翻地覆，日本帝国在大陆百年的经营于中华民族绝望的怒吼中倾覆，从天山到东海，中国的每一寸土地，无不被激战的鲜血染红，举目四望，每一座城市，人们无不栖居于断壁残垣。中国人民挣脱了帝国主义的锁链，贪婪的大口呼吸久违的自由之时，其佼佼者却在一片萧瑟中望向不确定的未来——毛岸英正是其中之一。\n\n整整一个多世纪，中华民族受尽了苦难，在绵延的战乱中流干了最后一滴血，但这个新生的国家将要面对的净是前所未有的挑战——如何重建家园，安置流民？如何团结如此多的民族？如何调节各自拥有庞大武装的两党间的关系？\n\n尽管毛岸英心中有着对于中国社会主义未来的宏图愿景，但他必须谨小慎微的处理这些棘手难题，尤其是与南京国民政府的关系——在抗战刚结束时，双方尚保持着共同抗敌的情谊，但对于中国的未来，双方似乎有着根本性的分歧，近来，在控制区边境，双方的摩擦迅速升温，擦枪走火时有发生。统一战线绝不能再次分裂！因为日本帝国仍在舔舐伤口，这豺狼正匍匐在新中国门口，虎视狼顾……稍有不慎，过去的梦魇就将再临。"
 COX_Mao_Anying_ROC_hog_desc: "§Y中华民国总统\n£COX_XBJ_text §x中国共产党§!籍\n“壮志终成”§!\n--------------\n革命之子，中华之希望，抗敌的旗手……当他自贝加尔湖踏上悲壮的长征时，他从未想到自己在十年后会获得如此多辉煌的头衔。他更无法料到，仅十年时间，整个亚洲的局面已经天翻地覆，日本帝国在大陆百年的经营于中华民族绝望的怒吼中倾覆，从天山到东海，中国的每一寸土地，无不被激战的鲜血染红，举目四望，每一座城市，人们无不栖居于断壁残垣。中国人民挣脱了帝国主义的锁链，贪婪的大口呼吸久违的自由之时，其佼佼者却在一片萧瑟中望向不确定的未来——毛岸英正是其中之一。\n\n整整一个多世纪，中华民族受尽了苦难，在绵延的战乱中流干了最后一滴血，但这个新生的国家将要面对的净是前所未有的挑战——如何重建家园，安置流民？如何团结如此多的民族？如何调节各自拥有庞大武装的两党间的关系？\n\n尽管毛岸英心中有着对于中国社会主义未来的宏图愿景，但他必须谨小慎微的处理这些棘手难题，尤其是与南京国民政府的关系——在抗战刚结束时，双方尚保持着共同抗敌的情谊，但对于中国的未来，双方似乎有着根本性的分歧，近来，在控制区边境，双方的摩擦迅速升温，擦枪走火时有发生。统一战线绝不能再次分裂！因为日本帝国仍在舔舐伤口，这豺狼正匍匐在新中国门口，虎视狼顾……稍有不慎，过去的梦魇就将再临。"
 COX_March_Towards_Dihua: "向迪化前进！"
 COX_March_Towards_Dihua_desc: "尽管新疆军阀在南京国民政府崩溃后产生的诸多军阀中拥有着面积最大的土地，它实际能控制的面积却相当有限。除去迪化、哈密和吐鲁番等中心城市之外，其余地区的政治情况和多年前的盛世才统治时期相比没有太多的变化，仍然以农奴地主和宗教势力交错控制为主。他们的权力并非来自于军政府，因此也并无维护盛世才统治的打算。只要我们一鼓作气将数个中心城镇拿下，军政府的崩溃便只是时间问题。\n\n§R战士们，擦亮钢枪，向迪化挺进！§!"
 COX_March_Towards_North_China: "挺进华北"
 COX_March_Towards_North_China_desc: "在统一战线的竭力合作之中，在全国民众的盛怒之下，日本帝国为之自傲的陆军只得节节败退。现在，华北就在红军的面前。北平——这座蒙尘已久的北方古都，现在已经沦为了汉奸们盘踞的最后据点，他们还策划着阴谋，指望向日本主子出卖更多的权益，可以换取自身的存续。\n\n但日本的溃败已成定局，我们应抓紧时机，进军北平，将汉奸卖国贼的阴谋砸个粉碎！自由的中国万岁！"
 COX_March_Towards_Shanxi: "进军晋地"
 COX_March_Towards_Shanxi_desc: "全国的局势随着护国军起义的成功形成了连锁反应——日本徒劳的试图在华北维系他们所谓的“秩序”，却只带来了混乱。如今，侵略者与卖国贼在山西筑起了桥头堡，试图将我们阻隔在黄河对岸。但中国人民的决心将不可阻挡！\n\n风在吼，马在叫\n\n黄河在咆哮！"
 COX_meet_the_assault: "迎接冲击！"
 COX_meet_the_assault_desc: "你听到数百架飞机的轰鸣声了吗？\n你听到上百辆战车的隆隆声了吗？\n那就是他们来了，吃人的野兽来了。\n拿起武器！不做锤子，就做砧板！\n不做锤子，就做砧板！"
 COX_MEN_countdown: "来自草原的消息"
 COX_MEN_countdown_tt: "蒙人阵正蠢蠢欲动……"
