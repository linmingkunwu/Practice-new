 Hanhui_conflict: "难民冲突"
 Hanhui_conflict_desc: "二十年前的战争席卷了全国，给中原百姓带来了惨重的伤害。在战争末期日军疯狂的扫荡中，大量难民选择逃往西北——全中国为数不多尚未被战火彻底洗礼的土地。\n\n涌入的难民补充了西北稀缺的劳动力，挽救了青海之前因盘剥和战乱所导致的濒临崩溃的经济，与此同时，青海本来并不尖锐的民族矛盾因为难民的拥入而变得尖锐起来，但和传统认知不同，这种歧视主要是以本土少数民族和汉族，歧视外来人口为主。"
