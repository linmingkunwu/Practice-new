 Aksai_Chin_Issue_desc: "随着英国政府在第二次世界大战中的战败与流亡，失去宗主国保障的英属印度陷入了极大的混乱之中，新疆当局趁机夺回了被侵占已久的北阿克赛钦。但随着时间的推移，治理能力退化的省政府已经无力顾及此地，而新独立的印度共和国，显然对这块“白石滩”耿耿于怀。\n\n§Y时至今日，除非省政府能够重整旗鼓，或者另有势力取而代之重新治理，不然，新疆能否继续将这块战略意义重大的山中盆地握在手里，就要打上一个大大的问号了。§!"
