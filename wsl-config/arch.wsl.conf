# /etc/wsl.conf —— 只影响 Arch 这一个发行版
# 改完用 wsl --terminate Arch 重启即可，不需要 wsl --shutdown
# 全局资源与网络配置在 C:\Users\琳珉琨珸\.wslconfig

[boot]
systemd=true

[user]
default=linminkunwu

[automount]
enabled=true
options="metadata,umask=22,fmask=11"

[interop]
enabled=true
appendWindowsPath=false

[network]
generateResolvConf=true
hostname=arch
